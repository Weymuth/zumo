<?xml version="1.0" encoding="UTF-8"?>
<!-- CONTROL for svg_layout_audit. Panel under translate()+scale(); the text is
     180 absolute units INSIDE it. Correct verdict: NO overflow finding.
     Before v1.22 this was reported as a 286-unit overflow, because panels were
     read raw while text was measured through the CTM. Do not "tidy" this file. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img">
  <title>CONTROL — text inside a scaled panel</title>
  <desc>RoboLore instrument control fixture.</desc>
  <rect x="0" y="0" width="1000" height="500" fill="#F5F2E9"/>
  <g transform="translate(50.000 50.000) scale(2.000000)">
    <rect x="10" y="10" width="400" height="300" rx="8" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
    <text x="20" y="60" font-family="Courier New, monospace" font-size="15" textLength="300" fill="#0B1A2E">TEXT_WELL_INSIDE_THE_PANEL</text>
  </g>
</svg>
