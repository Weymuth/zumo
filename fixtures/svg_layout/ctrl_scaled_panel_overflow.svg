<?xml version="1.0" encoding="UTF-8"?>
<!-- CONTROL for svg_layout_audit. Same transform as its twin, but the panel is
     narrower and the text really does run 220 absolute units past it.
     Correct verdict: ONE overflow finding. This is the reverse direction: it
     proves the v1.22 CTM fix corrected the arm rather than silencing it. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img">
  <title>CONTROL — text overflowing a scaled panel</title>
  <desc>RoboLore instrument control fixture.</desc>
  <rect x="0" y="0" width="1400" height="500" fill="#F5F2E9"/>
  <g transform="translate(50.000 50.000) scale(2.000000)">
    <rect x="10" y="10" width="200" height="300" rx="8" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
    <text x="20" y="60" font-family="Courier New, monospace" font-size="15" textLength="300" fill="#0B1A2E">TEXT_THAT_REALLY_OVERFLOWS</text>
  </g>
</svg>
