<?xml version="1.0" encoding="UTF-8"?>
<!-- CONTROL for svg_layout_audit. A text-anchor="middle" transition label drawn in
     the GAP BETWEEN two state boxes, the shape every state-machine graphic uses.
     It belongs to neither panel and must produce NO finding.

     THE GEOMETRY IS COPIED FROM THE REAL CASE AND THE NUMBERS ARE LOAD-BEARING.
     Anchored at x=537 with textLength=396, the span is exactly 339..735 - so its
     LEFT EDGE lands one unit inside the box that ends at 340, which is precisely
     how L11-04's label sits. An S196 draft selected the container by that left edge
     instead of the anchor point and reported a phantom 401-unit overflow here.
     A first version of this fixture used a SHORTER label whose left edge fell in
     the gap; it passed under both predicates and therefore controlled nothing.
     Do not shorten the label or move x, textLength, or either rect. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" role="img">
  <title>CONTROL — transition label between two panels</title>
  <desc>RoboLore instrument control fixture.</desc>
  <rect x="0" y="0" width="1100" height="400" fill="#F5F2E9"/>
  <rect x="90" y="160" width="250" height="90" rx="8" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <rect x="735" y="160" width="270" height="90" rx="8" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="537" y="212" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" textLength="396" fill="#3D5266">gapStartCounts = averageCounts(); RE-ARM the odometer</text>
</svg>
