<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 620" font-family="Segoe UI, Tahoma, sans-serif">
  <defs>
    <!-- Gradient for boxes -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5276"/>
      <stop offset="100%" style="stop-color:#2e86ab"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#28a745"/>
      <stop offset="100%" style="stop-color:#5cb85c"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc3545"/>
      <stop offset="100%" style="stop-color:#f44336"/>
    </linearGradient>
    <!-- Drop shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
    <!-- Arrow markers -->
    <marker id="arrowBlack" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc3545"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="700" height="620" fill="#fafafa"/>
  
  <!-- Title -->
  <rect x="200" y="10" width="300" height="40" rx="8" fill="url(#redGrad)" filter="url(#shadow)"/>
  <text x="350" y="37" text-anchor="middle" fill="white" font-size="16" font-weight="bold">🔧 MOTOR DEBUG FLOWCHART</text>
  
  <!-- Question 1: Do motors spin at all? (y=70) -->
  <rect x="175" y="70" width="200" height="60" rx="10" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <text x="275" y="95" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Do motors spin</text>
  <text x="275" y="115" text-anchor="middle" fill="white" font-size="13" font-weight="bold">at all?</text>
  
  <!-- NO arrow and fixes for Q1 -->
  <path d="M 375 100 L 430 100" stroke="#dc3545" stroke-width="3" fill="none" marker-end="url(#arrowRed)"/>
  <rect x="440" y="70" width="230" height="60" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="88" fill="#856404" font-size="11" font-weight="bold">NO →</text>
  <text x="450" y="103" fill="#333" font-size="11">• Check power switch</text>
  <text x="450" y="118" fill="#333" font-size="11">• Check battery voltage</text>
  
  <!-- YES arrow down (130 to 160 = 30px) -->
  <path d="M 275 130 L 275 160" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowBlack)"/>
  <text x="290" y="150" fill="#333" font-size="11" font-weight="bold">YES</text>
  
  <!-- Question 2: Do BOTH motors spin? (y=170) -->
  <rect x="175" y="170" width="200" height="60" rx="10" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <text x="275" y="195" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Do BOTH motors</text>
  <text x="275" y="215" text-anchor="middle" fill="white" font-size="13" font-weight="bold">spin?</text>
  
  <!-- NO arrow and fixes for Q2 -->
  <path d="M 375 200 L 430 200" stroke="#dc3545" stroke-width="3" fill="none" marker-end="url(#arrowRed)"/>
  <rect x="440" y="160" width="230" height="70" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="178" fill="#856404" font-size="11" font-weight="bold">NO →</text>
  <text x="450" y="193" fill="#333" font-size="11">• One motor may be damaged</text>
  <text x="450" y="208" fill="#333" font-size="11">• Check wiring/connections</text>
  <text x="450" y="223" fill="#333" font-size="11">• Try swapping L/R in code</text>
  
  <!-- YES arrow down (230 to 260 = 30px) -->
  <path d="M 275 230 L 275 260" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowBlack)"/>
  <text x="290" y="250" fill="#333" font-size="11" font-weight="bold">YES</text>
  
  <!-- Question 3: Do they stop after test? (y=270) -->
  <rect x="175" y="270" width="200" height="60" rx="10" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <text x="275" y="295" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Do they stop</text>
  <text x="275" y="315" text-anchor="middle" fill="white" font-size="13" font-weight="bold">after test?</text>
  
  <!-- NO arrow and fixes for Q3 -->
  <path d="M 375 300 L 430 300" stroke="#dc3545" stroke-width="3" fill="none" marker-end="url(#arrowRed)"/>
  <rect x="440" y="255" width="230" height="80" rx="8" fill="#ffebee" stroke="#f44336" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="273" fill="#c62828" font-size="11" font-weight="bold">NO → ⚠️ DANGER</text>
  <text x="450" y="290" fill="#333" font-size="11">• Missing motors.setSpeeds(0,0)</text>
  <text x="450" y="305" fill="#333" font-size="11">• Check loop() isn't restarting</text>
  <text x="450" y="322" fill="#c62828" font-size="11" font-weight="bold">• KILL POWER if runaway!</text>
  
  <!-- YES arrow down (330 to 360 = 30px) -->
  <path d="M 275 330 L 275 360" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowBlack)"/>
  <text x="290" y="350" fill="#333" font-size="11" font-weight="bold">YES</text>
  
  <!-- Question 4: Does TRIM help? (y=370) -->
  <rect x="175" y="370" width="200" height="60" rx="10" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <text x="275" y="395" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Does TRIM help</text>
  <text x="275" y="415" text-anchor="middle" fill="white" font-size="13" font-weight="bold">straighten it?</text>
  
  <!-- NO arrow and fixes for Q4 -->
  <path d="M 375 400 L 430 400" stroke="#dc3545" stroke-width="3" fill="none" marker-end="url(#arrowRed)"/>
  <rect x="440" y="355" width="230" height="80" rx="8" fill="#fff3cd" stroke="#ffc107" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="373" fill="#856404" font-size="11" font-weight="bold">NO →</text>
  <text x="450" y="390" fill="#333" font-size="11">• TRIM too small? Try bigger</text>
  <text x="450" y="407" fill="#333" font-size="11">• Mechanical issue (debris)</text>
  <text x="450" y="424" fill="#333" font-size="11">• Test on different surface</text>
  
  <!-- YES arrow down (430 to 460 = 30px) -->
  <path d="M 275 430 L 275 460" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrowBlack)"/>
  <text x="290" y="450" fill="#333" font-size="11" font-weight="bold">YES</text>
  
  <!-- Success box (y=470) -->
  <rect x="175" y="470" width="200" height="50" rx="10" fill="url(#greenGrad)" filter="url(#shadow)"/>
  <text x="275" y="490" text-anchor="middle" fill="white" font-size="14" font-weight="bold">✅ SUCCESS!</text>
  <text x="275" y="508" text-anchor="middle" fill="white" font-size="12">Document your TRIM value</text>
  
  <!-- Legend -->
  <rect x="30" y="540" width="640" height="65" rx="8" fill="white" stroke="#ddd" stroke-width="1" filter="url(#shadow)"/>
  <text x="50" y="562" fill="#1a5276" font-size="12" font-weight="bold">LEGEND:</text>
  
  <rect x="50" y="575" width="20" height="12" rx="3" fill="url(#blueGrad)"/>
  <text x="78" y="585" fill="#333" font-size="11">Decision Point</text>
  
  <rect x="180" y="575" width="20" height="12" rx="3" fill="#fff3cd" stroke="#ffc107"/>
  <text x="208" y="585" fill="#333" font-size="11">Fix / Check</text>
  
  <rect x="300" y="575" width="20" height="12" rx="3" fill="#ffebee" stroke="#f44336"/>
  <text x="328" y="585" fill="#333" font-size="11">Danger!</text>
  
  <rect x="410" y="575" width="20" height="12" rx="3" fill="url(#greenGrad)"/>
  <text x="438" y="585" fill="#333" font-size="11">Success</text>
  
  <line x1="520" y1="581" x2="545" y2="581" stroke="#333" stroke-width="3"/>
  <text x="553" y="585" fill="#333" font-size="11">YES path</text>
  
  <line x1="610" y1="581" x2="635" y2="581" stroke="#dc3545" stroke-width="3"/>
  <text x="643" y="585" fill="#333" font-size="11">NO</text>
</svg>
