ngle.\nParameters:\n  degrees - Angle to turn (positive = right, negative = left)\nUses encoders for accurate turn control.\n*/\nvoid turnDegrees(float degrees);\n"}, "after_step_7": {"main.cpp": "#include \"RobotConfig.h\"\n#include \"RobotSensors.h\"\n#include \"RobotHelpers.h\"\n#include \"RobotMotion.h\"\n\nvoid setup() {\nwaitForStart();\n}\n\nvoid loop() {\ncheckBattery();\n}", "RobotConfig.h": "/*\n=====================================================\nROBOTCONFIG.H - Robot Calibration Settings\n=====================================================\nAll robot-specific values in ONE place!\nEdit this file to tune your robot's performance.\n=====================================================\n*/\n#pragma once\n\n// ===== PHYSICAL PROPERTIES =====\n// These values define your robot's hardware\n\n// Encoder counts per complete wheel rotation\n// (12 counts/motor rotation x 75.81 gear ratio = 909.7)\nconst float COUNTS_PER_ROTATION = 909.7;\n\n// Wheel diameter in millimeters (measure yours!)\nconst float WHEEL_DIAMETER_MM = 39.0;\n\n// Wheel circumference = pi x diameter\nconst float WHEEL_CIRCUMFERENCE_MM = 3.14159 * WHEEL_DIAMETER_MM;\n\n// Encoder counts per centimeter of travel\nconst float COUNTS_PER_CM = COUNTS_PER_ROTATION / (WHEEL_CIRCUMFERENCE_MM / 10.0);\n\n// ===== TURNING PROPERTIES =====\n// Distance between wheel centers - this is a CALIBRATION value!\n// Start at 85.0 (physical measurement), then tune up until 90 degree\n// turns are accurate. Typical tuned values: 98-115 depending on\n// surface and wheel wear.\nconst float WHEEL_BASE_MM = 85.0;\n\n// Circumference of the turn circle\nconst float TURN_CIRCUMFERENCE_MM = 3.14159 * WHEEL_BASE_MM;\n\n// Encoder counts per degree of rotation\nconst float COUNTS_PER_DEGREE = (TURN_CIRCUMFERENCE_MM / 360.0) *\n                                (COUNTS_PER_ROTATION / WHEEL_CIRCUMFERENCE_MM);\n\n// ===== SPEED SETTINGS =====\n// Adjust these to change robot behavior\nconst int DRIVE_SPEED = 150;   // Speed for straight driving (0-400)\nconst int TURN_SPEED = 150;    // Speed for turning (0-400)\n\n// ===== BATTERY THRESHOLDS =====\nconst int BATTERY_GOOD = 4800; // millivolts - fully charged\nconst int BATTERY_LOW = 4200;  // millivolts - charge soon\n", "RobotSensors.h": "/*\n=====================================================\nROBOTSENSORS.H - Hardware & Sensor Declarations\n=====================================================\nDeclares ALL hardware objects used across the project.\nThe actual objects are DEFINED in RobotSensors.cpp.\nThe keyword \"extern\" means: \"this object exists\nsomewhere else - let me use it here.\"\n=====================================================\n*/\n#pragma once\n#include <Zumo32U4.h>\n\n// ===== EXTERN HARDWARE DECLARATIONS =====\n// These tell other files \"these objects exist\"\n// The actual objects are created in RobotSensors.cpp\nextern Zumo32U4OLED display;\nextern Zumo32U4Buzzer buzzer;\nextern Zumo32U4Motors motors;\nextern Zumo32U4Encoders encoders;\nextern Zumo32U4ButtonA buttonA;\nextern Zumo32U4ButtonB buttonB;\nextern Zumo32U4ButtonC buttonC;\n", "RobotSensors.cpp": "/*\n=====================================================\nROBOTSENSORS.CPP - Hardware Definitions\n=====================================================\nThis file CREATES all hardware objects.\nThis is the ONLY file that creates them.\nOther files use #include \"RobotSensors.h\" to access them.\nIn later lessons, sensor functions will be added here.\n=====================================================\n*/\n#include <Zumo32U4.h>\n#include \"RobotSensors.h\"\n\n// ===== HARDWARE OBJECT DEFINITIONS =====\n// These are the REAL objects - created exactly ONCE\nZumo32U4OLED display;\nZumo32U4Buzzer buzzer;\nZumo32U4Motors motors;\nZumo32U4Encoders encoders;\nZumo32U4ButtonA buttonA;\nZumo32U4ButtonB buttonB;\nZumo32U4ButtonC buttonC;\n", "RobotHelpers.h": "/*\n=====================================================\nROBOTHELPERS.H - Standard Helper Declarations\n=====================================================\nThe two helpers that have shipped with every project\nsince Lesson 4. The code is in RobotHelpers.cpp -\nthese lines just promise it exists.\n=====================================================\n*/\n#pragma once\n\n// ===== HELPER DECLARATIONS =====\nvoid waitForStart();\nvoid checkBattery();\n", "RobotHelpers.cpp": "/*\n=====================================================\nROBOTHELPERS.CPP - Standard Helper Implementations\n=====================================================\nSame code you have used since Lesson 4 - it just\nlives in its own module now. Needs the hardware,\nso it includes RobotSensors.h.\n=====================================================\n*/\n#include <Zumo32U4.h>\n#include \"RobotSensors.h\"\n#include \"RobotHelpers.h\"\n\n// ----- STANDARD HELPERS (added after Lesson 3) -----\n\n/*\nwaitForStart()\n--------------\nSAFETY GATE: nothing moves until Button A is pressed.\nCall it at the END of setup(), always.\n*/\nvoid waitForStart() {\n  display.clear();\n  display.print(F(\"Press A\"));\n  display.gotoXY(0, 1);\n  display.print(F(\"to start\"));\n  buttonA.waitForButton();\n  display.clear();\n  delay(500);  // time to get your hands clear\n}\n\n/*\ncheckBattery()\n--------------\nHold A + B together at any time to see the battery.\nCall it at the TOP of the polling loop.\n*/\nvoid checkBattery() {\n  if (buttonA.isPressed() && buttonB.isPressed()) {\n    display.clear();\n    display.print(F(\"Battery\"));\n    display.gotoXY(0, 1);\n    int mv = readBatteryMillivolts();\n    display.print(mv);\n    display.print(F(\" mV\"));\n    while (buttonA.isPressed() || buttonB.isPressed()) {\n      // wait for release\n    }\n    delay(200);\n    display.clear();\n  }\n}\n", "RobotMotion.h": "/*\n=====================================================\nROBOTMOTION.H - Movement Function Declarations\n=====================================================\nThis file DECLARES the movement functions.\nThe actual code (implementation) is in RobotMotion.cpp\n=====================================================\n*/\n#pragma once\n\n// ===== FUNCTION DECLARATIONS =====\n// These tell the compiler \"these functions exist\"\n// The actual code is in RobotMotion.cpp\n\n/*\ndriveDistance()\n----------------\nDrives the robot a specific distance.\nParameters:\n  centimeters - Distance to travel (positive = forward)\nUses encoders for accurate distance control.\n*/\nvoid driveDistance(float centimeters);\n\n/*\nturnDegrees()\n--------------\nTurns the robot a specific angle.\nParameters:\n  degrees - Angle to turn (positive = right, negative = left)\nUses encoders for accurate turn control.\n*/\nvoid turnDegrees(float degrees);\n", "RobotMotion.cpp": "/*\n=====================================================\nROBOTMOTION.CPP - Movement Function Implementations\n=====================================================\nThis file IMPLEMENTS the movement functions\ndeclared in RobotMotion.h\n=====================================================\n*/\n#include <Zumo32U4.h>\n#include \"RobotConfig.h\"\n#include \"RobotSensors.h\"\n#include \"RobotMotion.h\"\n\n// ===== FUNCTION IMPLEMENTATIONS =====\n\nvoid driveDistance(float centimeters) {\n  // Reset encoders to start counting from zero\n  encoders.getCountsAndResetLeft();\n  encoders.getCountsAndResetRight();\n  // Calculate how many encoder counts we need\n  int targetCounts = abs(centimeters) * COUNTS_PER_CM;\n  // Set motor direction based on positive/negative distance\n  int speed = (centimeters > 0) ? DRIVE_SPEED : -DRIVE_SPEED;\n  // Start driving\n  motors.setSpeeds(speed, speed);\n  // Keep driving until we reach the target\n  while (abs(encoders.getCountsLeft()) < targetCounts) {\n    delay(10); // Small delay to prevent hogging the CPU\n  }\n  // Stop!\n  motors.setSpeeds(0, 0);\n}\n\nvoid turnDegrees(float degrees) {\n  // Reset encoders\n  encoders.getCountsAndResetLeft();\n  encoders.getCountsAndResetRight();\n  // Calculate target counts for the turn\n  int targetCounts = abs(degrees) * COUNTS_PER_DEGREE;\n  // Set wheel directions for turning\n  // Positive degrees = turn right (left wheel forward, right wheel backward)\n  int leftSpeed = (degrees > 0) ? TURN_SPEED : -TURN_SPEED;\n  int rightSpeed = -leftSpeed; // Opposite direction\n  // Start turning\n  motors.setSpeeds(leftSpeed, rightSpeed);\n  // Keep turning until we reach the target\n  while (abs(encoders.getCountsLeft()) < targetCounts) {\n    delay(10);\n  }\n  // Stop!\n  motors.setSpeeds(0, 0);\n}\n"}, "finished": {"main.cpp": "#include \"RobotConfig.h\"\n#include \"RobotSensors.h\"\n#include \"RobotHelpers.h\"\n#include \"RobotMotion.h\"\n\n// ===== SETUP =====\nvoid setup() {\n  Serial.begin(115200);\n  unsigned long serialStart = millis();\n  while (!Serial && (millis() - serialStart < 2000)) {\n    delay(10); // Wait up to 2s for USB serial connection\n  }\n  delay(500);\n  Serial.println(F(\"=== Lesson 7: Code Organization ===\"));\n\n  // ===== BATTERY REPORT =====\n  int batteryVoltage = readBatteryMillivolts();\n  int battWhole = batteryVoltage / 1000;\n  int battDecimal = (batteryVoltage / 10) % 100;\n  Serial.print(F(\"Battery: \"));\n  Serial.print(battWhole);\n  Serial.print(F(\".\"));\n  if (battDecimal < 10) Serial.print(F(\"0\"));\n  Serial.print(battDecimal);\n  Serial.print(F(\"V (\"));\n  Serial.print(batteryVoltage);\n  Serial.println(F(\"mV)\"));\n\n  display.clear();\n  display.setLayout21x8();\n  display.print(F(\"===== Lesson 7 =====\"));\n  display.gotoXY(0, 2);\n  display.print(F(\"Battery: \"));\n  display.print(battWhole);\n  display.print(F(\".\"));\n  if (battDecimal < 10) display.print(F(\"0\"));\n  display.print(battDecimal);\n  display.print(F(\"V\"));\n  display.gotoXY(0, 4);\n  display.print(F(\"Status: \"));\n  if (batteryVoltage >= BATTERY_GOOD) {\n    display.print(F(\"GOOD\"));\n    ledGreen(1);\n  } else if (batteryVoltage >= BATTERY_LOW) {\n    display.print(F(\"LOW\"));\n    ledYellow(1);\n    buzzer.playNote(NOTE_A(4), 200, 15);\n  } else {\n    display.print(F(\"CHARGE!\"));\n    ledRed(1);\n    buzzer.playNote(NOTE_A(3), 500, 15);\n  }\n  display.gotoXY(0, 6);\n  display.print(F(\"Cts/cm: \"));\n  display.print(COUNTS_PER_CM, 1);\n  display.gotoXY(0, 7);\n  display.print(F(\"Cts/deg: \"));\n  display.print(COUNTS_PER_DEGREE, 2);\n  delay(2500);\n  ledGreen(0);\n  ledYellow(0);\n  ledRed(0);\n\n  waitForStart();\n}\n\n// ===== MAIN LOOP - TUNING MODE =====\n// A = test forward 10cm  (tune WHEEL_DIAMETER_MM)\n// B = test turn 90 deg   (tune WHEEL_BASE_MM)\n// C = full square with countdown (verify both)\nvoid loop() {\n  display.clear();\n  display.print(F(\"=== TUNING MODE ===\"));\n  display.gotoXY(0, 2);\n  display.print(F(\"A = Forward 10cm\"));\n  display.gotoXY(0, 3);\n  display.print(F(\"B = Turn 90 deg\"));\n  display.gotoXY(0, 4);\n  display.print(F(\"C = Full square\"));\n  while (true) {\n    checkBattery();\n    if (buttonA.getSingleDebouncedPress()) {\n      display.clear();\n      display.print(F(\"Forward 10cm...\"));\n      delay(500);\n      driveDistance(10);\n      display.clear();\n      display.print(F(\"Done! A/B/C?\"));\n    }\n    if (buttonB.getSingleDebouncedPress()) {\n      display.clear();\n      display.print(F(\"Turn 90 deg...\"));\n      delay(500);\n      turnDegrees(90);\n      display.clear();\n      display.print(F(\"Done! A/B/C?\"));\n    }\n    if (buttonC.getSingleDebouncedPress()) {\n      for (int count = 3; count > 0; count--) {\n        display.clear();\n        display.print(count);\n        buzzer.playNote(NOTE_C(5), 150, 15);\n        delay(1000);\n      }\n      display.clear();\n      display.print(F(\"GO!\"));\n      buzzer.playNote(NOTE_C(6), 300, 15);\n      delay(500);\n      for (int i = 0; i < 4; i++) {\n        display.clear();\n        display.print(F(\"Side \"));\n        display.print(i + 1);\n        display.print(F(\" of 4\"));\n        delay(500);\n        driveDistance(10);\n        delay(750);\n        turnDegrees(90);\n        delay(750);\n      }\n      display.clear();\n      display.print(F(\"Square done!\"));\n      display.gotoXY(0, 2);\n      display.print(F(\"A/B/C?\"));\n    }\n    delay(10);\n  }\n}", "RobotConfig.h": "/*\n=====================================================\nROBOTCONFIG.H - Robot Calibration Settings\n=====================================================\nAll robot-specific values in ONE place!\nEdit this file to tune your robot's performance.\n=====================================================\n*/\n#pragma once\n\n// ===== PHYSICAL PROPERTIES =====\n// These values define your robot's hardware\n\n// Encoder counts per complete wheel rotation\n// (12 counts/motor rotation x 75.81 gear ratio = 909.7)\nconst float COUNTS_PER_ROTATION = 909.7;\n\n// Wheel diameter in millimeters (measure yours!)\nconst float WHEEL_DIAMETER_MM = 39.0;\n\n// Wheel circumference = pi x diameter\nconst float WHEEL_CIRCUMFERENCE_MM = 3.14159 * WHEEL_DIAMETER_MM;\n\n// Encoder counts per centimeter of travel\nconst float COUNTS_PER_CM = COUNTS_PER_ROTATION / (WHEEL_CIRCUMFERENCE_MM / 10.0);\n\n// ===== TURNING PROPERTIES =====\n// Distance between wheel centers - this is a CALIBRATION value!\n// Start at 85.0 (physical measurement), then tune up until 90 degree\n// turns are accurate. Typical tuned values: 98-115 depending on\n// surface and wheel wear.\nconst float WHEEL_BASE_MM = 85.0;\n\n// Circumference of the turn circle\nconst float TURN_CIRCUMFERENCE_MM = 3.14159 * WHEEL_BASE_MM;\n\n// Encoder counts per degree of rotation\nconst float COUNTS_PER_DEGREE = (TURN_CIRCUMFERENCE_MM / 360.0) *\n                                (COUNTS_PER_ROTATION / WHEEL_CIRCUMFERENCE_MM);\n\n// ===== SPEED SETTINGS =====\n// Adjust these to change robot behavior\nconst int DRIVE_SPEED = 150;   // Speed for straight driving (0-400)\nconst int TURN_SPEED = 150;    // Speed for turning (0-400)\n\n// ===== BATTERY THRESHOLDS =====\nconst int BATTERY_GOOD = 4800; // millivolts - fully charged\nconst int BATTERY_LOW = 4200;  // millivolts - charge soon\n", "RobotSensors.h": "/*\n=====================================================\nROBOTSENSORS.H - Hardware & Sensor Declarations\n=====================================================\nDeclares ALL hardware objects used across the project.\nThe actual objects are DEFINED in RobotSensors.cpp.\nThe keyword \"extern\" means: \"this object exists\nsomewhere else - let me use it here.\"\n=====================================================\n*/\n#pragma once\n#include <Zumo32U4.h>\n\n// ===== EXTERN HARDWARE DECLARATIONS =====\n// These tell other files \"these objects exist\"\n// The actual objects are created in RobotSensors.cpp\nextern Zumo32U4OLED display;\nextern Zumo32U4Buzzer buzzer;\nextern Zumo32U4Motors motors;\nextern Zumo32U4Encoders encoders;\nextern Zumo32U4ButtonA buttonA;\nextern Zumo32U4ButtonB buttonB;\nextern Zumo32U4ButtonC buttonC;\n", "RobotSensors.cpp": "/*\n=====================================================\nROBOTSENSORS.CPP - Hardware Definitions\n=====================================================\nThis file CREATES all hardware objects.\nThis is the ONLY file that creates them.\nOther files use #include \"RobotSensors.h\" to access them.\nIn later lessons, sensor functions will be added here.\n=====================================================\n*/\n#include <Zumo32U4.h>\n#include \"RobotSensors.h\"\n\n// ===== HARDWARE OBJECT DEFINITIONS =====\n// These are the REAL objects - created exactly ONCE\nZumo32U4OLED display;\nZumo32U4Buzzer buzzer;\nZumo32U4Motors motors;\nZumo32U4Encoders encoders;\nZumo32U4ButtonA buttonA;\nZumo32U4ButtonB buttonB;\nZumo32U4ButtonC buttonC;\n", "RobotHelpers.h": "/*\n=====================================================\nROBOTHELPERS.H - Standard Helper Declarations\n=====================================================\nThe two helpers that have shipped with every project\nsince Lesson 4. The code is in RobotHelpers.cpp -\nthese lines just promise it exists.\n=====================================================\n*/\n#pragma once\n\n// ===== HELPER DECLARATIONS =====\nvoid waitForStart();\nvoid checkBattery();\n", "RobotHelpers.cpp": "/*\n=====================================================\nROBOTHELPERS.CPP - Standard Helper Implementations\n=====================================================\nSame code you have used since Lesson 4 - it just\nlives in its own module now. Needs the hardware,\nso it includes RobotSensors.h.\n=====================================================\n*/\n#include <Zumo32U4.h>\n#include \"RobotSensors.h\"\n#include \"RobotHelpers.h\"\n\n// ----- STANDARD HELPERS (added after Lesson 3) -----\n\n/*\nwaitForStart()\n--------------\nSAFETY GATE: nothing moves until Button A is pressed.\nCall it at the END of setup(), always.\n*/\nvoid waitForStart() {\n  display.clear();\n  display.print(F(\"Press A\"));\n  display.gotoXY(0, 1);\n  display.print(F(\"to start\"));\n  buttonA.waitForButton();\n  display.clear();\n  delay(500);  // time to get your hands clear\n}\n\n/*\ncheckBattery()\n--------------\nHold A + B together at any time to see the battery.\nCall it at the TOP of the polling loop.\n*/\nvoid checkBattery() {\n  if (buttonA.isPressed() && buttonB.isPressed()) {\n    display.clear();\n    display.print(F(\"Battery\"));\n    display.gotoXY(0, 1);\n    int mv = readBatteryMillivolts();\n    display.print(mv);\n    display.print(F(\" mV\"));\n    while (buttonA.isPressed() || buttonB.isPressed()) {\n      // wait for release\n    }\n    delay(200);\n    display.clear();\n  }\n}\n", "RobotMotion.h": "/*\n=====================================================\nROBOTMOTION.H - Movement Function Declarations\n=====================================================\nThis file DECLARES the movement functions.\nThe actual code (implementation) is in RobotMotion.cpp\n=====================================================\n*/\n#pragma once\n\n// ===== FUNCTION DECLARATIONS =====\n// These tell the compiler \"these functions exist\"\n// The actual code is in RobotMotion.cpp\n\n/*\ndriveDistance()\n----------------\nDrives the robot a specific distance.\nParameters:\n  centimeters - Distance to travel (positive = forward)\nUses encoders for accurate distance control.\n*/\nvoid driveDistance(float centimeters);\n\n/*\nturnDegrees()\n--------------\nTurns the robot a specific angle.\nParameters:\n  degrees - Angle to turn (positive = right, negative = left)\nUses encoders for accurate turn control.\n*/\nvoid turnDegrees(float degrees);\n", "RobotMotion.cpp": "/*\n=====================================================\nROBOTMOTION.CPP - Movement Function Implementations\n=====================================================\nThis file IMPLEMENTS the movement functions\ndeclared in RobotMotion.h\n=====================================================\n*/\n#include <Zumo32U4.h>\n#include \"RobotConfig.h\"\n#include \"RobotSensors.h\"\n#include \"RobotMotion.h\"\n\n// ===== FUNCTION IMPLEMENTATIONS =====\n\nvoid driveDistance(float centimeters) {\n  // Reset encoders to start counting from zero\n  encoders.getCountsAndResetLeft();\n  encoders.getCountsAndResetRight();\n  // Calculate how many encoder counts we need\n  int targetCounts = abs(centimeters) * COUNTS_PER_CM;\n  // Set motor direction based on positive/negative distance\n  int speed = (centimeters > 0) ? DRIVE_SPEED : -DRIVE_SPEED;\n  // Start driving\n  motors.setSpeeds(speed, speed);\n  // Keep driving until we reach the target\n  while (abs(encoders.getCountsLeft()) < targetCounts) {\n    delay(10); // Small delay to prevent hogging the CPU\n  }\n  // Stop!\n  motors.setSpeeds(0, 0);\n}\n\nvoid turnDegrees(float degrees) {\n  // Reset encoders\n  encoders.getCountsAndResetLeft();\n  encoders.getCountsAndResetRight();\n  // Calculate target counts for the turn\n  int targetCounts = abs(degrees) * COUNTS_PER_DEGREE;\n  // Set wheel directions for turning\n  // Positive degrees = turn right (left wheel forward, right wheel backward)\n  int leftSpeed = (degrees > 0) ? TURN_SPEED : -TURN_SPEED;\n  int rightSpeed = -leftSpeed; // Opposite direction\n  // Start turning\n  motors.setSpeeds(leftSpeed, rightSpeed);\n  // Keep turning until we reach the target\n  while (abs(encoders.getCountsLeft()) < targetCounts) {\n    delay(10);\n  }\n  // Stop!\n  motors.setSpeeds(0, 0);\n}\n"}, "capstone": {"main.cpp": "#include \"RobotConfig.h\"\n#include \"RobotSensors.h\"\n#include \"RobotMotion.h\"\nvoid setup() {\nshowMessage(\"Square Demo\", \"Press A\");\nbuttonA.waitForButton();\ndelay(500);\n}\nvoid loop() {\nfor (int i = 0; i < 4; i++) {\nshowMessage(\"Side\", \"driving...\");\ndriveDistance(25);\ndelay(300);\nshowMessage(\"Turning\", \"right...\");\nturnRight(90);\ndelay(300);\n}\nshowMessage(\"Square\", \"Complete!\");\nwhile(true) { }\n}", "RobotConfig.h": "/*\n=====================================================\nROBOTCONFIG.H - Robot Calibration Settings\n=====================================================\nAll robot-specific values in ONE place!\nEdit this file to tune your robot's performance.\n=====================================================\n*/\n#pragma once\n\n// ===== PHYSICAL PROPERTIES =====\n// These values define your robot's hardware\n\n// Encoder counts per complete wheel rotation\n// (12 counts/motor rotation x 75.81 gear ratio = 909.7)\nconst float COUNTS_PER_ROTATION = 909.7;\n\n// Wheel diameter in millimeters (measure yours!)\nconst float WHEEL_DIAMETER_MM = 39.0;\n\n// Wheel circumference = pi x diameter\nconst float WHEEL_CIRCUMFERENCE_MM = 3.14159 * WHEEL_DIAMETER_MM;\n\n// Encoder counts per centimeter of travel\nconst float COUNTS_PER_CM = COUNTS_PER_ROTATION / (WHEEL_CIRCUMFERENCE_MM / 10.0);\n\n// ===== TURNING PROPERTIES =====\n// Distance between wheel centers - this is a CALIBRATION value!\n// Start at 85.0 (physical measurement), then tune up until 90 degree\n// turns are accurate. Typical tuned values: 98-115 depending on\n// surface and wheel wear.\nconst float WHEEL_BASE_MM = 85.0;\n\n// Circumference of the turn circle\nconst float TURN_CIRCUMFERENCE_MM = 3.14159 * WHEEL_BASE_MM;\n\n// Encoder counts per degree of rotation\nconst float COUNTS_PER_DEGREE = (TURN_CIRCUMFERENCE_MM / 360.0) *\n                                (COUNTS_PER_ROTATION / WHEEL_CIRCUMFERENCE_MM);\n\n// ===== SPEED SETTINGS =====\n// Adjust these to change robot behavior\nconst int DRIVE_SPEED = 150;   // Speed for straight driving (0-400)\nconst int TURN_SPEED = 150;    // Speed for turning (0-400)\n\n// ===== BATTERY THRESHOLDS =====\nconst int BATTERY_GOOD = 4800; // millivolts - fully charged\nconst int BATTERY_LOW = 4200;  // millivolts - charge soon\n", "RobotSensors.h": "/*\n=====================================================\nROBOTSENSORS.H - Hardware & Sensor Declarations\n=====================================================\nDeclares ALL hardware objects used across the project.\nThe actual objects are DEFINED in RobotSensors.cpp.\nThe keyword \"extern\" means: \"this object exists\nsomewhere else - let me use it here.\"\n=====================================================\n*/\n#pragma once\n#include <Zumo32U4.h>\n\n// ===== EXTERN HARDWARE DECLARATIONS =====\n// These tell other files \"these objects exist\"\n// The actual objects are created in RobotSensors.cpp\nextern Zumo32U4OLED display;\nextern Zumo32U4Buzzer buzzer;\nextern Zumo32U4Motors motors;\nextern Zumo32U4Encoders encoders;\nextern Zumo32U4ButtonA buttonA;\nextern Zumo32U4ButtonB buttonB;\nextern Zumo32U4ButtonC buttonC;\n\n// ===== DISPLAY HELPER DECLARATIONS =====\nvoid initDisplay();\nvoid showMessage(const char* line1, const char* line2);\n", "RobotSensors.cpp": "/*\n=====================================================\nROBOTSENSORS.CPP - Hardware Definitions\n=====================================================\nThis file CREATES all hardware objects.\nThis is the ONLY file that creates them.\nOther files use #include \"RobotSensors.h\" to access them.\nIn later lessons, sensor functions will be added here.\n=====================================================\n*/\n#include <Zumo32U4.h>\n#include \"RobotSensors.h\"\n\n// ===== HARDWARE OBJECT DEFINITIONS =====\n// These are the REAL objects - created exactly ONCE\nZumo32U4OLED display;\nZumo32U4Buzzer buzzer;\nZumo32U4Motors motors;\nZumo32U4Encoders encoders;\nZumo32U4ButtonA buttonA;\nZumo32U4ButtonB buttonB;\nZumo32U4ButtonC buttonC;\n\n// ===== DISPLAY HELPERS =====\nvoid initDisplay() {\ndisplay.setLayout21x8();\n}\nvoid showMessage(const char* line1, const char* line2) {\ndisplay.clear();\ndisplay.print(line1);\ndisplay.gotoXY(0, 2);\ndisplay.print(line2);\n}\n", "RobotHelpers.h": "/*\n=====================================================\nROBOTHELPERS.H - Standard Helper Declarations\n=====================================================\nThe two helpers that have shipped with every project\nsince Lesson 4. The code is in RobotHelpers.cpp -\nthese lines just promise it exists.\n=====================================================\n*/\n#pragma once\n\n// ===== HELPER DECLARATIONS =====\nvoid waitForStart();\nvoid checkBattery();\n", "RobotHelpers.cpp": "/*\n=====================================================\nROBOTHELPERS.CPP - Standard Helper Implementations\n=====================================================\nSame code you have used since Lesson 4 - it just\nlives in its own module now. Needs the hardware,\nso it includes RobotSensors.h.\n=====================================================\n*/\n#include <Zumo32U4.h>\n#include \"RobotSensors.h\"\n#include \"RobotHelpers.h\"\n\n// ----- STANDARD HELPERS (added after Lesson 3) -----\n\n/*\nwaitForStart()\n--------------\nSAFETY GATE: nothing moves until Button A is pressed.\nCall it at the END of setup(), always.\n*/\nvoid waitForStart() {\n  display.clear();\n  display.print(F(\"Press A\"));\n  display.gotoXY(0, 1);\n  display.print(F(\"to start\"));\n  buttonA.waitForButton();\n  display.clear();\n  delay(500);  // time to get your hands clear\n}\n\n/*\ncheckBattery()\n--------------\nHold A + B together at any time to see the battery.\nCall it at the TOP of the polling loop.\n*/\nvoid checkBattery() {\n  if (buttonA.isPressed() && buttonB.isPressed()) {\n    display.clear();\n    display.print(F(\"Battery\"));\n    display.gotoXY(0, 1);\n    int mv = readBatteryMillivolts();\n    display.print(mv);\n    display.print(F(\" mV\"));\n    while (buttonA.isPressed() || buttonB.isPressed()) {\n      // wait for release\n    }\n    delay(200);\n    display.clear();\n  }\n}\n", "RobotMotion.h": "/*\n=====================================================\nROBOTMOTION.H - Movement Function Declarations\n=====================================================\nThis file DECLARES the movement functions.\nThe actual code (implementation) is in RobotMotion.cpp\n=====================================================\n*/\n#pragma once\n\n// ===== FUNCTION DECLARATIONS =====\n// These tell the compiler \"these functions exist\"\n// The actual code is in RobotMotion.cpp\n\n/*\ndriveDistance()\n----------------\nDrives the robot a specific distance.\nParameters:\n  centimeters - Distance to travel (positive = forward)\nUses encoders for accurate distance control.\n*/\nvoid driveDistance(float centimeters);\n\n/*\nturnDegrees()\n--------------\nTurns the robot a specific angle.\nParameters:\n  degrees - Angle to turn (positive = right, negative = left)\nUses encoders for accurate turn control.\n*/\nvoid turnDegrees(float degrees);\n\nvoid turnRight(float degrees);\nvoid turnLeft(float degrees);\n", "RobotMotion.cpp": "/*\n=====================================================\nROBOTMOTION.CPP - Movement Function Implementations\n=====================================================\nThis file IMPLEMENTS the movement functions\ndeclared in RobotMotion.h\n=====================================================\n*/\n#include <Zumo32U4.h>\n#include \"RobotConfig.h\"\n#include \"RobotSensors.h\"\n#include \"RobotMotion.h\"\n\n// ===== FUNCTION IMPLEMENTATIONS =====\n\nvoid driveDistance(float centimeters) {\n  // Reset encoders to start counting from zero\n  encoders.getCountsAndResetLeft();\n  encoders.getCountsAndResetRight();\n  // Calculate how many encoder counts we need\n  int targetCounts = abs(centimeters) * COUNTS_PER_CM;\n  // Set motor direction based on positive/negative distance\n  int speed = (centimeters > 0) ? DRIVE_SPEED : -DRIVE_SPEED;\n  // Start driving\n  motors.setSpeeds(speed, speed);\n  // Keep driving until we reach the target\n  while (abs(encoders.getCountsLeft()) < targetCounts) {\n    delay(10); // Small delay to prevent hogging the CPU\n  }\n  // Stop!\n  motors.setSpeeds(0, 0);\n}\n\nvoid turnDegrees(float degrees) {\n  // Reset encoders\n  encoders.getCountsAndResetLeft();\n  encoders.getCountsAndResetRight();\n  // Calculate target counts for the turn\n  int targetCounts = abs(degrees) * COUNTS_PER_DEGREE;\n  // Set wheel directions for turning\n  // Positive degrees = turn right (left wheel forward, right wheel backward)\n  int leftSpeed = (degrees > 0) ? TURN_SPEED : -TURN_SPEED;\n  int rightSpeed = -leftSpeed; // Opposite direction\n  // Start turning\n  motors.setSpeeds(leftSpeed, rightSpeed);\n  // Keep turning until we reach the target\n  while (abs(encoders.getCountsLeft()) < targetCounts) {\n    delay(10);\n  }\n  // Stop!\n  motors.setSpeeds(0, 0);\n}\n\nvoid turnRight(float degrees) {\nturnDegrees(degrees); // Positive = right\n}\nvoid turnLeft(float degrees) {\nturnDegrees(-degrees); // Negative = left\n}\n"}},

 GLOBAL VARIABLES =====\nunsigned int lineSensorValues[NUM_SENSORS];   // one slot per active sensor\n\nvoid setup() {\n  Serial.begin(115200);\n  lineSensors.initThreeSensors();   // wake sensors 1, 3, 5\n  calibrateSensors();\n  waitForStart();\n}\n\nvoid loop() {\n  checkBattery();\n  lineSensors.readCalibrated(lineSensorValues);\n  showReadings();\n  delay(DISPLAY_INTERVAL_MS);\n}\n\n// ===== HELPER FUNCTIONS =====\n\n/*\ncalibrateSensors()\n------------------\nShows each sensor its personal brightest and darkest.\nSlide the robot side to side across the line until the\ncountdown ends. Every window must cross the tape.\n*/\nvoid calibrateSensors() {\n  display.clear();\n  display.print(F(\"Sweep!\"));\n  unsigned long startTime = millis();\n  while (millis() - startTime < CAL_TIME_MS) {\n    lineSensors.calibrate();\n    display.gotoXY(0, 1);\n    display.print((CAL_TIME_MS - (millis() - startTime)) / 1000 + 1);\n    display.print(F(\" sec \"));\n  }\n  display.clear();\n  display.print(F(\"Cal done\"));\n  delay(750);\n  display.clear();\n}\n\n/*\nshowReadings()\n--------------\nOLED: three calibrated values squeezed to 0-99 (value / 10).\nSerial Monitor: the full 0-1000 values, tab-separated.\n*/\nvoid showReadings() {\n  display.gotoXY(0, 0);\n  for (uint8_t i = 0; i < NUM_SENSORS; i++) {\n    unsigned int scaled = lineSensorValues[i] / 10;\n    if (scaled > 99) scaled = 99;\n    if (scaled < 10) display.print('0');\n    display.print(scaled);\n    if (i < NUM_SENSORS - 1) display.print(' ');\n  }\n  for (uint8_t i = 0; i < NUM_SENSORS; i++) {\n    Serial.print(lineSensorValues[i]);\n    Serial.print('\\t');\n  }\n  Serial.println();\n}\n\n// ----- STANDARD HELPERS (added after Lesson 3) -----\n\n/*\nwaitForStart()\n--------------\nSAFETY GATE: nothing moves until Button A is pressed.\nCall it at the END of setup(), always.\n*/\nvoid waitForStart() {\n  display.clear();\n  display.print(F(\"Press A\"));\n  display.gotoXY(0, 1);\n  display.print(F(\"to start\"));\n  buttonA.waitForButton();\n  display.clear();\n  delay(500);  // time to get your hands clear\n}\n\n/*\ncheckBattery()\n--------------\nHold A + B together at any time to see the battery.\nCall it at the TOP of loop().\n*/\nvoid checkBattery() {\n  if (buttonA.isPressed() && buttonB.isPressed()) {\n    display.clear();\n    display.print(F(\"Battery\"));\n    display.gotoXY(0, 1);\n    int mv = readBatteryMillivolts();\n    display.print(mv);\n    display.print(F(\" mV\"));\n    while (buttonA.isPressed() || buttonB.isPressed()) {\n      // wait for release\n    }\n    delay(200);\n    display.clear();\n  }\n}\n", "act_two": "// ===== HARDWARE OBJECTS =====\nZumo32U4ButtonA buttonA;\nZumo32U4ButtonB buttonB;\nZumo32U4OLED display;\nZumo32U4LineSensors lineSensors;\n\n// ===== CONSTANTS =====\nconst uint8_t NUM_SENSORS = 5;                // Act Two: all five sensors\nconst unsigned int CAL_TIME_MS = 5000;        // calibration sweep window\nconst unsigned int DISPLAY_INTERVAL_MS = 100; // refresh rate for readings\n\n// ===== FUNCTION PROTOTYPES =====\nvoid calibrateSensors();\nvoid showReadings(int position);\nvoid waitForStart();\nvoid checkBattery();\n\n// ===== GLOBAL VARIABLES =====\nunsigned int lineSensorValues[NUM_SENSORS];   // one slot per active sensor\n\nvoid setup() {\n  Serial.begin(115200);\n  lineSensors.initFiveSensors();    // requires jumpers on DN2 / DN4!\n  calibrateSensors();\n  waitForStart();\n}\n\nvoid loop() {\n  checkBattery();\n  int position = lineSensors.readLine(lineSensorValues);\n  showReadings(position);\n  delay(DISPLAY_INTERVAL_MS);\n}\n\n// ===== HELPER FUNCTIONS =====\n\n/*\ncalibrateSensors()\n------------------\nShows each sensor its personal brightest and darkest.\nSlide the robot side to side across the line until the\ncountdown ends. Every window must cross the tape.\n*/\nvoid calibrateSensors() {\n  display.clear();\n  display.print(F(\"Sweep!\"));\n  unsigned long startTime = millis();\n  while (millis() - startTime < CAL_TIME_MS) {\n    lineSensors.calibrate();\n    display.gotoXY(0, 1);\n    display.print((CAL_TIME_MS - (millis() - startTime)) / 1000 + 1);\n    display.print(F(\" sec \"));\n  }\n  display.clear();\n  display.print(F(\"Cal done\"));\n  delay(750);\n  display.clear();\n}\n\n/*\nshowReadings(position)\n----------------------\nOLED row 0: five calibrated values squeezed to one digit each (0-9).\nOLED row 1: the line position, 0-4000 (2000 = dead center).\nSerial Monitor: full values plus the position.\n*/\nvoid showReadings(int position) {\n  display.gotoXY(0, 0);\n  for (uint8_t i = 0; i < NUM_SENSORS; i++) {\n    display.print(lineSensorValues[i] / 101);   // 0-1000 -> single digit 0-9\n  }\n  display.gotoXY(0, 1);\n  display.print(F(\"P:\"));\n  display.print(position);\n  display.print(F(\"   \"));   // wipe leftover digits\n  for (uint8_t i = 0; i < NUM_SENSORS; i++) {\n    Serial.print(lineSensorValues[i]);\n    Serial.print('\\t');\n  }\n  Serial.print(F(\"pos=\"));\n  Serial.println(position);\n}\n\n// ----- STANDARD HELPERS (added after Lesson 3) -----\n\n/*\nwaitForStart()\n--------------\nSAFETY GATE: nothing moves until Button A is pressed.\nCall it at the END of setup(), always.\n*/\nvoid waitForStart() {\n  display.clear();\n  display.print(F(\"Press A\"));\n  display.gotoXY(0, 1);\n  display.print(F(\"to start\"));\n  buttonA.waitForButton();\n  display.clear();\n  delay(500);  // time to get your hands clear\n}\n\n/*\ncheckBattery()\n--------------\nHold A + B together at any time to see the battery.\nCall it at the TOP of loop().\n*/\nvoid checkBattery() {\n  if (buttonA.isPressed() && buttonB.isPressed()) {\n    display.clear();\n    display.print(F(\"Battery\"));\n    display.gotoXY(0, 1);\n    int mv = readBatteryMillivolts();\n    display.print(mv);\n    display.print(F(\" mV\"));\n    while (buttonA.isPressed() || buttonB.isPressed()) {\n      // wait for release\n    }\n    delay(200);\n    display.clear();\n  }\n}\n"},

essed() && buttonC.isPressed()) {\ntrimValue = 0;\nblinkConfirm();\ndelay(100);\nblinkConfirm(); // Double blink for reset\nSerial.println(F(\"[RESET] TRIM set to 0\"));\nprintTrimAdvice();\nupdateDisplay();\ndelay(500); // Debounce\n}\n// Button A: Decrease TRIM\nelse if (buttonA.getSingleDebouncedPress()) {\ntrimValue -= TRIM_STEP;\ntrimValue = constrain(trimValue, -50, 50);\nblinkConfirm();\nSerial.print(F(\"[BTN A] TRIM decreased to \"));\nSerial.println(trimValue);\nprintTrimAdvice();\nupdateDisplay();\n}\n// Button B: Run motor test\nelse if (buttonB.getSingleDebouncedPress()) {\nblinkConfirm();\nSerial.println(F(\"[BTN B] Starting motor test...\"));\nrunMotorTest();\n}\n// Button C: Increase TRIM\nelse if (buttonC.getSingleDebouncedPress()) {\ntrimValue += TRIM_STEP;\ntrimValue = constrain(trimValue, -50, 50);\nblinkConfirm();\nSerial.print(F(\"[BTN C] TRIM increased to \"));\nSerial.println(trimValue);\nprintTrimAdvice();\nupdateDisplay();\n}\ndelay(10);\n}\n", "creep_mode": "Zumo32U4Motors motors;\nZumo32U4ButtonA buttonA;\nZumo32U4ButtonB buttonB;\nZumo32U4ButtonC buttonC;\nZumo32U4OLED display;\n\nint testSpeed = 100;\n\nvoid showSpeed() {\ndisplay.clear();\ndisplay.print(F(\"Spd \"));\ndisplay.print(testSpeed);\ndisplay.gotoXY(0, 1);\ndisplay.print(F(\"B=run\"));\n}\n\nvoid setup() {\nshowSpeed();\n}\n\nvoid loop() {\nif (buttonA.getSingleDebouncedPress()) { testSpeed -= 5; showSpeed(); }\nif (buttonC.getSingleDebouncedPress()) { testSpeed += 5; showSpeed(); }\nif (buttonB.getSingleDebouncedPress()) {\nmotors.setSpeeds(testSpeed, testSpeed);\ndelay(1000);\nmotors.setSpeeds(0, 0);\n}\n}\n", "backwards_robot": "Zumo32U4Motors motors;\nZumo32U4ButtonB buttonB;\n\nvoid driveForward() {\nmotors.setSpeeds(200, 200);\ndelay(1500);\nmotors.setSpeeds(0, 0);\n}\n\nvoid setup() {\n// YOUR FIX GOES HERE (two lines)\n}\n\nvoid loop() {\nif (buttonB.getSingleDebouncedPress()) {\ndriveForward();\n}\n}\n", "braking_test": "Zumo32U4Motors motors;\nZumo32U4ButtonA buttonA;\nZumo32U4ButtonC buttonC;\n\nvoid setup() {\n}\n\nvoid loop() {\nif (buttonA.getSingleDebouncedPress()) {   // A = slam stop\nmotors.setSpeeds(400, 400);\ndelay(1500);\nmotors.setSpeeds(0, 0);\n}\nif (buttonC.getSingleDebouncedPress()) {   // C = ramp-down stop\nmotors.setSpeeds(400, 400);\ndelay(1500);\nfor (int s = 400; s >= 0; s -= 20) {\nmotors.setSpeeds(s, s);\ndelay(50);\n}\n}\n}\n", "figure_eight": "Zumo32U4Motors motors;\nZumo32U4ButtonB buttonB;\n\nvoid setup() {\n}\n\nvoid loop() {\nif (buttonB.getSingleDebouncedPress()) {\nmotors.setSpeeds(250, 120);   // right-hand circle\ndelay(2600);\nmotors.setSpeeds(120, 250);   // left-hand circle\ndelay(2600);\nmotors.setSpeeds(0, 0);\n}\n}\n", "speedometer": "Zumo32U4Motors motors;\nZumo32U4ButtonA buttonA;\nZumo32U4ButtonC buttonC;\n\nvoid runAt(int spd) {\nmotors.setSpeeds(spd, spd);\ndelay(2000);\nmotors.setSpeeds(0, 0);\n}\n\nvoid setup() {\n}\n\nvoid loop() {\nif (buttonA.getSingleDebouncedPress()) runAt(100);   // A = speed 100\nif (buttonC.getSingleDebouncedPress()) runAt(200);   // C = speed 200\n}\n"},
    "5": {

e);\n}\n\nvoid drawBar(int row, int value) {\n    display.gotoXY(2, row);\n    int barLength = constrain(value, 0, 6);\n    for (int i = 0; i < 6; i++) {\n        if (i < barLength) {\n            display.print(F(\"#\"));\n        } else {\n            display.print(F(\"-\"));\n        }\n    }\n    display.print(F(\" \"));\n    display.print(value);\n}\n\nvoid showNumericMode() {\n    display.clear();\n    display.setLayout21x8();\n    display.gotoXY(0, 0);\n    display.print(F(\"=== PROXIMITY ===\"));\n    display.gotoXY(0, 2);\n    display.print(F(\"Left:  \"));\n    display.print(leftValue);\n    display.gotoXY(0, 3);\n    display.print(F(\"Front: \"));\n    display.print(frontValue);\n    display.print(F(\" (L\"));\n    display.print(frontLeftValue);\n    display.print(F(\" R\"));\n    display.print(frontRightValue);\n    display.print(F(\")\"));\n    display.gotoXY(0, 4);\n    display.print(F(\"Right: \"));\n    display.print(rightValue);\n    display.gotoXY(0, 6);\n    display.print(F(\"0=none  6=closest\"));\n    display.gotoXY(0, 7);\n    display.print(F(\"A:num B:bar C:alert\"));\n}\n\nvoid showBarGraphMode() {\n    display.clear();\n    display.setLayout21x8();\n    display.gotoXY(0, 0);\n    display.print(F(\"=== PROX BARS ===\"));\n    display.gotoXY(0, 2);\n    display.print(F(\"L:\"));\n    drawBar(2, leftValue);\n    display.gotoXY(0, 4);\n    display.print(F(\"F:\"));\n    drawBar(4, frontValue);\n    display.gotoXY(0, 6);\n    display.print(F(\"R:\"));\n    drawBar(6, rightValue);\n    display.gotoXY(0, 7);\n    display.print(F(\"A:num B:bar C:alert\"));\n}\n\nvoid showAlertMode() {\n    display.clear();\n    display.setLayout21x8();\n    display.gotoXY(0, 0);\n    display.print(F(\"=== DETECTION ===\"));\n    // Left status\n    display.gotoXY(0, 2);\n    display.print(F(\"LEFT:  \"));\n    if (leftValue >= VERY_CLOSE_THRESHOLD) {\n        display.print(F(\"[VERY CLOSE!]\"));\n    } else if (leftValue >= CLOSE_THRESHOLD) {\n        display.print(F(\"[CLOSE]\"));\n    } else if (leftValue >= DETECTION_THRESHOLD) {\n        display.print(F(\"[detected]\"));\n    } else {\n        display.print(F(\"clear\"));\n    }\n    // Front status\n    display.gotoXY(0, 3);\n    display.print(F(\"FRONT: \"));\n    if (frontValue >= VERY_CLOSE_THRESHOLD) {\n        display.print(F(\"[VERY CLOSE!]\"));\n    } else if (frontValue >= CLOSE_THRESHOLD) {\n        display.print(F(\"[CLOSE]\"));\n    } else if (frontValue >= DETECTION_THRESHOLD) {\n        display.print(F(\"[detected]\"));\n    } else {\n        display.print(F(\"clear\"));\n    }\n    // Right status\n    display.gotoXY(0, 4);\n    display.print(F(\"RIGHT: \"));\n    if (rightValue >= VERY_CLOSE_THRESHOLD) {\n        display.print(F(\"[VERY CLOSE!]\"));\n    } else if (rightValue >= CLOSE_THRESHOLD) {\n        display.print(F(\"[CLOSE]\"));\n    } else if (rightValue >= DETECTION_THRESHOLD) {\n        display.print(F(\"[detected]\"));\n    } else {\n        display.print(F(\"clear\"));\n    }\n    // Overall warning\n    display.gotoXY(0, 6);\n    if (frontValue >= VERY_CLOSE_THRESHOLD) {\n        display.print(F(\"!!! OBSTACLE !!!\"));\n    } else if (frontValue >= CLOSE_THRESHOLD) {\n        display.print(F(\">> CAUTION <<\"));\n    } else {\n        display.print(F(\"Path looks clear\"));\n    }\n    display.gotoXY(0, 7);\n    display.print(F(\"A:num B:bar C:alert\"));\n}\n\nvoid updateIndicators() {\n    // LED: On if anything detected in front\n    if (frontValue >= DETECTION_THRESHOLD) {\n        ledYellow(1);\n    } else {\n        ledYellow(0);\n    }\n    // Buzzer: Beep pattern based on closeness\n    static unsigned long lastBeep = 0;\n    unsigned long beepInterval;\n    if (frontValue >= VERY_CLOSE_THRESHOLD) {\n        beepInterval = 100;   // Fast beeping\n    } else if (frontValue >= CLOSE_THRESHOLD) {\n        beepInterval = 300;   // Medium beeping\n    } else if (frontValue >= DETECTION_THRESHOLD) {\n        beepInterval = 600;   // Slow beeping\n    } else {\n        beepInterval = 0;     // No beeping\n    }\n    if (beepInterval > 0 && millis() - lastBeep > beepInterval) {\n        buzzer.playNote(NOTE_C(5), 30, 15);\n        lastBeep = millis();\n    }\n}\n\n// ----- STANDARD HELPERS (added after Lesson 3) -----\n\n/*\nwaitForStart()\n--------------\nSAFETY GATE: nothing moves until Button A is pressed.\nCall it at the END of setup(), always.\n*/\nvoid waitForStart() {\n  display.clear();\n  display.print(F(\"Press A\"));\n  display.gotoXY(0, 1);\n  display.print(F(\"to start\"));\n  buttonA.waitForButton();\n  display.clear();\n  delay(500);  // time to get your hands clear\n}\n\n/*\ncheckBattery()\n--------------\nHold A + B together at any time to see the battery.\nCall it at the TOP of loop().\n*/\nvoid checkBattery() {\n  if (buttonA.isPressed() && buttonB.isPressed()) {\n    display.clear();\n    display.print(F(\"Battery\"));\n    display.gotoXY(0, 1);\n    int mv = readBatteryMillivolts();\n    display.print(mv);\n    display.print(F(\" mV\"));\n    while (buttonA.isPressed() || buttonB.isPressed()) {\n      // wait for release\n    }\n    delay(200);\n    display.clear();\n  }\n}\n",
      "jumper_check": "// ===== HARDWARE OBJECTS =====\nZumo32U4OLED display;\nZumo32U4LineSensors lineSensors;\nZumo32U4ButtonA buttonA;\n\n// ===== GLOBAL VARIABLES =====\nunsigned int sensorValues[5];\n\nvoid setup() {\n  lineSensors.initFiveSensors();   // The promise: pins 20 and 4 lead to line sensors\n  display.setLayout21x8();\n  display.clear();\n  display.gotoXY(0, 0);\n  display.print(F(\"JUMPER CHECK\"));\n  display.gotoXY(0, 2);\n  display.print(F(\"Robot on the tape.\"));\n  display.gotoXY(0, 4);\n  display.print(F(\"Press A to read.\"));\n  buttonA.waitForButton();\n}\n\nvoid loop() {\n  lineSensors.read(sensorValues);   // Raw - no calibration needed for a yes/no test\n\n  display.clear();\n  display.gotoXY(0, 0);\n  display.print(F(\"1    2    3    4    5\"));\n  display.gotoXY(0, 2);\n  for (int i = 0; i < 5; i++) {\n    display.print(sensorValues[i] / 100);   // 0-2000 -> 0-20, fits the row\n    display.print(F(\"   \"));\n  }\n  display.gotoXY(0, 5);\n  display.print(F(\"All 5 move = DONE\"));\n  delay(100);\n}"

  var GENERIC = [
    ["main",    "Main lesson build", "",        ""],
    ["mystery", "Mystery sandbox",   "Mystery", "Mystery Challenge Sandbox"],
    ["custom",  "Custom copy\u2026",   null,      ""]
  ];

  var lesson = document.getElementById('lesson');
  for (var i = 1; i <= 15; i++) {
    var o = document.createElement('option');
    o.value = i; o.textContent = 'Lesson ' + String(i).padStart(2,'0') + ' \u2014 ' + TITLES[i];
    lesson.appendChild(o);
  }

  var lname = document.getElementById('lname'), finit = document.getElementById('finit'),
      kind = document.getElementById('kind'), preview = document.getElementById('preview'),
      go = document.getElementById('go'), err = document.getElementById('err'),
      customRow = document.getElementById('customRow'), custom = document.getElementById('custom');
  var goAll = document.getElementById('goAll');

  // Lessons whose registries are complete + compile-verified; extend as backfill lands.
  var DL_ALL_LESSONS = [2, 3, 4, 5, 6, 7, 8, 9];
  function kindList() { return KINDS[parseInt(lesson.value,10)] || GENERIC; }
  function rebuildKinds(keep) {
    kind.innerHTML = '';
    var curGroup = null, curEl = kind;
    kindList().forEach(function (k) {
      var g = k[4] || null;
      if (g !== curGroup) {
        if (g) { curEl = document.createElement('optgroup'); curEl.label = g; kind.appendChild(curEl); }
        else { curEl = kind; }
        curGroup = g;
      }
      var o = document.createElement('option');
      o.value = k[0]; o.textContent = k[1];
      curEl.appendChild(o);
    });
    if (keep) kind.value = keep;
    if (!kind.value) kind.selectedIndex = 0;
  }

  var params = new URLSearchParams(location.search);
  if (params.get('lesson')) lesson.value = parseInt(params.get('lesson'), 10) || 1;
  rebuildKinds(params.get('kind') || 'main');
  try {
    lname.value = localStorage.getItem('zumo_lname') || '';
    finit.value = localStorage.getItem('zumo_finit') || '';
  } catch (e) {}

  function cleanName(s) { return s.replace(/[^A-Za-z]/g, ''); }
  function cleanSuffix(s) { return s.trim().replace(/\s+/g, '_').replace(/[^A-Za-z0-9_]/g, ''); }
  function kindRec() {
    var v = kind.value, list = kindList();
    for (var i = 0; i < list.length; i++) if (list[i][0] === v) return list[i];
    return list[0];
  }
  function folderName() {
    var n = cleanName(lname.value);
    if (!n) return null;
    n = n.charAt(0).toUpperCase() + n.slice(1);
    var fi = cleanName(finit.value).toUpperCase();
    var base = n + fi + '_L' + String(lesson.value).padStart(2, '0');
    var rec = kindRec();
    var suf = rec[2];
    if (suf === null) { suf = cleanSuffix(custom.value); if (!suf) return null; }
    return suf ? base + '_' + suf : base;
  }
  function refresh() {
    customRow.style.display = (kindRec()[2] === null) ? 'block' : 'none';
    var f = folderName();
    preview.textContent = f || 'type your last name\u2026';
    go.disabled = !f;
    var all = DL_ALL_LESSONS.indexOf(parseInt(lesson.value, 10)) !== -1;
    goAll.style.display = all ? 'block' : 'none';
    goAll.disabled = !cleanName(lname.value);
    err.textContent = '';
  }
  [lname, finit, kind, custom].forEach(function (el) {
    el.addEventListener('input', refresh); el.addEventListener('change', refresh);
  });
  lesson.addEventListener('change', function () { rebuildKinds('main'); refresh(); });
  refresh();

  var INI = "[env:a-star32u4]\nplatform = atmelavr\nboard = a-star32u4\nframework = arduino\nmonitor_speed = 115200\nlib_deps = pololu/Zumo32U4\n";

  function mainCpp(recArg) {
    var num = String(lesson.value).padStart(2, '0');
    var rec = recArg || kindRec();
    var what = TITLES[lesson.value];
    if (rec[0] === 'custom') { what += ' \u2014 ' + cleanSuffix(custom.value).replace(/_/g, ' '); }
    else if (rec[3]) { what += ' \u2014 ' + rec[3]; }
    var name = cleanName(lname.value); name = name.charAt(0).toUpperCase() + name.slice(1);
    var d = new Date();
    var date = (d.getMonth()+1) + '/' + d.getDate() + '/' + d.getFullYear();
    var head = "/*\n=====================================================\nLESSON " + num + " - " + what +
      "\n=====================================================\nWHAT THIS PROGRAM DOES:\n(update this as you build!)\nAUTHOR: " + name +
      "\nDATE: " + date + "\n=====================================================\n*/\n\n#include <Zumo32U4.h>\n\n" +
      "// ==================== MY PLAN ====================\n" +
      "// Pseudo-code first, real code second.\n" +
      "// In plain English: what should this program do,\n" +
      "// step by step?\n" +
      "//\n" +
      "//   1.\n" +
      "//   2.\n" +
      "//   3.\n" +
      "//   4.\n" +
      "//\n" +
      "// Update the plan when your plan changes.\n" +
      "// =================================================\n\n";
    var P = PAYLOADS[String(parseInt(lesson.value, 10))];
    var pay = (P && rec[5]) ? P[rec[5]] : null;
    var body = (pay && typeof pay === 'object') ? pay['main.cpp'] : pay;
    if (body) { return head + body; }
    if (parseInt(lesson.value, 10) < 4) {
      return head +
        "// ===== HARDWARE OBJECTS =====\n\n// ===== CONSTANTS =====\n\n// ===== FUNCTION PROTOTYPES =====\n\n" +
        "void setup() {\n}\n\nvoid loop() {\n}\n\n// ===== HELPER FUNCTIONS =====\n";
    }
    return head +
      "// ===== HARDWARE OBJECTS =====\nZumo32U4ButtonA buttonA;\nZumo32U4ButtonB buttonB;\nZumo32U4OLED display;\n\n" +
      "// ===== CONSTANTS =====\n\n" +
      "// ===== FUNCTION PROTOTYPES =====\nvoid waitForStart();\nvoid checkBattery();\n\n" +
      "void setup() {\nwaitForStart();\n}\n\n" +
      "void loop() {\ncheckBattery();\n}\n\n" +
      "// ===== HELPER FUNCTIONS =====\n\n// ----- STANDARD HELPERS (added after Lesson 3) -----\n\n" +
      "/*\nwaitForStart()\n--------------\nSAFETY GATE: nothing moves until Button A is pressed.\nCall it at the END of setup(), always.\n*/\n" +
      "void waitForStart() {\ndisplay.clear();\ndisplay.print(F(\"Press A\"));\ndisplay.gotoXY(0, 1);\ndisplay.print(F(\"to start\"));\n" +
      "buttonA.waitForButton();\ndisplay.clear();\ndelay(500);  // time to get your hands clear\n}\n\n" +
      "/*\ncheckBattery()\n--------------\nHold A + B together at any time to see the battery.\nCall it at the TOP of loop().\n*/\n" +
      "void checkBattery() {\nif (buttonA.isPressed() && buttonB.isPressed()) {\ndisplay.clear();\ndisplay.print(F(\"Battery\"));\n" +
      "display.gotoXY(0, 1);\nint mv = readBatteryMillivolts();\ndisplay.print(mv);\ndisplay.print(F(\" mV\"));\n" +
      "while (buttonA.isPressed() || buttonB.isPressed()) {\n// wait for release\n}\ndelay(200);\ndisplay.clear();\n}\n}\n";
  }

  function extraFiles(recArg) {
    var rec = recArg || kindRec();
    var P = PAYLOADS[String(parseInt(lesson.value, 10))];
    var pay = (P && rec[5]) ? P[rec[5]] : null;
    if (!pay || typeof pay !== 'object') return {};
    var out = {};
    for (var k in pay) { if (k !== 'main.cpp') out[k] = pay[k]; }
    return out;
  }

  go.onclick = function () {
    var f = folderName();
    if (!f) return;
    try {
      localStorage.setItem('zumo_lname', cleanName(lname.value));
      localStorage.setItem('zumo_finit', cleanName(finit.value));
    } catch (e) {}
    var zip = new JSZip();
    var root = zip.folder(f);
    root.file('platformio.ini', INI);
    root.folder('src').file('main.cpp', mainCpp());
    var xf = extraFiles();
    for (var fn in xf) { root.folder(/\.h$/.test(fn) ? 'include' : 'src').file(fn, xf[fn]); }
    zip.generateAsync({ type: 'blob' }).then(function (blob) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = f + '.zip';
      document.body.appendChild(a); a.click(); a.remove();
    }).catch(function (e) { err.textContent = 'Download failed \u2014 tell your teacher: ' + e; });
  };

  function folderFor(rec) {
    var n = cleanName(lname.value);
    if (!n) return null;
    n = n.charAt(0).toUpperCase() + n.slice(1);
    var fi = cleanName(finit.value).toUpperCase();
    var base = n + fi + '_L' + String(lesson.value).padStart(2, '0');
    return rec[2] ? base + '_' + rec[2] : base;
  }

  goAll.onclick = function () {
    var n = cleanName(lname.value);
    if (!n) return;
    try {
      localStorage.setItem('zumo_lname', n);
      localStorage.setItem('zumo_finit', cleanName(finit.value));
    } catch (e) {}
    var zip = new JSZip();
    var count = 0;
    kindList().forEach(function (rec) {
      if (rec[0] === 'custom') return; // needs a typed suffix; not a template
      var f = folderFor(rec);
      if (!f) return;
      var root = zip.folder(f);
      root.file('platformio.ini', INI);
      root.folder('src').file('main.cpp', mainCpp(rec));
      var xf = extraFiles(rec);
      for (var fn in xf) { root.folder(/\.h$/.test(fn) ? 'include' : 'src').file(fn, xf[fn]); }
      count++;
    });
    if (!count) { err.textContent = 'No templates registered for this lesson yet.'; return; }
    var base = n.charAt(0).toUpperCase() + n.slice(1) + cleanName(finit.value).toUpperCase() +
      '_L' + String(lesson.value).padStart(2, '0') + '_All_Templates';
    zip.generateAsync({ type: 'blob' }).then(function (blob) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = base + '.zip';
      document.body.appendChild(a); a.click(); a.remove();
    }).catch(function (e) { err.textContent = 'Download failed \u2014 tell your teacher: ' + e; });
  };
})();
