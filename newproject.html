<div class="card">
  <h1>&#129302; ZUMO Project Maker</h1>
  <div class="sub">Type your name once. Pick what you're working on. Download a project folder that's already named correctly.</div>

  <div class="row">
    <div>
      <label for="lname">Last name</label>
      <input id="lname" placeholder="Smith" autocomplete="off">
    </div>
    <div>
      <label for="finit">First initial (only if two students share a last name)</label>
      <input id="finit" placeholder="J" maxlength="1" autocomplete="off">
    </div>
  </div>

  <div class="row">
    <div>
      <label for="lesson">Lesson</label>
      <select id="lesson"></select>
    </div>
    <div>
      <label for="kind">Working on</label>
      <select id="kind"></select>
    </div>
  </div>

  <div id="customRow">
    <label for="custom">Name this copy</label>
    <input id="custom" placeholder="My_Experiment" autocomplete="off">
  </div>

  <div class="preview" id="preview">&nbsp;</div>
  <div class="err" id="err"></div>
  <button class="go" id="go" disabled>&#11015; Download my project folder</button>
<button class="go" id="goAll" disabled style="display: none; margin-top: 8px; background: #4d5358;">&#11015; Download ALL templates for this lesson (one zip)</button>

</div>

    "8": {"after_step_1": {"RobotSensors.cpp": "/*\n=====================================================\nROBOTSENSORS.CPP - Hardware Definitions\n=====================================================\nThis file CREATES all hardware objects.\nThis is the ONLY file that creates them.\nOther files use #include \"RobotSensors.h\" to access them.\nIn later lessons, sensor functions will be added here.\n=====================================================\n*/\n#include <Zumo32U4.h>\n#include \"RobotSensors.h\"\n\n// ===== HARDWARE OBJECT DEFINITIONS =====\n// These are the REAL objects - created exactly ONCE\nZumo32U4OLED display;\nZumo32U4Buzzer buzzer;\nZumo32U4Motors motors;\nZumo32U4Encoders encoders;\nZumo32U4ButtonA buttonA;\nZumo32U4ButtonB buttonB;\nZumo32U4ButtonC buttonC;\n", "RobotSensors.h": "/*\n=====================================================\nROBOTSENSORS.H - Hardware & Sensor Declarations\n=====================================================\nDeclares ALL hardware objects used across the project.\nThe actual objects are DEFINED in RobotSensors.cpp.\nThe keyword \"extern\" means: \"this object exists\nsomewhere else - let me use it here.\"\n=====================================================\n*/\n#pragma once\n#include <Zumo32U4.h>\n\n// ===== EXTERN HARDWARE DECLARATIONS =====\n// These tell other files \"these objects exist\"\n// The actual objects are created in RobotSensors.cpp\nextern Zumo32U4OLED display;\nextern Zumo32U4Buzzer buzzer;\nextern Zumo32U4Motors motors;\nextern Zumo32U4Encoders encoders;\nextern Zumo32U4ButtonA buttonA;\nextern Zumo32U4ButtonB buttonB;\nextern Zumo32U4ButtonC buttonC;\n", "RobotHelpers.cpp": "/*\n=====================================================\nROBOTHELPERS.CPP - Standard Helper Implementations\n=====================================================\nSame code you have used since Lesson 4 - it just\nlives in its own module now. Needs the hardware,\nso it includes RobotSensors.h.\n=====================================================\n*/\n#include <Zumo32U4.h>\n#include \"RobotSensors.h\"\n#include \"RobotHelpers.h\"\n\n// ----- STANDARD HELPERS (added after Lesson 3) -----\n\n/*\nwaitForStart()\n--------------\nSAFETY GATE: nothing moves until Button A is pressed.\nCall it at the END of setup(), always.\n*/\nvoid waitForStart() {\n  display.clear();\n  display.print(F(\"Press A\"));\n  display.gotoXY(0, 1);\n  display.print(F(\"to start\"));\n  buttonA.waitForButton();\n  display.clear();\n  delay(500);  // time to get your hands clear\n}\n\n/*\ncheckBattery()\n--------------\nHold A + B together at any time to see the battery.\nCall it at the TOP of the polling loop.\n*/\nvoid checkBattery() {\n  if (buttonA.isPressed() && buttonB.isPressed()) {\n    display.clear();\n    display.print(F(\"Battery\"));\n    display.gotoXY(0, 1);\n    int mv = readBatteryMillivolts();\n    display.print(mv);\n    display.print(F(\" mV\"));\n    while (buttonA.isPressed() || buttonB.isPressed()) {\n      // wait for release\n    }\n    delay(200);\n    display.clear();\n  }\n}\n", "RobotConfig.h": "/*\n=====================================================\nROBOTCONFIG.H - Robot Calibration Settings\n=====================================================\nAll robot-specific values in ONE place!\nEdit this file to tune your robot's performance.\n=====================================================\n*/\n#pragma once\n\n// ===== PHYSICAL PROPERTIES =====\n// These values define your robot's hardware\n\n// Encoder counts per complete wheel rotation\n// (12 counts/motor rotation x 75.81 gear ratio = 909.7)\nconst float COUNTS_PER_ROTATION = 909.7;\n\n// Wheel diameter in millimeters (measure yours!)\nconst float WHEEL_DIAMETER_MM = 39.0;\n\n// Wheel circumference = pi x diameter\nconst float WHEEL_CIRCUMFERENCE_MM = 3.14159 * WHEEL_DIAMETER_MM;\n\n// Encoder counts per centimeter of travel\nconst float COUNTS_PER_CM = COUNTS_PER_ROTATION / (WHEEL_CIRCUMFERENCE_MM / 10.0);\n\n// ===== TURNING PROPERTIES =====\n// Distance between wheel centers - this is a CALIBRATION value!\n// Start at 85.0 (physical measurement), then tune up until 90 degree\n// turns are accurate. Typical tuned values: 98-115 depending on\n// surface and wheel wear.\nconst float WHEEL_BASE_MM = 85.0;\n\n// Circumference of the turn circle\nconst float TURN_CIRCUMFERENCE_MM = 3.14159 * WHEEL_BASE_MM;\n\n// Encoder counts per degree of rotation\nconst float COUNTS_PER_DEGREE = (TURN_CIRCUMFERENCE_MM / 360.0) *\n                                (COUNTS_PER_ROTATION / WHEEL_CIRCUMFERENCE_MM);\n\n// ===== SPEED SETTINGS =====\n// Adjust these to change robot behavior\nconst int DRIVE_SPEED = 150;   // Speed for straight driving (0-400)\nconst int TURN_SPEED = 150;    // Speed for turning (0-400)\n\n// ===== BATTERY THRESHOLDS =====\nconst int BATTERY_GOOD = 4800; // millivolts - fully charged\nconst int BATTERY_LOW = 4200;  // millivolts - charge soon\n", "RobotMotion.cpp": "/*\n=====================================================\nROBOTMOTION.CPP - Movement Function Implementations\n=====================================================\nThis file IMPLEMENTS the movement functions\ndeclared in RobotMotion.h\n=====================================================\n*/\n#include <Zumo32U4.h>\n#include \"RobotConfig.h\"\n#include \"RobotSensors.h\"\n#include \"RobotMotion.h\"\n\n// ===== FUNCTION IMPLEMENTATIONS =====\n\nvoid driveDistance(float centimeters) {\n  // Reset encoders to start counting from zero\n  encoders.getCountsAndResetLeft();\n  encoders.getCountsAndResetRight();\n  // Calculate how many encoder counts we need\n  int targetCounts = abs(centimeters) * COUNTS_PER_CM;\n  // Set motor direction based on positive/negative distance\n  int speed = (centimeters > 0) ? DRIVE_SPEED : -DRIVE_SPEED;\n  // Start driving\n  motors.setSpeeds(speed, speed);\n  // Keep driving until we reach the target\n  while (abs(encoders.getCountsLeft()) < targetCounts) {\n    delay(10); // Small delay to prevent hogging the CPU\n  }\n  // Stop!\n  motors.setSpeeds(0, 0);\n}\n\nvoid turnDegrees(float degrees) {\n  // Reset encoders\n  encoders.getCountsAndResetLeft();\n  encoders.getCountsAndResetRight();\n  // Calculate target counts for the turn\n  int targetCounts = abs(degrees) * COUNTS_PER_DEGREE;\n  // Set wheel directions for turning\n  // Positive degrees = turn right (left wheel forward, right wheel backward)\n  int leftSpeed = (degrees > 0) ? TURN_SPEED : -TURN_SPEED;\n  int rightSpeed = -leftSpeed; // Opposite direction\n  // Start turning\n  motors.setSpeeds(leftSpeed, rightSpeed);\n  // Keep turning until we reach the target\n  while (abs(encoders.getCountsLeft()) < targetCounts) {\n    delay(10);\n  }\n  // Stop!\n  motors.setSpeeds(0, 0);\n}\n", "main.cpp": "#include \"RobotConfig.h\"\n#include \"RobotSensors.h\"\n#include \"RobotHelpers.h\"\n#include \"RobotMotion.h\"\n\n// ===== SETUP =====\nvoid setup() {\n  Serial.begin(115200);\n  unsigned long serialStart = millis();\n  while (!Serial && (millis() - serialStart < 2000)) {\n    delay(10); // Wait up to 2s for USB serial connection\n  }\n  delay(500);\n  Serial.println(F(\"=== Lesson 7: Code Organization ===\"));\n\n  // ===== BATTERY REPORT =====\n  int batteryVoltage = readBatteryMillivolts();\n  int battWhole = batteryVoltage / 1000;\n  int battDecimal = (batteryVoltage / 10) % 100;\n  Serial.print(F(\"Battery: \"));\n  Serial.print(battWhole);\n  Serial.print(F(\".\"));\n  if (battDecimal < 10) Serial.print(F(\"0\"));\n  Serial.print(battDecimal);\n  Serial.print(F(\"V (\"));\n  Serial.print(batteryVoltage);\n  Serial.println(F(\"mV)\"));\n\n  display.clear();\n  display.setLayout21x8();\n  display.print(F(\"===== Lesson 7 =====\"));\n  display.gotoXY(0, 2);\n  display.print(F(\"Battery: \"));\n  display.print(battWhole);\n  display.print(F(\".\"));\n  if (battDecimal < 10) display.print(F(\"0\"));\n  display.print(battDecimal);\n  display.print(F(\"V\"));\n  display.gotoXY(0, 4);\n  display.print(F(\"Status: \"));\n  if (batteryVoltage >= BATTERY_GOOD) {\n    display.print(F(\"GOOD\"));\n    ledGreen(1);\n  } else if (batteryVoltage >= BATTERY_LOW) {\n    display.print(F(\"LOW\"));\n    ledYellow(1);\n    buzzer.playNote(NOTE_A(4), 200, 15);\n  } else {\n    display.print(F(\"CHARGE!\"));\n    ledRed(1);\n    buzzer.playNote(NOTE_A(3), 500, 15);\n  }\n  display.gotoXY(0, 6);\n  display.print(F(\"Cts/cm: \"));\n  display.print(COUNTS_PER_CM, 1);\n  display.gotoXY(0, 7);\n  display.print(F(\"Cts/deg: \"));\n  display.print(COUNTS_PER_DEGREE, 2);\n  delay(2500);\n  ledGreen(0);\n  ledYellow(0);\n  ledRed(0);\n\n  waitForStart();\n}\n\n// ===== MAIN LOOP - TUNING MODE =====\n// A = test forward 10cm  (tune WHEEL_DIAMETER_MM)\n// B = test turn 90 deg   (tune WHEEL_BASE_MM)\n// C = full square with countdown (verify both)\nvoid loop() {\n  display.clear();\n  display.print(F(\"=== TUNING MODE ===\"));\n  display.gotoXY(0, 2);\n  display.print(F(\"A = Forward 10cm\"));\n  display.gotoXY(0, 3);\n  display.print(F(\"B = Turn 90 deg\"));\n  display.gotoXY(0, 4);\n  display.print(F(\"C = Full square\"));\n  while (true) {\n    checkBattery();\n    if (buttonA.getSingleDebouncedPress()) {\n      display.clear();\n      display.print(F(\"Forward 10cm...\"));\n      delay(500);\n      driveDistance(10);\n      display.clear();\n      display.print(F(\"Done! A/B/C?\"));\n    }\n    if (buttonB.getSingleDebouncedPress()) {\n      display.clear();\n      display.print(F(\"Turn 90 deg...\"));\n      delay(500);\n      turnDegrees(90);\n      display.clear();\n      display.print(F(\"Done! A/B/C?\"));\n    }\n    if (buttonC.getSingleDebouncedPress()) {\n      for (int count = 3; count > 0; count--) {\n        display.clear();\n        display.print(count);\n        buzzer.playNote(NOTE_C(5), 150, 15);\n        delay(1000);\n      }\n      display.clear();\n      display.print(F(\"GO!\"));\n      buzzer.playNote(NOTE_C(6), 300, 15);\n      delay(500);\n      for (int i , then tune up until 90 degree\n// turns are accurate. Typical tuned values: 98-115 depending on\n// surface and wheel wear.\nconst float WHEEL_BASE_MM = 85.0;\n\n// Circumference of the turn circle\nconst float TURN_CIRCUMFERENCE_MM = 3.14159 * WHEEL_BASE_MM;\n\n// Encoder counts per degree of rotation\nconst float COUNTS_PER_DEGREE = (TURN_CIRCUMFERENCE_MM / 360.0) *\n                                (COUNTS_PER_ROTATION / WHEEL_CIRCUMFERENCE_MM);\n\n// ===== SPEED SETTINGS =====\n// Adjust these to change robot behavior\nconst int DRIVE_SPEED = 150;   // Speed for straight driving (0-400)\nconst int TURN_SPEED = 150;    // Speed for turning (0-400)\n\n// ===== BATTERY THRESHOLDS =====\nconst int BATTERY_GOOD = 4800; // millivolts - fully charged\nconst int BATTERY_LOW = 4200;  // millivolts - charge soon\n\n// ===== LINE FOLLOWING CONSTANTS (NEW for Lesson 8) =====\nconst int LINE_CENTER = 2000;            // Setpoint - line under middle sensor (0-4000 range)\nconst int BASE_SPEED = 150;              // Forward speed when centered (0-400)\nconst float KP = 0.1;                    // Proportional gain (tune this!)\nconst int MAX_SPEED = 300;               // Speed limit after correction\nconst int LINE_LOST_THRESHOLD = 200;     // Calibrated sum below this = no line\nconst unsigned long MAX_GAP_TIME = 500;  // Max milliseconds to cross a gap\n", "RobotMotion.cpp": "/*\n=====================================================\nROBOTMOTION.CPP - Movement Function Implementations\n=====================================================\nThis file IMPLEMENTS the movement functions\ndeclared in RobotMotion.h\n=====================================================\n*/\n#include <Zumo32U4.h>\n#include \"RobotConfig.h\"\n#include \"RobotSensors.h\"\n#include \"RobotMotion.h\"\n\n// ===== FUNCTION IMPLEMENTATIONS =====\n\nvoid driveDistance(float centimeters) {\n  // Reset encoders to start counting from zero\n  encoders.getCountsAndResetLeft();\n  encoders.getCountsAndResetRight();\n  // Calculate how many encoder counts we need\n  int targetCounts = abs(centimeters) * COUNTS_PER_CM;\n  // Set motor direction based on positive/negative distance\n  int speed = (centimeters > 0) ? DRIVE_SPEED : -DRIVE_SPEED;\n  // Start driving\n  motors.setSpeeds(speed, speed);\n  // Keep driving until we reach the target\n  while (abs(encoders.getCountsLeft()) < targetCounts) {\n    delay(10); // Small delay to prevent hogging the CPU\n  }\n  // Stop!\n  motors.setSpeeds(0, 0);\n}\n\nvoid turnDegrees(float degrees) {\n  // Reset encoders\n  encoders.getCountsAndResetLeft();\n  encoders.getCountsAndResetRight();\n  // Calculate target counts for the turn\n  int targetCounts = abs(degrees) * COUNTS_PER_DEGREE;\n  // Set wheel directions for turning\n  // Positive degrees = turn right (left wheel forward, right wheel backward)\n  int leftSpeed = (degrees > 0) ? TURN_SPEED : -TURN_SPEED;\n  int rightSpeed = -leftSpeed; // Opposite direction\n  // Start turning\n  motors.setSpeeds(leftSpeed, rightSpeed);\n  // Keep turning until we reach the target\n  while (abs(encoders.getCountsLeft()) < targetCounts) {\n    delay(10);\n  }\n  // Stop!\n  motors.setSpeeds(0, 0);\n}\n", "main.cpp": "#include \"RobotConfig.h\"\n#include \"RobotSensors.h\"\n#include \"RobotHelpers.h\"\n#include \"RobotMotion.h\"\n\n// ===== SETUP =====\nvoid setup() {\n  Serial.begin(115200);\n  unsigned long serialStart = millis();\n  while (!Serial && (millis() - serialStart < 2000)) {\n    delay(10); // Wait up to 2s for USB serial connection\n  }\n  delay(500);\n  Serial.println(F(\"=== Lesson 7: Code Organization ===\"));\n\n  // ===== BATTERY REPORT =====\n  int batteryVoltage = readBatteryMillivolts();\n  int battWhole = batteryVoltage / 1000;\n  int battDecimal = (batteryVoltage / 10) % 100;\n  Serial.print(F(\"Battery: \"));\n  Serial.print(battWhole);\n  Serial.print(F(\".\"));\n  if (battDecimal < 10) Serial.print(F(\"0\"));\n  Serial.print(battDecimal);\n  Serial.print(F(\"V (\"));\n  Serial.print(batteryVoltage);\n  Serial.println(F(\"mV)\"));\n\n  display.clear();\n  display.setLayout21x8();\n  display.print(F(\"===== Lesson 7 =====\"));\n  display.gotoXY(0, 2);\n  display.print(F(\"Battery: \"));\n  display.print(battWhole);\n  display.print(F(\".\"));\n  if (battDecimal < 10) display.print(F(\"0\"));\n  display.print(battDecimal);\n  display.print(F(\"V\"));\n  display.gotoXY(0, 4);\n  display.print(F(\"Status: \"));\n  if (batteryVoltage >= BATTERY_GOOD) {\n    display.print(F(\"GOOD\"));\n    ledGreen(1);\n  } else if (batteryVoltage >= BATTERY_LOW) {\n    display.print(F(\"LOW\"));\n    ledYellow(1);\n    buzzer.playNote(NOTE_A(4), 200, 15);\n  } else {\n    display.print(F(\"CHARGE!\"));\n    ledRed(1);\n    buzzer.playNote(NOTE_A(3), 500, 15);\n  }\n  display.gotoXY(0, 6);\n  display.print(F(\"Cts/cm: \"));\n  display.print(COUNTS_PER_CM, 1);\n  display.gotoXY(0, 7);\n  display.print(F(\"Cts/deg: \"));\n  display.print(COUNTS_PER_DEGREE, 2);\n  delay(2500);\n  ledGreen(0);\n  ledYellow(0);\n  ledRed(0);\n\n  waitForStart();\n}\n\n// ===== MAIN LOOP - TUNING MODE =====\n// A = test forward 10cm  (tune WHEEL_DIAMETER_MM)\n// B = test turn 90 deg   (tune WHEEL_BASE_MM)\n// C = full square with countdown (verify both)\nvoid loop() {\n  display.clear();\n  display.print(F(\"=== TUNING MODE ===\"));\n  display.gotoXY(0, 2);\n  display.print(F(\"A = Forward 10cm\"));\n  display.gotoXY(0, 3);\n  display.print(F(\"B = Turn 90 deg\"));\n  display.gotoXY(0, 4);\n  display.print(F(\"C = Full square\"));\n  while (true) {\n    checkBattery();\n    if (buttonA.getSingleDebouncedPress()) {\n      display.clear();\n      display.print(F(\"Forward 10cm...\"));\n      delay(500);\n      driveDistance(10);\n      display.clear();\n      display.print(F(\"Done! A/B/C?\"));\n    }\n    if (buttonB.getSingleDebouncedPress()) {\n      display.clear();\n      display.print(F(\"Turn 90 deg...\"));\n      delay(500);\n      turnDegrees(90);\n      display.clear();\n      display.print(F(\"Done! A/B/C?\"));\n    }\n    if (buttonC.getSingleDebouncedPress()) {\n      for (int count = 3; count > 0; count--) {\n        display.clear();\n        display.print(count);\n        buzzer.playNote(NOTE_C(5), 150, 15);\n        delay(1000);\n      }\n      display.clear();\n      display.print(F(\"GO!\"));\n      buzzer.playNote(NOTE_C(6), 300, 15);\n      delay(500);\n      for (int i = 0; i < 4; i++) {\n        display.clear();\n        display.print(F(\"Side \"));\n        display.print(i + 1);\n        display.print(F(\" of 4\"));\n        delay(500);\n        driveDistance(10);\n        delay(750);\n        turnDegrees(90);\n        delay(750);\n      }\n      display.clear();\n      display.print(F(\"Square done!\"));\n      display.gotoXY(0, 2);\n      display.print(F(\"A/B/C?\"));\n    }\n    delay(10);\n  }\n}", "RobotMotion.h": "/*\n=====================================================\nROBOTMOTION.H - Movement Function Declarations\n=====================================================\nThis file DECLARES the movement functions.\nThe actual code (implementation) is in RobotMotion.cpp\n=====================================================\n*/\n#pragma once\n\n// ===== FUNCTION DECLARATIONS =====\n// These tell the compiler \"these functions exist\"\n// The actual code is in RobotMotion.cpp\n\n/*\ndriveDistance()\n----------------\nDrives the robot a specific distance.\nParameters:\n  centimeters - Distance to travel (positive = forward)\nUses encoders for accurate distance control.\n*/\nvoid driveDistance(float centimeters);\n\n/*\nturnDegrees()\n--------------\nTurns the robot a specific angle.\nParameters:\n  degrees - Angle to turn (positive = right, negative = left)\nUses encoders for accurate turn control.\n*/\nvoid turnDegrees(float degrees);\n", "RobotHelpers.h": "/*\n=====================================================\nROBOTHELPERS.H - Standard Helper Declarations\n=================================================  five readings\nint lastPosition = LINE_CENTER;   // Last known line position\n\n// ===== LINE SENSOR FUNCTIONS (NEW for Lesson 8) =====\nvoid initLineSensors() {\n  lineSensors.initFiveSensors();\n}\n\nvoid calibrateLineSensors() {\n  for (int i = 0; i < 100; i++) {\n    if (i < 50) {\n      motors.setSpeeds(-100, 100);  // Spin left\n    } else {\n      motors.setSpeeds(100, -100);  // Spin right\n    }\n    lineSensors.calibrate();\n  }\n  motors.setSpeeds(0, 0);\n}\n", "RobotSensors.h": "/*\n=====================================================\nROBOTSENSORS.H - Hardware & Sensor Declarations\n=====================================================\nDeclares ALL hardware objects used across the project.\nThe actual objects are DEFINED in RobotSensors.cpp.\nThe keyword \"extern\" means: \"this object exists\nsomewhere else - let me use it here.\"\n=====================================================\n*/\n#pragma once\n#include <Zumo32U4.h>\n\n// ===== EXTERN HARDWARE DECLARATIONS =====\n// These tell other files \"these objects exist\"\n// The actual objects are created in RobotSensors.cpp\nextern Zumo32U4OLED display;\nextern Zumo32U4Buzzer buzzer;\nextern Zumo32U4Motors motors;\nextern Zumo32U4Encoders encoders;\nextern Zumo32U4ButtonA buttonA;\nextern Zumo32U4ButtonB buttonB;\nextern Zumo32U4ButtonC buttonC;\nextern Zumo32U4LineSensors lineSensors;  // NEW for Lesson 8\n\n// ===== LINE SENSOR FUNCTIONS (NEW for Lesson 8) =====\nvoid initLineSensors();\nvoid calibrateLineSensors();\nint readLinePosition();\nbool isLineVisible();\n", "RobotHelpers.cpp": "/*\n=====================================================\nROBOTHELPERS.CPP - Standard Helper Implementations\n=====================================================\nSame code you have used since Lesson 4 - it just\nlives in its own module now. Needs the hardware,\nso it includes RobotSensors.h.\n=====================================================\n*/\n#include <Zumo32U4.h>\n#include \"RobotSensors.h\"\n#include \"RobotHelpers.h\"\n\n// ----- STANDARD HELPERS (added after Lesson 3) -----\n\n/*\nwaitForStart()\n--------------\nSAFETY GATE: nothing moves until Button A is pressed.\nCall it at the END of setup(), always.\n*/\nvoid waitForStart() {\n  display.clear();\n  display.print(F(\"Press A\"));\n  display.gotoXY(0, 1);\n  display.print(F(\"to start\"));\n  buttonA.waitForButton();\n  display.clear();\n  delay(500);  // time to get your hands clear\n}\n\n/*\ncheckBattery()\n--------------\nHold A + B together at any time to see the battery.\nCall it at the TOP of the polling loop.\n*/\nvoid checkBattery() {\n  if (buttonA.isPressed() && buttonB.isPressed()) {\n    display.clear();\n    display.print(F(\"Battery\"));\n    display.gotoXY(0, 1);\n    int mv = readBatteryMillivolts();\n    display.print(mv);\n    display.print(F(\" mV\"));\n    while (buttonA.isPressed() || buttonB.isPressed()) {\n      // wait for release\n    }\n    delay(200);\n    display.clear();\n  }\n}\n", "RobotConfig.h": "/*\n=====================================================\nROBOTCONFIG.H - Robot Calibration Settings\n=====================================================\nAll robot-specific values in ONE place!\nEdit this file to tune your robot's performance.\n=====================================================\n*/\n#pragma once\n\n// ===== PHYSICAL PROPERTIES =====\n// These values define your robot's hardware\n\n// Encoder counts per complete wheel rotation\n// (12 counts/motor rotation x 75.81 gear ratio = 909.7)\nconst float COUNTS_PER_ROTATION = 909.7;\n\n// Wheel diameter in millimeters (measure yours!)\nconst float WHEEL_DIAMETER_MM = 39.0;\n\n// Wheel circumference = pi x diameter\nconst float WHEEL_CIRCUMFERENCE_MM = 3.14159 * WHEEL_DIAMETER_MM;\n\n// Encoder counts per centimeter of travel\nconst float COUNTS_PER_CM = COUNTS_PER_ROTATION / (WHEEL_CIRCUMFERENCE_MM / 10.0);\n\n// ===== TURNING PROPERTIES =====\n// Distance between wheel centers - this is a CALIBRATION value!\n// Start at 85.0 (physical measurement), then tune up until 90 degree\n// turns are accurate. Typical tuned values: 98-115 depending on\n// surface and wheel wear.\nconst float WHEEL_BASE_MM = 85.0;\n\n// Circumference of the turn circle\nconst float TURN_CIRCUMFERENCE_MM = 3.14159 * WHEEL_BASE_MM;\n\n// Encoder counts per degree of rotation\nconst float COUNTS_PER_DEGREE = (TURN_CIRCUMFERENCE_MM / 360.0) *\n                                (COUNTS_PER_ROTATION / WHEEL_CIRCUMFERENCE_MM);\n\n// ===== SPEED SETTINGS =====\n// Adjust these to change robot behavior\nconst int DRIVE_SPEED = 150;   // Speed for straight driving (0-400)\nconst int TURN_SPEED = 150;    // Speed for turning (0-400)\n\n// ===== BATTERY THRESHOLDS =====\nconst int BATTERY_GOOD = 4800; // millivolts - fully charged\nconst int BATTERY_LOW = 4200;  // millivolts - charge soon\n\n// ===== LINE FOLLOWING CONSTANTS (NEW for Lesson 8) =====\nconst int LINE_CENTER = 2000;            // Setpoint - line under middle sensor (0-4000 range)\nconst int BASE_SPEED = 150;              // Forward speed when centered (0-400)\nconst float KP = 0.1;                    // Proportional gain (tune this!)\nconst int MAX_SPEED = 300;               // Speed limit after correction\nconst int LINE_LOST_THRESHOLD = 200;     // Calibrated sum below this = no line\nconst unsigned long MAX_GAP_TIME = 500;  // Max milliseconds to cross a gap\n", "RobotMotion.cpp": "/*\n=====================================================\nROBOTMOTION.CPP - Movement Function Implementations\n=====================================================\nThis file IMPLEMENTS the movement functions\ndeclared in RobotMotion.h\n=====================================================\n*/\n#include <Zumo32U4.h>\n#include \"RobotConfig.h\"\n#include \"RobotSensors.h\"\n#include \"RobotMotion.h\"\n\n// ===== FUNCTION IMPLEMENTATIONS =====\n\nvoid driveDistance(float centimeters) {\n  // Reset encoders to start counting from zero\n  encoders.getCountsAndResetLeft();\n  encoders.getCountsAndResetRight();\n  // Calculate how many encoder counts we need\n  int targetCounts = abs(centimeters) * COUNTS_PER_CM;\n  // Set motor direction based on positive/negative distance\n  int speed = (centimeters > 0) ? DRIVE_SPEED : -DRIVE_SPEED;\n  // Start driving\n  motors.setSpeeds(speed, speed);\n  // Keep driving until we reach the target\n  while (abs(encoders.getCountsLeft()) < targetCounts) {\n    delay(10); // Small delay to prevent hogging the CPU\n  }\n  // Stop!\n  motors.setSpeeds(0, 0);\n}\n\nvoid turnDegrees(float degrees) {\n  // Reset encoders\n  encoders.getCountsAndResetLeft();\n  encoders.getCountsAndResetRight();\n  // Calculate target counts for the turn\n  int targetCounts = abs(degrees) * COUNTS_PER_DEGREE;\n  // Set wheel directions for turning\n  // Positive degrees = turn right (left wheel forward, right wheel backward)\n  int leftSpeed = (degrees > 0) ? TURN_SPEED : -TURN_SPEED;\n  int rightSpeed = -leftSpeed; // Opposite direction\n  // Start turning\n  motors.setSpeeds(leftSpeed, rightSpeed);\n  // Keep turning until we reach the target\n  while (abs(encoders.getCountsLeft()) < targetCounts) {\n    delay(10);\n  }\n  // Stop!\n  motors.setSpeeds(0, 0);\n}\n", "main.cpp": "#include \"RobotConfig.h\"\n#include \"RobotSensors.h\"\n#include \"RobotHelpers.h\"\n#include \"RobotMotion.h\"\n\n// ===== SETUP =====\nvoid setup() {\n  Serial.begin(115200);\n  unsigned long serialStart = millis();\n  while (!Serial && (millis() - serialStart < 2000)) {\n    delay(10); // Wait up to 2s for USB serial connection\n  }\n  delay(500);\n  Serial.println(F(\"=== Lesson 7: Code Organization ===\"));\n\n  // ===== BATTERY REPORT =====\n  int batteryVoltage = readBatteryMillivolts();\n  int battWhole = batteryVoltage / 1000;\n  int battDecimal = (batteryVoltage / 10) % 100;\n  Serial.print(F(\"Battery: \"));\n  Serial.print(battWhole);\n  Serial.print(F(\".\"));\n  if (battDecimal < 10) Serial.print(F(\"0\"));\n  Serial.print(battDecimal);\n  Serial.print(F(\"V (\"));\n  Serial.print(batteryVoltage);\n  Serial.println(F(\"mV)\"));\n\n  display.clear();\n  display.setLayout21x8();\n  display.print(F(\"===== Lesson 7 =====\"));\n  display.gotoXY(0, 2);\n  display.print(F(\"Battery: \"));\n  display.print(battWhole);\n  display.print(F(\".\"));\n  if (battDecimal < 10) display.print(F(\"0\"));\n  display.print(battDecimal);\n  display.print(F(\"V\"));\n  display.gotoXY(0, 4);\n  display.print(F(\"Status: \"));\n  if (batteryVoltage >= BATTERY_GOOD) {\n    display.print(F(\"GOOD\"));\n    ledGreen(1);\n  } else if (batteryVoltage >= BATTERY_LOW) {\n    display.print(F(\"LOW\"));\n    ledYellow(1);\n    buzzer.playNote(NOTE_A(4), 200, 15);\n  } else {\n    display.print(F(\"CHARGE!\"));\n    ledRed(1);\n    buzzer.playNote(NOTE_A(3), 500, 15);\n  }\n  display.gotoXY(0, 6);\n  display.print(F(\"Cts/cm: \"));\n  display.print(COUNTS_PER_CM, 1);\n  display.gotoXY(0, 7);\n  display.print(F(\"Cts/deg: \"));\n  display.print(COUNTS_PER_DEGREE, 2);\n  delay(2500);\n  ledGreen(0);\n  ledYellow(0);\n  ledRed(0);\n\n  waitForStart();\n}\n\n// ===== MAIN LOOP - TUNING MODE =====\n// A = test forward 10cm  (tune WHEEL_DIAMETER_MM)\n// B = test turn 90 deg   (tune WHEEL_BASE_MM)\n// C = full square with countdown (verify both)\nvoid loop() {\n  display.clear();\n  display.print(F(\"=== TUNING MODE ===\"));\n  display.gotoXY(0, 2);\n  display.print(F(\"A = Forward 10cm\"));\n  display.gotoXY(0, 3);\n  display.print(F(\"B = Turn 90 deg\"));\n  display.gotoXY(0, 4);\n  display.print(F(\"C = Full square\"));\n  while (true) {\n    checkBattery();\n    if (buttonA.getSingleDebouncedPress()) {\n      display.clear();\n      display.print(F(\"Forward 10cm...\"));\n      delay(500);\n      driveDistance(10);\n      display.clear();\n      display.print(F(\"Done! A/B/C?\"));\n    }\n    if (buttonB.getSingleDebouncedPress()) {\n      display.clear();\n      display.print(F(\"Turn 90 deg...\"));\n      delay(500);\n      turnDegrees(90);\n      display.clear();\n      display.print(F(\"Done! A/B/C?\"));\n    }\n    if (buttonC.getSingleDebouncedPress()) {\n      for (int count = 3; count > 0; count--) {\n        display.clear();\n        display.print(count);\n        buzzer.playNote(NOTE_C(5), 150, 15);\n        delay(1000);\n      }\n      display.clear();\n      display.print(F(\"GO!\"));\n      buzzer.playNote(NOTE_C(6), 300, 15);\n      delay(500);\n      for (int i = 0; i < 4; i++) {\n        display.clear();\n        display.print(F(\"Side \"));\n        display.print(i + 1);\n        display.print(F(\" of 4\"));\n        delay(500);\n        driveDistance(10);\n        delay(750);\n        turnDegrees(90);\n        delay(750);\n      }\n      display.clear();\n      display.print(F(\"Square done!\"));\n      display.gotoXY(0, 2);\n      display.print(F(\"A/B/C?\"));\n    }\n    delay(10);\n  }\n}", "RobotMotion.h": "/*\n=====================================================\nROBOTMOTION.H - Movement Function Declarations\n=====================================================\nThis file DECLARES the movement functions.\nThe actual code (implementation) is in RobotMotion.cpp\n=====================================================\n*/\n#pragma once\n\n// ===== FUNCTION DECLARATIONS =====\n// These tell the compiler \"these functions exist\"\n// The actual code is in RobotMotion.cpp\n\n/*\ndriveDistance()\n----------------\nDrives the robot a specific distance.\nParameters:\n  centimeters - Distance to travel (positive = forward)\nUses encoders for accurate distance control.\n*/\nvoid driveDistance(float centimeters);\n\n/*\nturnDegrees()\n--------------\nTurns the robot a specific angle.\nParameters:\n  degrees - Angle to turn (positive = right, negative = left)\nUses encoders for accurate turn control.\n*/\nvoid turnDegrees(float degrees);\n", "RobotHelpers.h": "/*\n=====================================================\nROBOTHELPERS.H - Standard Helper Declarations\n================ EED;\n  // Start driving\n  motors.setSpeeds(speed, speed);\n  // Keep driving until we reach the target\n  while (abs(encoders.getCountsLeft()) < targetCounts) {\n    delay(10); // Small delay to prevent hogging the CPU\n  }\n  // Stop!\n  motors.setSpeeds(0, 0);\n}\n\nvoid turnDegrees(float degrees) {\n  // Reset encoders\n  encoders.getCountsAndResetLeft();\n  encoders.getCountsAndResetRight();\n  // Calculate target counts for the turn\n  int targetCounts = abs(degrees) * COUNTS_PER_DEGREE;\n  // Set wheel directions for turning\n  // Positive degrees = turn right (left wheel forward, right wheel backward)\n  int leftSpeed = (degrees > 0) ? TURN_SPEED : -TURN_SPEED;\n  int rightSpeed = -leftSpeed; // Opposite direction\n  // Start turning\n  motors.setSpeeds(leftSpeed, rightSpeed);\n  // Keep turning until we reach the target\n  while (abs(encoders.getCountsLeft()) < targetCounts) {\n    delay(10);\n  }\n  // Stop!\n  motors.setSpeeds(0, 0);\n}\n", "main.cpp": "#include \"RobotConfig.h\"\n#include \"RobotSensors.h\"\n#include \"RobotHelpers.h\"\n#include \"RobotMotion.h\"\n\n// ===== SETUP =====\nvoid setup() {\n  Serial.begin(115200);\n  unsigned long serialStart = millis();\n  while (!Serial && (millis() - serialStart < 2000)) {\n    delay(10); // Wait up to 2s for USB serial connection\n  }\n  delay(500);\n  Serial.println(F(\"=== Lesson 7: Code Organization ===\"));\n\n  // ===== BATTERY REPORT =====\n  int batteryVoltage = readBatteryMillivolts();\n  int battWhole = batteryVoltage / 1000;\n  int battDecimal = (batteryVoltage / 10) % 100;\n  Serial.print(F(\"Battery: \"));\n  Serial.print(battWhole);\n  Serial.print(F(\".\"));\n  if (battDecimal < 10) Serial.print(F(\"0\"));\n  Serial.print(battDecimal);\n  Serial.print(F(\"V (\"));\n  Serial.print(batteryVoltage);\n  Serial.println(F(\"mV)\"));\n\n  display.clear();\n  display.setLayout21x8();\n  display.print(F(\"===== Lesson 7 =====\"));\n  display.gotoXY(0, 2);\n  display.print(F(\"Battery: \"));\n  display.print(battWhole);\n  display.print(F(\".\"));\n  if (battDecimal < 10) display.print(F(\"0\"));\n  display.print(battDecimal);\n  display.print(F(\"V\"));\n  display.gotoXY(0, 4);\n  display.print(F(\"Status: \"));\n  if (batteryVoltage >= BATTERY_GOOD) {\n    display.print(F(\"GOOD\"));\n    ledGreen(1);\n  } else if (batteryVoltage >= BATTERY_LOW) {\n    display.print(F(\"LOW\"));\n    ledYellow(1);\n    buzzer.playNote(NOTE_A(4), 200, 15);\n  } else {\n    display.print(F(\"CHARGE!\"));\n    ledRed(1);\n    buzzer.playNote(NOTE_A(3), 500, 15);\n  }\n  display.gotoXY(0, 6);\n  display.print(F(\"Cts/cm: \"));\n  display.print(COUNTS_PER_CM, 1);\n  display.gotoXY(0, 7);\n  display.print(F(\"Cts/deg: \"));\n  display.print(COUNTS_PER_DEGREE, 2);\n  delay(2500);\n  ledGreen(0);\n  ledYellow(0);\n  ledRed(0);\n\n  waitForStart();\n}\n\n// ===== MAIN LOOP - TUNING MODE =====\n// A = test forward 10cm  (tune WHEEL_DIAMETER_MM)\n// B = test turn 90 deg   (tune WHEEL_BASE_MM)\n// C = full square with countdown (verify both)\nvoid loop() {\n  display.clear();\n  display.print(F(\"=== TUNING MODE ===\"));\n  display.gotoXY(0, 2);\n  display.print(F(\"A = Forward 10cm\"));\n  display.gotoXY(0, 3);\n  display.print(F(\"B = Turn 90 deg\"));\n  display.gotoXY(0, 4);\n  display.print(F(\"C = Full square\"));\n  while (true) {\n    checkBattery();\n    if (buttonA.getSingleDebouncedPress()) {\n      display.clear();\n      display.print(F(\"Forward 10cm...\"));\n      delay(500);\n      driveDistance(10);\n      display.clear();\n      display.print(F(\"Done! A/B/C?\"));\n    }\n    if (buttonB.getSingleDebouncedPress()) {\n      display.clear();\n      display.print(F(\"Turn 90 deg...\"));\n      delay(500);\n      turnDegrees(90);\n      display.clear();\n      display.print(F(\"Done! A/B/C?\"));\n    }\n    if (buttonC.getSingleDebouncedPress()) {\n      for (int count = 3; count > 0; count--) {\n        display.clear();\n        display.print(count);\n        buzzer.playNote(NOTE_C(5), 150, 15);\n        delay(1000);\n      }\n      display.clear();\n      display.print(F(\"GO!\"));\n      buzzer.playNote(NOTE_C(6), 300, 15);\n      delay(500);\n      for (int i = 0; i < 4; i++) {\n        display.clear();\n        display.print(F(\"Side \"));\n        display.print(i + 1);\n        display.print(F(\" of 4\"));\n        delay(500);\n        driveDistance(10);\n        delay(750);\n        turnDegrees(90);\n        delay(750);\n      }\n      display.clear();\n      display.print(F(\"Square done!\"));\n      display.gotoXY(0, 2);\n      display.print(F(\"A/B/C?\"));\n    }\n    delay(10);\n  }\n}", "RobotMotion.h": "/*\n=====================================================\nROBOTMOTION.H - Movement Function Declarations\n=====================================================\nThis file DECLARES the movement functions.\nThe actual code (implementation) is in RobotMotion.cpp\n=====================================================\n*/\n#pragma once\n\n// ===== FUNCTION DECLARATIONS =====\n// These tell the compiler \"these functions exist\"\n// The actual code is in RobotMotion.cpp\n\n/*\ndriveDistance()\n----------------\nDrives the robot a specific distance.\nParameters:\n  centimeters - Distance to travel (positive = forward)\nUses encoders for accurate distance control.\n*/\nvoid driveDistance(float centimeters);\n\n/*\nturnDegrees()\n--------------\nTurns the robot a specific angle.\nParameters:\n  degrees - Angle to turn (positive = right, negative = left)\nUses encoders for accurate turn control.\n*/\nvoid turnDegrees(float degrees);\n", "RobotHelpers.h": "/*\n=====================================================\nROBOTHELPERS.H - Standard Helper Declarations\n=====================================================\nThe two helpers that have shipped with every project\nsince Lesson 4. The code is in RobotHelpers.cpp -\nthese lines just promise it exists.\n=====================================================\n*/\n#pragma once\n\n// == rial.println(F(\"mV)\"));\n\n  display.clear();\n  display.setLayout21x8();\n  display.print(F(\"===== Lesson 8 =====\"));\n  display.gotoXY(0, 2);\n  display.print(F(\"Battery: \"));\n  display.print(battWhole);\n  display.print(F(\".\"));\n  if (battDecimal < 10) display.print(F(\"0\"));\n  display.print(battDecimal);\n  display.print(F(\"V\"));\n  display.gotoXY(0, 4);\n  display.print(F(\"Status: \"));\n  if (batteryVoltage >= BATTERY_GOOD) {\n    display.print(F(\"GOOD\"));\n    ledGreen(1);\n  } else if (batteryVoltage >= BATTERY_LOW) {\n    display.print(F(\"LOW\"));\n    ledYellow(1);\n    buzzer.playNote(NOTE_A(4), 200, 15);\n  } else {\n    display.print(F(\"CHARGE!\"));\n    ledRed(1);\n    buzzer.playNote(NOTE_A(3), 500, 15);\n  }\n  display.gotoXY(0, 6);\n  display.print(F(\"Kp: \"));\n  display.print(currentKp, 2);\n  delay(2500);\n  ledGreen(0);\n  ledYellow(0);\n  ledRed(0);\n\n  // ===== LINE SENSOR SETUP =====\n  initLineSensors();\n\n  // ===== SAFETY GATE - before ANY motion =====\n  // Calibration spins the robot, so the A-gate comes FIRST.\n  waitForStart();\n\n  // ===== CALIBRATION =====\n  display.setLayout21x8();\n  display.clear();\n  display.gotoXY(0, 0);\n  display.print(F(\"Place robot on line\"));\n  display.gotoXY(0, 2);\n  display.print(F(\"Press B to calibrate\"));\n  buttonB.waitForButton();\n  display.clear();\n  display.gotoXY(0, 0);\n  display.print(F(\"Calibrating...\"));\n  display.gotoXY(0, 2);\n  display.print(F(\"(spinning)\"));\n  delay(500);\n  calibrateLineSensors();\n  display.clear();\n  display.gotoXY(0, 0);\n  display.print(F(\"Calibration done!\"));\n  delay(1000);\n  showStatus();\n}\n\n// ===== MAIN LOOP =====\nvoid loop() {\n  checkBattery();  // A+B battery report (standard helper)\n}\n", "RobotMotion.h": "/*\n=====================================================\nROBOTMOTION.H - Movement Function Declarations\n=====================================================\nThis file DECLARES the movement functions.\nThe actual code (implementation) is in RobotMotion.cpp\n=====================================================\n*/\n#pragma once\n\n// ===== FUNCTION DECLARATIONS =====\n// These tell the compiler \"these functions exist\"\n// The actual code is in RobotMotion.cpp\n\n/*\ndriveDistance()\n----------------\nDrives the robot a specific distance.\nParameters:\n  centimeters - Distance to travel (positive = forward)\nUses encoders for accurate distance control.\n*/\nvoid driveDistance(float centimeters);\n\n/*\nturnDegrees()\n--------------\nTurns the robot a specific angle.\nParameters:\n  degrees - Angle to turn (positive = right, negative = left)\nUses encoders for accurate turn control.\n*/\nvoid turnDegrees(float degrees);\n", "RobotHelpers.h": "/*\n=====================================================\nROBOTHELPERS.H - Standard Helper Declarations\n=====================================================\nThe two helpers that have shipped with every project\nsince Lesson 4. The code is in RobotHelpers.cpp -\nthese lines just promise it exists.\n=====================================================\n*/\n#pragma once\n\n// ===== HELPER DECLARATIONS =====\nvoid waitForStart();\nvoid checkBattery();\n"}, "after_step_7": {"RobotSensors.cpp": "/*\n=====================================================\nROBOTSENSORS.CPP - Hardware Definitions\n=====================================================\nThis file CREATES all hardware objects.\nThis is the ONLY file that creates them.\nOther files use #include \"RobotSensors.h\" to access them.\nIn later lessons, sensor functions will be added here.\n=====================================================\n*/\n#include <Zumo32U4.h>\n#include \"RobotSensors.h\"\n#include \"RobotConfig.h\"  // NEW - needed for LINE_CENTER, LINE_LOST_THRESHOLD\n\n// ===== HARDWARE OBJECT DEFINITIONS =====\n// These are the REAL objects - created exactly ONCE\nZumo32U4OLED display;\nZumo32U4Buzzer buzzer;\nZumo32U4Motors motors;\nZumo32U4Encoders encoders;\nZumo32U4ButtonA buttonA;\nZumo32U4ButtonB buttonB;\nZumo32U4ButtonC buttonC;\n\n// ===== LINE SENSOR HARDWARE (NEW for Lesson 8) =====\nZumo32U4LineSensors lineSensors;  // NO extern - this file CREATES it\nunsigned int sensorValues[5];     // Array to store the five readings\nint lastPosition = LINE_CENTER;   // Last known line position\n\n// ===== LINE SENSOR FUNCTIONS (NEW for Lesson 8) =====\nvoid initLineSensors() {\n  lineSensors.initFiveSensors();\n}\n\nvoid calibrateLineSensors() {\n  for (int i = 0; i < 100; i++) {\n    if (i < 50) {\n      motors.setSpeeds(-100, 100);  // Spin left\n    } else {\n      motors.setSpeeds(100, -100);  // Spin right\n    }\n    lineSensors.calibrate();\n  }\n  motors.setSpeeds(0, 0);\n}\n\nint readLinePosition() {\n  lastPosition = lineSensors.readLine(sensorValues);\n  return lastPosition;\n}\n\nbool isLineVisible() {\n  lineSensors.readCalibrated(sensorValues);  // Calibrated: 0 = white, 1000 = black\n  unsigned int sum = 0;\n  for (int i = 0; i < 5; i++) {\n    sum += sensorValues[i];\n  }\n  return sum > LINE_LOST_THRESHOLD;\n}\n", "RobotSensors.h": "/*\n=====================================================\nROBOTSENSORS.H - Hardware & Sensor Declarations\n=====================================================\nDeclares ALL hardware objects used across the project.\nThe actual objects are DEFINED in RobotSensors.cpp.\nThe keyword \"extern\" means: \"this object exists\nsomewhere else - let me use it here.\"\n=====================================================\n*/\n#pragma once\n#include <Zumo32U4.h>\n\n// ===== EXTERN HARDWARE DECLARATIONS =====\n// These tell other files \"these objects exist\"\n// The actual objects are created in RobotSensors.cpp\nextern Zumo32U4OLED display;\nextern Zumo32U4Buzzer buzzer;\nextern Zumo32U4Motors motors;\nextern Zumo32U4Encoders encoders;\nextern Zumo32U4ButtonA buttonA;\nextern Zumo32U4ButtonB buttonB;\nextern Zumo32U4ButtonC buttonC;\nextern Zumo32U4LineSensors lineSensors;  // NEW for Lesson 8\n\n// ===== LINE SENSOR FUNCTIONS (NEW for Lesson 8) =====\nvoid initLineSensors();\nvoid calibrateLineSensors();\nint readLinePosition();\nbool isLineVisible();\n", "RobotHelpers.cpp": "/*\n=====================================================\nROBOTHELPERS.CPP - Standard Helper Implementations\n=====================================================\nSame code you have used since Lesson 4 - it just\nlives in its own module now. Needs the hardware,\nso it includes RobotSensors.h.\n=====================================================\n*/\n#include <Zumo32U4.h>\n#include \"RobotSensors.h\"\n#include \"RobotHelpers.h\"\n\n// ----- STANDARD HELPERS (added after Lesson 3) -----\n\n/*\nwaitForStart()\n--------------\nSAFETY GATE: nothing moves until Button A is pressed.\nCall it at the END of setup(), always.\n*/\nvoid waitForStart() {\n  display.clear();\n  display.print(F(\"Press A\"));\n  display.gotoXY(0, 1);\n  display.print(F(\"to start\"));\n  buttonA.waitForButton();\n  display.clear();\n  delay(500);  // time to get your hands clear\n}\n\n/*\ncheckBattery()\n--------------\nHold A + B together at any time to see the battery.\nCall it at the TOP of the polling loop.\n*/\nvoid checkBattery() {\n  if (buttonA.isPressed() && buttonB.isPressed()) {\n    display.clear();\n    display.print(F(\"Battery\"));\n    display.gotoXY(0, 1);\n    int mv = readBatteryMillivolts();\n    display.print(mv);\n    display.print(F(\" mV\"));\n    while (buttonA.isPressed() || buttonB.isPressed()) {\n      // wait for release\n    }\n    delay(200);\n    display.clear();\n  }\n}\n", "RobotConfig.h": "/*\n=====================================================\nROBOTCONFIG.H - Robot Calibration Settings\n=====================================================\nAll robot-specific values in ONE place!\nEdit this file to tune your robot's performance.\n=====================================================\n*/\n#pragma once\n\n// ===== PHYSICAL PROPERTIES =====\n// These values define your robot's hardware\n\n// Encoder counts per complete wheel rotation\n// (12 counts/motor rotation x 75.81 gear ratio = 909.7)\nconst float COUNTS_PER_ROTATION = 909.7;\n\n// Wheel diameter in millimeters (measure yours!)\nconst float WHEEL_DIAMETER_MM = 39.0;\n\n// Wheel circumference = pi x diameter\nconst float WHEEL_CIRCUMFERENCE_MM = 3.14159 * WHEEL_DIAMETER_MM;\n\n// Encoder counts per centimeter of travel\nconst float COUNTS_PER_CM = COUNTS_PER_ROTATION / (WHEEL_CIRCUMFERENCE_MM / 10.0);\n\n// ===== TURNING PROPERTIES =====\n// Distance between wheel centers - this is a CALIBRATION value!\n// Start at 85.0 (physical measurement), then tune up until 90 degree\n// turns are accurate. Typical tuned values: 98-115 depending on\n// surface and wheel wear.\nconst float WHEEL_BASE_MM = 85.0;\n\n// Circumference of the turn circle\nconst float TURN_CIRCUMFERENCE_MM = 3.14159 * WHEEL_BASE_MM;\n\n// Encoder counts per degree of rotation\nconst float COUNTS_PER_DEGREE = (TURN_CIRCUMFERENCE_MM / 360.0) *\n                                (COUNTS_PER_ROTATION / WHEEL_CIRCUMFERENCE_MM);\n\n// ===== SPEED SETTINGS =====\n// Adjust these to change robot behavior\nconst int DRIVE_SPEED = 150;   // Speed for straight driving (0-400)\nconst int TURN_SPEED = 150;    // Speed for turning (0-400)\n\n// ===== BATTERY THRESHOLDS =====\nconst int BATTERY_GOOD = 4800; // millivolts - fully charged\nconst int BATTERY_LOW = 4200;  // millivolts - charge soon\n\n// ===== LINE FOLLOWING CONSTANTS (NEW for Lesson 8) =====\nconst int LINE_CENTER = 2000;            // Setpoint - line under middle sensor (0-4000 range)\nconst int BASE_SPEED = 150;              // Forward speed when centered (0-400)\nconst float KP = 0.1;                    // Proportional gain (tune this!)\nconst int MAX_SPEED = 300;               // Speed limit after correction\nconst int LINE_LOST_THRESHOLD = 200;     // Calibrated sum below this = no line\nconst unsigned long MAX_GAP_TIME = 500;  // Max milliseconds to cross a gap\n", "RobotMotion.cpp": "/*\n=====================================================\nROBOTMOTION.CPP - Movement Function Implementations\n=====================================================\nThis file IMPLEMENTS the movement functions\ndeclared in RobotMotion.h\n=====================================================\n*/\n#include <Zumo32U4.h>\n#include \"RobotConfig.h\"\n#include \"RobotSensors.h\"\n#include \"RobotMotion.h\"\n\n// ===== FUNCTION IMPLEMENTATIONS =====\n\nvoid driveDistance(float centimeters) {\n  // Reset encoders to start counting from zero\n  encoders.getCountsAndResetLeft();\n  encoders.getCountsAndResetRight();\n  // Calculate how many encoder counts we need\n  int targetCounts = abs(centimeters) * COUNTS_PER_CM;\n  // Set motor direction based on positive/negative distance\n  int speed = (centimeters > 0) ? DRIVE_SPEED : -DRIVE_SPEED;\n  // Start driving\n  motors.setSpeeds(speed, speed);\n  // Keep driving until we reach the target\n  while (abs(encoders.getCountsLeft()) < targetCounts) {\n    delay(10); // Small delay to prevent hogging the CPU\n  }\n  // Stop!\n  motors.setSpeeds(0, 0);\n}\n\nvoid turnDegrees(float degrees) {\n  // Reset encoders\n  encoders.getCountsAndResetLeft();\n  encoders.getCountsAndResetRight();\n  // Calculate target counts for the turn\n  int targetCounts = abs(degrees) * COUNTS_PER_DEGREE;\n  // Set wheel directions for turning\n  // Positive degrees = turn right (left wheel forward, right wheel backward)\n  int leftSpeed = (degrees > 0) ? TURN_SPEED : -TURN_SPEED;\n  int rightSpeed = -leftSpeed; // Opposite direction\n  // Start turning\n  motors.setSpeeds(leftSpeed, rightSpeed);\n  // Keep turning until we reach the target\n  while (abs(encoders.getCountsLeft()) < targetCounts) {\n    delay(10);\n  }\n  // Stop!\n  motors.setSpeeds(0, 0);\n}\n", "main.cpp": "#include \"RobotConfig.h\"\n#include \"RobotSensors.h\"\n#include \"RobotHelpers.h\"\n\n// ===== LINE FOLLOWING STATE =====\nfloat currentKp = KP;            // Live-tunable copy of KP\nbool isRunning = false;          // Is the robot following right now?\n\nvoid showStatus() {\n  display.setLayout21x8();\n  display.clear();\n  display.gotoXY(0, 0);\n  display.print(isRunning ? F(\"RUNNING\") : F(\"STOPPED\"));\n  display.gotoXY(0, 2);\n  display.print(F(\"Kp: \"));\n  display.print(currentKp, 2);\n  display.gotoXY(0, 4);\n  display.print(F(\"A- B:Go C+\"));\n}\n\nvoid followLine() {\n  int position = readLinePosition();\n  int error = position - LINE_CENTER;\n  int correction = currentKp * error;\n  int leftSpeed = BASE_SPEED + correction;\n  int rightSpeed = BASE_SPEED - correction;\n  leftSpeed = constrain(leftSpeed, -MAX_SPEED, MAX_SPEED);\n  rightSpeed = constrain(rightSpeed, -MAX_SPEED, MAX_SPEED);\n  motors.setSpeeds(leftSpeed, rightSpeed);\n}\n\n// ===== SETUP =====\nvoid setup() {\n  Serial.begin(115200);\n  unsigned long serialStart = millis();\n  while (!Serial && (millis() - serialStart < 2000)) {\n    delay(10); // Wait up to 2s for USB serial connection\n  }\n  delay(500);\n  Serial.println(F(\"=== Lesson 8: Line Following ===\"));\n\n  // ===== BATTERY REPORT =====\n  int batteryVoltage = readBatteryMillivolts();\n  int battWhole = batteryVoltage / 1000;\n  int battDecimal = (batteryVoltage / 10) % 100;\n  Serial.print(F(\"Battery: \"));\n  Serial.print(battWhole);\n  Serial.print(F(\".\"));\n  if (battDecimal < 10) Serial.print(F(\"0\"));\n  Serial.print(battDecimal);\n  Serial.print(F(\"V (\"));\n  Serial.print(batteryVoltage);\n  Serial.println(F(\"mV)\"));\n\n  display.clear();\n  display.setLayout21x8();\n  display.print(F(\"===== Lesson 8 =====\"));\n  display.gotoXY(0, 2);\n  display.print(F(\"Battery: \"));\n  display.print(battWhole);\n  display.print(F(\".\"));\n  if (battDecimal < 10) display.print(F(\"0\"));\n  display.print(battDecimal);\n  display.print(F(\"V\"));\n  display.gotoXY(0, 4);\n  display.print(F(\"Status: \"));\n  if (batteryVoltage >= BATTERY_GOOD) {\n    display.print(F(\"GOOD\"));\n    ledGreen(1);\n  } else if (batteryVoltage >= BATTERY_LOW) {\n    display.print(F(\"LOW\"));\n    ledYellow(1);\n    buzzer.playNote(NOTE_A(4), 200, 15);\n  } else {\n    display.print(F(\"CHARGE!\"));\n    ledRed(1);\n    buzzer.playNote(NOTE_A(3), 500, 15);\n  }\n  display.gotoXY(0, 6);\n  display.print(F(\"Kp: \"));\n  display.print(currentKp, 2);\n  delay(2500);\n  ledGreen(0);\n  ledYellow(0);\n  ledRed(0);\n\n  // ===== LINE SENSOR SETUP =====\n  initLineSensors();\n\n  // ===== SAFETY GATE - before ANY motion =====\n  // Calibration spins the robot, so the A-gate comes FIRST.\n  waitForStart();\n\n  // ===== CALIBRATION =====\n  display.setLayout21x8();\n  display.clear();\n  display.gotoXY(0, 0);\n  display.print(F(\"Place robot on line\"));\n  display.gotoXY(0, 2);\n  display.print(F(\"Press B to calibrate\"));\n  buttonB.waitForButton();\n  display.clear();\n  display.gotoXY(0, 0);\n  display.print(F(\"Calibrating...\"));\n  display.gotoXY(0, 2);\n  display.print(F(\"(spinning)\"));\n  delay(500);\n  calibrateLineSensors();\n  display.clear();\n  display.gotoXY(0, 0);\n  display.print(F(\"Calibration done!\"));\n  delay(1000);\n  showStatus();\n}\n\n// ===== MAIN LOOP =====\n// B = start/stop  (A and C get their jobs in Step 8)\nvoid loop() {\n  if (!isRunning) {\n    checkBattery();  // A+B battery report - only while stopped, never mid-run\n  }\n\n  if (buttonB.getSingleDebouncedPress()) {\n    isRunning = !isRunning;\n    if (isRunning) {\n      // 3-2-1 countdown before starting\n      for (int count = 3; count > 0; count--) {\n        display.setLayout21x8();\n        display.clear();\n        display.gotoXY(0, 0);\n        display.print(count);\n        buzzer.playNote(NOTE_C(5), 150, 15);\n        delay(1000);\n      }\n      display.clear();\n      display.gotoXY(0, 0);\n      display.print(F(\"GO!\"));\n      buzzer.playNote(NOTE_C(6), 300, 15);\n      delay(500);\n    } else {\n      motors.setSpeeds(0, 0);\n    }\n    showStatus();\n  }\n\n  if (isRunning) {\n    followLine();\n  }\n}\n", "RobotMotion.h": "/*\n=====================================================\nROBOTMOTION.H - Movement Function Declarations\n=====================================================\nThis file DECLARES the movement functions.\nThe actual code (implementation) is in RobotMotion.cpp\n=====================================================\n*/\n#pragma once\n\n// ===== FUNCTION DECLARATIONS =====\n// These tell the compiler \"these functions exist\"\n// The actual code is in RobotMotion.cpp\n\n/*\ndriveDistance()\n----------------\nDrives the robot a specific distance.\nParameters:\n  centimeters - Distance to travel (positive = forward)\nUses encoders for accurate distance control.\n*/\nvoid driveDistance(float centimeters);\n\n/*\nturnDegrees()\n--------------\nTurns the robot a specific angle.\nParameters:\n  degrees - Angle to turn (positive = right, negative = left)\nUses encoders for accurate turn control.\n*/\nvoid turnDegrees(float degrees);\n", "RobotHelpers.h": "/*\n=====================================================\nROBOTHELPERS.H - Standard Helper Declarations\n=====================================================\nThe two helpers that have shipped with every project\nsince Lesson 4. The code is in RobotHelpers.cpp -\nthese lines just promise it exists.\n=====================================================\n*/\n#pragma once\n\n// ===== HELPER DECLARATIONS =====\nvoid waitForStart();\nvoid checkBattery();\n"}, "finished": {"RobotSensors.cpp": "/*\n=====================================================\nROBOTSENSORS.CPP - Hardware Definitions\n=====================================================\nThis file CREATES all hardware objects.\nThis is the ONLY file that creates them.\nOther files use #include \"RobotSensors.h\" to access them.\nIn later lessons, sensor functions will be added here.\n=====================================================\n*/\n#include <Zumo32U4.h>\n#include \"RobotSensors ettings\n=====================================================\nAll robot-specific values in ONE place!\nEdit this file to tune your robot's performance.\n=====================================================\n*/\n#pragma once\n\n// ===== PHYSICAL PROPERTIES =====\n// These values define your robot's hardware\n\n// Encoder counts per complete wheel rotation\n// (12 counts/motor rotation x 75.81 gear ratio = 909.7)\nconst float COUNTS_PER_ROTATION = 909.7;\n\n// Wheel diameter in millimeters (measure yours!)\nconst float WHEEL_DIAMETER_MM = 39.0;\n\n// Wheel circumference = pi x diameter\nconst float WHEEL_CIRCUMFERENCE_MM = 3.14159 * WHEEL_DIAMETER_MM;\n\n// Encoder counts per centimeter of travel\nconst float COUNTS_PER_CM = COUNTS_PER_ROTATION / (WHEEL_CIRCUMFERENCE_MM / 10.0);\n\n// ===== TURNING PROPERTIES =====\n// Distance between wheel centers - this is a CALIBRATION value!\n// Start at 85.0 (physical measurement), then tune up until 90 degree\n// turns are accurate. Typical tuned values: 98-115 depending on\n// surface and wheel wear.\nconst float WHEEL_BASE_MM = 85.0;\n\n// Circumference of the turn circle\nconst float TURN_CIRCUMFERENCE_MM = 3.14159 * WHEEL_BASE_MM;\n\n// Encoder counts per degree of rotation\nconst float COUNTS_PER_DEGREE = (TURN_CIRCUMFERENCE_MM / 360.0) *\n                                (COUNTS_PER_ROTATION / WHEEL_CIRCUMFERENCE_MM);\n\n// ===== SPEED SETTINGS =====\n// Adjust these to change robot behavior\nconst int DRIVE_SPEED = 150;   // Speed for straight driving (0-400)\nconst int TURN_SPEED = 150;    // Speed for turning (0-400)\n\n// ===== BATTERY THRESHOLDS =====\nconst int BATTERY_GOOD = 4800; // millivolts - fully charged\nconst int BATTERY_LOW = 4200;  // millivolts - charge soon\n\n// ===== LINE FOLLOWING CONSTANTS (NEW for Lesson 8) =====\nconst int LINE_CENTER = 2000;            // Setpoint - line under middle sensor (0-4000 range)\nconst int BASE_SPEED = 150;              // Forward speed when centered (0-400)\nconst float KP = 0.1;                    // Proportional gain (tune this!)\nconst int MAX_SPEED = 300;               // Speed limit after correction\nconst int LINE_LOST_THRESHOLD = 200;     // Calibrated sum below this = no line\nconst unsigned long MAX_GAP_TIME = 500;  // Max milliseconds to cross a gap\n", "RobotMotion.cpp": "/*\n=====================================================\nROBOTMOTION.CPP - Movement Function Implementations\n=====================================================\nThis file IMPLEMENTS the movement functions\ndeclared in RobotMotion.h\n=====================================================\n*/\n#include <Zumo32U4.h>\n#include \"RobotConfig.h\"\n#include \"RobotSensors.h\"\n#include \"RobotMotion.h\"\n\n// ===== FUNCTION IMPLEMENTATIONS =====\n\nvoid driveDistance(float centimeters) {\n  // Reset encoders to start counting from zero\n  encoders.getCountsAndResetLeft();\n  encoders.getCountsAndResetRight();\n  // Calculate how many encoder counts we need\n  int targetCounts = abs(centimeters) * COUNTS_PER_CM;\n  // Set motor direction based on positive/negative distance\n  int speed = (centimeters > 0) ? DRIVE_SPEED : -DRIVE_SPEED;\n  // Start driving\n  motors.setSpeeds(speed, speed);\n  // Keep driving until we reach the target\n  while (abs(encoders.getCountsLeft()) < targetCounts) {\n    delay(10); // Small delay to prevent hogging the CPU\n  }\n  // Stop!\n  motors.setSpeeds(0, 0);\n}\n\nvoid turnDegrees(float degrees) {\n  // Reset encoders\n  encoders.getCountsAndResetLeft();\n  encoders.getCountsAndResetRight();\n  // Calculate target counts for the turn\n  int targetCounts = abs(degrees) * COUNTS_PER_DEGREE;\n  // Set wheel directions for turning\n  // Positive degrees = turn right (left wheel forward, right wheel backward)\n  int leftSpeed = (degrees > 0) ? TURN_SPEED : -TURN_SPEED;\n  int rightSpeed = -leftSpeed; // Opposite direction\n  // Start turning\n  motors.setSpeeds(leftSpeed, rightSpeed);\n  // Keep turning until we reach the target\n  while (abs(encoders.getCountsLeft()) < targetCounts) {\n    delay(10);\n  }\n  // Stop!\n  motors.setSpeeds(0, 0);\n}\n", "main.cpp": "#include \"RobotConfig.h\"\n#include \"RobotSensors.h\"\n#include \"RobotHelpers.h\"\n\n// ===== LINE FOLLOWING STATE =====\nfloat currentKp = KP;            // Live-tunable copy of KP\nbool isRunning = false;          // Is the robot following right now?\nunsigned long gapStartTime = 0;  // When did the line disappear?\n\nvoid showStatus() {\n  display.setLayout21x8();\n  display.clear();\n  display.gotoXY(0, 0);\n  display.print(isRunning ? F(\"RUNNING\") : F(\"STOPPED\"));\n  display.gotoXY(0, 2);\n  display.print(F(\"Kp: \"));\n  display.print(currentKp, 2);\n  display.gotoXY(0, 4);\n  display.print(F(\"A- B:Go C+\"));\n}\n\nvoid followLine() {\n  int position = readLinePosition();\n  int error = position - LINE_CENTER;\n  int correction = currentKp * error;\n  int leftSpeed = BASE_SPEED + correction;\n  int rightSpeed = BASE_SPEED - correction;\n  leftSpeed = constrain(leftSpeed, -MAX_SPEED, MAX_SPEED);\n  rightSpeed = constrain(rightSpeed, -MAX_SPEED, MAX_SPEED);\n  motors.setSpeeds(leftSpeed, rightSpeed);\n}\n\nvoid handleGap() {\n  if (gapStartTime == 0) {\n    gapStartTime = millis();\n  }\n  if (millis() - gapStartTime > MAX_GAP_TIME) {\n    motors.setSpeeds(0, 0);\n    isRunning = false;\n    display.setLayout21x8();\n    display.clear();\n    display.gotoXY(0, 0);\n    display.print(F(\"LINE LOST!\"));\n    display.gotoXY(0, 2);\n    display.print(F(\"Press B to retry\"));\n    return;\n  }\n  motors.setSpeeds(BASE_SPEED, BASE_SPEED);\n}\n\n// ===== SETUP =====\nvoid setup() {\n  Serial.begin(115200);\n  unsigned long serialStart = millis();\n  while (!Serial && (millis() - serialStart < 2000)) {\n    delay(10); // Wait up to 2s for USB serial connection\n  }\n  delay(500);\n  Serial.println(F(\"=== Lesson 8: Line Following ===\"));\n\n  // ===== BATTERY REPORT =====\n  int batteryVoltage = readBatteryMillivolts();\n  int battWhole = batteryVoltage / 1000;\n  int battDecimal = (batteryVoltage / 10) % 100;\n  Serial.print(F(\"Battery: \"));\n  Serial.print(battWhole);\n  Serial.print(F(\".\"));\n  if (battDecimal < 10) Serial.print(F(\"0\"));\n  Serial.print(battDecimal);\n  Serial.print(F(\"V (\"));\n  Serial.print(batteryVoltage);\n  Serial.println(F(\"mV)\"));\n\n  display.clear();\n  display.setLayout21x8();\n  display.print(F(\"===== Lesson 8 =====\"));\n  display.gotoXY(0, 2);\n  display.print(F(\"Battery: \"));\n  display.print(battWhole);\n  display.print(F(\".\"));\n  if (battDecimal < 10) display.print(F(\"0\"));\n  display.print(battDecimal);\n  display.print(F(\"V\"));\n  display.gotoXY(0, 4);\n  display.print(F(\"Status: \"));\n  if (batteryVoltage >= BATTERY_GOOD) {\n    display.print(F(\"GOOD\"));\n    ledGreen(1);\n  } else if (batteryVoltage >= BATTERY_LOW) {\n    display.print(F(\"LOW\"));\n    ledYellow(1);\n    buzzer.playNote(NOTE_A(4), 200, 15);\n  } else {\n    display.print(F(\"CHARGE!\"));\n    ledRed(1);\n    buzzer.playNote(NOTE_A(3), 500, 15);\n  }\n  display.gotoXY(0, 6);\n  display.print(F(\"Kp: \"));\n  display.print(currentKp, 2);\n  delay(2500);\n  ledGreen(0);\n  ledYellow(0);\n  ledRed(0);\n\n  // ===== LINE SENSOR SETUP =====\n  initLineSensors();\n\n  // ===== SAFETY GATE - before ANY motion =====\n  // Calibration spins the robot, so the A-gate comes FIRST.\n  waitForStart();\n\n  // ===== CALIBRATION =====\n  display.setLayout21x8();\n  display.clear();\n  display.gotoXY(0, 0);\n  display.print(F(\"Place robot on line\"));\n  display.gotoXY(0, 2);\n  display.print(F(\"Press B to calibrate\"));\n  buttonB.waitForButton();\n  display.clear();\n  display.gotoXY(0, 0);\n  display.print(F(\"Calibrating...\"));\n  display.gotoXY(0, 2);\n  display.print(F(\"(spinning)\"));\n  delay(500);\n  calibrateLineSensors();\n  display.clear();\n  display.gotoXY(0, 0);\n  display.print(F(\"Calibration done!\"));\n  delay(1000);\n  showStatus();\n}\n\n// ===== MAIN LOOP =====\n// A = Kp down   B = start/stop   C = Kp up\nvoid loop() {\n  if (!isRunning) {\n    checkBattery();  // A+B battery report - only while stopped, never mid-run\n  }\n\n  if (buttonA.isPressed() && !isRunning) {\n    currentKp -= 0.02;\n    if (currentKp < 0.02) currentKp = 0.02;\n    showStatus();\n    delay(200);\n  }\n  if (buttonB.getSingleDebouncedPress()) {\n    isRunning = !isRunning;\n    if (isRunning) {\n      // 3-2-1 countdown before starting\n      for (int count = 3; count > 0; count--) {\n        display.setLayout21x8();\n        display.clear();\n        display.gotoXY(0, 0);\n        display.print(count);\n        buzzer.playNote(NOTE_C(5), 150, 15);\n        delay(1000);\n      }\n      display.clear();\n      display.gotoXY(0, 0);\n      display.print(F(\"GO!\"));\n      buzzer.playNote(NOTE_C(6), 300, 15);\n      delay(500);\n    } else {\n      motors.setSpeeds(0, 0);\n    }\n    showStatus();\n  }\n  if (buttonC.isPressed() && !isRunning) {\n    currentKp += 0.02;\n    if (currentKp > 1.0) currentKp = 1.0;\n    showStatus();\n    delay(200);\n  }\n\n  if (isRunning) {\n    if (isLineVisible()) {\n      gapStartTime = 0;   // Line is back - reset the gap timer\n      followLine();\n    } else {\n      handleGap();\n    }\n  }\n}\n", "RobotMotion.h": "/*\n=====================================================\nROBOTMOTION.H - Movement Function Declarations\n=====================================================\nThis file DECLARES the movement functions.\nThe actual code (implementation) is in RobotMotion.cpp\n=====================================================\n*/\n#pragma once\n\n// ===== FUNCTION DECLARATIONS =====\n// These tell the compiler \"these functions exist\"\n// The actual code is in RobotMotion.cpp\n\n/*\ndriveDistance()\n----------------\nDrives the robot a specific distance.\nParameters:\n  centimeters - Distance to travel (positive = forward)\nUses encoders for accurate distance control.\n*/\nvoid driveDistance(float centimeters);\n\n/*\nturnDegrees()\n--------------\nTurns the robot a specific angle.\nParameters:\n  degrees - Angle to turn (positive = right, negative = left)\nUses encoders for accurate turn control.\n*/\nvoid turnDegrees(float degrees);\n", "RobotHelpers.h": "/*\n=====================================================\nROBOTHELPERS.H - Standard Helper Declarations\n=====================================================\nThe two helpers that have shipped with every project\nsince Lesson 4. The code is in RobotHelpers.cpp -\nthese lines just promise it exists.\n=====================================================\n*/\n#pragma once\n\n// ===== HELPER DECLARATIONS =====\nvoid waitForStart();\nvoid checkBattery();\n"}, "backwards_correction": {"RobotSensors.cpp": "/*\n=====================================================\nROBOTSENSORS.CPP - Hardware Definitions\n=====================================================\nThis file CREATES all hardware objects.\nThis is the ONLY file that creates them.\nOther files use #include \"RobotSensors.h\" to access them.\nIn later lessons, sensor functions will be added here.\n=====================================================\n*/\n#include <Zumo32U4.h>\n#include \"RobotSensors.h\"\n#include \"RobotConfig.h\"  // NEW - needed for LINE_CENTER, LINE_LOST_THRESHOLD\n\n// ===== HARDWARE OBJECT DEFINITIONS =====\n// These are the REAL objects - created exactly ONCE\nZumo32U4OLED display;\nZumo32U4Buzzer buzzer;\nZumo32U4Motors motors;\nZumo32U4Encoders encoders;\nZumo32U4ButtonA buttonA;\nZumo32U4ButtonB buttonB;\nZumo32U4ButtonC buttonC;\n\n// ===== LINE SENSOR HARDWARE (NEW for Lesson 8) =====\nZumo32U4LineSensors lineSensors;  // NO extern - this file CREATES it\nunsigned int sensorValues[5];     // Array to store the five readings\nint lastPosition = LINE_CENTER;   // Last known line position\n\n// ===== LINE SENSOR FUNCTIONS (NEW for Lesson 8) =====\nvoid initLineSensors() {\n  lineSensors.initFiveSensors();\n}\n\nvoid calibrateLineSensors() {\n  for (int i = 0; i < 100; i++) {\n    if (i < 50) {\n      motors.setSpeeds(-100, 100);  // Spin left\n    } else {\n      motors.setSpeeds(100, -100);  // Spin right\n    }\n    lineSensors.calibrate();\n  }\n  motors.setSpeeds(0, 0);\n}\n\nint readLinePosition() {\n  lastPosition = lineSensors.readLine(sensorValues);\n  return lastPosition;\n}\n\nbool isLineVisible() {\n  lineSensors.readCalibrated(sensorValues);  // Calibrated: 0 = white, 1000 = black\n  unsigned int sum = 0;\n  for (int i = 0; i < 5; i++) {\n    sum += sensorValues[i];\n  }\n  return sum > LINE_LOST_THRESHOLD;\n}\n", "RobotSensors.h": "/*\n=====================================================\nROBOTSENSORS.H - Hardware & Sensor Declarations\n=====================================================\nDeclares ALL hardware objects used across the project.\nThe actual objects are DEFINED in RobotSensors.cpp.\nThe keyword \"extern\" means: \"this object exists\nsomewhere else - let me use it here.\"\n=====================================================\n*/\n#pragma once\n#include <Zumo32U4.h>\n\n// ===== EXTERN HARDWARE DECLARATIONS =====\n// These tell other files \"these objects exist\"\n// The actual objects are created in RobotSensors.cpp\nextern Zumo32U4OLED display;\nextern Zumo32U4Buzzer buzzer;\nextern Zumo32U4Motors motors;\nextern Zumo32U4Encoders encoders;\nextern Zumo32U4ButtonA buttonA;\nextern Zumo32U4ButtonB buttonB;\nextern Zumo32U4ButtonC buttonC;\nextern Zumo32U4LineSensors lineSensors;  // NEW for Lesson 8\n\n// ===== LINE SENSOR FUNCTIONS (NEW for Lesson 8) =====\nvoid initLineSensors();\nvoid calibrateLineSensors();\nint readLinePosition();\nbool isLineVisible();\n", "RobotHelpers.cpp": "/*\n=====================================================\nROBOTHELPERS.CPP - Standard Helper Implementations\n=====================================================\nSame code you have used since Lesson 4 - it just\nlives in its own module now. Needs the hardware,\nso it includes RobotSensors.h.\n=====================================================\n*/\n#include <Zumo32U4.h>\n#include \"RobotSensors.h\"\n#include \"RobotHelpers.h\"\n\n// ----- STANDARD HELPERS (added after Lesson 3) -----\n\n/*\nwaitForStart()\n--------------\nSAFETY GATE: nothing moves until Button A is pressed.\nCall it at the END of setup(), always.\n*/\nvoid waitForStart() {\n  display.clear();\n  display.print(F(\"Press A\"));\n  display.gotoXY(0, 1);\n  display.print(F(\"to start\"));\n  buttonA.waitForButton();\n  display.clear();\n  delay(500);  // time to get your hands clear\n}\n\n/*\ncheckBattery()\n--------------\nHold A + B together at any time to see the battery.\nCall it at the TOP of the polling loop.\n*/\nvoid checkBattery() {\n  if (buttonA.isPressed() && buttonB.isPressed()) {\n    display.clear();\n    display.print(F(\"Battery\"));\n    display.gotoXY(0, 1);\n    int mv = readBatteryMillivolts();\n    display.print(mv);\n    display.print(F(\" mV\"));\n    while (buttonA.isPressed() || buttonB.isPressed()) {\n      // wait for release\n    }\n    delay(200);\n    display.clear();\n  }\n}\n", "RobotConfig.h": "/*\n=====================================================\nROBOTCONFIG.H - Robot Calibration Settings\n=====================================================\nAll robot-specific values in ONE place!\nEdit this file to tune your robot's performance.\n=====================================================\n*/\n#pragma once\n\n// ===== PHYSICAL PROPERTIES =====\n// These values define your robot's hardware\n\n// Encoder counts per complete wheel rotation\n// (12 counts/motor rotation x 75.81 gear ratio = 909.7)\nconst float COUNTS_PER_ROTATION = 909.7;\n\n// Wheel diameter in millimeters (measure yours!)\nconst float WHEEL_DIAMETER_MM = 39.0;\n\n// Wheel circumference = pi x diameter\nconst float WHEEL_CIRCUMFERENCE_MM = 3.14159 * WHEEL_DIAMETER_MM;\n\n// Encoder counts per centimeter of travel\nconst float COUNTS_PER_CM = COUNTS_PER_ROTATION / (WHEEL_CIRCUMFERENCE_MM / 10.0);\n\n// ===== TURNING PROPERTIES =====\n// Distance between wheel centers - this is a CALIBRATION value!\n// Start at 85.0 (physical measurement), then tune up until 90 degree\n// turns are accurate. Typical tuned values: 98-115 depending on\n// surface and wheel wear.\nconst float WHEEL_BASE_MM = 85.0;\n\n// Circumference of the turn circle\nconst float TURN_CIRCUMFERENCE_MM = 3.14159 * WHEEL_BASE_MM;\n\n// Encoder counts per degree of rotation\nconst float COUNTS_PER_DEGREE = (TURN_CIRCUMFERENCE_MM / 360.0) *\n                                (COUNTS_PER_ROTATION / WHEEL_CIRCUMFERENCE_MM);\n\n// ===== SPEED SETTINGS =====\n// Adjust these to change robot behavior\nconst int DRIVE_SPEED = 150;   // Speed for straight driving (0-400)\nconst int TURN_SPEED = 150;    // Speed for turning (0-400)\n\n// ===== BATTERY THRESHOLDS =====\nconst int BATTERY_GOOD = 4800; // millivolts - fully charged\nconst int BATTERY_LOW = 4200;  // millivolts - charge soon\n\n// ===== LINE FOLLOWING CONSTANTS (NEW for Lesson 8) =====\nconst int LINE_CENTER = 2000;            // Setpoint - line under middle sensor (0-4000 range)\nconst int BASE_SPEED = 150;              // Forward speed when centered (0-400)\nconst float KP = 0.1;                    // Proportional gain (tune this!)\nconst int MAX_SPEED = 300;               // Speed limit after correction\nconst int LINE_LOST_THRESHOLD = 200;     // Calibrated sum below this = no line\nconst unsigned long MAX_GAP_TIME = 500;  // Max milliseconds to cross a gap\n", "RobotMotion.cpp": "/*\n=====================================================\nROBOTMOTION.CPP - Movement Function Implementations\n=====================================================\nThis file IMPLEMENTS the movement functions\ndeclared in RobotMotion.h\n=====================================================\n*/\n#include <Zumo32U4.h>\n#include \"RobotConfig.h\"\n#include \"RobotSensors.h\"\n#include \"RobotMotion.h\"\n\n// ===== FUNCTION IMPLEMENTATIONS =====\n\nvoid driveDistance(float centimeters) {\n  // Reset encoders to start counting from zero\n  encoders.getCountsAndResetLeft();\n  encoders.getCountsAndResetRight();\n  // Calculate how many encoder counts we need\n  int targetCounts = abs(centimeters) * COUNTS_PER_CM;\n  // Set motor direction based on positive/negative distance\n  int speed = (centimeters > 0) ? DRIVE_SPEED : -DRIVE_SPEED;\n  // Start driving\n  motors.setSpeeds(speed, speed);\n  // Keep driving until we reach the target\n  while (abs(encoders.getCountsLeft()) < targetCounts) {\n    delay(10); // Small delay to prevent hogging the CPU\n  }\n  // Stop!\n  motors.setSpeeds(0, 0);\n}\n\nvoid turnDegrees(float degrees) {\n  // Reset encoders\n  encoders.getCountsAndResetLeft();\n  encoders.getCountsAndResetRight();\n  // Calculate target counts for the turn\n  int targetCounts = abs(degrees) * COUNTS_PER_DEGREE;\n  // Set wheel directions for turning\n  // Positive degrees = turn right (left wheel forward, right wheel backward)\n  int leftSpeed = (degrees > 0) ? TURN_SPEED : -TURN_SPEED;\n  int rightSpeed = -leftSpeed; // Opposite direction\n  // Start turning\n  motors.setSpeeds(leftSpeed, rightSpeed);\n  // Keep turning until we reach the target\n  while (abs(encoders.getCountsLeft()) < targetCounts) {\n    delay(10);\n  }\n  // Stop!\n  motors.setSpeeds(0, 0);\n}\n", "main.cpp": "#include \"RobotConfig.h\"\n#include \"RobotSensors.h\"\n#include \"RobotHelpers.h\"\n\n// ===== LINE FOLLOWING STATE =====\nfloat currentKp = KP;            // Live-tunable copy of KP\nbool isRunning = false;          // Is the robot following right now?\nunsigned long gapStartTime = 0;  // When did the line disappear?\n\nvoid showStatus() {\n  display.setLayout21x8();\n  display.clear();\n  display.gotoXY(0, 0);\n  display.print(isRunning ? F(\"RUNNING\") : F(\"STOPPED\"));\n  display.gotoXY(0, 2);\n  display.print(F(\"Kp: \"));\n  display.print(currentKp, 2);\n  display.gotoXY(0, 4);\n  display.print(F(\"A- B:Go C+\"));\n}\n\nvoid followLine() {\n  int position = readLinePosition();\n  int error = position - LINE_CENTER;\n  int correction = currentKp * error;\n  int leftSpeed = BASE_SPEED - correction;\n  int rightSpeed = BASE_SPEED + correction;\n  leftSpeed = constrain(leftSpeed, -MAX_SPEED, MAX_SPEED);\n  rightSpeed = constrain(rightSpeed, -MAX_SPEED, MAX_SPEED);\n  motors.setSpeeds(leftSpeed, rightSpeed);\n}\n\nvoid handleGap() {\n  if (gapStartTime == 0) {\n    gapStartTime = millis();\n  }\n  if (millis() - gapStartTime > MAX_GAP_TIME) {\n    motors.setSpeeds(0, 0);\n    isRunning = false;\n    display.setLayout21x8();\n    display.clear();\n    display.gotoXY(0, 0);\n    display.print(F(\"LINE LOST!\"));\n    display.gotoXY(0, 2);\n    display.print(F(\"Press B to retry\"));\n    return;\n  }\n  motors.setSpeeds(BASE_SPEED, BASE_SPEED);\n}\n\n// ===== SETUP =====\nvoid setup() {\n  Serial.begin(115200);\n  unsigned long serialStart = millis();\n  while (!Serial && (millis() - serialStart < 2000)) {\n    delay(10); // Wait up to 2s for USB serial connection\n  }\n  delay(500);\n  Serial.println(F(\"=== Lesson 8: Line Following ===\"));\n\n  // ===== BATTERY REPORT =====\n  int batteryVoltage = readBatteryMillivolts();\n  int battWhole = batteryVoltage / 1000;\n  int battDecimal = (batteryVoltage / 10) % 100;\n  Serial.print(F(\"Battery: \"));\n  Serial.print(battWhole);\n  Serial.print(F(\".\"));\n  if (battDecimal < 10) Serial.print(F(\"0\"));\n  Serial.print(battDecimal);\n  Serial.print(F(\"V (\"));\n  Serial.print(batteryVoltage);\n  Serial.println(F(\"mV)\"));\n\n  display.clear();\n  display.setLayout21x8();\n  display.print(F(\"===== Lesson 8 =====\"));\n  display.gotoXY(0, 2);\n  display.print(F(\"Battery: \"));\n  display.print(battWhole);\n  display.print(F(\".\"));\n  if (battDecimal < 10) display.print(F(\"0\"));\n  display.print(battDecimal);\n  display.print(F(\"V\"));\n  display.gotoXY(0, 4);\n  display.print(F(\"Status: \"));\n  if (batteryVoltage >= BATTERY_GOOD) {\n    display.print(F(\"GOOD\"));\n    ledGreen(1);\n  } else if (batteryVoltage >= BATTERY_LOW) {\n    display.print(F(\"LOW\"));\n    ledYellow(1);\n    buzzer.playNote(NOTE_A(4), 200, 15);\n  } else {\n    display.print(F(\"CHARGE!\"));\n    ledRed(1);\n    buzzer.playNote(NOTE_A(3), 500, 15);\n  }\n  display.gotoXY(0, 6);\n  display.print(F(\"Kp: \"));\n  display.print(currentKp, 2);\n  delay(2500);\n  ledGreen(0);\n  ledYellow(0);\n  ledRed(0);\n\n  // ===== LINE SENSOR SETUP =====\n  initLineSensors();\n\n  // ===== SAFETY GATE - before ANY motion =====\n  // Calibration spins the robot, so the A-gate comes FIRST.\n  waitForStart();\n\n  // ===== CALIBRATION =====\n  display.setLayout21x8();\n  display.clear();\n  display.gotoXY(0, 0);\n  display.print(F(\"Place robot on line\"));\n  display.gotoXY(0, 2);\n  display.print(F(\"Press B to calibrate\"));\n  buttonB.waitForButton();\n  display.clear();\n  display.gotoXY(0, 0);\n  display.print(F(\"Calibrating...\"));\n  display.gotoXY(0, 2);\n  display.print(F(\"(spinning)\"));\n  delay(500);\n  calibrateLineSensors();\n  display.clear();\n  display.gotoXY(0, 0);\n  display.print(F(\"Calibration done!\"));\n  delay(1000);\n  showStatus();\n}\n\n// ===== MAIN LOOP =====\n// A = Kp down   B = start/stop   C = Kp up\nvoid loop() {\n  if (!isRunning) {\n    checkBattery();  // A+B battery report - only while stopped, never mid-run\n  }\n\n  if (buttonA.isPressed() && !isRunning) {\n    currentKp -= 0.02;\n    if (currentKp < 0.02) currentKp = 0.02;\n    showStatus();\n    delay(200);\n  }\n  if (buttonB.getSingleDebouncedPress()) {\n    isRunning = !isRunning;\n    if (isRunning) {\n      // 3-2-1 countdown before starting\n      for (int count = 3; count > 0; count--) {\n        display.setLayout21x8();\n        display.clear();\n        display.gotoXY(0, 0);\n        display.print(count);\n        buzzer.playNote(NOTE_C(5), 150, 15);\n        delay(1000);\n      }\n      display.clear();\n      d
