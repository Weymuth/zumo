----------\nSAFETY GATE: nothing moves until Button A is pressed.\nCall it at the END of setup(), always.\n*/\nvoid waitForStart() {\n  display.clear();\n  display.print(F(\"Press A\"));\n  display.gotoXY(0, 1);\n  display.print(F(\"to start\"));\n  buttonA.waitForButton();\n  display.clear();\n  delay(500);  // time to get your hands clear\n}\n\n/*\ncheckBattery()\n--------------\nHold A + B together at any time to see the battery.\nCall it at the TOP of loop().\n*/\nvoid checkBattery() {\n  if (buttonA.isPressed() && buttonB.isPressed()) {\n    display.clear();\n    display.print(F(\"Battery\"));\n    display.gotoXY(0, 1);\n    int mv = readBatteryMillivolts();\n    display.print(mv);\n    display.print(F(\" mV\"));\n    while (buttonA.isPressed() || buttonB.isPressed()) {\n      // wait for release\n    }\n    delay(200);\n    display.clear();\n  }\n}\n","finished": "// ===== HARDWARE OBJECTS =====\nZumo32U4OLED display;\nZumo32U4ProximitySensors proxSensors;\nZumo32U4ButtonA buttonA;\nZumo32U4ButtonB buttonB;\nZumo32U4ButtonC buttonC;\nZumo32U4Buzzer buzzer;\n\n// ===== CONFIGURATION =====\nconst int DETECTION_THRESHOLD = 1;    // Minimum to count as \"detected\"\nconst int CLOSE_THRESHOLD = 3;        // Considered \"close\"\nconst int VERY_CLOSE_THRESHOLD = 5;   // Considered \"very close\"\n\n// ===== GLOBAL VARIABLES =====\nint leftValue = 0;\nint frontLeftValue = 0;\nint frontRightValue = 0;\nint frontValue = 0;\nint rightValue = 0;\nint displayMode = 0;    // 0 = numeric, 1 = bars, 2 = alerts\n\n// ===== FUNCTION PROTOTYPES =====\nvoid readAllSensors();\nvoid drawBar(int row, int value);\nvoid showNumericMode();\nvoid showBarGraphMode();\nvoid showAlertMode();\nvoid updateIndicators();\n\n// (these two are pre-installed by the Maker)\nvoid waitForStart();\nvoid checkBattery();\n\nvoid setup() {\n    Serial.begin(115200);\n    delay(500);\n    Serial.println(F(\"\"));\n    Serial.println(F(\"========================================\"));\n    Serial.println(F(\"   LESSON 5 - PROXIMITY SENSORS\"));\n    Serial.println(F(\"========================================\"));\n    Serial.println(F(\"\"));\n    Serial.println(F(\"CONTROLS:\"));\n    Serial.println(F(\"  A: Numeric value display\"));\n    Serial.println(F(\"  B: Bar graph display\"));\n    Serial.println(F(\"  C: Detection alerts\"));\n    Serial.println(F(\"\"));\n    Serial.println(F(\"VALUES: 0-6 (brightness levels)\"));\n    Serial.println(F(\"  0 = nothing detected\"));\n    Serial.println(F(\"  1-2 = object far\"));\n    Serial.println(F(\"  3-4 = object close\"));\n    Serial.println(F(\"  5-6 = object very close\"));\n    Serial.println(F(\"\"));\n    proxSensors.initThreeSensors();\n    Serial.println(F(\"Proximity sensors initialized.\"));\n    Serial.println(F(\"Try moving your hand in front of the robot!\"));\n    waitForStart();   // safety gate: nothing runs until you press A\n}\n\nvoid loop() {\n    checkBattery();   // hold A + B together to see battery millivolts\n    readAllSensors();\n    // Button handling\n    if (buttonA.getSingleDebouncedPress()) {\n        ledYellow(1); delay(50); ledYellow(0);\n        displayMode = 0;\n        Serial.println(F(\"[MODE] Numeric\"));\n    }\n    if (buttonB.getSingleDebouncedPress()) {\n        ledYellow(1); delay(50); ledYellow(0);\n        displayMode = 1;\n        Serial.println(F(\"[MODE] Bar graph\"));\n    }\n    if (buttonC.getSingleDebouncedPress()) {\n        ledYellow(1); delay(50); ledYellow(0);\n        displayMode = 2;\n        Serial.println(F(\"[MODE] Alerts\"));\n    }\n    // Update display\n    switch (displayMode) {\n        case 0: showNumericMode(); break;\n        case 1: showBarGraphMode(); break;\n        case 2: showAlertMode(); break;\n    }\n    // Update indicators\n    updateIndicators();\n    // Serial logging\n    Serial.print(F(\"L:\"));\n    Serial.print(leftValue);\n    Serial.print(F(\"\\tF:\"));\n    Serial.print(frontValue);\n    Serial.print(F(\" (\"));\n    Serial.print(frontLeftValue);\n    Serial.print(F(\"/\"));\n    Serial.print(frontRightValue);\n    Serial.print(F(\")\\tR:\"));\n    Serial.print(rightValue);\n    if (frontValue >= VERY_CLOSE_THRESHOLD) {\n        Serial.print(F(\"\\t*** VERY CLOSE ***\"));\n    } else if (frontValue >= CLOSE_THRESHOLD) {\n        Serial.print(F(\"\\t* CLOSE *\"));\n    } else if (frontValue >= DETECTION_THRESHOLD) {\n        Serial.print(F(\"\\t(detected)\"));\n    }\n    Serial.println();\n    delay(50);\n}\n\n// ===== HELPER FUNCTIONS =====\n\nvoid readAllSensors() {\n    proxSensors.read();\n    leftValue = proxSensors.countsLeftWithLeftLeds();\n    frontLeftValue = proxSensors.countsFrontWithLeftLeds();\n    frontRightValue = proxSensors.countsFrontWithRightLeds();\n    rightValue = proxSensors.countsRightWithRightLeds();\n    frontValue = max(frontLeftValue, frontRightValue);\n}\n\nvoid drawBar(int row, int value) {\n    display.gotoXY(2, row);\n    int barLength = constrain(value, 0, 6);\n    for (int i = 0; i < 6; i++) {\n        if (i < barLength) {\n            display.print(F(\"#\"));\n        } else {\n            display.print(F(\"-\"));\n        }\n    }\n    display.print(F(\" \"));\n    display.print(value);\n}\n\nvoid showNumericMode() {\n    display.clear();\n    display.setLayout21x8();\n    display.gotoXY(0, 0);\n    display.print(F(\"=== PROXIMITY ===\"));\n    display.gotoXY(0, 2);\n    display.print(F(\"Left:  \"));\n    display.print(leftValue);\n    display.gotoXY(0, 3);\n    display.print(F(\"Front: \"));\n    display.print(frontValue);\n    display.print(F(\" (L\"));\n    display.print(frontLeftValue);\n    display.print(F(\" R\"));\n    display.print(frontRightValue);\n    display.print(F(\")\"));\n    display.gotoXY(0, 4);\n    display.print(F(\"Right: \"));\n    display.print(rightValue);\n    display.gotoXY(0, 6);\n    display.print(F(\"0=none  6=closest\"));\n    display.gotoXY(0, 7);\n    display.print(F(\"A:num B:bar C:alert\"));\n}\n\nvoid showBarGraphMode() {\n    display.clear();\n    display.setLayout21x8();\n    display.gotoXY(0, 0);\n    display.print(F(\"=== PROX BARS ===\"));\n    display.gotoXY(0, 2);\n    display.print(F(\"L:\"));\n    drawBar(2, leftValue);\n    display.gotoXY(0, 4);\n    display.print(F(\"F:\"));\n    drawBar(4, frontValue);\n    display.gotoXY(0, 6);\n    display.print(F(\"R:\"));\n    drawBar(6, rightValue);\n    display.gotoXY(0, 7);\n    display.print(F(\"A:num B:bar C:alert\"));\n}\n\nvoid showAlertMode() {\n    display.clear();\n    display.setLayout21x8();\n    display.gotoXY(0, 0);\n    display.print(F(\"=== DETECTION ===\"));\n    // Left status\n    display.gotoXY(0, 2);\n    display.print(F(\"LEFT:  \"));\n    if (leftValue >= VERY_CLOSE_THRESHOLD) {\n        display.print(F(\"[VERY CLOSE!]\"));\n    } else if (leftValue >= CLOSE_THRESHOLD) {\n        display.print(F(\"[CLOSE]\"));\n    } else if (leftValue >= DETECTION_THRESHOLD) {\n        display.print(F(\"[detected]\"));\n    } else {\n        display.print(F(\"clear\"));\n    }\n    // Front status\n    display.gotoXY(0, 3);\n    display.print(F(\"FRONT: \"));\n    if (frontValue >= VERY_CLOSE_THRESHOLD) {\n        display.print(F(\"[VERY CLOSE!]\"));\n    } else if (frontValue >= CLOSE_THRESHOLD) {\n        display.print(F(\"[CLOSE]\"));\n    } else if (frontValue >= DETECTION_THRESHOLD) {\n        display.print(F(\"[detected]\"));\n    } else {\n        display.print(F(\"clear\"));\n    }\n    // Right status\n    display.gotoXY(0, 4);\n    display.print(F(\"RIGHT: \"));\n    if (rightValue >= VERY_CLOSE_THRESHOLD) {\n        display.print(F(\"[VERY CLOSE!]\"));\n    } else if (rightValue >= CLOSE_THRESHOLD) {\n        display.print(F(\"[CLOSE]\"));\n    } else if (rightValue >= DETECTION_THRESHOLD) {\n        display.print(F(\"[detected]\"));\n    } else {\n        display.print(F(\"clear\"));\n    }\n    // Overall warning\n    display.gotoXY(0, 6);\n    if (frontValue >= VERY_CLOSE_THRESHOLD) {\n        display.print(F(\"!!! OBSTACLE !!!\"));\n    } else if (frontValue >= CLOSE_THRESHOLD) {\n        display.print(F(\">> CAUTION <<\"));\n    } else {\n        display.print(F(\"Path looks clear\"));\n    }\n    display.gotoXY(0, 7);\n    display.print(F(\"A:num B:bar C:alert\"));\n}\n\nvoid updateIndicators() {\n    // LED: On if anything detected in front\n    if (frontValue >= DETECTION_THRESHOLD) {\n        ledYellow(1);\n    } else {\n        ledYellow(0);\n    }\n    // Buzzer: Beep pattern based on closeness\n    static unsigned long lastBeep = 0;\n    unsigned long beepInterval;\n    if (frontValue >= VERY_CLOSE_THRESHOLD) {\n        beepInterval = 100;   // Fast beeping\n    } else if (frontValue >= CLOSE_THRESHOLD) {\n        beepInterval = 300;   // Medium beeping\n    } else if (frontValue >= DETECTION_THRESHOLD) {\n        beepInterval = 600;   // Slow beeping\n    } else {\n        beepInterval = 0;     // No beeping\n    }\n    if (beepInterval > 0 && millis() - lastBeep > beepInterval) {\n        buzzer.playNote(NOTE_C(5), 30, 15);\n        lastBeep = millis();\n    }\n}\n\n// ----- STANDARD HELPERS (added after Lesson 3) -----\n\n/*\nwaitForStart()\n--------------\nSAFETY GATE: nothing moves until Button A is pressed.\nCall it at the END of setup(), always.\n*/\nvoid waitForStart() {\n  display.clear();\n  display.print(F(\"Press A\"));\n  display.gotoXY(0, 1);\n  display.print(F(\"to start\"));\n  buttonA.waitForButton();\n  display.clear();\n  delay(500);  // time to get your hands clear\n}\n\n/*\ncheckBattery()\n--------------\nHold A + B together at any time to see the battery.\nCall it at the TOP of loop().\n*/\nvoid checkBattery() {\n  if (buttonA.isPressed() && buttonB.isPressed()) {\n    display.clear();\n    display.print(F(\"Battery\"));\n    display.gotoXY(0, 1);\n    int mv = readBatteryMillivolts();\n    display.print(mv);\n    display.print(F(\" mV\"));\n    while (buttonA.isPressed() || buttonB.isPressed()) {\n      // wait for release\n    }\n    delay(200);\n    display.clear();\n  }\n}\n"},

  var GENERIC = [
    ["main",    "Main lesson build", "",        ""],
    ["mystery", "Mystery sandbox",   "Mystery", "Mystery Challenge Sandbox"],
    ["custom",  "Custom copy\u2026",   null,      ""]
  ];

  var lesson = document.getElementById('lesson');
  for (var i = 1; i <= 15; i++) {
    var o = document.createElement('option');
    o.value = i; o.textContent = 'Lesson ' + String(i).padStart(2,'0') + ' \u2014 ' + TITLES[i];
    lesson.appendChild(o);
  }

  var lname = document.getElementById('lname'), finit = document.getElementById('finit'),
      kind = document.getElementById('kind'), preview = document.getElementById('preview'),
      go = document.getElementById('go'), err = document.getElementById('err'),
      customRow = document.getElementById('customRow'), custom = document.getElementById('custom');
  var goAll = document.getElementById('goAll');

  // Lessons whose registries are complete + compile-verified; extend as backfill lands.
  var DL_ALL_LESSONS = [2];
  function kindList() { return KINDS[parseInt(lesson.value,10)] || GENERIC; }
  function rebuildKinds(keep) {
    kind.innerHTML = '';
    var curGroup = null, curEl = kind;
    kindList().forEach(function (k) {
      var g = k[4] || null;
      if (g !== curGroup) {
        if (g) { curEl = document.createElement('optgroup'); curEl.label = g; kind.appendChild(curEl); }
        else { curEl = kind; }
        curGroup = g;
      }
      var o = document.createElement('option');
      o.value = k[0]; o.textContent = k[1];
      curEl.appendChild(o);
    });
    if (keep) kind.value = keep;
    if (!kind.value) kind.selectedIndex = 0;
  }

  var params = new URLSearchParams(location.search);
  if (params.get('lesson')) lesson.value = parseInt(params.get('lesson'), 10) || 1;
  rebuildKinds(params.get('kind') || 'main');
  try {
    lname.value = localStorage.getItem('zumo_lname') || '';
    finit.value = localStorage.getItem('zumo_finit') || '';
  } catch (e) {}

  function cleanName(s) { return s.replace(/[^A-Za-z]/g, ''); }
  function cleanSuffix(s) { return s.trim().replace(/\s+/g, '_').replace(/[^A-Za-z0-9_]/g, ''); }
  function kindRec() {
    var v = kind.value, list = kindList();
    for (var i = 0; i < list.length; i++) if (list[i][0] === v) return list[i];
    return list[0];
  }
  function folderName() {
    var n = cleanName(lname.value);
    if (!n) return null;
    n = n.charAt(0).toUpperCase() + n.slice(1);
    var fi = cleanName(finit.value).toUpperCase();
    var base = n + fi + '_L' + String(lesson.value).padStart(2, '0');
    var rec = kindRec();
    var suf = rec[2];
    if (suf === null) { suf = cleanSuffix(custom.value); if (!suf) return null; }
    return suf ? base + '_' + suf : base;
  }
  function refresh() {
    customRow.style.display = (kindRec()[2] === null) ? 'block' : 'none';
    var f = folderName();
    preview.textContent = f || 'type your last name\u2026';
    go.disabled = !f;
    var all = DL_ALL_LESSONS.indexOf(parseInt(lesson.value, 10)) !== -1;
    goAll.style.display = all ? 'block' : 'none';
    goAll.disabled = !cleanName(lname.value);
    err.textContent = '';
  }
  [lname, finit, kind, custom].forEach(function (el) {
    el.addEventListener('input', refresh); el.addEventListener('change', refresh);
  });
  lesson.addEventListener('change', function () { rebuildKinds('main'); refresh(); });
  refresh();

  var INI = "[env:a-star32u4]\nplatform = atmelavr\nboard = a-star32u4\nframework = arduino\nmonitor_speed = 115200\nlib_deps = pololu/Zumo32U4\n";

  function mainCpp(recArg) {
    var num = String(lesson.value).padStart(2, '0');
    var rec = recArg || kindRec();
    var what = TITLES[lesson.value];
    if (rec[0] === 'custom') { what += ' \u2014 ' + cleanSuffix(custom.value).replace(/_/g, ' '); }
    else if (rec[3]) { what += ' \u2014 ' + rec[3]; }
    var name = cleanName(lname.value); name = name.charAt(0).toUpperCase() + name.slice(1);
    var d = new Date();
    var date = (d.getMonth()+1) + '/' + d.getDate() + '/' + d.getFullYear();
    var head = "/*\n=====================================================\nLESSON " + num + " - " + what +
      "\n=====================================================\nWHAT THIS PROGRAM DOES:\n(update this as you build!)\nAUTHOR: " + name +
      "\nDATE: " + date + "\n=====================================================\n*/\n\n#include <Zumo32U4.h>\n\n" +
      "// ==================== MY PLAN ====================\n" +
      "// Pseudo-code first, real code second.\n" +
      "// In plain English: what should this program do,\n" +
      "// step by step?\n" +
      "//\n" +
      "//   1.\n" +
      "//   2.\n" +
      "//   3.\n" +
      "//   4.\n" +
      "//\n" +
      "// Update the plan when your plan changes.\n" +
      "// =================================================\n\n";
    var P = PAYLOADS[String(parseInt(lesson.value, 10))];
    var body = (P && rec[5]) ? P[rec[5]] : null;
    if (body) { return head + body; }
    if (parseInt(lesson.value, 10) < 4) {
      return head +
        "// ===== HARDWARE OBJECTS =====\n\n// ===== CONSTANTS =====\n\n// ===== FUNCTION PROTOTYPES =====\n\n" +
        "void setup() {\n}\n\nvoid loop() {\n}\n\n// ===== HELPER FUNCTIONS =====\n";
    }
    return head +
      "// ===== HARDWARE OBJECTS =====\nZumo32U4ButtonA buttonA;\nZumo32U4ButtonB buttonB;\nZumo32U4OLED display;\n\n" +
      "// ===== CONSTANTS =====\n\n" +
      "// ===== FUNCTION PROTOTYPES =====\nvoid waitForStart();\nvoid checkBattery();\n\n" +
      "void setup() {\nwaitForStart();\n}\n\n" +
      "void loop() {\ncheckBattery();\n}\n\n" +
      "// ===== HELPER FUNCTIONS =====\n\n// ----- STANDARD HELPERS (added after Lesson 3) -----\n\n" +
      "/*\nwaitForStart()\n--------------\nSAFETY GATE: nothing moves until Button A is pressed.\nCall it at the END of setup(), always.\n*/\n" +
      "void waitForStart() {\ndisplay.clear();\ndisplay.print(F(\"Press A\"));\ndisplay.gotoXY(0, 1);\ndisplay.print(F(\"to start\"));\n" +
      "buttonA.waitForButton();\ndisplay.clear();\ndelay(500); // time to get your hands clear\n}\n\n" +
      "/*\ncheckBattery()\n--------------\nHold A + B together at any time to see the battery.\nCall it at the TOP of loop().\n*/\n" +
      "void checkBattery() {\nif (buttonA.isPressed() && buttonB.isPressed()) {\ndisplay.clear();\ndisplay.print(F(\"Battery\"));\n" +
      "display.gotoXY(0, 1);\nint mv = readBatteryMillivolts();\ndisplay.print(mv);\ndisplay.print(F(\" mV\"));\n" +
      "while (buttonA.isPressed() || buttonB.isPressed()) {\n// wait for release\n}\ndelay(200);\ndisplay.clear();\n}\n}\n";
  }

  go.onclick = function () {
    var f = folderName();
    if (!f) return;
    try {
      localStorage.setItem('zumo_lname', cleanName(lname.value));
      localStorage.setItem('zumo_finit', cleanName(finit.value));
    } catch (e) {}
    var zip = new JSZip();
    var root = zip.folder(f);
    root.file('platformio.ini', INI);
    root.folder('src').file('main.cpp', mainCpp());
    zip.generateAsync({ type: 'blob' }).then(function (blob) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = f + '.zip';
      document.body.appendChild(a); a.click(); a.remove();
    }).catch(function (e) { err.textContent = 'Download failed \u2014 tell your teacher: ' + e; });
  };

  function folderFor(rec) {
    var n = cleanName(lname.value);
    if (!n) return null;
    n = n.charAt(0).toUpperCase() + n.slice(1);
    var fi = cleanName(finit.value).toUpperCase();
    var base = n + fi + '_L' + String(lesson.value).padStart(2, '0');
    return rec[2] ? base + '_' + rec[2] : base;
  }

  goAll.onclick = function () {
    var n = cleanName(lname.value);
    if (!n) return;
    try {
      localStorage.setItem('zumo_lname', n);
      localStorage.setItem('zumo_finit', cleanName(finit.value));
    } catch (e) {}
    var zip = new JSZip();
    var count = 0;
    kindList().forEach(function (rec) {
      if (rec[0] === 'custom') return; // needs a typed suffix; not a template
      var f = folderFor(rec);
      if (!f) return;
      var root = zip.folder(f);
      root.file('platformio.ini', INI);
      root.folder('src').file('main.cpp', mainCpp(rec));
      count++;
    });
    if (!count) { err.textContent = 'No templates registered for this lesson yet.'; return; }
    var base = n.charAt(0).toUpperCase() + n.slice(1) + cleanName(finit.value).toUpperCase() +
      '_L' + String(lesson.value).padStart(2, '0') + '_All_Templates';
    zip.generateAsync({ type: 'blob' }).then(function (blob) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = base + '.zip';
      document.body.appendChild(a); a.click(); a.remove();
    }).catch(function (e) { err.textContent = 'Download failed \u2014 tell your teacher: ' + e; });
  };
})();
</script>
