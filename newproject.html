<!DOCTYPE html>
<!-- ZUMO Project Maker — v1.4 (2026-07-08)
     v1   letter-suffix naming scheme (initial)
     v1.1 descriptive challenge names + per-lesson registry + Custom option
     v1.2 Lesson 03 registry entries
     v1.3 lesson-aware skeleton: L04+ ships with STANDARD HELPERS (waitForStart safety gate + A&B battery check)
     v1.4 Lesson 04 registry entries (Line Sensors challenges)
     Filename stays unversioned (lesson deep links depend on it); version lives ONLY here + the footer. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZUMO Project Maker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  body { font-family: Arial, Helvetica, sans-serif; background: #f4f6f8; margin: 0; padding: 24px; }
  .card { max-width: 560px; margin: 0 auto; background: #fff; border: 2px solid #3498db; border-radius: 12px; padding: 22px 26px; }
  h1 { font-size: 20px; color: #1a5276; margin: 0 0 4px; }
  .sub { color: #4a5a66; font-size: 13px; margin-bottom: 18px; }
  label { font-weight: bold; font-size: 13px; color: #333; display: block; margin: 12px 0 4px; }
  input, select { font-size: 15px; padding: 8px 10px; border: 1px solid #b8c4cc; border-radius: 6px; width: 100%; box-sizing: border-box; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  .preview { font-family: 'Consolas','Courier New',monospace; font-size: 17px; font-weight: bold;
             color: #2a5a42; background: #eef5f0; border: 1px dashed #3a7d5c; border-radius: 6px;
             padding: 10px 14px; text-align: center; margin: 18px 0 6px; min-height: 24px; overflow-wrap: anywhere; }
  .err { color: #f44336; font-size: 12.5px; font-weight: bold; height: 16px; text-align: center; }
  button.go { width: 100%; font-size: 16px; font-weight: bold; color: #fff; background: #3a7d5c;
              border: none; border-radius: 8px; padding: 12px; margin-top: 10px; cursor: pointer; }
  button.go:disabled { background: #9db8aa; cursor: default; }
  .hint { font-size: 12px; color: #6a7a86; margin-top: 10px; text-align: center; }
  #customRow { display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>&#129302; ZUMO Project Maker</h1>
  <div class="sub">Type your name once. Pick what you're working on. Download a project folder that's already named correctly.</div>

  <div class="row">
    <div>
      <label for="lname">Last name</label>
      <input id="lname" placeholder="Smith" autocomplete="off">
    </div>
    <div>
      <label for="finit">First initial (only if two students share a last name)</label>
      <input id="finit" placeholder="J" maxlength="1" autocomplete="off">
    </div>
  </div>

  <div class="row">
    <div>
      <label for="lesson">Lesson</label>
      <select id="lesson"></select>
    </div>
    <div>
      <label for="kind">Working on</label>
      <select id="kind"></select>
    </div>
  </div>

  <div id="customRow">
    <label for="custom">Name this copy</label>
    <input id="custom" placeholder="My_Experiment" autocomplete="off">
  </div>

  <div class="preview" id="preview">&nbsp;</div>
  <div class="err" id="err"></div>
  <button class="go" id="go" disabled>&#11015; Download my project folder</button>
  <div class="hint">Unzip into <b>Documents/PlatformIO</b>, then in VS Code: File &rarr; Open Folder.</div>
  <div class="hint" style="margin-top: 4px; color: #b0bac2;">Project Maker v1.4</div>
</div>

<script>
(function () {
  var TITLES = {1:"Hello Robot",2:"Read Code Like a Pro",3:"Motors",4:"Line Sensors",
    5:"Proximity Sensors",6:"Encoders",7:"Code Organization",8:"Line Following",
    9:"Intersections",10:"Obstacles",11:"Edge Detection",12:"Rescue Zone",
    13:"Competition Prep",14:"Advanced PID Control",15:"Engineering Showcase"};

  // Per-lesson destinations: slug -> [dropdown label, folder suffix, header label]
  // Empty suffix = main build. Extend per lesson as challenges get wired.
  var KINDS = {
    2: [
      ["main",         "Main lesson build",                    "",                 ""],
      ["mystery",      "Mystery Challenges sandbox",           "Mystery",          "Mystery Challenge Sandbox"],
      ["broken_code",  "Challenge 1: The Broken Code",         "The_Broken_Code",  "Challenge 1: The Broken Code"],
      ["blink_count",  "Bonus 1: Blink Count",                 "Blink_Count",      "Bonus Challenge 1: Blink Count"],
      ["backwards_led","Bonus 2: Backwards LED",               "Backwards_LED",    "Bonus Challenge 2: Backwards LED"],
      ["buzzer_pitch", "Bonus 3: Buzzer Pitch",                "Buzzer_Pitch",     "Bonus Challenge 3: Buzzer Pitch"],
      ["line_order",   "Bonus 4: Line Order",                  "Line_Order",       "Bonus Challenge 4: Line Order"],
      ["endless_beep", "Bonus 5: Endless Beep",                "Endless_Beep",     "Bonus Challenge 5: Endless Beep"],
      ["speed_limit",  "Bonus 6: Speed Limit",                 "Speed_Limit",      "Bonus Challenge 6: Speed Limit"],
      ["custom",       "Custom copy\u2026",                       null,               ""]
    ],
    3: [
      ["main",           "Main lesson build",                  "",                  ""],
      ["drive_a_square", "Challenge 5: Drive a Square",        "Drive_A_Square",    "Challenge 5: Drive a Square"],
      ["auto_trim",      "Challenge 6: Auto-TRIM Preview",     "Auto_TRIM",         "Challenge 6: Auto-TRIM Preview"],
      ["creep_mode",     "Bonus 1: Creep Mode",                "Creep_Mode",        "Bonus Challenge 1: Creep Mode"],
      ["backwards_robot","Bonus 3: The Backwards Robot",       "Backwards_Robot",   "Bonus Challenge 3: The Backwards Robot"],
      ["braking_test",   "Bonus 4: Braking vs. Coasting",      "Braking_Test",      "Bonus Challenge 4: Braking vs. Coasting"],
      ["figure_eight",   "Bonus 5: The Figure-Eight",          "Figure_Eight",      "Bonus Challenge 5: The Figure-Eight"],
      ["speedometer",    "Bonus 6: The Human Speedometer",     "Speedometer",       "Bonus Challenge 6: The Human Speedometer"],
      ["custom",         "Custom copy\u2026",                     null,                ""]
    ],
    4: [
      ["main",             "Main lesson build",                    "",                   ""],
      ["line_counter",     "Challenge 2: The Line Counter",        "Line_Counter",       "Challenge 2: The Line Counter"],
      ["position_pointer", "Challenge 3: The Position Pointer",    "Position_Pointer",   "Challenge 3: The Position Pointer"],
      ["edge_guard",       "Challenge 4: Edge Guard",              "Edge_Guard",         "Challenge 4: Edge Guard"],
      ["centering_game",   "Challenge 5: The Centering Game",      "Centering_Game",     "Challenge 5: The Centering Game"],
      ["custom",           "Custom copy\u2026",                       null,                 ""]
    ]
  };
  var GENERIC = [
    ["main",    "Main lesson build", "",        ""],
    ["mystery", "Mystery sandbox",   "Mystery", "Mystery Challenge Sandbox"],
    ["custom",  "Custom copy\u2026",   null,      ""]
  ];

  var lesson = document.getElementById('lesson');
  for (var i = 1; i <= 15; i++) {
    var o = document.createElement('option');
    o.value = i; o.textContent = 'Lesson ' + String(i).padStart(2,'0') + ' \u2014 ' + TITLES[i];
    lesson.appendChild(o);
  }

  var lname = document.getElementById('lname'), finit = document.getElementById('finit'),
      kind = document.getElementById('kind'), preview = document.getElementById('preview'),
      go = document.getElementById('go'), err = document.getElementById('err'),
      customRow = document.getElementById('customRow'), custom = document.getElementById('custom');

  function kindList() { return KINDS[parseInt(lesson.value,10)] || GENERIC; }
  function rebuildKinds(keep) {
    kind.innerHTML = '';
    kindList().forEach(function (k) {
      var o = document.createElement('option');
      o.value = k[0]; o.textContent = k[1];
      kind.appendChild(o);
    });
    if (keep) kind.value = keep;
    if (!kind.value) kind.selectedIndex = 0;
  }

  var params = new URLSearchParams(location.search);
  if (params.get('lesson')) lesson.value = parseInt(params.get('lesson'), 10) || 1;
  rebuildKinds(params.get('kind') || 'main');
  try {
    lname.value = localStorage.getItem('zumo_lname') || '';
    finit.value = localStorage.getItem('zumo_finit') || '';
  } catch (e) {}

  function cleanName(s) { return s.replace(/[^A-Za-z]/g, ''); }
  function cleanSuffix(s) { return s.trim().replace(/\s+/g, '_').replace(/[^A-Za-z0-9_]/g, ''); }
  function kindRec() {
    var v = kind.value, list = kindList();
    for (var i = 0; i < list.length; i++) if (list[i][0] === v) return list[i];
    return list[0];
  }
  function folderName() {
    var n = cleanName(lname.value);
    if (!n) return null;
    n = n.charAt(0).toUpperCase() + n.slice(1);
    var fi = cleanName(finit.value).toUpperCase();
    var base = n + fi + '_L' + String(lesson.value).padStart(2, '0');
    var rec = kindRec();
    var suf = rec[2];
    if (suf === null) { suf = cleanSuffix(custom.value); if (!suf) return null; }
    return suf ? base + '_' + suf : base;
  }
  function refresh() {
    customRow.style.display = (kindRec()[2] === null) ? 'block' : 'none';
    var f = folderName();
    preview.textContent = f || 'type your last name\u2026';
    go.disabled = !f;
    err.textContent = '';
  }
  [lname, finit, kind, custom].forEach(function (el) {
    el.addEventListener('input', refresh); el.addEventListener('change', refresh);
  });
  lesson.addEventListener('change', function () { rebuildKinds('main'); refresh(); });
  refresh();

  var INI = "[env:a-star32u4]\nplatform = atmelavr\nboard = a-star32u4\nframework = arduino\nmonitor_speed = 115200\nlib_deps = pololu/Zumo32U4\n";

  function mainCpp() {
    var num = String(lesson.value).padStart(2, '0');
    var rec = kindRec();
    var what = TITLES[lesson.value];
    if (rec[0] === 'custom') { what += ' \u2014 ' + cleanSuffix(custom.value).replace(/_/g, ' '); }
    else if (rec[3]) { what += ' \u2014 ' + rec[3]; }
    var name = cleanName(lname.value); name = name.charAt(0).toUpperCase() + name.slice(1);
    var d = new Date();
    var date = (d.getMonth()+1) + '/' + d.getDate() + '/' + d.getFullYear();
    var head = "/*\n=====================================================\nLESSON " + num + " - " + what +
      "\n=====================================================\nWHAT THIS PROGRAM DOES:\n(update this as you build!)\nAUTHOR: " + name +
      "\nDATE: " + date + "\n=====================================================\n*/\n\n#include <Zumo32U4.h>\n\n";
    if (parseInt(lesson.value, 10) < 4) {
      return head +
        "// ===== HARDWARE OBJECTS =====\n\n// ===== CONSTANTS =====\n\n// ===== FUNCTION PROTOTYPES =====\n\n" +
        "void setup() {\n}\n\nvoid loop() {\n}\n\n// ===== HELPER FUNCTIONS =====\n";
    }
    return head +
      "// ===== HARDWARE OBJECTS =====\nZumo32U4ButtonA buttonA;\nZumo32U4ButtonB buttonB;\nZumo32U4OLED display;\n\n" +
      "// ===== CONSTANTS =====\n\n" +
      "// ===== FUNCTION PROTOTYPES =====\nvoid waitForStart();\nvoid checkBattery();\n\n" +
      "void setup() {\nwaitForStart();\n}\n\n" +
      "void loop() {\ncheckBattery();\n}\n\n" +
      "// ===== HELPER FUNCTIONS =====\n\n// ----- STANDARD HELPERS (added after Lesson 3) -----\n\n" +
      "/*\nwaitForStart()\n--------------\nSAFETY GATE: nothing moves until Button A is pressed.\nCall it at the END of setup(), always.\n*/\n" +
      "void waitForStart() {\ndisplay.clear();\ndisplay.print(F(\"Press A\"));\ndisplay.gotoXY(0, 1);\ndisplay.print(F(\"to start\"));\n" +
      "buttonA.waitForButton();\ndisplay.clear();\ndelay(500); // time to get your hands clear\n}\n\n" +
      "/*\ncheckBattery()\n--------------\nHold A + B together at any time to see the battery.\nCall it at the TOP of loop().\n*/\n" +
      "void checkBattery() {\nif (buttonA.isPressed() && buttonB.isPressed()) {\ndisplay.clear();\ndisplay.print(F(\"Battery\"));\n" +
      "display.gotoXY(0, 1);\nint mv = readBatteryMillivolts();\ndisplay.print(mv);\ndisplay.print(F(\" mV\"));\n" +
      "while (buttonA.isPressed() || buttonB.isPressed()) {\n// wait for release\n}\ndelay(200);\ndisplay.clear();\n}\n}\n";
  }

  go.onclick = function () {
    var f = folderName();
    if (!f) return;
    try {
      localStorage.setItem('zumo_lname', cleanName(lname.value));
      localStorage.setItem('zumo_finit', cleanName(finit.value));
    } catch (e) {}
    var zip = new JSZip();
    var root = zip.folder(f);
    root.file('platformio.ini', INI);
    root.folder('src').file('main.cpp', mainCpp());
    zip.generateAsync({ type: 'blob' }).then(function (blob) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = f + '.zip';
      document.body.appendChild(a); a.click(); a.remove();
    }).catch(function (e) { err.textContent = 'Download failed \u2014 tell your teacher: ' + e; });
  };
})();
</script>
</body>
</html>
