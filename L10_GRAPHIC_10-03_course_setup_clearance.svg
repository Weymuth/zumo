<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850" font-family="Segoe UI, Helvetica, Arial, sans-serif">

  <defs>
    <linearGradient id="titleBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a5276"/>
      <stop offset="100%" stop-color="#2e86ab"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef2f5"/>
    </linearGradient>
    <linearGradient id="blockGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e07b39"/>
      <stop offset="100%" stop-color="#b85c1e"/>
    </linearGradient>
    <pattern id="clearHatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#e8f3ec"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#8fbfa4" stroke-width="2"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1100" height="850" fill="#ffffff"/>

  <!-- ================= TITLE BAND ================= -->
  <rect x="0" y="0" width="1100" height="72" fill="url(#titleBand)"/>
  <text x="34" y="46" font-size="27" font-weight="bold" fill="#ffffff">GRAPHIC 10.3 &#8212; Course Setup</text>
  <text x="1066" y="46" font-size="17" fill="#d6e9f2" text-anchor="end">Lesson 10 &#183; &#167;4.4</text>

  <!-- ================= THE MAT ================= -->
  <rect x="40" y="100" width="1020" height="452" rx="10" fill="url(#floorGrad)" stroke="#c8d2da" stroke-width="2"/>
  <text x="60" y="132" font-size="16" font-weight="bold" fill="#2a5a42">TOP-DOWN &#8212; set this up before you upload anything</text>

  <!-- ===== an INTERSECTION, far to the left. STAY AWAY FROM IT. ===== -->
  <rect x="120" y="296" width="7" height="150" fill="#1c2833"/>
  <rect x="76" y="192" width="104" height="104" rx="4" fill="#e8f5e9" stroke="#c0392b" stroke-width="3" stroke-dasharray="8 5"/>
  <rect x="120" y="192" width="7" height="104" fill="#1c2833"/>
  <rect x="76" y="240" width="104" height="7" fill="#1c2833"/>
  <text x="128" y="178" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">intersection</text>
  <text x="128" y="466" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">NOT HERE</text>
  <text x="128" y="484" font-size="12" fill="#a5382b" text-anchor="middle">too much at once</text>

  <!-- ===== THE STRAIGHT SECTION: this is where the obstacle goes ===== -->
  <rect x="200" y="240" width="826" height="7" fill="#1c2833"/>

  <!-- straight-section bracket -->
  <line x1="240" y1="150" x2="240" y2="176" stroke="#2a5a42" stroke-width="2"/>
  <line x1="980" y1="150" x2="980" y2="176" stroke="#2a5a42" stroke-width="2"/>
  <line x1="240" y1="163" x2="980" y2="163" stroke="#2a5a42" stroke-width="2"/>
  <text x="610" y="152" font-size="14" font-weight="bold" fill="#2a5a42" text-anchor="middle">a BORING, STRAIGHT stretch &#8212; no green markers, no turns</text>

  <!-- ===== THE OBSTACLE, centered ON the line ===== -->
  <rect x="562" y="206" width="86" height="76" rx="4" fill="url(#blockGrad)" stroke="#8e4415" stroke-width="3"/>
  <text x="605" y="250" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">BLOCK</text>

  <!-- centered callout: the line passes through the middle of the block -->
  <line x1="605" y1="196" x2="605" y2="206" stroke="#b85c1e" stroke-width="2"/>
  <text x="605" y="190" font-size="13" font-weight="bold" fill="#b85c1e" text-anchor="middle">squarely ON the line, CENTERED</text>

  <!-- robot approaching -->
  <rect x="318" y="222" width="48" height="42" rx="5" fill="#34495e" stroke="#22313f" stroke-width="3"/>
  <polygon points="366,232 366,254 383,243" fill="#34495e" stroke="#22313f" stroke-width="2"/>
  <text x="342" y="248" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">ZUMO</text>

  <!-- ================= THE 30 cm OF CLEAR FLOOR ================= -->
  <rect x="440" y="300" width="450" height="200" rx="6" fill="url(#clearHatch)" stroke="#2a5a42" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="665" y="336" font-size="17" font-weight="bold" fill="#1d3f2e" text-anchor="middle">30 cm of CLEAR FLOOR</text>
  <text x="665" y="358" font-size="13" fill="#2a5a42" text-anchor="middle">nothing here. no wall, no chair leg, no other robot.</text>

  <!-- the 30 cm dimension line (single-polygon double arrow) -->
  <polygon points="452,392 476,380 476,388 878,388 878,380 902,392 878,404 878,396 476,396 476,404"
           fill="#2a5a42" stroke="#1d3f2e" stroke-width="2"/>
  <rect x="612" y="378" width="106" height="28" rx="4" fill="#ffffff" stroke="#2a5a42" stroke-width="2"/>
  <text x="665" y="398" font-size="15" font-weight="bold" fill="#2a5a42" text-anchor="middle">&#8805; 30 cm</text>

  <!-- what the robot ACTUALLY uses: the 20 cm drive-past -->
  <polygon points="524,448 548,436 548,444 766,444 766,436 790,448 766,460 766,452 548,452 548,460"
           fill="#9a4459" stroke="#772f41" stroke-width="2"/>
  <rect x="588" y="466" width="164" height="26" rx="4" fill="#fbe9ee" stroke="#9a4459" stroke-width="2"/>
  <text x="670" y="485" font-size="13" font-weight="bold" fill="#9a4459" text-anchor="middle">AVOID_PAST_CM = 20</text>
  <text x="920" y="452" font-size="13" font-weight="bold" fill="#9a4459">what the robot</text>
  <text x="920" y="470" font-size="13" font-weight="bold" fill="#9a4459">actually drives</text>

  <!-- the detour arrow leaving the line, to the RIGHT of travel = down-screen -->
  <polygon points="493,254 507,254 507,286 517,286 500,310 483,286 493,286"
           fill="#9a4459" stroke="#772f41" stroke-width="2"/>
  <text x="404" y="300" font-size="13" font-weight="bold" fill="#9a4459">the robot detours</text>
  <text x="404" y="318" font-size="13" font-weight="bold" fill="#9a4459">to THIS side</text>

  <!-- margin annotation -->
  <text x="920" y="336" font-size="13" font-weight="bold" fill="#2a5a42">why 30, not 20?</text>
  <text x="920" y="356" font-size="12" fill="#4a6b58">the extra 10 cm is</text>
  <text x="920" y="374" font-size="12" fill="#4a6b58">your margin for a</text>
  <text x="920" y="392" font-size="12" fill="#4a6b58">turn that overshoots.</text>

  <!-- ================= THE FOUR RULES ================= -->
  <rect x="40" y="576" width="1020" height="244" rx="10" fill="#f4f9f6" stroke="#3a7d5c" stroke-width="2"/>
  <rect x="40" y="576" width="1020" height="42" rx="10" fill="#2a5a42"/>
  <rect x="40" y="604" width="1020" height="14" fill="#2a5a42"/>
  <text x="64" y="605" font-size="17" font-weight="bold" fill="#ffffff">FOUR RULES &#8212; get these wrong and you will blame your code</text>

  <circle cx="82" cy="656" r="15" fill="#3a7d5c"/>
  <text x="82" y="662" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="108" y="653" font-size="14" font-weight="bold" fill="#1d3f2e">Set up your Lesson 9 course, exactly as before.</text>
  <text x="108" y="673" font-size="13" fill="#4a6b58">Same mat, same tape, same intersections. Change one thing at a time.</text>

  <circle cx="82" cy="708" r="15" fill="#3a7d5c"/>
  <text x="82" y="714" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="108" y="705" font-size="14" font-weight="bold" fill="#1d3f2e">Pick a STRAIGHT section, well away from any green marker.</text>
  <text x="108" y="725" font-size="13" fill="#4a6b58">Near an intersection you test three things at once, and</text>
  <text x="108" y="741" font-size="13" fill="#4a6b58">when it fails you will not know which one broke.</text>

  <circle cx="82" cy="760" r="15" fill="#3a7d5c"/>
  <text x="82" y="766" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="108" y="757" font-size="14" font-weight="bold" fill="#1d3f2e">Put the obstacle squarely ON the line, centered.</text>
  <text x="108" y="777" font-size="13" fill="#4a6b58">Off-center, it may slip past an edge and never trigger.</text>
  <text x="108" y="793" font-size="13" fill="#4a6b58">Light, tall, flat, wide, heavy &#8212; see &#167;4.3.</text>

  <circle cx="608" cy="656" r="15" fill="#3a7d5c"/>
  <text x="608" y="662" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="634" y="653" font-size="14" font-weight="bold" fill="#1d3f2e">Leave 30 cm of clear floor on the detour side.</text>
  <text x="634" y="673" font-size="13" fill="#4a6b58">The robot drives 20 cm out there, blind. Give it room to be wrong.</text>

  <rect x="608" y="694" width="424" height="98" rx="6" fill="#fff8e1" stroke="#ffc107" stroke-width="2"/>
  <text x="628" y="718" font-size="14" font-weight="bold" fill="#856404">&#9888; Test on a boring straight line first.</text>
  <text x="628" y="742" font-size="13" fill="#856404">Make it work. THEN get mean &#8212; move the block near a</text>
  <text x="628" y="762" font-size="13" fill="#856404">turn, put two in a row, place one while it is driving.</text>
  <text x="628" y="784" font-size="13" font-style="italic" fill="#a07a12">A failure you cannot locate is not a test.</text>

</svg>
