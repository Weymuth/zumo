<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 400">
  <defs>
    <linearGradient id="titleBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f0f0f0"/>
    </linearGradient>
    <linearGradient id="folderFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd54f"/>
      <stop offset="100%" style="stop-color:#ffb300"/>
    </linearGradient>
    <linearGradient id="folderBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffca28"/>
      <stop offset="100%" style="stop-color:#ff8f00"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Window frame -->
  <rect x="10" y="10" width="630" height="380" rx="8" fill="#ffffff" stroke="#d0d0d0" stroke-width="1" filter="url(#shadow)"/>
  
  <!-- Title bar -->
  <rect x="10" y="10" width="630" height="35" rx="8" fill="url(#titleBar)"/>
  <rect x="10" y="30" width="630" height="15" fill="url(#titleBar)"/>
  
  <!-- Window controls -->
  <circle cx="600" cy="27" r="6" fill="#ff5f57"/>
  <circle cx="580" cy="27" r="6" fill="#ffbd2e"/>
  <circle cx="560" cy="27" r="6" fill="#28ca42"/>
  
  <!-- Title text -->
  <text x="30" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333">Documents</text>
  
  <!-- Address bar -->
  <rect x="20" y="50" width="610" height="28" rx="4" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="35" y="69" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#666">📁 This PC › Documents › Robotics</text>
  
  <!-- Toolbar area -->
  <rect x="10" y="85" width="630" height="30" fill="#fafafa"/>
  <line x1="10" y1="115" x2="640" y2="115" stroke="#e0e0e0" stroke-width="1"/>
  <text x="30" y="105" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#666">Name</text>
  <text x="350" y="105" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#666">Date modified</text>
  <text x="520" y="105" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#666">Type</text>
  
  <!-- Folder 1: Zumo_Lesson_3 -->
  <g transform="translate(30, 130)">
    <!-- Folder icon -->
    <path d="M0 8 L0 45 Q0 48 3 48 L55 48 Q58 48 58 45 L58 12 Q58 9 55 9 L25 9 L22 4 Q21 2 18 2 L3 2 Q0 2 0 5 Z" fill="url(#folderBack)"/>
    <path d="M0 12 L0 45 Q0 48 3 48 L55 48 Q58 48 58 45 L58 15 Q58 12 55 12 Z" fill="url(#folderFront)"/>
    <!-- Folder name -->
    <text x="70" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333">Zumo_Lesson_3</text>
    <!-- Date -->
    <text x="320" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#666">1/4/2026 2:35 PM</text>
    <!-- Type -->
    <text x="490" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#666">File folder</text>
  </g>
  
  <!-- Folder 2: Zumo_Lesson_4 (highlighted/selected) -->
  <g transform="translate(30, 185)">
    <!-- Selection highlight -->
    <rect x="-10" y="-5" width="600" height="55" rx="4" fill="#cce8ff" stroke="#99d1ff" stroke-width="1"/>
    <!-- Folder icon -->
    <path d="M0 8 L0 45 Q0 48 3 48 L55 48 Q58 48 58 45 L58 12 Q58 9 55 9 L25 9 L22 4 Q21 2 18 2 L3 2 Q0 2 0 5 Z" fill="url(#folderBack)"/>
    <path d="M0 12 L0 45 Q0 48 3 48 L55 48 Q58 48 58 45 L58 15 Q58 12 55 12 Z" fill="url(#folderFront)"/>
    <!-- Folder name -->
    <text x="70" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#333">Zumo_Lesson_4</text>
    <!-- "NEW" badge -->
    <rect x="185" y="18" width="35" height="16" rx="3" fill="#28a745"/>
    <text x="202" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="bold" fill="white" text-anchor="middle">NEW</text>
    <!-- Date -->
    <text x="320" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#333">1/5/2026 9:15 AM</text>
    <!-- Type -->
    <text x="490" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#333">File folder</text>
  </g>
  
  <!-- Folder 3: Another folder for context -->
  <g transform="translate(30, 250)">
    <!-- Folder icon -->
    <path d="M0 8 L0 45 Q0 48 3 48 L55 48 Q58 48 58 45 L58 12 Q58 9 55 9 L25 9 L22 4 Q21 2 18 2 L3 2 Q0 2 0 5 Z" fill="url(#folderBack)"/>
    <path d="M0 12 L0 45 Q0 48 3 48 L55 48 Q58 48 58 45 L58 15 Q58 12 55 12 Z" fill="url(#folderFront)"/>
    <!-- Folder name -->
    <text x="70" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333">Zumo_Lesson_2</text>
    <!-- Date -->
    <text x="320" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#666">1/3/2026 11:20 AM</text>
    <!-- Type -->
    <text x="490" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#666">File folder</text>
  </g>
  
  <!-- Folder 4 -->
  <g transform="translate(30, 305)">
    <!-- Folder icon -->
    <path d="M0 8 L0 45 Q0 48 3 48 L55 48 Q58 48 58 45 L58 12 Q58 9 55 9 L25 9 L22 4 Q21 2 18 2 L3 2 Q0 2 0 5 Z" fill="url(#folderBack)"/>
    <path d="M0 12 L0 45 Q0 48 3 48 L55 48 Q58 48 58 45 L58 15 Q58 12 55 12 Z" fill="url(#folderFront)"/>
    <!-- Folder name -->
    <text x="70" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333">Zumo_Lesson_1</text>
    <!-- Date -->
    <text x="320" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#666">1/2/2026 3:45 PM</text>
    <!-- Type -->
    <text x="490" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#666">File folder</text>
  </g>
  
  <!-- Status bar -->
  <rect x="10" y="360" width="630" height="30" rx="0 0 8 8" fill="#f5f5f5"/>
  <text x="30" y="379" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#666">4 items</text>
  
</svg>
