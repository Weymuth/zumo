<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620" font-family="Segoe UI, Tahoma, sans-serif">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5276"/>
      <stop offset="100%" style="stop-color:#2e86ab"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#28a745"/>
      <stop offset="100%" style="stop-color:#5cb85c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <marker id="arrowBlack" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="620" fill="#fafafa"/>
  
  <!-- Step 1: Robot doesn't drive straight -->
  <rect x="125" y="20" width="250" height="50" rx="25" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <text x="250" y="50" text-anchor="middle" fill="white" font-size="14" font-weight="bold">Robot doesn't drive straight</text>
  
  <!-- Arrow down -->
  <path d="M 250 70 L 250 100" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowBlack)"/>
  
  <!-- Decision diamond -->
  <polygon points="250,110 350,160 250,210 150,160" fill="white" stroke="#1a5276" stroke-width="2" filter="url(#shadow)"/>
  <text x="250" y="155" text-anchor="middle" fill="#1a5276" font-size="13" font-weight="bold">Which way</text>
  <text x="250" y="172" text-anchor="middle" fill="#1a5276" font-size="13" font-weight="bold">does it curve?</text>
  
  <!-- LEFT arrow - continuous line from diamond to box -->
  <path d="M 150 160 L 100 160 L 100 230" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowBlack)"/>
  <text x="125" y="152" text-anchor="middle" fill="#333" font-size="12" font-weight="bold">LEFT</text>
  
  <!-- RIGHT arrow - continuous line from diamond to box -->
  <path d="M 350 160 L 400 160 L 400 230" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowBlack)"/>
  <text x="375" y="152" text-anchor="middle" fill="#333" font-size="12" font-weight="bold">RIGHT</text>
  
  <!-- LEFT box -->
  <rect x="25" y="240" width="150" height="90" rx="10" fill="white" stroke="#2e86ab" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="265" text-anchor="middle" fill="#1a5276" font-size="14" font-weight="bold">LEFT</text>
  <line x1="25" y1="275" x2="175" y2="275" stroke="#ddd" stroke-width="1"/>
  <text x="100" y="295" text-anchor="middle" fill="#333" font-size="11">Increase</text>
  <text x="100" y="310" text-anchor="middle" fill="#2e86ab" font-size="11" font-weight="bold">right TRIM (+)</text>
  
  <!-- RIGHT box -->
  <rect x="325" y="240" width="150" height="90" rx="10" fill="white" stroke="#2e86ab" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="265" text-anchor="middle" fill="#1a5276" font-size="14" font-weight="bold">RIGHT</text>
  <line x1="325" y1="275" x2="475" y2="275" stroke="#ddd" stroke-width="1"/>
  <text x="400" y="295" text-anchor="middle" fill="#333" font-size="11">Decrease</text>
  <text x="400" y="310" text-anchor="middle" fill="#2e86ab" font-size="11" font-weight="bold">right TRIM (−)</text>
  
  <!-- Lines from boxes down, then horizontal connector, then down to Test Again -->
  <!-- Left side: down from box -->
  <path d="M 100 330 L 100 370" stroke="#333" stroke-width="2" fill="none"/>
  <!-- Right side: down from box -->
  <path d="M 400 330 L 400 370" stroke="#333" stroke-width="2" fill="none"/>
  <!-- Horizontal connector line across -->
  <path d="M 100 370 L 400 370" stroke="#333" stroke-width="2" fill="none"/>
  <!-- Down arrow from center -->
  <path d="M 250 370 L 250 400" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowBlack)"/>
  
  <!-- Test Again box with repeat instruction -->
  <rect x="75" y="410" width="350" height="60" rx="10" fill="white" stroke="#1a5276" stroke-width="2" filter="url(#shadow)"/>
  <text x="250" y="435" text-anchor="middle" fill="#1a5276" font-size="13" font-weight="bold">Test again to see how it drives</text>
  <text x="250" y="458" text-anchor="middle" fill="#666" font-size="12" font-style="italic">Repeat until straight</text>
  
  <!-- Arrow down to success -->
  <path d="M 250 470 L 250 500" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowBlack)"/>
  
  <!-- Drives Straight box -->
  <rect x="125" y="510" width="250" height="45" rx="10" fill="url(#greenGrad)" filter="url(#shadow)"/>
  <text x="250" y="538" text-anchor="middle" fill="white" font-size="14" font-weight="bold">✓ Drives straight — DONE!</text>
</svg>
