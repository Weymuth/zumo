<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">The Four-State Machine</title>
  <desc id="desc">A four-state robot control diagram showing STOPPED, FOLLOWING_LINE, AT_INTERSECTION, and EXECUTING_TURN with labeled transitions.</desc>
  <rect x="0" y="0" width="1100" height="850" fill="#F5F2E9"/>

  <!-- restrained brand layer -->
  <text x="54" y="66" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#0B1A2E">The Four-State Machine</text>
  <text x="54" y="101" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#3D5266">Every state names its exits — trace it on paper</text>
  <line x1="54" y1="126" x2="1046" y2="126" stroke="#C9A463" stroke-width="3"/>

  <!-- state cards: neutral surfaces, functional accent bars -->
  <rect x="96" y="174" width="312" height="126" rx="14" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
  <rect x="96" y="174" width="10" height="126" rx="5" fill="#7A838C"/>
  <text x="252" y="214" text-anchor="middle" font-family="Courier New, monospace" font-size="22" font-weight="700" fill="#0B1A2E">STOPPED</text>
  <line x1="128" y1="228" x2="376" y2="228" stroke="#D4D4D4" stroke-width="2"/>
  <text x="252" y="258" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1E1E1E">battery guard · A/C tune Kp</text>
  <text x="252" y="282" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1E1E1E">waiting for B</text>

  <rect x="692" y="174" width="312" height="126" rx="14" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
  <rect x="692" y="174" width="10" height="126" rx="5" fill="#6A9955"/>
  <text x="848" y="214" text-anchor="middle" font-family="Courier New, monospace" font-size="22" font-weight="700" fill="#0B1A2E">FOLLOWING_LINE</text>
  <line x1="724" y1="228" x2="972" y2="228" stroke="#D4D4D4" stroke-width="2"/>
  <text x="848" y="258" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1E1E1E">followLine() · gap watch</text>
  <text x="848" y="282" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1E1E1E">ask the outer sensors</text>

  <rect x="692" y="548" width="312" height="126" rx="14" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
  <rect x="692" y="548" width="10" height="126" rx="5" fill="#007ACC"/>
  <text x="848" y="588" text-anchor="middle" font-family="Courier New, monospace" font-size="22" font-weight="700" fill="#0B1A2E">AT_INTERSECTION</text>
  <line x1="724" y1="602" x2="972" y2="602" stroke="#D4D4D4" stroke-width="2"/>
  <text x="848" y="632" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1E1E1E">showDecision() + beep</text>
  <text x="848" y="656" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1E1E1E">600 ms readable pause</text>

  <rect x="96" y="548" width="312" height="126" rx="14" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
  <rect x="96" y="548" width="10" height="126" rx="5" fill="#C586C0"/>
  <text x="252" y="588" text-anchor="middle" font-family="Courier New, monospace" font-size="22" font-weight="700" fill="#0B1A2E">EXECUTING_TURN</text>
  <line x1="128" y1="602" x2="376" y2="602" stroke="#D4D4D4" stroke-width="2"/>
  <text x="252" y="632" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1E1E1E">dispatch pendingTurn</text>
  <text x="252" y="656" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1E1E1E">to the turn wrappers</text>

  <!-- transitions -->
  <polygon points="408,218 675,218 675,208 692,221 675,234 675,224 408,224" fill="#6A9955"/>
  <text x="550" y="195" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#3F6F37">B → 3-2-1 countdown</text>

  <polygon points="692,270 425,270 425,260 408,273 425,286 425,276 692,276" fill="#F44747"/>
  <text x="550" y="315" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#F44747">B — the kill switch</text>
  <text x="550" y="338" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#F44747">gap timeout → LINE LOST</text>

  <polygon points="844,300 844,531 834,531 848,548 862,531 852,531 852,300" fill="#007ACC"/>
  <text x="872" y="414" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#007ACC">marker seen</text>
  <text x="872" y="437" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#007ACC">→ stop motors FIRST</text>
  <text x="872" y="460" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#007ACC">→ save pendingTurn</text>

  <polygon points="692,604 425,604 425,594 408,607 425,620 425,610 692,610" fill="#C586C0"/>
  <text x="550" y="585" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#8B4D8F">after 600 ms</text>

  <polygon points="254,550 674,288 680,297 692,276 670,275 676,284 248,544" fill="#6A9955"/>
  <text x="380" y="418" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#3F6F37">turn done</text>
  <text x="380" y="441" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#3F6F37">clear pendingTurn</text>

  <!-- legend / safety note -->
  <rect x="96" y="722" width="908" height="74" rx="12" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
  <rect x="96" y="722" width="8" height="74" rx="4" fill="#CCA700"/>
  <text x="132" y="751" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0B1A2E">Safety rule</text>
  <text x="132" y="778" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1E1E1E">Stopping happens at the moment of detection — never deferred to a later state.</text>
</svg>