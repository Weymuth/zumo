<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">The Rescue Space</title>
  <desc id="desc">A top-down RoboLore diagram of the rescue zone. A black line runs in from the left and stops at a doorway in the left wall. A silver strip lies across the line just before the doorway. Inside is a walled, bare floor with no line anywhere on it, holding two victim balls, one silver and one black. Labels identify the walls, the entrance strip, the end of the line, the doorway and each victim.</desc>

  <!-- ============ CANVAS + TITLE BAND ============ -->
  <rect x="0" y="0" width="1100" height="850" fill="#F5F2E9"/>
  <rect x="0" y="0" width="1100" height="90" fill="#0B1A2E"/>
  <text x="40" y="42" fill="#FFFFFF" font-size="30" font-weight="600">THE RESCUE SPACE</text>
  <text x="40" y="72" fill="#E8EEF4" font-size="18" font-family="Courier New, monospace">A floor, walls, a silver doorway, two victims — that is the whole build</text>

  <!-- ============ THE FLOOR ============ -->
  <rect x="438" y="218" width="564" height="484" fill="#FFFFFF"/>

  <!-- ============ THE WALLS - the left wall is split by the doorway ============ -->
  <rect x="420" y="200" width="600" height="18" fill="#0B1A2E"/>
  <rect x="420" y="702" width="600" height="18" fill="#0B1A2E"/>
  <rect x="1002" y="200" width="18" height="520" fill="#0B1A2E"/>
  <rect x="420" y="200" width="18" height="205" fill="#0B1A2E"/>
  <rect x="420" y="515" width="18" height="205" fill="#0B1A2E"/>

  <!-- ============ THE LINE, ENDING AT THE DOORWAY ============ -->
  <rect x="40" y="450" width="398" height="20" fill="#0B1A2E"/>

  <!-- ============ THE SILVER ENTRANCE STRIP, ACROSS THE LINE ============ -->
  <rect x="300" y="412" width="34" height="96" fill="#D8E0E5" stroke="#66788A" stroke-width="3"/>

  <!-- ============ THE VICTIMS ============ -->
  <circle cx="700" cy="300" r="26" fill="#D8E0E5" stroke="#66788A" stroke-width="4"/>
  <circle cx="620" cy="600" r="26" fill="#0B1A2E" stroke="#0B1A2E" stroke-width="4"/>

  <!-- ============ THE BARE FLOOR, STATED ============ -->
  <text x="720" y="452" fill="#9AA7B2" font-size="24" font-weight="600" text-anchor="middle">NO LINE IN HERE</text>
  <text x="720" y="478" fill="#9AA7B2" font-size="15" text-anchor="middle">nothing to follow, nothing to lose</text>

  <!-- ============ LABEL: WALLS ============ -->
  <text x="720" y="160" fill="#0B1A2E" font-size="19" font-weight="600" text-anchor="middle">WALLS — tall enough that the robot cannot leave</text>
  <polygon points="716,172 724,172 724,182 730,182 720,196 710,182 716,182" fill="#0B1A2E"/>

  <!-- ============ LABEL: SILVER ENTRANCE STRIP ============ -->
  <text x="40" y="344" fill="#0B1A2E" font-size="19" font-weight="600">SILVER ENTRANCE STRIP</text>
  <text x="40" y="366" fill="#3D5266" font-size="15">across the line, at the doorway</text>
  <text x="40" y="386" fill="#3D5266" font-size="15">the robot's only signal that it arrived</text>
  <polygon points="313,392 321,392 321,400 327,400 317,412 307,400 313,400" fill="#66788A"/>

  <!-- ============ LABEL: THE LINE ENDS ============ -->
  <text x="40" y="576" fill="#0B1A2E" font-size="19" font-weight="600">THE BLACK LINE</text>
  <text x="40" y="598" fill="#3D5266" font-size="15">runs in from the course and ends at the doorway</text>
  <text x="40" y="618" fill="#3D5266" font-size="15">Lessons 8–12 all stop right here</text>
  <polygon points="196,542 204,542 204,492 210,492 200,478 190,492 196,492" fill="#0B1A2E"/>

  <!-- ============ LABEL: THE DOORWAY ============ -->
  <text x="460" y="460" fill="#9AA7B2" font-size="13" font-weight="600" text-anchor="middle" transform="rotate(-90 460 460)">DOORWAY</text>

  <!-- ============ LABEL: SILVER VICTIM ============ -->
  <text x="746" y="294" fill="#0B1A2E" font-size="19" font-weight="600">SILVER VICTIM</text>
  <text x="746" y="316" fill="#3D5266" font-size="15">announces itself across the zone</text>
  <line x1="728" y1="298" x2="740" y2="292" stroke="#66788A" stroke-width="3"/>

  <!-- ============ LABEL: BLACK VICTIM ============ -->
  <text x="666" y="588" fill="#0B1A2E" font-size="19" font-weight="600">BLACK VICTIM</text>
  <text x="666" y="610" fill="#3D5266" font-size="15">barely registers on the one sensor</text>
  <text x="666" y="630" fill="#3D5266" font-size="15">that looks for it — see §4.3</text>
  <line x1="648" y1="594" x2="660" y2="590" stroke="#66788A" stroke-width="3"/>

  <!-- ============ FOOTNOTE ============ -->
  <text x="40" y="792" fill="#3D5266" font-size="15">Drawn in the RoboLore palette. In the room the line and the far victim are <tspan font-weight="600">black</tspan>, the strip and the near victim are <tspan font-weight="600">silver</tspan>, and the floor is <tspan font-weight="600">white</tspan>.</text>
  <text x="40" y="816" fill="#66788A" font-size="14">Top-down view. Wall height, zone size and victim placement vary by course — the four parts do not.</text>
</svg>
