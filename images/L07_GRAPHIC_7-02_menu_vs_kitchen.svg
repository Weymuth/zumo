<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">The Menu and the Kitchen</title>
  <desc id="desc">RoboLore instructional graphic comparing a C++ header file to a menu and an implementation file to a kitchen.</desc>

  <!-- Canvas and restrained RoboLore brand layer -->
  <rect x="0" y="0" width="1100" height="850" fill="#F5F2E9"/>
  <rect x="0" y="0" width="1100" height="72" fill="#F5F2E9"/>
  <text x="34" y="25" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2" fill="#3D5266">GRAPHIC 7.2</text>
  <text x="34" y="53" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#0B1A2E">The Menu and the Kitchen</text>
  <text x="1060" y="45" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#3D5266">Lesson 7 · header vs .cpp</text>
  <line x1="34" y1="70" x2="1066" y2="70" stroke="#C9A463" stroke-width="2"/>

  <!-- Menu card: neutral surface + functional selection-blue cue -->
  <rect x="40" y="100" width="498" height="469" rx="12" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
  <rect x="40" y="100" width="498" height="44" rx="12" fill="#F3F3F3" stroke="#D4D4D4" stroke-width="0"/>
  <rect x="40" y="132" width="498" height="12" fill="#F3F3F3"/>
  <rect x="40" y="100" width="7" height="469" rx="3.5" fill="#007ACC"/>
  <text x="63" y="131" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0B1A2E">THE MENU — RobotMotion.h</text>

  <!-- Exact declarations in a VS Code-inspired panel -->
  <rect x="72" y="173" width="434" height="219" rx="6" fill="#1E1E1E" stroke="#3C3C3C" stroke-width="2"/>
  <text x="289" y="203" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#D4D4D4">WHAT YOU CAN ORDER</text>
  <line x1="104" y1="218" x2="473" y2="218" stroke="#3C3C3C" stroke-width="2"/>
  <line x1="104" y1="340" x2="473" y2="340" stroke="#3C3C3C" stroke-width="2"/>

  <text x="102" y="252" font-family="Courier New, monospace" font-size="17">
    <tspan fill="#569CD6">void</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#DCDCAA">driveDistance</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#4EC9B0">float</tspan><tspan fill="#D4D4D4"> cm);</tspan>
  </text>
  <text x="102" y="287" font-family="Courier New, monospace" font-size="17">
    <tspan fill="#569CD6">void</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#DCDCAA">turnDegrees</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#4EC9B0">float</tspan><tspan fill="#D4D4D4"> deg);</tspan>
  </text>
  <text x="102" y="322" font-family="Courier New, monospace" font-size="17">
    <tspan fill="#569CD6">void</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#DCDCAA">stopMotors</tspan><tspan fill="#D4D4D4">();</tspan>
  </text>
  <text x="289" y="368" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#9D9D9D">names and prices. no recipes.</text>

  <text x="72" y="428" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1E1E1E">A menu is a PROMISE. It tells you what</text>
  <text x="72" y="450" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1E1E1E">exists and what to ask for—and stops.</text>
  <text x="72" y="485" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1E1E1E">It does not tell you how the sauce is made,</text>
  <text x="72" y="507" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1E1E1E">and you would not want it to.</text>
  <text x="72" y="545" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0B1A2E">Short. Public. Everyone reads it.</text>

  <!-- Kitchen card: same neutral treatment + functional type-cyan cue -->
  <rect x="562" y="100" width="498" height="469" rx="12" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
  <rect x="562" y="100" width="498" height="44" rx="12" fill="#F3F3F3" stroke="#D4D4D4" stroke-width="0"/>
  <rect x="562" y="132" width="498" height="12" fill="#F3F3F3"/>
  <rect x="562" y="100" width="7" height="469" rx="3.5" fill="#4EC9B0"/>
  <text x="585" y="131" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0B1A2E">THE KITCHEN — RobotMotion.cpp</text>

  <rect x="594" y="173" width="434" height="219" rx="6" fill="#1E1E1E" stroke="#3C3C3C" stroke-width="2"/>
  <text x="613" y="200" font-family="Courier New, monospace" font-size="16">
    <tspan fill="#569CD6">void</tspan><tspan fill="#D4D4D4"> </tspan><tspan fill="#DCDCAA">driveDistance</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#4EC9B0">float</tspan><tspan fill="#D4D4D4"> cm) {</tspan>
  </text>
  <text x="631" y="224" font-family="Courier New, monospace" font-size="16">
    <tspan fill="#569CD6">long</tspan><tspan fill="#D4D4D4"> target = cm * </tspan><tspan fill="#4EC9B0">COUNTS_PER_CM</tspan><tspan fill="#D4D4D4">;</tspan>
  </text>
  <text x="631" y="248" font-family="Courier New, monospace" font-size="16">
    <tspan fill="#D4D4D4">encoders.</tspan><tspan fill="#DCDCAA">getCountsLeft</tspan><tspan fill="#D4D4D4">();</tspan>
  </text>
  <text x="631" y="284" font-family="Courier New, monospace" font-size="16">
    <tspan fill="#C586C0">while</tspan><tspan fill="#D4D4D4"> (...) {</tspan>
  </text>
  <text x="649" y="308" font-family="Courier New, monospace" font-size="16">
    <tspan fill="#D4D4D4">motors.</tspan><tspan fill="#DCDCAA">setSpeeds</tspan><tspan fill="#D4D4D4">(s + TRIM, s);</tspan>
  </text>
  <text x="631" y="332" font-family="Courier New, monospace" font-size="16" fill="#D4D4D4">}</text>
  <text x="613" y="356" font-family="Courier New, monospace" font-size="16" fill="#D4D4D4">}</text>
  <text x="862" y="376" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6A9955">heat, noise, and a lot of shouting</text>

  <text x="594" y="428" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1E1E1E">The kitchen is where the work happens.</text>
  <text x="594" y="450" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1E1E1E">It is long, messy, and it changes often.</text>
  <text x="594" y="485" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1E1E1E">Rewrite the recipe tomorrow and the menu</text>
  <text x="594" y="507" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1E1E1E">stays exactly the same. Nobody has to know.</text>
  <text x="594" y="545" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0B1A2E">Long. Private. Only the cook reads it.</text>

  <!-- Neutral explanatory card; functional blue border, not a brand-category fill -->
  <rect x="40" y="596" width="1020" height="217" rx="12" fill="#FFFFFF" stroke="#007ACC" stroke-width="2"/>
  <rect x="40" y="596" width="1020" height="42" rx="12" fill="#F3F3F3"/>
  <rect x="40" y="626" width="1020" height="12" fill="#F3F3F3"/>
  <text x="64" y="626" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0B1A2E">WHY SPLIT THEM AT ALL?</text>
  <text x="63" y="674" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1E1E1E">When main.cpp calls driveDistance(30), it needs to know ONE thing: that the function exists and takes a number.</text>
  <text x="63" y="708" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1E1E1E">It does not need the loop, the counts, or the TRIM. Handing it the whole kitchen would only give it more to break.</text>
  <text x="63" y="748" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0B1A2E">So main.cpp includes the MENU (.h). The compiler reads the KITCHEN (.cpp) separately, once.</text>
  <text x="63" y="786" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#3D5266">Every “undefined reference” error you will ever see is this split, gone wrong: a menu with no kitchen behind it.</text>
</svg>
