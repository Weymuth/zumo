<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="titleBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a5276"/>
      <stop offset="100%" stop-color="#2e86ab"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef2f5"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1100" height="850" fill="#ffffff"/>
  <rect x="0" y="0" width="1100" height="72" fill="url(#titleBand)"/>
  <text x="34" y="46" font-size="27" font-weight="bold" fill="#ffffff">GRAPHIC 7.2 &#8212; The Menu and the Kitchen</text>
  <text x="1066" y="46" font-size="17" fill="#d6e9f2" text-anchor="end">Lesson 7 &#183; header vs .cpp</text>

  <rect x="40" y="100" width="498" height="470" rx="10" fill="#eaf4fb" stroke="#3498db" stroke-width="2"/>
  <rect x="40" y="100" width="498" height="44" rx="10" fill="#1a5276"/>
  <rect x="40" y="130" width="498" height="14" fill="#1a5276"/>
  <text x="64" y="131" font-size="17" font-weight="bold" fill="#ffffff">THE MENU &#8212; RobotMotion.h</text>

  <rect x="72" y="172" width="434" height="220" rx="6" fill="#ffffff" stroke="#3498db" stroke-width="2"/>
  <text x="289" y="204" font-size="17" font-weight="bold" fill="#1a5276" text-anchor="middle">WHAT YOU CAN ORDER</text>
  <line x1="104" y1="218" x2="474" y2="218" stroke="#c8d2da" stroke-width="1"/>
  <text x="104" y="252" font-family="Consolas, Monaco, monospace" font-size="14" fill="#1a5276" textLength="330" lengthAdjust="spacingAndGlyphs">void driveDistance(float cm);</text>
  <text x="104" y="286" font-family="Consolas, Monaco, monospace" font-size="14" fill="#1a5276" textLength="342" lengthAdjust="spacingAndGlyphs">void turnDegrees(float deg);</text>
  <text x="104" y="320" font-family="Consolas, Monaco, monospace" font-size="14" fill="#1a5276" textLength="180" lengthAdjust="spacingAndGlyphs">void stopMotors();</text>
  <line x1="104" y1="342" x2="474" y2="342" stroke="#c8d2da" stroke-width="1"/>
  <text x="289" y="370" font-size="13" font-style="italic" fill="#7a8a96" text-anchor="middle">names and prices. no recipes.</text>

  <text x="72" y="428" font-size="14" fill="#123c66">A menu is a PROMISE. It tells you what</text>
  <text x="72" y="450" font-size="14" fill="#123c66">exists and what to ask for &#8212; and stops.</text>
  <text x="72" y="484" font-size="14" fill="#123c66">It does not tell you how the sauce is made,</text>
  <text x="72" y="506" font-size="14" fill="#123c66">and you would not want it to.</text>
  <text x="72" y="544" font-size="14" font-weight="bold" fill="#0d47a1">Short. Public. Everyone reads it.</text>

  <rect x="562" y="100" width="498" height="470" rx="10" fill="#f4f9f6" stroke="#3a7d5c" stroke-width="2"/>
  <rect x="562" y="100" width="498" height="44" rx="10" fill="#2a5a42"/>
  <rect x="562" y="130" width="498" height="14" fill="#2a5a42"/>
  <text x="586" y="131" font-size="17" font-weight="bold" fill="#ffffff">THE KITCHEN &#8212; RobotMotion.cpp</text>

  <rect x="594" y="172" width="434" height="220" rx="6" fill="#1e1e1e"/>
  <text x="614" y="200" font-family="Consolas, Monaco, monospace" font-size="13" fill="#dcdcaa" textLength="290" lengthAdjust="spacingAndGlyphs">void driveDistance(float cm) {</text>
  <text x="628" y="224" font-family="Consolas, Monaco, monospace" font-size="13" fill="#9cdcfe" textLength="318" lengthAdjust="spacingAndGlyphs">long target = cm * COUNTS_PER_CM;</text>
  <text x="628" y="248" font-family="Consolas, Monaco, monospace" font-size="13" fill="#9cdcfe" textLength="228" lengthAdjust="spacingAndGlyphs">encoders.getCountsLeft();</text>
  <text x="628" y="272" font-family="Consolas, Monaco, monospace" font-size="13" fill="#c586c0" textLength="140" lengthAdjust="spacingAndGlyphs">while (...) {</text>
  <text x="642" y="296" font-family="Consolas, Monaco, monospace" font-size="13" fill="#9cdcfe" textLength="290" lengthAdjust="spacingAndGlyphs">motors.setSpeeds(s + TRIM, s);</text>
  <text x="628" y="320" font-family="Consolas, Monaco, monospace" font-size="13" fill="#c586c0" textLength="20" lengthAdjust="spacingAndGlyphs">}</text>
  <text x="614" y="344" font-family="Consolas, Monaco, monospace" font-size="13" fill="#dcdcaa" textLength="20" lengthAdjust="spacingAndGlyphs">}</text>
  <text x="811" y="376" font-size="12" font-style="italic" fill="#6a9955" text-anchor="middle">heat, noise, and a lot of shouting</text>

  <text x="594" y="428" font-size="14" fill="#1c3b2a">The kitchen is where the work happens.</text>
  <text x="594" y="450" font-size="14" fill="#1c3b2a">It is long, messy, and it changes often.</text>
  <text x="594" y="484" font-size="14" fill="#1c3b2a">Rewrite the recipe tomorrow and the menu</text>
  <text x="594" y="506" font-size="14" fill="#1c3b2a">stays exactly the same. Nobody has to know.</text>
  <text x="594" y="544" font-size="14" font-weight="bold" fill="#2a5a42">Long. Private. Only the cook reads it.</text>

  <rect x="40" y="596" width="1020" height="216" rx="10" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
  <rect x="40" y="596" width="1020" height="42" rx="10" fill="#704c73"/>
  <rect x="40" y="624" width="1020" height="14" fill="#704c73"/>
  <text x="64" y="625" font-size="17" font-weight="bold" fill="#ffffff">WHY SPLIT THEM AT ALL?</text>
  <text x="64" y="670" font-size="15" fill="#4a1b55">When main.cpp calls driveDistance(30), it needs to know ONE thing: that the function exists and takes a number.</text>
  <text x="64" y="700" font-size="15" fill="#4a1b55">It does not need the loop, the counts, or the TRIM. Handing it the whole kitchen would only give it more to break.</text>
  <text x="64" y="740" font-size="15" font-weight="bold" fill="#6a1b7a">So main.cpp includes the MENU (.h). The compiler reads the KITCHEN (.cpp) separately, once.</text>
  <text x="64" y="778" font-size="14" font-style="italic" fill="#7a4b8a">Every &#8220;undefined reference&#8221; error you will ever see is this split, gone wrong: a menu with no kitchen behind it.</text>
</svg>
