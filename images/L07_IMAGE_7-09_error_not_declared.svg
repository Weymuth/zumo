<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
  <title id="title">Compiler error: 'calibrateSensors' was not declared in this scope</title>
  <desc id="desc">Instructional figure reproducing the PlatformIO terminal for a call to a function the compiler has not been told about. Diagnostic text reproduced from GCC.</desc>
  <rect x="0" y="0" width="1100" height="500" fill="#FFFFFF"/>
  <rect x="40" y="24" width="1020" height="48" rx="6" fill="#0B1A2E"/>
  <rect x="40" y="72" width="1020" height="3" fill="#C9A463"/>
  <text x="60" y="55" fill="#FFFFFF" font-size="23" font-weight="700">ERROR 1 &#8212; NOT DECLARED IN THIS SCOPE</text>
  <text x="1040" y="54" fill="#D7E0EA" font-size="13" text-anchor="end">Zumo 32U4 Robotics &#183; Lesson 7</text>
  <rect x="52" y="96" width="996" height="306" rx="10" fill="#1E1E1E" stroke="#0F1720" stroke-width="2"/>
  <rect x="52" y="96" width="996" height="30" fill="#333333"/>
  <circle cx="74" cy="111" r="6" fill="#FF5F57"/>
  <circle cx="94" cy="111" r="6" fill="#FEBC2E"/>
  <circle cx="114" cy="111" r="6" fill="#28C840"/>
  <text x="550" y="116" fill="#CFCFCF" font-size="13" font-weight="400" text-anchor="middle">PROBLEMS &#183; OUTPUT &#183; TERMINAL</text>
  <rect x="52" y="376" width="996" height="26" fill="#007ACC"/>
  <text x="70" y="394" fill="#FFFFFF" font-size="12" font-weight="400" text-anchor="start">PlatformIO &#183; env:zumo32U4</text>
  <text x="72" y="160" fill="#858585" font-family="Courier New, monospace" font-size="14" font-weight="400" xml:space="preserve">> Executing task: pio run</text>
  <text x="72" y="190" fill="#D4D4D4" font-family="Courier New, monospace" font-size="14" font-weight="400" xml:space="preserve">Compiling .pio/build/zumo32U4/src/main.cpp.o</text>
  <text x="72" y="220" fill="#D4D4D4" font-family="Courier New, monospace" font-size="14" font-weight="400" xml:space="preserve">src/main.cpp: In function 'void setup()':</text>
  <text x="72" y="244" fill="#D4D4D4" font-family="Courier New, monospace" font-size="14" font-weight="400" xml:space="preserve">src/main.cpp:14:3: </text>
  <text x="232" y="244" fill="#f14c4c" font-family="Courier New, monospace" font-size="14" font-weight="700" xml:space="preserve">error: </text>
  <text x="292" y="244" fill="#D4D4D4" font-family="Courier New, monospace" font-size="14" font-weight="400" xml:space="preserve">'calibrateSensors' was not declared in this scope</text>
  <text x="72" y="272" fill="#9C9C9C" font-family="Courier New, monospace" font-size="14" font-weight="400" xml:space="preserve">   14 |   calibrateSensors();</text>
  <text x="72" y="294" fill="#f14c4c" font-family="Courier New, monospace" font-size="14" font-weight="400" xml:space="preserve">      |   ^~~~~~~~~~~~~~~~</text>
  <text x="72" y="330" fill="#f14c4c" font-family="Courier New, monospace" font-size="14" font-weight="400" xml:space="preserve">*** [.pio/build/zumo32U4/src/main.cpp.o] Error 1</text>
  <rect x="52" y="422" width="996" height="54" rx="8" fill="#FBFBFC" stroke="#D8DDE2" stroke-width="2"/>
  <text x="72" y="455" fill="#2B3A4A" font-size="16" font-weight="400" text-anchor="start">The compiler reads one file at a time. It has never seen this function, so it stops &#8212; the fix is the #include, not the function.</text>
</svg>
