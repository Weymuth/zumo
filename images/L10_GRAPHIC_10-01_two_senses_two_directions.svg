<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850" font-family="Segoe UI, Helvetica, Arial, sans-serif">

  <defs>
    <linearGradient id="titleBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a5276"/>
      <stop offset="100%" stop-color="#2e86ab"/>
    </linearGradient>
    <linearGradient id="matGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef2f5"/>
    </linearGradient>
    <linearGradient id="blockGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e07b39"/>
      <stop offset="100%" stop-color="#b85c1e"/>
    </linearGradient>
    <linearGradient id="botGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5d6d7e"/>
      <stop offset="100%" stop-color="#34495e"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1100" height="850" fill="#ffffff"/>

  <!-- ================= TITLE BAND ================= -->
  <rect x="0" y="0" width="1100" height="72" fill="url(#titleBand)"/>
  <text x="34" y="46" font-size="27" font-weight="bold" fill="#ffffff">GRAPHIC 10.1 &#8212; Two Senses, Two Directions</text>
  <text x="1066" y="46" font-size="17" fill="#d6e9f2" text-anchor="end">Lesson 10 &#183; Obstacle Avoidance</text>

  <!-- ================= SIDE-VIEW STAGE ================= -->
  <rect x="40" y="100" width="1020" height="430" rx="10" fill="url(#matGrad)" stroke="#c8d2da" stroke-width="2"/>
  <text x="60" y="132" font-size="16" font-weight="bold" fill="#1a5276">SIDE VIEW &#8212; the robot is about to hit something it cannot see</text>

  <!-- MAT SURFACE -->
  <rect x="70" y="430" width="960" height="26" fill="#f4f6f7" stroke="#b9c4cc" stroke-width="2"/>
  <text x="86" y="448" font-size="13" fill="#7a8a96">course mat</text>

  <!-- THE LINE (black tape on the mat) -->
  <rect x="70" y="426" width="960" height="6" fill="#1c2833"/>
  <text x="700" y="418" font-size="14" font-weight="bold" fill="#1c2833">the line (black tape)</text>

  <!-- ================= THE BLOCK (obstacle) ================= -->
  <rect x="812" y="316" width="112" height="112" rx="5" fill="url(#blockGrad)" stroke="#8e4415" stroke-width="3"/>
  <text x="868" y="378" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">BLOCK</text>
  <text x="868" y="290" font-size="15" font-weight="bold" fill="#b85c1e" text-anchor="middle">sitting ON TOP of the line</text>
  <line x1="868" y1="298" x2="868" y2="314" stroke="#b85c1e" stroke-width="2"/>

  <!-- ================= THE ROBOT ================= -->
  <!-- body -->
  <rect x="250" y="332" width="230" height="76" rx="7" fill="url(#botGrad)" stroke="#22313f" stroke-width="3"/>
  <text x="365" y="368" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">ZUMO</text>
  <text x="365" y="390" font-size="13" fill="#c9d3da" text-anchor="middle">(driving this way &#8594;)</text>

  <!-- wheels -->
  <circle cx="292" cy="418" r="20" fill="#2c3e50" stroke="#1b262c" stroke-width="3"/>
  <circle cx="292" cy="418" r="7" fill="#7f8c8d"/>
  <circle cx="440" cy="418" r="20" fill="#2c3e50" stroke="#1b262c" stroke-width="3"/>
  <circle cx="440" cy="418" r="7" fill="#7f8c8d"/>

  <!-- line-sensor bar, underneath, at the front -->
  <rect x="392" y="408" width="88" height="14" rx="3" fill="#2a5a42" stroke="#1d3f2e" stroke-width="2"/>
  <text x="436" y="419" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">LINE SENSORS</text>

  <!-- prox sensor, on the nose, facing forward -->
  <rect x="480" y="352" width="20" height="34" rx="3" fill="#9a4459" stroke="#772f41" stroke-width="2"/>
  <circle cx="490" cy="362" r="4" fill="#ffd9e0"/>
  <circle cx="490" cy="376" r="4" fill="#ffd9e0"/>

  <!-- ================= ARROW A: LINE SENSORS LOOK DOWN ================= -->
  <!-- single polygon: shaft + head in one shape (Bible canon) -->
  <polygon points="429,424 443,424 443,452 453,452 436,474 419,452 429,452"
           fill="#2a5a42" stroke="#1d3f2e" stroke-width="2"/>

  <!-- ================= ARROW B: PROX SENSOR LOOKS FORWARD ================= -->
  <polygon points="506,362 782,362 782,350 812,372 782,394 782,382 506,382"
           fill="#9a4459" stroke="#772f41" stroke-width="2"/>
  <text x="644" y="356" font-size="15" font-weight="bold" fill="#9a4459" text-anchor="middle">infrared, bounced off the block</text>

  <!-- ================= LABEL: DOWN ================= -->
  <rect x="196" y="470" width="330" height="46" rx="6" fill="#e8f3ec" stroke="#2a5a42" stroke-width="2"/>
  <text x="212" y="490" font-size="15" font-weight="bold" fill="#2a5a42">&#8595; LINE SENSORS point DOWN</text>
  <text x="212" y="509" font-size="13" fill="#2a5a42">&#8220;Is there a line beneath me?&#8221; &#8212; YES. All is well.</text>

  <!-- ================= LABEL: FORWARD ================= -->
  <rect x="556" y="470" width="386" height="46" rx="6" fill="#fbe9ee" stroke="#9a4459" stroke-width="2"/>
  <text x="572" y="490" font-size="15" font-weight="bold" fill="#9a4459">&#8594; PROXIMITY SENSOR points FORWARD</text>
  <text x="572" y="509" font-size="13" fill="#9a4459">&#8220;Is there a wall in front of me?&#8221; &#8212; the question nobody asked.</text>

  <!-- ================= LOWER PANEL: THE TWO QUESTIONS ================= -->
  <rect x="40" y="552" width="498" height="270" rx="10" fill="#eef7f1" stroke="#2a5a42" stroke-width="2"/>
  <rect x="40" y="552" width="498" height="40" rx="10" fill="#2a5a42"/>
  <rect x="40" y="580" width="498" height="12" fill="#2a5a42"/>
  <text x="64" y="580" font-size="17" font-weight="bold" fill="#ffffff">WHAT THE LINE SENSORS SEE</text>

  <text x="64" y="624" font-size="14" fill="#1c3b2a">They read the mat, 5 times across, pointing straight</text>
  <text x="64" y="646" font-size="14" fill="#1c3b2a">down at the tape. That is the only direction they look.</text>

  <rect x="64" y="666" width="450" height="60" rx="5" fill="#1e1e1e"/>
  <text x="80" y="690" font-family="Consolas, Monaco, monospace" font-size="14" fill="#9cdcfe" textLength="344" lengthAdjust="spacingAndGlyphs">lineSensors.readCalibrated(sensorValues);</text>
  <text x="80" y="712" font-family="Consolas, Monaco, monospace" font-size="14" fill="#6a9955" textLength="361" lengthAdjust="spacingAndGlyphs">// line is still there. Everything is fine.</text>

  <text x="64" y="756" font-size="14" font-weight="bold" fill="#2a5a42">Verdict: KEEP DRIVING.</text>
  <text x="64" y="786" font-size="13" fill="#4a6b58">And it is right. The line really is still there.</text>
  <text x="64" y="806" font-size="13" fill="#4a6b58">It is right about the wrong thing.</text>

  <rect x="562" y="552" width="498" height="270" rx="10" fill="#fbeff3" stroke="#9a4459" stroke-width="2"/>
  <rect x="562" y="552" width="498" height="40" rx="10" fill="#9a4459"/>
  <rect x="562" y="580" width="498" height="12" fill="#9a4459"/>
  <text x="586" y="580" font-size="17" font-weight="bold" fill="#ffffff">WHAT THE PROXIMITY SENSOR SEES</text>

  <text x="586" y="624" font-size="14" fill="#4a1f2b">It fires infrared out of the nose and counts how much</text>
  <text x="586" y="646" font-size="14" fill="#4a1f2b">bounces back. Nothing ahead &#8594; 0. A block ahead &#8594; 6.</text>

  <rect x="586" y="666" width="450" height="60" rx="5" fill="#1e1e1e"/>
  <text x="602" y="690" font-family="Consolas, Monaco, monospace" font-size="14" fill="#9cdcfe" textLength="160" lengthAdjust="spacingAndGlyphs">proxSensors.read();</text>
  <text x="602" y="712" font-family="Consolas, Monaco, monospace" font-size="14" fill="#6a9955" textLength="235" lengthAdjust="spacingAndGlyphs">// something is RIGHT THERE.</text>

  <text x="586" y="756" font-size="14" font-weight="bold" fill="#9a4459">Verdict: STOP.</text>
  <text x="586" y="786" font-size="13" fill="#7a4b58">Both sensors are telling the truth at the same time.</text>
  <text x="586" y="806" font-size="13" fill="#7a4b58">Deciding which one WINS is this lesson.</text>

</svg>
