<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" font-family="'Courier New', monospace">
  <rect x="10" y="10" width="340" height="220" rx="6" fill="#1e1e1e" stroke="#333"/>

  <text x="30" y="55" font-size="16" fill="#e8e8e8"><tspan fill="#569cd6">if</tspan> (sensorValue &gt; <tspan fill="#b5cea8">500</tspan>)</text>
  <text x="30" y="105" font-size="16" fill="#e8e8e8">{</text>
  <text x="68" y="155" font-size="16" fill="#e8e8e8">ledYellow(<tspan fill="#b5cea8">1</tspan>);</text>
  <text x="30" y="205" font-size="16" fill="#e8e8e8">}</text>

  <line x1="355" y1="50" x2="395" y2="50" stroke="#3a7d5c" stroke-width="2"/>
  <line x1="355" y1="100" x2="395" y2="100" stroke="#3a7d5c" stroke-width="2"/>
  <line x1="355" y1="150" x2="395" y2="150" stroke="#3a7d5c" stroke-width="2"/>
  <line x1="355" y1="200" x2="395" y2="200" stroke="#3a7d5c" stroke-width="2"/>

  <polygon points="395,44 407,50 395,56" fill="#3a7d5c"/>
  <polygon points="395,94 407,100 395,106" fill="#3a7d5c"/>
  <polygon points="395,144 407,150 395,156" fill="#3a7d5c"/>
  <polygon points="395,194 407,200 395,206" fill="#3a7d5c"/>

  <text x="415" y="47" font-size="14" font-family="Arial, sans-serif" fill="#2a5a42" font-weight="bold">THE CONDITION</text>
  <text x="415" y="64" font-size="13" font-family="Arial, sans-serif" fill="#333">a yes/no question</text>

  <text x="415" y="97" font-size="14" font-family="Arial, sans-serif" fill="#2a5a42" font-weight="bold">OPENING BRACE</text>
  <text x="415" y="114" font-size="13" font-family="Arial, sans-serif" fill="#333">"start doing stuff"</text>

  <text x="415" y="147" font-size="14" font-family="Arial, sans-serif" fill="#2a5a42" font-weight="bold">THE ACTION</text>
  <text x="415" y="164" font-size="13" font-family="Arial, sans-serif" fill="#333">only runs if condition is true</text>

  <text x="415" y="197" font-size="14" font-family="Arial, sans-serif" fill="#2a5a42" font-weight="bold">CLOSING BRACE</text>
  <text x="415" y="214" font-size="13" font-family="Arial, sans-serif" fill="#333">"stop doing stuff"</text>
</svg>
