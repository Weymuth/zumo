<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">Bang-Bang Steering: Why It Zigzags</title>
  <desc id="desc">RoboLore instructional graphic showing a robot repeatedly crossing a line because bang-bang steering can only command full left or full right corrections.</desc>

  <rect x="0" y="0" width="1100" height="850" fill="#F5F2E9"/>
  <text x="34" y="25" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2" fill="#3D5266">GRAPHIC 8.1</text>
  <text x="34" y="53" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#0B1A2E">Bang-Bang Steering: Why It Zigzags</text>
  <text x="1060" y="45" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#3D5266">Lesson 8 · full-left / full-right control</text>
  <line x1="34" y1="70" x2="1066" y2="70" stroke="#C9A463" stroke-width="2"/>

  <!-- Direction cue -->
  <polygon points="120,145 316,145 316,131 340,150 316,169 316,155 120,155" fill="#0B1A2E"/>
  <text x="130" y="132" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#0B1A2E" font-weight="700">robot travels this way</text>

  <!-- Teaching chart -->
  <rect x="60" y="180" width="980" height="500" rx="12" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
  <rect x="60" y="180" width="980" height="250" rx="12" fill="#EEF6FB"/>
  <rect x="60" y="418" width="980" height="12" fill="#EEF6FB"/>
  <rect x="60" y="430" width="980" height="250" rx="12" fill="#FFF5EC"/>
  <rect x="60" y="430" width="980" height="12" fill="#FFF5EC"/>
  <rect x="60" y="425" width="980" height="10" fill="#1E1E1E"/>
  <text x="80" y="208" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#007ACC" font-style="italic">robot is LEFT of the line</text>
  <text x="80" y="664" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#C77B30" font-style="italic">robot is RIGHT of the line</text>
  <text x="1032" y="414" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#0B1A2E" font-weight="700">the line</text>

  <!-- Oscillation path -->
  <polyline points="110,430 225,300 340,560 455,300 570,560 685,300 800,560 915,300 1030,560" fill="none" stroke="#D64541" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="225" cy="300" r="9" fill="#D64541"/>
  <text x="225" y="262" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17.5" fill="#0B1A2E" font-weight="700">sensor: line is to my RIGHT</text>
  <text x="225" y="284" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17.5" fill="#D64541" font-weight="700">→ crank FULL right</text>
  <circle cx="340" cy="560" r="9" fill="#D64541"/>
  <text x="340" y="590" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17.5" fill="#0B1A2E" font-weight="700">sensor: line is to my LEFT</text>
  <text x="340" y="612" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17.5" fill="#D64541" font-weight="700">→ crank FULL left</text>
  <circle cx="915" cy="300" r="9" fill="#D64541"/>
  <text x="905" y="280" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="17.5" fill="#3D5266" font-weight="700">50 crossings later — the wobble has not shrunk one bit</text>

  <!-- Key takeaway -->
  <rect x="60" y="712" width="980" height="104" rx="10" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1.5"/>
  <rect x="60" y="712" width="7" height="104" rx="3.5" fill="#007ACC"/>
  <text x="550" y="752" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#0B1A2E" font-weight="700">Bang-bang has one correction size: MAXIMUM.</text>
  <text x="550" y="786" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18.5" fill="#3D5266">It cannot steer “a little,” so it can never stop overcorrecting — the wobble never shrinks.</text>
</svg>