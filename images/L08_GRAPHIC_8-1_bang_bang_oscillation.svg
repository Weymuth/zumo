<svg viewBox="0 0 1100 850" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
<defs>
<linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#1a5276"/><stop offset="1" stop-color="#2e86ab"/>
</linearGradient>
</defs>
<rect x="0" y="0" width="1100" height="850" fill="#fafafa"/>
<rect x="20" y="20" width="1060" height="72" rx="10" fill="url(#band)"/>
<text x="550" y="58" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="bold">Bang-Bang Steering: Why It Zigzags</text>
<text x="550" y="84" text-anchor="middle" fill="#d6eaf8" font-size="17">Two choices only — full-lock left or full-lock right</text>
<rect x="60" y="180" width="980" height="250" fill="#eaf2fb"/>
<rect x="60" y="430" width="980" height="250" fill="#fdf0e6"/>
<text x="80" y="208" font-size="17" fill="#5b7fa6" font-style="italic">robot is LEFT of the line</text>
<text x="80" y="664" font-size="17" fill="#b07a4a" font-style="italic">robot is RIGHT of the line</text>
<rect x="60" y="425" width="980" height="10" fill="#222222"/>
<text x="1032" y="414" text-anchor="end" font-size="17" fill="#222222" font-weight="bold">the line</text>
<polygon points="120,145.0 316.0,145.0 316.0,131.0 340,150 316.0,169.0 316.0,155.0 120,155.0" fill="#2e86ab"/>
<text x="130" y="132" font-size="18" fill="#2e86ab" font-weight="bold">robot travels this way</text>
<polyline points="110,430 225,300 340,560 455,300 570,560 685,300 800,560 915,300 1030,560" fill="none" stroke="#c0392b" stroke-width="5" stroke-linejoin="round"/>
<circle cx="225" cy="300" r="9" fill="#c0392b"/>
<text x="225" y="262" text-anchor="middle" font-size="17.5" fill="#333333" font-weight="bold">sensor: line is to my RIGHT</text>
<text x="225" y="284" text-anchor="middle" font-size="17.5" fill="#c0392b" font-weight="bold">→ crank FULL right</text>
<circle cx="340" cy="560" r="9" fill="#c0392b"/>
<text x="340" y="590" text-anchor="middle" font-size="17.5" fill="#333333" font-weight="bold">sensor: line is to my LEFT</text>
<text x="340" y="612" text-anchor="middle" font-size="17.5" fill="#c0392b" font-weight="bold">→ crank FULL left</text>
<circle cx="915" cy="300" r="9" fill="#c0392b"/>
<text x="905" y="280" text-anchor="end" font-size="17.5" fill="#7d3c98" font-weight="bold">50 crossings later — the wobble has not shrunk one bit</text>
<rect x="60" y="712" width="980" height="104" rx="10" fill="#ffffff" stroke="#cccccc" stroke-width="1.5"/>
<text x="550" y="752" text-anchor="middle" font-size="21" fill="#333333" font-weight="bold">Bang-bang has one correction size: MAXIMUM.</text>
<text x="550" y="786" text-anchor="middle" font-size="18.5" fill="#555555">It cannot steer "a little," so it can never stop overcorrecting — the wobble never shrinks.</text>
</svg>
