<svg viewBox="0 0 1100 850" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="tband" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a5276"/><stop offset="1" stop-color="#2e86ab"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="850" fill="#ffffff"/>
  <rect x="0" y="0" width="1100" height="70" fill="url(#tband)"/>
  <text x="550" y="45" fill="#ffffff" font-size="30" font-weight="bold" text-anchor="middle">TRIM: BEFORE AND AFTER</text>

  <!-- LEFT PANEL: without trim -->
  <rect x="45" y="100" width="490" height="560" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
  <text x="290" y="140" font-size="22" font-weight="bold" fill="#c0392b" text-anchor="middle">WITHOUT TRIM &#8212; curves left</text>

  <!-- start marker -->
  <line x1="130" y1="600" x2="450" y2="600" stroke="#999999" stroke-width="2" stroke-dasharray="4 5"/>
  <text x="290" y="622" font-size="14" fill="#777777" text-anchor="middle">start line</text>
  <!-- curving path -->
  <path d="M 290 585 C 290 480 265 380 195 250" fill="none" stroke="#c0392b" stroke-width="4" stroke-dasharray="10 8"/>
  <polygon points="195,250 210,268 190,275" fill="#c0392b"/>
  <!-- intended straight ghost -->
  <line x1="290" y1="585" x2="290" y2="240" stroke="#bbbbbb" stroke-width="2" stroke-dasharray="3 6"/>
  <text x="315" y="235" font-size="13" fill="#999999">intended path</text>
  <!-- robot -->
  <g transform="translate(255 585)">
    <rect x="0" y="0" width="70" height="58" rx="8" fill="#2c3e50"/>
    <rect x="-10" y="4" width="12" height="50" rx="4" fill="#555555"/>
    <rect x="68" y="4" width="12" height="50" rx="4" fill="#555555"/>
    <polygon points="8,0 62,0 35,-16" fill="#7f8c8d"/>
  </g>
  <!-- speeds -->
  <rect x="85" y="365" width="130" height="54" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="150" y="387" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">Left: 200</text>
  <text x="150" y="408" font-size="14" fill="#333333" text-anchor="middle">(weaker motor)</text>
  <rect x="360" y="365" width="130" height="54" rx="8" fill="#ffffff" stroke="#555555" stroke-width="2"/>
  <text x="425" y="387" font-size="15" font-weight="bold" fill="#333333" text-anchor="middle">Right: 200</text>
  <text x="425" y="408" font-size="14" fill="#333333" text-anchor="middle">(pushes ahead)</text>
  <!-- code chip -->
  <rect x="75" y="450" width="430" height="52" rx="8" fill="#1e1e1e"/>
  <text x="290" y="483" font-family="'Courier New', monospace" font-size="18" fill="#9cdcfe" text-anchor="middle" textLength="380">motors.setSpeeds(200, 200);</text>
  <text x="290" y="535" font-size="15" fill="#333333" text-anchor="middle">Same number to both motors &#8212;</text>
  <text x="290" y="557" font-size="15" fill="#333333" text-anchor="middle">but real motors are never twins.</text>

  <!-- RIGHT PANEL: with trim -->
  <rect x="565" y="100" width="490" height="560" rx="12" fill="#e8f6ef" stroke="#1e8449" stroke-width="3"/>
  <text x="810" y="140" font-size="22" font-weight="bold" fill="#1e8449" text-anchor="middle">WITH TRIM (+15) &#8212; drives straight</text>

  <line x1="650" y1="600" x2="970" y2="600" stroke="#999999" stroke-width="2" stroke-dasharray="4 5"/>
  <text x="810" y="622" font-size="14" fill="#777777" text-anchor="middle">start line</text>
  <path d="M 810 585 L 810 250" fill="none" stroke="#1e8449" stroke-width="4" stroke-dasharray="10 8"/>
  <polygon points="810,240 798,262 822,262" fill="#1e8449"/>
  <g transform="translate(775 585)">
    <rect x="0" y="0" width="70" height="58" rx="8" fill="#2c3e50"/>
    <rect x="-10" y="4" width="12" height="50" rx="4" fill="#555555"/>
    <rect x="68" y="4" width="12" height="50" rx="4" fill="#555555"/>
    <polygon points="8,0 62,0 35,-16" fill="#7f8c8d"/>
  </g>
  <rect x="605" y="365" width="130" height="54" rx="8" fill="#ffffff" stroke="#1e8449" stroke-width="2"/>
  <text x="670" y="387" font-size="15" font-weight="bold" fill="#1e8449" text-anchor="middle">Left: 215</text>
  <text x="670" y="408" font-size="14" fill="#333333" text-anchor="middle">(200 + 15 boost)</text>
  <rect x="880" y="365" width="130" height="54" rx="8" fill="#ffffff" stroke="#555555" stroke-width="2"/>
  <text x="945" y="387" font-size="15" font-weight="bold" fill="#333333" text-anchor="middle">Right: 200</text>
  <text x="945" y="408" font-size="14" fill="#333333" text-anchor="middle">(unchanged)</text>
  <rect x="595" y="450" width="430" height="52" rx="8" fill="#1e1e1e"/>
  <text x="810" y="483" font-family="'Courier New', monospace" font-size="18" fill="#9cdcfe" text-anchor="middle" textLength="400">motors.setSpeeds(200 + 15, 200);</text>
  <text x="810" y="535" font-size="15" fill="#333333" text-anchor="middle">A small boost to the weaker LEFT motor</text>
  <text x="810" y="557" font-size="15" fill="#333333" text-anchor="middle">balances them out.</text>

  <!-- footer -->
  <rect x="90" y="700" width="920" height="110" rx="10" fill="#fdf6e3" stroke="#b7950b" stroke-width="2.5"/>
  <text x="550" y="740" font-size="18" font-weight="bold" fill="#7d6608" text-anchor="middle">Curves LEFT = LEFT motor weak = positive TRIM boosts the left.</text>
  <text x="550" y="772" font-size="17" fill="#333333" text-anchor="middle">Your robot's TRIM number will be different from +15 &#8212; find yours with the adjustment loop.</text>
</svg>
