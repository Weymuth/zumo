<svg viewBox="0 0 1100 850" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
<defs>
<linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#1a5276"/><stop offset="1" stop-color="#2e86ab"/>
</linearGradient>
</defs>
<rect x="0" y="0" width="1100" height="850" fill="#fafafa"/>
<rect x="20" y="20" width="1060" height="72" rx="10" fill="url(#band)"/>
<text x="550" y="58" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="bold">Tuning Kp: Three Robots, Same Track</text>
<text x="550" y="84" text-anchor="middle" fill="#d6eaf8" font-size="17">Read the symptom on the straight and the curve — then reach for A or C</text>
<rect x="50" y="113" width="1000" height="200" rx="12" fill="#ffffff" stroke="#2e86ab" stroke-width="2.5"/>
<text x="80" y="149" font-size="22" font-weight="bold" fill="#2e86ab">Kp too LOW</text>
<text x="258" y="149" font-family="Courier New, monospace" font-size="20" fill="#555555" font-weight="normal" text-anchor="start" textLength="108" lengthAdjust="spacingAndGlyphs">Kp = 0.02</text>
<path d="M 120 221 L 640 221 C 740 221 800 235 850 293" fill="none" stroke="#222222" stroke-width="6" stroke-linecap="round"/>
<text x="1030" y="149" font-size="15.5" fill="#555555" text-anchor="end">Symptom: fine on the straight, drifts wide off every curve</text>
<text x="1030" y="171" font-size="15.5" font-weight="bold" fill="#2e86ab" text-anchor="end">Fix: press C — raise Kp</text>
<rect x="50" y="328" width="1000" height="200" rx="12" fill="#ffffff" stroke="#3d8b6e" stroke-width="2.5"/>
<text x="80" y="364" font-size="22" font-weight="bold" fill="#3d8b6e">Kp just RIGHT</text>
<text x="258" y="364" font-family="Courier New, monospace" font-size="20" fill="#555555" font-weight="normal" text-anchor="start" textLength="192" lengthAdjust="spacingAndGlyphs">Kp = 0.10 - 0.25</text>
<path d="M 120 436 L 640 436 C 740 436 800 450 850 508" fill="none" stroke="#222222" stroke-width="6" stroke-linecap="round"/>
<text x="1030" y="364" font-size="15.5" fill="#555555" text-anchor="end">Small wiggle, holds the curve — write this number down!</text>
<text x="1030" y="386" font-size="15.5" font-weight="bold" fill="#3d8b6e" text-anchor="end">Fix: nothing. You are done tuning.</text>
<rect x="50" y="543" width="1000" height="200" rx="12" fill="#ffffff" stroke="#c0392b" stroke-width="2.5"/>
<text x="80" y="579" font-size="22" font-weight="bold" fill="#c0392b">Kp too HIGH</text>
<text x="258" y="579" font-family="Courier New, monospace" font-size="20" fill="#555555" font-weight="normal" text-anchor="start" textLength="108" lengthAdjust="spacingAndGlyphs">Kp = 0.60</text>
<path d="M 120 651 L 640 651 C 740 651 800 665 850 723" fill="none" stroke="#222222" stroke-width="6" stroke-linecap="round"/>
<text x="1030" y="579" font-size="15.5" fill="#555555" text-anchor="end">Symptom: wiggles hard even on the straight, worse each swing</text>
<text x="1030" y="601" font-size="15.5" font-weight="bold" fill="#c0392b" text-anchor="end">Fix: press A — lower Kp</text>
<path d="M 120 221 L 640 221 C 760 221 850 231 960 247" fill="none" stroke="#2e86ab" stroke-width="3.5" stroke-dasharray="9 6"/>
<text x="965" y="239" font-size="15" fill="#2e86ab" font-weight="bold">off it goes</text>
<path d="M 120 436 Q 165 427 210 436 T 300 436 T 390 436 T 480 436 T 570 436 T 645 437 C 742 438 799 452 848 508" fill="none" stroke="#3d8b6e" stroke-width="3.5" stroke-dasharray="9 6"/>
<polyline points="120,651 170,668 220,629 270,678 320,619 370,688 420,609 470,697 520,605 570,697 620,605" fill="none" stroke="#c0392b" stroke-width="3.5" stroke-dasharray="9 6"/>
<path d="M 620 617 L 700 703 L 770 643 L 830 737" fill="none" stroke="#c0392b" stroke-width="3.5" stroke-dasharray="9 6"/>
<rect x="50" y="820" width="0" height="0" fill="none"/>
</svg>
