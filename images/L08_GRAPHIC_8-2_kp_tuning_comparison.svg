<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">Tuning Kp: Three Robots, Same Track</title>
  <desc id="desc">RoboLore instructional comparison of proportional gain values that are too low, correctly tuned, and too high.</desc>

  <rect x="0" y="0" width="1100" height="850" fill="#F5F2E9"/>
  <text x="34" y="25" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2" fill="#3D5266">GRAPHIC 8.2</text>
  <text x="34" y="53" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#0B1A2E">Tuning Kp: Three Robots, Same Track</text>
  <text x="1060" y="45" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#3D5266">Read the symptom — then press A or C</text>
  <line x1="34" y1="70" x2="1066" y2="70" stroke="#C9A463" stroke-width="2"/>

  <!-- Kp too low -->
  <rect x="50" y="113" width="1000" height="200" rx="12" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
  <rect x="50" y="113" width="7" height="200" rx="3.5" fill="#007ACC"/>
  <rect x="57" y="113" width="993" height="46" rx="12" fill="#F3F3F3"/>
  <rect x="57" y="147" width="993" height="12" fill="#F3F3F3"/>
  <text x="80" y="149" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0B1A2E">Kp too LOW</text>
  <text x="258" y="149" font-family="Courier New, monospace" font-size="20" fill="#3D5266" text-anchor="start" textLength="108" lengthAdjust="spacingAndGlyphs">Kp = 0.02</text>
  <path d="M 120 221 L 640 221 C 740 221 800 235 850 293" fill="none" stroke="#0B1A2E" stroke-width="6" stroke-linecap="round"/>
  <text x="1030" y="149" font-family="Arial, Helvetica, sans-serif" font-size="15.5" fill="#3D5266" text-anchor="end">Symptom: fine on the straight, drifts wide off every curve</text>
  <text x="1030" y="171" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#007ACC" text-anchor="end">Fix: press C — raise Kp</text>
  <path d="M 120 221 L 640 221 C 760 221 850 231 960 247" fill="none" stroke="#007ACC" stroke-width="3.5" stroke-dasharray="9 6"/>
  <text x="965" y="239" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#007ACC" font-weight="700">off it goes</text>

  <!-- Kp just right -->
  <rect x="50" y="328" width="1000" height="200" rx="12" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
  <rect x="50" y="328" width="7" height="200" rx="3.5" fill="#2E8B57"/>
  <rect x="57" y="328" width="993" height="46" rx="12" fill="#F3F3F3"/>
  <rect x="57" y="362" width="993" height="12" fill="#F3F3F3"/>
  <text x="80" y="364" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0B1A2E">Kp just RIGHT</text>
  <text x="258" y="364" font-family="Courier New, monospace" font-size="20" fill="#3D5266" text-anchor="start" textLength="192" lengthAdjust="spacingAndGlyphs">Kp = 0.10 - 0.25</text>
  <path d="M 120 436 L 640 436 C 740 436 800 450 850 508" fill="none" stroke="#0B1A2E" stroke-width="6" stroke-linecap="round"/>
  <text x="1030" y="364" font-family="Arial, Helvetica, sans-serif" font-size="15.5" fill="#3D5266" text-anchor="end">Small wiggle, holds the curve — write this number down!</text>
  <text x="1030" y="386" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#2E8B57" text-anchor="end">Fix: nothing. You are done tuning.</text>
  <path d="M 120 436 Q 165 427 210 436 T 300 436 T 390 436 T 480 436 T 570 436 T 645 437 C 742 438 799 452 848 508" fill="none" stroke="#2E8B57" stroke-width="3.5" stroke-dasharray="9 6"/>

  <!-- Kp too high -->
  <rect x="50" y="543" width="1000" height="200" rx="12" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
  <rect x="50" y="543" width="7" height="200" rx="3.5" fill="#D64541"/>
  <rect x="57" y="543" width="993" height="46" rx="12" fill="#F3F3F3"/>
  <rect x="57" y="577" width="993" height="12" fill="#F3F3F3"/>
  <text x="80" y="579" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0B1A2E">Kp too HIGH</text>
  <text x="258" y="579" font-family="Courier New, monospace" font-size="20" fill="#3D5266" text-anchor="start" textLength="108" lengthAdjust="spacingAndGlyphs">Kp = 0.60</text>
  <path d="M 120 651 L 640 651 C 740 651 800 665 850 723" fill="none" stroke="#0B1A2E" stroke-width="6" stroke-linecap="round"/>
  <text x="1030" y="579" font-family="Arial, Helvetica, sans-serif" font-size="15.5" fill="#3D5266" text-anchor="end">Symptom: wiggles hard even on the straight, worse each swing</text>
  <text x="1030" y="601" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#D64541" text-anchor="end">Fix: press A — lower Kp</text>
  <polyline points="120,651 170,668 220,629 270,678 320,619 370,688 420,609 470,697 520,605 570,697 620,605" fill="none" stroke="#D64541" stroke-width="3.5" stroke-dasharray="9 6"/>
  <path d="M 620 617 L 700 703 L 770 643 L 830 737" fill="none" stroke="#D64541" stroke-width="3.5" stroke-dasharray="9 6"/>

  <line x1="34" y1="790" x2="1066" y2="790" stroke="#C9A463" stroke-width="2"/>
  <text x="550" y="824" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#3D5266">Too low drifts wide. Too high oscillates. The right value tracks the curve with only a small wiggle.</text>
</svg>