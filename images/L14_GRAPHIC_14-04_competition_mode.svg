<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850">
<defs>
<linearGradient id="tb" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#1a5276"/><stop offset="1" stop-color="#2e86ab"/>
</linearGradient>
</defs>
<rect width="1100" height="850" fill="#ffffff"/>
<rect x="0" y="0" width="1100" height="64" fill="url(#tb)"/>
<text x="550" y="41" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">What COMPETITION_MODE Touches</text>
<text x="550" y="94" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#555" text-anchor="middle">One switch. It strips theatre. It must never touch safety.</text>
<rect x="80" y="150" width="440" height="290" fill="#eafaf1" stroke="#3a7d5c" stroke-width="2" rx="8"/>
<text x="300" y="185" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#186a3b" text-anchor="middle" font-weight="bold">THE TOGGLE STRIPS THIS</text>
<text x="300" y="210" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#186a3b" text-anchor="middle" font-style="italic">theatre &#8212; for humans, not for the robot</text>
<rect x="105" y="250" width="390" height="38" fill="#ffffff" stroke="#a9dfbf" stroke-width="2" rx="6"/>
<text x="122" y="275" font-family="Courier New,monospace" font-size="15" fill="#333" text-anchor="start">delay(600) at the intersection call</text>
<rect x="105" y="298" width="390" height="38" fill="#ffffff" stroke="#a9dfbf" stroke-width="2" rx="6"/>
<text x="122" y="323" font-family="Courier New,monospace" font-size="15" fill="#333" text-anchor="start">delay(600) at the obstacle stop</text>
<rect x="105" y="346" width="390" height="38" fill="#ffffff" stroke="#a9dfbf" stroke-width="2" rx="6"/>
<text x="122" y="371" font-family="Courier New,monospace" font-size="15" fill="#333" text-anchor="start">delay(600) at the rescue-zone door</text>
<text x="300" y="415" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#186a3b" text-anchor="middle" font-weight="bold">1.8 seconds the clock never gives back</text>
<rect x="580" y="150" width="440" height="290" fill="#fdecea" stroke="#c0392b" stroke-width="2" rx="8"/>
<text x="800" y="185" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#7b241c" text-anchor="middle" font-weight="bold">IT MUST NEVER TOUCH THIS</text>
<text x="800" y="210" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#7b241c" text-anchor="middle" font-style="italic">safety &#8212; for the robot, and for the room</text>
<rect x="605" y="250" width="390" height="38" fill="#ffffff" stroke="#f5b7b1" stroke-width="2" rx="6"/>
<text x="622" y="275" font-family="Courier New,monospace" font-size="15" fill="#333" text-anchor="start">the kill-switch poll</text>
<rect x="605" y="298" width="390" height="38" fill="#ffffff" stroke="#f5b7b1" stroke-width="2" rx="6"/>
<text x="622" y="323" font-family="Courier New,monospace" font-size="15" fill="#333" text-anchor="start">the boot self-test</text>
<rect x="605" y="346" width="390" height="38" fill="#ffffff" stroke="#f5b7b1" stroke-width="2" rx="6"/>
<text x="622" y="371" font-family="Courier New,monospace" font-size="15" fill="#333" text-anchor="start">the waitForStart() gate</text>
<text x="800" y="415" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#7b241c" text-anchor="middle" font-weight="bold">costs microseconds. Buys everything.</text>
<rect x="80" y="480" width="940" height="96" fill="#fef5e7" stroke="#b9770e" stroke-width="2" rx="8"/>
<text x="105" y="512" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#7e5109" text-anchor="start" font-weight="bold">The costs differ by five orders of magnitude. The stakes differ by more.</text>
<text x="105" y="546" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#7e5109" text-anchor="start">A demo pause protects nothing and costs 600 ms. The kill-switch poll costs microseconds and is the only thing</text>
<text x="105" y="568" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#7e5109" text-anchor="start">between a confused robot and the edge of the table.</text>
<rect x="80" y="606" width="940" height="62" fill="#ffffff" stroke="#ccc" stroke-width="2" rx="8"/>
<text x="105" y="632" font-family="Courier New,monospace" font-size="16" fill="#333" text-anchor="start" font-weight="bold">COMPETITION_MODE = false</text>
<text x="400" y="632" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#555" text-anchor="start">practice. The guard compiles to nothing. The delays stay. Free.</text>
<text x="105" y="654" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#fff" text-anchor="start">&#160;</text>
<rect x="80" y="678" width="940" height="62" fill="#ffffff" stroke="#ccc" stroke-width="2" rx="8"/>
<text x="105" y="704" font-family="Courier New,monospace" font-size="16" fill="#333" text-anchor="start" font-weight="bold">COMPETITION_MODE = true</text>
<text x="400" y="704" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#555" text-anchor="start">match. The compiler deletes the delays outright. Prove it in the bytes (7C).</text>
<text x="550" y="800" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#7b241c" text-anchor="middle" font-style="italic">A safety feature that has been optimised away is worse than one that never existed &#8212;</text>
<text x="550" y="824" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#7b241c" text-anchor="middle" font-style="italic">because the team still believes it is there.</text>
</svg>
