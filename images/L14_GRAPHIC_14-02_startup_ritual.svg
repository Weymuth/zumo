<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850">
<defs>
<linearGradient id="tb" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#1a5276"/><stop offset="1" stop-color="#2e86ab"/>
</linearGradient>
</defs>
<rect width="1100" height="850" fill="#ffffff"/>
<rect x="0" y="0" width="1100" height="64" fill="url(#tb)"/>
<text x="550" y="41" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">The Startup Ritual</text>
<text x="550" y="94" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#555" text-anchor="middle">Boot order, enforced by code instead of remembered. Every arrow has a reason.</text>
<rect x="210" y="150" width="680" height="62" fill="#ffffff" stroke="#2e86ab" stroke-width="3" rx="8"/>
<rect x="210" y="150" width="10" height="62" fill="#2e86ab" rx="0"/>
<text x="242" y="177" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#2e86ab" text-anchor="start" font-weight="bold">Banner &amp; battery</text>
<text x="242" y="199" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#555" text-anchor="start">checkBattery() &#8212; before anything else</text>
<text x="868" y="187" font-family="Courier New,monospace" font-size="13" fill="#999" text-anchor="end">L4</text>
<polygon points="546.5,212 553.5,212 553.5,224 563,224 550,238 537,224 546.5,224" fill="#aaa"/>
<rect x="210" y="238" width="680" height="62" fill="#ffffff" stroke="#2e86ab" stroke-width="3" rx="8"/>
<rect x="210" y="238" width="10" height="62" fill="#2e86ab" rx="0"/>
<text x="242" y="265" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#2e86ab" text-anchor="start" font-weight="bold">Sensors init</text>
<text x="242" y="287" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#555" text-anchor="start">initFiveSensors(), initFrontSensor()</text>
<text x="868" y="275" font-family="Courier New,monospace" font-size="13" fill="#999" text-anchor="end">L4/L10</text>
<polygon points="546.5,300 553.5,300 553.5,312 563,312 550,326 537,312 546.5,312" fill="#aaa"/>
<rect x="210" y="326" width="680" height="62" fill="#ffffff" stroke="#b9770e" stroke-width="3" rx="8"/>
<rect x="210" y="326" width="10" height="62" fill="#b9770e" rx="0"/>
<text x="242" y="353" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#b9770e" text-anchor="start" font-weight="bold">Gyro zero</text>
<text x="242" y="375" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#555" text-anchor="start">1,024 samples. THE ROBOT MUST BE STILL.</text>
<text x="868" y="363" font-family="Courier New,monospace" font-size="13" fill="#999" text-anchor="end">L12</text>
<polygon points="546.5,388 553.5,388 553.5,400 563,400 550,414 537,400 546.5,400" fill="#aaa"/>
<rect x="210" y="414" width="680" height="62" fill="#ffffff" stroke="#2a5a42" stroke-width="3" rx="8"/>
<rect x="210" y="414" width="10" height="62" fill="#2a5a42" rx="0"/>
<text x="242" y="441" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#2a5a42" text-anchor="start" font-weight="bold">selfTest()</text>
<text x="242" y="463" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#555" text-anchor="start">BATT &#183; LINE &#183; GYRO &#183; PROX &#8212; before anything moves</text>
<text x="868" y="451" font-family="Courier New,monospace" font-size="13" fill="#999" text-anchor="end">L14</text>
<polygon points="546.5,476 553.5,476 553.5,488 563,488 550,502 537,488 546.5,488" fill="#aaa"/>
<rect x="210" y="502" width="680" height="62" fill="#ffffff" stroke="#3a7d5c" stroke-width="3" rx="8"/>
<rect x="210" y="502" width="10" height="62" fill="#3a7d5c" rx="0"/>
<text x="242" y="529" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#3a7d5c" text-anchor="start" font-weight="bold">waitForStart()</text>
<text x="242" y="551" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#555" text-anchor="start">the A-gate. Nothing moves until a human says so.</text>
<text x="868" y="539" font-family="Courier New,monospace" font-size="13" fill="#999" text-anchor="end">L4</text>
<polygon points="546.5,564 553.5,564 553.5,576 563,576 550,590 537,576 546.5,576" fill="#aaa"/>
<rect x="210" y="590" width="680" height="62" fill="#ffffff" stroke="#b9770e" stroke-width="3" rx="8"/>
<rect x="210" y="590" width="10" height="62" fill="#b9770e" rx="0"/>
<text x="242" y="617" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#b9770e" text-anchor="start" font-weight="bold">Line calibration</text>
<text x="242" y="639" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#555" text-anchor="start">the robot SPINS. This is why the gyro zero came first.</text>
<text x="868" y="627" font-family="Courier New,monospace" font-size="13" fill="#999" text-anchor="end">L8</text>
<polygon points="546.5,652 553.5,652 553.5,664 563,664 550,678 537,664 546.5,664" fill="#aaa"/>
<rect x="210" y="678" width="680" height="62" fill="#ffffff" stroke="#2a5a42" stroke-width="3" rx="8"/>
<rect x="210" y="678" width="10" height="62" fill="#2a5a42" rx="0"/>
<text x="242" y="705" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#2a5a42" text-anchor="start" font-weight="bold">ARMED</text>
<text x="242" y="727" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#555" text-anchor="start">the match may begin</text>
<text x="868" y="715" font-family="Courier New,monospace" font-size="13" fill="#999" text-anchor="end">&#8212;</text>
<rect x="120" y="762" width="860" height="62" fill="#eafaf1" stroke="#3a7d5c" stroke-width="2" rx="8"/>
<text x="150" y="786" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#186a3b" text-anchor="start" font-weight="bold">Reverse the gyro zero and the calibration spin, and the spin poisons the zero.</text>
<text x="150" y="810" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#186a3b" text-anchor="start" font-style="italic">The self-test sits guard over the most fragile arrow in the chain.</text>
</svg>
