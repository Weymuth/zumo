<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850">
  <rect width="1100" height="850" fill="#F5F2E9"/>
  <rect x="0" y="0" width="1100" height="74" fill="#0B1A2E"/>
  <text x="34" y="47" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" fill="#FFFFFF">Calibration: Measuring the Lie</text>

  <text x="550" y="116" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#3D5266">A gyro that is perfectly still does not report zero. Find out what it DOES report, and subtract it.</text>

  <!-- STEP 1 -->
  <rect x="50" y="150" width="1000" height="200" rx="10" fill="#ffffff" stroke="#CCA700" stroke-width="3"/>
  <rect x="50" y="150" width="1000" height="44" rx="10" fill="#CCA700"/>
  <rect x="50" y="180" width="1000" height="14" fill="#CCA700"/>
  <text x="70" y="181" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF">STEP 1 — The robot sits perfectly still. It reads the gyro 1,024 times.</text>

  <text x="80" y="228" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6A5335">Every reading SHOULD be 0. Not one of them is.</text>

  <!-- noisy samples around a nonzero mean -->
  <line x1="80" y1="300" x2="1020" y2="300" stroke="#9AA7B2" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="1032" y="305" font-family="Courier New, monospace" font-size="14" fill="#66788A">0</text>
  <line x1="80" y1="272" x2="1020" y2="272" stroke="#F44747" stroke-width="3"/>
  <text x="1032" y="277" font-family="Courier New, monospace" font-size="14" font-weight="700" fill="#B42318">-19</text>

  <circle cx="110" cy="262" r="4" fill="#CCA700"/><circle cx="150" cy="284" r="4" fill="#CCA700"/>
  <circle cx="190" cy="256" r="4" fill="#CCA700"/><circle cx="230" cy="278" r="4" fill="#CCA700"/>
  <circle cx="270" cy="266" r="4" fill="#CCA700"/><circle cx="310" cy="288" r="4" fill="#CCA700"/>
  <circle cx="350" cy="252" r="4" fill="#CCA700"/><circle cx="390" cy="276" r="4" fill="#CCA700"/>
  <circle cx="430" cy="264" r="4" fill="#CCA700"/><circle cx="470" cy="282" r="4" fill="#CCA700"/>
  <circle cx="510" cy="258" r="4" fill="#CCA700"/><circle cx="550" cy="274" r="4" fill="#CCA700"/>
  <circle cx="590" cy="286" r="4" fill="#CCA700"/><circle cx="630" cy="260" r="4" fill="#CCA700"/>
  <circle cx="670" cy="280" r="4" fill="#CCA700"/><circle cx="710" cy="254" r="4" fill="#CCA700"/>
  <circle cx="750" cy="270" r="4" fill="#CCA700"/><circle cx="790" cy="290" r="4" fill="#CCA700"/>
  <circle cx="830" cy="262" r="4" fill="#CCA700"/><circle cx="870" cy="278" r="4" fill="#CCA700"/>
  <circle cx="910" cy="256" r="4" fill="#CCA700"/><circle cx="950" cy="284" r="4" fill="#CCA700"/>
  <circle cx="990" cy="268" r="4" fill="#CCA700"/>
  <text x="80" y="336" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#6A5335">The readings jitter — but they jitter around a value that is NOT zero. That steady part is the bias.</text>

  <!-- arrow down: single polygon -->
  <polygon points="550,356 578,392 560,392 560,404 540,404 540,392 522,392" fill="#3D5266"/>

  <!-- STEP 2 -->
  <rect x="50" y="416" width="1000" height="128" rx="10" fill="#ffffff" stroke="#3D5266" stroke-width="3"/>
  <rect x="50" y="416" width="1000" height="44" rx="10" fill="#3D5266"/>
  <rect x="50" y="446" width="1000" height="14" fill="#3D5266"/>
  <text x="70" y="447" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF">STEP 2 — Average all 1,024. That average IS the lie.</text>
  <text x="550" y="500" text-anchor="middle" font-family="Courier New, monospace" font-size="20" fill="#0B1A2E">gyroOffset = total / GYRO_CAL_SAMPLES;</text>
  <text x="550" y="528" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#3D5266">Averaging cancels the jitter and leaves the steady part — the part you can subtract.</text>

  <polygon points="550,556 578,592 560,592 560,604 540,604 540,592 522,592" fill="#2FAE66"/>

  <!-- STEP 3 -->
  <rect x="50" y="616" width="1000" height="150" rx="10" fill="#ffffff" stroke="#2FAE66" stroke-width="3"/>
  <rect x="50" y="616" width="1000" height="44" rx="10" fill="#2FAE66"/>
  <rect x="50" y="646" width="1000" height="14" fill="#2FAE66"/>
  <text x="70" y="647" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#FFFFFF">STEP 3 — Subtract it from every reading, forever after.</text>
  <text x="550" y="702" text-anchor="middle" font-family="Courier New, monospace" font-size="21" fill="#265F45">turnRate = imu.g.z - gyroOffset;</text>
  <text x="352" y="734" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#66788A">the raw lie</text>
  <text x="640" y="734" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#66788A">minus the lie you measured</text>
  <text x="880" y="734" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2F7D55">= the truth</text>

  <text x="550" y="812" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#B42318">If the robot MOVES during Step 1, it learns that moving is what standing still feels like.</text>
</svg>
