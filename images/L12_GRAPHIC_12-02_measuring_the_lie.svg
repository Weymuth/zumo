<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850">
  <defs>
    <linearGradient id="tb2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a5276"/><stop offset="1" stop-color="#2e86ab"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="850" fill="#fafafa"/>
  <rect x="0" y="0" width="1100" height="74" fill="url(#tb2)"/>
  <text x="34" y="47" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#ffffff">Calibration: Measuring the Lie</text>

  <text x="550" y="116" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#555">A gyro that is perfectly still does not report zero. Find out what it DOES report, and subtract it.</text>

  <!-- STEP 1 -->
  <rect x="50" y="150" width="1000" height="200" rx="10" fill="#ffffff" stroke="#f39c12" stroke-width="3"/>
  <rect x="50" y="150" width="1000" height="44" rx="10" fill="#f39c12"/>
  <rect x="50" y="180" width="1000" height="14" fill="#f39c12"/>
  <text x="70" y="181" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#ffffff">STEP 1 &#8212; The robot sits perfectly still. It reads the gyro 1,024 times.</text>

  <text x="80" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#7e5109">Every reading SHOULD be 0. Not one of them is.</text>

  <!-- noisy samples around a nonzero mean -->
  <line x1="80" y1="300" x2="1020" y2="300" stroke="#95a5a6" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="1032" y="305" font-family="Consolas, monospace" font-size="14" fill="#7f8c8d">0</text>
  <line x1="80" y1="272" x2="1020" y2="272" stroke="#e74c3c" stroke-width="3"/>
  <text x="1032" y="277" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#c0392b">-19</text>

  <circle cx="110" cy="262" r="4" fill="#f39c12"/><circle cx="150" cy="284" r="4" fill="#f39c12"/>
  <circle cx="190" cy="256" r="4" fill="#f39c12"/><circle cx="230" cy="278" r="4" fill="#f39c12"/>
  <circle cx="270" cy="266" r="4" fill="#f39c12"/><circle cx="310" cy="288" r="4" fill="#f39c12"/>
  <circle cx="350" cy="252" r="4" fill="#f39c12"/><circle cx="390" cy="276" r="4" fill="#f39c12"/>
  <circle cx="430" cy="264" r="4" fill="#f39c12"/><circle cx="470" cy="282" r="4" fill="#f39c12"/>
  <circle cx="510" cy="258" r="4" fill="#f39c12"/><circle cx="550" cy="274" r="4" fill="#f39c12"/>
  <circle cx="590" cy="286" r="4" fill="#f39c12"/><circle cx="630" cy="260" r="4" fill="#f39c12"/>
  <circle cx="670" cy="280" r="4" fill="#f39c12"/><circle cx="710" cy="254" r="4" fill="#f39c12"/>
  <circle cx="750" cy="270" r="4" fill="#f39c12"/><circle cx="790" cy="290" r="4" fill="#f39c12"/>
  <circle cx="830" cy="262" r="4" fill="#f39c12"/><circle cx="870" cy="278" r="4" fill="#f39c12"/>
  <circle cx="910" cy="256" r="4" fill="#f39c12"/><circle cx="950" cy="284" r="4" fill="#f39c12"/>
  <circle cx="990" cy="268" r="4" fill="#f39c12"/>
  <text x="80" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#7e5109">The readings jitter &#8212; but they jitter around a value that is NOT zero. That steady part is the bias.</text>

  <!-- arrow down: single polygon -->
  <polygon points="550,356 578,392 560,392 560,404 540,404 540,392 522,392" fill="#2e86ab"/>

  <!-- STEP 2 -->
  <rect x="50" y="416" width="1000" height="128" rx="10" fill="#ffffff" stroke="#2e86ab" stroke-width="3"/>
  <rect x="50" y="416" width="1000" height="44" rx="10" fill="#2e86ab"/>
  <rect x="50" y="446" width="1000" height="14" fill="#2e86ab"/>
  <text x="70" y="447" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#ffffff">STEP 2 &#8212; Average all 1,024. That average IS the lie.</text>
  <text x="550" y="500" text-anchor="middle" font-family="Consolas, monospace" font-size="20" fill="#1a5276">gyroOffset = total / GYRO_CAL_SAMPLES;</text>
  <text x="550" y="528" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#555">Averaging cancels the jitter and leaves the steady part &#8212; the part you can subtract.</text>

  <polygon points="550,556 578,592 560,592 560,604 540,604 540,592 522,592" fill="#27ae60"/>

  <!-- STEP 3 -->
  <rect x="50" y="616" width="1000" height="150" rx="10" fill="#ffffff" stroke="#27ae60" stroke-width="3"/>
  <rect x="50" y="616" width="1000" height="44" rx="10" fill="#27ae60"/>
  <rect x="50" y="646" width="1000" height="14" fill="#27ae60"/>
  <text x="70" y="647" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#ffffff">STEP 3 &#8212; Subtract it from every reading, forever after.</text>
  <text x="550" y="702" text-anchor="middle" font-family="Consolas, monospace" font-size="21" fill="#145a32">turnRate = imu.g.z - gyroOffset;</text>
  <text x="352" y="734" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#7f8c8d">the raw lie</text>
  <text x="640" y="734" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#7f8c8d">minus the lie you measured</text>
  <text x="880" y="734" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e8449">= the truth</text>

  <text x="550" y="812" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#c0392b">If the robot MOVES during Step 1, it learns that moving is what standing still feels like.</text>
</svg>
