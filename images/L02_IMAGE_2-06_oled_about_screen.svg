<svg viewBox="0 0 1100 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a5276"/>
      <stop offset="1" stop-color="#2e86ab"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1100" height="560" fill="#ffffff"/>

  <!-- Title band -->
  <rect x="40" y="24" width="1020" height="52" rx="8" fill="url(#titleGrad)"/>
  <text x="60" y="59" fill="#ffffff" font-size="24" font-weight="bold">OLED — ABOUT SCREEN</text>
  <text x="1040" y="57" fill="#d6e9f2" font-size="13" text-anchor="end">Zumo 32U4 Robotics &#183; Lesson 2</text>

  <!-- ===== OLED MODULE (physical PCB) ===== -->
  <!-- PCB board (green) -->
  <rect x="270" y="108" width="560" height="380" rx="8" fill="#2a5a2a" stroke="#1a3a1a" stroke-width="2"/>

  <!-- Connector pins at top -->
  <rect x="380" y="104" width="340" height="16" rx="2" fill="#1e3a1e"/>
  <text x="550" y="116" fill="#6a9955" font-size="10" font-family="Courier New, monospace" text-anchor="middle">GND VCC CLK MOS RES DC CS</text>

  <!-- Mounting holes -->
  <circle cx="294" cy="130" r="7" fill="#1a3a1a" stroke="#3a6a3a" stroke-width="1.5"/>
  <circle cx="806" cy="130" r="7" fill="#1a3a1a" stroke="#3a6a3a" stroke-width="1.5"/>
  <circle cx="294" cy="462" r="7" fill="#1a3a1a" stroke="#3a6a3a" stroke-width="1.5"/>
  <circle cx="806" cy="462" r="7" fill="#1a3a1a" stroke="#3a6a3a" stroke-width="1.5"/>

  <!-- ===== OLED SCREEN BEZEL ===== -->
  <rect x="310" y="148" width="480" height="290" rx="4" fill="#111111" stroke="#333333" stroke-width="2"/>

  <!-- ===== SCREEN AREA (active pixels) ===== -->
  <rect x="322" y="158" width="456" height="270" rx="2" fill="#050505"/>

  <!-- ===== SCREEN CONTENT (21×8 layout, white text on black) ===== -->
  <!-- Row 0: === ABOUT === -->
  <text x="550" y="196" fill="#e8f8e8" font-size="22" font-weight="bold" font-family="Courier New, monospace" text-anchor="middle">=== ABOUT ===</text>

  <!-- Row 1: (blank) -->

  <!-- Row 2: Lesson 2 Demo -->
  <text x="550" y="254" fill="#d0f0d0" font-size="21" font-family="Courier New, monospace" text-anchor="middle">Lesson 2 Demo</text>

  <!-- Row 3: (blank) -->

  <!-- Row 4: Version: 1.0 -->
  <text x="550" y="312" fill="#d0f0d0" font-size="21" font-family="Courier New, monospace" text-anchor="middle">Version: 1.0</text>

  <!-- Row 5: (blank) -->

  <!-- Row 6: By: YOUR NAME -->
  <text x="550" y="370" fill="#d0f0d0" font-size="21" font-family="Courier New, monospace" text-anchor="middle">By: YOUR NAME</text>

  <!-- Subtle scanline effect (optional — a few faint horizontal lines) -->
  <line x1="322" y1="230" x2="778" y2="230" stroke="#111111" stroke-width="1" opacity="0.3"/>
  <line x1="322" y1="268" x2="778" y2="268" stroke="#111111" stroke-width="1" opacity="0.3"/>
  <line x1="322" y1="284" x2="778" y2="284" stroke="#111111" stroke-width="1" opacity="0.3"/>

  <!-- ===== CALLOUT: edit YOUR NAME ===== -->
  <line x1="620" y1="370" x2="840" y2="404" stroke="#e67e22" stroke-width="1.5"/>
  <rect x="840" y="390" width="200" height="32" rx="6" fill="#e67e22"/>
  <text x="940" y="411" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">&#9998; change to your name</text>

  <!-- Footer note -->
  <text x="550" y="516" fill="#6c757d" font-size="13" text-anchor="middle">Press Button A on your Zumo to show this screen &#8212; the OLED uses <tspan font-family="Courier New, monospace" font-size="12">setLayout21x8()</tspan> (21 chars &#215; 8 rows)</text>
  <text x="1060" y="548" fill="#9aa0a6" font-size="11" text-anchor="end">IMAGE 2.6</text>
</svg>
