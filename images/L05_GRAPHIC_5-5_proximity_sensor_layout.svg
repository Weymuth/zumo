<svg viewBox="0 0 940 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="1" y="1" width="938" height="558" rx="10" fill="#ffffff" stroke="#d5dde3" stroke-width="2"/>

  <text x="330" y="30" font-size="15" font-weight="bold" fill="#2a5a42" text-anchor="middle" letter-spacing="2">FRONT OF ROBOT</text>

  <!-- treads (square ends) -->
  <g>
    <rect x="110" y="110" width="55" height="300" fill="#4d5358" stroke="#2c3e50" stroke-width="2"/>
    <rect x="495" y="110" width="55" height="300" fill="#4d5358" stroke="#2c3e50" stroke-width="2"/>
    <g stroke="#6c757d" stroke-width="2">
      <line x1="114" y1="140" x2="161" y2="140"/><line x1="114" y1="175" x2="161" y2="175"/>
      <line x1="114" y1="210" x2="161" y2="210"/><line x1="114" y1="245" x2="161" y2="245"/>
      <line x1="114" y1="280" x2="161" y2="280"/><line x1="114" y1="315" x2="161" y2="315"/>
      <line x1="114" y1="350" x2="161" y2="350"/><line x1="114" y1="385" x2="161" y2="385"/>
      <line x1="499" y1="140" x2="546" y2="140"/><line x1="499" y1="175" x2="546" y2="175"/>
      <line x1="499" y1="210" x2="546" y2="210"/><line x1="499" y1="245" x2="546" y2="245"/>
      <line x1="499" y1="280" x2="546" y2="280"/><line x1="499" y1="315" x2="546" y2="315"/>
      <line x1="499" y1="350" x2="546" y2="350"/><line x1="499" y1="385" x2="546" y2="385"/>
    </g>
  </g>

  <!-- blade (front plate, top view) -->
  <polygon points="210,50 450,50 490,95 170,95" fill="#e8ecef" stroke="#2c3e50" stroke-width="2"/>

  <!-- body -->
  <rect x="170" y="95" width="320" height="330" rx="8" fill="#f6f9fb" stroke="#2c3e50" stroke-width="2.5"/>

  <!-- front sensor array strip -->
  <rect x="180" y="100" width="300" height="26" rx="4" fill="#e3f2ed" stroke="#3a7d5c" stroke-width="1.5"/>

  <!-- ===== emission/facing direction ticks ===== -->
  <g stroke="#b7950b" stroke-width="2">
    <!-- forward emitters -->
    <line x1="222" y1="60" x2="212" y2="42"/><line x1="230" y1="59" x2="230" y2="40"/><line x1="238" y1="60" x2="248" y2="42"/>
    <line x1="422" y1="60" x2="412" y2="42"/><line x1="430" y1="59" x2="430" y2="40"/><line x1="438" y1="60" x2="448" y2="42"/>
    <!-- middle emitters (sideways) -->
    <line x1="168" y1="252" x2="150" y2="244"/><line x1="167" y1="260" x2="147" y2="260"/><line x1="168" y1="268" x2="150" y2="276"/>
    <line x1="492" y1="252" x2="510" y2="244"/><line x1="493" y1="260" x2="513" y2="260"/><line x1="492" y1="268" x2="510" y2="276"/>
  </g>
  <g stroke="#3a7d5c" stroke-width="1.8">
    <!-- detector facing ticks -->
    <line x1="188" y1="107" x2="176" y2="101"/><line x1="187" y1="113" x2="173" y2="113"/><line x1="188" y1="119" x2="176" y2="125"/>
    <line x1="324" y1="104" x2="318" y2="92"/><line x1="330" y1="103" x2="330" y2="90"/><line x1="336" y1="104" x2="342" y2="92"/>
    <line x1="472" y1="107" x2="484" y2="101"/><line x1="473" y1="113" x2="487" y2="113"/><line x1="472" y1="119" x2="484" y2="125"/>
  </g>

  <!-- ===== emitters (filled gold) ===== -->
  <g fill="#b7950b" stroke="#8a6d08" stroke-width="1.5">
    <circle cx="230" cy="71" r="10"/>
    <circle cx="430" cy="71" r="10"/>
    <circle cx="177" cy="260" r="10"/>
    <circle cx="483" cy="260" r="10"/>
  </g>

  <!-- ===== detectors (open) ===== -->
  <g fill="#ffffff" stroke="#2a5a42" stroke-width="2.5">
    <circle cx="197" cy="113" r="9"/>
    <circle cx="330" cy="113" r="9"/>
    <circle cx="463" cy="113" r="9"/>
  </g>
  <!-- detector labels -->
  <g font-size="11.5" font-weight="bold" fill="#2a5a42" text-anchor="middle">
    <text x="197" y="144">LEFT</text>
    <text x="330" y="144">FRONT</text>
    <text x="463" y="144">RIGHT</text>
  </g>
  <!-- middle emitter labels -->
  <g font-size="11" font-style="italic" fill="#8a6d08" text-anchor="middle">
    <text x="205" y="285">middle-left</text>
    <text x="452" y="285">middle-right</text>
    <text x="240" y="93" fill="#8a6d08">front-left</text>
    <text x="420" y="93" fill="#8a6d08">front-right</text>
  </g>

  <!-- ===== annotation column ===== -->
  <g stroke="#c9d4dc" stroke-width="1.2" stroke-dasharray="2 4">
    <line x1="444" y1="66" x2="600" y2="66"/>
    <line x1="476" y1="113" x2="600" y2="113"/>
    <line x1="497" y1="260" x2="600" y2="260"/>
  </g>
  <g font-size="14" fill="#5a6a76">
    <text x="608" y="62"><tspan font-weight="bold" fill="#8a6d08">2 forward emitters</tspan></text>
    <text x="608" y="80" font-style="italic">on the blade — the clear domes</text>
    <text x="608" y="109"><tspan font-weight="bold" fill="#2a5a42">3 detectors</tspan><tspan font-style="italic"> on the sensor array,</tspan></text>
    <text x="608" y="127" font-style="italic">each facing a different direction</text>
    <text x="608" y="256"><tspan font-weight="bold" fill="#8a6d08">2 middle emitters</tspan></text>
    <text x="608" y="274" font-style="italic">between the wheels, shining sideways</text>
  </g>

  <!-- legend -->
  <g font-size="13.5" fill="#4a5a66">
    <circle cx="130" cy="465" r="9" fill="#b7950b" stroke="#8a6d08" stroke-width="1.5"/>
    <text x="148" y="470">IR emitter (×4, on Main Board)</text>
    <circle cx="130" cy="497" r="9" fill="#ffffff" stroke="#2a5a42" stroke-width="2.5"/>
    <text x="148" y="502">IR detector (×3, on front sensor array)</text>
    <text x="130" y="534" font-size="12.5" font-style="italic" fill="#8a959e">Tick marks show which direction each part emits or "looks."</text>
  </g>
</svg>
