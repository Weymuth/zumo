<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">Graphic 10.7 — Extended State Machine</title>
  <desc id="desc">RoboLore state-machine diagram for line following, obstacle avoidance, and intersections.</desc>

  <rect x="0" y="0" width="1100" height="850" fill="#F5F2E9"/>
  <rect x="0" y="0" width="1100" height="72" fill="#0B1A2E"/>
  <text x="34" y="45" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">GRAPHIC 10.7 — Extended State Machine</text>
  <text x="1066" y="45" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#E8EEF4">line following · obstacle avoidance · intersections</text>
  <line x1="0" y1="72" x2="1100" y2="72" stroke="#C9A463" stroke-width="3"/>

  <rect x="42" y="102" width="1016" height="690" rx="16" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
  <text x="70" y="137" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.2" fill="#3D5266">EVENTS MOVE THE ROBOT BETWEEN STATES</text>

  <!-- connectors -->
  <g fill="none" stroke="#3D5266" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M550 203 V250"/>
    <path d="M485 326 V365 H250 V402"/>
    <path d="M615 326 V365 H850 V402"/>
    <path d="M250 468 V523"/>
    <path d="M850 468 V523"/>
    <path d="M250 589 V645"/>
    <path d="M380 678 H550 V336"/>
    <path d="M980 556 H1015 V287 H690"/>
  </g>
  <g fill="#3D5266">
    <polygon points="541,242 550,258 559,242"/>
    <polygon points="241,394 250,410 259,394"/>
    <polygon points="841,394 850,410 859,394"/>
    <polygon points="241,515 250,531 259,515"/>
    <polygon points="841,515 850,531 859,515"/>
    <polygon points="241,637 250,653 259,637"/>
    <polygon points="541,344 550,328 559,344"/>
    <polygon points="700,278 684,287 700,296"/>
  </g>

  <!-- transition labels -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" font-style="italic" fill="#66788A">
    <text x="568" y="231">Button pressed</text>
    <text x="365" y="355" text-anchor="middle">Obstacle detected</text>
    <text x="735" y="355" text-anchor="middle">Green detected</text>
    <text x="568" y="500">Line found</text>
    <text x="1036" y="430" transform="rotate(90 1036 430)">Turn complete</text>
  </g>

  <!-- state boxes -->
  <g font-family="Courier New, monospace" font-size="19" font-weight="700" text-anchor="middle">
    <rect x="410" y="153" width="280" height="50" rx="12" fill="#F3F3F3" stroke="#007ACC" stroke-width="2.5"/>
    <text x="550" y="185" fill="#0B1A2E">STOPPED</text>

    <rect x="405" y="258" width="290" height="68" rx="14" fill="#EDF4FA" stroke="#0B1A2E" stroke-width="3"/>
    <text x="550" y="299" fill="#0B1A2E">FOLLOWING_LINE</text>

    <rect x="105" y="410" width="290" height="58" rx="12" fill="#FFFFFF" stroke="#007ACC" stroke-width="2.5"/>
    <text x="250" y="446" fill="#0B1A2E">OBSTACLE_DETECTED</text>

    <rect x="705" y="410" width="290" height="58" rx="12" fill="#FFFFFF" stroke="#CCA700" stroke-width="2.5"/>
    <text x="850" y="446" fill="#0B1A2E">AT_INTERSECTION</text>

    <rect x="105" y="531" width="290" height="58" rx="12" fill="#FFFFFF" stroke="#CE9178" stroke-width="2.5"/>
    <text x="250" y="567" fill="#0B1A2E">AVOIDING_OBSTACLE</text>

    <rect x="705" y="531" width="290" height="58" rx="12" fill="#FFFFFF" stroke="#4EC9B0" stroke-width="2.5"/>
    <text x="850" y="567" fill="#0B1A2E">EXECUTING_TURN</text>

    <rect x="105" y="653" width="290" height="58" rx="12" fill="#FFFFFF" stroke="#6A9955" stroke-width="2.5"/>
    <text x="250" y="689" fill="#0B1A2E">RETURNING_TO_LINE</text>
  </g>

  <rect x="70" y="748" width="960" height="25" rx="12.5" fill="#F3F3F3"/>
  <text x="550" y="766" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#3D5266">The center state is the normal behavior; temporary states branch away and return.</text>

</svg>