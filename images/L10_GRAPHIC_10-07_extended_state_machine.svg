<svg viewBox="0 0 880 590" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="1" y="1" width="878" height="588" rx="10" fill="#ffffff" stroke="#d5dde3" stroke-width="2"/>

  <!-- ===== connectors: elbow lines, single-polygon heads ===== -->
  <g stroke="#7a8894" stroke-width="2" fill="none">
    <path d="M 440 78 V 130"/>
    <path d="M 390 188 V 230 H 195 V 260"/>
    <path d="M 490 188 V 230 H 685 V 260"/>
    <path d="M 195 318 V 380"/>
    <path d="M 685 318 V 380"/>
    <path d="M 195 438 V 495"/>
    <path d="M 300 529 H 440 V 198"/>
    <path d="M 790 414 H 832 V 164 H 555"/>
  </g>
  <g fill="#7a8894">
    <polygon points="433,130 440,142 447,130"/>
    <polygon points="188,260 195,272 202,260"/>
    <polygon points="678,260 685,272 692,260"/>
    <polygon points="188,380 195,392 202,380"/>
    <polygon points="678,380 685,392 692,380"/>
    <polygon points="188,495 195,507 202,495"/>
    <polygon points="433,198 440,186 447,198"/>
    <polygon points="555,157 543,164 555,171"/>
  </g>
  <!-- transition labels -->
  <g font-size="13" font-style="italic" fill="#5a6a76">
    <text x="452" y="110">Button pressed</text>
    <text x="292" y="222" text-anchor="middle">Obstacle detected</text>
    <text x="588" y="222" text-anchor="middle">Green detected</text>
    <text x="452" y="360">Line found</text>
    <text x="838" y="290" transform="rotate(90 838 290)">Turn complete</text>
  </g>

  <!-- ===== state boxes ===== -->
  <g font-family="'Courier New', Courier, monospace" font-size="15" font-weight="bold" text-anchor="middle">
    <rect x="335" y="30" width="210" height="48" rx="10" fill="#eaf3fb" stroke="#3498db" stroke-width="2"/>
    <text x="440" y="60" fill="#1a5276" textLength="70">STOPPED</text>

    <rect x="335" y="140" width="210" height="48" rx="10" fill="#d6eaf8" stroke="#1a5276" stroke-width="2.5"/>
    <text x="440" y="170" fill="#1a5276" textLength="140">FOLLOWING_LINE</text>

    <rect x="90" y="272" width="210" height="46" rx="10" fill="#eaf3fb" stroke="#3498db" stroke-width="2"/>
    <text x="195" y="301" fill="#1a5276" textLength="170">OBSTACLE_DETECTED</text>

    <rect x="580" y="272" width="210" height="46" rx="10" fill="#eaf3fb" stroke="#3498db" stroke-width="2"/>
    <text x="685" y="301" fill="#1a5276" textLength="150">AT_INTERSECTION</text>

    <rect x="90" y="392" width="210" height="46" rx="10" fill="#eaf3fb" stroke="#3498db" stroke-width="2"/>
    <text x="195" y="421" fill="#1a5276" textLength="170">AVOIDING_OBSTACLE</text>

    <rect x="580" y="392" width="210" height="46" rx="10" fill="#eaf3fb" stroke="#3498db" stroke-width="2"/>
    <text x="685" y="421" fill="#1a5276" textLength="140">EXECUTING_TURN</text>

    <rect x="90" y="507" width="210" height="46" rx="10" fill="#eaf3fb" stroke="#3498db" stroke-width="2"/>
    <text x="195" y="536" fill="#1a5276" textLength="170">RETURNING_TO_LINE</text>
  </g>
