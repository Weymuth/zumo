<text x="550" y="38" fill="#fff" font-size="27" font-weight="bold" text-anchor="middle">GRAPHIC 6.12 &#8212; The Measured Course</text>
<text x="550" y="59" fill="#d6eaf8" font-size="15" text-anchor="middle">Set this up before Step 8: driveDistance(30) must land within &#177;2 cm</text><rect x="90" y="300" width="920" height="230" fill="#f7faf8" stroke="#d7e3dc" stroke-width="2" rx="4"/><line x1="110" y1="470" x2="990" y2="470" stroke="#cbd8d2" stroke-width="2"/><rect x="184" y="418" width="12" height="104" fill="#1a5276" opacity="0.20"/><line x1="190" y1="418" x2="190" y2="522" stroke="#1a5276" stroke-width="4"/><rect x="156" y="528" width="68" height="26" rx="4" fill="#1a5276"/><text x="190" y="546" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">0 cm</text><rect x="824" y="418" width="12" height="104" fill="#9a4459" opacity="0.20"/><line x1="830" y1="418" x2="830" y2="522" stroke="#9a4459" stroke-width="4"/><rect x="796" y="528" width="68" height="26" rx="4" fill="#9a4459"/><text x="830" y="546" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">30 cm</text><text x="190" y="406" font-size="14" font-weight="bold" fill="#1a5276" text-anchor="middle">START TAPE</text><text x="830" y="406" font-size="14" font-weight="bold" fill="#9a4459" text-anchor="middle">TARGET TAPE</text><rect x="787" y="418" width="85" height="104" fill="#3a7d5c" opacity="0.16"/><text x="830" y="574" font-size="14" fill="#3a7d5c" text-anchor="middle" font-weight="bold">landing zone &#177;2 cm</text><rect x="186" y="436" width="74" height="68" rx="6" fill="#3d4450"/><rect x="186" y="436" width="74" height="12" rx="3" fill="#2b313a"/><rect x="186" y="492" width="74" height="12" rx="3" fill="#2b313a"/><rect x="206" y="454" width="34" height="22" rx="2" fill="#7fd4c1"/><text x="223" y="469" font-size="9" fill="#0d2b26" text-anchor="middle" font-weight="bold">30.0</text><polygon points="260,462 276,470 260,478" fill="#3a7d5c"/><text x="223" y="526" font-size="13" fill="#555" text-anchor="middle">front edge on the line</text><polygon points="286,376 790,376 790,367 816,380 790,393 790,384 286,384" fill="#3a7d5c"/><text x="551" y="364" font-size="19" font-weight="bold" fill="#2a5a42" text-anchor="middle">driveDistance(30);</text><rect x="190" y="590" width="640" height="34" rx="3" fill="#f3e9c9" stroke="#cbb98a" stroke-width="1.5"/><line x1="190" y1="590" x2="190" y2="605" stroke="#8a7c52" stroke-width="1.6"/><text x="190" y="620" font-size="11" fill="#6b5f3d" text-anchor="middle">0</text><line x1="211" y1="590" x2="211" y2="598" stroke="#8a7c52" stroke-width="0.9"/><line x1="233" y1="590" x2="233" y2="598" stroke="#8a7c52" stroke-width="0.9"/><line x1="254" y1="590" x2="254" y2="598" stroke="#8a7c52" stroke-width="0.9"/><line x1="275" y1="590" x2="275" y2="598" stroke="#8a7c52" stroke-width="0.9"/><line x1="297" y1="590" x2="297" y2="605" stroke="#8a7c52" stroke-width="1.6"/><text x="297" y="620" font-size="11" fill="#6b5f3d" text-anchor="middle">5</text><line x1="318" y1="590" x2="318" y2="598" stroke="#8a7c52" stroke-width="0.9"/><line x1="339" y1="590" x2="339" y2="598" stroke="#8a7c52" stroke-width="0.9"/><line x1="361" y1="590" x2="361" y2="598" stroke="#8a7c52" stroke-width="0.9"/><line x1="382" y1="590" x2="382" y2="598" stroke="#8a7c52" stroke-width="0.9"/><line x1="403" y1="590" x2="403" y2="605" stroke="#8a7c52" stroke-width="1.6"/><text x="403" y="620" font-size="11" fill="#6b5f3d" text-anchor="middle">10</text><line x1="425" y1="590" x2="425" y2="598" stroke="#8a7c52" stroke-width="0.9"/><line x1="446" y1="590" x2="446" y2="598" stroke="#8a7c52" stroke-width="0.9"/><line x1="467" y1="590" x2="467" y2="598" stroke="#8a7c52" stroke-width="0.9"/><line x1="489" y1="590" x2="489" y2="598" stroke="#8a7c52" stroke-width="0.9"/><line x1="510" y1="590" x2="510" y2="605" stroke="#8a7c52" stroke-width="1.6"/><text x="510" y="620" font-size="11" fill="#6b5f3d" text-anchor="middle">15</text><line x1="531" y1="590" x2="531" y2="598" stroke="#8a7c52" stroke-width="0.9"/><line x1="553" y1="590" x2="553" y2="598" stroke="#8a7c52" stroke-width="0.9"/><line x1="574" y1="590" x2="574" y2="598" stroke="#8a7c52" stroke-width="0.9"/><line x1="595" y1="590" x2="595" y2="598" stroke="#8a7c52" stroke-width="0.9"/><line x1="617" y1="590" x2="617" y2="605" stroke="#8a7c52" stroke-width="1.6"/><text x="617" y="620" font-size="11" fill="#6b5f3d" text-anchor="middle">20</text><line x1="638" y1="590" x2="638" y2="598" stroke="#8a7c52" stroke-width="0.9"/><line x1="659" y1="590" x2="659" y2="598" stroke="#8a7c52" stroke-width="0.9"/><line x1="681" y1="590" x2="681" y2="598" stroke="#8a7c52" stroke-width="0.9"/><line x1="702" y1="590" x2="702" y2="598" stroke="#8a7c52" stroke-width="0.9"/><line x1="723" y1="590" x2="723" y2="605" stroke="#8a7c52" stroke-width="1.6"/><text x="723" y="620" font-size="11" fill="#6b5f3d" text-anchor="middle">25</text><line x1="745" y1="590" x2="745" y2="598" stroke="#8a7c52" stroke-width="0.9"/><line x1="766" y1="590" x2="766" y2="598" stroke="#8a7c52" stroke-width="0.9"/><line x1="787" y1="590" x2="787" y2="598" stroke="#8a7c52" stroke-width="0.9"/><line x1="809" y1="590" x2="809" y2="598" stroke="#8a7c52" stroke-width="0.9"/><line x1="830" y1="590" x2="830" y2="605" stroke="#8a7c52" stroke-width="1.6"/><text x="830" y="620" font-size="11" fill="#6b5f3d" text-anchor="middle">30</text><text x="852" y="612" font-size="14" fill="#6b5f3d">ruler / tape measure</text><line x1="860" y1="470" x2="975" y2="470" stroke="#bbb" stroke-width="2" stroke-dasharray="6 5"/><text x="918" y="456" font-size="13" fill="#777" text-anchor="middle">keep running room</text><text x="918" y="492" font-size="13" fill="#777" text-anchor="middle">past the tape</text><rect x="90" y="600" width="920" height="185" rx="6" fill="#e8f3ec" stroke="#3a7d5c" stroke-width="2"/>
<text x="115" y="630" font-size="17" font-weight="bold" fill="#2a5a42">Setting it up</text>
<text x="115" y="660" font-size="15" fill="#333">1. Lay a strip of tape on the floor. That is your <tspan font-weight="bold">0 cm</tspan> line.</text>
<text x="115" y="686" font-size="15" fill="#333">2. Measure 30 cm along the floor and lay a second strip. Leave open floor beyond it &#8212; about a metre in total.</text>
<text x="115" y="712" font-size="15" fill="#333">3. Set the robot with its <tspan font-weight="bold">front edge on the 0 cm tape</tspan>. Measure from the same edge every run, or your numbers will drift.</text>
<text x="115" y="738" font-size="15" fill="#333">4. Press <tspan font-weight="bold">A</tspan> at the gate, then <tspan font-weight="bold">A</tspan> again to run. After 3-2-1 the robot should stop with its front edge inside the shaded band.</text>
<text x="115" y="766" font-size="15" fill="#9a4459" font-weight="bold">Off by a lot? Your COUNTS_PER_CM is wrong &#8212; not your robot. Section 8 has the table.</text></svg>