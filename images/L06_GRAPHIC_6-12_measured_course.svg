<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">The Measured Course</title>
  <desc id="desc">A RoboLore instructional diagram showing a 30-centimetre measured course for testing driveDistance(30), including start tape, target tape, a plus or minus two centimetre landing zone, running room, a ruler, and setup steps.</desc>
  <defs>
    <marker id="arrowGreen" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 14,7 0,14" fill="#6A9955"/></marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 10,5 0,10" fill="#007ACC"/></marker>
  </defs>
  <rect x="0" y="0" width="1100" height="850" fill="#F5F2E9"/>

  <!-- Title -->
  <text x="60" y="46" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4" fill="#3D5266">GRAPHIC 6.12</text>
  <text x="60" y="91" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" fill="#0B1A2E">The Measured Course</text>
  <text x="60" y="121" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#3D5266">Set this up before Step 8. The robot must land within ±2 cm of the 30 cm target.</text>
  <line x1="60" y1="142" x2="1040" y2="142" stroke="#C9A463" stroke-width="3"/>
  <circle cx="550" cy="142" r="7" fill="#C9A463"/>

  <!-- Course card -->
  <rect x="60" y="170" width="980" height="370" rx="16" fill="#F3F3F3" stroke="#D4D4D4" stroke-width="2"/>
  <text x="88" y="200" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4" fill="#3D5266">COURSE LAYOUT</text>

  <rect x="382" y="187" width="336" height="54" rx="9" fill="#1E1E1E" stroke="#3C3C3C" stroke-width="2"/>
  <text x="430" y="222" font-family="Courier New, monospace" font-size="21" fill="#D4D4D4">
    <tspan fill="#DCDCAA">driveDistance</tspan><tspan fill="#D4D4D4">(</tspan><tspan fill="#CE9178">30</tspan><tspan fill="#D4D4D4">);</tspan>
  </text>

  <line x1="264" y1="285" x2="750" y2="285" stroke="#6A9955" stroke-width="9" stroke-linecap="round" marker-end="url(#arrowGreen)"/>
  <text x="510" y="267" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0B1A2E">travel 30 cm</text>

  <line x1="100" y1="403" x2="990" y2="403" stroke="#AAB5BF" stroke-width="2"/>
  <line x1="799" y1="403" x2="970" y2="403" stroke="#8C9BAA" stroke-width="2" stroke-dasharray="8 7"/>

  <!-- Start tape and robot -->
  <rect x="227" y="325" width="7" height="118" fill="#007ACC"/>
  <rect x="219" y="325" width="5" height="118" fill="#BFE2FA"/>
  <text x="230" y="312" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0B1A2E">START TAPE</text>

  <rect x="134" y="340" width="96" height="65" rx="9" fill="#222A33"/>
  <rect x="143" y="347" width="77" height="6" rx="3" fill="#536171"/>
  <rect x="159" y="360" width="44" height="26" rx="4" fill="#1E1E1E" stroke="#3C3C3C"/>
  <text x="181" y="378" text-anchor="middle" font-family="Courier New, monospace" font-size="12" fill="#4EC9B0">30.0</text>
  <line x1="230" y1="372" x2="247" y2="372" stroke="#6A9955" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <text x="102" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#546576">front edge on the 0 cm line</text>
  <rect x="193" y="449" width="76" height="29" rx="7" fill="#007ACC"/>
  <text x="231" y="469" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">0 cm</text>

  <!-- Target / landing zone -->
  <rect x="720" y="324" width="78" height="118" rx="6" fill="#E6EEE8" stroke="#D7E3DA" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="752" y="324" width="16" height="118" fill="#F0D6C9"/>
  <line x1="760" y1="324" x2="760" y2="442" stroke="#CE9178" stroke-width="4"/>
  <text x="760" y="312" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0B1A2E">TARGET TAPE</text>
  <rect x="722" y="449" width="76" height="29" rx="7" fill="#CE9178"/>
  <text x="760" y="469" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">30 cm</text>
  <text x="760" y="493" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0B1A2E">landing zone ±2 cm</text>
  <text x="827" y="381" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#546576">keep running room</text>
  <text x="827" y="423" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#546576">past the target tape</text>

  <!-- Ruler -->
  <rect x="230" y="510" width="530" height="17" rx="3" fill="#FFF7DE" stroke="#BAA067" stroke-width="1.5"/>
  <g stroke="#A78D53" stroke-width="1">
    <line x1="230" y1="510" x2="230" y2="527"/><line x1="248" y1="510" x2="248" y2="520"/><line x1="266" y1="510" x2="266" y2="520"/><line x1="284" y1="510" x2="284" y2="520"/><line x1="302" y1="510" x2="302" y2="520"/>
    <line x1="320" y1="510" x2="320" y2="527"/><line x1="338" y1="510" x2="338" y2="520"/><line x1="356" y1="510" x2="356" y2="520"/><line x1="374" y1="510" x2="374" y2="520"/><line x1="392" y1="510" x2="392" y2="520"/>
    <line x1="410" y1="510" x2="410" y2="527"/><line x1="428" y1="510" x2="428" y2="520"/><line x1="446" y1="510" x2="446" y2="520"/><line x1="464" y1="510" x2="464" y2="520"/><line x1="482" y1="510" x2="482" y2="520"/>
    <line x1="500" y1="510" x2="500" y2="527"/><line x1="518" y1="510" x2="518" y2="520"/><line x1="536" y1="510" x2="536" y2="520"/><line x1="554" y1="510" x2="554" y2="520"/><line x1="572" y1="510" x2="572" y2="520"/>
    <line x1="590" y1="510" x2="590" y2="527"/><line x1="608" y1="510" x2="608" y2="520"/><line x1="626" y1="510" x2="626" y2="520"/><line x1="644" y1="510" x2="644" y2="520"/><line x1="662" y1="510" x2="662" y2="520"/>
    <line x1="680" y1="510" x2="680" y2="527"/><line x1="698" y1="510" x2="698" y2="520"/><line x1="716" y1="510" x2="716" y2="520"/><line x1="734" y1="510" x2="734" y2="520"/><line x1="752" y1="510" x2="752" y2="520"/><line x1="760" y1="510" x2="760" y2="527"/>
  </g>
  <text x="230" y="543" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#596A7B">0</text>
  <text x="320" y="543" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#596A7B">5</text>
  <text x="410" y="543" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#596A7B">10</text>
  <text x="500" y="543" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#596A7B">15</text>
  <text x="590" y="543" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#596A7B">20</text>
  <text x="680" y="543" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#596A7B">25</text>
  <text x="760" y="543" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#596A7B">30</text>
  <text x="784" y="527" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#596A7B">ruler / tape measure</text>

  <!-- Setup card -->
  <rect x="60" y="562" width="980" height="228" rx="16" fill="#F3F3F3" stroke="#D4D4D4" stroke-width="2"/>
  <text x="88" y="593" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4" fill="#3D5266">SETTING IT UP</text>
  <line x1="550" y1="613" x2="550" y2="735" stroke="#D0D6DC" stroke-width="2"/>

  <circle cx="101" cy="635" r="16" fill="#007ACC"/><text x="101" y="641" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">1</text>
  <text x="128" y="630" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E1E1E">Lay a strip of tape on the floor.</text>
  <text x="128" y="650" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E1E1E">That is your <tspan font-weight="700">0 cm</tspan> line.</text>

  <circle cx="101" cy="697" r="16" fill="#007ACC"/><text x="101" y="703" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">2</text>
  <text x="128" y="692" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E1E1E">Measure 30 cm along the floor and lay a second strip.</text>
  <text x="128" y="712" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E1E1E">Leave open floor beyond it—about a metre in total.</text>

  <circle cx="583" cy="635" r="16" fill="#007ACC"/><text x="583" y="641" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">3</text>
  <text x="610" y="622" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E1E1E">Set the robot with its <tspan font-weight="700">front edge on the 0 cm tape.</tspan></text>
  <text x="610" y="642" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E1E1E">Measure from the same edge every run, or your</text>
  <text x="610" y="662" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E1E1E">numbers will drift.</text>

  <circle cx="583" cy="708" r="16" fill="#007ACC"/><text x="583" y="714" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">4</text>
  <text x="610" y="695" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E1E1E">Press A at the gate, then A again to run.</text>
  <text x="610" y="715" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E1E1E">After 3-2-1, the front edge should stop inside the</text>
  <text x="610" y="735" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E1E1E">shaded landing zone.</text>

  <!-- Warning -->
  <rect x="85" y="751" width="930" height="29" rx="7" fill="#FFF8F8" stroke="#F44747" stroke-width="2"/>
  <rect x="85" y="751" width="8" height="29" rx="4" fill="#F44747"/>
  <text x="108" y="770" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#C53A3A">Off by a lot? Your </text>
  <text x="240" y="770" font-family="Courier New, monospace" font-size="13" fill="#C53A3A">COUNTS_PER_CM</text>
  <text x="352" y="770" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#C53A3A"> is wrong—not your robot. Section 8 has the table.</text>

  <text x="550" y="824" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#3D5266">Use the same front edge as your measuring reference on every run.</text>
</svg>