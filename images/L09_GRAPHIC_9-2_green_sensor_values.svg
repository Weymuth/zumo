<svg viewBox="0 0 1100 850" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
<defs>
<linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#1a5276"/><stop offset="1" stop-color="#2e86ab"/>
</linearGradient>
</defs>
<rect x="0" y="0" width="1100" height="850" fill="#fafafa"/>
<rect x="20" y="20" width="1060" height="72" rx="10" fill="url(#band)"/>
<text x="550" y="58" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="bold">Where Green Lives on the Calibrated Scale</text>
<text x="550" y="84" text-anchor="middle" fill="#d6eaf8" font-size="17">readCalibrated(): 0 = white, 1000 = black — green sits between</text>
<rect x="370.0" y="340" width="360.0" height="236" fill="#e3f6e8"/>
<defs><linearGradient id="scale" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#111111"/>
</linearGradient></defs>
<rect x="100" y="430" width="900" height="56" rx="8" fill="url(#scale)" stroke="#888888" stroke-width="2"/>
<line x1="100.0" y1="486" x2="100.0" y2="500" stroke="#555555" stroke-width="2"/>
<text x="100.0" y="524" text-anchor="middle" font-size="17" fill="#555555">0</text>
<line x1="325.0" y1="486" x2="325.0" y2="500" stroke="#555555" stroke-width="2"/>
<text x="325.0" y="524" text-anchor="middle" font-size="17" fill="#555555">250</text>
<line x1="550.0" y1="486" x2="550.0" y2="500" stroke="#555555" stroke-width="2"/>
<text x="550.0" y="524" text-anchor="middle" font-size="17" fill="#555555">500</text>
<line x1="775.0" y1="486" x2="775.0" y2="500" stroke="#555555" stroke-width="2"/>
<text x="775.0" y="524" text-anchor="middle" font-size="17" fill="#555555">750</text>
<line x1="1000.0" y1="486" x2="1000.0" y2="500" stroke="#555555" stroke-width="2"/>
<text x="1000.0" y="524" text-anchor="middle" font-size="17" fill="#555555">1000</text>
<line x1="370.0" y1="340" x2="370.0" y2="576" stroke="#2e9e4f" stroke-width="3" stroke-dasharray="9,7"/>
<text x="370.0" y="330" font-family="Courier New, monospace" font-size="17" fill="#1f7a3a" font-weight="bold" text-anchor="middle" textLength="218" lengthAdjust="spacingAndGlyphs">GREEN_LOW_THRESHOLD</text>
<line x1="730.0" y1="340" x2="730.0" y2="576" stroke="#2e9e4f" stroke-width="3" stroke-dasharray="9,7"/>
<text x="730.0" y="330" font-family="Courier New, monospace" font-size="17" fill="#1f7a3a" font-weight="bold" text-anchor="middle" textLength="218" lengthAdjust="spacingAndGlyphs">GREEN_HIGH_THRESHOLD</text>
<rect x="91.0" y="360" width="90" height="50" rx="8" fill="#ffffff" stroke="#888888" stroke-width="2"/>
<text x="136.0" y="558" text-anchor="middle" font-size="19" font-weight="bold" fill="#666666">WHITE — near 0</text>
<rect x="505.0" y="360" width="90" height="50" rx="8" fill="#2e9e4f" stroke="#888888" stroke-width="2"/>
<text x="550.0" y="558" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f7a3a">GREEN — in between</text>
<rect x="923.5" y="360" width="90" height="50" rx="8" fill="#111111" stroke="#888888" stroke-width="2"/>
<text x="968.5" y="558" text-anchor="middle" font-size="19" font-weight="bold" fill="#111111">BLACK — near 1000</text>
<rect x="100" y="620" width="900" height="150" rx="12" fill="#ffffff" stroke="#1a5276" stroke-width="2.5"/>
<text x="130" y="662" font-size="19" fill="#333333">The green band must clear <tspan font-weight="bold">both</tspan> ends: stay above white noise, stay below black&#8217;s ~1000.</text>
<text x="130" y="696" font-size="19" fill="#333333">Your tape, your lighting, your sensors — survey the real numbers in Section 7.1,</text>
<text x="130" y="730" font-size="19" fill="#333333">then bracket <tspan font-weight="bold" fill="#1f7a3a">your</tspan> green readings with ~100 of margin per side.</text>
<text x="550" y="180" text-anchor="middle" font-size="21" font-weight="bold" fill="#1f7a3a">isGreen(value): GREEN_LOW &#8804; value &#8804; GREEN_HIGH</text>
</svg>
