<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">Where Green Lives on the Calibrated Scale</title>
  <desc id="desc">A calibrated reflectance scale from white at zero to black at one thousand, with the valid green range bracketed by low and high thresholds.</desc>
  <defs>
    <linearGradient id="scale" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#111111"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1100" height="850" fill="#F5F2E9"/>

  <!-- restrained brand layer -->
  <text x="54" y="66" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#0B1A2E">Where Green Lives on the Calibrated Scale</text>
  <text x="54" y="101" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#3D5266">readCalibrated(): 0 = white, 1000 = black — green sits between</text>
  <line x1="54" y1="126" x2="1046" y2="126" stroke="#C9A463" stroke-width="3"/>

  <!-- instructional equation -->
  <rect x="165" y="160" width="770" height="58" rx="10" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
  <text x="550" y="197" text-anchor="middle" font-family="Courier New, monospace" font-size="22" font-weight="700" fill="#3F6F37">isGreen(value): GREEN_LOW ≤ value ≤ GREEN_HIGH</text>

  <!-- main neutral teaching card -->
  <rect x="54" y="250" width="992" height="364" rx="14" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
  <text x="80" y="278" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.2" fill="#3D5266">CALIBRATED REFLECTANCE SCALE</text>

  <!-- green interval band -->
  <rect x="370" y="316" width="360" height="226" rx="6" fill="#E7F1E4"/>
  <line x1="370" y1="318" x2="370" y2="558" stroke="#6A9955" stroke-width="3" stroke-dasharray="9 7"/>
  <line x1="730" y1="318" x2="730" y2="558" stroke="#6A9955" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="370" y="305" text-anchor="middle" font-family="Courier New, monospace" font-size="17" font-weight="700" fill="#3F6F37">GREEN_LOW_THRESHOLD</text>
  <text x="730" y="305" text-anchor="middle" font-family="Courier New, monospace" font-size="17" font-weight="700" fill="#3F6F37">GREEN_HIGH_THRESHOLD</text>

  <!-- reference swatches -->
  <rect x="98" y="344" width="92" height="52" rx="8" fill="#FFFFFF" stroke="#8A939C" stroke-width="2"/>
  <rect x="504" y="344" width="92" height="52" rx="8" fill="#6A9955" stroke="#55606A" stroke-width="2"/>
  <rect x="910" y="344" width="92" height="52" rx="8" fill="#111111" stroke="#55606A" stroke-width="2"/>

  <!-- scale -->
  <rect x="100" y="424" width="900" height="56" rx="8" fill="url(#scale)" stroke="#7A838C" stroke-width="2"/>
  <line x1="100" y1="480" x2="100" y2="496" stroke="#55606A" stroke-width="2"/>
  <line x1="325" y1="480" x2="325" y2="496" stroke="#55606A" stroke-width="2"/>
  <line x1="550" y1="480" x2="550" y2="496" stroke="#55606A" stroke-width="2"/>
  <line x1="775" y1="480" x2="775" y2="496" stroke="#55606A" stroke-width="2"/>
  <line x1="1000" y1="480" x2="1000" y2="496" stroke="#55606A" stroke-width="2"/>
  <text x="100" y="521" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#3D5266">0</text>
  <text x="325" y="521" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#3D5266">250</text>
  <text x="550" y="521" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#3D5266">500</text>
  <text x="775" y="521" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#3D5266">750</text>
  <text x="1000" y="521" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#3D5266">1000</text>

  <text x="144" y="563" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#3D5266">WHITE — near 0</text>
  <text x="550" y="563" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#3F6F37">GREEN — in between</text>
  <text x="956" y="563" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#111111">BLACK — near 1000</text>

  <!-- explanation card -->
  <rect x="98" y="650" width="904" height="142" rx="12" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
  <rect x="98" y="650" width="8" height="142" rx="4" fill="#007ACC"/>
  <text x="130" y="689" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1E1E1E">The green band must clear <tspan font-weight="700">both</tspan> ends: stay above white noise, stay below black’s ~1000.</text>
  <text x="130" y="726" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1E1E1E">Your tape, your lighting, your sensors — survey the real numbers in Section 7.1,</text>
  <text x="130" y="763" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#1E1E1E">then bracket <tspan font-weight="700" fill="#3F6F37">your</tspan> green readings with ~100 of margin per side.</text>
</svg>