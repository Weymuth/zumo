<svg viewBox="0 0 1000 430" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="1" y="1" width="998" height="428" rx="10" fill="#ffffff" stroke="#d5dde3" stroke-width="2"/>
  <defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#1a5276"/><stop offset="1" stop-color="#2e86ab"/></linearGradient></defs>
  <rect x="1" y="1" width="998" height="56" rx="10" fill="url(#tg)"/>
  <text x="500" y="37" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Speed Values: the SIGN is the direction, the SIZE is the speed</text>

  <!-- number line: rose left half, green right half, single-polygon arrowheads -->
  <rect x="138" y="166" width="362" height="8" rx="4" fill="#c45d76"/>
  <rect x="500" y="166" width="362" height="8" rx="4" fill="#3a7d5c"/>
  <polygon points="138,158 138,182 106,170" fill="#c45d76"/>
  <polygon points="862,158 862,182 894,170" fill="#3a7d5c"/>

  <!-- ticks -->
  <g stroke="#4a5a66" stroke-width="2">
    <line x1="146" y1="156" x2="146" y2="184"/>
    <line x1="323" y1="158" x2="323" y2="182"/>
    <line x1="500" y1="152" x2="500" y2="188"/>
    <line x1="677" y1="158" x2="677" y2="182"/>
    <line x1="854" y1="156" x2="854" y2="184"/>
  </g>
  <g font-family="'Consolas','Courier New',monospace" font-size="17" font-weight="bold" text-anchor="middle">
    <text x="146" y="140" fill="#9a4459">-400</text>
    <text x="323" y="140" fill="#9a4459">-200</text>
    <text x="500" y="136" fill="#4a5a66">0</text>
    <text x="677" y="140" fill="#2a5a42">+200</text>
    <text x="854" y="140" fill="#2a5a42">+400</text>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="146" y="210" fill="#9a4459" font-weight="bold">FULL BACKWARD</text>
    <text x="323" y="210" fill="#9a4459">half backward</text>
    <text x="500" y="210" fill="#4a5a66" font-weight="bold">STOPPED</text>
    <text x="677" y="210" fill="#2a5a42">half forward</text>
    <text x="854" y="210" fill="#2a5a42">FULL FORWARD</text>
  </g>

  <!-- example chips -->
  <g font-family="'Consolas','Courier New',monospace" font-size="14">
    <rect x="70" y="250" width="272" height="62" rx="8" fill="#fdf3f5" stroke="#c45d76" stroke-width="1.6"/>
    <text x="206" y="276" text-anchor="middle" fill="#9a4459" font-weight="bold">setSpeeds(-200, -200)</text>
    <text x="206" y="298" text-anchor="middle" fill="#333333" font-family="Arial" font-size="12.5">backward at 200 — NOT “slower”!</text>

    <rect x="364" y="250" width="272" height="62" rx="8" fill="#f4f6f8" stroke="#6c757d" stroke-width="1.6"/>
    <text x="500" y="276" text-anchor="middle" fill="#4d5358" font-weight="bold">setSpeeds(0, 0)</text>
    <text x="500" y="298" text-anchor="middle" fill="#333333" font-family="Arial" font-size="12.5">full stop — never forget this line</text>

    <rect x="658" y="250" width="272" height="62" rx="8" fill="#eef7f1" stroke="#3a7d5c" stroke-width="1.6"/>
    <text x="794" y="276" text-anchor="middle" fill="#2a5a42" font-weight="bold">setSpeeds(200, 200)</text>
    <text x="794" y="298" text-anchor="middle" fill="#333333" font-family="Arial" font-size="12.5">forward at 200</text>
  </g>

  <rect x="70" y="340" width="860" height="58" rx="8" fill="#f8f9fa" stroke="#dee2e6"/>
  <text x="500" y="364" font-size="14" font-weight="bold" fill="#4a5a66" text-anchor="middle">|value| = speed · sign = direction · past ±400 the library silently clamps — constrain() yourself and print what you send</text>
  <text x="500" y="386" font-size="12.5" fill="#6a7a86" text-anchor="middle">GRAPHIC 3.12 · Zumo 32U4 Robotics · Lesson 3 Quick Reference</text>
</svg>
