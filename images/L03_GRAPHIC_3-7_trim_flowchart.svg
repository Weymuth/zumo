<svg viewBox="0 0 1100 850" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a5276"/>
      <stop offset="1" stop-color="#2e86ab"/>
    </linearGradient>
    <marker id="flowArrow" markerWidth="12" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#4d5358"/>
    </marker>
    <marker id="greenArrow" markerWidth="12" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#3a7d5c"/>
    </marker>
    <marker id="amberArrow" markerWidth="12" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#b7950b"/>
    </marker>
  </defs>

  <!-- Page -->
  <rect x="0" y="0" width="1100" height="850" fill="#ffffff"/>

  <!-- Title band -->
  <rect x="40" y="28" width="1020" height="58" rx="8" fill="url(#titleGrad)"/>
  <text x="60" y="66" fill="#ffffff" font-size="28" font-weight="bold">TRIM ADJUSTMENT</text>
  <text x="1040" y="64" fill="#d6e9f2" font-size="15" text-anchor="end">Zumo 32U4 Robotics &#183; Lesson 3</text>
  <text x="60" y="112" fill="#4d5358" font-size="15">Repeat the loop until your robot drives straight &#8212; <tspan font-weight="bold">adjust, upload, test again</tspan>.</text>

  <!-- START pill -->
  <rect x="350" y="140" width="340" height="50" rx="25" fill="#1e1e1e"/>
  <text x="520" y="172" fill="#4EC9B0" font-size="17" font-weight="bold" text-anchor="middle" font-family="Courier New, monospace">TEST: drive robot forward</text>

  <!-- arrow START -> diamond -->
  <line x1="520" y1="190" x2="520" y2="226" stroke="#4d5358" stroke-width="2.5" marker-end="url(#flowArrow)"/>

  <!-- Decision diamond -->
  <polygon points="520,232 680,310 520,388 360,310" fill="#ffffff" stroke="#2e86ab" stroke-width="3"/>
  <text x="520" y="303" fill="#2e86ab" font-size="17" font-weight="bold" text-anchor="middle">Which way</text>
  <text x="520" y="327" fill="#2e86ab" font-size="17" font-weight="bold" text-anchor="middle">does it curve?</text>

  <!-- LEFT branch -->
  <line x1="360" y1="310" x2="300" y2="310" stroke="#4d5358" stroke-width="2.5" marker-end="url(#flowArrow)"/>
  <text x="330" y="298" fill="#4d5358" font-size="13" font-weight="bold" text-anchor="middle">LEFT</text>
  <rect x="60" y="262" width="240" height="96" rx="8" fill="#E2F0D9" stroke="#3a7d5c" stroke-width="3"/>
  <text x="180" y="294" fill="#2a5a42" font-size="17" font-weight="bold" text-anchor="middle">INCREASE TRIM</text>
  <text x="180" y="318" fill="#2a5a42" font-size="14" text-anchor="middle">+5 at a time</text>
  <text x="180" y="342" fill="#4d5358" font-size="12" font-style="italic" text-anchor="middle">(right motor is weak)</text>

  <!-- RIGHT branch -->
  <line x1="680" y1="310" x2="740" y2="310" stroke="#4d5358" stroke-width="2.5" marker-end="url(#flowArrow)"/>
  <text x="710" y="298" fill="#4d5358" font-size="13" font-weight="bold" text-anchor="middle">RIGHT</text>
  <rect x="740" y="262" width="240" height="96" rx="8" fill="#FFF2CC" stroke="#b7950b" stroke-width="3"/>
  <text x="860" y="294" fill="#7a6408" font-size="17" font-weight="bold" text-anchor="middle">DECREASE TRIM</text>
  <text x="860" y="318" fill="#7a6408" font-size="14" text-anchor="middle">&#8722;5 at a time</text>
  <text x="860" y="342" fill="#4d5358" font-size="12" font-style="italic" text-anchor="middle">(left motor is weak)</text>

  <!-- Return loops: side boxes back up to START -->
  <path d="M 180 262 L 180 165 L 342 165" fill="none" stroke="#3a7d5c" stroke-width="2.5" marker-end="url(#greenArrow)"/>
  <text x="180" y="222" fill="#3a7d5c" font-size="12" font-weight="bold" text-anchor="middle" transform="rotate(-90 180 222)">upload &amp; test again</text>
  <path d="M 860 262 L 860 165 L 698 165" fill="none" stroke="#b7950b" stroke-width="2.5" marker-end="url(#amberArrow)"/>
  <text x="860" y="222" fill="#b7950b" font-size="12" font-weight="bold" text-anchor="middle" transform="rotate(90 860 222)">upload &amp; test again</text>

  <!-- STRAIGHT branch -> DONE -->
  <line x1="520" y1="388" x2="520" y2="434" stroke="#4d5358" stroke-width="2.5" marker-end="url(#flowArrow)"/>
  <text x="576" y="416" fill="#4d5358" font-size="13" font-weight="bold" text-anchor="middle">STRAIGHT</text>
  <rect x="345" y="442" width="350" height="104" rx="8" fill="#3a7d5c"/>
  <text x="520" y="482" fill="#ffffff" font-size="20" font-weight="bold" text-anchor="middle">&#10003; DONE!</text>
  <text x="520" y="510" fill="#e3f2ed" font-size="14" text-anchor="middle">Write your TRIM value on tape</text>
  <text x="520" y="530" fill="#e3f2ed" font-size="14" text-anchor="middle">and stick it on your robot.</text>

  <!-- Cheat-sheet cards -->
  <rect x="60" y="600" width="480" height="130" rx="4" fill="#ffffff" stroke="#dddddd"/>
  <rect x="60" y="600" width="4" height="130" fill="#2e86ab"/>
  <text x="80" y="630" fill="#212121" font-size="15" font-weight="bold">Where TRIM goes in your code</text>
  <rect x="80" y="646" width="440" height="42" rx="6" fill="#1e1e1e"/>
  <text x="100" y="673" fill="#e8e8e8" font-size="15" font-family="Courier New, monospace">motors.setSpeeds(200, 200 <tspan fill="#b5cea8">+ TRIM</tspan>);</text>
  <text x="80" y="714" fill="#4d5358" font-size="13">TRIM is added to the RIGHT motor &#8212; positive boosts it, negative cuts it.</text>

  <rect x="560" y="600" width="480" height="130" rx="4" fill="#ffffff" stroke="#dddddd"/>
  <rect x="560" y="600" width="4" height="130" fill="#f44336"/>
  <text x="580" y="630" fill="#212121" font-size="15" font-weight="bold">Sanity check</text>
  <text x="580" y="658" fill="#4d5358" font-size="14">Typical TRIM values: <tspan font-weight="bold">&#8722;30 to +30</tspan></text>
  <text x="580" y="684" fill="#4d5358" font-size="14">Bigger than <tspan font-weight="bold">&#177;50</tspan>? Something might be wrong with</text>
  <text x="580" y="704" fill="#4d5358" font-size="14">your robot&#8217;s hardware &#8212; ask before cranking further.</text>

  <!-- Footer -->
  <text x="70" y="800" fill="#6c757d" font-size="12">Curves LEFT = positive TRIM &#183; Curves RIGHT = negative TRIM &#183; Straight = done (lucky you!)</text>
  <text x="1060" y="800" fill="#9aa0a6" font-size="11" text-anchor="end">GRAPHIC 3.7</text>
</svg>
