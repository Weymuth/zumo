<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
  <title id="title">Linker error: multiple definition</title>
  <desc id="desc">Instructional figure reproducing the PlatformIO terminal when the same variable is defined in two translation units. Diagnostic text reproduced from GNU ld.</desc>
  <rect x="0" y="0" width="1100" height="470" fill="#FFFFFF"/>
  <rect x="40" y="24" width="1020" height="48" rx="6" fill="#0B1A2E"/>
  <rect x="40" y="72" width="1020" height="3" fill="#C9A463"/>
  <text x="60" y="55" fill="#FFFFFF" font-size="23" font-weight="700">ERROR 2 &#8212; MULTIPLE DEFINITION</text>
  <text x="1040" y="54" fill="#D7E0EA" font-size="13" text-anchor="end">Zumo 32U4 Robotics &#183; Lesson 7</text>
  <rect x="52" y="96" width="996" height="306" rx="10" fill="#1E1E1E" stroke="#0F1720" stroke-width="2"/>
  <rect x="52" y="96" width="996" height="30" fill="#333333"/>
  <circle cx="74" cy="111" r="6" fill="#FF5F57"/>
  <circle cx="94" cy="111" r="6" fill="#FEBC2E"/>
  <circle cx="114" cy="111" r="6" fill="#28C840"/>
  <text x="550" y="116" fill="#CFCFCF" font-size="13" font-weight="400" text-anchor="middle">PROBLEMS &#183; OUTPUT &#183; TERMINAL</text>
  <rect x="52" y="376" width="996" height="26" fill="#007ACC"/>
  <text x="70" y="394" fill="#FFFFFF" font-size="12" font-weight="400" text-anchor="start">PlatformIO &#183; env:zumo32U4</text>
  <text x="72" y="160" fill="#858585" font-family="Courier New, monospace" font-size="14" font-weight="400" xml:space="preserve">> Executing task: pio run</text>
  <text x="72" y="190" fill="#D4D4D4" font-family="Courier New, monospace" font-size="14" font-weight="400" xml:space="preserve">Linking .pio/build/zumo32U4/firmware.elf</text>
  <text x="72" y="224" fill="#D4D4D4" font-family="Courier New, monospace" font-size="14" font-weight="400" xml:space="preserve">ld: RobotMotion.cpp.o:(.data+0x0): </text>
  <text x="72" y="248" fill="#f14c4c" font-family="Courier New, monospace" font-size="14" font-weight="700" xml:space="preserve">multiple definition of </text>
  <text x="292" y="248" fill="#D4D4D4" font-family="Courier New, monospace" font-size="14" font-weight="400" xml:space="preserve">`TRIM'; </text>
  <text x="72" y="272" fill="#D4D4D4" font-family="Courier New, monospace" font-size="14" font-weight="400" xml:space="preserve">main.cpp.o:(.data+0x0): first defined here</text>
  <text x="72" y="306" fill="#f14c4c" font-family="Courier New, monospace" font-size="14" font-weight="400" xml:space="preserve">collect2: error: ld returned 1 exit status</text>
  <text x="72" y="336" fill="#f14c4c" font-family="Courier New, monospace" font-size="14" font-weight="400" xml:space="preserve">*** [.pio/build/zumo32U4/firmware.elf] Error 1</text>
  <rect x="52" y="422" width="996" height="54" rx="8" fill="#FBFBFC" stroke="#D8DDE2" stroke-width="2"/>
  <text x="72" y="455" fill="#2B3A4A" font-size="16" font-weight="400" text-anchor="start">Two files each created their own TRIM. Declare it once with extern in the header and define it once in the .cpp.</text>
</svg>
