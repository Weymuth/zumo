<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1448" height="940" viewBox="0 0 1448 940" role="img" aria-labelledby="title desc">
  <title id="title">PlatformIO Project Folder Structure</title>
  <desc id="desc">A RoboLore instructional graphic showing the PlatformIO folder structure and the roles of ZUMO_Template, Smith_L02, and Smith_L02_C4.</desc>
  <defs>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 44px; font-weight: 800; fill: #0B1A2E; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 23px; font-weight: 500; fill: #3D5266; }
      .section { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 1.3px; fill: #3D5266; }
      .mono-root { font-family: 'Courier New, monospace', 'Courier New', monospace; font-size: 33px; font-weight: 700; fill: #0B1A2E; }
      .mono-item { font-family: 'Courier New, monospace', 'Courier New', monospace; font-size: 29px; font-weight: 700; fill: #0B1A2E; }
      .mono-optional { font-family: 'Courier New, monospace', 'Courier New', monospace; font-size: 29px; font-style: italic; font-weight: 500; fill: #3D5266; }
      .cardTitle { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 1.1px; }
      .cardHead { font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 800; fill: #0B1A2E; }
      .cardBody { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 500; fill: #122B4A; }
      .tag { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 800; letter-spacing: 1.2px; fill: #FFFFFF; }
    </style>
  </defs>

  <rect width="1448" height="940" fill="#FFFFFF"/>

  <!-- Title block -->
  <text x="56" y="72" class="title">PlatformIO Project Folder Structure</text>
  <text x="56" y="110" class="subtitle">Copy the template, rename the copy for the lesson, and optionally create a challenge version.</text>
  <line x1="56" y1="138" x2="1392" y2="138" stroke="#C9A463" stroke-width="3"/>

  <!-- Left panel -->
  <rect x="56" y="176" width="670" height="640" rx="18" fill="#FFFFFF" stroke="#D7DEE6" stroke-width="2"/>
  <text x="86" y="214" class="section">FOLDER TREE</text>

  <!-- Root folder -->
  <g>
    <path d="M88 258 h26 l10 10 h31 a6 6 0 0 1 6 6 v27 a8 8 0 0 1 -8 8 h-64 a8 8 0 0 1 -8 -8 v-45 a8 8 0 0 1 8 -8 z" fill="#59738D" stroke="#0B1A2E" stroke-width="2"/>
    <text x="174" y="298" class="mono-root">Documents/PlatformIO</text>
  </g>

  <!-- Tree lines -->
  <path d="M124 318 V718" fill="none" stroke="#3D5266" stroke-width="4" stroke-linecap="round"/>

  <!-- Template -->
  <path d="M124 400 H157" fill="none" stroke="#3D5266" stroke-width="4" stroke-linecap="round"/>
  <path d="M167 380 h22 l9 9 h23 a6 6 0 0 1 6 6 v24 a8 8 0 0 1 -8 8 h-48 a8 8 0 0 1 -8 -8 v-31 a8 8 0 0 1 8 -8 z" fill="#59738D" stroke="#0B1A2E" stroke-width="2"/>
  <text x="250" y="412" class="mono-item">ZUMO_Template</text>
  <line x1="250" y1="425" x2="479" y2="425" stroke="#CCA700" stroke-width="5"/>

  <!-- L01 -->
  <path d="M124 508 H157" fill="none" stroke="#3D5266" stroke-width="4" stroke-linecap="round"/>
  <path d="M167 488 h22 l9 9 h23 a6 6 0 0 1 6 6 v24 a8 8 0 0 1 -8 8 h-48 a8 8 0 0 1 -8 -8 v-31 a8 8 0 0 1 8 -8 z" fill="#59738D" stroke="#0B1A2E" stroke-width="2"/>
  <text x="250" y="520" class="mono-item">Smith_L01</text>

  <!-- L02 selected -->
  <path d="M124 616 H157" fill="none" stroke="#3D5266" stroke-width="4" stroke-linecap="round"/>
  <rect x="160" y="580" width="525" height="70" rx="12" fill="#EAF5FF"/>
  <path d="M167 596 h22 l9 9 h23 a6 6 0 0 1 6 6 v24 a8 8 0 0 1 -8 8 h-48 a8 8 0 0 1 -8 -8 v-31 a8 8 0 0 1 8 -8 z" fill="#0B4F8A" stroke="#0B1A2E" stroke-width="2"/>
  <text x="250" y="628" class="mono-item">Smith_L02</text>
  <line x1="250" y1="641" x2="420" y2="641" stroke="#007ACC" stroke-width="5"/>

  <!-- Challenge -->
  <path d="M124 724 H157" fill="none" stroke="#3D5266" stroke-width="4" stroke-linecap="round"/>
  <path d="M167 704 h22 l9 9 h23 a6 6 0 0 1 6 6 v24 a8 8 0 0 1 -8 8 h-48 a8 8 0 0 1 -8 -8 v-31 a8 8 0 0 1 8 -8 z" fill="none" stroke="#788797" stroke-width="3" stroke-dasharray="7 7"/>
  <text x="250" y="736" class="mono-optional">Smith_L02_C4</text>
  <line x1="250" y1="752" x2="463" y2="752" stroke="#3D5266" stroke-width="5"/>

  <!-- Right cards -->
  <rect x="758" y="176" width="634" height="194" rx="18" fill="#FFFFFF" stroke="#D7DEE6" stroke-width="2"/>
  <rect x="782" y="198" width="122" height="28" rx="14" fill="#CCA700"/>
  <text x="843" y="217" text-anchor="middle" class="tag">MASTER COPY</text>
  <text x="782" y="261" class="cardHead">ZUMO_Template — never work here</text>
  <text x="782" y="312" class="cardBody">The master copy stays untouched. Copy it,</text>
  <text x="782" y="352" class="cardBody">rename the copy, and work in the copy.</text>

  <rect x="758" y="399" width="634" height="194" rx="18" fill="#FFFFFF" stroke="#D7DEE6" stroke-width="2"/>
  <rect x="782" y="421" width="145" height="28" rx="14" fill="#007ACC"/>
  <text x="854.5" y="440" text-anchor="middle" class="tag">CURRENT LESSON</text>
  <text x="782" y="484" class="cardHead">Smith_L02 — this lesson</text>
  <text x="782" y="535" class="cardBody">One copy per lesson; inside it, your one</text>
  <text x="782" y="575" class="cardBody">file grows step by step.</text>

  <rect x="758" y="622" width="634" height="166" rx="18" fill="#FFFFFF" stroke="#D7DEE6" stroke-width="2"/>
  <rect x="782" y="644" width="94" height="28" rx="14" fill="#788797"/>
  <text x="829" y="663" text-anchor="middle" class="tag">OPTIONAL</text>
  <text x="782" y="707" class="cardHead">Smith_L02_C4 — optional</text>
  <text x="782" y="758" class="cardBody">Challenge copies get the challenge’s name.</text>

  <!-- footer note -->
  <line x1="56" y1="836" x2="1392" y2="836" stroke="#D7DEE6" stroke-width="2"/>
  <text x="56" y="894" class="subtitle"><tspan font-weight="700" fill="#0B1A2E">Tip:</tspan> Use one working copy per lesson so your files stay organized and the template always remains clean.</text>
</svg>
