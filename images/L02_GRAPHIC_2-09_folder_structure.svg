<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1448" height="940" viewBox="0 0 1448 940" role="img" aria-labelledby="title desc">
  <title id="title">PlatformIO project copy workflow</title>
  <desc id="desc">A branded instructional graphic showing the Documents PlatformIO folder tree and explaining how to use ZUMO_Template, Smith_L02, and Smith_L02_C4.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCFBF8"/>
      <stop offset="100%" stop-color="#F5F2E9"/>
    </linearGradient>
    <linearGradient id="folderLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#69809B"/>
      <stop offset="100%" stop-color="#334C66"/>
    </linearGradient>
    <linearGradient id="folderDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#113B6B"/>
      <stop offset="100%" stop-color="#08284C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0B1A2E" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font-family: Inter, Arial, sans-serif; font-size: 42px; font-weight: 800; fill: #0B1A2E; }
      .tree { font-family: Inter, Arial, sans-serif; font-size: 28px; font-weight: 600; fill: #0B1A2E; }
      .tree-em { font-family: Inter, Arial, sans-serif; font-size: 28px; font-weight: 700; fill: #0B1A2E; }
      .tree-note { font-family: Inter, Arial, sans-serif; font-size: 28px; font-weight: 500; font-style: italic; fill: #3D5266; }
      .box-h1 { font-family: Inter, Arial, sans-serif; font-size: 32px; font-weight: 800; fill: #7B6240; }
      .box-h2 { font-family: Inter, Arial, sans-serif; font-size: 32px; font-weight: 800; fill: #0B1A2E; }
      .box-h3 { font-family: Inter, Arial, sans-serif; font-size: 32px; font-weight: 800; fill: #66788A; }
      .box-body { font-family: Inter, Arial, sans-serif; font-size: 26px; font-weight: 500; fill: #0B1A2E; }
      .kicker { font-family: Oxanium, Inter, Arial, sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 1.8px; fill: #C9A463; }
    </style>
  </defs>

  <rect x="8" y="8" width="1432" height="924" rx="26" fill="url(#bg)" stroke="#0B1A2E" stroke-width="4"/>

  <!-- subtle internal structure -->
  <text x="36" y="34" class="kicker">PLATFORMIO PROJECT COPIES</text>

  <!-- left panel -->
  <rect x="35" y="90" width="690" height="760" rx="20" fill="#FFFEFC" stroke="#C9A463" stroke-width="2" filter="url(#shadow)"/>

  <!-- Folder tree -->
  <g>
    <!-- root folder -->
    <path d="M60 210 h24 l10 10 h28 a6 6 0 0 1 6 6 v26 a8 8 0 0 1 -8 8 h-60 a8 8 0 0 1 -8 -8 v-44 a8 8 0 0 1 8 -8 z" fill="url(#folderLight)" stroke="#0B1A2E" stroke-width="2"/>
    <text x="138" y="249" class="title">Documents/PlatformIO</text>

    <!-- trunk -->
    <path d="M94 268 V676" fill="none" stroke="#3D5266" stroke-width="4" stroke-linecap="round"/>

    <!-- child 1 -->
    <path d="M94 348 H126" fill="none" stroke="#3D5266" stroke-width="4" stroke-linecap="round"/>
    <path d="M136 328 h22 l9 9 h23 a6 6 0 0 1 6 6 v24 a8 8 0 0 1 -8 8 h-48 a8 8 0 0 1 -8 -8 v-31 a8 8 0 0 1 8 -8 z" fill="url(#folderLight)" stroke="#0B1A2E" stroke-width="2"/>
    <text x="214" y="360" class="tree">ZUMO_Template</text>
    <line x1="214" y1="372" x2="443" y2="372" stroke="#C9A463" stroke-width="6"/>

    <!-- child 2 -->
    <path d="M94 456 H126" fill="none" stroke="#3D5266" stroke-width="4" stroke-linecap="round"/>
    <path d="M136 436 h22 l9 9 h23 a6 6 0 0 1 6 6 v24 a8 8 0 0 1 -8 8 h-48 a8 8 0 0 1 -8 -8 v-31 a8 8 0 0 1 8 -8 z" fill="url(#folderLight)" stroke="#0B1A2E" stroke-width="2"/>
    <text x="214" y="468" class="tree">Smith_L01</text>

    <!-- child 3 selected -->
    <path d="M94 564 H126" fill="none" stroke="#3D5266" stroke-width="4" stroke-linecap="round"/>
    <rect x="128" y="528" width="577" height="68" rx="12" fill="#EFE8DB"/>
    <path d="M136 544 h22 l9 9 h23 a6 6 0 0 1 6 6 v24 a8 8 0 0 1 -8 8 h-48 a8 8 0 0 1 -8 -8 v-31 a8 8 0 0 1 8 -8 z" fill="url(#folderDark)" stroke="#0B1A2E" stroke-width="2"/>
    <text x="214" y="575" class="tree-em">Smith_L02</text>
    <line x1="214" y1="591" x2="383" y2="591" stroke="#C9A463" stroke-width="6"/>

    <!-- child 4 optional -->
    <path d="M94 672 H126" fill="none" stroke="#3D5266" stroke-width="4" stroke-linecap="round"/>
    <path d="M136 652 h22 l9 9 h23 a6 6 0 0 1 6 6 v24 a8 8 0 0 1 -8 8 h-48 a8 8 0 0 1 -8 -8 v-31 a8 8 0 0 1 8 -8 z" fill="none" stroke="#66788A" stroke-width="3" stroke-dasharray="8 8"/>
    <text x="214" y="684" class="tree-note">Smith_L02_C4</text>
    <line x1="214" y1="702" x2="427" y2="702" stroke="#3D5266" stroke-width="6"/>
  </g>

  <!-- right explainer boxes -->
  <g filter="url(#shadow)">
    <rect x="746" y="185" width="628" height="210" rx="20" fill="#FCFAF5" stroke="#7B6240" stroke-width="4"/>
    <text x="778" y="252" class="box-h1">ZUMO_Template — never work here</text>
    <text x="778" y="309" class="box-body">The master copy stays untouched. Copy it,</text>
    <text x="778" y="357" class="box-body">rename the copy, and work in the copy.</text>

    <rect x="746" y="410" width="628" height="210" rx="20" fill="#FFFEFC" stroke="#0B1A2E" stroke-width="4"/>
    <text x="778" y="477" class="box-h2">Smith_L02 — this lesson</text>
    <text x="778" y="534" class="box-body">One copy per lesson; inside it, your one</text>
    <text x="778" y="582" class="box-body">file grows step by step.</text>

    <rect x="746" y="635" width="628" height="170" rx="20" fill="#FBFAF7" stroke="#66788A" stroke-width="4"/>
    <text x="778" y="700" class="box-h3">Smith_L02_C4 — optional</text>
    <text x="778" y="765" class="box-body">Challenge copies get the challenge’s name.</text>
  </g>
</svg>
