<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
  <title id="title">VS Code tab bar with the project open</title>
  <desc id="desc">Instructional figure reproducing the Visual Studio Code tab bar with several files of the eight-file Zumo project open at once. All text is live SVG text.</desc>
  <rect x="0" y="0" width="1100" height="500" fill="#FFFFFF"/>
  <rect x="40" y="24" width="1020" height="48" rx="6" fill="#0B1A2E"/>
  <rect x="40" y="72" width="1020" height="3" fill="#C9A463"/>
  <text x="60" y="55" fill="#FFFFFF" font-size="23" font-weight="700">THE TAB BAR &#8212; MANY FILES, ONE PROJECT</text>
  <text x="1040" y="54" fill="#D7E0EA" font-size="13" text-anchor="end">Zumo 32U4 Robotics &#183; Lesson 7</text>
  <rect x="52" y="96" width="996" height="300" rx="10" fill="#1E1E1E" stroke="#0F1720" stroke-width="2"/>
  <rect x="52" y="96" width="996" height="30" fill="#333333"/>
  <circle cx="74" cy="111" r="6" fill="#FF5F57"/>
  <circle cx="94" cy="111" r="6" fill="#FEBC2E"/>
  <circle cx="114" cy="111" r="6" fill="#28C840"/>
  <text x="550" y="116" fill="#CFCFCF" font-size="13" font-weight="400" text-anchor="middle">zumo-lesson-07 &#8212; Visual Studio Code</text>
  <rect x="52" y="370" width="996" height="26" fill="#007ACC"/>
  <text x="70" y="388" fill="#FFFFFF" font-size="12" font-weight="400" text-anchor="start">PlatformIO &#183; env:zumo32U4</text>
  <rect x="52" y="126" width="996" height="34" fill="#252526"/>
  <rect x="52" y="126" width="89.2" height="34" fill="#1E1E1E"/>
  <rect x="52" y="126" width="89.2" height="2" fill="#007ACC"/>
  <text x="63" y="148" fill="#FFFFFF" font-family="Courier New, monospace" font-size="13" font-weight="400" xml:space="preserve">main.cpp</text>
  <rect x="141.2" y="126" width="131.2" height="34" fill="#2D2D2D"/>
  <text x="152.2" y="148" fill="#9C9C9C" font-family="Courier New, monospace" font-size="13" font-weight="400" xml:space="preserve">RobotConfig.h</text>
  <rect x="272.4" y="126" width="148.0" height="34" fill="#2D2D2D"/>
  <text x="283.4" y="148" fill="#9C9C9C" font-family="Courier New, monospace" font-size="13" font-weight="400" xml:space="preserve">RobotMotion.cpp</text>
  <rect x="420.4" y="126" width="139.60000000000002" height="34" fill="#2D2D2D"/>
  <text x="431.4" y="148" fill="#9C9C9C" font-family="Courier New, monospace" font-size="13" font-weight="400" xml:space="preserve">RobotSensors.h</text>
  <rect x="560.0" y="126" width="156.4" height="34" fill="#2D2D2D"/>
  <text x="571.0" y="148" fill="#9C9C9C" font-family="Courier New, monospace" font-size="13" font-weight="400" xml:space="preserve">RobotHelpers.cpp</text>
  <text x="72" y="190" fill="#569CD6" font-family="Courier New, monospace" font-size="15" font-weight="400" xml:space="preserve">void setup() {</text>
  <text x="96" y="214" fill="#DCDCAA" font-family="Courier New, monospace" font-size="15" font-weight="400" xml:space="preserve">initSensors();</text>
  <text x="96" y="238" fill="#DCDCAA" font-family="Courier New, monospace" font-size="15" font-weight="400" xml:space="preserve">calibrateSensors();</text>
  <text x="72" y="262" fill="#569CD6" font-family="Courier New, monospace" font-size="15" font-weight="400" xml:space="preserve">}</text>
  <text x="72" y="300" fill="#6A9955" font-family="Courier New, monospace" font-size="15" font-weight="400" xml:space="preserve">// each tab is one FILE, not one program</text>
  <text x="72" y="324" fill="#6A9955" font-family="Courier New, monospace" font-size="15" font-weight="400" xml:space="preserve">// the eight files build into a single upload</text>
  <rect x="52" y="422" width="996" height="54" rx="8" fill="#FBFBFC" stroke="#D8DDE2" stroke-width="2"/>
  <text x="72" y="455" fill="#2B3A4A" font-size="16" font-weight="400" text-anchor="start">Five tabs, one program. The tab strip is the eight-file architecture made visible &#8212; the highlighted tab is the file you are editing.</text>
</svg>
