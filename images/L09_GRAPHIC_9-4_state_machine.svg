<svg viewBox="0 0 1100 850" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
<defs>
<linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#1a5276"/><stop offset="1" stop-color="#2e86ab"/>
</linearGradient>
</defs>
<rect x="0" y="0" width="1100" height="850" fill="#fafafa"/>
<rect x="20" y="20" width="1060" height="72" rx="10" fill="url(#band)"/>
<text x="550" y="58" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="bold">The Four-State Machine</text>
<text x="550" y="84" text-anchor="middle" fill="#d6eaf8" font-size="17">Every state names its exits — trace it on paper</text>
<rect x="120" y="190" width="300" height="120" rx="16" fill="#ffffff" stroke="#6c757d" stroke-width="4"/>
<rect x="120" y="190" width="300" height="46" rx="16" fill="#6c757d"/>
<rect x="120" y="220" width="300" height="16" fill="#6c757d"/>
<text x="270.0" y="221" font-family="Courier New, monospace" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle" textLength="87" lengthAdjust="spacingAndGlyphs">STOPPED</text>
<text x="270.0" y="262" text-anchor="middle" font-size="15.5" fill="#444444">battery guard &#183; A/C tune Kp</text>
<text x="270.0" y="286" text-anchor="middle" font-size="15.5" fill="#444444">waiting for B</text>
<rect x="660" y="190" width="300" height="120" rx="16" fill="#ffffff" stroke="#3a7d5c" stroke-width="4"/>
<rect x="660" y="190" width="300" height="46" rx="16" fill="#3a7d5c"/>
<rect x="660" y="220" width="300" height="16" fill="#3a7d5c"/>
<text x="810.0" y="221" font-family="Courier New, monospace" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle" textLength="174" lengthAdjust="spacingAndGlyphs">FOLLOWING_LINE</text>
<text x="810.0" y="262" text-anchor="middle" font-size="15.5" fill="#444444">followLine() &#183; gap watch</text>
<text x="810.0" y="286" text-anchor="middle" font-size="15.5" fill="#444444">ask the outer sensors</text>
<rect x="660" y="560" width="300" height="120" rx="16" fill="#ffffff" stroke="#3498db" stroke-width="4"/>
<rect x="660" y="560" width="300" height="46" rx="16" fill="#3498db"/>
<rect x="660" y="590" width="300" height="16" fill="#3498db"/>
<text x="810.0" y="591" font-family="Courier New, monospace" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle" textLength="186" lengthAdjust="spacingAndGlyphs">AT_INTERSECTION</text>
<text x="810.0" y="632" text-anchor="middle" font-size="15.5" fill="#444444">showDecision() + beep</text>
<text x="810.0" y="656" text-anchor="middle" font-size="15.5" fill="#444444">600 ms readable pause</text>
<rect x="120" y="560" width="300" height="120" rx="16" fill="#ffffff" stroke="#9b6a9e" stroke-width="4"/>
<rect x="120" y="560" width="300" height="46" rx="16" fill="#9b6a9e"/>
<rect x="120" y="590" width="300" height="16" fill="#9b6a9e"/>
<text x="270.0" y="591" font-family="Courier New, monospace" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle" textLength="174" lengthAdjust="spacingAndGlyphs">EXECUTING_TURN</text>
<text x="270.0" y="632" text-anchor="middle" font-size="15.5" fill="#444444">dispatch pendingTurn</text>
<text x="270.0" y="656" text-anchor="middle" font-size="15.5" fill="#444444">to the turn wrappers</text>
<polygon points="420.0,228.5 643.2,228.5 643.2,238.3 660.0,225.0 643.2,211.7 643.2,221.5 420.0,221.5" fill="#3a7d5c"/>
<text x="540" y="205" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#3a7d5c">B &#8594; 3-2-1 countdown</text>
<polygon points="660.0,278.5 436.8,278.5 436.8,268.7 420.0,282.0 436.8,295.3 436.8,285.5 660.0,285.5" fill="#c45d76"/>
<text x="540" y="322" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#c45d76">B &#8212; the kill switch</text>
<text x="540" y="343" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#c45d76">gap timeout &#8594; LINE LOST</text>
<polygon points="806.5,310.0 806.5,543.2 796.7,543.2 810.0,560.0 823.3,543.2 813.5,543.2 813.5,310.0" fill="#3498db"/>
<text x="826" y="425" text-anchor="start" font-size="15.5" font-weight="bold" fill="#3498db">marker seen</text>
<text x="826" y="446" text-anchor="start" font-size="15.5" font-weight="bold" fill="#3498db">&#8594; stop motors FIRST</text>
<text x="826" y="467" text-anchor="start" font-size="15.5" font-weight="bold" fill="#3498db">&#8594; save pendingTurn</text>
<polygon points="660.0,616.5 436.8,616.5 436.8,606.7 420.0,620.0 436.8,633.3 436.8,623.5 660.0,623.5" fill="#9b6a9e"/>
<text x="540" y="600" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#9b6a9e">after 600 ms</text>
<polygon points="272.0,562.9 648.2,302.4 653.8,310.5 660.0,290.0 638.6,288.6 644.2,296.7 268.0,557.1" fill="#3a7d5c"/>
<text x="400" y="420" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#3a7d5c">turn done</text>
<text x="400" y="441" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#3a7d5c">clear pendingTurn</text>
<text x="550" y="790" text-anchor="middle" font-size="17" fill="#666666" font-style="italic">Stopping happens at the moment of detection &#8212; never deferred to a later state.</text>
</svg>
