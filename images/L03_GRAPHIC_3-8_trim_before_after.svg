<svg viewBox="0 0 1100 850" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a5276"/>
      <stop offset="1" stop-color="#2e86ab"/>
    </linearGradient>
    <marker id="redArrow" markerWidth="12" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#f44336"/>
    </marker>
    <marker id="greenArrow2" markerWidth="12" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#3a7d5c"/>
    </marker>
    <!-- Top-down Zumo, origin at center, facing up -->
    <g id="zumo">
      <polygon points="-30,-45 30,-45 20,-58 -20,-58" fill="#9aa0a6"/>
      <rect x="-38" y="-45" width="14" height="90" rx="6" fill="#2b2b2b"/>
      <rect x="24" y="-45" width="14" height="90" rx="6" fill="#2b2b2b"/>
      <rect x="-26" y="-40" width="52" height="80" rx="4" fill="#4d5358"/>
      <rect x="-12" y="-12" width="24" height="14" rx="2" fill="#1e1e1e"/>
      <circle cx="-10" cy="18" r="3" fill="#d6d6d6"/>
      <circle cx="0" cy="18" r="3" fill="#d6d6d6"/>
      <circle cx="10" cy="18" r="3" fill="#d6d6d6"/>
    </g>
  </defs>

  <!-- Page -->
  <rect x="0" y="0" width="1100" height="850" fill="#ffffff"/>

  <!-- Title band -->
  <rect x="40" y="28" width="1020" height="58" rx="8" fill="url(#titleGrad)"/>
  <text x="60" y="66" fill="#ffffff" font-size="28" font-weight="bold">TRIM: BEFORE &amp; AFTER</text>
  <text x="1040" y="64" fill="#d6e9f2" font-size="15" text-anchor="end">Zumo 32U4 Robotics &#183; Lesson 3</text>
  <text x="60" y="112" fill="#4d5358" font-size="15">Same speed command &#8212; <tspan font-weight="bold">very different results</tspan>. TRIM balances the motors.</text>

  <!-- ============ LEFT PANEL: WITHOUT TRIM ============ -->
  <rect x="60" y="140" width="470" height="520" rx="8" fill="#ffffff" stroke="#f44336" stroke-width="3"/>
  <rect x="60" y="140" width="470" height="46" rx="8" fill="#f44336"/>
  <rect x="60" y="172" width="470" height="14" fill="#f44336"/>
  <text x="295" y="171" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle">WITHOUT TRIM &#8212; curves left</text>

  <!-- intended path -->
  <line x1="295" y1="480" x2="295" y2="205" stroke="#c4c4c4" stroke-width="2" stroke-dasharray="4 6"/>
  <text x="308" y="222" fill="#9aa0a6" font-size="12" font-style="italic">intended path</text>

  <!-- actual curved path -->
  <path d="M 295 480 Q 285 330 175 240" fill="none" stroke="#f44336" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#redArrow)"/>
  <text x="176" y="330" fill="#f44336" font-size="14" font-weight="bold">veers LEFT</text>

  <!-- ghost robot at end of curve -->
  <use href="#zumo" transform="translate(160,215) rotate(-40)" opacity="0.35"/>

  <!-- robot at start -->
  <use href="#zumo" transform="translate(295,545)"/>
  <text x="230" y="550" fill="#4d5358" font-size="13" font-weight="bold" text-anchor="end">L: 200</text>
  <text x="360" y="542" fill="#f44336" font-size="13" font-weight="bold">R: 200</text>
  <text x="360" y="560" fill="#f44336" font-size="12" font-style="italic">(weaker!)</text>

  <!-- start line -->
  <line x1="110" y1="608" x2="480" y2="608" stroke="#212121" stroke-width="6" stroke-dasharray="18 10"/>
  <text x="118" y="630" fill="#6c757d" font-size="12">start line (tape)</text>

  <!-- code chip -->
  <rect x="130" y="618" width="330" height="32" rx="6" fill="#1e1e1e" transform="translate(0,16)"/>
  <text x="150" y="656" fill="#e8e8e8" font-size="14" font-family="Courier New, monospace">motors.setSpeeds(200, 200);</text>

  <!-- ============ RIGHT PANEL: WITH TRIM ============ -->
  <rect x="570" y="140" width="470" height="520" rx="8" fill="#ffffff" stroke="#3a7d5c" stroke-width="3"/>
  <rect x="570" y="140" width="470" height="46" rx="8" fill="#3a7d5c"/>
  <rect x="570" y="172" width="470" height="14" fill="#3a7d5c"/>
  <text x="805" y="171" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle">WITH TRIM (+15) &#8212; drives straight</text>

  <!-- straight path (actual on top of intended) -->
  <line x1="805" y1="480" x2="805" y2="215" stroke="#3a7d5c" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#greenArrow2)"/>
  <text x="820" y="330" fill="#3a7d5c" font-size="14" font-weight="bold">stays on course</text>

  <!-- ghost robot at end -->
  <use href="#zumo" transform="translate(805,190)" opacity="0.35"/>

  <!-- robot at start -->
  <use href="#zumo" transform="translate(805,545)"/>
  <text x="740" y="550" fill="#4d5358" font-size="13" font-weight="bold" text-anchor="end">L: 200</text>
  <text x="870" y="542" fill="#3a7d5c" font-size="13" font-weight="bold">R: 200 + 15</text>
  <text x="870" y="560" fill="#3a7d5c" font-size="12" font-style="italic">= 215 (balanced)</text>

  <!-- start line -->
  <line x1="620" y1="608" x2="990" y2="608" stroke="#212121" stroke-width="6" stroke-dasharray="18 10"/>
  <text x="628" y="630" fill="#6c757d" font-size="12">start line (tape)</text>

  <!-- code chip -->
  <rect x="620" y="634" width="380" height="32" rx="6" fill="#1e1e1e"/>
  <text x="640" y="656" fill="#e8e8e8" font-size="14" font-family="Courier New, monospace">motors.setSpeeds(200, 200 <tspan fill="#b5cea8">+ 15</tspan>);</text>

  <!-- Takeaway card -->
  <rect x="60" y="700" width="980" height="80" rx="4" fill="#ffffff" stroke="#dddddd"/>
  <rect x="60" y="700" width="4" height="80" fill="#2e86ab"/>
  <text x="80" y="732" fill="#212121" font-size="15" font-weight="bold">Key idea</text>
  <text x="80" y="760" fill="#4d5358" font-size="14">Equal commands don&#8217;t mean equal power. By adding a small boost to the weaker motor, TRIM balances them out.</text>

  <!-- Footer -->
  <text x="70" y="818" fill="#6c757d" font-size="12">Curves LEFT = right motor weak = positive TRIM. Your TRIM number will be different from +15 &#8212; find yours!</text>
  <text x="1060" y="818" fill="#9aa0a6" font-size="11" text-anchor="end">GRAPHIC 3.8</text>
</svg>
