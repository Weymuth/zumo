<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" font-family="'Courier New', monospace">
  <!-- code panel -->
  <rect x="10" y="10" width="460" height="120" rx="6" fill="#1e1e1e" stroke="#333"/>

  <!-- code lines -->
  <text x="30" y="48" font-size="16" fill="#e8e8e8" xml:space="preserve"><tspan fill="#569cd6">for</tspan> (<tspan fill="#569cd6">int</tspan> i = <tspan fill="#b5cea8">0</tspan>; i &lt; <tspan fill="#b5cea8">6</tspan>; i++) {</text>
  <text x="68" y="80" font-size="16" fill="#7cbf6e">// Code to repeat goes here</text>
  <text x="30" y="112" font-size="16" fill="#e8e8e8">}</text>

  <!-- arrowheads pointing up at each part of the for line -->
  <polygon points="119,136 125,126 131,136" fill="#3a7d5c"/>
  <polygon points="201,136 207,126 213,136" fill="#3a7d5c"/>
  <polygon points="259,136 265,126 271,136" fill="#3a7d5c"/>

  <!-- connector drops (staggered like the original diagram) -->
  <line x1="265" y1="136" x2="265" y2="172" stroke="#3a7d5c" stroke-width="2"/>
  <line x1="207" y1="136" x2="207" y2="212" stroke="#3a7d5c" stroke-width="2"/>
  <line x1="125" y1="136" x2="125" y2="252" stroke="#3a7d5c" stroke-width="2"/>

  <!-- labels -->
  <text x="277" y="177" font-size="14" font-family="Arial, sans-serif"><tspan fill="#2a5a42" font-weight="bold">UPDATE</tspan><tspan fill="#333"> — Add 1 to i after each loop</tspan></text>
  <text x="219" y="217" font-size="14" font-family="Arial, sans-serif"><tspan fill="#2a5a42" font-weight="bold">CONTINUE IF</tspan><tspan fill="#333"> — Keep going while i is less than 6</tspan></text>
  <text x="137" y="257" font-size="14" font-family="Arial, sans-serif"><tspan fill="#2a5a42" font-weight="bold">START</tspan><tspan fill="#333"> — Create variable i, set it to 0</tspan></text>
</svg>
