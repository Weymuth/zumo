<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" font-family="Arial, Helvetica, sans-serif" width="1100" height="850">
  <defs>
    </defs>
  <rect width="1100" height="850" fill="#F5F2E9"/>

  <rect x="0" y="0" width="1100" height="78" fill="#0B1A2E"/>
  <text x="550" y="38" fill="#FFFFFF" font-size="27" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">THE THREE TENSES</text>
  <text x="550" y="63" fill="#E8EEF4" font-size="16" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">One error signal. Three completely different questions.</text>

  <!-- the error curve, shared -->
  <text x="60" y="120" fill="#3D5266" font-size="17" font-weight="bold" font-family="Arial, Helvetica, sans-serif">THE ERROR, over time</text>
  <line x1="80" y1="270" x2="1030" y2="270" stroke="#C8D1DA" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="1040" y="275" fill="#9AA7B2" font-size="13" font-family="Arial, Helvetica, sans-serif">0</text>
  <path d="M 80 160 Q 230 150 330 205 T 560 262 T 800 268 L 1020 269" fill="none" stroke="#B42318" stroke-width="4"/>
  <text x="90" y="150" fill="#B42318" font-size="14" font-weight="bold" font-family="Arial, Helvetica, sans-serif">error</text>

  <!-- NOW marker -->
  <line x1="560" y1="130" x2="560" y2="300" stroke="#0B1A2E" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="560" cy="262" r="8" fill="#0B1A2E"/>
  <text x="560" y="320" fill="#0B1A2E" font-size="15" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">NOW</text>

  <!-- P panel -->
  <rect x="60" y="365" width="310" height="420" rx="10" fill="#eaf3f8" stroke="#3D5266" stroke-width="3"/>
  <rect x="60" y="365" width="310" height="52" rx="10" fill="#3D5266"/>
  <rect x="60" y="405" width="310" height="12" fill="#3D5266"/>
  <text x="215" y="399" fill="#FFFFFF" font-size="21" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">P — THE PRESENT</text>

  <line x1="105" y1="500" x2="325" y2="500" stroke="#C8D1DA" stroke-width="2"/>
  <circle cx="240" cy="470" r="7" fill="#0B1A2E"/>
  <polygon points="240,470 232,500 248,500" fill="#3D5266"/>
  <line x1="240" y1="470" x2="240" y2="500" stroke="#3D5266" stroke-width="5"/>
  <text x="215" y="535" fill="#0B1A2E" font-size="15" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">reads the VALUE</text>

  <text x="215" y="580" fill="#0B1A2E" font-size="18" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">“How far off am I?”</text>
  <rect x="90" y="600" width="250" height="40" rx="5" fill="#FFFFFF" stroke="#C8D1DA"/>
  <text x="215" y="626" fill="#0B1A2E" font-size="15" font-family="Courier New, monospace" text-anchor="middle">Kp * error</text>
  <text x="215" y="672" fill="#2F7D55" font-size="14" text-anchor="middle" font-weight="bold" font-family="Arial, Helvetica, sans-serif">FIXES: big errors, fast</text>
  <text x="215" y="700" fill="#B42318" font-size="14" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">TOO MUCH: oscillation</text>
  <text x="215" y="752" fill="#66788A" font-size="14" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Knows where you ARE.</text>
  <text x="215" y="772" fill="#66788A" font-size="14" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Nothing else.</text>

  <!-- D panel -->
  <rect x="395" y="365" width="310" height="420" rx="10" fill="#EDF4EE" stroke="#2F7D55" stroke-width="3"/>
  <rect x="395" y="365" width="310" height="52" rx="10" fill="#2F7D55"/>
  <rect x="395" y="405" width="310" height="12" fill="#2F7D55"/>
  <text x="550" y="399" fill="#FFFFFF" font-size="21" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">D — THE FUTURE</text>

  <line x1="440" y1="500" x2="660" y2="500" stroke="#C8D1DA" stroke-width="2"/>
  <line x1="470" y1="465" x2="630" y2="520" stroke="#2F7D55" stroke-width="5"/>
  <polygon points="648,526 618,514 626,499" fill="#2F7D55"/>
  <text x="550" y="555" fill="#265F45" font-size="15" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">reads the SLOPE</text>

  <text x="550" y="580" fill="#265F45" font-size="18" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">“How fast am I closing?”</text>
  <rect x="415" y="600" width="270" height="40" rx="5" fill="#FFFFFF" stroke="#C8D1DA"/>
  <text x="550" y="626" fill="#0B1A2E" font-size="14" font-family="Courier New, monospace" text-anchor="middle">Kd * (err - lastErr) / dt</text>
  <text x="550" y="672" fill="#2F7D55" font-size="14" text-anchor="middle" font-weight="bold" font-family="Arial, Helvetica, sans-serif">FIXES: overshoot, weave</text>
  <text x="550" y="700" fill="#B42318" font-size="14" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">TOO MUCH: noise, twitching</text>
  <text x="550" y="752" fill="#66788A" font-size="14" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Brakes BEFORE you arrive.</text>
  <text x="550" y="772" fill="#66788A" font-size="14" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">P cannot do this.</text>

  <!-- I panel -->
  <rect x="730" y="365" width="310" height="420" rx="10" fill="#F5F0E8" stroke="#7B6240" stroke-width="3"/>
  <rect x="730" y="365" width="310" height="52" rx="10" fill="#7B6240"/>
  <rect x="730" y="405" width="310" height="12" fill="#7B6240"/>
  <text x="885" y="399" fill="#FFFFFF" font-size="21" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">I — THE PAST</text>

  <line x1="775" y1="500" x2="995" y2="500" stroke="#C8D1DA" stroke-width="2"/>
  <path d="M 775 500 L 775 480 Q 850 462 920 486 L 995 495 L 995 500 Z" fill="#E7D5B8" stroke="#7B6240" stroke-width="2"/>
  <text x="885" y="545" fill="#7B6240" font-size="15" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">reads the AREA</text>

  <text x="885" y="580" fill="#7B6240" font-size="18" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">“How long have I been off?”</text>
  <rect x="750" y="600" width="270" height="40" rx="5" fill="#FFFFFF" stroke="#C8D1DA"/>
  <text x="885" y="626" fill="#0B1A2E" font-size="14" font-family="Courier New, monospace" text-anchor="middle">Ki * (integral += err*dt)</text>
  <text x="885" y="672" fill="#2F7D55" font-size="14" text-anchor="middle" font-weight="bold" font-family="Arial, Helvetica, sans-serif">FIXES: steady-state error</text>
  <text x="885" y="700" fill="#B42318" font-size="14" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">TOO MUCH: WINDUP</text>
  <text x="885" y="752" fill="#66788A" font-size="14" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Keeps a grudge.</text>
  <text x="885" y="772" fill="#66788A" font-size="14" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Sometimes that is wisdom.</text>

  <!-- pointers from NOW to each panel -->
  <polygon points="560,332 560,352 220,352 220,363 200,346 220,329 220,340 560,340" fill="#9AA7B2"/>
  <polygon points="560,332 560,363 545,363 560,363" fill="none"/>
  <line x1="550" y1="336" x2="550" y2="363" stroke="#9AA7B2" stroke-width="3"/>
  <polygon points="550,363 543,349 557,349" fill="#9AA7B2"/>
  <polygon points="880,346 880,340 570,340 570,332 570,346" fill="none"/>
  <line x1="570" y1="340" x2="880" y2="340" stroke="#9AA7B2" stroke-width="3"/>
  <line x1="880" y1="340" x2="880" y2="363" stroke="#9AA7B2" stroke-width="3"/>
  <polygon points="880,363 873,349 887,349" fill="#9AA7B2"/>
</svg>
