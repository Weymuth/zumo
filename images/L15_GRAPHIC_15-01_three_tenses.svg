<svg viewBox="0 0 1100 850" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a5276"/>
      <stop offset="100%" stop-color="#2e86ab"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="850" fill="#ffffff"/>

  <rect x="0" y="0" width="1100" height="78" fill="url(#band)"/>
  <text x="550" y="38" fill="#ffffff" font-size="27" font-weight="bold" text-anchor="middle">THE THREE TENSES</text>
  <text x="550" y="63" fill="#d6e9f2" font-size="16" text-anchor="middle">One error signal. Three completely different questions.</text>

  <!-- the error curve, shared -->
  <text x="60" y="120" fill="#1a5276" font-size="17" font-weight="bold">THE ERROR, over time</text>
  <line x1="80" y1="270" x2="1030" y2="270" stroke="#b8c7d1" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="1040" y="275" fill="#8fa3b0" font-size="13">0</text>
  <path d="M 80 160 Q 230 150 330 205 T 560 262 T 800 268 L 1020 269"
        fill="none" stroke="#c0392b" stroke-width="4"/>
  <text x="90" y="150" fill="#c0392b" font-size="14" font-weight="bold">error</text>

  <!-- NOW marker -->
  <line x1="560" y1="130" x2="560" y2="300" stroke="#2c3e50" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="560" cy="262" r="8" fill="#2c3e50"/>
  <text x="560" y="320" fill="#2c3e50" font-size="15" font-weight="bold" text-anchor="middle">NOW</text>

  <!-- P panel -->
  <rect x="60" y="365" width="310" height="420" rx="10" fill="#eaf3f8" stroke="#2e86ab" stroke-width="3"/>
  <rect x="60" y="365" width="310" height="52" rx="10" fill="#2e86ab"/>
  <rect x="60" y="405" width="310" height="12" fill="#2e86ab"/>
  <text x="215" y="399" fill="#ffffff" font-size="21" font-weight="bold" text-anchor="middle">P &#8212; THE PRESENT</text>

  <line x1="105" y1="500" x2="325" y2="500" stroke="#b8c7d1" stroke-width="2"/>
  <circle cx="240" cy="470" r="7" fill="#2c3e50"/>
  <polygon points="240,470 232,500 248,500" fill="#2e86ab"/>
  <line x1="240" y1="470" x2="240" y2="500" stroke="#2e86ab" stroke-width="5"/>
  <text x="215" y="535" fill="#1a5276" font-size="15" text-anchor="middle">reads the VALUE</text>

  <text x="215" y="580" fill="#1a5276" font-size="18" font-weight="bold" text-anchor="middle">&#8220;How far off am I?&#8221;</text>
  <rect x="90" y="600" width="250" height="40" rx="5" fill="#ffffff" stroke="#b8c7d1"/>
  <text x="215" y="626" fill="#2c3e50" font-size="15" font-family="Consolas, monospace" text-anchor="middle">Kp * error</text>
  <text x="215" y="672" fill="#3a7d5c" font-size="14" text-anchor="middle" font-weight="bold">FIXES: big errors, fast</text>
  <text x="215" y="700" fill="#c0392b" font-size="14" text-anchor="middle">TOO MUCH: oscillation</text>
  <text x="215" y="752" fill="#607d8b" font-size="14" text-anchor="middle">Knows where you ARE.</text>
  <text x="215" y="772" fill="#607d8b" font-size="14" text-anchor="middle">Nothing else.</text>

  <!-- D panel -->
  <rect x="395" y="365" width="310" height="420" rx="10" fill="#eef7f1" stroke="#3a7d5c" stroke-width="3"/>
  <rect x="395" y="365" width="310" height="52" rx="10" fill="#3a7d5c"/>
  <rect x="395" y="405" width="310" height="12" fill="#3a7d5c"/>
  <text x="550" y="399" fill="#ffffff" font-size="21" font-weight="bold" text-anchor="middle">D &#8212; THE FUTURE</text>

  <line x1="440" y1="500" x2="660" y2="500" stroke="#b8c7d1" stroke-width="2"/>
  <line x1="470" y1="465" x2="630" y2="520" stroke="#3a7d5c" stroke-width="5"/>
  <polygon points="648,526 618,514 626,499" fill="#3a7d5c"/>
  <text x="550" y="555" fill="#2a5a42" font-size="15" text-anchor="middle">reads the SLOPE</text>

  <text x="550" y="580" fill="#2a5a42" font-size="18" font-weight="bold" text-anchor="middle">&#8220;How fast am I closing?&#8221;</text>
  <rect x="415" y="600" width="270" height="40" rx="5" fill="#ffffff" stroke="#b8c7d1"/>
  <text x="550" y="626" fill="#2c3e50" font-size="14" font-family="Consolas, monospace" text-anchor="middle">Kd * (err - lastErr) / dt</text>
  <text x="550" y="672" fill="#3a7d5c" font-size="14" text-anchor="middle" font-weight="bold">FIXES: overshoot, weave</text>
  <text x="550" y="700" fill="#c0392b" font-size="14" text-anchor="middle">TOO MUCH: noise, twitching</text>
  <text x="550" y="752" fill="#607d8b" font-size="14" text-anchor="middle">Brakes BEFORE you arrive.</text>
  <text x="550" y="772" fill="#607d8b" font-size="14" text-anchor="middle">P cannot do this.</text>

  <!-- I panel -->
  <rect x="730" y="365" width="310" height="420" rx="10" fill="#fdf3e7" stroke="#e67e22" stroke-width="3"/>
  <rect x="730" y="365" width="310" height="52" rx="10" fill="#e67e22"/>
  <rect x="730" y="405" width="310" height="12" fill="#e67e22"/>
  <text x="885" y="399" fill="#ffffff" font-size="21" font-weight="bold" text-anchor="middle">I &#8212; THE PAST</text>

  <line x1="775" y1="500" x2="995" y2="500" stroke="#b8c7d1" stroke-width="2"/>
  <path d="M 775 500 L 775 480 Q 850 462 920 486 L 995 495 L 995 500 Z" fill="#f5c99b" stroke="#e67e22" stroke-width="2"/>
  <text x="885" y="545" fill="#a05a12" font-size="15" text-anchor="middle">reads the AREA</text>

  <text x="885" y="580" fill="#a05a12" font-size="18" font-weight="bold" text-anchor="middle">&#8220;How long have I been off?&#8221;</text>
  <rect x="750" y="600" width="270" height="40" rx="5" fill="#ffffff" stroke="#b8c7d1"/>
  <text x="885" y="626" fill="#2c3e50" font-size="14" font-family="Consolas, monospace" text-anchor="middle">Ki * (integral += err*dt)</text>
  <text x="885" y="672" fill="#3a7d5c" font-size="14" text-anchor="middle" font-weight="bold">FIXES: steady-state error</text>
  <text x="885" y="700" fill="#c0392b" font-size="14" text-anchor="middle">TOO MUCH: WINDUP</text>
  <text x="885" y="752" fill="#607d8b" font-size="14" text-anchor="middle">Keeps a grudge.</text>
  <text x="885" y="772" fill="#607d8b" font-size="14" text-anchor="middle">Sometimes that is wisdom.</text>

  <!-- pointers from NOW to each panel -->
  <polygon points="560,332 560,352 220,352 220,363 200,346 220,329 220,340 560,340" fill="#8fa3b0"/>
  <polygon points="560,332 560,363 545,363 560,363" fill="none"/>
  <line x1="550" y1="336" x2="550" y2="363" stroke="#8fa3b0" stroke-width="3"/>
  <polygon points="550,363 543,349 557,349" fill="#8fa3b0"/>
  <polygon points="880,346 880,340 570,340 570,332 570,346" fill="none"/>
  <line x1="570" y1="340" x2="880" y2="340" stroke="#8fa3b0" stroke-width="3"/>
  <line x1="880" y1="340" x2="880" y2="363" stroke="#8fa3b0" stroke-width="3"/>
  <polygon points="880,363 873,349 887,349" fill="#8fa3b0"/>
</svg>
