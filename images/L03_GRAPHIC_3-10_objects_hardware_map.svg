<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Arial, Helvetica, sans-serif">
  <rect x="1" y="1" width="998" height="558" rx="10" fill="#ffffff" stroke="#d5dde3" stroke-width="2"/>
  <rect x="1" y="1" width="998" height="56" rx="10" fill="#0B1A2E"/>
  <defs>
    </defs>
  <text x="500" y="37" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Objects Are Hardware Handles</text>

  <!-- code card -->
  <rect x="40" y="90" width="420" height="300" rx="8" fill="#1e1e1e" stroke="#333333"/>
  <g font-family="'Consolas','Courier New',monospace" font-size="16">
    <text x="60" y="130" fill="#6a9955">// ===== HARDWARE OBJECTS =====</text>
    <text x="60" y="175" fill="#4ec9b6">Zumo32U4Motors<tspan fill="#e8e8e8"> motors;</tspan></text>
    <text x="60" y="230" fill="#4ec9b6">Zumo32U4ButtonA<tspan fill="#e8e8e8"> buttonA;</tspan></text>
    <text x="60" y="285" fill="#4ec9b6">Zumo32U4OLED<tspan fill="#e8e8e8"> display;</tspan></text>
    <text x="60" y="340" fill="#4ec9b6">Zumo32U4Buzzer<tspan fill="#e8e8e8"> buzzer;</tspan></text>
  </g>

  <!-- hardware column -->
  <g>
    <rect x="640" y="140" width="320" height="66" rx="8" fill="#eaf3fa" stroke="#3498db" stroke-width="2"/>
    <text x="660" y="167" font-size="15" font-weight="bold" fill="#1a5276">Left + right gearmotors</text>
    <text x="660" y="190" font-size="12.5" fill="#4a5a66">via the two DRV8838 driver chips (H-bridges)</text>

    <rect x="640" y="222" width="320" height="66" rx="8" fill="#eaf3fa" stroke="#3498db" stroke-width="2"/>
    <text x="660" y="249" font-size="15" font-weight="bold" fill="#1a5276">Pushbutton A</text>
    <text x="660" y="272" font-size="12.5" fill="#4a5a66">front-left button (B and C get their own objects)</text>

    <rect x="640" y="304" width="320" height="66" rx="8" fill="#eaf3fa" stroke="#3498db" stroke-width="2"/>
    <text x="660" y="331" font-size="15" font-weight="bold" fill="#1a5276">128×64 OLED screen</text>
    <text x="660" y="354" font-size="12.5" fill="#4a5a66">the tiny display on top of the robot</text>

    <rect x="640" y="386" width="320" height="66" rx="8" fill="#eaf3fa" stroke="#3498db" stroke-width="2"/>
    <text x="660" y="413" font-size="15" font-weight="bold" fill="#1a5276">Piezo buzzer</text>
    <text x="660" y="436" font-size="12.5" fill="#4a5a66">the beeper on the underside</text>
  </g>

  <!-- dotted leaders (no arrowheads; file-tree family style) -->
  <g stroke="#9b6a9e" stroke-width="2.5" stroke-dasharray="2 6" stroke-linecap="round">
    <line x1="470" y1="170" x2="632" y2="173"/>
    <line x1="470" y1="225" x2="632" y2="255"/>
    <line x1="470" y1="280" x2="632" y2="337"/>
    <line x1="470" y1="335" x2="632" y2="419"/>
  </g>

  <!-- takeaway band -->
  <rect x="40" y="470" width="920" height="60" rx="8" fill="#f0ebf5" stroke="#9b6a9e" stroke-width="1.5"/>
  <text x="500" y="496" font-size="14.5" font-weight="bold" fill="#704c73" text-anchor="middle">One declaration = one dedicated controller for one physical part.</text>
  <text x="500" y="518" font-size="13" fill="#704c73" text-anchor="middle">The prefix says who you’re commanding: motors.setSpeeds() · display.print() · buzzer.playNote() — zero guesswork.</text>
</svg>