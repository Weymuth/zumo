<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="Segoe UI, Arial, sans-serif">
  <!-- Title -->
  <text x="380" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#2a5a42">Anatomy of a for Loop</text>

  <!-- Dark code panel -->
  <rect x="70" y="60" width="620" height="86" rx="8" fill="#1e1e1e"/>
  <g font-size="22" font-family="Consolas, 'Courier New', monospace">
    <text x="130" y="106" textLength="66" fill="#569cd6" font-weight="bold" xml:space="preserve">for (</text>
    <text x="196" y="106" textLength="119" fill="#4ec9b0" font-weight="bold" xml:space="preserve">int i = 0</text>
    <text x="315" y="106" textLength="26" fill="#e8e8e8" xml:space="preserve">; </text>
    <text x="341" y="106" textLength="66" fill="#dcdcaa" font-weight="bold" xml:space="preserve">i &lt; 6</text>
    <text x="407" y="106" textLength="26" fill="#e8e8e8" xml:space="preserve">; </text>
    <text x="433" y="106" textLength="40" fill="#c586c0" font-weight="bold" xml:space="preserve">i++</text>
    <text x="473" y="106" textLength="40" fill="#e8e8e8" xml:space="preserve">) {</text>
  </g>

  <!-- Colored underlines (positions verified against render) -->
  <rect x="196" y="116" width="119" height="6" rx="3" fill="#4ec9b0"/>
  <rect x="341" y="116" width="66" height="6" rx="3" fill="#dcdcaa"/>
  <rect x="433" y="116" width="40" height="6" rx="3" fill="#c586c0"/>

  <!-- Number badges under each segment -->
  <circle cx="255" cy="140" r="13" fill="#2a9d8a"/>
  <text x="255" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">1</text>
  <circle cx="374" cy="140" r="13" fill="#b8a92e"/>
  <text x="374" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">2</text>
  <circle cx="453" cy="140" r="13" fill="#a05ca8"/>
  <text x="453" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">3</text>

  <!-- Card 1: START -->
  <rect x="40" y="180" width="210" height="150" rx="10" fill="#ffffff" stroke="#2a9d8a" stroke-width="3"/>
  <rect x="40" y="180" width="210" height="38" rx="10" fill="#2a9d8a"/>
  <rect x="40" y="208" width="210" height="10" fill="#2a9d8a"/>
  <circle cx="66" cy="199" r="12" fill="#ffffff"/>
  <text x="66" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#2a9d8a">1</text>
  <text x="155" y="206" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">START</text>
  <text x="145" y="244" text-anchor="middle" font-size="14" fill="#333333">Runs ONCE, first.</text>
  <text x="145" y="268" text-anchor="middle" font-size="14" fill="#333333">Creates the counter</text>
  <text x="145" y="292" text-anchor="middle" font-size="14" font-family="Consolas, monospace" fill="#1a6e5f" font-weight="bold">int i = 0</text>
  <text x="145" y="316" text-anchor="middle" font-size="13" fill="#666666">(pushup count = 0)</text>

  <!-- Card 2: CONTINUE IF -->
  <rect x="275" y="180" width="210" height="150" rx="10" fill="#ffffff" stroke="#b8a92e" stroke-width="3"/>
  <rect x="275" y="180" width="210" height="38" rx="10" fill="#b8a92e"/>
  <rect x="275" y="208" width="210" height="10" fill="#b8a92e"/>
  <circle cx="301" cy="199" r="12" fill="#ffffff"/>
  <text x="301" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#b8a92e">2</text>
  <text x="392" y="206" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">CONTINUE IF</text>
  <text x="380" y="244" text-anchor="middle" font-size="14" fill="#333333">Checked BEFORE every rep.</text>
  <text x="380" y="268" text-anchor="middle" font-size="14" font-family="Consolas, monospace" fill="#7a6f1c" font-weight="bold">i &lt; 6</text>
  <text x="380" y="292" text-anchor="middle" font-size="14" fill="#333333">True &#8594; run the body</text>
  <text x="380" y="316" text-anchor="middle" font-size="14" fill="#333333">False &#8594; loop ends</text>

  <!-- Card 3: UPDATE -->
  <rect x="510" y="180" width="210" height="150" rx="10" fill="#ffffff" stroke="#a05ca8" stroke-width="3"/>
  <rect x="510" y="180" width="210" height="38" rx="10" fill="#a05ca8"/>
  <rect x="510" y="208" width="210" height="10" fill="#a05ca8"/>
  <circle cx="536" cy="199" r="12" fill="#ffffff"/>
  <text x="536" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="#a05ca8">3</text>
  <text x="627" y="206" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">UPDATE</text>
  <text x="615" y="244" text-anchor="middle" font-size="14" fill="#333333">Runs AFTER each rep.</text>
  <text x="615" y="268" text-anchor="middle" font-size="14" font-family="Consolas, monospace" fill="#6e3d75" font-weight="bold">i++</text>
  <text x="615" y="292" text-anchor="middle" font-size="14" fill="#333333">Adds 1 to the counter</text>
  <text x="615" y="316" text-anchor="middle" font-size="13" fill="#666666">(one more pushup done)</text>

  <!-- Order strip -->
  <rect x="70" y="356" width="620" height="46" rx="8" fill="#eaf3ee" stroke="#3a7d5c" stroke-width="2"/>
  <text x="380" y="384" text-anchor="middle" font-size="15" fill="#2a5a42" font-weight="bold">Order each rep:  &#9312; once at the start &#8594; &#9313; check &#8594; run body &#8594; &#9314; update &#8594; back to &#9313;</text>

  <text x="380" y="428" text-anchor="middle" font-size="14" fill="#666666">Like pushups: start at 0 &#8594; &#8220;done 6 yet?&#8221; &#8594; do one &#8594; count +1 &#8594; check again.</text>
</svg>
