<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" font-family="Arial, Helvetica, sans-serif">
  <rect x="1" y="1" width="898" height="548" rx="10" fill="#ffffff" stroke="#d5dde3" stroke-width="2"/>

  <!-- dark code panel -->
  <rect x="20" y="20" width="460" height="510" rx="8" fill="#1e1e1e" stroke="#333333" stroke-width="1"/>

  <!-- section dividers -->
  <g stroke="#3a3a3a" stroke-width="1">
    <line x1="36" y1="76" x2="464" y2="76"/>
    <line x1="36" y1="116" x2="464" y2="116"/>
    <line x1="36" y1="180" x2="464" y2="180"/>
    <line x1="36" y1="220" x2="464" y2="220"/>
    <line x1="36" y1="260" x2="464" y2="260"/>
    <line x1="36" y1="348" x2="464" y2="348"/>
    <line x1="36" y1="436" x2="464" y2="436"/>
  </g>

  <!-- numbered badges (left rail) -->
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <circle cx="48" cy="53" r="10" fill="#a04000"/><text x="48" y="57" fill="#ffffff">1</text>
    <circle cx="48" cy="93" r="10" fill="#8e44ad"/><text x="48" y="97" fill="#ffffff">2</text>
    <circle cx="48" cy="133" r="10" fill="#9a7d0a"/><text x="48" y="137" fill="#ffffff">3</text>
    <circle cx="48" cy="197" r="10" fill="#2471a3"/><text x="48" y="201" fill="#ffffff">4</text>
    <circle cx="48" cy="277" r="10" fill="#148f77"/><text x="48" y="281" fill="#ffffff">5</text>
    <circle cx="48" cy="365" r="10" fill="#1a5276"/><text x="48" y="369" fill="#ffffff">6</text>
    <circle cx="48" cy="453" r="10" fill="#5b2c6f"/><text x="48" y="457" fill="#ffffff">7</text>
  </g>

  <!-- code lines -->
  <g font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold">
    <text x="70" y="58" fill="#CE9178" textLength="168">/* HEADER COMMENT */</text>
    <text x="70" y="98" fill="#C586C0" textLength="176">#include &lt;Zumo32U4.h&gt;</text>
    <text x="70" y="138" fill="#DCDCAA" textLength="202">Zumo32U4ButtonA buttonA;</text>
    <text x="70" y="162" fill="#DCDCAA" textLength="176">Zumo32U4OLED display;</text>
    <text x="70" y="202" fill="#4FC1FF" textLength="185">const int SPEED = 200;</text>
    <text x="70" y="242" fill="#DCDCAA" textLength="134">void blinkLED();</text>
    <text x="212" y="242" fill="#6A9955" font-weight="normal" textLength="168">// preview of helper</text>
    <text x="70" y="282" fill="#4EC9B0" textLength="118">void setup() {</text>
    <text x="87" y="306" fill="#6A9955" font-weight="normal" textLength="185">// initialization code</text>
    <text x="70" y="330" fill="#4EC9B0" textLength="8">}</text>
    <text x="70" y="370" fill="#569CD6" textLength="109">void loop() {</text>
    <text x="87" y="394" fill="#6A9955" font-weight="normal" textLength="168">// main program code</text>
    <text x="70" y="418" fill="#569CD6" textLength="8">}</text>
    <text x="70" y="458" fill="#9CDCFE" textLength="160">void myFunction() {</text>
    <text x="87" y="482" fill="#6A9955" font-weight="normal" textLength="134">// reusable code</text>
    <text x="70" y="506" fill="#9CDCFE" textLength="8">}</text>
  </g>

  <!-- dotted leaders to annotations -->
  <g stroke="#c9d4dc" stroke-width="1.2" stroke-dasharray="2 4">
    <line x1="482" y1="49" x2="502" y2="49"/>
    <line x1="482" y1="89" x2="502" y2="89"/>
    <line x1="482" y1="129" x2="502" y2="129"/>
    <line x1="482" y1="193" x2="502" y2="193"/>
    <line x1="482" y1="233" x2="502" y2="233"/>
    <line x1="482" y1="273" x2="502" y2="273"/>
    <line x1="482" y1="361" x2="502" y2="361"/>
    <line x1="482" y1="449" x2="502" y2="449"/>
  </g>

  <!-- annotations: bold title + description -->
  <g font-size="15" font-weight="bold">
    <text x="510" y="54" fill="#a04000">HEADER COMMENT</text>
    <text x="510" y="94" fill="#8e44ad">TOOLBOX</text>
    <text x="510" y="134" fill="#9a7d0a">HARDWARE OBJECTS</text>
    <text x="510" y="198" fill="#2471a3">CONSTANTS</text>
    <text x="510" y="238" fill="#3D5266">FUNCTION PROTOTYPES</text>
    <text x="510" y="278" fill="#148f77">RUNS ONCE</text>
    <text x="510" y="366" fill="#1a5276">RUNS FOREVER</text>
    <text x="510" y="454" fill="#5b2c6f">HELPER FUNCTIONS</text>
  </g>
  <g font-size="13.5" font-style="italic" fill="#4a5a66">
    <text x="510" y="72">What is this program? Who wrote it?</text>
    <text x="510" y="112">Opens the Zumo library</text>
    <text x="510" y="152">Name tags for each piece of hardware</text>
    <text x="510" y="216">Values you might tweak</text>
    <text x="510" y="256">One-line previews of your Section 7 helpers</text>
    <text x="510" y="296">Code here runs one time when the robot powers on</text>
    <text x="510" y="384">Code here repeats over and over until power off</text>
    <text x="510" y="472">Reusable chunks of code you can call by name</text>
  </g>
</svg>