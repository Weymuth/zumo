<rect x="120" y="690" width="410" height="112" rx="12" fill="#ffffff" stroke="#ff8c00" stroke-width="2.5"/>
<rect x="140" y="712" width="30" height="24" rx="5" fill="#ff8c00"/>
<text x="184" y="730" font-size="18" font-weight="bold" fill="#333333">[0] and [4] — outermost pair</text>
<text x="140" y="762" font-family="Courier New, monospace" font-size="17" fill="#b96a00" font-weight="bold" text-anchor="start" textLength="240" lengthAdjust="spacingAndGlyphs">checkForIntersection()</text>
<text x="140" y="788" font-size="15" fill="#555555">They ride beside the line — where the markers are.</text>
<rect x="570" y="690" width="410" height="112" rx="12" fill="#ffffff" stroke="#9aa7b0" stroke-width="2.5"/>
<rect x="590" y="712" width="30" height="24" rx="5" fill="#9aa7b0"/>
<text x="634" y="730" font-size="18" font-weight="bold" fill="#333333">[1] [2] [3] — the middle trio</text>
<text x="590" y="762" font-family="Courier New, monospace" font-size="17" fill="#5a6872" font-weight="bold" text-anchor="start" textLength="200" lengthAdjust="spacingAndGlyphs">readLinePosition()</text>
<text x="590" y="788" font-size="15" fill="#555555">They straddle the line and steer Lesson 8&#8217;s P-control.</text>
<text x="640" y="672" font-size="15" fill="#888888" font-style="italic">the line runs under sensor [2]</text>
