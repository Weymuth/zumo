<text x="550" y="58" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="bold">The Five Line Sensors</text>
<text x="550" y="84" text-anchor="middle" fill="#d6eaf8" font-size="17">Outer pair [0] and [4]: the intersection watchers</text>
