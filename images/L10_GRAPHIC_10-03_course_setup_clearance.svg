<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850" font-family="Arial, Helvetica, sans-serif"><title>Graphic 10.3 — Course Setup</title><desc>Top-down obstacle course setup showing line placement, clearance area, and four setup rules.</desc>

  <defs>
    <linearGradient id="titleBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B1A2E"/>
      <stop offset="100%" stop-color="#0B1A2E"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F3F3"/>
    </linearGradient>
    <linearGradient id="blockGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CE9178"/>
      <stop offset="100%" stop-color="#CE9178"/>
    </linearGradient>
    <pattern id="clearHatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#EEF5EA"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#6A9955" stroke-width="2"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1100" height="850" fill="#F5F2E9"/>

  <!-- ================= TITLE BAND ================= -->
  <rect x="0" y="0" width="1100" height="72" fill="url(#titleBand)"/>
  <text x="34" y="46" font-size="27" font-weight="bold" fill="#ffffff">GRAPHIC 10.3 &#8212; Course Setup</text>
  <text x="1066" y="46" font-size="17" fill="#E8EEF4" text-anchor="end">Lesson 10 &#183; &#167;4.4</text>

  <!-- ================= THE MAT ================= -->
  <rect x="40" y="100" width="1020" height="452" rx="10" fill="url(#floorGrad)" stroke="#D4D4D4" stroke-width="2"/>
  <text x="60" y="132" font-size="16" font-weight="bold" fill="#0B1A2E">TOP-DOWN &#8212; set this up before you upload anything</text>

  <!-- ===== an INTERSECTION, far to the left. STAY AWAY FROM IT. ===== -->
  <rect x="120" y="296" width="7" height="150" fill="#1E1E1E"/>
  <rect x="76" y="192" width="104" height="104" rx="4" fill="#EEF5EA" stroke="#F44747" stroke-width="3" stroke-dasharray="8 5"/>
  <rect x="120" y="192" width="7" height="104" fill="#1E1E1E"/>
  <rect x="76" y="240" width="104" height="7" fill="#1E1E1E"/>
  <text x="128" y="178" font-size="13" font-weight="bold" fill="#F44747" text-anchor="middle">intersection</text>
  <text x="128" y="466" font-size="13" font-weight="bold" fill="#F44747" text-anchor="middle">NOT HERE</text>
  <text x="128" y="484" font-size="12" fill="#A62F2F" text-anchor="middle">too much at once</text>

  <!-- ===== THE STRAIGHT SECTION: this is where the obstacle goes ===== -->
  <rect x="200" y="240" width="826" height="7" fill="#1E1E1E"/>

  <!-- straight-section bracket -->
  <line x1="240" y1="150" x2="240" y2="176" stroke="#355E3B" stroke-width="2"/>
  <line x1="980" y1="150" x2="980" y2="176" stroke="#355E3B" stroke-width="2"/>
  <line x1="240" y1="163" x2="980" y2="163" stroke="#355E3B" stroke-width="2"/>
  <text x="610" y="152" font-size="14" font-weight="bold" fill="#355E3B" text-anchor="middle">a BORING, STRAIGHT stretch &#8212; no green markers, no turns</text>

  <!-- ===== THE OBSTACLE, centered ON the line ===== -->
  <rect x="562" y="206" width="86" height="76" rx="4" fill="url(#blockGrad)" stroke="#7B6240" stroke-width="3"/>
  <text x="605" y="250" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">BLOCK</text>

  <!-- centered callout: the line passes through the middle of the block -->
  <line x1="605" y1="196" x2="605" y2="206" stroke="#9B5F48" stroke-width="2"/>
  <text x="605" y="190" font-size="13" font-weight="bold" fill="#9B5F48" text-anchor="middle">squarely ON the line, CENTERED</text>

  <!-- robot approaching -->
  <rect x="318" y="222" width="48" height="42" rx="5" fill="#3D5266" stroke="#0B1A2E" stroke-width="3"/>
  <polygon points="366,232 366,254 383,243" fill="#3D5266" stroke="#0B1A2E" stroke-width="2"/>
  <text x="342" y="248" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">ZUMO</text>

  <!-- ================= THE 30 cm OF CLEAR FLOOR ================= -->
  <rect x="440" y="300" width="450" height="200" rx="6" fill="url(#clearHatch)" stroke="#355E3B" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="665" y="336" font-size="17" font-weight="bold" fill="#355E3B" text-anchor="middle">30 cm of CLEAR FLOOR</text>
  <text x="665" y="358" font-size="13" fill="#355E3B" text-anchor="middle">nothing here. no wall, no chair leg, no other robot.</text>

  <!-- the 30 cm dimension line (single-polygon double arrow) -->
  <polygon points="452,392 476,380 476,388 878,388 878,380 902,392 878,404 878,396 476,396 476,404"
           fill="#355E3B" stroke="#355E3B" stroke-width="2"/>
  <rect x="612" y="378" width="106" height="28" rx="4" fill="#ffffff" stroke="#355E3B" stroke-width="2"/>
  <text x="665" y="398" font-size="15" font-weight="bold" fill="#355E3B" text-anchor="middle">&#8805; 30 cm</text>

  <!-- what the robot ACTUALLY uses: the 20 cm drive-past -->
  <polygon points="524,448 548,436 548,444 766,444 766,436 790,448 766,460 766,452 548,452 548,460"
           fill="#9B5F48" stroke="#7B6240" stroke-width="2"/>
  <rect x="588" y="466" width="164" height="26" rx="4" fill="#FAEFEA" stroke="#9B5F48" stroke-width="2"/>
  <text x="670" y="485" font-family="Courier New, monospace" font-size="13" font-weight="bold" fill="#9B5F48" text-anchor="middle">AVOID_PAST_CM = 20</text>
  <text x="920" y="452" font-size="13" font-weight="bold" fill="#9B5F48">what the robot</text>
  <text x="920" y="470" font-size="13" font-weight="bold" fill="#9B5F48">actually drives</text>

  <!-- the detour arrow leaving the line, to the RIGHT of travel = down-screen -->
  <polygon points="493,254 507,254 507,286 517,286 500,310 483,286 493,286"
           fill="#9B5F48" stroke="#7B6240" stroke-width="2"/>
  <text x="404" y="300" font-size="13" font-weight="bold" fill="#9B5F48">the robot detours</text>
  <text x="404" y="318" font-size="13" font-weight="bold" fill="#9B5F48">to THIS side</text>

  <!-- margin annotation -->
  <text x="920" y="336" font-size="13" font-weight="bold" fill="#355E3B">why 30, not 20?</text>
  <text x="920" y="356" font-size="12" fill="#355E3B">the extra 10 cm is</text>
  <text x="920" y="374" font-size="12" fill="#355E3B">your margin for a</text>
  <text x="920" y="392" font-size="12" fill="#355E3B">turn that overshoots.</text>

  <!-- ================= THE FOUR RULES ================= -->
  <rect x="40" y="576" width="1020" height="244" rx="10" fill="#FFFFFF" stroke="#3D5266" stroke-width="2"/>
  <rect x="40" y="576" width="1020" height="42" rx="10" fill="#0B1A2E"/>
  <rect x="40" y="604" width="1020" height="14" fill="#0B1A2E"/>
  <text x="64" y="605" font-size="17" font-weight="bold" fill="#ffffff">FOUR RULES &#8212; get these wrong and you will blame your code</text>

  <circle cx="82" cy="656" r="15" fill="#3D5266"/>
  <text x="82" y="662" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="108" y="653" font-size="14" font-weight="bold" fill="#355E3B">Set up your Lesson 9 course, exactly as before.</text>
  <text x="108" y="673" font-size="13" fill="#355E3B">Same mat, same tape, same intersections. Change one thing at a time.</text>

  <circle cx="82" cy="708" r="15" fill="#3D5266"/>
  <text x="82" y="714" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="108" y="705" font-size="14" font-weight="bold" fill="#355E3B">Pick a STRAIGHT section, well away from any green marker.</text>
  <text x="108" y="725" font-size="13" fill="#355E3B">Near an intersection you test three things at once, and</text>
  <text x="108" y="741" font-size="13" fill="#355E3B">when it fails you will not know which one broke.</text>

  <circle cx="82" cy="760" r="15" fill="#3D5266"/>
  <text x="82" y="766" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="108" y="757" font-size="14" font-weight="bold" fill="#355E3B">Put the obstacle squarely ON the line, centered.</text>
  <text x="108" y="777" font-size="13" fill="#355E3B">Off-center, it may slip past an edge and never trigger.</text>
  <text x="108" y="793" font-size="13" fill="#355E3B">Light, tall, flat, wide, heavy &#8212; see &#167;4.3.</text>

  <circle cx="608" cy="656" r="15" fill="#3D5266"/>
  <text x="608" y="662" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <text x="634" y="653" font-size="14" font-weight="bold" fill="#355E3B">Leave 30 cm of clear floor on the detour side.</text>
  <text x="634" y="673" font-size="13" fill="#355E3B">The robot drives 20 cm out there, blind. Give it room to be wrong.</text>

  <rect x="608" y="694" width="424" height="98" rx="6" fill="#FFF8E1" stroke="#CCA700" stroke-width="2"/>
  <text x="628" y="718" font-size="14" font-weight="bold" fill="#856404">CAUTION: Test on a boring straight line first.</text>
  <text x="628" y="742" font-size="13" fill="#856404">Make it work. THEN get mean &#8212; move the block near a</text>
  <text x="628" y="762" font-size="13" fill="#856404">turn, put two in a row, place one while it is driving.</text>
  <text x="628" y="784" font-size="13" font-style="italic" fill="#856404">A failure you cannot locate is not a test.</text>

</svg>
