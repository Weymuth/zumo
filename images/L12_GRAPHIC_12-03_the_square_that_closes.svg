<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850">
  <defs>
    <linearGradient id="tb3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a5276"/><stop offset="1" stop-color="#2e86ab"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="850" fill="#fafafa"/>
  <rect x="0" y="0" width="1100" height="74" fill="url(#tb3)"/>
  <text x="34" y="47" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#ffffff">The Lesson 6 Square, Run on Delrin</text>

  <text x="550" y="116" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#555">Same code. Same slick surface. Same slipping wheels. Only the CORNERS are different.</text>

  <!-- ============ LEFT: ENCODER CORNERS ============ -->
  <rect x="45" y="150" width="480" height="600" rx="12" fill="#ffffff" stroke="#c0392b" stroke-width="3"/>
  <rect x="45" y="150" width="480" height="52" rx="12" fill="#c0392b"/>
  <rect x="45" y="186" width="480" height="16" fill="#c0392b"/>
  <text x="285" y="185" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#ffffff">BUTTON A &#8212; turnDegrees()</text>
  <text x="285" y="230" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#7b241c">Corners closed by the ENCODER</text>

  <!-- collapsing path: each corner short by ~30deg -->
  <circle cx="150" cy="620" r="9" fill="#27ae60"/>
  <text x="150" y="652" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1e8449">START</text>
  <polyline points="150,620 400,620 400,620" fill="none" stroke="#c0392b" stroke-width="5"/>
  <polyline points="400,620 400,620 466,430" fill="none" stroke="#c0392b" stroke-width="5"/>
  <polyline points="466,430 466,430 260,340" fill="none" stroke="#c0392b" stroke-width="5"/>
  <polyline points="260,340 260,340 118,470" fill="none" stroke="#c0392b" stroke-width="5"/>
  <circle cx="118" cy="470" r="9" fill="#e74c3c"/>
  <text x="112" y="500" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#c0392b">END &#8212; nowhere near</text>

  <text x="404" y="596" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#c0392b">60&#176;</text>
  <text x="474" y="412" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#c0392b">62&#176;</text>
  <text x="242" y="326" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#c0392b">58&#176;</text>
  <text x="98" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#c0392b">61&#176;</text>

  <rect x="80" y="676" width="410" height="56" rx="8" fill="#fdecea" stroke="#e74c3c" stroke-width="2"/>
  <text x="285" y="700" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#922b21">Every corner slips a little. The errors ADD UP.</text>
  <text x="285" y="722" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#922b21">And the encoder is completely satisfied.</text>

  <!-- ============ RIGHT: GYRO CORNERS ============ -->
  <rect x="575" y="150" width="480" height="600" rx="12" fill="#ffffff" stroke="#1e8449" stroke-width="3"/>
  <rect x="575" y="150" width="480" height="52" rx="12" fill="#1e8449"/>
  <rect x="575" y="186" width="480" height="16" fill="#1e8449"/>
  <text x="815" y="185" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#ffffff">BUTTON C &#8212; turnDegreesGyro()</text>
  <text x="815" y="230" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#145a32">Corners closed by the GYRO</text>

  <rect x="680" y="380" width="270" height="240" fill="none" stroke="#27ae60" stroke-width="5"/>
  <circle cx="680" cy="620" r="9" fill="#27ae60"/>
  <text x="680" y="652" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1e8449">START = END</text>
  <text x="958" y="608" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1e8449">90&#176;</text>
  <text x="958" y="374" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1e8449">90&#176;</text>
  <text x="654" y="374" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1e8449">90&#176;</text>
  <text x="654" y="608" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1e8449">90&#176;</text>

  <rect x="610" y="676" width="410" height="56" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <text x="815" y="700" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#145a32">The wheels still slip. The turn still takes longer.</text>
  <text x="815" y="722" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#145a32">The robot comes home anyway.</text>

  <text x="550" y="800" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#1a5276">Slip does not make the gyro wrong. Slip only makes it slow.</text>
</svg>
