<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850">
  <rect width="1100" height="850" fill="#F5F2E9"/>
  <rect x="0" y="0" width="1100" height="74" fill="#0B1A2E"/>
  <text x="34" y="47" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" fill="#FFFFFF">The Lesson 6 Square, Run on Delrin</text>

  <text x="550" y="116" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#3D5266">Same code. Same slick surface. Same slipping wheels. Only the CORNERS are different.</text>

  <!-- ============ LEFT: ENCODER CORNERS ============ -->
  <rect x="45" y="150" width="480" height="600" rx="12" fill="#ffffff" stroke="#B42318" stroke-width="3"/>
  <rect x="45" y="150" width="480" height="52" rx="12" fill="#B42318"/>
  <rect x="45" y="186" width="480" height="16" fill="#B42318"/>
  <text x="285" y="185" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" fill="#FFFFFF">BUTTON A — turnDegrees()</text>
  <text x="285" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#7A231C">Corners closed by the ENCODER</text>

  <!-- collapsing path: each corner short by ~30deg -->
  <circle cx="150" cy="620" r="9" fill="#2FAE66"/>
  <text x="150" y="652" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#2F7D55">START</text>
  <polyline points="150,620 400,620 400,620" fill="none" stroke="#B42318" stroke-width="5"/>
  <polyline points="400,620 400,620 466,430" fill="none" stroke="#B42318" stroke-width="5"/>
  <polyline points="466,430 466,430 260,340" fill="none" stroke="#B42318" stroke-width="5"/>
  <polyline points="260,340 260,340 118,470" fill="none" stroke="#B42318" stroke-width="5"/>
  <circle cx="118" cy="470" r="9" fill="#F44747"/>
  <text x="112" y="500" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#B42318">END — nowhere near</text>

  <text x="404" y="596" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#B42318">60°</text>
  <text x="474" y="412" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#B42318">62°</text>
  <text x="242" y="326" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#B42318">58°</text>
  <text x="98" y="452" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#B42318">61°</text>

  <rect x="80" y="676" width="410" height="56" rx="8" fill="#FDECEA" stroke="#F44747" stroke-width="2"/>
  <text x="285" y="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#8F241B">Every corner slips a little. The errors ADD UP.</text>
  <text x="285" y="722" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#8F241B">And the encoder is completely satisfied.</text>

  <!-- ============ RIGHT: GYRO CORNERS ============ -->
  <rect x="575" y="150" width="480" height="600" rx="12" fill="#ffffff" stroke="#2F7D55" stroke-width="3"/>
  <rect x="575" y="150" width="480" height="52" rx="12" fill="#2F7D55"/>
  <rect x="575" y="186" width="480" height="16" fill="#2F7D55"/>
  <text x="815" y="185" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" fill="#FFFFFF">BUTTON C — turnDegreesGyro()</text>
  <text x="815" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#265F45">Corners closed by the GYRO</text>

  <rect x="680" y="380" width="270" height="240" fill="none" stroke="#2FAE66" stroke-width="5"/>
  <circle cx="680" cy="620" r="9" fill="#2FAE66"/>
  <text x="680" y="652" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2F7D55">START = END</text>
  <text x="958" y="608" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2F7D55">90°</text>
  <text x="958" y="374" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2F7D55">90°</text>
  <text x="654" y="374" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2F7D55">90°</text>
  <text x="654" y="608" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#2F7D55">90°</text>

  <rect x="610" y="676" width="410" height="56" rx="8" fill="#EEF7F1" stroke="#2FAE66" stroke-width="2"/>
  <text x="815" y="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#265F45">The wheels still slip. The turn still takes longer.</text>
  <text x="815" y="722" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#265F45">The robot comes home anyway.</text>

  <text x="550" y="800" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#0B1A2E">Slip does not make the gyro wrong. Slip only makes it slow.</text>
</svg>
