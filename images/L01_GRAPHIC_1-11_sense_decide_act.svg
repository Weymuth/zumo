<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
  <title id="title">The Robot Loop: Sense, Decide, Act</title>
  <desc id="desc">A RoboLore instructional graphic showing the repeating robot control loop: sense inputs, decide in code, act through outputs, and repeat forever.</desc>

  <defs>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B1A2E"/>
      <stop offset="1" stop-color="#13345C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#0B1A2E" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowNavy" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#0B1A2E"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#647789"/>
    </marker>
    <style>
      .h1{font-family:Inter,Arial,sans-serif;font-size:70px;font-weight:800;fill:#FFFFFF;}
      .h2{font-family:Inter,Arial,sans-serif;font-size:29px;font-weight:600;fill:#E9DFD2;}
      .headerBody{font-family:Inter,Arial,sans-serif;font-size:27px;font-weight:500;fill:#FFFFFF;}
      .small{font-family:Inter,Arial,sans-serif;font-size:18px;font-weight:700;letter-spacing:1.2px;fill:#3D5266;}
      .cardTitle{font-family:Inter,Arial,sans-serif;font-size:34px;font-weight:800;fill:#FFFFFF;}
      .cardText{font-family:Inter,Arial,sans-serif;font-size:23px;font-weight:500;fill:#3D5266;}
      .stepNum{font-family:Inter,Arial,sans-serif;font-size:25px;font-weight:800;fill:#FFFFFF;}
      .repeat{font-family:Inter,Arial,sans-serif;font-size:24px;font-weight:600;font-style:italic;fill:#647789;}
      .calloutTitle{font-family:Inter,Arial,sans-serif;font-size:29px;font-weight:800;fill:#15336D;}
      .calloutText{font-family:Inter,Arial,sans-serif;font-size:23px;font-weight:500;fill:#3D5266;}
      .tip{font-family:Inter,Arial,sans-serif;font-size:27px;font-weight:500;fill:#15336D;}
    </style>
  </defs>

  <rect width="1600" height="860" fill="#F5F2E9"/>

  <!-- Header -->
  <rect x="0" y="0" width="1600" height="158" fill="url(#headerGrad)"/>
  <text x="56" y="82" class="h1">The Robot Loop</text>
  <text x="56" y="128" class="h2">sense → decide → act, then repeat</text>
  <line x1="850" y1="32" x2="850" y2="120" stroke="#D9E1EA" stroke-width="2"/>
  <text x="895" y="56" class="headerBody">Every robot program follows the same basic cycle:</text>
  <text x="895" y="92" class="headerBody">read inputs, choose a response, and control outputs.</text>
  <line x1="0" y1="158" x2="1600" y2="158" stroke="#C9A463" stroke-width="4"/>
  <circle cx="22" cy="160" r="16" fill="#C9A463" stroke="#8B6617" stroke-width="2"/>
  <circle cx="1578" cy="160" r="16" fill="#C9A463" stroke="#8B6617" stroke-width="2"/>
  <circle cx="22" cy="160" r="5.5" fill="#F8E7BE"/>
  <circle cx="1578" cy="160" r="5.5" fill="#F8E7BE"/>

  <!-- Main teaching panel -->
  <rect x="72" y="210" width="1456" height="440" rx="22" fill="#FFFFFF" stroke="#D7DEE6" stroke-width="2" filter="url(#shadow)"/>
  <text x="105" y="258" class="small">CONTROL CYCLE</text>
  <text x="105" y="296" style="font-family:Inter,Arial,sans-serif;font-size:30px;font-weight:800;fill:#15336D;">A robot continuously moves through three connected steps</text>

  <!-- SENSE -->
  <rect x="120" y="345" width="350" height="170" rx="18" fill="#FFFFFF" stroke="#007ACC" stroke-width="3"/>
  <rect x="120" y="345" width="350" height="70" rx="18" fill="#007ACC"/>
  <rect x="120" y="385" width="350" height="30" fill="#007ACC"/>
  <circle cx="160" cy="380" r="22" fill="#F5F2E9"/>
  <circle cx="160" cy="380" r="15" fill="#007ACC"/>
  <text x="160" y="388" text-anchor="middle" class="stepNum">1</text>
  <text x="206" y="391" class="cardTitle">SENSE</text>
  <text x="295" y="465" text-anchor="middle" class="cardText">read sensors and inputs</text>

  <!-- DECIDE -->
  <rect x="625" y="345" width="350" height="170" rx="18" fill="#FFFFFF" stroke="#8C5A99" stroke-width="3"/>
  <rect x="625" y="345" width="350" height="70" rx="18" fill="#8C5A99"/>
  <rect x="625" y="385" width="350" height="30" fill="#8C5A99"/>
  <circle cx="665" cy="380" r="22" fill="#F5F2E9"/>
  <circle cx="665" cy="380" r="15" fill="#8C5A99"/>
  <text x="665" y="388" text-anchor="middle" class="stepNum">2</text>
  <text x="711" y="391" class="cardTitle">DECIDE</text>
  <text x="800" y="459" text-anchor="middle" class="cardText">your code chooses</text>
  <text x="800" y="490" text-anchor="middle" class="cardText">what to do next</text>

  <!-- ACT -->
  <rect x="1130" y="345" width="350" height="170" rx="18" fill="#FFFFFF" stroke="#2EA043" stroke-width="3"/>
  <rect x="1130" y="345" width="350" height="70" rx="18" fill="#2EA043"/>
  <rect x="1130" y="385" width="350" height="30" fill="#2EA043"/>
  <circle cx="1170" cy="380" r="22" fill="#F5F2E9"/>
  <circle cx="1170" cy="380" r="15" fill="#2EA043"/>
  <text x="1170" y="388" text-anchor="middle" class="stepNum">3</text>
  <text x="1216" y="391" class="cardTitle">ACT</text>
  <text x="1305" y="459" text-anchor="middle" class="cardText">motors, sounds,</text>
  <text x="1305" y="490" text-anchor="middle" class="cardText">lights, and display</text>

  <!-- Forward arrows -->
  <path d="M 480 430 H 602" fill="none" stroke="#0B1A2E" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowNavy)"/>
  <path d="M 985 430 H 1107" fill="none" stroke="#0B1A2E" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowNavy)"/>

  <!-- Return loop -->
  <path d="M 1305 525 V 585 H 295 V 525" fill="none" stroke="#647789" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowSlate)"/>
  <text x="800" y="622" text-anchor="middle" class="repeat">repeat forever — often 100+ times per second</text>

  <!-- Key insight -->
  <rect x="198" y="690" width="1204" height="88" rx="18" fill="#FFFFFF" stroke="#D7DEE6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="198" y="690" width="12" height="88" rx="6" fill="#8C5A99"/>
  <circle cx="252" cy="734" r="27" fill="#0E3B83"/>
  <path d="M242 734h20M252 724v20" stroke="#F5F2E9" stroke-width="4" stroke-linecap="round"/>
  <text x="304" y="724" class="calloutTitle">Key idea</text>
  <text x="304" y="754" class="calloutText">Your code lives in the DECIDE step, but it affects every part of the loop.</text>

  <!-- Footer tip -->
  <line x1="72" y1="818" x2="1528" y2="818" stroke="#D8C29A" stroke-width="2"/>
  <text x="80" y="850" class="tip"><tspan font-weight="800">Tip:</tspan> The faster this loop repeats, the more responsive the robot feels.</text>
</svg>
