<svg viewBox="0 0 1100 440" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a5276"/>
      <stop offset="1" stop-color="#2e86ab"/>
    </linearGradient>
    <marker id="fwdArr" markerWidth="12" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#2e86ab"/>
    </marker>
    <marker id="retArr" markerWidth="12" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#6c757d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="440" fill="#ffffff"/>

  <!-- Title band -->
  <rect x="40" y="20" width="1020" height="52" rx="8" fill="url(#titleGrad)"/>
  <text x="60" y="55" fill="#ffffff" font-size="26" font-weight="bold">THE ROBOT LOOP</text>
  <text x="1040" y="53" fill="#d6e9f2" font-size="14" text-anchor="end">Zumo 32U4 Robotics &#183; Lesson 1</text>

  <!-- SENSE box -->
  <rect x="120" y="140" width="220" height="100" rx="12" fill="#2e86ab"/>
  <text x="230" y="182" fill="#ffffff" font-size="22" font-weight="bold" text-anchor="middle">SENSE</text>
  <text x="230" y="208" fill="#d6e9f2" font-size="13" text-anchor="middle">read sensors &amp; inputs</text>

  <!-- Arrow SENSE → DECIDE -->
  <line x1="340" y1="190" x2="418" y2="190" stroke="#2e86ab" stroke-width="3" marker-end="url(#fwdArr)"/>

  <!-- DECIDE box -->
  <rect x="420" y="140" width="260" height="100" rx="12" fill="#9b6a9e"/>
  <text x="550" y="182" fill="#ffffff" font-size="22" font-weight="bold" text-anchor="middle">DECIDE</text>
  <text x="550" y="208" fill="#f0e4f1" font-size="13" text-anchor="middle">your code chooses what to do</text>

  <!-- Arrow DECIDE → ACT -->
  <line x1="680" y1="190" x2="758" y2="190" stroke="#2e86ab" stroke-width="3" marker-end="url(#fwdArr)"/>

  <!-- ACT box -->
  <rect x="760" y="140" width="220" height="100" rx="12" fill="#3a7d5c"/>
  <text x="870" y="182" fill="#ffffff" font-size="22" font-weight="bold" text-anchor="middle">ACT</text>
  <text x="870" y="208" fill="#d2f0e4" font-size="13" text-anchor="middle">motors, sounds, display</text>

  <!-- Return loop arrow: ACT bottom → SENSE bottom -->
  <path d="M 870 240 L 870 310 L 230 310 L 230 240" fill="none" stroke="#6c757d" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#retArr)"/>

  <!-- "repeat forever" label -->
  <text x="550" y="350" fill="#6c757d" font-size="16" text-anchor="middle" font-style="italic">(repeat forever — often 100+ times per second)</text>

  <!-- Key insight callout -->
  <rect x="350" y="376" width="400" height="44" rx="22" fill="#f0e4f1" stroke="#9b6a9e" stroke-width="2"/>
  <text x="550" y="403" fill="#704c73" font-size="14" font-weight="bold" text-anchor="middle">&#128273; Your code lives in the DECIDE step</text>
</svg>
