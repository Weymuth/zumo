<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850">
<defs>
<linearGradient id="tb" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#1a5276"/><stop offset="1" stop-color="#2e86ab"/>
</linearGradient>
</defs>
<rect width="1100" height="850" fill="#ffffff"/>
<rect x="0" y="0" width="1100" height="64" fill="url(#tb)"/>
<text x="550" y="41" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">THE TWO-LED SYSTEM &#8212; ONE EAR, TWO FLASHLIGHTS</text>
<text x="550" y="94" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#555" text-anchor="middle">The front detector is read TWICE. Same ear, different flashlight &#8212; and the two answers tell you which way the object sits.</text>

<rect x="60" y="126" width="980" height="292" rx="10" fill="#f7f9fa" stroke="#34495e" stroke-width="2"/>
<text x="550" y="156" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" fill="#34495e" text-anchor="middle" letter-spacing="2">FRONT OF THE ROBOT, LOOKING STRAIGHT AT IT</text>

<!-- blade / front face -->
<rect x="330" y="250" width="440" height="86" rx="6" fill="#e8ecef" stroke="#2c3e50" stroke-width="2"/>
<rect x="300" y="336" width="500" height="30" rx="4" fill="#4d5358" stroke="#2c3e50" stroke-width="2"/>
<text x="550" y="357" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">FRONT SENSOR ARRAY</text>

<!-- LEFT emitter -->
<circle cx="400" cy="293" r="21" fill="#f2d7de" stroke="#8e3a4f" stroke-width="3"/>
<circle cx="400" cy="293" r="8" fill="#c45d76"/>
<text x="400" y="230" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#8e3a4f" text-anchor="middle">LEFT LED</text>
<text x="400" y="211" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#8e3a4f" text-anchor="middle">(one of the LEFT pair)</text>

<!-- FRONT receiver -->
<rect x="527" y="272" width="46" height="42" rx="5" fill="#dbeee3" stroke="#1e4633" stroke-width="3"/>
<rect x="540" y="284" width="20" height="18" rx="2" fill="#2a5a42"/>
<text x="550" y="230" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#1e4633" text-anchor="middle">FRONT RECEIVER</text>
<text x="550" y="211" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1e4633" text-anchor="middle">the only ear &#8212; there is just ONE</text>

<!-- RIGHT emitter -->
<circle cx="700" cy="293" r="21" fill="#dce9f2" stroke="#1a5276" stroke-width="3"/>
<circle cx="700" cy="293" r="8" fill="#2e86ab"/>
<text x="700" y="230" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#1a5276" text-anchor="middle">RIGHT LED</text>
<text x="700" y="211" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1a5276" text-anchor="middle">(one of the RIGHT pair)</text>

<text x="550" y="396" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#666" text-anchor="middle">Two flashlights, one ear. They <tspan font-weight="bold">never fire together</tspan> &#8212; one control pin picks which team is on.</text>

<rect x="60" y="440" width="470" height="240" rx="10" fill="#fbeef1" stroke="#8e3a4f" stroke-width="2"/>
<rect x="60" y="440" width="470" height="38" rx="10" fill="#8e3a4f"/><rect x="60" y="466" width="470" height="12" fill="#8e3a4f"/>
<text x="295" y="467" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">READ 1 &#8212; LEFT flashlight on</text>
<text x="295" y="508" font-family="Courier New,monospace" font-size="15" font-weight="bold" fill="#8e3a4f" text-anchor="middle">countsFrontWithLeftLeds()</text>
<circle cx="150" cy="580" r="15" fill="#c45d76"/>
<rect x="290" y="548" width="64" height="64" rx="6" fill="#e8ecef" stroke="#2c3e50" stroke-width="2"/>
<path d="M163,573 L288,556" stroke="#c45d76" stroke-width="3" fill="none"/>
<path d="M288,600 L215,614" stroke="#c45d76" stroke-width="3" stroke-dasharray="6 5" fill="none"/>
<rect x="382" y="552" width="112" height="56" rx="6" fill="#c45d76"/>
<text x="438" y="576" font-family="Courier New,monospace" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
<text x="438" y="598" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">strong echo</text>
<text x="295" y="650" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333" text-anchor="middle">The object sits left. The LEFT light reaches it well.</text>

<rect x="570" y="440" width="470" height="240" rx="10" fill="#eaf2f8" stroke="#1a5276" stroke-width="2"/>
<rect x="570" y="440" width="470" height="38" rx="10" fill="#1a5276"/><rect x="570" y="466" width="470" height="12" fill="#1a5276"/>
<text x="805" y="467" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">READ 2 &#8212; RIGHT flashlight on</text>
<text x="805" y="508" font-family="Courier New,monospace" font-size="15" font-weight="bold" fill="#1a5276" text-anchor="middle">countsFrontWithRightLeds()</text>
<circle cx="950" cy="580" r="15" fill="#2e86ab"/>
<rect x="746" y="548" width="64" height="64" rx="6" fill="#e8ecef" stroke="#2c3e50" stroke-width="2"/>
<path d="M937,573 L812,556" stroke="#2e86ab" stroke-width="3" fill="none"/>
<path d="M812,600 L885,614" stroke="#2e86ab" stroke-width="3" stroke-dasharray="6 5" opacity="0.45" fill="none"/>
<rect x="606" y="552" width="112" height="56" rx="6" fill="#8a97a0"/>
<text x="662" y="576" font-family="Courier New,monospace" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="662" y="598" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">weak echo</text>
<text x="805" y="650" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333" text-anchor="middle">Same object, same ear &#8212; but the RIGHT light barely lands.</text>

<polygon points="536,556 552,556 552,542 566,570 552,598 552,584 536,584" fill="#34495e"/>

<rect x="60" y="700" width="980" height="118" rx="10" fill="#e8f3ec" stroke="#2a5a42" stroke-width="2"/>
<text x="86" y="730" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" fill="#1e4633">TWO NUMBERS, TWO DIFFERENT QUESTIONS</text>
<text x="86" y="762" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#333"><tspan font-weight="bold">&#8220;Is something there?&#8221;</tspan> &#8594; take the <tspan font-family="Courier New,monospace" font-weight="bold" fill="#1a5276">max</tspan>: <tspan font-family="Courier New,monospace" fill="#1a5276">max(5, 2) = 5</tspan>. Either flashlight seeing it counts.</text>
<text x="86" y="790" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#333"><tspan font-weight="bold">&#8220;Which way is it?&#8221;</tspan> &#8594; take the <tspan font-family="Courier New,monospace" font-weight="bold" fill="#8e3a4f">difference</tspan>: <tspan font-family="Courier New,monospace" fill="#8e3a4f">5 &#8722; 2 = +3</tspan>, so it leans LEFT. That difference is the seed of steering.</text>
</svg>
