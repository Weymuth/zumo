<svg viewBox="0 0 1100 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a5276"/>
      <stop offset="1" stop-color="#2e86ab"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1100" height="560" fill="#ffffff"/>

  <!-- Title band -->
  <rect x="40" y="24" width="1020" height="52" rx="8" fill="url(#titleGrad)"/>
  <text x="60" y="59" fill="#ffffff" font-size="24" font-weight="bold">OLED — STATUS SCREEN</text>
  <text x="1040" y="57" fill="#d6e9f2" font-size="13" text-anchor="end">Zumo 32U4 Robotics &#183; Lesson 2</text>

  <!-- PCB board -->
  <rect x="270" y="108" width="560" height="380" rx="8" fill="#2a5a2a" stroke="#1a3a1a" stroke-width="2"/>

  <!-- Connector pins at top -->
  <rect x="380" y="104" width="340" height="16" rx="2" fill="#1e3a1e"/>
  <text x="550" y="116" fill="#6a9955" font-size="10" font-family="Courier New, monospace" text-anchor="middle">GND VCC CLK MOS RES DC CS</text>

  <!-- Mounting holes -->
  <circle cx="294" cy="130" r="7" fill="#1a3a1a" stroke="#3a6a3a" stroke-width="1.5"/>
  <circle cx="806" cy="130" r="7" fill="#1a3a1a" stroke="#3a6a3a" stroke-width="1.5"/>
  <circle cx="294" cy="462" r="7" fill="#1a3a1a" stroke="#3a6a3a" stroke-width="1.5"/>
  <circle cx="806" cy="462" r="7" fill="#1a3a1a" stroke="#3a6a3a" stroke-width="1.5"/>

  <!-- Screen bezel -->
  <rect x="310" y="148" width="480" height="290" rx="4" fill="#111111" stroke="#333333" stroke-width="2"/>

  <!-- Screen area -->
  <rect x="322" y="158" width="456" height="270" rx="2" fill="#050505"/>

  <!-- Row 0: === STATUS === -->
  <text x="550" y="196" fill="#e8f8e8" font-size="22" font-weight="bold" font-family="Courier New, monospace" text-anchor="middle">=== STATUS ===</text>

  <!-- Row 2: Uptime (sec): -->
  <text x="344" y="254" fill="#d0f0d0" font-size="21" font-family="Courier New, monospace">Uptime (sec):</text>

  <!-- Row 3: 42  (sample value) -->
  <text x="344" y="292" fill="#ffffff" font-size="30" font-weight="bold" font-family="Courier New, monospace">42</text>

  <!-- Row 5: Buttons work! -->
  <text x="344" y="360" fill="#d0f0d0" font-size="21" font-family="Courier New, monospace">Buttons work!</text>

  <!-- Callout: uptime value changes — moved well apart -->
  <line x1="420" y1="280" x2="840" y2="240" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="840" y="224" width="230" height="32" rx="5" fill="#1a3a5c" stroke="#4fc1ff" stroke-width="2"/>
  <text x="955" y="245" fill="#4fc1ff" font-size="14" font-weight="bold" text-anchor="middle">value updates each press</text>

  <!-- Callout: millis()/1000 — below, clearly separated -->
  <line x1="420" y1="280" x2="840" y2="310" stroke="#adb5bd" stroke-width="1.5"/>
  <rect x="840" y="296" width="230" height="32" rx="5" fill="#3a3a3a" stroke="#adb5bd" stroke-width="2"/>
  <text x="955" y="317" fill="#ffffff" font-size="14" font-family="Courier New, monospace" text-anchor="middle">millis() / 1000</text>

  <!-- Footer -->
  <text x="550" y="516" fill="#6c757d" font-size="13" text-anchor="middle">Press Button C to show this screen &#8212; uptime increases the longer the robot has been on</text>
  <text x="1060" y="548" fill="#9aa0a6" font-size="11" text-anchor="end">IMAGE 2.8</text>
</svg>
