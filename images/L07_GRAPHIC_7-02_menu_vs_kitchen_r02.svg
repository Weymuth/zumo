<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">The Menu and the Kitchen</title>
  <desc id="desc">RoboLore instructional graphic comparing a C++ header file to a menu and an implementation file to a kitchen.</desc>
  <rect x="0" y="0" width="1100" height="850" fill="#F6F7F8"/>
  <rect x="0" y="0" width="1100" height="72" fill="#2A769B"/>
  <text x="34" y="44" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">GRAPHIC 7.2 — The Menu and the Kitchen</text>
  <text x="877" y="44" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#E7F0F5">Lesson 7 · header vs .cpp</text>

  <rect x="40" y="100" width="498" height="469" rx="12" fill="#DCE7EF" stroke="#0E75C9" stroke-width="2"/>
  <rect x="40" y="100" width="498" height="44" rx="12" fill="#1F5B86"/>
  <rect x="40" y="132" width="498" height="12" fill="#1F5B86"/>
  <text x="63" y="131" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">THE MENU — RobotMotion.h</text>

  <rect x="72" y="173" width="434" height="219" rx="6" fill="none" stroke="#2F8AE6" stroke-width="2"/>
  <text x="289" y="203" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1F5B86">WHAT YOU CAN ORDER</text>
  <line x1="104" y1="218" x2="473" y2="218" stroke="#C7D2DD" stroke-width="2"/>
  <line x1="104" y1="340" x2="473" y2="340" stroke="#C7D2DD" stroke-width="2"/>

  <text x="102" y="252" font-family="Courier New, monospace" font-size="17" fill="#1F5B86">void driveDistance(float cm);</text>
  <text x="102" y="287" font-family="Courier New, monospace" font-size="17" fill="#1F5B86">void turnDegrees(float deg);</text>
  <text x="102" y="322" font-family="Courier New, monospace" font-size="17" fill="#1F5B86">void stopMotors();</text>
  <text x="289" y="368" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6E8192">names and prices. no recipes.</text>

  <text x="72" y="428" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1F5B86">A menu is a PROMISE. It tells you what</text>
  <text x="72" y="450" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1F5B86">exists and what to ask for—and stops.</text>
  <text x="72" y="485" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1F5B86">It does not tell you how the sauce is made,</text>
  <text x="72" y="507" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1F5B86">and you would not want it to.</text>
  <text x="72" y="545" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#1F5B86">Short. Public. Everyone reads it.</text>

  <rect x="562" y="100" width="498" height="469" rx="12" fill="#EDF3EE" stroke="#37955F" stroke-width="2"/>
  <rect x="562" y="100" width="498" height="44" rx="12" fill="#2E6B46"/>
  <rect x="562" y="132" width="498" height="12" fill="#2E6B46"/>
  <text x="585" y="131" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">THE KITCHEN — RobotMotion.cpp</text>

  <rect x="594" y="173" width="434" height="219" rx="6" fill="#1E1E1E"/>
  <text x="613" y="200" font-family="Courier New, monospace" font-size="16" fill="#F4E4B3">void driveDistance(float cm) {</text>
  <text x="631" y="224" font-family="Courier New, monospace" font-size="16" fill="#9CDCFE">long target = cm * COUNTS_PER_CM;</text>
  <text x="631" y="248" font-family="Courier New, monospace" font-size="16" fill="#9CDCFE">encoders.getCountsLeft();</text>
  <text x="631" y="284" font-family="Courier New, monospace" font-size="16" fill="#C586C0">while (...) {</text>
  <text x="649" y="308" font-family="Courier New, monospace" font-size="16" fill="#9CDCFE">motors.setSpeeds(s + TRIM, s);</text>
  <text x="631" y="332" font-family="Courier New, monospace" font-size="16" fill="#C586C0">}</text>
  <text x="613" y="356" font-family="Courier New, monospace" font-size="16" fill="#F4E4B3">}</text>
  <text x="862" y="376" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#82B366">heat, noise, and a lot of shouting</text>

  <text x="594" y="428" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#264A33">The kitchen is where the work happens.</text>
  <text x="594" y="450" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#264A33">It is long, messy, and it changes often.</text>
  <text x="594" y="485" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#264A33">Rewrite the recipe tomorrow and the menu</text>
  <text x="594" y="507" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#264A33">stays exactly the same. Nobody has to know.</text>
  <text x="594" y="545" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#264A33">Long. Private. Only the cook reads it.</text>

  <rect x="40" y="596" width="1020" height="217" rx="12" fill="#F3E8FA" stroke="#B12AE0" stroke-width="2"/>
  <rect x="40" y="596" width="1020" height="42" rx="12" fill="#7C5689"/>
  <rect x="40" y="626" width="1020" height="12" fill="#7C5689"/>
  <text x="64" y="626" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">WHY SPLIT THEM AT ALL?</text>
  <text x="63" y="674" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5F326A">When main.cpp calls driveDistance(30), it needs to know ONE thing: that the function exists and takes a number.</text>
  <text x="63" y="708" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5F326A">It does not need the loop, the counts, or the TRIM. Handing it the whole kitchen would only give it more to break.</text>
  <text x="63" y="748" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#6B238A">So main.cpp includes the MENU (.h). The compiler reads the KITCHEN (.cpp) separately, once.</text>
  <text x="63" y="786" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#7D5690">Every “undefined reference” error you will ever see is this split, gone wrong: a menu with no kitchen behind it.</text>
</svg>