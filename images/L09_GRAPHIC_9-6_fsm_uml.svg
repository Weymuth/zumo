<svg viewBox="0 0 1100 850" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
<defs>
<linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#1a5276"/><stop offset="1" stop-color="#2e86ab"/>
</linearGradient>
</defs>
<rect x="0" y="0" width="1100" height="850" fill="#fafafa"/>
<rect x="20" y="20" width="1060" height="72" rx="10" fill="url(#band)"/>
<text x="550" y="58" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="bold">The Same Machine, Formal Notation</text>
<text x="550" y="84" text-anchor="middle" fill="#d6eaf8" font-size="17">UML statechart: states, internal activity, guarded transitions</text>
<circle cx="160" cy="150" r="13" fill="#111111"/>
<polygon points="157.0,163.0 157.0,190.6 148.6,190.6 160.0,205.0 171.4,190.6 163.0,190.6 163.0,163.0" fill="#111111"/>
<rect x="60" y="210" width="420" height="150" rx="18" fill="#fffef5" stroke="#333333" stroke-width="2.5"/>
<line x1="60" y1="254" x2="480" y2="254" stroke="#333333" stroke-width="2"/>
<text x="270.0" y="240" font-family="Courier New, monospace" font-size="20" fill="#1a5276" font-weight="bold" text-anchor="middle" textLength="84" lengthAdjust="spacingAndGlyphs">STOPPED</text>
<text x="82" y="284" font-family="Courier New, monospace" font-size="15.5" fill="#444444" font-weight="normal" text-anchor="start" textLength="155" lengthAdjust="spacingAndGlyphs">do: checkBattery()</text>
<text x="82" y="310" font-family="Courier New, monospace" font-size="15.5" fill="#444444" font-weight="normal" text-anchor="start" textLength="163" lengthAdjust="spacingAndGlyphs">do: tune Kp (A / C)</text>
<rect x="60" y="420" width="420" height="150" rx="18" fill="#fffef5" stroke="#333333" stroke-width="2.5"/>
<line x1="60" y1="464" x2="480" y2="464" stroke="#333333" stroke-width="2"/>
<text x="270.0" y="450" font-family="Courier New, monospace" font-size="20" fill="#1a5276" font-weight="bold" text-anchor="middle" textLength="168" lengthAdjust="spacingAndGlyphs">FOLLOWING_LINE</text>
<text x="82" y="494" font-family="Courier New, monospace" font-size="15.5" fill="#444444" font-weight="normal" text-anchor="start" textLength="138" lengthAdjust="spacingAndGlyphs">do: followLine()</text>
<text x="82" y="520" font-family="Courier New, monospace" font-size="15.5" fill="#444444" font-weight="normal" text-anchor="start" textLength="224" lengthAdjust="spacingAndGlyphs">do: checkForIntersection()</text>
<rect x="620" y="420" width="420" height="150" rx="18" fill="#fffef5" stroke="#333333" stroke-width="2.5"/>
<line x1="620" y1="464" x2="1040" y2="464" stroke="#333333" stroke-width="2"/>
<text x="830.0" y="450" font-family="Courier New, monospace" font-size="20" fill="#1a5276" font-weight="bold" text-anchor="middle" textLength="180" lengthAdjust="spacingAndGlyphs">AT_INTERSECTION</text>
<text x="642" y="494" font-family="Courier New, monospace" font-size="15.5" fill="#444444" font-weight="normal" text-anchor="start" textLength="232" lengthAdjust="spacingAndGlyphs">entry: showDecision(), beep</text>
<text x="642" y="520" font-family="Courier New, monospace" font-size="15.5" fill="#444444" font-weight="normal" text-anchor="start" textLength="129" lengthAdjust="spacingAndGlyphs">do: wait 600 ms</text>
<rect x="620" y="210" width="420" height="150" rx="18" fill="#fffef5" stroke="#333333" stroke-width="2.5"/>
<line x1="620" y1="254" x2="1040" y2="254" stroke="#333333" stroke-width="2"/>
<text x="830.0" y="240" font-family="Courier New, monospace" font-size="20" fill="#1a5276" font-weight="bold" text-anchor="middle" textLength="168" lengthAdjust="spacingAndGlyphs">EXECUTING_TURN</text>
<text x="642" y="284" font-family="Courier New, monospace" font-size="15.5" fill="#444444" font-weight="normal" text-anchor="start" textLength="232" lengthAdjust="spacingAndGlyphs">do: turnLeft/Right/Around()</text>
<text x="642" y="310" font-family="Courier New, monospace" font-size="15.5" fill="#444444" font-weight="normal" text-anchor="start" textLength="301" lengthAdjust="spacingAndGlyphs">exit: pendingTurn = NO_INTERSECTION</text>
<polygon points="197.0,360.0 197.0,405.6 188.6,405.6 200.0,420.0 211.4,405.6 203.0,405.6 203.0,360.0" fill="#3a7d5c"/>
<text x="214" y="396" text-anchor="start" font-family="Courier New, monospace" font-size="15" font-weight="bold" fill="#3a7d5c">B / countdown</text>
<polygon points="363.0,420.0 363.0,374.4 371.4,374.4 360.0,360.0 348.6,374.4 357.0,374.4 357.0,420.0" fill="#c45d76"/>
<text x="374" y="396" text-anchor="start" font-family="Courier New, monospace" font-size="15" font-weight="bold" fill="#c45d76">B / stop  &#183;  gapTimeout / stop</text>
<polygon points="480.0,498.0 605.6,498.0 605.6,506.4 620.0,495.0 605.6,483.6 605.6,492.0 480.0,492.0" fill="#3498db"/>
<text x="550" y="478" text-anchor="middle" font-family="Courier New, monospace" font-size="15" font-weight="bold" fill="#3498db">marker / stop motors</text>
<polygon points="833.0,420.0 833.0,374.4 841.4,374.4 830.0,360.0 818.6,374.4 827.0,374.4 827.0,420.0" fill="#9b6a9e"/>
<text x="844" y="396" text-anchor="start" font-family="Courier New, monospace" font-size="15" font-weight="bold" fill="#9b6a9e">after(600 ms)</text>
<polygon points="617.9,297.9 488.1,427.7 482.1,421.8 480.0,440.0 498.2,437.9 492.3,431.9 622.1,302.1" fill="#3a7d5c"/>
<text x="505" y="350" text-anchor="middle" font-family="Courier New, monospace" font-size="15" font-weight="bold" fill="#3a7d5c">turn done</text>
<rect x="90" y="640" width="920" height="130" rx="12" fill="#ffffff" stroke="#1a5276" stroke-width="2.5"/>
<text x="120" y="680" font-size="17" fill="#333333"><tspan font-weight="bold">entry:</tspan> runs once when the state is entered &#160;&#183;&#160; <tspan font-weight="bold">do:</tspan> runs while in the state &#160;&#183;&#160; <tspan font-weight="bold">exit:</tspan> runs once on the way out</text>
<text x="120" y="712" font-size="17" fill="#333333">Transition labels read <tspan font-family="Courier New, monospace" font-weight="bold">trigger / action</tspan> &#8212; the trigger fires it, the action happens during the hop.</text>
<text x="120" y="744" font-size="17" fill="#333333">The filled dot is the initial state: the robot boots into <tspan font-family="Courier New, monospace" font-weight="bold">STOPPED</tspan>. Compare with GRAPHIC 9.4 &#8212; same machine, two notations.</text>
</svg>
