<svg viewBox="0 0 860 430" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="1" y="1" width="858" height="428" rx="10" fill="#ffffff" stroke="#d5dde3" stroke-width="2"/>

  <text x="430" y="38" font-size="20" font-weight="bold" fill="#1a5276" text-anchor="middle">How Much Working Memory (RAM)?</text>
  <text x="430" y="60" font-size="13.5" font-style="italic" fill="#4a5a66" text-anchor="middle">Log scale — every gridline step is 10 times MORE memory</text>

  <!-- gridlines: log10 = 0..5 mapped to x = 230 + 110*log10 -->
  <g stroke="#e3e9ee" stroke-width="1">
    <line x1="230" y1="80" x2="230" y2="330"/>
    <line x1="340" y1="80" x2="340" y2="330"/>
    <line x1="450" y1="80" x2="450" y2="330"/>
    <line x1="560" y1="80" x2="560" y2="330"/>
    <line x1="670" y1="80" x2="670" y2="330"/>
    <line x1="780" y1="80" x2="780" y2="330"/>
  </g>
  <g font-size="11.5" fill="#8a97a0" text-anchor="middle">
    <text x="230" y="348">1 KB</text>
    <text x="340" y="348">10 KB</text>
    <text x="450" y="348">100 KB</text>
    <text x="560" y="348">1,000 KB</text>
    <text x="670" y="348">10,000 KB</text>
    <text x="780" y="348">100,000 KB</text>
  </g>

  <!-- bars: width = 110 * log10(KB), from x=230 -->
  <!-- Zumo 2.5 KB -> 43.8 | Apollo 4 -> 66.2 | Game Boy 8 -> 99.3 | C64 64 -> 198.7 | iPhone 131072 -> 563 -->
  <g font-size="14" font-weight="bold" text-anchor="end">
    <text x="220" y="106" fill="#2a5a42">YOUR ZUMO (2026)</text>
    <text x="220" y="156" fill="#333333">Apollo Moon computer (1969)</text>
    <text x="220" y="206" fill="#333333">Nintendo Game Boy (1989)</text>
    <text x="220" y="256" fill="#333333">Commodore 64 (1982)</text>
    <text x="220" y="306" fill="#333333">First iPhone (2007)</text>
  </g>

  <rect x="230" y="90"  width="44"  height="24" rx="4" fill="#3a7d5c"/>
  <rect x="230" y="140" width="66"  height="24" rx="4" fill="#5b7fa6"/>
  <rect x="230" y="190" width="99"  height="24" rx="4" fill="#5b7fa6"/>
  <rect x="230" y="240" width="199" height="24" rx="4" fill="#5b7fa6"/>
  <rect x="230" y="290" width="563" height="24" rx="4" fill="#5b7fa6"/>

  <g font-size="13" font-weight="bold">
    <text x="282" y="107" fill="#2a5a42">2.5 KB</text>
    <text x="304" y="157" fill="#4a5a66">4 KB</text>
    <text x="337" y="207" fill="#4a5a66">8 KB</text>
    <text x="437" y="257" fill="#4a5a66">64 KB</text>
    <text x="595" y="285" fill="#4a5a66">128 MB (131,072 KB)</text>
  </g>

  <text x="430" y="382" font-size="14.5" font-weight="bold" fill="#1a5276" text-anchor="middle">The computer that landed people on the Moon had barely more</text>
  <text x="430" y="402" font-size="14.5" font-weight="bold" fill="#1a5276" text-anchor="middle">working memory than your robot. Every byte counts.</text>
</svg>
