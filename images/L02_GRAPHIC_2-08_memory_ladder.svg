<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1774" height="887" viewBox="0 0 1774 887"
     role="img" aria-labelledby="title desc">
  <title id="title">How Much Working Memory (RAM)?</title>
  <desc id="desc">A logarithmic bar chart comparing the Zumo robot's 2.5 KB of working memory with the Apollo Guidance Computer, Nintendo Game Boy, Commodore 64, and first iPhone.</desc>

  <defs>
    <linearGradient id="pageGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FCFBF8"/>
    </linearGradient>
    <linearGradient id="barBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#405A73"/>
      <stop offset="1" stop-color="#334B63"/>
    </linearGradient>
    <linearGradient id="barGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B88427"/>
      <stop offset="1" stop-color="#C99A43"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0B1A2E" flood-opacity="0.10"/>
    </filter>
    <style>
      .inter { font-family: Arial, Helvetica, sans-serif; font-feature-settings: "cv05" 1; }
      .navy { fill: #0B1A2E; }
      .slate { fill: #3D5266; }
      .gold { fill: #B9862F; }
    </style>
  </defs>

  <!-- Page and border -->
  <rect x="8" y="7" width="1758" height="873" rx="24"
        fill="url(#pageGlow)" stroke="#0B1A2E" stroke-width="4"/>

  <!-- Title -->
  <text x="887" y="95" text-anchor="middle"
        class="inter navy" font-size="62" font-weight="800">
    How Much Working Memory (RAM)?
  </text>
  <text x="887" y="150" text-anchor="middle"
        class="inter slate" font-size="31" font-style="italic" font-weight="500">
    Log scale — every gridline step is 10 times MORE memory
  </text>

  <!-- Plot grid -->
  <g stroke="#BCC5CE" stroke-width="1.5" stroke-dasharray="4 5">
    <line x1="466" y1="181" x2="466" y2="623"/>
    <line x1="716" y1="181" x2="716" y2="623"/>
    <line x1="934" y1="181" x2="934" y2="623"/>
    <line x1="1149" y1="181" x2="1149" y2="623"/>
    <line x1="1364" y1="181" x2="1364" y2="623"/>
    <line x1="1576" y1="181" x2="1576" y2="623"/>
  </g>

  <!-- Axes -->
  <line x1="466" y1="181" x2="466" y2="623" stroke="#324C67" stroke-width="1.5"/>
  <line x1="466" y1="623" x2="1662" y2="623" stroke="#324C67" stroke-width="1.5"/>

  <!-- Category labels -->
  <g class="inter navy" text-anchor="end" font-size="29" font-weight="700">
    <text x="438" y="232" fill="#B9862F">YOUR ZUMO (2026)</text>
    <text x="438" y="319">Apollo Moon computer (1969)</text>
    <text x="438" y="405">Nintendo Game Boy (1989)</text>
    <text x="438" y="491">Commodore 64 (1982)</text>
    <text x="438" y="578">First iPhone (2007)</text>
  </g>

  <!-- Bars -->
  <g filter="url(#softShadow)">
    <rect x="466" y="202" width="108" height="41" rx="7" fill="url(#barGold)"/>
    <rect x="466" y="289" width="157" height="39" rx="7" fill="url(#barBlue)"/>
    <rect x="466" y="375" width="230" height="40" rx="7" fill="url(#barBlue)"/>
    <rect x="466" y="462" width="430" height="40" rx="7" fill="url(#barBlue)"/>
    <rect x="466" y="550" width="1142" height="40" rx="7" fill="url(#barBlue)"/>
  </g>

  <!-- Bar values -->
  <g class="inter slate" font-size="28" font-weight="700">
    <text x="594" y="232" fill="#B9862F">2.5 KB</text>
    <text x="638" y="319">4 KB</text>
    <text x="712" y="405">8 KB</text>
    <text x="912" y="491">64 KB</text>
    <text x="1573" y="533" text-anchor="end">128 MB (131,072 KB)</text>
  </g>

  <!-- X-axis labels -->
  <g class="inter navy" font-size="25" font-weight="500" text-anchor="middle">
    <text x="466" y="664">1 KB</text>
    <text x="716" y="664">10 KB</text>
    <text x="934" y="664">100 KB</text>
    <text x="1149" y="664">1,000 KB</text>
    <text x="1364" y="664">10,000 KB</text>
    <text x="1576" y="664">100,000 KB</text>
  </g>

  <!-- Bottom takeaway -->
  <rect x="242" y="694" width="1262" height="124" rx="18"
        fill="#FFFEFB" stroke="#C89538" stroke-width="2.2"/>
  <text x="873" y="746" text-anchor="middle"
        class="inter navy" font-size="33" font-weight="800">
    The computer that landed people on the Moon had barely more
  </text>
  <text x="873" y="790" text-anchor="middle"
        class="inter navy" font-size="33" font-weight="800">
    working memory than your robot. Every byte counts.
  </text>
</svg>
