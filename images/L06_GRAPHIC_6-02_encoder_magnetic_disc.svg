<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="titleBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a5276"/>
      <stop offset="100%" stop-color="#2e86ab"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef2f5"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1100" height="850" fill="#ffffff"/>
  <rect x="0" y="0" width="1100" height="72" fill="url(#titleBand)"/>
  <text x="34" y="46" font-size="27" font-weight="bold" fill="#ffffff">GRAPHIC 6.2 &#8212; How an Encoder Counts</text>
  <text x="1066" y="46" font-size="17" fill="#d6e9f2" text-anchor="end">Lesson 6 &#183; &#167;3</text>

  <rect x="40" y="100" width="620" height="450" rx="10" fill="url(#panelGrad)" stroke="#c8d2da" stroke-width="2"/>
  <text x="60" y="132" font-size="16" font-weight="bold" fill="#1a5276">Inside the motor, on the back of the shaft</text>

  <line x1="200" y1="330" x2="350" y2="330" stroke="#5d6d7e" stroke-width="14"/>
  <text x="180" y="308" font-size="13" fill="#5d6d7e" text-anchor="middle">motor shaft</text>

  <circle cx="410" cy="330" r="98" fill="#eef2f5" stroke="#34495e" stroke-width="4"/>
  <circle cx="410" cy="330" r="14" fill="#34495e"/>
  <path d="M 410 232 A 98 98 0 0 1 479 261 L 410 330 Z" fill="#c0392b" opacity="0.85"/>
  <path d="M 479 261 A 98 98 0 0 1 508 330 L 410 330 Z" fill="#2c3e50" opacity="0.85"/>
  <path d="M 508 330 A 98 98 0 0 1 479 399 L 410 330 Z" fill="#c0392b" opacity="0.85"/>
  <path d="M 479 399 A 98 98 0 0 1 410 428 L 410 330 Z" fill="#2c3e50" opacity="0.85"/>
  <path d="M 410 428 A 98 98 0 0 1 341 399 L 410 330 Z" fill="#c0392b" opacity="0.85"/>
  <path d="M 341 399 A 98 98 0 0 1 312 330 L 410 330 Z" fill="#2c3e50" opacity="0.85"/>
  <path d="M 312 330 A 98 98 0 0 1 341 261 L 410 330 Z" fill="#c0392b" opacity="0.85"/>
  <path d="M 341 261 A 98 98 0 0 1 410 232 L 410 330 Z" fill="#2c3e50" opacity="0.85"/>
  <text x="410" y="456" font-size="14" font-weight="bold" fill="#34495e" text-anchor="middle">magnetic disc &#8212; N / S poles</text>
  <text x="410" y="476" font-size="12" fill="#7a8a96" text-anchor="middle">glued to the shaft. it spins with the motor.</text>

  <rect x="548" y="288" width="66" height="34" rx="4" fill="#3498db" stroke="#21618c" stroke-width="3"/>
  <text x="581" y="310" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">HALL A</text>
  <rect x="548" y="338" width="66" height="34" rx="4" fill="#3498db" stroke="#21618c" stroke-width="3"/>
  <text x="581" y="360" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">HALL B</text>
  <text x="581" y="398" font-size="12" fill="#21618c" text-anchor="middle">two sensors,</text>
  <text x="581" y="414" font-size="12" fill="#21618c" text-anchor="middle">bolted DOWN.</text>
  <text x="581" y="430" font-size="12" fill="#21618c" text-anchor="middle">they never move.</text>

  <polygon points="516,300 540,300 540,294 552,305 540,316 540,310 516,310" fill="#3498db" stroke="#21618c" stroke-width="1"/>
  <polygon points="516,350 540,350 540,344 552,355 540,366 540,360 516,360" fill="#3498db" stroke="#21618c" stroke-width="1"/>

  <rect x="700" y="100" width="360" height="450" rx="10" fill="#eaf4fb" stroke="#3498db" stroke-width="2"/>
  <rect x="700" y="100" width="360" height="40" rx="10" fill="#1a5276"/>
  <rect x="700" y="128" width="360" height="12" fill="#1a5276"/>
  <text x="724" y="128" font-size="16" font-weight="bold" fill="#ffffff">THE WHOLE TRICK</text>
  <text x="724" y="176" font-size="14" fill="#123c66">A magnet goes past. The Hall sensor</text>
  <text x="724" y="196" font-size="14" fill="#123c66">notices, and flips its output.</text>
  <text x="724" y="228" font-size="14" fill="#123c66">That flip is a COUNT.</text>
  <text x="724" y="262" font-size="14" fill="#123c66">The sensor does not know how far</text>
  <text x="724" y="282" font-size="14" fill="#123c66">the wheel went. It does not know</text>
  <text x="724" y="302" font-size="14" fill="#123c66">what a centimetre is.</text>
  <text x="724" y="336" font-size="14" font-weight="bold" fill="#0d47a1">It can only say: &#8220;another one.&#8221;</text>
  <text x="724" y="370" font-size="14" fill="#123c66">Turning &#8220;another one&#8221; into</text>
  <text x="724" y="390" font-size="14" fill="#123c66">centimetres is arithmetic, and</text>
  <text x="724" y="410" font-size="14" fill="#123c66">that arithmetic is this lesson.</text>
  <rect x="724" y="440" width="312" height="80" rx="5" fill="#ffffff" stroke="#3498db" stroke-width="2"/>
  <text x="880" y="466" font-size="13" font-weight="bold" fill="#1a5276" text-anchor="middle">12 counts</text>
  <text x="880" y="488" font-size="12" fill="#123c66" text-anchor="middle">per turn of the MOTOR SHAFT</text>
  <text x="880" y="508" font-size="12" font-style="italic" fill="#7a8a96" text-anchor="middle">(not the wheel &#8212; see 6.4)</text>

  <rect x="40" y="576" width="1020" height="236" rx="10" fill="#eaf4fb" stroke="#3498db" stroke-width="2"/>
  <rect x="40" y="576" width="1020" height="42" rx="10" fill="#1a5276"/>
  <rect x="40" y="604" width="1020" height="14" fill="#1a5276"/>
  <text x="64" y="605" font-size="17" font-weight="bold" fill="#ffffff">WHY NOT JUST TIME IT?</text>
  <text x="64" y="650" font-size="14" fill="#123c66">You already drove with delay(). It worked &#8212; on one floor, with one battery, on one day.</text>
  <text x="64" y="678" font-size="14" fill="#123c66">A fresh battery drives further in 500 ms than a tired one. Carpet drags; tile slips. delay() cannot tell.</text>
  <text x="64" y="712" font-size="14" font-weight="bold" fill="#0d47a1">The encoder does not measure TIME. It measures TURNING.</text>
  <text x="64" y="740" font-size="14" fill="#123c66">A tired battery turns the wheel slower &#8212; but the same number of counts is still the same distance.</text>
  <text x="64" y="774" font-size="14" font-style="italic" fill="#4a6b58">This is the difference between hoping you went 30 cm and knowing you did.</text>
</svg>
