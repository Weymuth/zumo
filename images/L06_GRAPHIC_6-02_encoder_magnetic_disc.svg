<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">How an Encoder Counts</title>
  <desc id="desc">A RoboLore instructional graphic showing a magnetic encoder disc spinning with a motor shaft while two fixed Hall sensors count changes in magnetic polarity.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0B1A2E" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#007ACC"/>
    </marker>
    <style>
      .title { font-family: Inter, Arial, sans-serif; font-size: 34px; font-weight: 800; fill: #0B1A2E; }
      .meta { font-family: Inter, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #3D5266; }
      .section { font-family: Inter, Arial, sans-serif; font-size: 15px; font-weight: 800; letter-spacing: 0.9px; fill: #3D5266; }
      .head { font-family: Inter, Arial, sans-serif; font-size: 21px; font-weight: 800; fill: #0B1A2E; }
      .body { font-family: Inter, Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #1E1E1E; }
      .bodySmall { font-family: Inter, Arial, sans-serif; font-size: 13px; font-weight: 500; fill: #3D5266; }
      .label { font-family: Inter, Arial, sans-serif; font-size: 13px; font-weight: 800; fill: #0B1A2E; }
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; font-variant-ligatures: none; }
    </style>
  </defs>

  <rect width="1100" height="850" fill="#FFFFFF"/>

  <!-- Page title -->
  <text x="40" y="48" class="title">How an Encoder Counts</text>
  <text x="1060" y="48" text-anchor="end" class="meta">GRAPHIC 6.2 · Lesson 6 · §3</text>
  <line x1="40" y1="70" x2="1060" y2="70" stroke="#C9A463" stroke-width="2.5"/>

  <!-- Left card: mechanism -->
  <rect x="40" y="96" width="612" height="430" rx="16" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2" filter="url(#shadow)"/>
  <text x="64" y="128" class="section">INSIDE THE MOTOR — ON THE BACK OF THE SHAFT</text>
  <text x="64" y="157" class="body">The magnetic disc spins with the motor. The Hall sensors stay fixed.</text>

  <!-- Motor shaft -->
  <line x1="126" y1="320" x2="292" y2="320" stroke="#5E6973" stroke-width="16" stroke-linecap="round"/>
  <circle cx="126" cy="320" r="18" fill="#D9DEE3" stroke="#7B8791" stroke-width="3"/>
  <text x="186" y="291" class="label" text-anchor="middle">motor shaft</text>

  <!-- Magnetic disc -->
  <g transform="translate(366 320)">
    <circle r="104" fill="#F5F6F7" stroke="#0B1A2E" stroke-width="4"/>
    <path d="M0,-104 A104,104 0 0 1 73.54,-73.54 L0,0 Z" fill="#F44747" opacity="0.90"/>
    <path d="M73.54,-73.54 A104,104 0 0 1 104,0 L0,0 Z" fill="#007ACC" opacity="0.90"/>
    <path d="M104,0 A104,104 0 0 1 73.54,73.54 L0,0 Z" fill="#F44747" opacity="0.90"/>
    <path d="M73.54,73.54 A104,104 0 0 1 0,104 L0,0 Z" fill="#007ACC" opacity="0.90"/>
    <path d="M0,104 A104,104 0 0 1 -73.54,73.54 L0,0 Z" fill="#F44747" opacity="0.90"/>
    <path d="M-73.54,73.54 A104,104 0 0 1 -104,0 L0,0 Z" fill="#007ACC" opacity="0.90"/>
    <path d="M-104,0 A104,104 0 0 1 -73.54,-73.54 L0,0 Z" fill="#F44747" opacity="0.90"/>
    <path d="M-73.54,-73.54 A104,104 0 0 1 0,-104 L0,0 Z" fill="#007ACC" opacity="0.90"/>
    <circle r="18" fill="#D9DEE3" stroke="#5E6973" stroke-width="3"/>
    <circle r="7" fill="#5E6973"/>
    <text x="0" y="8" text-anchor="middle" class="label" style="fill:#FFFFFF;font-size:15px;">N / S</text>
  </g>
  <text x="366" y="452" class="label" text-anchor="middle">magnetic disc — alternating north / south poles</text>
  <text x="366" y="474" class="bodySmall" text-anchor="middle">glued to the shaft, so it turns with the motor</text>

  <!-- Hall sensors -->
  <line x1="480" y1="284" x2="535" y2="284" stroke="#007ACC" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <line x1="480" y1="358" x2="535" y2="358" stroke="#007ACC" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <rect x="542" y="264" width="82" height="42" rx="7" fill="#007ACC" stroke="#005A9E" stroke-width="2"/>
  <text x="583" y="291" text-anchor="middle" class="label" style="fill:#FFFFFF;">HALL A</text>
  <rect x="542" y="338" width="82" height="42" rx="7" fill="#007ACC" stroke="#005A9E" stroke-width="2"/>
  <text x="583" y="365" text-anchor="middle" class="label" style="fill:#FFFFFF;">HALL B</text>
  <text x="583" y="405" text-anchor="middle" class="bodySmall" style="font-weight:700;">two fixed sensors</text>
  <text x="583" y="425" text-anchor="middle" class="bodySmall">they do not move</text>

  <rect x="70" y="489" width="552" height="22" rx="6" fill="#F3F3F3"/>
  <text x="346" y="505" text-anchor="middle" class="bodySmall">
    The disc moves past the sensors; the sensors report each magnetic change.
  </text>

  <!-- Right card: whole trick -->
  <rect x="678" y="96" width="382" height="430" rx="16" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2" filter="url(#shadow)"/>
  <text x="702" y="128" class="section">THE WHOLE TRICK</text>

  <text x="702" y="164" class="body">A magnetic pole passes a Hall sensor.</text>
  <text x="702" y="187" class="body">The sensor notices and flips its output.</text>

  <rect x="702" y="210" width="334" height="54" rx="9" fill="#EAF5FF" stroke="#007ACC" stroke-width="2"/>
  <text x="869" y="233" text-anchor="middle" class="head" style="font-size:18px;fill:#007ACC;">That flip is one COUNT.</text>
  <text x="869" y="253" text-anchor="middle" class="bodySmall">The encoder can only say: “another one.”</text>

  <text x="702" y="294" class="body">The sensor does not know how far the</text>
  <text x="702" y="317" class="body">wheel travelled. It does not know what</text>
  <text x="702" y="340" class="body">a centimetre is.</text>

  <text x="702" y="374" class="body">Turning “another one” into centimetres</text>
  <text x="702" y="397" class="body">is arithmetic — and that arithmetic is</text>
  <text x="702" y="420" class="body">the work of this lesson.</text>

  <rect x="702" y="444" width="334" height="58" rx="9" fill="#1E1E1E" stroke="#3C3C3C" stroke-width="2"/>
  <text x="869" y="470" text-anchor="middle" class="mono" font-size="17" font-weight="700" fill="#DCDCAA">12 counts</text>
  <text x="869" y="491" text-anchor="middle" class="mono" font-size="12.5" fill="#D4D4D4">per turn of the MOTOR SHAFT</text>
  <text x="869" y="516" text-anchor="middle" class="bodySmall" style="font-style:italic;">not the wheel — see Graphic 6.4</text>

  <!-- Bottom card: why not time it -->
  <rect x="40" y="550" width="1020" height="260" rx="16" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2" filter="url(#shadow)"/>
  <text x="64" y="584" class="section">WHY NOT JUST TIME IT?</text>
  <text x="64" y="615" class="body">You already drove with <tspan class="mono">delay()</tspan>. It worked — on one floor, with one battery, on one day.</text>
  <text x="64" y="642" class="body">A fresh battery drives farther in 500 ms than a tired one. Carpet drags; tile slips. <tspan class="mono">delay()</tspan> cannot tell.</text>

  <rect x="64" y="670" width="972" height="52" rx="9" fill="#EAF5FF" stroke="#007ACC" stroke-width="2"/>
  <text x="550" y="702" text-anchor="middle" class="head" style="font-size:18px;fill:#007ACC;">The encoder does not measure TIME. It measures TURNING.</text>

  <text x="64" y="752" class="body">A tired battery turns the wheel more slowly — but the same number of counts still represents the same distance.</text>

  <rect x="64" y="772" width="972" height="22" rx="6" fill="#F2F7EF"/>
  <text x="550" y="788" text-anchor="middle" class="bodySmall" style="font-style:italic;font-weight:700;fill:#4F7A42;">
    This is the difference between hoping you went 30 cm and knowing you did.
  </text>
</svg>
