<rect x="720" y="380" width="330" height="46" rx="12" fill="#1a5276"/>
<text x="885" y="410" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="bold">What the markers say</text>
<circle cx="752" cy="458" r="16" fill="#1a5276"/>
<text x="752" y="464" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">1</text>
<text x="780" y="458" font-size="17" font-weight="bold" fill="#333333">Green on the LEFT</text>
<text x="780" y="482" font-size="15" fill="#555555">GO_LEFT — take the left branch</text>
<circle cx="752" cy="532" r="16" fill="#1a5276"/>
<text x="752" y="538" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">2</text>
<text x="780" y="532" font-size="17" font-weight="bold" fill="#333333">Green on the RIGHT</text>
<text x="780" y="556" font-size="15" fill="#555555">GO_RIGHT — take the right branch</text>
<circle cx="752" cy="606" r="16" fill="#1a5276"/>
<text x="752" y="612" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">3</text>
<text x="780" y="606" font-size="17" font-weight="bold" fill="#333333">Green on BOTH sides</text>
<text x="780" y="630" font-size="15" fill="#555555">DEAD_END — turn around (180°)</text>
<text x="740" y="688" font-size="14" fill="#777777" font-style="italic">Unmarked crossings: drive straight through.</text>
