<rect x="516" y="690" width="68" height="52" rx="8" fill="#37474f"/>
<rect x="510" y="688" width="10" height="56" rx="4" fill="#111111"/>
<rect x="580" y="688" width="10" height="56" rx="4" fill="#111111"/>
<polygon points="524,690 576,690 566,676 534,676" fill="#78909c"/>
</g>
<text x="620" y="726" font-size="17" fill="#37474f" font-weight="bold">START</text>
<circle cx="478" cy="572" r="16" fill="#1a5276"/>
<text x="478" y="578" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">1</text>
<circle cx="378" cy="352" r="16" fill="#1a5276"/>
<text x="378" y="358" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">2</text>
<circle cx="700" cy="227" r="16" fill="#1a5276"/>
<text x="700" y="233" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">3</text>
