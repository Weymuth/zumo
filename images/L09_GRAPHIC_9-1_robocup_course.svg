<text x="550" y="58" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="bold">The RoboCup Line Course</text>
<text x="550" y="84" text-anchor="middle" fill="#d6eaf8" font-size="17">Black line, green markers — the marker says what to do</text>
