<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">readLine() Position — Five Sensors, Scale 0–4000</title>
  <desc id="desc">A number line maps physical sensors 1 through 5 to array elements 0 through 4 and home values 0 through 4000. A returned value of 2323 is shown slightly right of center.</desc>

  <defs>
    <marker id="axisArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#3C3C3C"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0B1A2E" flood-opacity="0.10"/>
    </filter>
    <style>
      .inter {
        font-family: Inter, Arial, sans-serif;
        font-feature-settings: "cv05" 1;
      }
      .mono {
        font-family: "JetBrains Mono", "Courier New", monospace;
        font-variant-ligatures: none;
      }
    </style>
  </defs>

  <!-- Neutral canvas -->
  <rect width="960" height="360" fill="#FFFFFF"/>

  <!-- Title / brand layer -->
  <text x="338" y="37" text-anchor="end" class="mono" font-size="24" font-weight="800" fill="#007ACC">readLine()</text>
  <text x="348" y="37" text-anchor="start" class="inter" font-size="24" font-weight="800" fill="#0B1A2E">Position — Five Sensors, Scale 0–4000</text>
  <line x1="54" y1="54" x2="906" y2="54" stroke="#C9A463" stroke-width="2"/>

  <text x="480" y="77" text-anchor="middle" class="inter" font-size="12.5" font-weight="500" fill="#3D5266">sensor (physical)  ·  [array box]  ·  each sensor’s home value on the scale</text>

  <!-- Sensor labels -->
  <g class="inter" text-anchor="middle">
    <g transform="translate(110 0)">
      <rect x="-23" y="91" width="46" height="32" rx="6" fill="#F3F3F3" stroke="#D4D4D4" stroke-width="1.5" filter="url(#softShadow)"/>
      <text y="113" font-size="15" font-weight="800" fill="#1E1E1E">1</text>
      <text y="145" class="mono" font-size="13" font-weight="700" fill="#007ACC">[0]</text>
      <line x1="0" y1="154" x2="0" y2="209" stroke="#9D9D9D" stroke-width="1.5" stroke-dasharray="4 5"/>
    </g>
    <g transform="translate(295 0)">
      <rect x="-23" y="91" width="46" height="32" rx="6" fill="#F3F3F3" stroke="#D4D4D4" stroke-width="1.5" filter="url(#softShadow)"/>
      <text y="113" font-size="15" font-weight="800" fill="#1E1E1E">2</text>
      <text y="145" class="mono" font-size="13" font-weight="700" fill="#007ACC">[1]</text>
      <line x1="0" y1="154" x2="0" y2="209" stroke="#9D9D9D" stroke-width="1.5" stroke-dasharray="4 5"/>
    </g>
    <g transform="translate(480 0)">
      <rect x="-23" y="91" width="46" height="32" rx="6" fill="#F3F3F3" stroke="#D4D4D4" stroke-width="1.5" filter="url(#softShadow)"/>
      <text y="113" font-size="15" font-weight="800" fill="#1E1E1E">3</text>
      <text y="145" class="mono" font-size="13" font-weight="700" fill="#007ACC">[2]</text>
      <line x1="0" y1="154" x2="0" y2="209" stroke="#9D9D9D" stroke-width="1.5" stroke-dasharray="4 5"/>
    </g>
    <g transform="translate(665 0)">
      <rect x="-23" y="91" width="46" height="32" rx="6" fill="#F3F3F3" stroke="#D4D4D4" stroke-width="1.5" filter="url(#softShadow)"/>
      <text y="113" font-size="15" font-weight="800" fill="#1E1E1E">4</text>
      <text y="145" class="mono" font-size="13" font-weight="700" fill="#007ACC">[3]</text>
      <line x1="0" y1="154" x2="0" y2="209" stroke="#9D9D9D" stroke-width="1.5" stroke-dasharray="4 5"/>
    </g>
    <g transform="translate(850 0)">
      <rect x="-23" y="91" width="46" height="32" rx="6" fill="#F3F3F3" stroke="#D4D4D4" stroke-width="1.5" filter="url(#softShadow)"/>
      <text y="113" font-size="15" font-weight="800" fill="#1E1E1E">5</text>
      <text y="145" class="mono" font-size="13" font-weight="700" fill="#007ACC">[4]</text>
      <line x1="0" y1="154" x2="0" y2="209" stroke="#9D9D9D" stroke-width="1.5" stroke-dasharray="4 5"/>
    </g>
  </g>

  <!-- Number line -->
  <line x1="90" y1="220" x2="894" y2="220" stroke="#3C3C3C" stroke-width="3" marker-end="url(#axisArrow)"/>
  <g stroke="#3C3C3C" stroke-width="3">
    <line x1="110" y1="211" x2="110" y2="229"/>
    <line x1="295" y1="211" x2="295" y2="229"/>
    <line x1="480" y1="211" x2="480" y2="229"/>
    <line x1="665" y1="211" x2="665" y2="229"/>
    <line x1="850" y1="211" x2="850" y2="229"/>
  </g>

  <g class="mono" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1E1E">
    <text x="110" y="252">0</text>
    <text x="295" y="252">1000</text>
    <text x="480" y="252">2000</text>
    <text x="665" y="252">3000</text>
    <text x="850" y="252">4000</text>
  </g>

  <g class="inter" text-anchor="middle" font-size="12.5" fill="#3D5266">
    <text x="110" y="274">far left</text>
    <text x="480" y="274" font-weight="700" fill="#1E1E1E">center</text>
    <text x="850" y="274">far right</text>
  </g>

  <!-- Returned value marker -->
  <line x1="539.8" y1="220" x2="539.8" y2="284" stroke="#007ACC" stroke-width="5"/>
  <path d="M539.8 220 L528 238 H551.6 Z" fill="#007ACC"/>

  <g filter="url(#softShadow)">
    <rect x="552" y="280" width="356" height="70" rx="10" fill="#F3F3F3" stroke="#D4D4D4" stroke-width="1.5"/>
    <rect x="552" y="280" width="92" height="70" rx="10" fill="#007ACC"/>
    <rect x="634" y="280" width="10" height="70" fill="#007ACC"/>
  </g>
  <text x="598" y="321" text-anchor="middle" class="mono" font-size="16" font-weight="800" fill="#FFFFFF">2323</text>
  <text x="660" y="302" class="mono" font-size="13.5" font-weight="700" fill="#1E1E1E">readLine() returned</text>
  <text x="660" y="322" class="inter" font-size="11.5" fill="#3D5266">a little right of center —</text>
  <text x="660" y="340" class="inter" font-size="11.5" fill="#3D5266">the Section 3.5 worked example</text>
</svg>
