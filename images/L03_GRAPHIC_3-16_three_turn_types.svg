<svg viewBox="0 0 1100 700" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a5276"/>
      <stop offset="1" stop-color="#2e86ab"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1100" height="700" fill="#ffffff"/>

  <rect x="40" y="24" width="1020" height="52" rx="8" fill="url(#titleGrad)"/>
  <text x="60" y="59" fill="#ffffff" font-size="26" font-weight="bold">THREE TYPES OF TURNS</text>
  <text x="1040" y="57" fill="#d6e9f2" font-size="14" text-anchor="end">Zumo 32U4 Robotics &#183; Lesson 3</text>

  <!-- ============ SPIN ============ -->
  <rect x="60" y="110" width="300" height="470" rx="10" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
  <text x="210" y="146" fill="#1a5276" font-size="20" font-weight="bold" text-anchor="middle">SPIN</text>
  <text x="210" y="168" fill="#6c757d" font-size="13" text-anchor="middle">(Point Turn)</text>
  <rect x="160" y="230" width="100" height="120" rx="6" fill="#3a3a3a"/>
  <polygon points="160,230 260,230 272,212 148,212" fill="#c9cfd6" stroke="#9aa3ad" stroke-width="2"/>
  <rect x="128" y="230" width="30" height="120" fill="#222" stroke="#444"/>
  <rect x="262" y="230" width="30" height="120" fill="#222" stroke="#444"/>
  <path d="M 210 224 A 66 66 0 1 1 209 224" fill="none" stroke="#e8820c" stroke-width="7"/>
  <polygon points="278,290 253,277 258,303" fill="#e8820c"/>
  <rect x="118" y="360" width="50" height="26" rx="4" fill="#3a7d5c"/>
  <text x="143" y="378" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">FWD</text>
  <rect x="252" y="360" width="50" height="26" rx="4" fill="#c45d76"/>
  <text x="277" y="378" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">BACK</text>
  <text x="210" y="440" fill="#212121" font-size="14" font-weight="bold" text-anchor="middle">Wheels oppose</text>
  <text x="210" y="464" fill="#4d5358" font-size="13" text-anchor="middle">Left forward, right back</text>
  <text x="210" y="488" fill="#4d5358" font-size="13" text-anchor="middle">Turns on the spot</text>
  <rect x="90" y="514" width="240" height="46" rx="6" fill="#eef4fa"/>
  <text x="210" y="533" fill="#1a5276" font-size="12" font-weight="bold" text-anchor="middle">Best for:</text>
  <text x="210" y="551" fill="#3d4852" font-size="12" text-anchor="middle">fast 180&#176;, tight spaces</text>

  <!-- ============ PIVOT ============ -->
  <rect x="400" y="110" width="300" height="470" rx="10" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
  <text x="550" y="146" fill="#1a5276" font-size="20" font-weight="bold" text-anchor="middle">PIVOT</text>
  <text x="550" y="168" fill="#6c757d" font-size="13" text-anchor="middle">(corner turn)</text>
  <rect x="500" y="230" width="100" height="120" rx="6" fill="#3a3a3a"/>
  <polygon points="500,230 600,230 612,212 488,212" fill="#c9cfd6" stroke="#9aa3ad" stroke-width="2"/>
  <rect x="468" y="230" width="30" height="120" fill="#222" stroke="#444"/>
  <rect x="602" y="230" width="30" height="120" fill="#222" stroke="#444"/>
  <path d="M 617 356 A 128 128 0 0 1 496 216" fill="none" stroke="#e8820c" stroke-width="7"/>
  <polygon points="496,216 504,239 519,224" fill="#e8820c"/>
  <circle cx="617" cy="290" r="10" fill="#b7950b"/>
  <text x="617" y="295" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">0</text>
  <rect x="458" y="360" width="50" height="26" rx="4" fill="#3a7d5c"/>
  <text x="483" y="378" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">FWD</text>
  <rect x="592" y="360" width="50" height="26" rx="4" fill="#8a8f96"/>
  <text x="617" y="378" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">STOP</text>
  <text x="550" y="440" fill="#212121" font-size="14" font-weight="bold" text-anchor="middle">One wheel stopped</text>
  <text x="550" y="464" fill="#4d5358" font-size="13" text-anchor="middle">Left forward, right at 0</text>
  <text x="550" y="488" fill="#4d5358" font-size="13" text-anchor="middle">Rotates around the stopped wheel</text>
  <rect x="430" y="514" width="240" height="46" rx="6" fill="#eef4fa"/>
  <text x="550" y="533" fill="#1a5276" font-size="12" font-weight="bold" text-anchor="middle">Best for:</text>
  <text x="550" y="551" fill="#3d4852" font-size="12" text-anchor="middle">precise corner turns</text>

  <!-- ============ SWING ============ -->
  <rect x="740" y="110" width="300" height="470" rx="10" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
  <text x="890" y="146" fill="#1a5276" font-size="20" font-weight="bold" text-anchor="middle">SWING</text>
  <text x="890" y="168" fill="#6c757d" font-size="13" text-anchor="middle">(Arc Turn)</text>
  <rect x="840" y="230" width="100" height="120" rx="6" fill="#3a3a3a"/>
  <polygon points="840,230 940,230 952,212 828,212" fill="#c9cfd6" stroke="#9aa3ad" stroke-width="2"/>
  <rect x="808" y="230" width="30" height="120" fill="#222" stroke="#444"/>
  <rect x="942" y="230" width="30" height="120" fill="#222" stroke="#444"/>
  <!-- FAST left / SLOW right -> curves toward SLOW (right): arc up and to the right, head pointing right/down -->
  <path d="M 890 234 Q 992 250 1002 356" fill="none" stroke="#e8820c" stroke-width="7"/>
  <polygon points="1002,360 989,338 1013,342" fill="#e8820c"/>
  <rect x="798" y="360" width="50" height="26" rx="4" fill="#3a7d5c"/>
  <text x="823" y="378" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">FAST</text>
  <rect x="932" y="360" width="50" height="26" rx="4" fill="#7fae95"/>
  <text x="957" y="378" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">SLOW</text>
  <text x="890" y="440" fill="#212121" font-size="14" font-weight="bold" text-anchor="middle">Both forward, uneven</text>
  <text x="890" y="464" fill="#4d5358" font-size="13" text-anchor="middle">One wheel faster than the other</text>
  <text x="890" y="488" fill="#4d5358" font-size="13" text-anchor="middle">Curves toward the slower side</text>
  <rect x="770" y="514" width="240" height="46" rx="6" fill="#eef4fa"/>
  <text x="890" y="533" fill="#1a5276" font-size="12" font-weight="bold" text-anchor="middle">Best for:</text>
  <text x="890" y="551" fill="#3d4852" font-size="12" text-anchor="middle">gentle curves, line following</text>

  <text x="550" y="620" fill="#4d5358" font-size="15" text-anchor="middle">All three come from the difference between the two wheel speeds &#8212; that is differential drive.</text>

  <text x="1060" y="690" fill="#9aa0a6" font-size="11" text-anchor="end">GRAPHIC 3.16</text>
</svg>
