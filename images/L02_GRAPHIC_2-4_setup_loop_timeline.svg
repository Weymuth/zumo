<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" font-family="Segoe UI, Arial, sans-serif">
  <!-- Title -->
  <text x="350" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a5276">How setup() and loop() Work Together</text>

  <!-- Power On box -->
  <rect x="235" y="60" width="230" height="54" rx="27" fill="#6c757d"/>
  <text x="350" y="93" text-anchor="middle" font-size="19" font-weight="bold" fill="#ffffff">&#9889; POWER ON</text>

  <!-- Arrow 1: Power On -> setup (single polygon) -->
  <polygon points="344,114 356,114 356,140 366,140 350,162 334,140 344,140" fill="#1a5276"/>

  <!-- setup() box -->
  <rect x="150" y="166" width="400" height="112" rx="10" fill="#ffffff" stroke="#3498db" stroke-width="3"/>
  <rect x="150" y="166" width="400" height="40" rx="10" fill="#3498db"/>
  <rect x="150" y="196" width="400" height="10" fill="#3498db"/>
  <text x="350" y="193" text-anchor="middle" font-size="19" font-weight="bold" fill="#ffffff" font-family="Consolas, monospace">void setup()</text>
  <text x="350" y="232" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a5276">Runs ONCE</text>
  <text x="350" y="258" text-anchor="middle" font-size="14" fill="#444444">Initialize sensors, display, Serial communication</text>

  <!-- Arrow 2: setup -> loop (single polygon) -->
  <polygon points="344,278 356,278 356,304 366,304 350,326 334,304 344,304" fill="#1a5276"/>

  <!-- loop() box -->
  <rect x="150" y="330" width="400" height="112" rx="10" fill="#ffffff" stroke="#3498db" stroke-width="3"/>
  <rect x="150" y="330" width="400" height="40" rx="10" fill="#3498db"/>
  <rect x="150" y="360" width="400" height="10" fill="#3498db"/>
  <text x="350" y="357" text-anchor="middle" font-size="19" font-weight="bold" fill="#ffffff" font-family="Consolas, monospace">void loop()</text>
  <text x="350" y="396" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a5276">Runs FOREVER</text>
  <text x="350" y="422" text-anchor="middle" font-size="14" fill="#444444">Check buttons, update display, control motors, read sensors</text>

  <!-- Repeat loop: path from loop() bottom, around the right side, back into loop() header -->
  <path d="M 350 442 L 350 470 Q 350 486 366 486 L 604 486 Q 620 486 620 470 L 620 320 Q 620 304 604 304 L 596 304"
        fill="none" stroke="#3498db" stroke-width="4"/>
  <!-- Arrowhead into right side of loop() header (single polygon) -->
  <polygon points="596,294 596,314 572,304" fill="#3498db"/>
  <text x="500" y="510" text-anchor="middle" font-size="15" font-style="italic" font-weight="bold" fill="#1a5276">repeats until power off</text>

  <!-- setup never repeats note -->
  <text x="350" y="546" text-anchor="middle" font-size="14" fill="#666666">setup() never runs again &#8212; only loop() repeats until you turn the robot off.</text>
</svg>
