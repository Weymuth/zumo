<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="titleBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a5276"/>
      <stop offset="100%" stop-color="#2e86ab"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef2f5"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1100" height="850" fill="#ffffff"/>
  <rect x="0" y="0" width="1100" height="72" fill="url(#titleBand)"/>
  <text x="34" y="46" font-size="27" font-weight="bold" fill="#ffffff">GRAPHIC 7.4 &#8212; How the Files Connect</text>
  <text x="1066" y="46" font-size="17" fill="#d6e9f2" text-anchor="end">Lesson 7 &#183; declare / implement / call</text>

  <rect x="40" y="100" width="1020" height="440" rx="10" fill="url(#panelGrad)" stroke="#c8d2da" stroke-width="2"/>
  <text x="60" y="132" font-size="16" font-weight="bold" fill="#1a5276">Three jobs. Three kinds of file. One arrow between each.</text>

  <rect x="86" y="176" width="260" height="130" rx="8" fill="#eaf4fb" stroke="#3498db" stroke-width="3"/>
  <text x="216" y="206" font-size="15" font-weight="bold" fill="#1a5276" text-anchor="middle">main.cpp</text>
  <text x="216" y="232" font-size="13" fill="#123c66" text-anchor="middle">THE CALLER</text>
  <rect x="106" y="246" width="220" height="44" rx="4" fill="#1e1e1e"/>
  <text x="120" y="264" font-family="Consolas, Monaco, monospace" font-size="12" fill="#c586c0" textLength="152" lengthAdjust="spacingAndGlyphs">#include "RobotMotion.h"</text>
  <text x="120" y="282" font-family="Consolas, Monaco, monospace" font-size="12" fill="#dcdcaa" textLength="130" lengthAdjust="spacingAndGlyphs">driveDistance(30);</text>

  <polygon points="352,224 424,224 424,214 452,236 424,258 424,248 352,248" fill="#3498db" stroke="#21618c" stroke-width="2"/>
  <text x="402" y="206" font-size="13" font-weight="bold" fill="#1a5276" text-anchor="middle">#include</text>
  <text x="402" y="284" font-size="12" fill="#7a8a96" text-anchor="middle">&#8220;what can I call?&#8221;</text>

  <rect x="458" y="176" width="260" height="130" rx="8" fill="#fdf3e3" stroke="#e07b39" stroke-width="3"/>
  <text x="588" y="206" font-size="15" font-weight="bold" fill="#8e4415" text-anchor="middle">RobotMotion.h</text>
  <text x="588" y="232" font-size="13" fill="#8e4415" text-anchor="middle">THE DECLARATION</text>
  <rect x="478" y="246" width="220" height="44" rx="4" fill="#1e1e1e"/>
  <text x="492" y="270" font-family="Consolas, Monaco, monospace" font-size="12" fill="#9cdcfe" textLength="192" lengthAdjust="spacingAndGlyphs">void driveDistance(float);</text>
  <text x="588" y="322" font-size="12" font-style="italic" fill="#b85c1e" text-anchor="middle">a promise, ending in a semicolon</text>

  <polygon points="724,224 796,224 796,214 824,236 796,258 796,248 724,248" fill="#e07b39" stroke="#8e4415" stroke-width="2"/>
  <text x="774" y="206" font-size="13" font-weight="bold" fill="#8e4415" text-anchor="middle">implements</text>
  <text x="774" y="284" font-size="12" fill="#7a8a96" text-anchor="middle">&#8220;here is how&#8221;</text>

  <rect x="830" y="176" width="230" height="130" rx="8" fill="#f4f9f6" stroke="#3a7d5c" stroke-width="3"/>
  <text x="945" y="206" font-size="14" font-weight="bold" fill="#2a5a42" text-anchor="middle">RobotMotion.cpp</text>
  <text x="945" y="232" font-size="13" fill="#1c3b2a" text-anchor="middle">THE BODY</text>
  <rect x="846" y="246" width="198" height="44" rx="4" fill="#1e1e1e"/>
  <text x="858" y="264" font-family="Consolas, Monaco, monospace" font-size="12" fill="#dcdcaa" textLength="170" lengthAdjust="spacingAndGlyphs">void driveDistance(){</text>
  <text x="872" y="282" font-family="Consolas, Monaco, monospace" font-size="12" fill="#6a9955" textLength="120" lengthAdjust="spacingAndGlyphs">// the real work</text>

  <rect x="86" y="352" width="974" height="72" rx="6" fill="#e8f3ec" stroke="#2a5a42" stroke-width="2"/>
  <text x="110" y="380" font-size="15" font-weight="bold" fill="#2a5a42">main.cpp never includes the .cpp. It only ever includes the .h.</text>
  <text x="110" y="406" font-size="14" fill="#1c3b2a">The compiler finds RobotMotion.cpp on its own, builds it separately, and the LINKER staples the two together at the end.</text>

  <rect x="86" y="440" width="974" height="80" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="110" y="468" font-size="15" font-weight="bold" fill="#c0392b">Break either arrow and you get a different error &#8212; and they are not the same error.</text>
  <text x="110" y="494" font-size="14" fill="#6b2c34">No #include &#8594; &#8220;driveDistance was not declared&#8221; (COMPILE). Header but no .cpp body &#8594; &#8220;undefined reference&#8221; (LINK).</text>

  <rect x="40" y="566" width="1020" height="246" rx="10" fill="#eaf4fb" stroke="#3498db" stroke-width="2"/>
  <rect x="40" y="566" width="1020" height="42" rx="10" fill="#1a5276"/>
  <rect x="40" y="594" width="1020" height="14" fill="#1a5276"/>
  <text x="64" y="595" font-size="17" font-weight="bold" fill="#ffffff">READ THE ERROR, AND IT TELLS YOU WHICH ARROW BROKE</text>

  <rect x="64" y="628" width="480" height="164" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="84" y="656" font-size="14" font-weight="bold" fill="#c0392b">&#8220;was not declared in this scope&#8221;</text>
  <text x="84" y="684" font-size="13" fill="#6b2c34">The caller has never heard of the function.</text>
  <text x="84" y="706" font-size="13" fill="#6b2c34">The MENU never reached it.</text>
  <text x="84" y="740" font-size="13" font-weight="bold" fill="#c0392b">&#8594; you forgot the #include.</text>
  <text x="84" y="770" font-size="12" font-style="italic" fill="#8a5560">Caught at COMPILE time, in one file.</text>

  <rect x="560" y="628" width="476" height="164" rx="6" fill="#ffffff" stroke="#e07b39" stroke-width="2"/>
  <text x="580" y="656" font-size="14" font-weight="bold" fill="#b85c1e">&#8220;undefined reference to ...&#8221;</text>
  <text x="580" y="684" font-size="13" fill="#8e4415">The caller knows the NAME &#8212; the menu arrived &#8212;</text>
  <text x="580" y="706" font-size="13" fill="#8e4415">but there is no kitchen behind it.</text>
  <text x="580" y="740" font-size="13" font-weight="bold" fill="#b85c1e">&#8594; the .cpp body is missing.</text>
  <text x="580" y="770" font-size="12" font-style="italic" fill="#a06a3a">Caught at LINK time, at the very end.</text>
</svg>
