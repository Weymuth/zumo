<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">How the Files Connect</title>
  <desc id="desc">RoboLore instructional diagram showing how main.cpp includes RobotMotion.h and how RobotMotion.cpp implements the declaration.</desc>
  <defs>
    <marker id="arrowNavy" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><polygon points="0,0 12,6 0,12" fill="#0B1A2E"/></marker>
    <marker id="arrowBronze" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><polygon points="0,0 12,6 0,12" fill="#8A6E45"/></marker>
  </defs>
  <rect x="0" y="0" width="1100" height="850" fill="#F6F7F8"/>
  <rect x="0" y="0" width="1100" height="122" fill="#0B1A2E"/>
  <text x="43" y="61" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700" fill="#FFFFFF">How the Files Connect</text>
  <text x="43" y="96" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#E8EEF4">declare → implement → call</text>
  <line x1="714" y1="28" x2="714" y2="94" stroke="#E8EEF4" stroke-width="2"/>
  <text x="757" y="51" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#FFFFFF">Three jobs. Three files.</text>
  <text x="757" y="82" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#FFFFFF">One connection between each.</text>
  <line x1="0" y1="122" x2="1100" y2="122" stroke="#C9A463" stroke-width="3"/>
  <circle cx="16" cy="124" r="11" fill="#C9A463" stroke="#8A6E45" stroke-width="2"/>
  <circle cx="1084" cy="124" r="11" fill="#C9A463" stroke="#8A6E45" stroke-width="2"/>
  <circle cx="16" cy="124" r="4" fill="#F6E3B1"/>
  <circle cx="1084" cy="124" r="4" fill="#F6E3B1"/>

  <rect x="48" y="162" width="1004" height="397" rx="16" fill="#EDF1F4" stroke="#C8D1DA" stroke-width="2"/>
  <text x="72" y="193" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#45576A" letter-spacing="1">THE FILE CONNECTION</text>

  <!-- left card -->
  <rect x="76" y="224" width="258" height="145" rx="13" fill="#F7F8F9" stroke="#0E75C9" stroke-width="2.5"/>
  <rect x="76" y="224" width="258" height="49" rx="13" fill="#0B1A2E"/>
  <rect x="76" y="260" width="258" height="13" fill="#0B1A2E"/>
  <text x="205" y="256" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">main.cpp</text>
  <text x="205" y="302" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#45576A" letter-spacing="1">THE CALLER</text>
  <rect x="95" y="309" width="221" height="58" rx="7" fill="#1E1E1E"/>
  <text x="108" y="332" font-family="Courier New, monospace" font-size="14" fill="#C586C0">#include</text>
  <text x="194" y="332" font-family="Courier New, monospace" font-size="14" fill="#DCDCDC">&quot;RobotMotion.h&quot;</text>
  <text x="108" y="355" font-family="Courier New, monospace" font-size="14" fill="#F4E4B3">driveDistance (30);</text>

  <!-- center card -->
  <rect x="434" y="224" width="258" height="145" rx="13" fill="#F7F8F9" stroke="#D0A400" stroke-width="2.5"/>
  <rect x="434" y="224" width="258" height="49" rx="13" fill="#8A6E45"/>
  <rect x="434" y="260" width="258" height="13" fill="#8A6E45"/>
  <text x="563" y="256" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">RobotMotion.h</text>
  <text x="563" y="302" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#45576A" letter-spacing="1">THE DECLARATION</text>
  <rect x="453" y="309" width="221" height="58" rx="7" fill="#1E1E1E"/>
  <text x="468" y="344" font-family="Courier New, monospace" font-size="15" fill="#9CDCFE">void driveDistance(float);</text>

  <!-- right card -->
  <rect x="792" y="224" width="232" height="145" rx="13" fill="#F7F8F9" stroke="#37955F" stroke-width="2.5"/>
  <rect x="792" y="224" width="232" height="49" rx="13" fill="#0B1A2E"/>
  <rect x="792" y="260" width="232" height="13" fill="#0B1A2E"/>
  <text x="908" y="256" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">RobotMotion.cpp</text>
  <text x="908" y="302" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#45576A" letter-spacing="1">THE BODY</text>
  <rect x="811" y="309" width="196" height="58" rx="7" fill="#1E1E1E"/>
  <text x="827" y="332" font-family="Courier New, monospace" font-size="14" fill="#F4E4B3">void driveDistance(){</text>
  <text x="839" y="355" font-family="Courier New, monospace" font-size="14" fill="#6A9955">// the real work</text>

  <!-- arrows and labels -->
  <line x1="349" y1="297" x2="422" y2="297" stroke="#0B1A2E" stroke-width="6" marker-end="url(#arrowNavy)"/>
  <text x="356" y="260" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0B1A2E">#include</text>
  <text x="328" y="344" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#607489">“What may I call?”</text>

  <line x1="708" y1="297" x2="777" y2="297" stroke="#8A6E45" stroke-width="6" marker-end="url(#arrowBronze)"/>
  <text x="719" y="260" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0B1A2E">implements</text>
  <text x="696" y="344" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#607489">“Here is how.”</text>
  <text x="458" y="390" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#607489">A promise that ends in a semicolon</text>

  <rect x="76" y="414" width="948" height="55" rx="12" fill="#EDF7F0" stroke="#37955F" stroke-width="2"/>
  <text x="98" y="438" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1A2B41">main.cpp includes the .h — never the .cpp.</text>
  <text x="98" y="456" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#31465B">The compiler builds RobotMotion.cpp separately. The linker joins the caller and the body at the end.</text>

  <rect x="76" y="482" width="948" height="55" rx="12" fill="#FFF6F5" stroke="#F44336" stroke-width="2"/>
  <text x="98" y="506" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1A2B41">Each broken connection produces a different error.</text>
  <text x="98" y="524" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#31465B">Missing declaration → compile error. Declaration without a body → link error.</text>

  <rect x="48" y="585" width="1004" height="214" rx="16" fill="#EDF1F4" stroke="#C8D1DA" stroke-width="2"/>
  <rect x="48" y="585" width="1004" height="53" rx="16" fill="#0B1A2E"/>
  <rect x="48" y="625" width="1004" height="13" fill="#0B1A2E"/>
  <text x="73" y="625" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">Read the error: it tells you which connection broke</text>

  <rect x="74" y="672" width="460" height="108" rx="12" fill="#FFFFFF" stroke="#F44336" stroke-width="2"/>
  <rect x="88" y="687" width="129" height="29" rx="14.5" fill="#DB5349"/>
  <text x="152" y="707" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">COMPILE ERROR</text>
  <text x="89" y="740" font-family="Courier New, monospace" font-size="14" fill="#C0392B">“was not declared in this scope”</text>
  <text x="89" y="768" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#31465B">The caller has never seen the declaration.</text>
  <text x="89" y="787" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1A2B41">Fix: include the header file.</text>

  <rect x="572" y="672" width="452" height="108" rx="12" fill="#FFFFFF" stroke="#D0A400" stroke-width="2"/>
  <rect x="586" y="687" width="111" height="29" rx="14.5" fill="#8A6E45"/>
  <text x="641" y="707" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">LINK ERROR</text>
  <text x="588" y="740" font-family="Courier New, monospace" font-size="14" fill="#8A6E45">“undefined reference to …”</text>
  <text x="588" y="768" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#31465B">The declaration exists, but the body is missing.</text>
  <text x="588" y="787" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1A2B41">Fix: add or build the .cpp implementation.</text>

  <line x1="49" y1="817" x2="1051" y2="817" stroke="#C9A463" stroke-width="2"/>
  <text x="550" y="841" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#607489">The header tells the compiler what exists. The .cpp file provides the actual instructions.</text>
</svg>