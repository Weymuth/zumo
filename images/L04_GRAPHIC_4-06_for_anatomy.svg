<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="Segoe UI, Arial, sans-serif">
  <!-- Title -->
  <text x="380" y="34" text-anchor="middle" font-size="23" font-weight="bold" fill="#2a5a42">Anatomy of a for Loop</text>
  <text x="380" y="56" text-anchor="middle" font-size="14" fill="#666666">One trip through the sensor array, one slot at a time</text>

  <!-- Dark code panel -->
  <rect x="45" y="72" width="670" height="62" rx="8" fill="#1e1e1e"/>
  <text x="70" y="112" font-size="19" font-family="Consolas, 'Courier New', monospace" xml:space="preserve"><tspan fill="#569cd6" font-weight="bold">for</tspan><tspan fill="#e8e8e8"> (</tspan><tspan fill="#4ec9b0" font-weight="bold">uint8_t i = 0</tspan><tspan fill="#e8e8e8">; </tspan><tspan fill="#dcdcaa" font-weight="bold">i &lt; NUM_SENSORS</tspan><tspan fill="#e8e8e8">; </tspan><tspan fill="#c586c0" font-weight="bold">i++</tspan><tspan fill="#e8e8e8">) {</tspan></text>

  <!-- Connectors from the code parts down to the cards -->
  <line x1="145" y1="140" x2="145" y2="176" stroke="#2a9d8a" stroke-width="2"/>
  <polygon points="139,176 151,176 145,188" fill="#2a9d8a"/>
  <line x1="380" y1="140" x2="380" y2="176" stroke="#b8a92e" stroke-width="2"/>
  <polygon points="374,176 386,176 380,188" fill="#b8a92e"/>
  <line x1="615" y1="140" x2="615" y2="176" stroke="#a05ca8" stroke-width="2"/>
  <polygon points="609,176 621,176 615,188" fill="#a05ca8"/>

  <!-- Card 1: START -->
  <rect x="40" y="190" width="210" height="152" rx="10" fill="#ffffff" stroke="#2a9d8a" stroke-width="3"/>
  <rect x="40" y="190" width="210" height="38" rx="10" fill="#2a9d8a"/>
  <rect x="40" y="218" width="210" height="10" fill="#2a9d8a"/>
  <circle cx="66" cy="209" r="12" fill="#ffffff"/>
  <text x="66" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#2a9d8a">1</text>
  <text x="155" y="216" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">START</text>
  <text x="145" y="254" text-anchor="middle" font-size="14" fill="#333333">Runs ONCE, first.</text>
  <text x="145" y="278" text-anchor="middle" font-size="14" fill="#333333">Makes the counter</text>
  <text x="145" y="303" text-anchor="middle" font-size="14" font-family="Consolas, monospace" fill="#1a6e5f" font-weight="bold">uint8_t i = 0</text>
  <text x="145" y="327" text-anchor="middle" font-size="13" fill="#666666">(start at slot 0)</text>

  <!-- Card 2: CONTINUE IF -->
  <rect x="275" y="190" width="210" height="152" rx="10" fill="#ffffff" stroke="#b8a92e" stroke-width="3"/>
  <rect x="275" y="190" width="210" height="38" rx="10" fill="#b8a92e"/>
  <rect x="275" y="218" width="210" height="10" fill="#b8a92e"/>
  <circle cx="301" cy="209" r="12" fill="#ffffff"/>
  <text x="301" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#b8a92e">2</text>
  <text x="392" y="216" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">CONTINUE IF</text>
  <text x="380" y="254" text-anchor="middle" font-size="14" fill="#333333">Checked BEFORE every lap.</text>
  <text x="380" y="279" text-anchor="middle" font-size="14" font-family="Consolas, monospace" fill="#7a6f1c" font-weight="bold">i &lt; NUM_SENSORS</text>
  <text x="380" y="303" text-anchor="middle" font-size="14" fill="#333333">True &#8594; run the body</text>
  <text x="380" y="327" text-anchor="middle" font-size="14" fill="#333333">False &#8594; loop ends</text>

  <!-- Card 3: UPDATE -->
  <rect x="510" y="190" width="210" height="152" rx="10" fill="#ffffff" stroke="#a05ca8" stroke-width="3"/>
  <rect x="510" y="190" width="210" height="38" rx="10" fill="#a05ca8"/>
  <rect x="510" y="218" width="210" height="10" fill="#a05ca8"/>
  <circle cx="536" cy="209" r="12" fill="#ffffff"/>
  <text x="536" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#a05ca8">3</text>
  <text x="627" y="216" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">UPDATE</text>
  <text x="615" y="254" text-anchor="middle" font-size="14" fill="#333333">Runs AFTER each lap.</text>
  <text x="615" y="279" text-anchor="middle" font-size="14" font-family="Consolas, monospace" fill="#6e3d75" font-weight="bold">i++</text>
  <text x="615" y="303" text-anchor="middle" font-size="14" fill="#333333">Moves to the next slot</text>
  <text x="615" y="327" text-anchor="middle" font-size="13" fill="#666666">(0 &#8594; 1 &#8594; 2 &#8230;)</text>

  <!-- Order strip -->
  <rect x="45" y="360" width="670" height="42" rx="8" fill="#eaf3ee" stroke="#3a7d5c" stroke-width="2"/>
  <text x="380" y="386" text-anchor="middle" font-size="15" fill="#2a5a42" font-weight="bold">Order each lap:  &#9312; once at the start &#8594; &#9313; check &#8594; run body &#8594; &#9314; update &#8594; back to &#9313;</text>

  <!-- The Lesson 4 payoff -->
  <rect x="45" y="414" width="670" height="44" rx="8" fill="#fdf3e7" stroke="#e67e22" stroke-width="2"/>
  <text x="380" y="433" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a5a2b">Act One has 3 sensors. Act Two has 5.</text>
  <text x="380" y="452" text-anchor="middle" font-size="14" fill="#8a5a2b">NUM_SENSORS changes &#8212; this loop does not. That is what it bought you.</text>
</svg>
