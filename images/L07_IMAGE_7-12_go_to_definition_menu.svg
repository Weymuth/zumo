<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
  <title id="title">The right-click menu, showing Go to Definition</title>
  <desc id="desc">Instructional figure reproducing the Visual Studio Code editor context menu opened on a function call, with Go to Definition highlighted.</desc>
  <rect x="0" y="0" width="1100" height="500" fill="#FFFFFF"/>
  <rect x="40" y="24" width="1020" height="48" rx="6" fill="#0B1A2E"/>
  <rect x="40" y="72" width="1020" height="3" fill="#C9A463"/>
  <text x="60" y="55" fill="#FFFFFF" font-size="23" font-weight="700">GO TO DEFINITION &#8212; FOLLOW THE CALL</text>
  <text x="1040" y="54" fill="#D7E0EA" font-size="13" text-anchor="end">Zumo 32U4 Robotics &#183; Lesson 7</text>
  <rect x="52" y="96" width="996" height="320" rx="10" fill="#1E1E1E" stroke="#0F1720" stroke-width="2"/>
  <rect x="52" y="96" width="996" height="30" fill="#333333"/>
  <circle cx="74" cy="111" r="6" fill="#FF5F57"/>
  <circle cx="94" cy="111" r="6" fill="#FEBC2E"/>
  <circle cx="114" cy="111" r="6" fill="#28C840"/>
  <text x="550" y="116" fill="#CFCFCF" font-size="13" font-weight="400" text-anchor="middle">main.cpp &#8212; zumo-lesson-07</text>
  <rect x="52" y="390" width="996" height="26" fill="#007ACC"/>
  <text x="70" y="408" fill="#FFFFFF" font-size="12" font-weight="400" text-anchor="start">PlatformIO &#183; env:zumo32U4</text>
  <text x="72" y="168" fill="#569CD6" font-family="Courier New, monospace" font-size="15" font-weight="400" xml:space="preserve">void loop() {</text>
  <text x="96" y="194" fill="#DCDCAA" font-family="Courier New, monospace" font-size="15" font-weight="400" xml:space="preserve">followLine</text>
  <rect x="94" y="180" width="88" height="20" fill="#264F78" opacity="0.55"/>
  <text x="192" y="194" fill="#D4D4D4" font-family="Courier New, monospace" font-size="15" font-weight="400" xml:space="preserve">(BASE_SPEED);</text>
  <text x="72" y="220" fill="#569CD6" font-family="Courier New, monospace" font-size="15" font-weight="400" xml:space="preserve">}</text>
  <rect x="200" y="208" width="272" height="162" rx="6" fill="#3C3C3C" stroke="#5A5A5A" stroke-width="1"/>
  <rect x="203" y="214" width="266" height="28" rx="3" fill="#007ACC"/>
  <text x="216" y="234" fill="#FFFFFF" font-size="14" font-weight="400" text-anchor="start">Go to Definition</text>
  <text x="216" y="264" fill="#CFCFCF" font-size="14" font-weight="400" text-anchor="start">Go to References</text>
  <text x="216" y="294" fill="#CFCFCF" font-size="14" font-weight="400" text-anchor="start">Peek Definition</text>
  <text x="216" y="324" fill="#CFCFCF" font-size="14" font-weight="400" text-anchor="start">Rename Symbol</text>
  <text x="216" y="354" fill="#CFCFCF" font-size="14" font-weight="400" text-anchor="start">Format Document</text>
  <text x="520" y="240" fill="#2B3A4A" font-size="15" font-weight="400" text-anchor="start">jumps straight to where the function is written,</text>
  <text x="520" y="264" fill="#2B3A4A" font-size="15" font-weight="400" text-anchor="start">in whichever of the eight files that happens to be</text>
  <rect x="52" y="404" width="996" height="54" rx="8" fill="#FBFBFC" stroke="#D8DDE2" stroke-width="2"/>
  <text x="72" y="437" fill="#2B3A4A" font-size="16" font-weight="400" text-anchor="start">You do not have to remember which file holds which function. Right-click the call and the editor takes you there.</text>
</svg>
