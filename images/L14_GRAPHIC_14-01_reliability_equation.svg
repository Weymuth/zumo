<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850">
<rect width="1100" height="850" fill="#F5F2E9"/>
<rect x="0" y="0" width="1100" height="64" fill="#0B1A2E"/>
<text x="550" y="41" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" fill="#FFFFFF" text-anchor="middle">The Reliability Equation</text>
<text x="550" y="94" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#3D5266" text-anchor="middle">Ten behaviours, each 90% reliable. The course does not care how good any one of them is.</text>
<rect x="130" y="233.0" width="66" height="297.0" fill="#2F7D55" stroke="none" stroke-width="0" rx="4"/>
<text x="163.0" y="223.0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#2F7D55" text-anchor="middle" font-weight="bold">90%</text>
<text x="163.0" y="554" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#3D5266" text-anchor="middle">1</text>
<rect x="212" y="262.7" width="66" height="267.3" fill="#2F7D55" stroke="none" stroke-width="0" rx="4"/>
<text x="245.0" y="252.7" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#2F7D55" text-anchor="middle" font-weight="bold">81%</text>
<text x="245.0" y="554" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#3D5266" text-anchor="middle">2</text>
<rect x="294" y="289.1" width="66" height="240.9" fill="#2F7D55" stroke="none" stroke-width="0" rx="4"/>
<text x="327.0" y="279.1" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#2F7D55" text-anchor="middle" font-weight="bold">73%</text>
<text x="327.0" y="554" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#3D5266" text-anchor="middle">3</text>
<rect x="376" y="312.2" width="66" height="217.8" fill="#7B6240" stroke="none" stroke-width="0" rx="4"/>
<text x="409.0" y="302.2" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#7B6240" text-anchor="middle" font-weight="bold">66%</text>
<text x="409.0" y="554" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#3D5266" text-anchor="middle">4</text>
<rect x="458" y="335.3" width="66" height="194.7" fill="#7B6240" stroke="none" stroke-width="0" rx="4"/>
<text x="491.0" y="325.3" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#7B6240" text-anchor="middle" font-weight="bold">59%</text>
<text x="491.0" y="554" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#3D5266" text-anchor="middle">5</text>
<rect x="540" y="355.1" width="66" height="174.9" fill="#7B6240" stroke="none" stroke-width="0" rx="4"/>
<text x="573.0" y="345.1" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#7B6240" text-anchor="middle" font-weight="bold">53%</text>
<text x="573.0" y="554" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#3D5266" text-anchor="middle">6</text>
<rect x="622" y="371.6" width="66" height="158.4" fill="#B42318" stroke="none" stroke-width="0" rx="4"/>
<text x="655.0" y="361.6" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#B42318" text-anchor="middle" font-weight="bold">48%</text>
<text x="655.0" y="554" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#3D5266" text-anchor="middle">7</text>
<rect x="704" y="388.1" width="66" height="141.9" fill="#B42318" stroke="none" stroke-width="0" rx="4"/>
<text x="737.0" y="378.1" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#B42318" text-anchor="middle" font-weight="bold">43%</text>
<text x="737.0" y="554" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#3D5266" text-anchor="middle">8</text>
<rect x="786" y="401.3" width="66" height="128.7" fill="#B42318" stroke="none" stroke-width="0" rx="4"/>
<text x="819.0" y="391.3" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#B42318" text-anchor="middle" font-weight="bold">39%</text>
<text x="819.0" y="554" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#3D5266" text-anchor="middle">9</text>
<rect x="868" y="414.5" width="66" height="115.5" fill="#B42318" stroke="none" stroke-width="0" rx="4"/>
<text x="901.0" y="404.5" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#B42318" text-anchor="middle" font-weight="bold">35%</text>
<text x="901.0" y="554" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#3D5266" text-anchor="middle">10</text>
<line x1="112" y1="530" x2="950" y2="530" stroke="#66788A" stroke-width="2"/>
<text x="550" y="582" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#3D5266" text-anchor="middle">Number of behaviours the course makes you chain together</text>
<text x="100" y="208" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#66788A" text-anchor="end">100%</text>
<rect x="120" y="610" width="860" height="118" fill="#FDECEA" stroke="#B42318" stroke-width="2" rx="8"/>
<text x="150" y="648" font-family="Courier New, monospace" font-size="20" fill="#7A231C" text-anchor="start" font-weight="bold">0.9  x  0.9  x  0.9  x  0.9  x  0.9  x  0.9  x  0.9  x  0.9  x  0.9  x  0.9   =   0.35</text>
<text x="150" y="682" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#7A231C" text-anchor="start">A robot that works "90% of the time" finishes a full course about once in every three runs.</text>
<text x="150" y="710" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#7A231C" text-anchor="start" font-style="italic">Reliability does not add. It multiplies. That is why Section 7D asks for ten runs, not one.</text>
<text x="550" y="780" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#66788A" text-anchor="middle" font-style="italic">Every behaviour you leave at "good enough" is a factor in this product.</text>
</svg>
