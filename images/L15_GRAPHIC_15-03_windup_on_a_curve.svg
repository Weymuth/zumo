<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" font-family="Arial, Helvetica, sans-serif" width="1100" height="850">
  <defs>
    </defs>
  <rect width="1100" height="850" fill="#F5F2E9"/>

  <rect x="0" y="0" width="1100" height="78" fill="#0B1A2E"/>
  <text x="550" y="38" fill="#FFFFFF" font-size="27" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">WHY I RUINS A CURVE</text>
  <text x="550" y="63" fill="#E8EEF4" font-size="16" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">The I term assumes a constant error is a mistake. On a curve, it is the answer.</text>

  <!-- ===== LEFT: the track ===== -->
  <text x="70" y="115" fill="#3D5266" font-size="18" font-weight="bold" font-family="Arial, Helvetica, sans-serif">THE TRACK</text>
  <path d="M 90 300 L 260 300 Q 430 300 430 470 L 430 640" fill="none" stroke="#0B1A2E" stroke-width="16" stroke-linecap="round"/>
  <text x="140" y="285" fill="#66788A" font-size="14" font-family="Arial, Helvetica, sans-serif">straight</text>
  <text x="452" y="480" fill="#66788A" font-size="14" font-family="Arial, Helvetica, sans-serif">exit</text>
  <text x="330" y="345" fill="#66788A" font-size="14" font-family="Arial, Helvetica, sans-serif">curve</text>

  <!-- robot on the curve, riding an offset -->
  <circle cx="180" cy="300" r="10" fill="#3D5266"/>
  <text x="180" y="332" fill="#3D5266" font-size="13" text-anchor="middle" font-weight="bold" font-family="Arial, Helvetica, sans-serif">error ≈ 0</text>

  <circle cx="392" cy="392" r="10" fill="#7B6240"/>
  <line x1="392" y1="392" x2="415" y2="368" stroke="#7B6240" stroke-width="3" stroke-dasharray="3,3"/>
  <text x="470" y="392" fill="#7B6240" font-size="13" font-weight="bold" font-family="Arial, Helvetica, sans-serif">steady error</text>
  <text x="470" y="410" fill="#7B6240" font-size="13" font-weight="bold" font-family="Arial, Helvetica, sans-serif">= the steering</text>

  <circle cx="430" cy="600" r="10" fill="#B42318"/>
  <path d="M 430 600 Q 480 640 540 630" fill="none" stroke="#B42318" stroke-width="4" stroke-dasharray="6,4"/>
  <polygon points="556,626 526,620 532,640" fill="#B42318"/>
  <text x="560" y="665" fill="#B42318" font-size="15" font-weight="bold" font-family="Arial, Helvetica, sans-serif">STILL TURNING</text>

  <!-- ===== RIGHT: the integral ===== -->
  <text x="640" y="115" fill="#3D5266" font-size="18" font-weight="bold" font-family="Arial, Helvetica, sans-serif">WHAT THE INTEGRAL IS DOING</text>

  <!-- error trace -->
  <text x="640" y="155" fill="#0B1A2E" font-size="14" font-weight="bold" font-family="Arial, Helvetica, sans-serif">error</text>
  <line x1="640" y1="240" x2="1040" y2="240" stroke="#C8D1DA" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="1048" y="245" fill="#9AA7B2" font-size="12" font-family="Arial, Helvetica, sans-serif">0</text>
  <path d="M 640 240 L 740 240 L 760 195 L 900 195 L 920 240 L 1030 240" fill="none" stroke="#7B6240" stroke-width="4"/>
  <rect x="760" y="195" width="140" height="45" fill="#E7D5B8" opacity="0.6"/>
  <text x="830" y="224" fill="#7B6240" font-size="13" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">area piles up</text>

  <line x1="760" y1="170" x2="760" y2="330" stroke="#9AA7B2" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="920" y1="170" x2="920" y2="330" stroke="#9AA7B2" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="840" y="182" fill="#66788A" font-size="12" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">CURVE</text>

  <!-- integral trace -->
  <text x="640" y="380" fill="#0B1A2E" font-size="14" font-weight="bold" font-family="Arial, Helvetica, sans-serif">integral</text>
  <line x1="640" y1="470" x2="1040" y2="470" stroke="#C8D1DA" stroke-width="2" stroke-dasharray="5,4"/>
  <path d="M 640 470 L 760 470 L 920 350 L 1030 350" fill="none" stroke="#B42318" stroke-width="4"/>
  <text x="975" y="338" fill="#B42318" font-size="13" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">and never</text>
  <text x="975" y="325" fill="#B42318" font-size="13" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">comes back</text>

  <!-- output trace -->
  <text x="640" y="530" fill="#0B1A2E" font-size="14" font-weight="bold" font-family="Arial, Helvetica, sans-serif">steering command</text>
  <line x1="640" y1="620" x2="1040" y2="620" stroke="#C8D1DA" stroke-width="2" stroke-dasharray="5,4"/>
  <path d="M 640 620 L 750 620 L 790 585 L 900 540 L 920 545 L 960 600 L 1000 618 L 1030 620" fill="none" stroke="#B42318" stroke-width="4"/>
  <line x1="920" y1="620" x2="920" y2="500" stroke="#9AA7B2" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="960" y="518" fill="#B42318" font-size="13" font-weight="bold" font-family="Arial, Helvetica, sans-serif">the curve ended.</text>
  <text x="960" y="535" fill="#B42318" font-size="13" font-weight="bold" font-family="Arial, Helvetica, sans-serif">the command did not.</text>

  <!-- verdict -->
  <rect x="70" y="700" width="960" height="115" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="3"/>
  <text x="550" y="732" fill="#B42318" font-size="19" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">THE I TERM CANNOT TELL AN ERROR IT SHOULD FIX</text>
  <text x="550" y="757" fill="#B42318" font-size="19" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">FROM AN ANSWER IT SHOULD LEAVE ALONE.</text>
  <text x="550" y="790" fill="#0B1A2E" font-size="15" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Nothing is wrong with the math. What is wrong is WHERE WE PUT IT.</text>
</svg>
