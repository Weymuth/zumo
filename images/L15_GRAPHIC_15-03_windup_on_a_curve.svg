<svg viewBox="0 0 1100 850" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="band3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a5276"/>
      <stop offset="100%" stop-color="#2e86ab"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="850" fill="#ffffff"/>

  <rect x="0" y="0" width="1100" height="78" fill="url(#band3)"/>
  <text x="550" y="38" fill="#ffffff" font-size="27" font-weight="bold" text-anchor="middle">WHY I RUINS A CURVE</text>
  <text x="550" y="63" fill="#d6e9f2" font-size="16" text-anchor="middle">The I term assumes a constant error is a mistake. On a curve, it is the answer.</text>

  <!-- ===== LEFT: the track ===== -->
  <text x="70" y="115" fill="#1a5276" font-size="18" font-weight="bold">THE TRACK</text>
  <path d="M 90 300 L 260 300 Q 430 300 430 470 L 430 640" fill="none" stroke="#2c3e50" stroke-width="16" stroke-linecap="round"/>
  <text x="140" y="285" fill="#607d8b" font-size="14">straight</text>
  <text x="452" y="480" fill="#607d8b" font-size="14">exit</text>
  <text x="330" y="345" fill="#607d8b" font-size="14">curve</text>

  <!-- robot on the curve, riding an offset -->
  <circle cx="180" cy="300" r="10" fill="#2e86ab"/>
  <text x="180" y="332" fill="#2e86ab" font-size="13" text-anchor="middle" font-weight="bold">error &#8776; 0</text>

  <circle cx="392" cy="392" r="10" fill="#e67e22"/>
  <line x1="392" y1="392" x2="415" y2="368" stroke="#e67e22" stroke-width="3" stroke-dasharray="3,3"/>
  <text x="470" y="392" fill="#a05a12" font-size="13" font-weight="bold">steady error</text>
  <text x="470" y="410" fill="#a05a12" font-size="13" font-weight="bold">= the steering</text>

  <circle cx="430" cy="600" r="10" fill="#c0392b"/>
  <path d="M 430 600 Q 480 640 540 630" fill="none" stroke="#c0392b" stroke-width="4" stroke-dasharray="6,4"/>
  <polygon points="556,626 526,620 532,640" fill="#c0392b"/>
  <text x="560" y="665" fill="#c0392b" font-size="15" font-weight="bold">STILL TURNING</text>

  <!-- ===== RIGHT: the integral ===== -->
  <text x="640" y="115" fill="#1a5276" font-size="18" font-weight="bold">WHAT THE INTEGRAL IS DOING</text>

  <!-- error trace -->
  <text x="640" y="155" fill="#2c3e50" font-size="14" font-weight="bold">error</text>
  <line x1="640" y1="240" x2="1040" y2="240" stroke="#b8c7d1" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="1048" y="245" fill="#8fa3b0" font-size="12">0</text>
  <path d="M 640 240 L 740 240 L 760 195 L 900 195 L 920 240 L 1030 240" fill="none" stroke="#e67e22" stroke-width="4"/>
  <rect x="760" y="195" width="140" height="45" fill="#f5c99b" opacity="0.6"/>
  <text x="830" y="224" fill="#a05a12" font-size="13" font-weight="bold" text-anchor="middle">area piles up</text>

  <line x1="760" y1="170" x2="760" y2="330" stroke="#8fa3b0" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="920" y1="170" x2="920" y2="330" stroke="#8fa3b0" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="840" y="182" fill="#607d8b" font-size="12" text-anchor="middle">CURVE</text>

  <!-- integral trace -->
  <text x="640" y="380" fill="#2c3e50" font-size="14" font-weight="bold">integral</text>
  <line x1="640" y1="470" x2="1040" y2="470" stroke="#b8c7d1" stroke-width="2" stroke-dasharray="5,4"/>
  <path d="M 640 470 L 760 470 L 920 350 L 1030 350" fill="none" stroke="#c0392b" stroke-width="4"/>
  <text x="975" y="338" fill="#c0392b" font-size="13" font-weight="bold" text-anchor="middle">and never</text>
  <text x="975" y="325" fill="#c0392b" font-size="13" font-weight="bold" text-anchor="middle">comes back</text>

  <!-- output trace -->
  <text x="640" y="530" fill="#2c3e50" font-size="14" font-weight="bold">steering command</text>
  <line x1="640" y1="620" x2="1040" y2="620" stroke="#b8c7d1" stroke-width="2" stroke-dasharray="5,4"/>
  <path d="M 640 620 L 750 620 L 790 585 L 900 540 L 920 545 L 960 600 L 1000 618 L 1030 620"
        fill="none" stroke="#c0392b" stroke-width="4"/>
  <line x1="920" y1="620" x2="920" y2="500" stroke="#8fa3b0" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="960" y="518" fill="#c0392b" font-size="13" font-weight="bold">the curve ended.</text>
  <text x="960" y="535" fill="#c0392b" font-size="13" font-weight="bold">the command did not.</text>

  <!-- verdict -->
  <rect x="70" y="700" width="960" height="115" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
  <text x="550" y="732" fill="#c0392b" font-size="19" font-weight="bold" text-anchor="middle">THE I TERM CANNOT TELL AN ERROR IT SHOULD FIX</text>
  <text x="550" y="757" fill="#c0392b" font-size="19" font-weight="bold" text-anchor="middle">FROM AN ANSWER IT SHOULD LEAVE ALONE.</text>
  <text x="550" y="790" fill="#2c3e50" font-size="15" text-anchor="middle">Nothing is wrong with the math. What is wrong is WHERE WE PUT IT.</text>
</svg>
