<svg viewBox="0 0 1100 820" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a5276"/>
      <stop offset="1" stop-color="#2e86ab"/>
    </linearGradient>
    <linearGradient id="plateGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8e8ea"/>
      <stop offset="1" stop-color="#b9bdc4"/>
    </linearGradient>
    <linearGradient id="postGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa0a6"/>
      <stop offset="0.5" stop-color="#e6e8ea"/>
      <stop offset="1" stop-color="#9aa0a6"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1100" height="820" fill="#ffffff"/>

  <rect x="40" y="24" width="1020" height="52" rx="8" fill="#0B1A2E"/>
  <text x="60" y="59" fill="#ffffff" font-size="26" font-weight="bold">INSIDE THE GEARBOX</text>
  <text x="1040" y="57" fill="#d6e9f2" font-size="14" text-anchor="end">Zumo 32U4 Robotics &#183; Lesson 3</text>

  <!-- =================================================== -->
  <!-- SIDE VIEW (top) : gears mesh, small drives big -->
  <!-- =================================================== -->
  <text x="70" y="118" fill="#2a5a42" font-size="17" font-weight="bold">SIDE VIEW &#8212; the gears mesh, small drives big</text>

  <circle cx="175" cy="230" r="30" fill="#c9cfd6" stroke="#7a828a" stroke-width="3"/>
  <circle cx="175" cy="230" r="36" fill="none" stroke="#8a929a" stroke-width="6" stroke-dasharray="5 5"/>
  <circle cx="175" cy="230" r="9" fill="#6c757d"/>
  <text x="175" y="296" fill="#3a3a3a" font-size="13" font-weight="bold" text-anchor="middle">pinion</text>
  <text x="175" y="313" fill="#6c757d" font-size="11" text-anchor="middle">motor shaft</text>

  <circle cx="315" cy="230" r="58" fill="#e8d5a0" stroke="#b08d57" stroke-width="3"/>
  <circle cx="315" cy="230" r="64" fill="none" stroke="#c8a869" stroke-width="6" stroke-dasharray="6 6"/>
  <circle cx="315" cy="230" r="23" fill="#d9b978" stroke="#b08d57" stroke-width="2"/>
  <circle cx="315" cy="230" r="10" fill="#8a6d3b"/>

  <circle cx="475" cy="230" r="74" fill="#e8d5a0" stroke="#b08d57" stroke-width="3"/>
  <circle cx="475" cy="230" r="80" fill="none" stroke="#c8a869" stroke-width="6" stroke-dasharray="6 6"/>
  <circle cx="475" cy="230" r="27" fill="#d9b978" stroke="#b08d57" stroke-width="2"/>
  <circle cx="475" cy="230" r="10" fill="#8a6d3b"/>

  <circle cx="655" cy="230" r="86" fill="#e8d5a0" stroke="#b08d57" stroke-width="3"/>
  <circle cx="655" cy="230" r="92" fill="none" stroke="#c8a869" stroke-width="6" stroke-dasharray="6 6"/>
  <circle cx="655" cy="230" r="31" fill="#d9b978" stroke="#b08d57" stroke-width="2"/>
  <circle cx="655" cy="230" r="10" fill="#8a6d3b"/>

  <circle cx="838" cy="230" r="50" fill="#aebac6" stroke="#7a828a" stroke-width="3"/>
  <circle cx="838" cy="230" r="56" fill="none" stroke="#8a929a" stroke-width="6" stroke-dasharray="6 6"/>
  <circle cx="838" cy="230" r="14" fill="#5a636b"/>
  <text x="838" y="308" fill="#3a3a3a" font-size="13" font-weight="bold" text-anchor="middle">output</text>
  <text x="838" y="325" fill="#6c757d" font-size="11" text-anchor="middle">to track sprocket</text>

  <rect x="171" y="140" width="8" height="48" fill="#e8820c"/>
  <polygon points="175,132 160,158 190,158" fill="#e8820c"/>
  <text x="175" y="128" fill="#a85a08" font-size="14" font-weight="bold" text-anchor="middle">DRIVE</text>
  <text x="238" y="150" fill="#a85a08" font-size="12" text-anchor="middle">fast, weak</text>

  <text x="838" y="128" fill="#2a5a42" font-size="14" font-weight="bold" text-anchor="middle">DRIVEN</text>
  <text x="778" y="150" fill="#2a5a42" font-size="12" text-anchor="middle">slow, strong</text>
  <rect x="834" y="140" width="8" height="48" fill="#3a7d5c"/>
  <polygon points="838,132 823,158 853,158" fill="#3a7d5c"/>

  <rect x="120" y="346" width="820" height="22" rx="6" fill="#fdf0e2" stroke="#e8c9a6"/>
  <text x="150" y="362" fill="#a85a08" font-size="13" font-weight="bold">SPEED &#8594; divided at each stage</text>
  <text x="910" y="362" fill="#a85a08" font-size="13" font-weight="bold" text-anchor="end">low</text>
  <rect x="120" y="376" width="820" height="22" rx="6" fill="#e6f2ec" stroke="#a6cdb8"/>
  <text x="150" y="392" fill="#2a5a42" font-size="13" font-weight="bold">TORQUE &#8594; multiplied at each stage</text>
  <text x="910" y="392" fill="#2a5a42" font-size="13" font-weight="bold" text-anchor="end">high</text>

  <line x1="60" y1="422" x2="1040" y2="422" stroke="#dee2e6" stroke-width="2"/>

  <!-- =================================================== -->
  <!-- CUTAWAY (bottom) : the real gear stack between two plates -->
  <!-- traced from the photo: two plates, corner posts, staggered gears -->
  <!-- =================================================== -->
  <text x="70" y="462" fill="#2a5a42" font-size="17" font-weight="bold">CUTAWAY &#8212; the real gear stack: gears ladder up on stepped shafts between two plates</text>

  <!-- plate geometry -->
  <!-- top plate y=520..544 ; bottom plate y=706..730 ; posts connect them -->
  <!-- corner posts (silver standoffs) -->
  <rect x="250" y="540" width="26" height="170" rx="6" fill="url(#postGrad)" stroke="#7a828a" stroke-width="2"/>
  <rect x="824" y="540" width="26" height="170" rx="6" fill="url(#postGrad)" stroke="#7a828a" stroke-width="2"/>
  <!-- post end caps -->
  <ellipse cx="263" cy="540" rx="18" ry="8" fill="#cfd3d8" stroke="#7a828a" stroke-width="1.5"/>
  <ellipse cx="263" cy="710" rx="18" ry="8" fill="#cfd3d8" stroke="#7a828a" stroke-width="1.5"/>
  <ellipse cx="837" cy="540" rx="18" ry="8" fill="#cfd3d8" stroke="#7a828a" stroke-width="1.5"/>
  <ellipse cx="837" cy="710" rx="18" ry="8" fill="#cfd3d8" stroke="#7a828a" stroke-width="1.5"/>

  <!-- input shaft (rises from top plate) -->
  <rect x="336" y="470" width="14" height="70" rx="3" fill="url(#postGrad)" stroke="#7a828a" stroke-width="1.5"/>
  <ellipse cx="343" cy="470" rx="10" ry="5" fill="#cfd3d8" stroke="#7a828a" stroke-width="1.5"/>
  <text x="343" y="460" fill="#4d5358" font-size="12" font-weight="bold" text-anchor="middle">input</text>

  <!-- ===== GEAR STACK (drawn before top plate so plate overlaps top edges) ===== -->
  <!-- Represent each gear as an ellipse (viewed edge-on-ish) with a tooth band.
       Big gears wide, pinions narrow; staggered heights = the ladder. -->

  <!-- shaft rods through the stack -->
  <line x1="343" y1="544" x2="343" y2="706" stroke="#8a6d3b" stroke-width="4"/>
  <line x1="470" y1="544" x2="470" y2="706" stroke="#8a6d3b" stroke-width="4"/>
  <line x1="600" y1="544" x2="600" y2="706" stroke="#8a6d3b" stroke-width="4"/>
  <line x1="720" y1="544" x2="720" y2="706" stroke="#8a6d3b" stroke-width="4"/>

  <!-- Stage 1: big gear high on shaft A, small pinion low -->
  <g stroke="#8a6d3b" stroke-width="1.5">
    <rect x="300" y="576" width="86" height="26" rx="5" fill="#c9a86a"/>
    <rect x="300" y="576" width="86" height="26" rx="5" fill="none" stroke="#8a6d3b" stroke-dasharray="3 2"/>
    <rect x="330" y="660" width="26" height="22" rx="4" fill="#b89355"/>
  </g>

  <!-- Stage 2: small pinion high on shaft B meshes stage1 big; big gear low -->
  <g stroke="#8a6d3b" stroke-width="1.5">
    <rect x="457" y="580" width="26" height="20" rx="4" fill="#b89355"/>
    <rect x="426" y="636" width="88" height="26" rx="5" fill="#c9a86a"/>
    <rect x="426" y="636" width="88" height="26" rx="5" fill="none" stroke="#8a6d3b" stroke-dasharray="3 2"/>
  </g>

  <!-- Stage 3: pinion mid on shaft C, big gear lower -->
  <g stroke="#8a6d3b" stroke-width="1.5">
    <rect x="587" y="600" width="26" height="20" rx="4" fill="#b89355"/>
    <rect x="556" y="654" width="88" height="26" rx="5" fill="#c9a86a"/>
    <rect x="556" y="654" width="88" height="26" rx="5" fill="none" stroke="#8a6d3b" stroke-dasharray="3 2"/>
  </g>

  <!-- Stage 4: pinion drives output low on shaft D -->
  <g stroke="#8a6d3b" stroke-width="1.5">
    <rect x="707" y="620" width="26" height="20" rx="4" fill="#b89355"/>
    <rect x="690" y="672" width="60" height="22" rx="4" fill="#c9a86a"/>
  </g>

  <!-- top plate -->
  <rect x="230" y="522" width="640" height="24" rx="8" fill="url(#plateGrad)" stroke="#8a929a" stroke-width="2"/>
  <!-- bottom plate -->
  <rect x="230" y="704" width="640" height="24" rx="8" fill="url(#plateGrad)" stroke="#8a929a" stroke-width="2"/>

  <!-- output shaft (drops from bottom plate) -->
  <rect x="713" y="728" width="14" height="66" rx="3" fill="url(#postGrad)" stroke="#7a828a" stroke-width="1.5"/>
  <ellipse cx="720" cy="794" rx="10" ry="5" fill="#cfd3d8" stroke="#7a828a" stroke-width="1.5"/>
  <text x="720" y="812" fill="#4d5358" font-size="12" font-weight="bold" text-anchor="middle">output shaft &#8594; sprocket</text>

  <!-- ladder call-outs -->
  <text x="343" y="566" fill="#a85a08" font-size="11" font-weight="bold" text-anchor="middle">A</text>
  <text x="470" y="566" fill="#a85a08" font-size="11" font-weight="bold" text-anchor="middle">B</text>
  <text x="600" y="566" fill="#a85a08" font-size="11" font-weight="bold" text-anchor="middle">C</text>
  <text x="720" y="566" fill="#a85a08" font-size="11" font-weight="bold" text-anchor="middle">D</text>

  <!-- descending trend arrow to show the ladder stepping down -->
  <polyline points="360,596 490,652 620,668 738,684" fill="none" stroke="#e8820c" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="560" y="700" fill="#a85a08" font-size="12" font-style="italic" text-anchor="middle">each stage steps the motion down the ladder &#8594;</text>

  <!-- caption card right -->
  <rect x="884" y="522" width="156" height="206" rx="8" fill="#f0f7f0" stroke="#6b8e6b" stroke-width="1.5"/>
  <text x="962" y="552" fill="#2a5a42" font-size="13" font-weight="bold" text-anchor="middle">The ladder</text>
  <text x="962" y="580" fill="#3d4852" font-size="11.5" text-anchor="middle">A wide gear and a</text>
  <text x="962" y="597" fill="#3d4852" font-size="11.5" text-anchor="middle">narrow pinion share</text>
  <text x="962" y="614" fill="#3d4852" font-size="11.5" text-anchor="middle">each shaft, at</text>
  <text x="962" y="631" fill="#3d4852" font-size="11.5" text-anchor="middle">different heights.</text>
  <text x="962" y="656" fill="#3d4852" font-size="11.5" text-anchor="middle">The pinion drives</text>
  <text x="962" y="673" fill="#3d4852" font-size="11.5" text-anchor="middle">the next wide gear &#8212;</text>
  <text x="962" y="690" fill="#3d4852" font-size="11.5" text-anchor="middle">four rungs, 75:1.</text>

  <text x="1060" y="800" fill="#9aa0a6" font-size="11" text-anchor="end">GRAPHIC 3.18</text>
</svg>
