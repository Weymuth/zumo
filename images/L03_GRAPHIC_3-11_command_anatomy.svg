<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" font-family="Arial, Helvetica, sans-serif">
  <rect x="1" y="1" width="998" height="538" rx="10" fill="#ffffff" stroke="#d5dde3" stroke-width="2"/>
  <defs/>
  <rect x="1" y="1" width="998" height="56" rx="10" fill="#0B1A2E"/>
  <text x="500" y="37" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Anatomy of a Command: object . method ( arguments ) ;</text>

  <!-- dark code band -->
  <rect x="60" y="92" width="880" height="120" rx="8" fill="#1e1e1e" stroke="#333333"/>
  <g font-family="Courier New, monospace" font-size="24">
    <text x="236.0" y="160" fill="#4ec9b6" textLength="79.19999999999999">motors</text>
    <text x="315.2" y="160" fill="#e8e8e8" textLength="13.2">.</text>
    <text x="328.4" y="160" fill="#dcdcaa" textLength="118.8">setSpeeds</text>
    <text x="447.2" y="160" fill="#e8e8e8" textLength="316.79999999999995">(leftSpeed, rightSpeed);</text>
  </g>
  <!-- underlines -->
  <rect x="236.0" y="172" width="79.19999999999999" height="5" rx="2.5" fill="#4ec9b6"/>
  <rect x="315.2" y="172" width="13.2" height="5" rx="2.5" fill="#9b6a9e"/>
  <rect x="328.4" y="172" width="118.8" height="5" rx="2.5" fill="#2e86ab"/>
  <rect x="447.2" y="172" width="303.59999999999997" height="5" rx="2.5" fill="#b7950b"/>
  <!-- numbered badges above segments -->
  <g font-size="14" font-weight="bold">
    <circle cx="275.6" cy="116" r="13" fill="#4ec9b6"/><text x="275.6" y="121" fill="#ffffff" text-anchor="middle">1</text>
    <circle cx="321.8" cy="116" r="13" fill="#9b6a9e"/><text x="321.8" y="121" fill="#ffffff" text-anchor="middle">2</text>
    <circle cx="387.79999999999995" cy="116" r="13" fill="#2e86ab"/><text x="387.79999999999995" y="121" fill="#ffffff" text-anchor="middle">3</text>
    <circle cx="599.0" cy="116" r="13" fill="#b7950b"/><text x="599.0" y="121" fill="#ffffff" text-anchor="middle">4</text>
  </g>

  <!-- four cards -->
  <g>
    <rect x="60" y="248" width="208" height="180" rx="8" fill="#eafaf6" stroke="#4ec9b6" stroke-width="2"/>
    <circle cx="86" cy="276" r="13" fill="#4ec9b6"/><text x="86" y="281" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="106" y="281" font-size="15" font-weight="bold" fill="#0e6655">THE OBJECT</text>
    <text x="76" y="310" font-size="13" fill="#333333">WHO you are commanding.</text>
    <text x="76" y="332" font-size="13" fill="#333333">motors = the handle for</text>
    <text x="76" y="352" font-size="13" fill="#333333">both drive motors (via the</text>
    <text x="76" y="372" font-size="13" fill="#333333">DRV8838 driver chips).</text>

    <rect x="284" y="248" width="208" height="180" rx="8" fill="#f0ebf5" stroke="#9b6a9e" stroke-width="2"/>
    <circle cx="310" cy="276" r="13" fill="#9b6a9e"/><text x="310" y="281" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="330" y="281" font-size="15" font-weight="bold" fill="#704c73">THE DOT</text>
    <text x="300" y="310" font-size="13" fill="#333333">The connector. Read it as</text>
    <text x="300" y="332" font-size="13" fill="#333333">an apostrophe-s:</text>
    <text x="300" y="352" font-size="13" font-style="italic" fill="#333333">“the motors’ setSpeeds.”</text>
    <text x="300" y="372" font-size="13" fill="#333333">No dot, no delivery.</text>

    <rect x="508" y="248" width="208" height="180" rx="8" fill="#eaf3fa" stroke="#2e86ab" stroke-width="2"/>
    <circle cx="534" cy="276" r="13" fill="#2e86ab"/><text x="534" y="281" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="554" y="281" font-size="15" font-weight="bold" fill="#1a5276">THE METHOD</text>
    <text x="524" y="310" font-size="13" fill="#333333">WHAT to do — one action</text>
    <text x="524" y="332" font-size="13" fill="#333333">from the object’s menu.</text>
    <text x="524" y="352" font-size="13" fill="#333333">Others: playNote(),</text>
    <text x="524" y="372" font-size="13" fill="#333333">print(), isPressed()…</text>

    <rect x="732" y="248" width="208" height="180" rx="8" fill="#fdf6e3" stroke="#b7950b" stroke-width="2"/>
    <circle cx="758" cy="276" r="13" fill="#b7950b"/><text x="758" y="281" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <text x="778" y="281" font-size="15" font-weight="bold" fill="#7d6608">THE ARGUMENTS</text>
    <text x="748" y="310" font-size="13" fill="#333333">The DETAILS the action</text>
    <text x="748" y="332" font-size="13" fill="#333333">needs: left speed, right</text>
    <text x="748" y="352" font-size="13" fill="#333333">speed, each −400…+400.</text>
    <text x="748" y="372" font-size="13" fill="#333333">End the line with ; always.</text>
  </g>

  <rect x="60" y="456" width="880" height="54" rx="8" fill="#f8f9fa" stroke="#dee2e6"/>
  <text x="500" y="482" font-size="14" font-weight="bold" fill="#4a5a66" text-anchor="middle">Same pattern, every object: buzzer.playNote(…); · display.print(…); · buttonA.isPressed()</text>
  <text x="500" y="501" font-size="12.5" fill="#6a7a86" text-anchor="middle">WHO . WHAT ( DETAILS ) ;</text>
</svg>