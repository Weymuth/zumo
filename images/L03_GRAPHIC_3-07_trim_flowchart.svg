<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" font-family="Arial, Helvetica, sans-serif">
  <defs>
    </defs>
  <rect width="1100" height="850" fill="#ffffff"/>
  <rect x="0" y="0" width="1100" height="70" fill="#0B1A2E"/>
  <text x="550" y="45" fill="#ffffff" font-size="30" font-weight="bold" text-anchor="middle">THE TRIM ADJUSTMENT LOOP</text>

  <!-- START -->
  <rect x="430" y="95" width="240" height="52" rx="26" fill="#1a5276"/>
  <text x="550" y="128" fill="#ffffff" font-size="20" font-weight="bold" text-anchor="middle">START</text>
  <polygon points="550,147 550,175 543,175 550,189 557,175 550,175" fill="#555555"/>

  <!-- TEST box -->
  <rect x="380" y="190" width="340" height="64" rx="10" fill="#eaf2f8" stroke="#2e86ab" stroke-width="2.5"/>
  <text x="550" y="217" font-size="19" font-weight="bold" fill="#1a5276" text-anchor="middle">UPLOAD and RUN</text>
  <text x="550" y="241" font-size="16" fill="#333333" text-anchor="middle">2-second straight-line test</text>
  <polygon points="550,254 550,282 543,282 550,296 557,282 550,282" fill="#555555"/>

  <!-- DECISION diamond -->
  <polygon points="550,298 760,368 550,438 340,368" fill="#fdf6e3" stroke="#b7950b" stroke-width="2.5"/>
  <text x="550" y="358" font-size="19" font-weight="bold" fill="#7d6608" text-anchor="middle">WATCH the robot:</text>
  <text x="550" y="384" font-size="19" font-weight="bold" fill="#7d6608" text-anchor="middle">which way does it curve?</text>

  <!-- LEFT branch -->
  <text x="268" y="356" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">LEFT</text>
  <path d="M 340 368 L 195 368 L 195 440" fill="none" stroke="#555555" stroke-width="2.5"/>
  <polygon points="195,440 188,426 202,426" fill="#555555"/>
  <rect x="60" y="440" width="270" height="96" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2.5"/>
  <text x="195" y="470" font-size="18" font-weight="bold" fill="#c0392b" text-anchor="middle">Left motor is weak</text>
  <text x="195" y="497" font-size="18" font-weight="bold" fill="#333333" text-anchor="middle">INCREASE TRIM</text>
  <text x="195" y="521" font-size="16" fill="#333333" text-anchor="middle">press A (+5)</text>
  <!-- RIGHT branch -->
  <text x="832" y="356" font-size="16" font-weight="bold" fill="#8e44ad" text-anchor="middle">RIGHT</text>
  <path d="M 760 368 L 905 368 L 905 440" fill="none" stroke="#555555" stroke-width="2.5"/>
  <polygon points="905,440 898,426 912,426" fill="#555555"/>
  <rect x="770" y="440" width="270" height="96" rx="10" fill="#f4ecf7" stroke="#8e44ad" stroke-width="2.5"/>
  <text x="905" y="470" font-size="18" font-weight="bold" fill="#8e44ad" text-anchor="middle">Right motor is weak</text>
  <text x="905" y="497" font-size="18" font-weight="bold" fill="#333333" text-anchor="middle">DECREASE TRIM</text>
  <text x="905" y="521" font-size="16" fill="#333333" text-anchor="middle">press C (−5)</text>

  <!-- STRAIGHT branch -->
  <text x="585" y="462" font-size="16" font-weight="bold" fill="#1e8449" text-anchor="start">STRAIGHT</text>
  <path d="M 550 438 L 550 490" fill="none" stroke="#555555" stroke-width="2.5"/>
  <polygon points="550,490 543,476 557,476" fill="#555555"/>
  <rect x="415" y="492" width="270" height="96" rx="10" fill="#e8f6ef" stroke="#1e8449" stroke-width="2.5"/>
  <text x="550" y="524" font-size="19" font-weight="bold" fill="#1e8449" text-anchor="middle">DONE!</text>
  <text x="550" y="550" font-size="16" fill="#333333" text-anchor="middle">Write your TRIM value</text>
  <text x="550" y="572" font-size="16" fill="#333333" text-anchor="middle">on tape under the robot</text>

  <!-- loop arrows back to TEST -->
  <path d="M 195 536 L 195 640 L 550 640" fill="none" stroke="#888888" stroke-width="2.5" stroke-dasharray="7 6"/>
  <path d="M 905 536 L 905 640 L 550 640" fill="none" stroke="#888888" stroke-width="2.5" stroke-dasharray="7 6"/>
  <path d="M 550 640 L 550 664" fill="none" stroke="#888888" stroke-width="2.5" stroke-dasharray="7 6"/>
  <text x="550" y="632" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">test again after every press</text>
  <path d="M 550 664 L 320 664 L 320 222 L 380 222" fill="none" stroke="#888888" stroke-width="2.5" stroke-dasharray="7 6"/>
  <polygon points="380,222 366,215 366,229" fill="#888888"/>

  <!-- footer: where TRIM lives -->
  <rect x="90" y="700" width="920" height="120" rx="10" fill="#1e1e1e"/>
  <text x="120" y="736" font-size="19" font-weight="bold" fill="#e8e8e8">Where TRIM goes in your code:</text>
  <text x="120" y="770" font-family="'Courier New', monospace" font-size="20" fill="#9cdcfe">motors.setSpeeds(200 + TRIM, 200);</text>
  <text x="120" y="800" font-size="16" fill="#e8e8e8">TRIM is added to the LEFT motor — positive boosts it, negative cuts it. Typical values: −30 to +30.</text>
</svg>