<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" font-family="Segoe UI, Arial, sans-serif">
  <!-- Title -->
  <text x="350" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#2a5a42">How Your Program Runs</text>

  <!-- Power On box -->
  <rect x="235" y="60" width="230" height="54" rx="27" fill="#6c757d"/>
  <text x="350" y="93" text-anchor="middle" font-size="19" font-weight="bold" fill="#ffffff">&#9889; Power On / Reset</text>

  <!-- Arrow 1: Power On -> setup (single polygon) -->
  <polygon points="344,114 356,114 356,140 366,140 350,162 334,140 344,140" fill="#2a5a42"/>

  <!-- setup() box -->
  <rect x="150" y="166" width="400" height="112" rx="10" fill="#ffffff" stroke="#3a7d5c" stroke-width="3"/>
  <rect x="150" y="166" width="400" height="40" rx="10" fill="#3a7d5c"/>
  <rect x="150" y="196" width="400" height="10" fill="#3a7d5c"/>
  <text x="350" y="193" text-anchor="middle" font-size="19" font-weight="bold" fill="#ffffff" font-family="Consolas, monospace">void setup()</text>
  <text x="350" y="232" text-anchor="middle" font-size="17" font-weight="bold" fill="#2a5a42">Runs exactly ONCE</text>
  <text x="350" y="258" text-anchor="middle" font-size="14" fill="#444444">Wake-up jobs: start Serial, greet on the display, run your test</text>

  <!-- Arrow 2: setup -> loop (single polygon) -->
  <polygon points="344,278 356,278 356,304 366,304 350,326 334,304 344,304" fill="#2a5a42"/>

  <!-- loop() box -->
  <rect x="150" y="330" width="400" height="112" rx="10" fill="#ffffff" stroke="#3a7d5c" stroke-width="3"/>
  <rect x="150" y="330" width="400" height="40" rx="10" fill="#3a7d5c"/>
  <rect x="150" y="360" width="400" height="10" fill="#3a7d5c"/>
  <text x="350" y="357" text-anchor="middle" font-size="19" font-weight="bold" fill="#ffffff" font-family="Consolas, monospace">void loop()</text>
  <text x="350" y="396" text-anchor="middle" font-size="17" font-weight="bold" fill="#2a5a42">Runs FOREVER, over and over</text>
  <text x="350" y="422" text-anchor="middle" font-size="14" fill="#444444">The robot's heartbeat &#8212; sense, decide, act &#8230; then do it again</text>

  <!-- Repeat loop: path from loop() bottom, around the right side, back into loop() top -->
  <path d="M 350 442 L 350 470 Q 350 486 366 486 L 604 486 Q 620 486 620 470 L 620 320 Q 620 304 604 304 L 596 304"
        fill="none" stroke="#3a7d5c" stroke-width="4"/>
  <!-- Arrowhead into right side of loop() header (single polygon) -->
  <polygon points="596,294 596,314 572,304" fill="#3a7d5c"/>
  <text x="500" y="510" text-anchor="middle" font-size="15" font-style="italic" font-weight="bold" fill="#2a5a42">repeat forever</text>

  <!-- setup never repeats note -->
  <text x="350" y="546" text-anchor="middle" font-size="14" fill="#666666">setup() never runs again &#8212; only loop() repeats until you turn the robot off.</text>
</svg>
