<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Function Anatomy — The Four Parts</title>
  <desc id="desc">A RoboLore instructional diagram identifying the return type, function name, parameter, and body of a C++ function.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0B1A2E" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font-family: Inter, Arial, sans-serif; font-size: 48px; font-weight: 800; fill: #0B1A2E; }
      .subtitle { font-family: Inter, Arial, sans-serif; font-size: 24px; font-weight: 500; fill: #3D5266; }
      .eyebrow { font-family: Inter, Arial, sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 1.4px; fill: #3D5266; }
      .card-head { font-family: Inter, Arial, sans-serif; font-size: 24px; font-weight: 800; fill: #0B1A2E; }
      .card-body { font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 500; fill: #2A3E55; }
      .card-note { font-family: Inter, Arial, sans-serif; font-size: 16px; font-weight: 500; font-style: italic; fill: #65788B; }
      .badge { font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 800; fill: #FFFFFF; }
      .code { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 30px; font-weight: 500; }
      .code-small { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 18px; font-weight: 600; fill: #0B1A2E; }
      .footer { font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 500; fill: #3D5266; }
    </style>
  </defs>

  <rect width="1200" height="900" fill="#FFFFFF"/>

  <!-- Title block -->
  <text x="600" y="66" text-anchor="middle" class="title">Function Anatomy — The Four Parts</text>
  <text x="600" y="103" text-anchor="middle" class="subtitle">Every C++ function is built from the same four structural pieces.</text>
  <line x1="62" y1="132" x2="1138" y2="132" stroke="#C9A463" stroke-width="3"/>
  <circle cx="600" cy="132" r="7" fill="#C9A463"/>

  <!-- Code panel -->
  <rect x="62" y="164" width="1076" height="206" rx="18" fill="#1E1E1E" filter="url(#shadow)"/>
  <text x="92" y="194" class="eyebrow" style="fill:#B7C5D1;">FUNCTION DEFINITION</text>

  <g class="code">
    <text x="118" y="263">
      <tspan fill="#569CD6">void</tspan>
      <tspan fill="#D4D4D4"> </tspan>
      <tspan fill="#DCDCAA">driveDistance</tspan>
      <tspan fill="#D4D4D4">(</tspan>
      <tspan fill="#4EC9B0">float</tspan>
      <tspan fill="#D4D4D4"> </tspan>
      <tspan fill="#9CDCFE">centimeters</tspan>
      <tspan fill="#D4D4D4">) {</tspan>
    </text>
    <text x="150" y="317" fill="#6A9955">// ...the code that runs...</text>
    <text x="118" y="354" fill="#D4D4D4">}</text>
  </g>

  <!-- Underlines -->
  <rect x="116" y="278" width="72" height="7" rx="3.5" fill="#D64545"/>
  <rect x="203" y="278" width="255" height="7" rx="3.5" fill="#CCA700"/>
  <rect x="481" y="278" width="340" height="7" rx="3.5" fill="#2E9D62"/>
  <rect x="849" y="278" width="33" height="7" rx="3.5" fill="#7E57C2"/>
  <rect x="116" y="361" width="20" height="7" rx="3.5" fill="#7E57C2"/>

  <!-- Code badges -->
  <g text-anchor="middle">
    <circle cx="152" cy="221" r="18" fill="#D64545"/>
    <text x="152" y="228" class="badge">1</text>
    <circle cx="330" cy="221" r="18" fill="#CCA700"/>
    <text x="330" y="228" class="badge">2</text>
    <circle cx="650" cy="221" r="18" fill="#2E9D62"/>
    <text x="650" y="228" class="badge">3</text>
    <circle cx="866" cy="221" r="18" fill="#7E57C2"/>
    <text x="866" y="228" class="badge">4</text>
  </g>

  <!-- Card 1 -->
  <rect x="62" y="410" width="518" height="190" rx="18" fill="#FFFFFF" stroke="#D7DEE6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="62" y="410" width="10" height="190" rx="5" fill="#D64545"/>
  <circle cx="108" cy="451" r="20" fill="#D64545"/>
  <text x="108" y="458" text-anchor="middle" class="badge">1</text>
  <text x="142" y="459" class="card-head">Return type</text>
  <text x="94" y="498" class="card-body">What the function gives back when it finishes.</text>
  <text x="94" y="532" class="card-body">
    <tspan class="code-small">void</tspan>
    <tspan> means “nothing to give back — I just do.”</tspan>
  </text>
  <text x="94" y="564" class="card-body">Other return types include </text>
  <text x="334" y="564" class="code-small">int</text>
  <text x="370" y="564" class="card-body">, </text>
  <text x="383" y="564" class="code-small">float</text>
  <text x="439" y="564" class="card-body">, and </text>
  <text x="492" y="564" class="code-small">bool</text>
  <text x="94" y="588" class="card-note">Like a recipe that feeds you versus one that ends in a dish.</text>

  <!-- Card 2 -->
  <rect x="620" y="410" width="518" height="190" rx="18" fill="#FFFFFF" stroke="#D7DEE6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="620" y="410" width="10" height="190" rx="5" fill="#CCA700"/>
  <circle cx="666" cy="451" r="20" fill="#CCA700"/>
  <text x="666" y="458" text-anchor="middle" class="badge">2</text>
  <text x="700" y="459" class="card-head">Name</text>
  <text x="652" y="498" class="card-body">How you call the function from anywhere in the program:</text>
  <rect x="652" y="515" width="234" height="39" rx="8" fill="#F1F4F7"/>
  <text x="668" y="541" class="code-small">driveDistance(30);</text>
  <text x="652" y="577" class="card-body">Verb-first names make the function’s job clear.</text>
  <text x="652" y="592" class="card-note">camelCase, no spaces — the same rules as variables.</text>

  <!-- Card 3 -->
  <rect x="62" y="628" width="518" height="190" rx="18" fill="#FFFFFF" stroke="#D7DEE6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="62" y="628" width="10" height="190" rx="5" fill="#2E9D62"/>
  <circle cx="108" cy="669" r="20" fill="#2E9D62"/>
  <text x="108" y="676" text-anchor="middle" class="badge">3</text>
  <text x="142" y="677" class="card-head">Parameter</text>
  <text x="94" y="716" class="card-body">The input the function needs to do its job:</text>
  <text x="94" y="750" class="card-body">a </text>
  <text x="111" y="750" class="code-small">float</text>
  <text x="167" y="750" class="card-body"> named </text>
  <text x="236" y="750" class="code-small">centimeters</text>
  <text x="94" y="782" class="card-body">Call with 30, it drives 30. Call with 100, it drives 100.</text>
  <text x="94" y="806" class="card-note">One recipe, any sandwich.</text>

  <!-- Card 4 -->
  <rect x="620" y="628" width="518" height="190" rx="18" fill="#FFFFFF" stroke="#D7DEE6" stroke-width="2" filter="url(#shadow)"/>
  <rect x="620" y="628" width="10" height="190" rx="5" fill="#7E57C2"/>
  <circle cx="666" cy="669" r="20" fill="#7E57C2"/>
  <text x="666" y="676" text-anchor="middle" class="badge">4</text>
  <text x="700" y="677" class="card-head">Body</text>
  <text x="652" y="716" class="card-body">Everything between </text>
  <text x="835" y="716" class="code-small">{ }</text>
  <text x="869" y="716" class="card-body"> — the steps</text>
  <text x="652" y="748" class="card-body">that run each time the function is called.</text>
  <text x="652" y="782" class="card-body">Write it once. Call it a thousand times.</text>
  <text x="652" y="806" class="card-note">The recipe’s instructions.</text>

  <!-- Footer note -->
  <line x1="62" y1="850" x2="1138" y2="850" stroke="#D8C29A" stroke-width="2"/>
  <circle cx="92" cy="874" r="18" fill="#0E3B83"/>
  <text x="92" y="881" text-anchor="middle" class="badge">i</text>
  <text x="124" y="880" class="footer">The colored underlines match the numbered cards: four parts, every function, every time.</text>
</svg>
