<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" font-family="Arial, Helvetica, sans-serif">

  <rect x="0" y="0" width="1100" height="850" fill="#F5F2E9"/>
  <rect x="0" y="0" width="1100" height="72" fill="#0B1A2E"/>
  <rect x="0" y="72" width="1100" height="3" fill="#C9A463"/>
  <text x="34" y="46" font-size="27" font-weight="bold" fill="#ffffff">GRAPHIC 14.5 — The Tiles the Course Is Built From</text>
  <text x="1066" y="46" font-size="17" fill="#E8EEF4" text-anchor="end">30 cm square · rearranged every round</text>

  <text x="61" y="106" font-size="16" font-weight="bold" fill="#0B1A2E">EIGHT EXAMPLE PATTERNS AND THE GOAL TILE — examples only, never the complete set. Drawn to scale.</text>

  <!-- ================= ROW 1 ================= -->

  <!-- 1 straight -->
  <rect x="61" y="132" width="150" height="150" rx="6" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
  <path d="M61,207 L211,207" stroke="#000000" stroke-width="8" fill="none"/>
  <text x="136" y="302" font-size="13" font-weight="bold" fill="#3D5266" text-anchor="middle">Straight</text>

  <!-- 2 gap -->
  <rect x="268" y="132" width="150" height="150" rx="6" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
  <path d="M268,207 L316,207" stroke="#000000" stroke-width="8" fill="none"/>
  <path d="M370,207 L418,207" stroke="#000000" stroke-width="8" fill="none"/>
  <text x="343" y="302" font-size="13" font-weight="bold" fill="#3D5266" text-anchor="middle">Gap</text>

  <!-- 3 diagonal -->
  <rect x="475" y="132" width="150" height="150" rx="6" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
  <path d="M475,282 L625,132" stroke="#000000" stroke-width="8" fill="none"/>
  <text x="550" y="302" font-size="13" font-weight="bold" fill="#3D5266" text-anchor="middle">Diagonal</text>

  <!-- 4 curve -->
  <rect x="682" y="132" width="150" height="150" rx="6" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
  <path d="M832,207 A 75 75 0 0 0 757,282" stroke="#000000" stroke-width="8" fill="none"/>
  <text x="757" y="302" font-size="13" font-weight="bold" fill="#3D5266" text-anchor="middle">Curve</text>

  <!-- 5 wave -->
  <rect x="889" y="132" width="150" height="150" rx="6" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
  <path d="M889,207 C 909,207 914,162 934,162 C 954,162 959,207 964,207 C 969,207 974,252 994,252 C 1014,252 1019,207 1039,207" stroke="#000000" stroke-width="8" fill="none"/>
  <text x="964" y="302" font-size="13" font-weight="bold" fill="#3D5266" text-anchor="middle">Wave</text>

  <!-- ================= ROW 2 ================= -->

  <!-- 6 chevron -->
  <rect x="164" y="352" width="150" height="150" rx="6" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
  <path d="M164,442 L194,442 L219,387 L244,442 L269,387 L294,442 L314,442" stroke="#000000" stroke-width="8" fill="none" stroke-linejoin="miter"/>
  <text x="239" y="522" font-size="13" font-weight="bold" fill="#3D5266" text-anchor="middle">Chevron</text>

  <!-- 7 stepped -->
  <rect x="371" y="352" width="150" height="150" rx="6" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
  <path d="M371,427 L416,427 L416,392 L456,392 L456,462 L491,462 L491,427 L521,427" stroke="#000000" stroke-width="8" fill="none" stroke-linejoin="miter"/>
  <text x="446" y="522" font-size="13" font-weight="bold" fill="#3D5266" text-anchor="middle">Stepped</text>

  <!-- 8 intersection -->
  <rect x="578" y="352" width="150" height="150" rx="6" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
  <path d="M578,412 L728,412" stroke="#000000" stroke-width="8" fill="none"/>
  <path d="M653,412 L653,502" stroke="#000000" stroke-width="8" fill="none"/>
  <text x="653" y="522" font-size="13" font-weight="bold" fill="#3D5266" text-anchor="middle">Intersection</text>

  <!-- 9 goal tile -->
  <rect x="785" y="352" width="150" height="150" rx="6" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
  <path d="M785,427 L935,427" stroke="#000000" stroke-width="8" fill="none"/>
  <rect x="854" y="352" width="12" height="150" fill="#D46554"/>
  <text x="860" y="522" font-size="13" font-weight="bold" fill="#7B6240" text-anchor="middle">Goal tile</text>

  <!-- ================= SPEC PANEL ================= -->

  <rect x="61" y="552" width="978" height="224" rx="10" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
  <text x="85" y="586" font-size="16" font-weight="bold" fill="#0B1A2E">THE NUMBERS THAT DECIDE WHETHER YOUR SENSORS WORK</text>

  <text x="85" y="616" font-size="14" fill="#172638">Tile</text>
  <text x="245" y="616" font-size="14" fill="#172638">30 cm x 30 cm. At least 8 tiles per field, not counting start and goal.</text>

  <text x="85" y="642" font-size="14" fill="#172638">Line</text>
  <text x="245" y="642" font-size="14" fill="#172638">Black, 1-2 cm wide, on a white floor. Tape or printed - either is legal.</text>

  <text x="85" y="668" font-size="14" fill="#172638">Gaps</text>
  <text x="245" y="668" font-size="14" fill="#172638">No more than 20 cm long, with at least 5 cm of straight line before each.</text>

  <text x="85" y="694" font-size="14" fill="#172638">Between tiles</text>
  <text x="245" y="694" font-size="14" fill="#172638">Steps of up to 3 mm. Your robot will cross those seams.</text>

  <text x="85" y="720" font-size="14" fill="#172638">Goal tile</text>
  <text x="245" y="720" font-size="14" fill="#172638">A 25 mm x 300 mm red strip across the tile, square to the line coming in.</text>

  <text x="85" y="744" font-size="13" font-style="italic" fill="#7B6240">Every measurement carries a tolerance of 10%. There is no start-tile marking.</text>
  <text x="85" y="764" font-size="13" font-style="italic" fill="#7B6240">The referee points at the start tile, and you begin behind the joint between it and the next one.</text>

  <text x="61" y="806" font-size="12" fill="#3D5266">Patterns redrawn from the RoboCupJunior Rescue Line 2024 rules figure. All measurements above are from the 2026 rules.</text>
  <text x="1039" y="806" font-size="12" fill="#3D5266" text-anchor="end">L14_GRAPHIC_14-05</text>

</svg>
