<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="titleBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a5276"/>
      <stop offset="100%" stop-color="#2e86ab"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef2f5"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1100" height="850" fill="#ffffff"/>
  <rect x="0" y="0" width="1100" height="72" fill="url(#titleBand)"/>
  <text x="34" y="46" font-size="27" font-weight="bold" fill="#ffffff">GRAPHIC 6.5 &#8212; One Turn of the Wheel = 122.5 mm</text>
  <text x="1066" y="46" font-size="17" fill="#d6e9f2" text-anchor="end">Lesson 6 &#183; &#167;3.4</text>

  <rect x="40" y="100" width="560" height="460" rx="10" fill="url(#panelGrad)" stroke="#c8d2da" stroke-width="2"/>
  <text x="60" y="132" font-size="16" font-weight="bold" fill="#1a5276">The wheel is a rolling ruler</text>

  <circle cx="300" cy="310" r="130" fill="#2c3e50" stroke="#1b262c" stroke-width="5"/>
  <circle cx="300" cy="310" r="42" fill="#7f8c8d" stroke="#566573" stroke-width="3"/>
  <circle cx="300" cy="310" r="8" fill="#34495e"/>

  <polygon points="176,302 186,302 186,296 170,310 186,324 186,318 176,318" fill="#e74c3c" stroke="#a93226" stroke-width="1"/>
  <polygon points="424,302 414,302 414,296 430,310 414,324 414,318 424,318" fill="#e74c3c" stroke="#a93226" stroke-width="1"/>
  <line x1="176" y1="310" x2="424" y2="310" stroke="#e74c3c" stroke-width="3"/>
  <rect x="248" y="294" width="104" height="32" rx="4" fill="#ffffff" stroke="#e74c3c" stroke-width="2"/>
  <text x="300" y="316" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">39 mm</text>
  <text x="300" y="470" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">DIAMETER &#8212; across the middle</text>
  <text x="300" y="494" font-size="13" fill="#7a8a96" text-anchor="middle">the one number you can measure with a ruler</text>
  <text x="300" y="524" font-size="13" fill="#7a8a96" text-anchor="middle">everything else is derived from it</text>

  <rect x="624" y="100" width="436" height="460" rx="10" fill="#eaf4fb" stroke="#3498db" stroke-width="2"/>
  <rect x="624" y="100" width="436" height="42" rx="10" fill="#1a5276"/>
  <rect x="624" y="128" width="436" height="14" fill="#1a5276"/>
  <text x="648" y="129" font-size="16" font-weight="bold" fill="#ffffff">UNROLL IT</text>

  <text x="648" y="176" font-size="14" fill="#123c66">Roll the wheel through exactly one full turn.</text>
  <text x="648" y="198" font-size="14" fill="#123c66">The distance it travels on the floor is its</text>
  <text x="648" y="220" font-size="14" font-weight="bold" fill="#0d47a1">CIRCUMFERENCE. Not its diameter.</text>

  <line x1="648" y1="264" x2="1036" y2="264" stroke="#34495e" stroke-width="4"/>
  <circle cx="668" cy="248" r="16" fill="none" stroke="#2c3e50" stroke-width="3"/>
  <line x1="668" y1="248" x2="668" y2="232" stroke="#e74c3c" stroke-width="3"/>
  <circle cx="1016" cy="248" r="16" fill="none" stroke="#2c3e50" stroke-width="3"/>
  <line x1="1016" y1="248" x2="1016" y2="232" stroke="#e74c3c" stroke-width="3"/>
  <polygon points="676,290 990,290 990,282 1014,296 990,310 990,302 676,302" fill="#2a5a42" stroke="#1d3f2e" stroke-width="2"/>
  <rect x="782" y="316" width="120" height="30" rx="4" fill="#ffffff" stroke="#2a5a42" stroke-width="2"/>
  <text x="842" y="337" font-size="15" font-weight="bold" fill="#2a5a42" text-anchor="middle">122.5 mm</text>

  <rect x="648" y="366" width="388" height="90" rx="6" fill="#1e1e1e"/>
  <text x="666" y="394" font-family="Consolas, Monaco, monospace" font-size="14" fill="#9cdcfe" textLength="298" lengthAdjust="spacingAndGlyphs">circumference = 3.14159 x 39.0</text>
  <text x="666" y="422" font-family="Consolas, Monaco, monospace" font-size="15" fill="#b5cea8" textLength="180" lengthAdjust="spacingAndGlyphs">= 122.5 mm</text>
  <text x="666" y="446" font-size="12" fill="#6a9955">one wheel turn = 12.25 cm on the floor</text>

  <text x="648" y="492" font-size="13" fill="#123c66">This is the number that turns COUNTS into</text>
  <text x="648" y="512" font-size="13" fill="#123c66">CENTIMETRES. Measure the diameter wrong,</text>
  <text x="648" y="532" font-size="13" font-weight="bold" fill="#c0392b">and every distance you drive is wrong.</text>

  <rect x="40" y="584" width="1020" height="228" rx="10" fill="#eaf4fb" stroke="#3498db" stroke-width="2"/>
  <rect x="40" y="584" width="1020" height="42" rx="10" fill="#1a5276"/>
  <rect x="40" y="612" width="1020" height="14" fill="#1a5276"/>
  <text x="64" y="613" font-size="17" font-weight="bold" fill="#ffffff">PUTTING IT TOGETHER &#8212; COUNTS PER CENTIMETRE</text>

  <rect x="64" y="644" width="972" height="104" rx="6" fill="#1e1e1e"/>
  <text x="84" y="672" font-family="Consolas, Monaco, monospace" font-size="14" fill="#9cdcfe" textLength="470" lengthAdjust="spacingAndGlyphs">COUNTS_PER_ROTATION    = 909.7      // from the gearbox</text>
  <text x="84" y="698" font-family="Consolas, Monaco, monospace" font-size="14" fill="#9cdcfe" textLength="512" lengthAdjust="spacingAndGlyphs">WHEEL_CIRCUMFERENCE_MM = 122.5      // from this graphic</text>
  <text x="84" y="732" font-family="Consolas, Monaco, monospace" font-size="15" fill="#b5cea8" textLength="646" lengthAdjust="spacingAndGlyphs">COUNTS_PER_CM = 909.7 / 12.25  =  74.3 counts per cm</text>

  <text x="64" y="786" font-size="14" fill="#123c66">Drive 30 cm? That is 30 x 74.3 = 2229 counts. The robot does not know what a centimetre is &#8212;</text>
  <text x="64" y="806" font-size="14" font-weight="bold" fill="#0d47a1">you are the one who taught it, right here.</text>
</svg>
