<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
  <title id="title">One Turn of the Wheel Equals 122.5 Millimetres</title>
  <desc id="desc">A RoboLore instructional graphic explaining wheel diameter, circumference, and how encoder counts are converted to centimetres. The wheel illustrations use a clearer white Zumo track wheel style for consistency with the other RoboLore lesson graphics.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0B1A2E" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#007ACC"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6A9955"/>
    </marker>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 800; fill: #0B1A2E; }
      .meta { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 600; fill: #3D5266; }
      .section { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 800; letter-spacing: 0.9px; fill: #3D5266; }
      .head { font-family: Arial, Helvetica, sans-serif; font-size: 21px; font-weight: 800; fill: #0B1A2E; }
      .body { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 500; fill: #1E1E1E; }
      .bodySmall { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 500; fill: #3D5266; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 800; fill: #0B1A2E; }
      .mono { font-family: 'Courier New', monospace; font-variant-ligatures: none; }
    </style>
  </defs>

  <rect width="1100" height="850" fill="#FFFFFF"/>

  <!-- Page title -->
  <text x="40" y="48" class="title">One Turn of the Wheel = 122.5 mm</text>
  <text x="1060" y="48" text-anchor="end" class="meta">GRAPHIC 6.5 · Lesson 6 · §3.4</text>
  <line x1="40" y1="70" x2="1060" y2="70" stroke="#C9A463" stroke-width="2.5"/>

  <!-- Left card: diameter -->
  <rect x="40" y="96" width="518" height="432" rx="16" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2" filter="url(#shadow)"/>
  <text x="64" y="128" class="section">THE WHEEL IS A ROLLING RULER</text>
  <text x="64" y="158" class="body">Start with the one value you can measure directly:</text>
  <text x="64" y="181" class="head">the wheel’s diameter.</text>

  <!-- Wheel -->
  <g id="zumo-wheel-294-322" transform="translate(294 322)">
    <circle r="127" fill="#11161C" stroke="#0B1A2E" stroke-width="4"/>
    <circle r="109" fill="none" stroke="#0B0F14" stroke-width="36"/>
    <circle cx="94.00" cy="0.00" r="14" fill="#FFFFFF"/>
    <circle cx="81.41" cy="47.00" r="14" fill="#FFFFFF"/>
    <circle cx="47.00" cy="81.41" r="14" fill="#FFFFFF"/>
    <circle cx="0.00" cy="94.00" r="14" fill="#FFFFFF"/>
    <circle cx="-47.00" cy="81.41" r="14" fill="#FFFFFF"/>
    <circle cx="-81.41" cy="47.00" r="14" fill="#FFFFFF"/>
    <circle cx="-94.00" cy="0.00" r="14" fill="#FFFFFF"/>
    <circle cx="-81.41" cy="-47.00" r="14" fill="#FFFFFF"/>
    <circle cx="-47.00" cy="-81.41" r="14" fill="#FFFFFF"/>
    <circle cx="-0.00" cy="-94.00" r="14" fill="#FFFFFF"/>
    <circle cx="47.00" cy="-81.41" r="14" fill="#FFFFFF"/>
    <circle cx="81.41" cy="-47.00" r="14" fill="#FFFFFF"/>
    <circle r="90" fill="#FFFFFF"/>
    <circle r="72" fill="#10151B"/>
    <line x1="0" y1="0" x2="0.00" y2="-61.00" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="43.13" y2="-43.13" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="61.00" y2="0.00" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="43.13" y2="43.13" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0.00" y2="61.00" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-43.13" y2="43.13" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-61.00" y2="0.00" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-43.13" y2="-43.13" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <circle r="24" fill="#E7EBEF" stroke="#9EA8B1" stroke-width="3"/>
    <circle r="9" fill="#8A949E"/>
    </g>

  <!-- Diameter dimension -->
  <line x1="167" y1="322" x2="421" y2="322" stroke="#007ACC" stroke-width="3.5" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/>
  <rect x="250" y="301" width="88" height="42" rx="8" fill="#FFFFFF" stroke="#007ACC" stroke-width="2"/>
  <text x="294" y="328" text-anchor="middle" class="label" style="fill:#007ACC;font-size:18px;">39 mm</text>

  <rect x="108" y="467" width="372" height="38" rx="8" fill="#F3F3F3" stroke="#D4D4D4"/>
  <text x="294" y="492" text-anchor="middle" class="label">DIAMETER — across the middle</text>
  <text x="294" y="519" text-anchor="middle" class="bodySmall">Measure this with a ruler. Everything else is derived from it.</text>

  <!-- Right card: circumference -->
  <rect x="582" y="96" width="478" height="432" rx="16" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2" filter="url(#shadow)"/>
  <text x="606" y="128" class="section">UNROLL ONE FULL TURN</text>
  <text x="606" y="158" class="body">Roll the wheel through exactly one full rotation.</text>
  <text x="606" y="181" class="body">The distance travelled on the floor is the wheel’s</text>
  <text x="606" y="204" class="head" style="font-size:18px;fill:#007ACC;">CIRCUMFERENCE — not its diameter.</text>

  <!-- Roll diagram -->
  <line x1="610" y1="272" x2="1030" y2="272" stroke="#3D5266" stroke-width="3"/>
  <g id="zumo-wheel-640-252" transform="translate(640 252)">
    <circle r="21" fill="#11161C" stroke="#0B1A2E" stroke-width="4"/>
    <circle r="17" fill="none" stroke="#0B0F14" stroke-width="8"/>
    <circle cx="17.00" cy="0.00" r="6" fill="#FFFFFF"/>
    <circle cx="14.72" cy="8.50" r="6" fill="#FFFFFF"/>
    <circle cx="8.50" cy="14.72" r="6" fill="#FFFFFF"/>
    <circle cx="0.00" cy="17.00" r="6" fill="#FFFFFF"/>
    <circle cx="-8.50" cy="14.72" r="6" fill="#FFFFFF"/>
    <circle cx="-14.72" cy="8.50" r="6" fill="#FFFFFF"/>
    <circle cx="-17.00" cy="0.00" r="6" fill="#FFFFFF"/>
    <circle cx="-14.72" cy="-8.50" r="6" fill="#FFFFFF"/>
    <circle cx="-8.50" cy="-14.72" r="6" fill="#FFFFFF"/>
    <circle cx="-0.00" cy="-17.00" r="6" fill="#FFFFFF"/>
    <circle cx="8.50" cy="-14.72" r="6" fill="#FFFFFF"/>
    <circle cx="14.72" cy="-8.50" r="6" fill="#FFFFFF"/>
    <circle r="13" fill="#FFFFFF"/>
    <circle r="8" fill="#10151B"/>
    <line x1="0" y1="0" x2="0.00" y2="-7.00" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="4.95" y2="-4.95" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="7.00" y2="0.00" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="4.95" y2="4.95" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0.00" y2="7.00" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-4.95" y2="4.95" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-7.00" y2="0.00" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-4.95" y2="-4.95" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <circle r="5" fill="#E7EBEF" stroke="#9EA8B1" stroke-width="3"/>
    <circle r="4" fill="#8A949E"/>
    </g>
  <line x1="640" y1="252" x2="640" y2="231" stroke="#007ACC" stroke-width="3"/>
  <g id="zumo-wheel-1000-252" transform="translate(1000 252)">
    <circle r="21" fill="#11161C" stroke="#0B1A2E" stroke-width="4"/>
    <circle r="17" fill="none" stroke="#0B0F14" stroke-width="8"/>
    <circle cx="17.00" cy="0.00" r="6" fill="#FFFFFF"/>
    <circle cx="14.72" cy="8.50" r="6" fill="#FFFFFF"/>
    <circle cx="8.50" cy="14.72" r="6" fill="#FFFFFF"/>
    <circle cx="0.00" cy="17.00" r="6" fill="#FFFFFF"/>
    <circle cx="-8.50" cy="14.72" r="6" fill="#FFFFFF"/>
    <circle cx="-14.72" cy="8.50" r="6" fill="#FFFFFF"/>
    <circle cx="-17.00" cy="0.00" r="6" fill="#FFFFFF"/>
    <circle cx="-14.72" cy="-8.50" r="6" fill="#FFFFFF"/>
    <circle cx="-8.50" cy="-14.72" r="6" fill="#FFFFFF"/>
    <circle cx="-0.00" cy="-17.00" r="6" fill="#FFFFFF"/>
    <circle cx="8.50" cy="-14.72" r="6" fill="#FFFFFF"/>
    <circle cx="14.72" cy="-8.50" r="6" fill="#FFFFFF"/>
    <circle r="13" fill="#FFFFFF"/>
    <circle r="8" fill="#10151B"/>
    <line x1="0" y1="0" x2="0.00" y2="-7.00" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="4.95" y2="-4.95" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="7.00" y2="0.00" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="4.95" y2="4.95" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0.00" y2="7.00" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-4.95" y2="4.95" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-7.00" y2="0.00" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-4.95" y2="-4.95" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <circle r="5" fill="#E7EBEF" stroke="#9EA8B1" stroke-width="3"/>
    <circle r="4" fill="#8A949E"/>
    </g>
  <line x1="1000" y1="252" x2="1000" y2="231" stroke="#007ACC" stroke-width="3"/>
  <line x1="666" y1="300" x2="982" y2="300" stroke="#6A9955" stroke-width="7" marker-end="url(#arrowGreen)"/>
  <rect x="775" y="315" width="98" height="36" rx="7" fill="#FFFFFF" stroke="#6A9955" stroke-width="2"/>
  <text x="824" y="339" text-anchor="middle" class="label" style="fill:#4F7A42;font-size:17px;">122.5 mm</text>

  <!-- Formula panel -->
  <rect x="606" y="370" width="430" height="92" rx="9" fill="#1E1E1E" stroke="#3C3C3C" stroke-width="2"/>
  <text x="626" y="401" class="mono" font-size="15" fill="#D4D4D4">
    <tspan fill="#4EC9B0">circumference</tspan><tspan> = </tspan><tspan fill="#DCDCAA">π</tspan><tspan> × </tspan><tspan fill="#569CD6">39.0 mm</tspan>
  </text>
  <text x="626" y="430" class="mono" font-size="17" font-weight="700" fill="#6A9955">= 122.5 mm</text>
  <text x="626" y="452" class="mono" font-size="12.5" fill="#9D9D9D">one wheel turn = 12.25 cm on the floor</text>

  <text x="606" y="490" class="bodySmall">This measurement converts encoder counts into distance.</text>
  <text x="606" y="514" class="bodySmall" style="font-weight:700;fill:#F44747;">Measure the diameter incorrectly, and every driven distance is wrong.</text>

  <!-- Bottom calculation card -->
  <rect x="40" y="552" width="1020" height="258" rx="16" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2" filter="url(#shadow)"/>
  <text x="64" y="586" class="section">PUTTING IT TOGETHER — COUNTS PER CENTIMETRE</text>
  <text x="64" y="614" class="body">The gearbox gives counts per rotation. The wheel measurement gives distance per rotation.</text>

  <rect x="64" y="637" width="972" height="116" rx="9" fill="#1E1E1E" stroke="#3C3C3C" stroke-width="2"/>
  <text x="84" y="666" class="mono" font-size="14.5" fill="#D4D4D4">
    <tspan fill="#4EC9B0">COUNTS_PER_ROTATION</tspan><tspan>    = </tspan><tspan fill="#569CD6">909.7</tspan><tspan fill="#6A9955">      // from the gearbox</tspan>
  </text>
  <text x="84" y="694" class="mono" font-size="14.5" fill="#D4D4D4">
    <tspan fill="#4EC9B0">WHEEL_CIRCUMFERENCE_MM</tspan><tspan> = </tspan><tspan fill="#569CD6">122.5</tspan><tspan fill="#6A9955">      // from this graphic</tspan>
  </text>
  <text x="84" y="730" class="mono" font-size="16" font-weight="700" fill="#D4D4D4">
    <tspan fill="#DCDCAA">COUNTS_PER_CM</tspan><tspan> = </tspan><tspan fill="#569CD6">909.7</tspan><tspan> / </tspan><tspan fill="#CE9178">12.25</tspan><tspan> = </tspan><tspan fill="#6A9955">74.3 counts per cm</tspan>
  </text>

  <rect x="64" y="770" width="972" height="24" rx="6" fill="#F3F3F3"/>
  <text x="80" y="787" class="bodySmall">
    <tspan font-weight="700" fill="#0B1A2E">Drive 30 cm?</tspan>
    <tspan> 30 × 74.3 = </tspan>
    <tspan font-weight="800" fill="#007ACC">2229 counts</tspan>
    <tspan>. The robot does not know what a centimetre is — you taught it here.</tspan>
  </text>
</svg>
