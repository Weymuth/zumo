<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Zumo 32U4 OLED — Rear View</title>
  <desc id="desc">Rear-view instructional diagram of the Zumo 32U4 OLED showing the power switch, Micro-USB port, blue battery-power LEDs, green USB-power LED, and the correct power-switch direction.</desc>

  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0B1A2E" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font-family: Inter, Arial, sans-serif; font-size: 48px; font-weight: 800; fill: #0B1A2E; }
      .subtitle { font-family: Inter, Arial, sans-serif; font-size: 24px; font-weight: 500; fill: #3D5266; }
      .section { font-family: Inter, Arial, sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 1.3px; fill: #3D5266; }
      .heading { font-family: Inter, Arial, sans-serif; font-size: 27px; font-weight: 750; fill: #0B1A2E; }
      .body { font-family: Inter, Arial, sans-serif; font-size: 20px; font-weight: 500; fill: #1E1E1E; }
      .bodyMuted { font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 500; fill: #6A7785; }
      .badge { font-family: Inter, Arial, sans-serif; font-size: 21px; font-weight: 800; fill: #FFFFFF; }
      .switchLabel { font-family: Inter, Arial, sans-serif; font-size: 24px; font-weight: 800; fill: #0B1A2E; }
      .switchSub { font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 500; fill: #3D5266; }
      .state { font-family: Inter, Arial, sans-serif; font-size: 20px; font-weight: 800; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="1600" height="980" fill="#FFFFFF"/>

  <!-- Brand-layer title -->
  <text x="800" y="70" text-anchor="middle" class="title">Zumo 32U4 OLED — Rear View</text>
  <text x="800" y="108" text-anchor="middle" class="subtitle">Looking at the back of the robot — same scale as the top view</text>
  <line x1="74" y1="136" x2="1526" y2="136" stroke="#C9A463" stroke-width="3"/>

  <!-- Main neutral panel -->
  <rect x="64" y="174" width="1472" height="548" rx="18" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
  <text x="94" y="210" class="section">REAR HARDWARE</text>

  <!-- Robot rear view group -->
  <g transform="translate(96 250)" filter="url(#softShadow)">
    <!-- left track -->
    <rect x="0" y="40" width="150" height="260" rx="12" fill="#262626" stroke="#111416" stroke-width="3"/>
    <g stroke="#464646" stroke-width="5" stroke-linecap="round">
      <line x1="15" y1="65" x2="132" y2="65"/><line x1="15" y1="92" x2="132" y2="92"/>
      <line x1="15" y1="119" x2="132" y2="119"/><line x1="15" y1="146" x2="132" y2="146"/>
      <line x1="15" y1="173" x2="132" y2="173"/><line x1="15" y1="200" x2="132" y2="200"/>
      <line x1="15" y1="227" x2="132" y2="227"/><line x1="15" y1="254" x2="132" y2="254"/>
      <line x1="15" y1="281" x2="132" y2="281"/>
    </g>

    <!-- right track -->
    <rect x="540" y="40" width="150" height="260" rx="12" fill="#262626" stroke="#111416" stroke-width="3"/>
    <g stroke="#464646" stroke-width="5" stroke-linecap="round">
      <line x1="557" y1="65" x2="675" y2="65"/><line x1="557" y1="92" x2="675" y2="92"/>
      <line x1="557" y1="119" x2="675" y2="119"/><line x1="557" y1="146" x2="675" y2="146"/>
      <line x1="557" y1="173" x2="675" y2="173"/><line x1="557" y1="200" x2="675" y2="200"/>
      <line x1="557" y1="227" x2="675" y2="227"/><line x1="557" y1="254" x2="675" y2="254"/>
      <line x1="557" y1="281" x2="675" y2="281"/>
    </g>

    <!-- rear chassis -->
    <rect x="150" y="104" width="390" height="180" rx="8" fill="#202427" stroke="#111416" stroke-width="3"/>
    <rect x="178" y="252" width="28" height="14" rx="2" fill="#3D4449"/>
    <rect x="318" y="252" width="28" height="14" rx="2" fill="#3D4449"/>
    <rect x="456" y="252" width="28" height="14" rx="2" fill="#3D4449"/>

    <!-- power switch hardware -->
    <g transform="translate(205 66)">
      <rect x="0" y="0" width="72" height="38" rx="4" fill="#AAB2B9" stroke="#76818A" stroke-width="3"/>
      <rect x="9" y="8" width="28" height="22" rx="2" fill="#F7F8FA" stroke="#C9D0D6" stroke-width="2"/>
      <path d="M42 19 H62" stroke="#007ACC" stroke-width="6" stroke-linecap="round"/>
      <path d="M62 19 L54 12 M62 19 L54 26" fill="none" stroke="#007ACC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- USB port -->
    <g transform="translate(315 60)">
      <rect x="0" y="0" width="72" height="48" rx="4" fill="#AAB2B9" stroke="#76818A" stroke-width="3"/>
      <path d="M13 13 H59 L51 35 H21 Z" fill="#606A72" stroke="#4B545B" stroke-width="2"/>
      <rect x="22" y="18" width="28" height="10" rx="2" fill="#30363B"/>
    </g>

    <!-- LEDs -->
    <g>
      <circle cx="172" cy="143" r="13" fill="#174B73" stroke="#245E8A" stroke-width="3"/>
      <circle cx="172" cy="143" r="6" fill="#569CD6"/>
      <circle cx="345" cy="143" r="13" fill="#215B3D" stroke="#36794F" stroke-width="3"/>
      <circle cx="345" cy="143" r="6" fill="#6A9955"/>
      <circle cx="518" cy="143" r="13" fill="#174B73" stroke="#245E8A" stroke-width="3"/>
      <circle cx="518" cy="143" r="6" fill="#569CD6"/>
    </g>

    <!-- leaders and numbered callouts -->
    <g stroke="#6A7785" stroke-width="2" stroke-dasharray="3 5">
      <line x1="240" y1="30" x2="240" y2="66"/>
      <line x1="351" y1="30" x2="351" y2="60"/>
      <line x1="172" y1="183" x2="172" y2="157"/>
      <line x1="345" y1="183" x2="345" y2="157"/>
    </g>

    <g>
      <circle cx="240" cy="14" r="23" fill="#007ACC"/>
      <text x="240" y="22" text-anchor="middle" class="badge">6</text>

      <circle cx="351" cy="14" r="23" fill="#4EC9B0"/>
      <text x="351" y="22" text-anchor="middle" class="badge">7</text>

      <circle cx="172" cy="202" r="23" fill="#569CD6"/>
      <text x="172" y="210" text-anchor="middle" class="badge">8</text>

      <circle cx="345" cy="202" r="23" fill="#6A9955"/>
      <text x="345" y="210" text-anchor="middle" class="badge">9</text>
    </g>
  </g>

  <!-- Right explanation column -->
  <g transform="translate(865 246)">
    <!-- Item 6 -->
    <circle cx="28" cy="28" r="22" fill="#007ACC"/>
    <text x="28" y="36" text-anchor="middle" class="badge">6</text>
    <text x="70" y="36" class="heading">Power Switch (slide right = ON)</text>

    <!-- Item 7 -->
    <circle cx="28" cy="102" r="22" fill="#4EC9B0"/>
    <text x="28" y="110" text-anchor="middle" class="badge">7</text>
    <text x="70" y="110" class="heading">Micro-USB Port</text>

    <!-- Item 8 -->
    <circle cx="28" cy="176" r="22" fill="#569CD6"/>
    <text x="28" y="184" text-anchor="middle" class="badge">8</text>
    <text x="70" y="176" class="heading">Blue Power LEDs — battery power</text>
    <text x="70" y="207" class="bodyMuted">lit only when the power switch is ON</text>

    <!-- Item 9 -->
    <circle cx="28" cy="274" r="22" fill="#6A9955"/>
    <text x="28" y="282" text-anchor="middle" class="badge">9</text>
    <text x="70" y="274" class="heading">Green Power LED — USB power</text>
    <text x="70" y="305" class="bodyMuted">lit whenever a USB cable is live</text>

    <text x="0" y="368" class="bodyMuted">Badges 6–7 match the top-view hardware diagram.</text>
  </g>

  <!-- Bottom switch instruction panel -->
  <rect x="240" y="756" width="1120" height="170" rx="18" fill="#F3F3F3" stroke="#D4D4D4" stroke-width="2"/>
  <text x="800" y="804" text-anchor="middle" class="switchLabel">Power switch — slide RIGHT for ON</text>
  <text x="800" y="834" text-anchor="middle" class="switchSub">(as you face the back of the robot)</text>

  <g transform="translate(605 856)">
    <rect x="0" y="0" width="390" height="58" rx="8" fill="#A7AFB6" stroke="#727B83" stroke-width="3"/>
    <rect x="14" y="10" width="96" height="38" rx="4" fill="#F7F8FA" stroke="#C7CED4" stroke-width="2"/>
    <path d="M145 29 H310" stroke="#6A9955" stroke-width="14" stroke-linecap="round"/>
    <path d="M310 29 L280 10 M310 29 L280 48" fill="none" stroke="#6A9955" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="657" y="946" text-anchor="middle" class="state" fill="#7A7A7A">OFF</text>
  <text x="943" y="946" text-anchor="middle" class="state" fill="#6A9955">ON</text>
</svg>
