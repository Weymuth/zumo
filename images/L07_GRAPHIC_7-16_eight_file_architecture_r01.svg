<svg viewBox="0 0 1100 850" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="1100" height="850" fill="#F5F2E9"/>
  <rect x="0" y="0" width="1100" height="70" fill="#0B1A2E"/>
  <text x="550" y="45" fill="#ffffff" font-size="30" font-weight="bold" text-anchor="middle">THE EIGHT-FILE ARCHITECTURE</text>
  <line x1="0" y1="70" x2="1100" y2="70" stroke="#C9A463" stroke-width="3"/>

  <!-- main.cpp -->
  <rect x="400" y="105" width="300" height="90" rx="12" fill="#0B1A2E"/>
  <text x="550" y="143" font-family="Courier New, monospace" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">main.cpp</text>
  <text x="550" y="175" font-size="16" fill="#E8EEF4" text-anchor="middle">the conductor: setup() + loop()</text>

  <!-- include arrows: main -> four headers -->
  <line x1="430" y1="195" x2="158" y2="303" stroke="#007ACC" stroke-width="3"/>
  <polygon points="150,315 172,308 160,290" fill="#007ACC"/>
  <line x1="510" y1="195" x2="404" y2="303" stroke="#007ACC" stroke-width="3"/>
  <polygon points="400,315 417,306 401,291" fill="#007ACC"/>
  <line x1="590" y1="195" x2="646" y2="303" stroke="#007ACC" stroke-width="3"/>
  <polygon points="650,315 633,306 649,291" fill="#007ACC"/>
  <line x1="670" y1="195" x2="892" y2="303" stroke="#007ACC" stroke-width="3"/>
  <polygon points="900,315 878,308 890,290" fill="#007ACC"/>
  <text x="550" y="250" font-size="16" font-weight="bold" fill="#007ACC" text-anchor="middle">#include &#8212; uses the promises</text>

  <!-- header row -->
  <g>
    <rect x="35" y="315" width="230" height="110" rx="10" fill="#FFFFFF" stroke="#007ACC" stroke-width="3"/>
    <text x="150" y="352" font-family="Courier New, monospace" font-size="19" font-weight="bold" fill="#0B1A2E" text-anchor="middle">RobotConfig.h</text>
    <text x="150" y="381" font-size="15" fill="#31465B" text-anchor="middle">every tunable number</text>
    <text x="150" y="404" font-size="14" font-style="italic" fill="#66788A" text-anchor="middle">header-only: no .cpp needed</text>
  </g>
  <g>
    <rect x="285" y="315" width="230" height="110" rx="10" fill="#FFFFFF" stroke="#007ACC" stroke-width="3"/>
    <text x="400" y="352" font-family="Courier New, monospace" font-size="19" font-weight="bold" fill="#0B1A2E" text-anchor="middle">RobotSensors.h</text>
    <text x="400" y="381" font-size="15" fill="#31465B" text-anchor="middle">extern promises for all</text>
    <text x="400" y="402" font-size="15" fill="#31465B" text-anchor="middle">7 hardware objects</text>
  </g>
  <g>
    <rect x="535" y="315" width="230" height="110" rx="10" fill="#FFFFFF" stroke="#007ACC" stroke-width="3"/>
    <text x="650" y="352" font-family="Courier New, monospace" font-size="19" font-weight="bold" fill="#0B1A2E" text-anchor="middle">RobotHelpers.h</text>
    <text x="650" y="381" font-size="15" fill="#31465B" text-anchor="middle">waitForStart()</text>
    <text x="650" y="402" font-size="15" fill="#31465B" text-anchor="middle">checkBattery()</text>
  </g>
  <g>
    <rect x="785" y="315" width="230" height="110" rx="10" fill="#FFFFFF" stroke="#007ACC" stroke-width="3"/>
    <text x="900" y="352" font-family="Courier New, monospace" font-size="19" font-weight="bold" fill="#0B1A2E" text-anchor="middle">RobotMotion.h</text>
    <text x="900" y="381" font-size="15" fill="#31465B" text-anchor="middle">driveDistance()</text>
    <text x="900" y="402" font-size="15" fill="#31465B" text-anchor="middle">turnDegrees()</text>
  </g>
  <text x="550" y="465" font-size="17" font-weight="bold" fill="#0B1A2E" text-anchor="middle">HEADERS (include/) &#8212; the PROMISES</text>

  <!-- implements arrows: cpp -> header, dashed strokes with polygon heads -->
  <line x1="400" y1="560" x2="400" y2="442" stroke="#2F855A" stroke-width="3" stroke-dasharray="8 6"/>
  <polygon points="400,430 391,448 409,448" fill="#2F855A"/>
  <line x1="650" y1="560" x2="650" y2="442" stroke="#2F855A" stroke-width="3" stroke-dasharray="8 6"/>
  <polygon points="650,430 641,448 659,448" fill="#2F855A"/>
  <line x1="900" y1="560" x2="900" y2="442" stroke="#2F855A" stroke-width="3" stroke-dasharray="8 6"/>
  <polygon points="900,430 891,448 909,448" fill="#2F855A"/>
  <line x1="80" y1="510" x2="150" y2="510" stroke="#2F855A" stroke-width="3" stroke-dasharray="8 6"/>
  <polygon points="158,510 144,503 144,517" fill="#2F855A"/>
  <text x="172" y="516" font-size="16" font-weight="bold" fill="#2F855A">implements &#8212; keeps the promise</text>

  <!-- cpp row -->
  <g>
    <rect x="285" y="565" width="230" height="110" rx="10" fill="#FFFFFF" stroke="#2F855A" stroke-width="3"/>
    <text x="400" y="602" font-family="Courier New, monospace" font-size="17" font-weight="bold" fill="#245B3F" text-anchor="middle">RobotSensors.cpp</text>
    <text x="400" y="631" font-size="15" fill="#31465B" text-anchor="middle">the ONE real copy of</text>
    <text x="400" y="652" font-size="15" fill="#31465B" text-anchor="middle">every hardware object</text>
  </g>
  <g>
    <rect x="535" y="565" width="230" height="110" rx="10" fill="#FFFFFF" stroke="#2F855A" stroke-width="3"/>
    <text x="650" y="602" font-family="Courier New, monospace" font-size="17" font-weight="bold" fill="#245B3F" text-anchor="middle">RobotHelpers.cpp</text>
    <text x="650" y="631" font-size="15" fill="#31465B" text-anchor="middle">the helper code,</text>
    <text x="650" y="652" font-size="15" fill="#31465B" text-anchor="middle">moved out of main</text>
  </g>
  <g>
    <rect x="785" y="565" width="230" height="110" rx="10" fill="#FFFFFF" stroke="#2F855A" stroke-width="3"/>
    <text x="900" y="602" font-family="Courier New, monospace" font-size="17" font-weight="bold" fill="#245B3F" text-anchor="middle">RobotMotion.cpp</text>
    <text x="900" y="631" font-size="15" fill="#31465B" text-anchor="middle">the movement code</text>
    <text x="900" y="652" font-size="15" fill="#31465B" text-anchor="middle">behind the promises</text>
  </g>
  <text x="650" y="715" font-size="17" font-weight="bold" fill="#245B3F" text-anchor="middle">IMPLEMENTATIONS (src/) &#8212; the DELIVERIES</text>

  <!-- count + takeaway footer -->
  <rect x="90" y="745" width="920" height="75" rx="10" fill="#FFFFFF" stroke="#C9A463" stroke-width="2.5"/>
  <text x="550" y="777" font-size="17" font-weight="bold" fill="#0B1A2E" text-anchor="middle">1 conductor + 4 headers + 3 implementations = 8 files, each with ONE clear job.</text>
  <text x="550" y="804" font-size="15" fill="#31465B" text-anchor="middle">Learn the shape once &#8212; every project for the rest of the course fits this mold.</text>
</svg>
