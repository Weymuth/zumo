<svg viewBox="0 0 860 610" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="1" y="1" width="858" height="608" rx="10" fill="#ffffff" stroke="#d5dde3" stroke-width="2"/>

  <!-- connectors -->
  <g stroke="#7a8894" stroke-width="2" fill="none">
    <path d="M 240 74 V 108"/>
    <path d="M 390 152 H 458"/>
    <path d="M 240 184 V 238"/>
    <path d="M 390 282 H 458"/>
    <path d="M 240 314 V 368"/>
    <path d="M 390 412 H 458"/>
    <path d="M 240 444 V 498"/>
    <path d="M 390 542 H 458"/>
  </g>
  <g fill="#7a8894">
    <polygon points="233,108 240,120 247,108"/>
    <polygon points="458,145 470,152 458,159"/>
    <polygon points="233,238 240,250 247,238"/>
    <polygon points="458,275 470,282 458,289"/>
    <polygon points="233,368 240,380 247,368"/>
    <polygon points="458,405 470,412 458,419"/>
    <polygon points="233,498 240,510 247,498"/>
    <polygon points="458,535 470,542 458,549"/>
  </g>
  <!-- branch labels -->
  <g font-size="13" font-weight="bold">
    <text x="415" y="144" fill="#c0392b">No</text>
    <text x="248" y="215" fill="#2a5a42">Yes</text>
    <text x="412" y="274" fill="#2a5a42">Yes</text>
    <text x="248" y="345" fill="#c0392b">No</text>
    <text x="415" y="404" fill="#c0392b">No</text>
    <text x="248" y="475" fill="#2a5a42">Yes</text>
    <text x="412" y="534" fill="#2a5a42">Yes</text>
  </g>

  <!-- start pill -->
  <rect x="100" y="30" width="280" height="44" rx="22" fill="#c45d76" stroke="#9a4459" stroke-width="2"/>
  <text x="240" y="57" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Robot doesn't detect obstacle</text>

  <!-- question boxes -->
  <g>
    <rect x="90" y="120" width="300" height="64" rx="10" fill="#ffffff" stroke="#c45d76" stroke-width="2"/>
    <text x="240" y="146" font-size="14" fill="#2c3e50" text-anchor="middle">Is the obstacle tall enough</text>
    <text x="240" y="166" font-size="14" fill="#2c3e50" text-anchor="middle">(&gt;4cm)?</text>

    <rect x="90" y="250" width="300" height="64" rx="10" fill="#ffffff" stroke="#c45d76" stroke-width="2"/>
    <text x="240" y="276" font-size="14" fill="#2c3e50" text-anchor="middle">Is the obstacle reflective</text>
    <text x="240" y="296" font-size="14" fill="#2c3e50" text-anchor="middle">(shiny/dark surface)?</text>

    <rect x="90" y="380" width="300" height="64" rx="10" fill="#ffffff" stroke="#c45d76" stroke-width="2"/>
    <text x="240" y="406" font-size="14" fill="#2c3e50" text-anchor="middle">Are the proximity sensors</text>
    <text x="240" y="426" font-size="14" fill="#2c3e50" text-anchor="middle">initialized?</text>

    <rect x="90" y="510" width="300" height="64" rx="10" fill="#ffffff" stroke="#c45d76" stroke-width="2"/>
    <text x="240" y="536" font-size="14" fill="#2c3e50" text-anchor="middle">Is the threshold too high?</text>
    <text x="240" y="556" font-size="14" fill="#2c3e50" text-anchor="middle">(Check Serial output)</text>
  </g>

  <!-- remedy boxes -->
  <g>
    <rect x="470" y="128" width="360" height="48" rx="10" fill="#f9eef1" stroke="#c45d76" stroke-width="1.5"/>
    <text x="650" y="157" font-size="13.5" fill="#4a3a40" text-anchor="middle">Use a taller obstacle (&gt;4cm)</text>

    <rect x="470" y="252" width="360" height="60" rx="10" fill="#f9eef1" stroke="#c45d76" stroke-width="1.5"/>
    <text x="650" y="277" font-size="13.5" fill="#4a3a40" text-anchor="middle">Use a matte surface or</text>
    <text x="650" y="296" font-size="13.5" fill="#4a3a40" text-anchor="middle">try a different object</text>

    <rect x="470" y="382" width="360" height="60" rx="10" fill="#f9eef1" stroke="#c45d76" stroke-width="1.5"/>
    <text x="650" y="407" font-size="13" text-anchor="middle" font-family="'Courier New', monospace" fill="#9a4459">Add proxSensors.initFrontSensor()</text>
    <text x="650" y="426" font-size="13.5" fill="#4a3a40" text-anchor="middle">to <tspan font-family="'Courier New', monospace" fill="#9a4459">setup()</tspan></text>

    <rect x="470" y="518" width="360" height="48" rx="10" fill="#f9eef1" stroke="#c45d76" stroke-width="1.5"/>
    <text x="650" y="547" font-size="13.5" text-anchor="middle" fill="#4a3a40">Decrease <tspan font-family="'Courier New', monospace" fill="#9a4459">OBSTACLE_THRESHOLD</tspan></text>
  </g>
</svg>
