<svg viewBox="0 0 1100 850" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="tband" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a5276"/><stop offset="1" stop-color="#2e86ab"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="850" fill="#ffffff"/>
  <rect x="0" y="0" width="1100" height="70" fill="url(#tband)"/>
  <text x="550" y="45" fill="#ffffff" font-size="30" font-weight="bold" text-anchor="middle">FUNCTION ANATOMY &#8212; THE FOUR PARTS</text>

  <!-- code panel -->
  <rect x="70" y="110" width="960" height="180" rx="12" fill="#1e1e1e"/>
  <!-- signature, segmented with textLength so underlines always align -->
  <g font-family="'Courier New', monospace" font-size="30">
    <text x="120" y="185" fill="#569cd6" textLength="80">void</text>
    <text x="216" y="185" fill="#dcdcaa" textLength="260">driveDistance</text>
    <text x="476" y="185" fill="#e8e8e8" textLength="20">(</text>
    <text x="496" y="185" fill="#4ec9b0" textLength="340">float centimeters</text>
    <text x="836" y="185" fill="#e8e8e8" textLength="20">)</text>
    <text x="872" y="185" fill="#e8e8e8" textLength="20">{</text>
    <text x="150" y="235" fill="#6a9955" textLength="440">// ...the code that runs...</text>
    <text x="120" y="275" fill="#e8e8e8" textLength="20">}</text>
  </g>
  <!-- colored underlines under each part -->
  <rect x="118" y="196" width="86" height="7" rx="3.5" fill="#e74c3c"/>
  <rect x="214" y="196" width="265" height="7" rx="3.5" fill="#f39c12"/>
  <rect x="494" y="196" width="345" height="7" rx="3.5" fill="#27ae60"/>
  <rect x="868" y="196" width="28" height="7" rx="3.5" fill="#8e44ad"/>
  <rect x="116" y="286" width="28" height="7" rx="3.5" fill="#8e44ad"/>
  <!-- numbered badges above the line -->
  <g font-size="17" font-weight="bold" text-anchor="middle">
    <circle cx="161" cy="135" r="15" fill="#e74c3c"/><text x="161" y="141" fill="#ffffff">1</text>
    <circle cx="346" cy="135" r="15" fill="#f39c12"/><text x="346" y="141" fill="#ffffff">2</text>
    <circle cx="666" cy="135" r="15" fill="#27ae60"/><text x="666" y="141" fill="#ffffff">3</text>
    <circle cx="882" cy="135" r="15" fill="#8e44ad"/><text x="882" y="141" fill="#ffffff">4</text>
  </g>

  <!-- four cards -->
  <g>
    <rect x="70" y="330" width="465" height="200" rx="12" fill="#fdecea" stroke="#e74c3c" stroke-width="3"/>
    <circle cx="110" cy="370" r="17" fill="#e74c3c"/><text x="110" y="377" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="140" y="377" font-size="21" font-weight="bold" fill="#c0392b">RETURN TYPE</text>
    <text x="95" y="415" font-size="17" fill="#333333">What the function gives back when done.</text>
    <text x="95" y="443" font-size="17" fill="#333333"><tspan font-family="'Courier New', monospace" font-weight="bold">void</tspan> = "nothing to give back &#8212; I just DO."</text>
    <text x="95" y="471" font-size="17" fill="#333333">Others: <tspan font-family="'Courier New', monospace">int</tspan>, <tspan font-family="'Courier New', monospace">float</tspan>, <tspan font-family="'Courier New', monospace">bool</tspan>...</text>
    <text x="95" y="503" font-size="15" font-style="italic" fill="#777777">Like a recipe that feeds you vs. one that ends in a dish.</text>
  </g>
  <g>
    <rect x="565" y="330" width="465" height="200" rx="12" fill="#fef5e7" stroke="#f39c12" stroke-width="3"/>
    <circle cx="605" cy="370" r="17" fill="#f39c12"/><text x="605" y="377" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="635" y="377" font-size="21" font-weight="bold" fill="#b9770e">NAME</text>
    <text x="590" y="415" font-size="17" fill="#333333">How you call it from anywhere in the program:</text>
    <text x="590" y="446" font-size="17" font-family="'Courier New', monospace" fill="#333333">driveDistance(30);</text>
    <text x="590" y="477" font-size="17" fill="#333333">Verb-first names say what they do.</text>
    <text x="590" y="503" font-size="15" font-style="italic" fill="#777777">camelCase, no spaces &#8212; same rules as variables.</text>
  </g>
  <g>
    <rect x="70" y="560" width="465" height="200" rx="12" fill="#e8f6ef" stroke="#27ae60" stroke-width="3"/>
    <circle cx="110" cy="600" r="17" fill="#27ae60"/><text x="110" y="607" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="140" y="607" font-size="21" font-weight="bold" fill="#1e8449">PARAMETER</text>
    <text x="95" y="645" font-size="17" fill="#333333">The input the function needs to do its job:</text>
    <text x="95" y="676" font-size="17" fill="#333333">a <tspan font-family="'Courier New', monospace" font-weight="bold">float</tspan> named <tspan font-family="'Courier New', monospace" font-weight="bold">centimeters</tspan>.</text>
    <text x="95" y="707" font-size="17" fill="#333333">Call with 30, it drives 30. Call with 100, it drives 100.</text>
    <text x="95" y="733" font-size="15" font-style="italic" fill="#777777">One recipe, any sandwich.</text>
  </g>
  <g>
    <rect x="565" y="560" width="465" height="200" rx="12" fill="#f4ecf7" stroke="#8e44ad" stroke-width="3"/>
    <circle cx="605" cy="600" r="17" fill="#8e44ad"/><text x="605" y="607" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <text x="635" y="607" font-size="21" font-weight="bold" fill="#6c3483">BODY</text>
    <text x="590" y="645" font-size="17" fill="#333333">Everything between <tspan font-family="'Courier New', monospace" font-weight="bold">{ }</tspan> &#8212; the steps</text>
    <text x="590" y="673" font-size="17" fill="#333333">that run every time the function is called.</text>
    <text x="590" y="704" font-size="17" fill="#333333">Write it once. Call it a thousand times.</text>
    <text x="590" y="733" font-size="15" font-style="italic" fill="#777777">The recipe's instructions.</text>
  </g>

  <text x="550" y="805" font-size="16" fill="#666666" text-anchor="middle" font-style="italic">Color underlines match the numbered cards &#8212; four parts, every function, every time.</text>
</svg>
