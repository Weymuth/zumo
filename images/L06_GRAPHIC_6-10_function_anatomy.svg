<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">Function Anatomy — The Four Parts</title>
  <desc id="desc">A RoboLore instructional diagram identifying the return type, function name, parameter, and body of a C++ function.</desc>
  <rect x="0" y="0" width="1100" height="850" fill="#F5F2E9"/>

  <!-- Brand layer -->
  <text x="550" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="700" fill="#0B1A2E">Function Anatomy — The Four Parts</text>
  <text x="550" y="98" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#3D5266">Every C++ function is built from the same four structural pieces.</text>
  <line x1="60" y1="126" x2="1040" y2="126" stroke="#C9A463" stroke-width="3"/>
  <circle cx="550" cy="126" r="7" fill="#C9A463"/>

  <!-- Code panel -->
  <rect x="60" y="158" width="980" height="202" rx="18" fill="#1E1E1E" stroke="#3C3C3C" stroke-width="2"/>
  <text x="88" y="188" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2" fill="#B7C2CC">FUNCTION DEFINITION</text>

  <!-- Code line -->
  <text x="112" y="258" font-family="Courier New, monospace" font-size="31" fill="#D4D4D4">
    <tspan fill="#569CD6">void</tspan>
    <tspan fill="#DCDCAA"> driveDistance</tspan>
    <tspan fill="#D4D4D4">(</tspan>
    <tspan fill="#4EC9B0">float</tspan>
    <tspan fill="#569CD6"> centimeters</tspan>
    <tspan fill="#D4D4D4">) {</tspan>
  </text>
  <text x="140" y="310" font-family="Courier New, monospace" font-size="29" fill="#6A9955">// ...the code that runs...</text>
  <text x="112" y="342" font-family="Courier New, monospace" font-size="31" fill="#D4D4D4">}</text>

  <!-- Number badges -->
  <circle cx="147" cy="215" r="18" fill="#F44747"/>
  <text x="147" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">1</text>
  <circle cx="326" cy="215" r="18" fill="#CCA700"/>
  <text x="326" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">2</text>
  <circle cx="642" cy="215" r="18" fill="#2FA36B"/>
  <text x="642" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">3</text>
  <circle cx="856" cy="215" r="18" fill="#7E57C2"/>
  <text x="856" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">4</text>

  <!-- Underlines -->
  <line x1="113" y1="275" x2="181" y2="275" stroke="#F44747" stroke-width="7" stroke-linecap="round"/>
  <line x1="203" y1="275" x2="451" y2="275" stroke="#CCA700" stroke-width="7" stroke-linecap="round"/>
  <line x1="461" y1="275" x2="811" y2="275" stroke="#2FA36B" stroke-width="7" stroke-linecap="round"/>
  <line x1="839" y1="275" x2="869" y2="275" stroke="#7E57C2" stroke-width="7" stroke-linecap="round"/>
  <line x1="112" y1="349" x2="129" y2="349" stroke="#7E57C2" stroke-width="7" stroke-linecap="round"/>

  <!-- Card 1 -->
  <rect x="60" y="398" width="490" height="185" rx="16" fill="#F3F3F3" stroke="#D4D4D4" stroke-width="2"/>
  <rect x="60" y="398" width="9" height="185" rx="5" fill="#F44747"/>
  <circle cx="103" cy="440" r="20" fill="#F44747"/>
  <text x="103" y="447" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">1</text>
  <text x="136" y="449" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0B1A2E">Return type</text>
  <text x="86" y="487" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#3D5266">What the function gives back when it finishes.</text>
  <text x="86" y="521" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#3D5266"><tspan font-family="Courier New, monospace" font-weight="700" fill="#0B1A2E">void</tspan><tspan> means “nothing to give back — I just do.”</tspan></text>
  <text x="86" y="553" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#3D5266">Other return types include <tspan font-family="Courier New, monospace" font-weight="700" fill="#0B1A2E">int, float, and bool</tspan></text>
  <text x="86" y="574" font-family="Arial, Helvetica, sans-serif" font-size="14" font-style="italic" fill="#687B8E">Like a recipe that feeds you versus one that ends in a dish.</text>

  <!-- Card 2 -->
  <rect x="570" y="398" width="470" height="185" rx="16" fill="#F3F3F3" stroke="#D4D4D4" stroke-width="2"/>
  <rect x="570" y="398" width="9" height="185" rx="5" fill="#CCA700"/>
  <circle cx="613" cy="440" r="20" fill="#CCA700"/>
  <text x="613" y="447" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">2</text>
  <text x="646" y="449" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0B1A2E">Name</text>
  <text x="596" y="487" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#3D5266">How you call the function from anywhere in the program:</text>
  <rect x="596" y="504" width="234" height="42" rx="8" fill="#E6E9ED"/>
  <text x="612" y="532" font-family="Courier New, monospace" font-size="20" font-weight="700" fill="#0B1A2E">driveDistance(30);</text>
  <text x="596" y="567" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#3D5266">Verb-first names make the function’s job clear.</text>
  <text x="596" y="581" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" fill="#687B8E">camelCase, no spaces — the same rules as variables.</text>

  <!-- Card 3 -->
  <rect x="60" y="610" width="490" height="176" rx="16" fill="#F3F3F3" stroke="#D4D4D4" stroke-width="2"/>
  <rect x="60" y="610" width="9" height="176" rx="5" fill="#2FA36B"/>
  <circle cx="103" cy="652" r="20" fill="#2FA36B"/>
  <text x="103" y="659" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">3</text>
  <text x="136" y="661" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0B1A2E">Parameter</text>
  <text x="86" y="699" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#3D5266">The input the function needs to do its job:</text>
  <text x="86" y="735" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#3D5266">a </text>
  <text x="104" y="735" font-family="Courier New, monospace" font-size="19" font-weight="700" fill="#0B1A2E">float</text>
  <text x="164" y="735" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#3D5266"> named </text>
  <text x="235" y="735" font-family="Courier New, monospace" font-size="19" font-weight="700" fill="#0B1A2E">centimeters</text>
  <text x="86" y="768" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#3D5266">Call with 30, it drives 30. Call with 100, it drives 100.</text>
  <text x="86" y="782" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" fill="#687B8E">One recipe, any sandwich.</text>

  <!-- Card 4 -->
  <rect x="570" y="610" width="470" height="176" rx="16" fill="#F3F3F3" stroke="#D4D4D4" stroke-width="2"/>
  <rect x="570" y="610" width="9" height="176" rx="5" fill="#7E57C2"/>
  <circle cx="613" cy="652" r="20" fill="#7E57C2"/>
  <text x="613" y="659" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">4</text>
  <text x="646" y="661" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0B1A2E">Body</text>
  <text x="596" y="699" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#3D5266">Everything between </text>
  <text x="775" y="699" font-family="Courier New, monospace" font-size="19" font-weight="700" fill="#0B1A2E">{ }</text>
  <text x="812" y="699" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#3D5266"> — the steps</text>
  <text x="596" y="731" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#3D5266">that run each time the function is called.</text>
  <text x="596" y="765" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#3D5266">Write it once. Call it a thousand times.</text>
  <text x="596" y="782" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" fill="#687B8E">The recipe’s instructions.</text>

  <!-- Footer note -->
  <line x1="60" y1="809" x2="1040" y2="809" stroke="#C9A463" stroke-width="2"/>
  <circle cx="89" cy="830" r="18" fill="#0E3B83"/>
  <text x="89" y="837" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#F5F2E9">i</text>
  <text x="122" y="837" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#3D5266">The colored underlines match the numbered cards: four parts, every function, every time.</text>
</svg>