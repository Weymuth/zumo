<svg viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <!-- Title -->
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#2c3e50">Zumo 32U4 OLED — Hardware Diagram</text>
  <text x="380" y="60" text-anchor="middle" font-size="13" fill="#6c757d">Top view — front of robot at top</text>

  <!-- ===== ROBOT (top view, 98 mm x 98 mm square footprint incl. blade) ===== -->
  <!-- Tracks (flat ends) -->
  <rect x="60" y="124" width="55" height="312" rx="4" fill="#2b2b2b" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="345" y="124" width="55" height="312" rx="4" fill="#2b2b2b" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Tread marks -->
  <g stroke="#454545" stroke-width="3" stroke-linecap="round">
    <line x1="66" y1="140" x2="109" y2="140"/><line x1="66" y1="159" x2="109" y2="159"/>
    <line x1="66" y1="178" x2="109" y2="178"/><line x1="66" y1="197" x2="109" y2="197"/>
    <line x1="66" y1="216" x2="109" y2="216"/><line x1="66" y1="235" x2="109" y2="235"/>
    <line x1="66" y1="254" x2="109" y2="254"/><line x1="66" y1="273" x2="109" y2="273"/>
    <line x1="66" y1="292" x2="109" y2="292"/><line x1="66" y1="311" x2="109" y2="311"/>
    <line x1="66" y1="330" x2="109" y2="330"/><line x1="66" y1="349" x2="109" y2="349"/>
    <line x1="66" y1="368" x2="109" y2="368"/><line x1="66" y1="387" x2="109" y2="387"/>
    <line x1="66" y1="406" x2="109" y2="406"/><line x1="66" y1="425" x2="109" y2="425"/>
    <line x1="351" y1="140" x2="394" y2="140"/><line x1="351" y1="159" x2="394" y2="159"/>
    <line x1="351" y1="178" x2="394" y2="178"/><line x1="351" y1="197" x2="394" y2="197"/>
    <line x1="351" y1="216" x2="394" y2="216"/><line x1="351" y1="235" x2="394" y2="235"/>
    <line x1="351" y1="254" x2="394" y2="254"/><line x1="351" y1="273" x2="394" y2="273"/>
    <line x1="351" y1="292" x2="394" y2="292"/><line x1="351" y1="311" x2="394" y2="311"/>
    <line x1="351" y1="330" x2="394" y2="330"/><line x1="351" y1="349" x2="394" y2="349"/>
    <line x1="351" y1="368" x2="394" y2="368"/><line x1="351" y1="387" x2="394" y2="387"/>
    <line x1="351" y1="406" x2="394" y2="406"/><line x1="351" y1="425" x2="394" y2="425"/>
  </g>

  <!-- Main board (PCB) -->
  <rect x="115" y="136" width="230" height="300" rx="4" fill="#23272b" stroke="#15181a" stroke-width="2"/>

  <!-- Front blade (drawn over tracks/board front) -->
  <polygon points="120,96 340,96 365,162 95,162" fill="#ced4da" stroke="#adb5bd" stroke-width="2"/>
  <line x1="122" y1="108" x2="338" y2="108" stroke="#adb5bd" stroke-width="1.5"/>

  <!-- Silkscreen label -->
  <text x="230" y="188" text-anchor="middle" font-size="13" font-weight="600" fill="#e9ecef" opacity="0.85">ZUMO by Pololu</text>

  <!-- OLED module -->
  <rect x="160" y="212" width="140" height="90" rx="4" fill="#0b132b" stroke="#1c2541" stroke-width="2"/>
  <rect x="172" y="224" width="116" height="66" rx="2" fill="#050609"/>
  <rect x="184" y="240" width="90" height="10" rx="5" fill="#6fc3df" opacity="0.9"/>
  <rect x="184" y="260" width="60" height="10" rx="5" fill="#6fc3df" opacity="0.65"/>

  <!-- Reset button (above Button C) -->
  <rect x="314" y="342" width="16" height="11" rx="2" fill="#8f979e" stroke="#6c757d"/>
  <circle cx="322" cy="347" r="5" fill="#e9ecef" stroke="#adb5bd" stroke-width="1.5"/>

  <!-- Buttons A / B / C (one row; A centered over USB) -->
  <rect x="221" y="376" width="22" height="14" rx="2" fill="#8f979e" stroke="#6c757d"/>
  <circle cx="232" cy="383" r="7" fill="#e9ecef" stroke="#adb5bd" stroke-width="1.5"/>
  <rect x="266" y="376" width="22" height="14" rx="2" fill="#8f979e" stroke="#6c757d"/>
  <circle cx="277" cy="383" r="7" fill="#e9ecef" stroke="#adb5bd" stroke-width="1.5"/>
  <rect x="311" y="376" width="22" height="14" rx="2" fill="#8f979e" stroke="#6c757d"/>
  <circle cx="322" cy="383" r="7" fill="#e9ecef" stroke="#adb5bd" stroke-width="1.5"/>

  <!-- Power switch (at rear edge, under Button A's old spot) -->
  <rect x="162" y="418" width="34" height="18" rx="2" fill="#8f979e" stroke="#6c757d"/>
  <rect x="166" y="421" width="12" height="12" rx="1" fill="#f1f3f5"/>

  <!-- Micro-USB port (rear edge center, trapezoid micro-B opening) -->
  <rect x="214" y="410" width="36" height="26" rx="2" fill="#aeb6bd" stroke="#868e96" stroke-width="1.5"/>
  <polygon points="221,416 243,416 243,421 238,428 226,428 221,421" fill="#495057"/>

  <!-- ===== Badge ticks (short dotted, no arrows) ===== -->
  <g stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="2 3">
    <line x1="232" y1="358" x2="232" y2="372"/>   <!-- 2 -> Button A -->
    <line x1="277" y1="406" x2="277" y2="394"/>   <!-- 3 -> Button B -->
    <line x1="322" y1="406" x2="322" y2="394"/>   <!-- 4 -> Button C -->
    <line x1="322" y1="326" x2="322" y2="338"/>   <!-- 5 -> Reset -->
    <line x1="179" y1="452" x2="179" y2="440"/>   <!-- 6 -> Power switch -->
    <line x1="232" y1="452" x2="232" y2="440"/>   <!-- 7 -> USB -->
  </g>

  <!-- ===== Numbered badges ===== -->
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <circle cx="312" cy="218" r="11" fill="#9b6a9e" stroke="#ffffff" stroke-width="1.5"/>
    <text x="312" y="222.5" fill="#ffffff">1</text>
    <circle cx="232" cy="346" r="11" fill="#3498db" stroke="#ffffff" stroke-width="1.5"/>
    <text x="232" y="350.5" fill="#ffffff">2</text>
    <circle cx="277" cy="418" r="11" fill="#3498db" stroke="#ffffff" stroke-width="1.5"/>
    <text x="277" y="422.5" fill="#ffffff">3</text>
    <circle cx="322" cy="418" r="11" fill="#3498db" stroke="#ffffff" stroke-width="1.5"/>
    <text x="322" y="422.5" fill="#ffffff">4</text>
    <circle cx="322" cy="314" r="11" fill="#c45d76" stroke="#ffffff" stroke-width="1.5"/>
    <text x="322" y="318.5" fill="#ffffff">5</text>
    <circle cx="179" cy="464" r="11" fill="#3a7d5c" stroke="#ffffff" stroke-width="1.5"/>
    <text x="179" y="468.5" fill="#ffffff">6</text>
    <circle cx="232" cy="464" r="11" fill="#b7950b" stroke="#ffffff" stroke-width="1.5"/>
    <text x="232" y="468.5" fill="#ffffff">7</text>
  </g>

  <!-- ===== Legend ===== -->
  <g font-size="16" font-weight="600" fill="#2c3e50">
    <circle cx="452" cy="166" r="12" fill="#9b6a9e" stroke="#ffffff" stroke-width="1.5"/>
    <text x="452" y="171" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">1</text>
    <text x="476" y="171">OLED Display</text>

    <circle cx="452" cy="210" r="12" fill="#3498db" stroke="#ffffff" stroke-width="1.5"/>
    <text x="452" y="215" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">2</text>
    <text x="476" y="215">Button A</text>

    <circle cx="452" cy="254" r="12" fill="#3498db" stroke="#ffffff" stroke-width="1.5"/>
    <text x="452" y="259" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">3</text>
    <text x="476" y="259">Button B</text>

    <circle cx="452" cy="298" r="12" fill="#3498db" stroke="#ffffff" stroke-width="1.5"/>
    <text x="452" y="303" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">4</text>
    <text x="476" y="303">Button C</text>

    <circle cx="452" cy="342" r="12" fill="#c45d76" stroke="#ffffff" stroke-width="1.5"/>
    <text x="452" y="347" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">5</text>
    <text x="476" y="347">Reset Button</text>

    <circle cx="452" cy="386" r="12" fill="#3a7d5c" stroke="#ffffff" stroke-width="1.5"/>
    <text x="452" y="391" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">6</text>
    <text x="476" y="391">Power Switch</text>

    <circle cx="452" cy="430" r="12" fill="#b7950b" stroke="#ffffff" stroke-width="1.5"/>
    <text x="452" y="435" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">7</text>
    <text x="476" y="435">Micro-USB Port</text>
  </g>
</svg>
