<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
  <title id="title">A header file in the wrong folder, and the error it produces</title>
  <desc id="desc">Instructional figure showing the PlatformIO Explorer tree with a header wrongly placed in src/, beside the undefined-reference error that follows.</desc>
  <rect x="0" y="0" width="1100" height="520" fill="#FFFFFF"/>
  <rect x="40" y="24" width="1020" height="48" rx="6" fill="#0B1A2E"/>
  <rect x="40" y="72" width="1020" height="3" fill="#C9A463"/>
  <text x="60" y="55" fill="#FFFFFF" font-size="23" font-weight="700">ERROR 3 &#8212; THE FILE IS IN THE WRONG FOLDER</text>
  <text x="1040" y="54" fill="#D7E0EA" font-size="13" text-anchor="end">Zumo 32U4 Robotics &#183; Lesson 7</text>
  <rect x="52" y="96" width="996" height="240" rx="10" fill="#1E1E1E" stroke="#0F1720" stroke-width="2"/>
  <rect x="52" y="96" width="996" height="30" fill="#333333"/>
  <circle cx="74" cy="111" r="6" fill="#FF5F57"/>
  <circle cx="94" cy="111" r="6" fill="#FEBC2E"/>
  <circle cx="114" cy="111" r="6" fill="#28C840"/>
  <text x="550" y="116" fill="#CFCFCF" font-size="13" font-weight="400" text-anchor="middle">EXPLORER &#8212; zumo-lesson-07</text>
  <rect x="52" y="310" width="996" height="26" fill="#007ACC"/>
  <text x="70" y="328" fill="#FFFFFF" font-size="12" font-weight="400" text-anchor="start">PlatformIO &#183; env:zumo32U4</text>
  <text x="88" y="160" fill="#C5C5C5" font-family="Courier New, monospace" font-size="15" font-weight="400" xml:space="preserve">zumo-lesson-07</text>
  <text x="112" y="184" fill="#C5C5C5" font-family="Courier New, monospace" font-size="15" font-weight="400" xml:space="preserve">include/</text>
  <text x="140" y="208" fill="#9C9C9C" font-family="Courier New, monospace" font-size="14" font-weight="400" xml:space="preserve">RobotConfig.h</text>
  <text x="112" y="232" fill="#C5C5C5" font-family="Courier New, monospace" font-size="15" font-weight="400" xml:space="preserve">src/</text>
  <text x="140" y="256" fill="#9C9C9C" font-family="Courier New, monospace" font-size="14" font-weight="400" xml:space="preserve">main.cpp</text>
  <text x="140" y="280" fill="#9C9C9C" font-family="Courier New, monospace" font-size="14" font-weight="400" xml:space="preserve">RobotMotion.cpp</text>
  <text x="140" y="304" fill="#f14c4c" font-family="Courier New, monospace" font-size="14" font-weight="700" xml:space="preserve">RobotMotion.h</text>
  <text x="430" y="310" fill="#F8B4B4" font-size="15" font-weight="700" text-anchor="start">this header belongs in include/</text>
  <path d="M 300 304 L 420 304" stroke="#f14c4c" stroke-width="2"/>
  <path d="M 300 304 L 312 299 L 312 309 Z" fill="#f14c4c"/>
  <text x="430" y="216" fill="#f14c4c" font-family="Courier New, monospace" font-size="14" font-weight="400" xml:space="preserve">undefined reference to `driveStraight()'</text>
  <text x="430" y="242" fill="#9C9C9C" font-family="Courier New, monospace" font-size="13" font-weight="400" xml:space="preserve">collect2: error: ld returned 1 exit status</text>
  <rect x="52" y="378" width="996" height="92" rx="8" fill="#FBFBFC" stroke="#D8DDE2" stroke-width="2"/>
  <text x="72" y="408" fill="#2B3A4A" font-size="16" font-weight="400" text-anchor="start">PlatformIO looks for headers in include/ and sources in src/.</text>
  <text x="72" y="434" fill="#2B3A4A" font-size="16" font-weight="400" text-anchor="start">A header in the wrong folder is never found, so the call has nothing to link against.</text>
</svg>
