<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif">
  <!-- ============ TITLE BAND ============ -->
  <defs>
    </defs>
  <rect x="0" y="0" width="1100" height="850" fill="#fafafa"/>
  <rect x="0" y="0" width="1100" height="90" fill="#0B1A2E"/>
  <text x="40" y="42" fill="#ffffff" font-size="30" font-weight="600">THE LAWNMOWER SWEEP</text>
  <text x="40" y="72" fill="#d6eaf8" font-size="18">Every row ends at the wall — and every wall contact erases the drift</text>

  <!-- ============ THE ZONE (top-down) ============ -->
  <!-- walls -->
  <rect x="120" y="150" width="620" height="560" fill="#ffffff" stroke="#5d6d7e" stroke-width="14"/>
  <text x="430" y="140" fill="#5d6d7e" font-size="16" font-weight="600" text-anchor="middle">WALLS — containment AND landmark, zero lines of code</text>

  <!-- silver entrance strip on the bottom wall -->
  <rect x="330" y="694" width="120" height="22" fill="#d5dbdb" stroke="#95a5a6" stroke-width="2"/>
  <text x="390" y="745" fill="#7f8c8d" font-size="15" text-anchor="middle">silver strip — the door (raw channel only)</text>

  <!-- black line approaching the door -->
  <rect x="384" y="716" width="12" height="60" fill="#2c3e50"/>

  <!-- sweep rows (green = sections 4-6 canon) -->
  <!-- row 0: up from entrance -->
  <polygon points="386,690 394,690 394,240 406,240 390,208 374,240 386,240" fill="#3a7d5c"/>
  <!-- corner 1: step right along top -->
  <rect x="390" y="222" width="120" height="8" fill="#3a7d5c"/>
  <!-- row 1: down, stops SHORT at the ball -->
  <polygon points="506,226 514,226 514,436 526,436 510,468 494,436 506,436" fill="#3a7d5c"/>
  <!-- ghost of the rest of row 1 (never driven) -->
  <line x1="510" y1="500" x2="510" y2="672" stroke="#a9cbb9" stroke-width="6" stroke-dasharray="10 10"/>
  <!-- corner 2 ghost -->
  <rect x="510" y="666" width="120" height="6" fill="#a9cbb9" opacity="0.7"/>
  <!-- row 2 ghost -->
  <line x1="630" y1="670" x2="630" y2="235" stroke="#a9cbb9" stroke-width="6" stroke-dasharray="10 10"/>

  <!-- the silver ball -->
  <circle cx="510" cy="505" r="24" fill="#d5dbdb" stroke="#7f8c8d" stroke-width="3"/>
  <circle cx="503" cy="497" r="7" fill="#ffffff" opacity="0.85"/>
  <text x="548" y="510" fill="#1a5276" font-size="16" font-weight="600">silver ball</text>

  <!-- prox cone ahead of the stopped robot -->
  <polygon points="510,462 492,505 528,505" fill="#f5b041" opacity="0.45"/>

  <!-- robot at the stop point -->
  <rect x="496" y="440" width="28" height="34" rx="4" fill="#2c3e50"/>
  <rect x="492" y="442" width="6" height="30" fill="#17202a"/>
  <rect x="522" y="442" width="6" height="30" fill="#17202a"/>

  <!-- row-length brackets -->
  <line x1="150" y1="240" x2="150" y2="690" stroke="#8e44ad" stroke-width="3"/>
  <line x1="142" y1="240" x2="158" y2="240" stroke="#8e44ad" stroke-width="3"/>
  <line x1="142" y1="690" x2="158" y2="690" stroke="#8e44ad" stroke-width="3"/>
  <text x="170" y="430" fill="#8e44ad" font-size="16" font-weight="600">lastRowCm</text>
  <text x="170" y="452" fill="#8e44ad" font-size="14">the wall's last</text>
  <text x="170" y="470" fill="#8e44ad" font-size="14">known address</text>

  <line x1="560" y1="240" x2="560" y2="462" stroke="#c0392b" stroke-width="3"/>
  <line x1="552" y1="240" x2="568" y2="240" stroke="#c0392b" stroke-width="3"/>
  <line x1="552" y1="462" x2="568" y2="462" stroke="#c0392b" stroke-width="3"/>
  <text x="576" y="330" fill="#c0392b" font-size="16" font-weight="600">lastLegCm</text>
  <text x="576" y="352" fill="#c0392b" font-size="14">stopped SHORT</text>
  <text x="576" y="374" fill="#c0392b" font-size="14">→ not the wall.</text>
  <text x="576" y="396" fill="#c0392b" font-size="14">A victim.</text>

  <!-- ROW_STEP_CM bracket along top -->
  <line x1="390" y1="196" x2="510" y2="196" stroke="#1a5276" stroke-width="3"/>
  <line x1="390" y1="188" x2="390" y2="204" stroke="#1a5276" stroke-width="3"/>
  <line x1="510" y1="188" x2="510" y2="204" stroke="#1a5276" stroke-width="3"/>
  <text x="450" y="180" fill="#1a5276" font-size="15" font-weight="600" text-anchor="middle">ROW_STEP_CM</text>

  <!-- ============ SIDE PANEL ============ -->
  <rect x="790" y="150" width="280" height="560" rx="10" fill="#ffffff" stroke="#d5d8dc" stroke-width="2"/>
  <text x="810" y="188" fill="#1a5276" font-size="19" font-weight="600">One row, one pass:</text>

  <text x="810" y="228" fill="#3a7d5c" font-size="16" font-weight="600">1. driveUntil(MAX_ROW_CM)</text>
  <text x="826" y="250" fill="#5d6d7e" font-size="14">TRIM keeps it straight;</text>
  <text x="826" y="268" fill="#5d6d7e" font-size="14">the prox watches ahead</text>

  <text x="810" y="304" fill="#3a7d5c" font-size="16" font-weight="600">2. Stopped. Why?</text>
  <text x="826" y="326" fill="#5d6d7e" font-size="14">Ask the odometer:</text>
  <text x="826" y="344" fill="#5d6d7e" font-size="14">about as long as last row</text>
  <text x="826" y="362" fill="#5d6d7e" font-size="14">→ the WALL. Well short</text>
  <text x="826" y="380" fill="#5d6d7e" font-size="14">→ a VICTIM.</text>

  <text x="810" y="416" fill="#3a7d5c" font-size="16" font-weight="600">3. Lawnmower corner</text>
  <text x="826" y="438" fill="#5d6d7e" font-size="14">turnDegreesGyro(90 × dir)</text>
  <text x="826" y="456" fill="#5d6d7e" font-size="14">driveDistance(ROW_STEP_CM)</text>
  <text x="826" y="474" fill="#5d6d7e" font-size="14">turnDegreesGyro(90 × dir)</text>
  <text x="826" y="492" fill="#5d6d7e" font-size="14">then dir flips sign</text>

  <rect x="810" y="524" width="240" height="160" rx="8" fill="#e8f5e9" stroke="#3a7d5c" stroke-width="2"/>
  <text x="826" y="552" fill="#1a5276" font-size="15" font-weight="600">Why the sweep can be</text>
  <text x="826" y="572" fill="#1a5276" font-size="15" font-weight="600">trusted:</text>
  <text x="826" y="598" fill="#2c3e50" font-size="14">dead reckoning drifts, but</text>
  <text x="826" y="618" fill="#2c3e50" font-size="14">every row ends ON the wall.</text>
  <text x="826" y="638" fill="#2c3e50" font-size="14">The error is erased once</text>
  <text x="826" y="658" fill="#2c3e50" font-size="14">per row — for free.</text>

  <!-- footer strip -->
  <rect x="0" y="780" width="1100" height="70" fill="#eaf2f8"/>
  <text x="40" y="822" fill="#1a5276" font-size="16">Solid green = rows driven · dashed = the rest of the pattern · the amber cone is the prox’s view · Lesson 13, GRAPHIC 13.1</text>
</svg>