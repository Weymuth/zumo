  <g font-family="'Courier New', Courier, monospace" font-size="13" fill="#2c3e50">
    <text x="345" y="512" textLength="60">display;</text>
    <text x="345" y="531" textLength="53">buzzer;</text>
    <text x="345" y="550" textLength="53">motors;</text>
    <text x="345" y="569" textLength="68">encoders;</text>
