<svg viewBox="0 0 900 645" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="1" y="1" width="898" height="643" rx="10" fill="#ffffff" stroke="#d5dde3" stroke-width="2"/>

  <!-- ===== connectors: elbow lines, single-polygon heads ===== -->
