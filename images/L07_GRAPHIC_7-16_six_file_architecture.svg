  <g font-family="'Courier New', Courier, monospace" font-size="13" fill="#2c3e50">
    <text x="50" y="318" textLength="98">COUNTS_PER_CM</text>
    <text x="50" y="340" textLength="83">DRIVE_SPEED</text>
    <text x="50" y="362" textLength="90">BATTERY_GOOD</text>
