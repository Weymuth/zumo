  <g font-family="'Courier New', Courier, monospace" font-size="13" fill="#2c3e50">
    <text x="230" y="82"  fill="#8a959e" textLength="158">#include &lt;Zumo32U4.h&gt;</text>
    <text x="230" y="100" fill="#8a959e" textLength="180">#include "RobotConfig.h"</text>
    <text x="418" y="100" fill="#8a959e" textLength="188">#include "RobotSensors.h"</text>
    <text x="230" y="118" fill="#8a959e" textLength="180">#include "RobotMotion.h"</text>
    <text x="230" y="142" textLength="352">void setup() { battery check → welcome screen }</text>
    <text x="230" y="164" textLength="390">void loop()  { driveDistance(10); turnDegrees(90); }</text>
  </g>

