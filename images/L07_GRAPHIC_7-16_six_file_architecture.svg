  </g>
  <!-- RobotMotion.cpp -->
  <rect x="620" y="462" width="250" height="150" rx="8" fill="#ffffff" stroke="#3a7d5c" stroke-width="2"/>
  <rect x="620" y="462" width="250" height="28" rx="8" fill="#2a5a42"/>
  <rect x="620" y="478" width="250" height="12" fill="#2a5a42"/>
  <text x="745" y="482" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="'Courier New', monospace">RobotMotion.cpp</text>
  <g font-family="'Courier New', Courier, monospace" font-size="13" fill="#2c3e50">
    <text x="640" y="512" fill="#8a959e" textLength="188">#include "RobotSensors.h"</text>
    <text x="640" y="531" fill="#8a959e" textLength="180">#include "RobotConfig.h"</text>
    <text x="640" y="558" textLength="150">void driveDistance()</text>
    <text x="640" y="582" textLength="135">void turnDegrees()</text>
