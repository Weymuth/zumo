    <polygon points="443,250 450,262 457,250"/>
    <polygon points="738,250 745,262 752,250"/>
    <polygon points="443,400 450,388 457,400"/>
    <polygon points="738,400 745,388 752,400"/>
  </g>
  <g font-size="13" font-style="italic" fill="#7a8894">
    <text x="460" y="225">#include</text>
    <text x="460" y="440">implements</text>
    <text x="755" y="440">implements</text>
  </g>

  <!-- ===== main.cpp box ===== -->
  <rect x="210" y="30" width="480" height="150" rx="8" fill="#ffffff" stroke="#2a5a42" stroke-width="2"/>
