  <rect x="325" y="462" width="250" height="150" rx="8" fill="#ffffff" stroke="#3a7d5c" stroke-width="2"/>
  <rect x="325" y="462" width="250" height="28" rx="8" fill="#2a5a42"/>
  <rect x="325" y="478" width="250" height="12" fill="#2a5a42"/>
