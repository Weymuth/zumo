  <rect x="620" y="262" width="250" height="28" rx="8" fill="#1a5276"/>
  <rect x="620" y="278" width="250" height="12" fill="#1a5276"/>
  <text x="745" y="282" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="'Courier New', monospace">RobotMotion.h</text>
