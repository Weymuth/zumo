<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="titleBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a5276"/>
      <stop offset="100%" stop-color="#2e86ab"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef2f5"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1100" height="850" fill="#ffffff"/>
  <rect x="0" y="0" width="1100" height="72" fill="url(#titleBand)"/>
  <text x="34" y="46" font-size="27" font-weight="bold" fill="#ffffff">GRAPHIC 6.6 &#8212; Where the Encoders Actually Are</text>
  <text x="1066" y="46" font-size="17" fill="#d6e9f2" text-anchor="end">Lesson 6 &#183; &#167;4</text>

  <rect x="40" y="100" width="640" height="500" rx="10" fill="url(#panelGrad)" stroke="#c8d2da" stroke-width="2"/>
  <text x="60" y="132" font-size="16" font-weight="bold" fill="#2a5a42">TOP-DOWN &#8212; you will never see these. They are inside the motors.</text>

  <rect x="196" y="180" width="290" height="360" rx="14" fill="#d5dbdb" stroke="#7f8c8d" stroke-width="3"/>
  <text x="341" y="368" font-size="15" font-weight="bold" fill="#566573" text-anchor="middle">ZUMO 32U4</text>
  <text x="341" y="390" font-size="12" fill="#7a8a96" text-anchor="middle">(front of robot at the top)</text>
  <polygon points="341,196 356,222 326,222" fill="#7f8c8d"/>

  <rect x="150" y="230" width="56" height="122" rx="4" fill="#2c3e50" stroke="#1b262c" stroke-width="3"/>
  <rect x="476" y="230" width="56" height="122" rx="4" fill="#2c3e50" stroke="#1b262c" stroke-width="3"/>
  <text x="178" y="222" font-size="12" font-weight="bold" fill="#34495e" text-anchor="middle">L track</text>
  <text x="504" y="222" font-size="12" font-weight="bold" fill="#34495e" text-anchor="middle">R track</text>

  <rect x="216" y="252" width="94" height="66" rx="4" fill="#5d6d7e" stroke="#34495e" stroke-width="2"/>
  <text x="263" y="292" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">MOTOR L</text>
  <rect x="372" y="252" width="94" height="66" rx="4" fill="#5d6d7e" stroke="#34495e" stroke-width="2"/>
  <text x="419" y="292" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">MOTOR R</text>

  <circle cx="263" cy="285" r="15" fill="#2a5a42" stroke="#1d3f2e" stroke-width="3"/>
  <circle cx="419" cy="285" r="15" fill="#2a5a42" stroke="#1d3f2e" stroke-width="3"/>

  <polygon points="118,285 236,285 236,277 254,290 236,303 236,295 118,295" fill="#2a5a42" stroke="#1d3f2e" stroke-width="2"/>
  <polygon points="564,285 446,285 446,277 428,290 446,303 446,295 564,295" fill="#2a5a42" stroke="#1d3f2e" stroke-width="2"/>
  <text x="112" y="264" font-size="13" font-weight="bold" fill="#2a5a42" text-anchor="end">ENCODER</text>
  <text x="570" y="264" font-size="13" font-weight="bold" fill="#2a5a42">ENCODER</text>

  <rect x="196" y="428" width="290" height="86" rx="6" fill="#e8f3ec" stroke="#2a5a42" stroke-width="2"/>
  <text x="341" y="454" font-size="13" font-weight="bold" fill="#2a5a42" text-anchor="middle">TWO wheels. TWO encoders.</text>
  <text x="341" y="478" font-size="12" fill="#4a6b58" text-anchor="middle">They count SEPARATELY, and they do</text>
  <text x="341" y="498" font-size="12" font-weight="bold" fill="#2a5a42" text-anchor="middle">not have to agree.</text>

  <rect x="716" y="100" width="344" height="500" rx="10" fill="#e8f3ec" stroke="#2a5a42" stroke-width="2"/>
  <rect x="716" y="100" width="344" height="42" rx="10" fill="#2a5a42"/>
  <rect x="716" y="128" width="344" height="14" fill="#2a5a42"/>
  <text x="740" y="129" font-size="16" font-weight="bold" fill="#ffffff">READING THEM</text>
  <rect x="740" y="164" width="296" height="94" rx="5" fill="#1e1e1e"/>
  <text x="756" y="192" font-family="Consolas, Monaco, monospace" font-size="13" fill="#9cdcfe" textLength="266" lengthAdjust="spacingAndGlyphs">encoders.getCountsLeft();</text>
  <text x="756" y="218" font-family="Consolas, Monaco, monospace" font-size="13" fill="#9cdcfe" textLength="280" lengthAdjust="spacingAndGlyphs">encoders.getCountsRight();</text>
  <text x="756" y="244" font-size="12" fill="#6a9955">two numbers, not one</text>

  <text x="740" y="294" font-size="14" fill="#1c3b2a">Drive straight and the two counts</text>
  <text x="740" y="316" font-size="14" fill="#1c3b2a">should climb together.</text>
  <text x="740" y="350" font-size="14" fill="#1c3b2a">If one wheel slips, drags, or hits</text>
  <text x="740" y="372" font-size="14" fill="#1c3b2a">a crumb, its count falls behind &#8212;</text>
  <text x="740" y="394" font-size="14" font-weight="bold" fill="#2a5a42">and the robot has silently curved.</text>

  <rect x="740" y="422" width="296" height="70" rx="5" fill="#fff8e1" stroke="#ffc107" stroke-width="2"/>
  <text x="758" y="446" font-size="13" font-weight="bold" fill="#856404">Watch ONE encoder and you will</text>
  <text x="758" y="466" font-size="13" font-weight="bold" fill="#856404">never see it happen.</text>
  <text x="758" y="484" font-size="12" font-style="italic" fill="#a07a12">This is why we average BOTH.</text>

  <text x="740" y="528" font-size="13" fill="#4a6b58">The encoder cannot see the floor,</text>
  <text x="740" y="548" font-size="13" fill="#4a6b58">the wall, or the line. It only knows</text>
  <text x="740" y="568" font-size="13" font-weight="bold" fill="#2a5a42">how far its own wheel turned.</text>

  <rect x="40" y="624" width="1020" height="188" rx="10" fill="#f4f9f6" stroke="#3a7d5c" stroke-width="2"/>
  <rect x="40" y="624" width="1020" height="42" rx="10" fill="#2a5a42"/>
  <rect x="40" y="652" width="1020" height="14" fill="#2a5a42"/>
  <text x="64" y="653" font-size="17" font-weight="bold" fill="#ffffff">A COUNT IS NOT A DISTANCE</text>
  <text x="64" y="698" font-size="15" fill="#1c3b2a">The encoder reports turning. It has no idea whether the wheel was gripping the floor or spinning in place.</text>
  <text x="64" y="730" font-size="15" fill="#1c3b2a">Lift the robot off the table and drive: the counts climb happily. The robot goes nowhere.</text>
  <text x="64" y="768" font-size="15" font-weight="bold" fill="#2a5a42">Encoders measure the WHEEL, not the WORLD. Everything in this lesson depends on the wheel not slipping.</text>
</svg>
