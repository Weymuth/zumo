<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">Where the Encoders Actually Are</title>
  <desc id="desc">A RoboLore instructional diagram showing that the Zumo 32U4 has one encoder inside each motor, why both encoder counts matter, and why encoder counts alone are not distance.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0B1A2E" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#007ACC"/>
    </marker>
    <style>
      .title { font-family: Inter, Arial, sans-serif; font-size: 38px; font-weight: 800; fill: #0B1A2E; }
      .meta { font-family: Inter, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #3D5266; }
      .section { font-family: Inter, Arial, sans-serif; font-size: 16px; font-weight: 800; letter-spacing: 1px; fill: #3D5266; }
      .head { font-family: Inter, Arial, sans-serif; font-size: 19px; font-weight: 800; fill: #0B1A2E; }
      .body { font-family: Inter, Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #14243A; }
      .small { font-family: Inter, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #5B6E83; }
      .label { font-family: Inter, Arial, sans-serif; font-size: 12px; font-weight: 800; fill: #0B1A2E; }
      .code { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 13px; font-weight: 500; }
    </style>
  </defs>

  <rect width="1100" height="850" fill="#FFFFFF"/>

  <!-- Page title -->
  <text x="40" y="50" class="title">Where the Encoders Actually Are</text>
  <text x="1060" y="46" text-anchor="end" class="meta">GRAPHIC 6.6 · Lesson 6 · §4</text>
  <line x1="40" y1="70" x2="1060" y2="70" stroke="#C9A463" stroke-width="3"/>

  <!-- Left card -->
  <rect x="40" y="96" width="642" height="496" rx="16" fill="#FFFFFF" stroke="#D6D9DD" stroke-width="2" filter="url(#shadow)"/>
  <text x="64" y="128" class="section">ENCODERS ARE INSIDE THE MOTORS</text>
  <text x="64" y="154" class="body">Top-down view — you will never see these from outside the robot.</text>

  <!-- Zumo top view -->
  <g>
    <!-- tracks -->
    <rect x="126" y="218" width="74" height="248" rx="15" fill="#263241" stroke="#0B1A2E" stroke-width="3"/>
    <rect x="522" y="218" width="74" height="248" rx="15" fill="#263241" stroke="#0B1A2E" stroke-width="3"/>
    <g stroke="#53606F" stroke-width="4" stroke-linecap="round">
      <line x1="136" y1="236" x2="190" y2="236"/><line x1="136" y1="258" x2="190" y2="258"/>
      <line x1="136" y1="280" x2="190" y2="280"/><line x1="136" y1="302" x2="190" y2="302"/>
      <line x1="136" y1="324" x2="190" y2="324"/><line x1="136" y1="346" x2="190" y2="346"/>
      <line x1="136" y1="368" x2="190" y2="368"/><line x1="136" y1="390" x2="190" y2="390"/>
      <line x1="136" y1="412" x2="190" y2="412"/><line x1="136" y1="434" x2="190" y2="434"/>
      <line x1="532" y1="236" x2="586" y2="236"/><line x1="532" y1="258" x2="586" y2="258"/>
      <line x1="532" y1="280" x2="586" y2="280"/><line x1="532" y1="302" x2="586" y2="302"/>
      <line x1="532" y1="324" x2="586" y2="324"/><line x1="532" y1="346" x2="586" y2="346"/>
      <line x1="532" y1="368" x2="586" y2="368"/><line x1="532" y1="390" x2="586" y2="390"/>
      <line x1="532" y1="412" x2="586" y2="412"/><line x1="532" y1="434" x2="586" y2="434"/>
    </g>

    <!-- chassis -->
    <path d="M202 190 H520 Q536 190 536 206 V482 Q536 498 520 498 H202 Q186 498 186 482 V206 Q186 190 202 190 Z" fill="#DCE1E5" stroke="#8A959F" stroke-width="3"/>
    <path d="M214 176 H508 L526 218 H196 Z" fill="#F4F4F2" stroke="#BFC6CC" stroke-width="2"/>
    <text x="361" y="363" text-anchor="middle" class="head" style="fill:#3D5266;">ZUMO 32U4</text>
    <text x="361" y="386" text-anchor="middle" class="small">front of robot at the top</text>
    <path d="M361 205 L374 228 H348 Z" fill="#87939D"/>

    <!-- motors -->
    <rect x="214" y="250" width="116" height="70" rx="6" fill="#53697F" stroke="#31485E" stroke-width="2"/>
    <rect x="392" y="250" width="116" height="70" rx="6" fill="#53697F" stroke="#31485E" stroke-width="2"/>
    <text x="272" y="293" text-anchor="middle" style="font-family:Inter,Arial,sans-serif;font-size:13px;font-weight:800;fill:#FFFFFF;">LEFT MOTOR</text>
    <text x="450" y="293" text-anchor="middle" style="font-family:Inter,Arial,sans-serif;font-size:13px;font-weight:800;fill:#FFFFFF;">RIGHT MOTOR</text>

    <!-- encoder discs -->
    <circle cx="272" cy="285" r="19" fill="#007ACC" stroke="#005C99" stroke-width="3"/>
    <circle cx="450" cy="285" r="19" fill="#007ACC" stroke="#005C99" stroke-width="3"/>
    <circle cx="272" cy="285" r="7" fill="#E9F6FF"/>
    <circle cx="450" cy="285" r="7" fill="#E9F6FF"/>

    <!-- encoder callouts -->
    <path d="M94 285 H244" fill="none" stroke="#007ACC" stroke-width="5" marker-end="url(#arrowBlue)"/>
    <path d="M628 285 H478" fill="none" stroke="#007ACC" stroke-width="5" marker-end="url(#arrowBlue)"/>
    <text x="90" y="264" text-anchor="end" class="label" style="fill:#007ACC;">ENCODER</text>
    <text x="632" y="264" class="label" style="fill:#007ACC;">ENCODER</text>

    <!-- track labels -->
    <text x="163" y="204" text-anchor="middle" class="label">LEFT TRACK</text>
    <text x="559" y="204" text-anchor="middle" class="label">RIGHT TRACK</text>

    <!-- inside message -->
    <rect x="222" y="418" width="278" height="96" rx="10" fill="#F4F8FB" stroke="#007ACC" stroke-width="2"/>
    <text x="361" y="449" text-anchor="middle" class="head">Two wheels. Two encoders.</text>
    <text x="361" y="475" text-anchor="middle" class="body">They count separately, and they do</text>
    <text x="361" y="498" text-anchor="middle" class="body" style="font-weight:800;fill:#007ACC;">not have to agree.</text>
  </g>

  <!-- Right card -->
  <rect x="710" y="96" width="350" height="496" rx="16" fill="#FFFFFF" stroke="#D6D9DD" stroke-width="2" filter="url(#shadow)"/>
  <rect x="710" y="96" width="350" height="58" rx="16" fill="#0B1A2E"/>
  <rect x="710" y="128" width="350" height="26" fill="#0B1A2E"/>
  <text x="734" y="133" style="font-family:Inter,Arial,sans-serif;font-size:18px;font-weight:800;fill:#FFFFFF;">READING BOTH ENCODERS</text>

  <!-- Code panel -->
  <rect x="734" y="174" width="302" height="102" rx="8" fill="#1E1E1E" stroke="#404040" stroke-width="1.5"/>
  <text x="752" y="205" class="code" fill="#9CDCFE">encoders.getCountsLeft();</text>
  <text x="752" y="234" class="code" fill="#9CDCFE">encoders.getCountsRight();</text>
  <text x="752" y="260" class="code" fill="#6A9955">// two numbers, not one</text>

  <text x="734" y="310" class="body">Drive straight and the two counts</text>
  <text x="734" y="332" class="body">should climb together.</text>

  <text x="734" y="368" class="body">If one wheel slips, drags, or hits</text>
  <text x="734" y="390" class="body">a crumb, its count falls behind —</text>
  <text x="734" y="412" class="body" style="font-weight:800;fill:#FF3B30;">and the robot has silently curved.</text>

  <!-- warning -->
  <rect x="734" y="438" width="302" height="74" rx="8" fill="#FFF9E6" stroke="#CCA700" stroke-width="2"/>
  <circle cx="758" cy="462" r="14" fill="#CCA700"/>
  <text x="758" y="468" text-anchor="middle" style="font-family:Inter,Arial,sans-serif;font-size:18px;font-weight:800;fill:#FFFFFF;">!</text>
  <text x="782" y="458" class="body" style="font-weight:800;fill:#755B00;">Watch one encoder and you will</text>
  <text x="782" y="479" class="body" style="font-weight:800;fill:#755B00;">never see it happen.</text>
  <text x="782" y="499" class="small" style="font-style:italic;fill:#8B6D00;">This is why we average both.</text>

  <text x="734" y="548" class="small">An encoder cannot see the floor, the wall,</text>
  <text x="734" y="567" class="small">or the line. It only knows</text>
  <text x="734" y="586" class="small" style="font-weight:800;fill:#007ACC;">how far its own wheel turned.</text>

  <!-- Bottom card -->
  <rect x="40" y="620" width="1020" height="190" rx="16" fill="#FFFFFF" stroke="#D6D9DD" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="620" width="1020" height="58" rx="16" fill="#0B1A2E"/>
  <rect x="40" y="650" width="1020" height="28" fill="#0B1A2E"/>
  <text x="64" y="659" style="font-family:Inter,Arial,sans-serif;font-size:18px;font-weight:800;fill:#FFFFFF;">A COUNT IS NOT A DISTANCE</text>

  <text x="64" y="713" class="body">The encoder reports turning. It has no idea whether the wheel was gripping the floor or spinning in place.</text>
  <text x="64" y="746" class="body">Lift the robot off the table and drive: the counts climb happily. The robot goes nowhere.</text>
  <line x1="64" y1="770" x2="1036" y2="770" stroke="#E5E8EB" stroke-width="2"/>
  <text x="64" y="798" class="body" style="font-weight:800;fill:#FF3B30;">Encoders measure the WHEEL, not the WORLD.</text>
  <text x="402" y="798" class="body" style="font-weight:700;">Everything in this lesson depends on the wheel not slipping.</text>
</svg>
