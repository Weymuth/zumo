<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">Graphic 10.9 — Obstacle Detection Troubleshooting</title>
  <desc id="desc">RoboLore troubleshooting flowchart for obstacle height, reflectivity, sensor initialization, and threshold settings.</desc>

  <rect x="0" y="0" width="1100" height="850" fill="#F5F2E9"/>
  <rect x="0" y="0" width="1100" height="72" fill="#0B1A2E"/>
  <text x="34" y="45" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">GRAPHIC 10.9 — Obstacle Detection Troubleshooting</text>
  <text x="1066" y="45" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#E8EEF4">check the physical setup before the code</text>
  <line x1="0" y1="72" x2="1100" y2="72" stroke="#C9A463" stroke-width="3"/>

  <rect x="42" y="102" width="1016" height="690" rx="16" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>

  <!-- connectors -->
  <g fill="none" stroke="#3D5266" stroke-width="3" stroke-linecap="round">
    <path d="M320 178 V214"/>
    <path d="M510 259 H620"/>
    <path d="M320 304 V352"/>
    <path d="M510 397 H620"/>
    <path d="M320 442 V490"/>
    <path d="M510 535 H620"/>
    <path d="M320 580 V628"/>
    <path d="M510 673 H620"/>
  </g>
  <g fill="#3D5266">
    <polygon points="311,206 320,222 329,206"/>
    <polygon points="612,250 628,259 612,268"/>
    <polygon points="311,344 320,360 329,344"/>
    <polygon points="612,388 628,397 612,406"/>
    <polygon points="311,482 320,498 329,482"/>
    <polygon points="612,526 628,535 612,544"/>
    <polygon points="311,620 320,636 329,620"/>
    <polygon points="612,664 628,673 612,682"/>
  </g>

  <!-- branch labels -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">
    <text x="540" y="249" fill="#F44747">No</text>
    <text x="332" y="334" fill="#6A9955">Yes</text>
    <text x="540" y="387" fill="#6A9955">Yes</text>
    <text x="332" y="472" fill="#F44747">No</text>
    <text x="540" y="525" fill="#F44747">No</text>
    <text x="332" y="610" fill="#6A9955">Yes</text>
    <text x="540" y="663" fill="#6A9955">Yes</text>
  </g>

  <rect x="145" y="127" width="350" height="51" rx="25.5" fill="#F44747"/>
  <text x="320" y="159" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Robot does not detect the obstacle</text>

  <!-- question boxes -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1E1E1E" text-anchor="middle">
    <rect x="130" y="222" width="380" height="82" rx="12" fill="#FFFFFF" stroke="#F44747" stroke-width="2"/>
    <text x="320" y="253">Is the obstacle tall enough</text><text x="320" y="278">(&gt; 4 cm)?</text>

    <rect x="130" y="360" width="380" height="82" rx="12" fill="#FFFFFF" stroke="#F44747" stroke-width="2"/>
    <text x="320" y="391">Is the obstacle reflective</text><text x="320" y="416">(shiny or dark surface)?</text>

    <rect x="130" y="498" width="380" height="82" rx="12" fill="#FFFFFF" stroke="#F44747" stroke-width="2"/>
    <text x="320" y="529">Are the proximity sensors</text><text x="320" y="554">initialized?</text>

    <rect x="130" y="636" width="380" height="82" rx="12" fill="#FFFFFF" stroke="#F44747" stroke-width="2"/>
    <text x="320" y="667">Is the threshold too high?</text><text x="320" y="692">Check the Serial output.</text>
  </g>

  <!-- remedy boxes -->
  <g text-anchor="middle">
    <rect x="628" y="224" width="350" height="70" rx="12" fill="#FFF1F0" stroke="#F44747" stroke-width="2"/>
    <text x="803" y="266" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1E1E1E">Use a taller obstacle (&gt; 4 cm).</text>

    <rect x="628" y="356" width="350" height="82" rx="12" fill="#FBF6E8" stroke="#CCA700" stroke-width="2"/>
    <text x="803" y="389" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1E1E1E">Use a matte surface or</text>
    <text x="803" y="414" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#1E1E1E">try a different object.</text>

    <rect x="628" y="494" width="350" height="82" rx="12" fill="#EDF4FA" stroke="#007ACC" stroke-width="2"/>
    <text x="803" y="526" font-family="Courier New, monospace" font-size="15" fill="#0B1A2E">proxSensors.initFrontSensor()</text>
    <text x="755" y="552" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1E1E1E">Add it to</text>
    <text x="765" y="552" text-anchor="start" font-family="Courier New, monospace" font-size="15" fill="#0B1A2E">setup().</text>

    <rect x="628" y="638" width="350" height="70" rx="12" fill="#EDF4FA" stroke="#007ACC" stroke-width="2"/>
    <text x="803" y="667" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1E1E1E">Decrease</text>
    <text x="803" y="692" font-family="Courier New, monospace" font-size="15" fill="#0B1A2E">OBSTACLE_THRESHOLD</text>
  </g>

  <rect x="118" y="742" width="860" height="28" rx="14" fill="#F3F3F3"/>
  <text x="548" y="762" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#3D5266">Follow the arrows downward until the answer points to a specific fix.</text>

</svg>