<svg viewBox="0 0 880 470" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="1" y="1" width="878" height="468" rx="10" fill="#ffffff" stroke="#d5dde3" stroke-width="2"/>

  <!-- connectors -->
  <g stroke="#7a8894" stroke-width="2" fill="none">
    <path d="M 235 88 V 172"/>
    <path d="M 235 228 V 312"/>
    <path d="M 350 204 H 470 V 64 H 362"/>
    <path d="M 350 344 H 510 V 52 H 362"/>
  </g>
  <!-- emergency dashed inbound -->
  <path d="M 458 352 H 548" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 5" fill="none"/>
  <g fill="#7a8894">
    <polygon points="228,172 235,184 242,172"/>
    <polygon points="228,312 235,324 242,312"/>
    <polygon points="362,57 350,64 362,71"/>
    <polygon points="362,45 350,52 362,59"/>
  </g>
  <polygon points="548,345 560,352 548,359" fill="#c0392b"/>

  <!-- transition labels -->
  <g font-size="13" font-style="italic" fill="#5a6a76">
    <text x="247" y="135">All sensors white</text>
    <text x="247" y="275">Max distance exceeded</text>
    <text x="492" y="120" transform="rotate(90 492 120)">Line found!</text>
    <text x="534" y="175" transform="rotate(90 534 175)">Search finds line</text>
  </g>
  <text x="503" y="410" font-size="13" font-style="italic" font-weight="bold" fill="#c0392b" text-anchor="middle">Extreme low readings</text>
  <text x="503" y="428" font-size="12.5" font-style="italic" fill="#c0392b" text-anchor="middle">from ANY state</text>

  <!-- state boxes (green group) -->
  <g font-family="'Courier New', Courier, monospace" font-weight="bold" text-anchor="middle">
    <rect x="120" y="40" width="230" height="48" rx="10" fill="#d7e9df" stroke="#2a5a42" stroke-width="2.5"/>
    <text x="235" y="70" font-size="15" fill="#2a5a42" textLength="140">FOLLOWING_LINE</text>

    <rect x="120" y="184" width="230" height="44" rx="10" fill="#ecf5f0" stroke="#3a7d5c" stroke-width="2"/>
    <text x="235" y="212" font-size="15" fill="#2a5a42" textLength="120">GAP_CROSSING</text>

    <rect x="120" y="324" width="230" height="44" rx="10" fill="#ecf5f0" stroke="#3a7d5c" stroke-width="2"/>
    <text x="235" y="352" font-size="15" fill="#2a5a42" textLength="90">LINE_LOST</text>
  </g>

  <!-- EMERGENCY double-border box -->
  <rect x="560" y="318" width="260" height="70" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2.5"/>
  <rect x="566" y="324" width="248" height="58" rx="7" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <text x="690" y="348" font-size="15" font-weight="bold" fill="#8e2b20" text-anchor="middle" font-family="'Courier New', monospace" textLength="130">EDGE_DETECTED</text>
  <text x="690" y="370" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle" letter-spacing="1">(EMERGENCY)</text>
</svg>
