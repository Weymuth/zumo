<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850">
<defs>
</defs>
<rect width="1100" height="850" fill="#fafafa"/>
<rect x="0" y="0" width="1100" height="70" fill="#0B1A2E"/>
<text x="550" y="45" font-family="Segoe UI,Arial" font-size="27" font-weight="bold" fill="#fff" text-anchor="middle">GRAPHIC 11.2 — Why the Cliff Alarm Always Fires Too Late</text>

<text x="550" y="106" font-family="Segoe UI,Arial" font-size="17" fill="#555" text-anchor="middle">The sensor sees white. It cannot tell you the floor is missing.</text>

<!-- ===== THE TABLE + ROBOT ===== -->
<rect x="80" y="150" width="620" height="150" fill="#d5c4a1" stroke="#8b7355" stroke-width="2"/>
<text x="300" y="285" font-family="Segoe UI,Arial" font-size="15" fill="#6b5a45">TABLE</text>
<line x1="700" y1="150" x2="700" y2="300" stroke="#8b7355" stroke-width="3"/>
<text x="790" y="240" font-family="Segoe UI,Arial" font-size="18" font-weight="bold" fill="#e74c3c">THE EDGE</text>
<text x="790" y="266" font-family="Segoe UI,Arial" font-size="14" fill="#888">(nothing below)</text>

<!-- robot body -->
<rect x="510" y="168" width="130" height="62" rx="5" fill="#34495e"/>
<text x="575" y="205" font-family="Segoe UI,Arial" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">ZUMO</text>
<!-- wheels -->
<circle cx="535" cy="238" r="14" fill="#222"/>
<circle cx="618" cy="238" r="14" fill="#222"/>
<text x="576" y="272" font-family="Segoe UI,Arial" font-size="12" fill="#555" text-anchor="middle">wheels</text>
<!-- sensor at front edge -->
<rect x="640" y="222" width="18" height="10" fill="#e74c3c"/>
<text x="649" y="150" font-family="Segoe UI,Arial" font-size="13" font-weight="bold" fill="#e74c3c" text-anchor="middle">sensors</text>
<line x1="649" y1="156" x2="649" y2="218" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="3,2"/>

<!-- the 4.5cm gap between sensor and wheel -->
<line x1="618" y1="315" x2="649" y2="315" stroke="#2980b9" stroke-width="2"/>
<line x1="618" y1="308" x2="618" y2="322" stroke="#2980b9" stroke-width="2"/>
<line x1="649" y1="308" x2="649" y2="322" stroke="#2980b9" stroke-width="2"/>
<text x="633" y="343" font-family="Segoe UI,Arial" font-size="14" font-weight="bold" fill="#2980b9" text-anchor="middle">4.5 cm</text>
<text x="633" y="362" font-family="Segoe UI,Arial" font-size="12" fill="#2980b9" text-anchor="middle">ALL the warning you get</text>

<!-- ===== THE TWO CLOCKS ===== -->
<rect x="60" y="395" width="470" height="215" rx="10" fill="#eaf4fd" stroke="#2980b9" stroke-width="2"/>
<text x="85" y="428" font-family="Segoe UI,Arial" font-size="18" font-weight="bold" fill="#1f618d">TIME YOU HAVE</text>
<text x="85" y="458" font-family="Segoe UI,Arial" font-size="14" fill="#333">Sensor-to-wheel distance:</text>
<text x="470" y="458" font-family="Consolas,monospace" font-size="15" fill="#1f618d" text-anchor="end">4.5 cm</text>
<text x="85" y="486" font-family="Segoe UI,Arial" font-size="14" fill="#333">Robot speed at BASE_SPEED 150:</text>
<text x="470" y="486" font-family="Consolas,monospace" font-size="15" fill="#1f618d" text-anchor="end">25 cm/s</text>
<line x1="85" y1="500" x2="470" y2="500" stroke="#2980b9" stroke-width="1.5"/>
<text x="85" y="530" font-family="Segoe UI,Arial" font-size="15" font-weight="bold" fill="#333">4.5 ÷ 25 =</text>
<text x="470" y="533" font-family="Consolas,monospace" font-size="26" font-weight="bold" fill="#2980b9" text-anchor="end">180 ms</text>
<text x="85" y="570" font-family="Segoe UI,Arial" font-size="13" fill="#555">…before the wheels leave the table.</text>

<rect x="570" y="395" width="470" height="215" rx="10" fill="#fdecea" stroke="#e74c3c" stroke-width="2"/>
<text x="595" y="428" font-family="Segoe UI,Arial" font-size="18" font-weight="bold" fill="#c0392b">TIME YOU MUST WAIT</text>
<text x="595" y="458" font-family="Segoe UI,Arial" font-size="14" fill="#333">Widest LEGAL gap to cross:</text>
<text x="980" y="458" font-family="Consolas,monospace" font-size="15" fill="#c0392b" text-anchor="end">10 cm</text>
<text x="595" y="486" font-family="Segoe UI,Arial" font-size="14" fill="#333">Same robot speed:</text>
<text x="980" y="486" font-family="Consolas,monospace" font-size="15" fill="#c0392b" text-anchor="end">25 cm/s</text>
<line x1="595" y1="500" x2="980" y2="500" stroke="#e74c3c" stroke-width="1.5"/>
<text x="595" y="530" font-family="Segoe UI,Arial" font-size="15" font-weight="bold" fill="#333">10 ÷ 25 =</text>
<text x="980" y="533" font-family="Consolas,monospace" font-size="26" font-weight="bold" fill="#e74c3c" text-anchor="end">400 ms</text>
<text x="595" y="570" font-family="Segoe UI,Arial" font-size="13" fill="#555">…before you may CALL it a cliff.</text>

<!-- ===== THE COLLISION ===== -->
<rect x="60" y="640" width="980" height="78" rx="8" fill="#fff8e1" stroke="#f39c12" stroke-width="2"/>
<text x="550" y="672" font-family="Consolas,monospace" font-size="21" font-weight="bold" fill="#7e5109" text-anchor="middle">400 ms  &gt;  180 ms</text>
<text x="550" y="702" font-family="Segoe UI,Arial" font-size="16" font-weight="bold" fill="#7e5109" text-anchor="middle">The alarm is not allowed to go off until 220 ms AFTER the robot has already fallen.</text>

<rect x="60" y="740" width="980" height="80" rx="8" fill="#1a5276"/>
<text x="550" y="772" font-family="Segoe UI,Arial" font-size="19" font-weight="bold" fill="#fff" text-anchor="middle">There is no threshold that works. Not a badly chosen one — there is NO SUCH NUMBER.</text>
<text x="550" y="801" font-family="Segoe UI,Arial" font-size="15" fill="#aed6f1" text-anchor="middle">Going slower shrinks BOTH numbers. The ratio never changes. You cannot fix this by tuning.</text>
</svg>