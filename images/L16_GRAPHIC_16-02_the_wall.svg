<svg viewBox="0 0 1100 850" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a5276"/>
      <stop offset="1" stop-color="#2e86ab"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1100" height="850" fill="#ffffff"/>
  <rect x="40" y="28" width="1020" height="58" rx="8" fill="url(#titleGrad)"/>
  <text x="60" y="66" fill="#ffffff" font-size="28" font-weight="bold">THE WALL</text>
  <text x="1040" y="64" fill="#d6e9f2" font-size="15" text-anchor="end">Zumo 32U4 Robotics &#183; Lesson 16</text>
  <text x="60" y="112" fill="#4d5358" font-size="15">Nine finished projects climbing one fixed ceiling &#8212; and the step that finally hits it.</text>

  <rect x="60" y="140" width="980" height="560" rx="8" fill="#fcfcfc" stroke="#dddddd"/>
  <!-- gridlines -->
  <line x1="95" y1="500" x2="1060" y2="500" stroke="#eeeeee" stroke-width="1"/>
  <line x1="95" y1="340" x2="1060" y2="340" stroke="#eeeeee" stroke-width="1"/>
  <text x="90" y="505" fill="#9aa5ab" font-size="12" text-anchor="end">10k</text>
  <text x="90" y="345" fill="#9aa5ab" font-size="12" text-anchor="end">20k</text>
  <!-- baseline -->
  <line x1="95" y1="660" x2="1060" y2="660" stroke="#4d5358" stroke-width="2"/>
  <!-- THE CEILING -->
  <line x1="95" y1="201" x2="1060" y2="201" stroke="#c0392b" stroke-width="3" stroke-dasharray="14,7"/>
  <rect x="95" y="200" width="965" height="0.0" fill="none"/>
  <text x="1058" y="191" fill="#c0392b" font-size="16" font-weight="bold" text-anchor="end">28,672 B &#8212; the bootloader keeps the rest</text>
  <rect x="110" y="430" width="64" height="230" fill="#2e86ab" rx="3"/>
  <text x="142" y="682" fill="#4d5358" font-size="14" font-weight="bold" text-anchor="middle">L7</text>
  <text x="142" y="450" fill="#ffffff" font-size="12" text-anchor="middle">14,380</text>
  <rect x="197" y="385" width="64" height="275" fill="#2e86ab" rx="3"/>
  <text x="229" y="682" fill="#4d5358" font-size="14" font-weight="bold" text-anchor="middle">L8</text>
  <text x="229" y="405" fill="#ffffff" font-size="12" text-anchor="middle">17,194</text>
  <rect x="283" y="369" width="64" height="291" fill="#2e86ab" rx="3"/>
  <text x="315" y="682" fill="#4d5358" font-size="14" font-weight="bold" text-anchor="middle">L9</text>
  <text x="315" y="389" fill="#ffffff" font-size="12" text-anchor="middle">18,158</text>
  <rect x="370" y="334" width="64" height="326" fill="#2e86ab" rx="3"/>
  <text x="402" y="682" fill="#4d5358" font-size="14" font-weight="bold" text-anchor="middle">L10</text>
  <text x="402" y="354" fill="#ffffff" font-size="12" text-anchor="middle">20,364</text>
  <rect x="456" y="331" width="64" height="329" fill="#2e86ab" rx="3"/>
  <text x="488" y="682" fill="#4d5358" font-size="14" font-weight="bold" text-anchor="middle">L11</text>
  <text x="488" y="351" fill="#ffffff" font-size="12" text-anchor="middle">20,542</text>
  <rect x="543" y="267" width="64" height="393" fill="#2e86ab" rx="3"/>
  <text x="575" y="682" fill="#4d5358" font-size="14" font-weight="bold" text-anchor="middle">L12</text>
  <text x="575" y="287" fill="#ffffff" font-size="12" text-anchor="middle">24,534</text>
  <rect x="630" y="262" width="64" height="398" fill="#2e86ab" rx="3"/>
  <text x="662" y="682" fill="#4d5358" font-size="14" font-weight="bold" text-anchor="middle">L13</text>
  <text x="662" y="282" fill="#ffffff" font-size="12" text-anchor="middle">24,902</text>
  <rect x="716" y="250" width="64" height="410" fill="#2e86ab" rx="3"/>
  <text x="748" y="682" fill="#4d5358" font-size="14" font-weight="bold" text-anchor="middle">L14</text>
  <text x="748" y="270" fill="#ffffff" font-size="12" text-anchor="middle">25,640</text>
  <rect x="803" y="211" width="64" height="449" fill="#e67e22" rx="3"/>
  <text x="835" y="682" fill="#4d5358" font-size="14" font-weight="bold" text-anchor="middle">L15</text>
  <text x="835" y="231" fill="#ffffff" font-size="12" text-anchor="middle">28,034</text>
  <rect x="889" y="201" width="64" height="459" fill="#e67e22" rx="3"/>
  <text x="921" y="682" fill="#4d5358" font-size="14" font-weight="bold" text-anchor="middle">Step 3</text>
  <text x="921" y="221" fill="#ffffff" font-size="12" text-anchor="middle">28,662</text>
  <rect x="976" y="201" width="64" height="459" fill="#c0392b" rx="3"/>
  <rect x="976" y="191" width="64" height="10" fill="#c0392b" opacity="0.45" rx="3"/>
  <text x="1008" y="183" fill="#c0392b" font-size="14" font-weight="bold" text-anchor="middle">+626</text>
  <text x="1008" y="682" fill="#4d5358" font-size="14" font-weight="bold" text-anchor="middle">Step 4</text>
  <text x="1008" y="221" fill="#ffffff" font-size="12" text-anchor="middle">29,298</text>
  <!-- annotation: Step 3 ten bytes -->
  <text x="921" y="193" fill="#e67e22" font-size="13" font-weight="bold" text-anchor="middle">10 to spare</text>

  <rect x="60" y="720" width="980" height="90" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="550" y="756" fill="#c0392b" font-size="18" font-weight="bold" text-anchor="middle">ld: region `text&#39; overflowed by 626 bytes</text>
  <text x="550" y="786" fill="#4d5358" font-size="15" text-anchor="middle">Not a mistake &#8212; a bill. Nothing more can be added. Something must be taken away.</text>
