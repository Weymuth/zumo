<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" font-family="Arial, Helvetica, sans-serif" width="1100" height="850">
  <defs>
    </defs>
  <rect x="0" y="0" width="1100" height="850" fill="#F5F2E9"/>
  <rect x="40" y="28" width="1020" height="58" rx="8" fill="#0B1A2E"/>
  <text x="60" y="66" fill="#FFFFFF" font-size="28" font-weight="bold" font-family="Arial, Helvetica, sans-serif">THE THREE MEMORIES</text>
  <text x="1040" y="64" fill="#E8EEF4" font-size="15" text-anchor="end" font-family="Arial, Helvetica, sans-serif">Zumo 32U4 Robotics · Lesson 16</text>
  <text x="60" y="112" fill="#3D5266" font-size="15" font-family="Arial, Helvetica, sans-serif">One chip, three kinds of remembering — and only one of them forgets when the battery comes out.</text>

  <!-- FLASH column -->
  <rect x="60" y="150" width="300" height="500" rx="10" fill="#EEF2F5" stroke="#3D5266" stroke-width="2"/>
  <rect x="60" y="150" width="300" height="52" rx="10" fill="#3D5266"/>
  <text x="210" y="184" fill="#FFFFFF" font-size="21" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">FLASH</text>
  <text x="210" y="238" fill="#0B1A2E" font-size="30" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">32,768 B</text>
  <!-- flash usage bar: bootloader + program -->
  <rect x="95" y="265" width="230" height="180" rx="6" fill="#FFFFFF" stroke="#b7cfdd"/>
  <rect x="95" y="265" width="230" height="24" fill="#B42318"/>
  <text x="210" y="282" fill="#FFFFFF" font-size="13" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">bootloader 4,096 B</text>
  <rect x="95" y="289" width="230" height="152" fill="#3D5266" opacity="0.85"/>
  <text x="210" y="330" fill="#FFFFFF" font-size="14" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">your program</text>
  <text x="210" y="352" fill="#FFFFFF" font-size="14" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">up to 28,672 B</text>
  <rect x="95" y="431" width="230" height="10" fill="#EDF4EE"/>
  <text x="210" y="470" fill="#3D5266" font-size="14" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Holds: the PROGRAM itself</text>
  <text x="210" y="495" fill="#3D5266" font-size="14" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Written by: upload only</text>
  <text x="210" y="520" fill="#3D5266" font-size="14" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Read: fast</text>
  <rect x="95" y="545" width="230" height="40" rx="6" fill="#2F7D55"/>
  <text x="210" y="571" fill="#FFFFFF" font-size="16" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">SURVIVES POWER-OFF</text>
  <text x="210" y="620" fill="#66788A" font-size="13" font-style="italic" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">The linker guards the door:</text>
  <text x="210" y="638" fill="#66788A" font-size="13" font-style="italic" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">28,673 bytes will not fit.</text>

  <!-- RAM column -->
  <rect x="400" y="150" width="300" height="500" rx="10" fill="#F5F0E8" stroke="#7B6240" stroke-width="2"/>
  <rect x="400" y="150" width="300" height="52" rx="10" fill="#7B6240"/>
  <text x="550" y="184" fill="#FFFFFF" font-size="21" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">RAM</text>
  <text x="550" y="238" fill="#7B6240" font-size="30" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">2,560 B</text>
  <rect x="435" y="265" width="230" height="180" rx="6" fill="#FFFFFF" stroke="#D9C5A5"/>
  <text x="550" y="310" fill="#7B6240" font-size="14" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">every variable you have:</text>
  <text x="550" y="335" fill="#7B6240" font-size="14" font-family="Courier New, monospace" text-anchor="middle">currentKp  lastError</text>
  <text x="550" y="358" fill="#7B6240" font-size="14" font-family="Courier New, monospace" text-anchor="middle">baseline  speedTrim</text>
  <text x="550" y="381" fill="#7B6240" font-size="14" font-family="Courier New, monospace" text-anchor="middle">runSumAbs ...</text>
  <text x="550" y="425" fill="#7B6240" font-size="13" font-style="italic" text-anchor="middle" font-family="Courier New, monospace">the sensors rent ~960 B of it (heap)</text>
  <text x="550" y="470" fill="#3D5266" font-size="14" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Holds: VARIABLES, now</text>
  <text x="550" y="495" fill="#3D5266" font-size="14" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Written by: every line of code</text>
  <text x="550" y="520" fill="#3D5266" font-size="14" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Read/write: fast</text>
  <rect x="435" y="545" width="230" height="40" rx="6" fill="#B42318"/>
  <text x="550" y="571" fill="#FFFFFF" font-size="16" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">DIES WITH THE POWER</text>
  <text x="550" y="620" fill="#66788A" font-size="13" font-style="italic" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">A room the lights go out in.</text>
  <text x="550" y="638" fill="#66788A" font-size="13" font-style="italic" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Every tuned gain: gone.</text>

  <!-- EEPROM column -->
  <rect x="740" y="150" width="300" height="500" rx="10" fill="#EDF4EE" stroke="#2F7D55" stroke-width="2"/>
  <rect x="740" y="150" width="300" height="52" rx="10" fill="#2F7D55"/>
  <text x="890" y="184" fill="#FFFFFF" font-size="21" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">EEPROM</text>
  <text x="890" y="238" fill="#265F45" font-size="30" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">1,024 B</text>
  <rect x="775" y="265" width="230" height="180" rx="6" fill="#FFFFFF" stroke="#C8DDD0"/>
  <text x="890" y="300" fill="#265F45" font-size="14" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">struct Saved</text>
  <text x="890" y="326" fill="#265F45" font-size="14" font-family="Courier New, monospace" text-anchor="middle">magic  0x16</text>
  <text x="890" y="349" fill="#265F45" font-size="14" font-family="Courier New, monospace" text-anchor="middle">kp kd kpS kiS</text>
  <text x="890" y="372" fill="#265F45" font-size="14" font-family="Courier New, monospace" text-anchor="middle">baseline</text>
  <text x="890" y="415" fill="#265F45" font-size="13" font-style="italic" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">~25 bytes used, 999 left</text>
  <text x="890" y="470" fill="#3D5266" font-size="14" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Holds: what the robot LEARNED</text>
  <text x="890" y="495" fill="#3D5266" font-size="14" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Write: ~3 ms per byte, stopped only</text>
  <text x="890" y="520" fill="#3D5266" font-size="14" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Endurance: ~100,000 writes/cell</text>
  <rect x="775" y="545" width="230" height="40" rx="6" fill="#2F7D55"/>
  <text x="890" y="571" fill="#FFFFFF" font-size="16" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">SURVIVES POWER-OFF</text>
  <text x="890" y="620" fill="#66788A" font-size="13" font-style="italic" text-anchor="middle" font-family="Courier New, monospace">Guarded by the magic byte:</text>
  <text x="890" y="638" fill="#66788A" font-size="13" font-style="italic" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">no fingerprint, no trust.</text>

  <!-- bottom takeaway band -->
  <rect x="60" y="690" width="980" height="110" rx="10" fill="#EEF2F5" stroke="#3D5266" stroke-width="2"/>
  <text x="550" y="732" fill="#0B1A2E" font-size="19" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Lesson 16 in one sentence:</text>
  <text x="550" y="762" fill="#3D5266" font-size="16" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Flash holds what you WROTE. RAM holds what the robot is THINKING.</text>
  <text x="550" y="786" fill="#3D5266" font-size="16" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">EEPROM holds what the robot has LEARNED — and only two of the three survive the switch.</text>
</svg>
