<svg viewBox="0 0 1100 850" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a5276"/>
      <stop offset="1" stop-color="#2e86ab"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1100" height="850" fill="#ffffff"/>
  <rect x="40" y="28" width="1020" height="58" rx="8" fill="url(#titleGrad)"/>
  <text x="60" y="66" fill="#ffffff" font-size="28" font-weight="bold">THE THREE MEMORIES</text>
  <text x="1040" y="64" fill="#d6e9f2" font-size="15" text-anchor="end">Zumo 32U4 Robotics &#183; Lesson 16</text>
  <text x="60" y="112" fill="#4d5358" font-size="15">One chip, three kinds of remembering &#8212; and only one of them forgets when the battery comes out.</text>

  <!-- FLASH column -->
  <rect x="60" y="150" width="300" height="500" rx="10" fill="#f4f9fc" stroke="#2e86ab" stroke-width="2"/>
  <rect x="60" y="150" width="300" height="52" rx="10" fill="#2e86ab"/>
  <text x="210" y="184" fill="#ffffff" font-size="21" font-weight="bold" text-anchor="middle">FLASH</text>
  <text x="210" y="238" fill="#1a5276" font-size="30" font-weight="bold" text-anchor="middle">32,768 B</text>
  <!-- flash usage bar: bootloader + program -->
  <rect x="95" y="265" width="230" height="180" rx="6" fill="#ffffff" stroke="#b7cfdd"/>
  <rect x="95" y="265" width="230" height="24" fill="#c0392b"/>
  <text x="210" y="282" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">bootloader 4,096 B</text>
  <rect x="95" y="289" width="230" height="152" fill="#2e86ab" opacity="0.85"/>
  <text x="210" y="330" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">your program</text>
  <text x="210" y="352" fill="#ffffff" font-size="14" text-anchor="middle">up to 28,672 B</text>
  <rect x="95" y="431" width="230" height="10" fill="#eef7f1"/>
  <text x="210" y="470" fill="#4d5358" font-size="14" text-anchor="middle">Holds: the PROGRAM itself</text>
  <text x="210" y="495" fill="#4d5358" font-size="14" text-anchor="middle">Written by: upload only</text>
  <text x="210" y="520" fill="#4d5358" font-size="14" text-anchor="middle">Read: fast</text>
  <rect x="95" y="545" width="230" height="40" rx="6" fill="#3a7d5c"/>
  <text x="210" y="571" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">SURVIVES POWER-OFF</text>
  <text x="210" y="620" fill="#6c757d" font-size="13" font-style="italic" text-anchor="middle">The linker guards the door:</text>
  <text x="210" y="638" fill="#6c757d" font-size="13" font-style="italic" text-anchor="middle">28,673 bytes will not fit.</text>

  <!-- RAM column -->
  <rect x="400" y="150" width="300" height="500" rx="10" fill="#fdf3e7" stroke="#e67e22" stroke-width="2"/>
  <rect x="400" y="150" width="300" height="52" rx="10" fill="#e67e22"/>
  <text x="550" y="184" fill="#ffffff" font-size="21" font-weight="bold" text-anchor="middle">RAM</text>
  <text x="550" y="238" fill="#9c5518" font-size="30" font-weight="bold" text-anchor="middle">2,560 B</text>
  <rect x="435" y="265" width="230" height="180" rx="6" fill="#ffffff" stroke="#eccfa8"/>
  <text x="550" y="310" fill="#9c5518" font-size="14" text-anchor="middle">every variable you have:</text>
  <text x="550" y="335" fill="#9c5518" font-size="14" font-family="Consolas, monospace" text-anchor="middle">currentKp  lastError</text>
  <text x="550" y="358" fill="#9c5518" font-size="14" font-family="Consolas, monospace" text-anchor="middle">baseline  speedTrim</text>
  <text x="550" y="381" fill="#9c5518" font-size="14" font-family="Consolas, monospace" text-anchor="middle">runSumAbs ...</text>
  <text x="550" y="425" fill="#9c5518" font-size="13" font-style="italic" text-anchor="middle">the sensors rent ~960 B of it (heap)</text>
  <text x="550" y="470" fill="#4d5358" font-size="14" text-anchor="middle">Holds: VARIABLES, now</text>
  <text x="550" y="495" fill="#4d5358" font-size="14" text-anchor="middle">Written by: every line of code</text>
  <text x="550" y="520" fill="#4d5358" font-size="14" text-anchor="middle">Read/write: fast</text>
  <rect x="435" y="545" width="230" height="40" rx="6" fill="#c0392b"/>
  <text x="550" y="571" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">DIES WITH THE POWER</text>
  <text x="550" y="620" fill="#6c757d" font-size="13" font-style="italic" text-anchor="middle">A room the lights go out in.</text>
  <text x="550" y="638" fill="#6c757d" font-size="13" font-style="italic" text-anchor="middle">Every tuned gain: gone.</text>

  <!-- EEPROM column -->
  <rect x="740" y="150" width="300" height="500" rx="10" fill="#eef7f1" stroke="#3a7d5c" stroke-width="2"/>
  <rect x="740" y="150" width="300" height="52" rx="10" fill="#3a7d5c"/>
  <text x="890" y="184" fill="#ffffff" font-size="21" font-weight="bold" text-anchor="middle">EEPROM</text>
  <text x="890" y="238" fill="#2a5a42" font-size="30" font-weight="bold" text-anchor="middle">1,024 B</text>
  <rect x="775" y="265" width="230" height="180" rx="6" fill="#ffffff" stroke="#bcd8c9"/>
  <text x="890" y="300" fill="#2a5a42" font-size="14" font-weight="bold" text-anchor="middle">struct Saved</text>
  <text x="890" y="326" fill="#2a5a42" font-size="14" font-family="Consolas, monospace" text-anchor="middle">magic  0x16</text>
  <text x="890" y="349" fill="#2a5a42" font-size="14" font-family="Consolas, monospace" text-anchor="middle">kp kd kpS kiS</text>
  <text x="890" y="372" fill="#2a5a42" font-size="14" font-family="Consolas, monospace" text-anchor="middle">baseline</text>
  <text x="890" y="415" fill="#2a5a42" font-size="13" font-style="italic" text-anchor="middle">~25 bytes used, 999 left</text>
  <text x="890" y="470" fill="#4d5358" font-size="14" text-anchor="middle">Holds: what the robot LEARNED</text>
  <text x="890" y="495" fill="#4d5358" font-size="14" text-anchor="middle">Write: ~3 ms per byte, stopped only</text>
  <text x="890" y="520" fill="#4d5358" font-size="14" text-anchor="middle">Endurance: ~100,000 writes/cell</text>
  <rect x="775" y="545" width="230" height="40" rx="6" fill="#3a7d5c"/>
  <text x="890" y="571" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">SURVIVES POWER-OFF</text>
  <text x="890" y="620" fill="#6c757d" font-size="13" font-style="italic" text-anchor="middle">Guarded by the magic byte:</text>
  <text x="890" y="638" fill="#6c757d" font-size="13" font-style="italic" text-anchor="middle">no fingerprint, no trust.</text>

  <!-- bottom takeaway band -->
  <rect x="60" y="690" width="980" height="110" rx="10" fill="#f4f9fc" stroke="#2e86ab" stroke-width="2"/>
  <text x="550" y="732" fill="#1a5276" font-size="19" font-weight="bold" text-anchor="middle">Lesson 16 in one sentence:</text>
  <text x="550" y="762" fill="#4d5358" font-size="16" text-anchor="middle">Flash holds what you WROTE. RAM holds what the robot is THINKING.</text>
  <text x="550" y="786" fill="#4d5358" font-size="16" text-anchor="middle">EEPROM holds what the robot has LEARNED &#8212; and only two of the three survive the switch.</text>
</svg>
