<svg viewBox="0 0 1100 420" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a5276"/>
      <stop offset="1" stop-color="#2e86ab"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1100" height="420" fill="#ffffff"/>

  <!-- Title band -->
  <rect x="40" y="24" width="1020" height="52" rx="8" fill="#0B1A2E"/>
  <text x="60" y="59" fill="#ffffff" font-size="26" font-weight="bold">THE NUMBER LINE</text>
  <text x="1040" y="57" fill="#d6e9f2" font-size="14" text-anchor="end">Zumo 32U4 Robotics &#183; Lesson 3</text>

  <!-- ===== axis line ===== -->
  <line x1="120" y1="230" x2="980" y2="230" stroke="#3a3a3a" stroke-width="4"/>
  <!-- left arrowhead (single polygon) -->
  <polygon points="120,230 148,214 148,246" fill="#c45d76"/>
  <!-- right arrowhead (single polygon) -->
  <polygon points="980,230 952,214 952,246" fill="#3a7d5c"/>
  <!-- negative half tint -->
  <rect x="148" y="226" width="402" height="8" fill="#c45d76"/>
  <!-- positive half tint -->
  <rect x="550" y="226" width="402" height="8" fill="#3a7d5c"/>

  <!-- ticks and labels: -3 -2 -1 0 1 2 3 -->
  <!-- x positions evenly: 190,310,430,550,670,790,910 -->
  <g stroke="#3a3a3a" stroke-width="3">
    <line x1="190" y1="216" x2="190" y2="244"/>
    <line x1="310" y1="216" x2="310" y2="244"/>
    <line x1="430" y1="216" x2="430" y2="244"/>
    <line x1="550" y1="210" x2="550" y2="250"/>
    <line x1="670" y1="216" x2="670" y2="244"/>
    <line x1="790" y1="216" x2="790" y2="244"/>
    <line x1="910" y1="216" x2="910" y2="244"/>
  </g>
  <text x="190" y="284" fill="#9a4459" font-size="22" font-weight="bold" text-anchor="middle">&#8722;3</text>
  <text x="310" y="284" fill="#9a4459" font-size="22" font-weight="bold" text-anchor="middle">&#8722;2</text>
  <text x="430" y="284" fill="#9a4459" font-size="22" font-weight="bold" text-anchor="middle">&#8722;1</text>
  <text x="550" y="284" fill="#1a5276" font-size="22" font-weight="bold" text-anchor="middle">0</text>
  <text x="670" y="284" fill="#2a5a42" font-size="22" font-weight="bold" text-anchor="middle">+1</text>
  <text x="790" y="284" fill="#2a5a42" font-size="22" font-weight="bold" text-anchor="middle">+2</text>
  <text x="910" y="284" fill="#2a5a42" font-size="22" font-weight="bold" text-anchor="middle">+3</text>

  <!-- meaning labels -->
  <text x="230" y="170" fill="#9a4459" font-size="16" font-weight="bold" text-anchor="middle">&#8592; NEGATIVE = backward</text>
  <text x="550" y="150" fill="#1a5276" font-size="15" font-weight="bold" text-anchor="middle">ZERO</text>
  <text x="550" y="172" fill="#1a5276" font-size="15" text-anchor="middle">= stopped</text>
  <text x="870" y="170" fill="#2a5a42" font-size="16" font-weight="bold" text-anchor="middle">forward = POSITIVE &#8594;</text>

  <text x="550" y="344" fill="#4d5358" font-size="15" text-anchor="middle">The <tspan font-weight="bold">farther from zero</tspan>, the faster &#8212; on either side.</text>

  <text x="1060" y="404" fill="#9aa0a6" font-size="11" text-anchor="end">GRAPHIC 3.17</text>
</svg>
