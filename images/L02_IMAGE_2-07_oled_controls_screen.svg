<svg viewBox="0 0 1100 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a5276"/>
      <stop offset="1" stop-color="#2e86ab"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1100" height="560" fill="#ffffff"/>

  <!-- Title band -->
  <rect x="40" y="24" width="1020" height="52" rx="8" fill="url(#titleGrad)"/>
  <text x="60" y="59" fill="#ffffff" font-size="24" font-weight="bold">OLED — CONTROLS SCREEN</text>
  <text x="1040" y="57" fill="#d6e9f2" font-size="13" text-anchor="end">Zumo 32U4 Robotics &#183; Lesson 2</text>

  <!-- PCB board -->
  <rect x="270" y="108" width="560" height="380" rx="8" fill="#2a5a2a" stroke="#1a3a1a" stroke-width="2"/>

  <!-- Connector pins at top -->
  <rect x="380" y="104" width="340" height="16" rx="2" fill="#1e3a1e"/>
  <text x="550" y="116" fill="#6a9955" font-size="10" font-family="Courier New, monospace" text-anchor="middle">GND VCC CLK MOS RES DC CS</text>

  <!-- Mounting holes -->
  <circle cx="294" cy="130" r="7" fill="#1a3a1a" stroke="#3a6a3a" stroke-width="1.5"/>
  <circle cx="806" cy="130" r="7" fill="#1a3a1a" stroke="#3a6a3a" stroke-width="1.5"/>
  <circle cx="294" cy="462" r="7" fill="#1a3a1a" stroke="#3a6a3a" stroke-width="1.5"/>
  <circle cx="806" cy="462" r="7" fill="#1a3a1a" stroke="#3a6a3a" stroke-width="1.5"/>

  <!-- Screen bezel -->
  <rect x="310" y="148" width="480" height="290" rx="4" fill="#111111" stroke="#333333" stroke-width="2"/>

  <!-- Screen area -->
  <rect x="322" y="158" width="456" height="270" rx="2" fill="#050505"/>

  <!-- Row 0: === CONTROLS === -->
  <text x="550" y="196" fill="#e8f8e8" font-size="22" font-weight="bold" font-family="Courier New, monospace" text-anchor="middle">=== CONTROLS ===</text>

  <!-- Row 2: A: About -->
  <text x="344" y="254" fill="#d0f0d0" font-size="21" font-family="Courier New, monospace">A: About</text>

  <!-- Row 3: B: This screen -->
  <text x="344" y="288" fill="#d0f0d0" font-size="21" font-family="Courier New, monospace">B: This screen</text>

  <!-- Row 4: C: Status -->
  <text x="344" y="322" fill="#d0f0d0" font-size="21" font-family="Courier New, monospace">C: Status</text>

  <!-- Callout arrows pointing to A, B, C rows -->
  <line x1="780" y1="254" x2="840" y2="248" stroke="#2e86ab" stroke-width="1.5"/>
  <rect x="840" y="236" width="200" height="26" rx="5" fill="#2e86ab"/>
  <text x="940" y="254" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Button A &#8594; About</text>

  <line x1="780" y1="288" x2="840" y2="288" stroke="#3a7d5c" stroke-width="1.5"/>
  <rect x="840" y="276" width="200" height="26" rx="5" fill="#3a7d5c"/>
  <text x="940" y="294" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Button B &#8594; Controls</text>

  <line x1="780" y1="322" x2="840" y2="328" stroke="#9b6a9e" stroke-width="1.5"/>
  <rect x="840" y="316" width="200" height="26" rx="5" fill="#9b6a9e"/>
  <text x="940" y="334" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Button C &#8594; Status</text>

  <!-- Footer -->
  <text x="550" y="516" fill="#6c757d" font-size="13" text-anchor="middle">Press Button B on your Zumo to show this screen</text>
  <text x="1060" y="548" fill="#9aa0a6" font-size="11" text-anchor="end">IMAGE 2.7</text>
</svg>
