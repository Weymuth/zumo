<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850">
<defs>
<linearGradient id="tb4" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#1a5276"/><stop offset="1" stop-color="#2e86ab"/>
</linearGradient>
</defs>
<rect width="1100" height="850" fill="#fafafa"/>
<rect x="0" y="0" width="1100" height="70" fill="url(#tb4)"/>
<text x="550" y="45" font-family="Segoe UI,Arial" font-size="27" font-weight="bold" fill="#fff" text-anchor="middle">GRAPHIC 11.4 — The Two New States</text>

<text x="550" y="108" font-family="Segoe UI,Arial" font-size="17" fill="#555" text-anchor="middle">Added to the Lesson 10 state machine. The difference between them is ONE number.</text>

<!-- FOLLOWING_LINE -->
<rect x="90" y="160" width="250" height="90" rx="10" fill="#2a5a42" stroke="#1e8449" stroke-width="2"/>
<text x="215" y="196" font-family="Consolas,monospace" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">FOLLOWING_LINE</text>
<text x="215" y="222" font-family="Segoe UI,Arial" font-size="13" fill="#a9dfbf" text-anchor="middle">P-control. Closed loop.</text>
<text x="215" y="240" font-family="Segoe UI,Arial" font-size="13" fill="#a9dfbf" text-anchor="middle">The line is steering.</text>

<!-- arrow right: line vanished -->
<polygon points="345,196 700,196 700,186 730,205 700,224 700,214 345,214" fill="#e67e22"/>
<text x="537" y="180" font-family="Segoe UI,Arial" font-size="14" font-weight="bold" fill="#b9770e" text-anchor="middle">line vanished — !isLineVisible()</text>
<text x="537" y="247" font-family="Consolas,monospace" font-size="12" fill="#b9770e" text-anchor="middle">gapStartCounts = averageCounts();   ← RE-ARM the odometer</text>

<!-- GAP_CROSSING -->
<rect x="735" y="160" width="270" height="90" rx="10" fill="#e67e22" stroke="#b9770e" stroke-width="2"/>
<text x="870" y="196" font-family="Consolas,monospace" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">GAP_CROSSING</text>
<text x="870" y="222" font-family="Segoe UI,Arial" font-size="13" fill="#fdebd0" text-anchor="middle">Blind. OPEN loop.</text>
<text x="870" y="240" font-family="Segoe UI,Arial" font-size="13" fill="#fdebd0" text-anchor="middle">TRIM is steering.</text>

<!-- return arrow: line found -->
<polygon points="730,300 380,300 380,290 350,309 380,328 380,318 730,318" fill="#27ae60"/>
<text x="540" y="290" font-family="Segoe UI,Arial" font-size="14" font-weight="bold" fill="#1e8449" text-anchor="middle">line found — isLineVisible()</text>
<text x="540" y="345" font-family="Segoe UI,Arial" font-size="12" fill="#1e8449" text-anchor="middle">Leaving this state IS the reset. The next gap gets a full budget.</text>

<!-- down arrow to LINE_LOST -->
<polygon points="855,255 855,395 845,395 870,428 895,395 885,395 885,255" fill="#e74c3c"/>
<text x="915" y="330" font-family="Segoe UI,Arial" font-size="14" font-weight="bold" fill="#c0392b">budget spent</text>
<text x="915" y="352" font-family="Consolas,monospace" font-size="12" fill="#c0392b">blindDistanceCm()</text>
<text x="915" y="370" font-family="Consolas,monospace" font-size="12" fill="#c0392b">  &gt; GAP_MAX_CM</text>

<!-- LINE_LOST -->
<rect x="735" y="435" width="270" height="95" rx="10" fill="#e74c3c" stroke="#a93226" stroke-width="2"/>
<text x="870" y="470" font-family="Consolas,monospace" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">LINE_LOST</text>
<text x="870" y="495" font-family="Segoe UI,Arial" font-size="13" fill="#fadbd8" text-anchor="middle">Motors off. Reports how far</text>
<text x="870" y="513" font-family="Segoe UI,Arial" font-size="13" fill="#fadbd8" text-anchor="middle">it got: "Blind for 12.4 cm"</text>

<!-- B to retry -->
<polygon points="730,480 480,480 480,470 450,489 480,508 480,498 730,498" fill="#7f8c8d"/>
<text x="590" y="470" font-family="Segoe UI,Arial" font-size="13" font-weight="bold" fill="#5d6d7e" text-anchor="middle">press B</text>
<rect x="240" y="450" width="205" height="70" rx="10" fill="#7f8c8d" stroke="#5d6d7e" stroke-width="2"/>
<text x="342" y="482" font-family="Consolas,monospace" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">STOPPED</text>
<text x="342" y="504" font-family="Segoe UI,Arial" font-size="12" fill="#d5dbdb" text-anchor="middle">waiting for B to go</text>

<!-- the budget bar -->
<rect x="90" y="580" width="915" height="120" rx="10" fill="#fff8e1" stroke="#f39c12" stroke-width="2"/>
<text x="115" y="612" font-family="Segoe UI,Arial" font-size="17" font-weight="bold" fill="#7e5109">THE BUDGET — the one number that separates the two states</text>
<rect x="115" y="630" width="700" height="30" fill="#fff" stroke="#bbb"/>
<rect x="115" y="630" width="470" height="30" fill="#e67e22"/>
<text x="350" y="651" font-family="Segoe UI,Arial" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">GAP_CROSSING — still under budget</text>
<text x="700" y="651" font-family="Segoe UI,Arial" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">LINE_LOST</text>
<line x1="585" y1="622" x2="585" y2="668" stroke="#c0392b" stroke-width="3"/>
<text x="585" y="686" font-family="Consolas,monospace" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">GAP_MAX_CM</text>
<text x="845" y="651" font-family="Segoe UI,Arial" font-size="13" fill="#7e5109">← YOUR number (7A)</text>

<rect x="90" y="730" width="915" height="90" rx="8" fill="#1a5276"/>
<text x="547" y="763" font-family="Segoe UI,Arial" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">The end of the line is just a gap that never closes.</text>
<text x="547" y="793" font-family="Segoe UI,Arial" font-size="15" fill="#aed6f1" text-anchor="middle">GAP_MAX_CM is the ONLY thing that stops the robot when it runs out of course.</text>
</svg>
