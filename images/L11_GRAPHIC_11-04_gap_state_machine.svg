<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850">
<rect width="1100" height="850" fill="#F5F2E9"/>
<rect x="0" y="0" width="1100" height="70" fill="#0B1A2E"/>
<text x="550" y="45" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="bold" fill="#FFFFFF" text-anchor="middle">GRAPHIC 11.4 — The Two New States</text>

<text x="550" y="108" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#3D5266" text-anchor="middle">Added to the Lesson 10 state machine. The difference between them is ONE number.</text>

<!-- FOLLOWING_LINE -->
<rect x="90" y="160" width="250" height="90" rx="10" fill="#265F45" stroke="#2F7D55" stroke-width="2"/>
<text x="215" y="196" font-family="Courier New, monospace" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">FOLLOWING_LINE</text>
<text x="215" y="222" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#D7E9DF" text-anchor="middle">P-control. Closed loop.</text>
<text x="215" y="240" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#D7E9DF" text-anchor="middle">The line is steering.</text>

<!-- arrow right: line vanished -->
<polygon points="345,196 700,196 700,186 730,205 700,224 700,214 345,214" fill="#C47A00"/>
<text x="537" y="180" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#7B6240" text-anchor="middle">line vanished — !isLineVisible()</text>
<text x="537" y="247" font-family="Courier New, monospace" font-size="12" fill="#7B6240" text-anchor="middle">gapStartCounts = averageCounts();   ← RE-ARM the odometer</text>

<!-- GAP_CROSSING -->
<rect x="735" y="160" width="270" height="90" rx="10" fill="#C47A00" stroke="#7B6240" stroke-width="2"/>
<text x="870" y="196" font-family="Courier New, monospace" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">GAP_CROSSING</text>
<text x="870" y="222" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#F7EEDC" text-anchor="middle">Blind. OPEN loop.</text>
<text x="870" y="240" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#F7EEDC" text-anchor="middle">TRIM is steering.</text>

<!-- return arrow: line found -->
<polygon points="730,300 380,300 380,290 350,309 380,328 380,318 730,318" fill="#2FAE66"/>
<text x="540" y="290" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#2F7D55" text-anchor="middle">line found — isLineVisible()</text>
<text x="540" y="345" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#2F7D55" text-anchor="middle">Leaving this state IS the reset. The next gap gets a full budget.</text>

<!-- down arrow to LINE_LOST -->
<polygon points="855,255 855,395 845,395 870,428 895,395 885,395 885,255" fill="#F44747"/>
<text x="915" y="330" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#B42318">budget spent</text>
<text x="915" y="352" font-family="Courier New, monospace" font-size="12" fill="#B42318">blindDistanceCm()</text>
<text x="915" y="370" font-family="Courier New, monospace" font-size="12" fill="#B42318">  &gt; GAP_MAX_CM</text>

<!-- LINE_LOST -->
<rect x="735" y="435" width="270" height="95" rx="10" fill="#F44747" stroke="#9F241A" stroke-width="2"/>
<text x="870" y="470" font-family="Courier New, monospace" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">LINE_LOST</text>
<text x="870" y="495" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#F8E2DF" text-anchor="middle">Motors off. Reports how far</text>
<text x="870" y="513" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#F8E2DF" text-anchor="middle">it got: "Blind for 12.4 cm"</text>

<!-- B to retry -->
<polygon points="730,480 480,480 480,470 450,489 480,508 480,498 730,498" fill="#66788A"/>
<text x="590" y="470" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#3D5266" text-anchor="middle">press B</text>
<rect x="240" y="450" width="205" height="70" rx="10" fill="#66788A" stroke="#3D5266" stroke-width="2"/>
<text x="342" y="482" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">STOPPED</text>
<text x="342" y="504" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#D8E0E5" text-anchor="middle">waiting for B to go</text>

<!-- the budget bar -->
<rect x="90" y="580" width="915" height="120" rx="10" fill="#F8F5EA" stroke="#CCA700" stroke-width="2"/>
<text x="115" y="612" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#6A5335">THE BUDGET — the one number that separates the two states</text>
<rect x="115" y="630" width="700" height="30" fill="#fff" stroke="#AAB4BD"/>
<rect x="115" y="630" width="470" height="30" fill="#C47A00"/>
<text x="350" y="651" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">GAP_CROSSING — still under budget</text>
<text x="700" y="651" font-family="Courier New, monospace" font-size="13" font-weight="bold" fill="#B42318" text-anchor="middle">LINE_LOST</text>
<line x1="585" y1="622" x2="585" y2="668" stroke="#B42318" stroke-width="3"/>
<text x="585" y="686" font-family="Courier New, monospace" font-size="13" font-weight="bold" fill="#B42318" text-anchor="middle">GAP_MAX_CM</text>
<text x="845" y="651" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6A5335">← YOUR number (7A)</text>

<rect x="90" y="730" width="915" height="90" rx="8" fill="#0B1A2E"/>
<text x="547" y="763" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">The end of the line is just a gap that never closes.</text>
<text x="547" y="793" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#DCE7EF" text-anchor="middle">GAP_MAX_CM is the ONLY thing that stops the robot when it runs out of course.</text>
</svg>
