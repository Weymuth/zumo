<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850" font-family="Arial, Helvetica, sans-serif"><title>Graphic 10.2 — The Avoidance Box</title><desc>Five-phase obstacle avoidance path and phase handoff diagram.</desc>

  <defs>
    <linearGradient id="matGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F3F3"/>
    </linearGradient>
    <linearGradient id="blockGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CE9178"/>
      <stop offset="100%" stop-color="#CE9178"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1100" height="850" fill="#F5F2E9"/>

  <!-- ================= TITLE BAND ================= -->
  <rect x="0" y="0" width="1100" height="72" fill="#0B1A2E"/>
  <text x="34" y="46" font-size="27" font-weight="bold" fill="#ffffff">GRAPHIC 10.2 — The Avoidance Box</text>
  <text x="1066" y="46" font-size="17" fill="#E8EEF4" text-anchor="end">out · along · back · hunt</text>

  <!-- ================= TOP-DOWN STAGE ================= -->
  <rect x="40" y="100" width="700" height="560" rx="10" fill="url(#matGrad)" stroke="#D4D4D4" stroke-width="2"/>
  <text x="60" y="132" font-size="16" font-weight="bold" fill="#0B1A2E">TOP-DOWN VIEW — a shape driven from memory, not from sensors</text>

  <!-- THE LINE runs left to right across the mat -->
  <rect x="70" y="380" width="640" height="7" fill="#1E1E1E"/>
  <text x="92" y="371" font-size="13" font-weight="bold" fill="#1E1E1E">the line</text>

  <!-- THE BLOCK sits on the line -->
  <rect x="352" y="352" width="64" height="64" rx="4" fill="url(#blockGrad)" stroke="#7B6240" stroke-width="3"/>
  <text x="384" y="390" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">BLOCK</text>

  <!-- ROBOT: where it stops -->
  <rect x="196" y="360" width="54" height="46" rx="5" fill="#3D5266" stroke="#0B1A2E" stroke-width="3"/>
  <polygon points="250,371 250,395 268,383" fill="#3D5266" stroke="#0B1A2E" stroke-width="2"/>
  <text x="223" y="388" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ZUMO</text>
  <text x="223" y="342" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">STOPS HERE</text>

  <!-- ============ 1. TURN AWAY (spin RIGHT - away from the line) ============ -->
  <polygon points="277,401 291,401 291,455 301,455 284,479 267,455 277,455" fill="#F44747" stroke="#A62F2F" stroke-width="2"/>
  <circle cx="284" cy="497" r="17" fill="#F44747"/>
  <text x="284" y="503" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="312" y="494" font-size="14" font-weight="bold" fill="#F44747">TURN_AWAY</text>
  <text x="312" y="512" font-size="12" fill="#A62F2F">spin right, 90°</text>

  <!-- ============ 2. DRIVE PAST (parallel to the line) ============ -->
  <polygon points="308,522 524,522 524,510 554,532 524,554 524,542 308,542" fill="#F44747" stroke="#A62F2F" stroke-width="2"/>
  <circle cx="431" cy="583" r="17" fill="#F44747"/>
  <text x="431" y="589" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="459" y="580" font-size="14" font-weight="bold" fill="#F44747">DRIVE_PAST</text>
  <text x="459" y="598" font-size="12" fill="#A62F2F">20 cm, parallel — clears the block</text>

  <!-- ============ 3. TURN BACK (spin LEFT - face the line again) ============ -->
  <polygon points="581,522 595,522 595,486 605,486 588,462 571,486 581,486" fill="#F44747" stroke="#A62F2F" stroke-width="2"/>
  <circle cx="588" cy="546" r="17" fill="#F44747"/>
  <text x="588" y="552" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="616" y="543" font-size="14" font-weight="bold" fill="#F44747">TURN_BACK</text>
  <text x="616" y="561" font-size="12" fill="#A62F2F">spin left, 90°</text>

  <!-- ============ THE HANDOFF: 4 and 5 move NOTHING ============ -->
  <!-- sits BESIDE the path, not in it - because nothing moves here -->
  <rect x="196" y="596" width="270" height="52" rx="6" fill="#FFF8E1" stroke="#CCA700" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="331" y="617" font-size="13" font-weight="bold" fill="#856404" text-anchor="middle">4 SEEK_LINE · 5 COMPLETE</text>
  <text x="331" y="636" font-size="12" fill="#856404" text-anchor="middle">no wheel turns here — see the panel</text>

  <!-- ============ THE HUNT: a DIFFERENT STATE drives this ============ -->
  <!-- STOPS AT THE LINE. Tip lands on the tape at y=384. -->
  <polygon points="581,436 595,436 595,414 605,414 588,390 571,414 581,414" fill="#355E3B" stroke="#355E3B" stroke-width="2"/>
  <text x="616" y="452" font-size="14" font-weight="bold" fill="#355E3B">RETURNING_TO_LINE</text>
  <text x="616" y="470" font-size="12" fill="#355E3B">drives straight until the line reappears</text>
  <text x="616" y="488" font-size="12" font-style="italic" fill="#355E3B">a separate STATE, not a phase</text>

  <!-- robot crosses the line again -->
  <circle cx="588" cy="384" r="10" fill="none" stroke="#355E3B" stroke-width="3"/>
  <text x="588" y="352" font-size="13" font-weight="bold" fill="#355E3B" text-anchor="middle">LINE FOUND</text>
  <text x="588" y="336" font-size="12" fill="#355E3B" text-anchor="middle">follow it again</text>

  <!-- ================= RIGHT PANEL: WHO ACTUALLY DRIVES ================= -->
  <rect x="762" y="100" width="298" height="560" rx="10" fill="#FFFFFF" stroke="#7A8793" stroke-width="2"/>
  <rect x="762" y="100" width="298" height="42" rx="10" fill="#3D5266"/>
  <rect x="762" y="128" width="298" height="14" fill="#3D5266"/>
  <text x="786" y="128" font-size="16" font-weight="bold" fill="#ffffff">WHICH PHASES DRIVE?</text>

  <rect x="782" y="164" width="258" height="52" rx="5" fill="#FDECEC" stroke="#F44747" stroke-width="2"/>
  <text x="798" y="185" font-size="13" font-weight="bold" fill="#F44747">1 · TURN_AWAY</text>
  <text x="798" y="205" font-size="12" fill="#A62F2F">turns wheels: yes</text>

  <rect x="782" y="226" width="258" height="52" rx="5" fill="#FDECEC" stroke="#F44747" stroke-width="2"/>
  <text x="798" y="247" font-size="13" font-weight="bold" fill="#F44747">2 · DRIVE_PAST</text>
  <text x="798" y="267" font-size="12" fill="#A62F2F">turns wheels: yes</text>

  <rect x="782" y="288" width="258" height="52" rx="5" fill="#FDECEC" stroke="#F44747" stroke-width="2"/>
  <text x="798" y="309" font-size="13" font-weight="bold" fill="#F44747">3 · TURN_BACK</text>
  <text x="798" y="329" font-size="12" fill="#A62F2F">turns wheels: yes</text>

  <rect x="782" y="350" width="258" height="62" rx="5" fill="#FFF8E1" stroke="#CCA700" stroke-width="2"/>
  <text x="798" y="371" font-size="13" font-weight="bold" fill="#856404">4 · SEEK_LINE</text>
  <text x="798" y="390" font-size="12" fill="#856404">starts a stopwatch.</text>
  <text x="798" y="406" font-size="12" font-weight="bold" fill="#856404">MOVES NOTHING.</text>

  <rect x="782" y="422" width="258" height="62" rx="5" fill="#FFF8E1" stroke="#CCA700" stroke-width="2"/>
  <text x="798" y="443" font-size="13" font-weight="bold" fill="#856404">5 · COMPLETE</text>
  <text x="798" y="462" font-size="12" fill="#856404">says “I am done.”</text>
  <text x="798" y="478" font-size="12" font-weight="bold" fill="#856404">MOVES NOTHING.</text>

  <rect x="782" y="500" width="258" height="140" rx="5" fill="#EEF5EA" stroke="#355E3B" stroke-width="2"/>
  <text x="798" y="522" font-size="13" font-weight="bold" fill="#355E3B">The plan is not the driving.</text>
  <text x="798" y="546" font-size="12" fill="#355E3B">The box is a PLAN: out, past,</text>
  <text x="798" y="564" font-size="12" fill="#355E3B">back, hand off. Phases 4 and 5</text>
  <text x="798" y="582" font-size="12" fill="#355E3B">are the handing off.</text>
  <text x="798" y="608" font-size="12" fill="#355E3B">The hunt belongs to a whole</text>
  <text x="798" y="626" font-size="12" font-weight="bold" fill="#355E3B">separate state.</text>

  <!-- ================= FOOTER STRIP: THE BLIND TRUTH ================= -->
  <rect x="40" y="682" width="1020" height="130" rx="10" fill="#F3F3F3" stroke="#3D5266" stroke-width="2"/>
  <text x="66" y="712" font-size="16" font-weight="bold" fill="#0B1A2E">The robot cannot see any of this.</text>
  <text x="66" y="740" font-size="14" fill="#3D5266">Once it turns away in phase 1, the block is out of the sensor’s view. It does not check. It does not react. It drives</text>
  <text x="66" y="762" font-size="14" fill="#3D5266">a shape it memorized before it started — which is why the numbers below have to be right, and why you tune them in §7.</text>

  <rect x="66" y="776" width="964" height="24" rx="4" fill="#1e1e1e"/>
  <text x="80" y="793" font-family="Courier New, monospace" font-size="13" fill="#9cdcfe" textLength="748" lengthAdjust="spacingAndGlyphs">AVOID_TURN_DEGREES = 90.0;   AVOID_PAST_CM = 20.0;   RETURN_TIMEOUT = 5000;</text>

</svg>