<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850" font-family="Segoe UI, Helvetica, Arial, sans-serif">

  <defs>
    <linearGradient id="titleBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a5276"/>
      <stop offset="100%" stop-color="#2e86ab"/>
    </linearGradient>
    <linearGradient id="matGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef2f5"/>
    </linearGradient>
    <linearGradient id="blockGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e07b39"/>
      <stop offset="100%" stop-color="#b85c1e"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1100" height="850" fill="#ffffff"/>

  <!-- ================= TITLE BAND ================= -->
  <rect x="0" y="0" width="1100" height="72" fill="url(#titleBand)"/>
  <text x="34" y="46" font-size="27" font-weight="bold" fill="#ffffff">GRAPHIC 10.2 &#8212; The Avoidance Box</text>
  <text x="1066" y="46" font-size="17" fill="#d6e9f2" text-anchor="end">out &#183; along &#183; back &#183; hunt</text>

  <!-- ================= TOP-DOWN STAGE ================= -->
  <rect x="40" y="100" width="700" height="560" rx="10" fill="url(#matGrad)" stroke="#c8d2da" stroke-width="2"/>
  <text x="60" y="132" font-size="16" font-weight="bold" fill="#1a5276">TOP-DOWN VIEW &#8212; a shape driven from memory, not from sensors</text>

  <!-- THE LINE runs left to right across the mat -->
  <rect x="70" y="380" width="640" height="7" fill="#1c2833"/>
  <text x="92" y="371" font-size="13" font-weight="bold" fill="#1c2833">the line</text>

  <!-- THE BLOCK sits on the line -->
  <rect x="352" y="352" width="64" height="64" rx="4" fill="url(#blockGrad)" stroke="#8e4415" stroke-width="3"/>
  <text x="384" y="390" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">BLOCK</text>

  <!-- ROBOT: where it stops -->
  <rect x="196" y="360" width="54" height="46" rx="5" fill="#34495e" stroke="#22313f" stroke-width="3"/>
  <polygon points="250,371 250,395 268,383" fill="#34495e" stroke="#22313f" stroke-width="2"/>
  <text x="223" y="388" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ZUMO</text>
  <text x="223" y="342" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">STOPS HERE</text>

  <!-- ============ 1. TURN AWAY (spin RIGHT - away from the line) ============ -->
  <polygon points="277,401 291,401 291,455 301,455 284,479 267,455 277,455"
           fill="#9a4459" stroke="#772f41" stroke-width="2"/>
  <circle cx="284" cy="497" r="17" fill="#9a4459"/>
  <text x="284" y="503" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <text x="312" y="494" font-size="14" font-weight="bold" fill="#9a4459">TURN_AWAY</text>
  <text x="312" y="512" font-size="12" fill="#7a4b58">spin right, 90&#176;</text>

  <!-- ============ 2. DRIVE PAST (parallel to the line) ============ -->
  <polygon points="308,522 524,522 524,510 554,532 524,554 524,542 308,542"
           fill="#9a4459" stroke="#772f41" stroke-width="2"/>
  <circle cx="431" cy="583" r="17" fill="#9a4459"/>
  <text x="431" y="589" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <text x="459" y="580" font-size="14" font-weight="bold" fill="#9a4459">DRIVE_PAST</text>
  <text x="459" y="598" font-size="12" fill="#7a4b58">20 cm, parallel &#8212; clears the block</text>

  <!-- ============ 3. TURN BACK (spin LEFT - face the line again) ============ -->
  <polygon points="581,522 595,522 595,486 605,486 588,462 571,486 581,486"
           fill="#9a4459" stroke="#772f41" stroke-width="2"/>
  <circle cx="588" cy="546" r="17" fill="#9a4459"/>
  <text x="588" y="552" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <text x="616" y="543" font-size="14" font-weight="bold" fill="#9a4459">TURN_BACK</text>
  <text x="616" y="561" font-size="12" fill="#7a4b58">spin left, 90&#176;</text>

  <!-- ============ THE HANDOFF: 4 and 5 move NOTHING ============ -->
  <!-- sits BESIDE the path, not in it - because nothing moves here -->
  <rect x="196" y="596" width="270" height="52" rx="6" fill="#fff8e1" stroke="#ffc107" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="331" y="617" font-size="13" font-weight="bold" fill="#856404" text-anchor="middle">4 SEEK_LINE &#183; 5 COMPLETE</text>
  <text x="331" y="636" font-size="12" fill="#856404" text-anchor="middle">no wheel turns here &#8212; see the panel</text>

  <!-- ============ THE HUNT: a DIFFERENT STATE drives this ============ -->
  <!-- STOPS AT THE LINE. Tip lands on the tape at y=384. -->
  <polygon points="581,436 595,436 595,414 605,414 588,390 571,414 581,414"
           fill="#2a5a42" stroke="#1d3f2e" stroke-width="2"/>
  <text x="616" y="452" font-size="14" font-weight="bold" fill="#2a5a42">RETURNING_TO_LINE</text>
  <text x="616" y="470" font-size="12" fill="#4a6b58">drives straight until the line reappears</text>
  <text x="616" y="488" font-size="12" font-style="italic" fill="#2a5a42">a separate STATE, not a phase</text>

  <!-- robot crosses the line again -->
  <circle cx="588" cy="384" r="10" fill="none" stroke="#2a5a42" stroke-width="3"/>
  <text x="588" y="352" font-size="13" font-weight="bold" fill="#2a5a42" text-anchor="middle">LINE FOUND</text>
  <text x="588" y="336" font-size="12" fill="#4a6b58" text-anchor="middle">follow it again</text>

  <!-- ================= RIGHT PANEL: WHO ACTUALLY DRIVES ================= -->
  <rect x="762" y="100" width="298" height="560" rx="10" fill="#f7f9fa" stroke="#6c757d" stroke-width="2"/>
  <rect x="762" y="100" width="298" height="42" rx="10" fill="#4d5358"/>
  <rect x="762" y="128" width="298" height="14" fill="#4d5358"/>
  <text x="786" y="128" font-size="16" font-weight="bold" fill="#ffffff">WHICH PHASES DRIVE?</text>

  <rect x="782" y="164" width="258" height="52" rx="5" fill="#fbe9ee" stroke="#9a4459" stroke-width="2"/>
  <text x="798" y="185" font-size="13" font-weight="bold" fill="#9a4459">1 &#183; TURN_AWAY</text>
  <text x="798" y="205" font-size="12" fill="#7a4b58">turns wheels &#10003;</text>

  <rect x="782" y="226" width="258" height="52" rx="5" fill="#fbe9ee" stroke="#9a4459" stroke-width="2"/>
  <text x="798" y="247" font-size="13" font-weight="bold" fill="#9a4459">2 &#183; DRIVE_PAST</text>
  <text x="798" y="267" font-size="12" fill="#7a4b58">turns wheels &#10003;</text>

  <rect x="782" y="288" width="258" height="52" rx="5" fill="#fbe9ee" stroke="#9a4459" stroke-width="2"/>
  <text x="798" y="309" font-size="13" font-weight="bold" fill="#9a4459">3 &#183; TURN_BACK</text>
  <text x="798" y="329" font-size="12" fill="#7a4b58">turns wheels &#10003;</text>

  <rect x="782" y="350" width="258" height="62" rx="5" fill="#fff8e1" stroke="#ffc107" stroke-width="2"/>
  <text x="798" y="371" font-size="13" font-weight="bold" fill="#856404">4 &#183; SEEK_LINE</text>
  <text x="798" y="390" font-size="12" fill="#856404">starts a stopwatch.</text>
  <text x="798" y="406" font-size="12" font-weight="bold" fill="#856404">MOVES NOTHING.</text>

  <rect x="782" y="422" width="258" height="62" rx="5" fill="#fff8e1" stroke="#ffc107" stroke-width="2"/>
  <text x="798" y="443" font-size="13" font-weight="bold" fill="#856404">5 &#183; COMPLETE</text>
  <text x="798" y="462" font-size="12" fill="#856404">says &#8220;I am done.&#8221;</text>
  <text x="798" y="478" font-size="12" font-weight="bold" fill="#856404">MOVES NOTHING.</text>

  <rect x="782" y="500" width="258" height="140" rx="5" fill="#e8f3ec" stroke="#2a5a42" stroke-width="2"/>
  <text x="798" y="522" font-size="13" font-weight="bold" fill="#2a5a42">The plan is not the driving.</text>
  <text x="798" y="546" font-size="12" fill="#2a5a42">The box is a PLAN: out, past,</text>
  <text x="798" y="564" font-size="12" fill="#2a5a42">back, hand off. Phases 4 and 5</text>
  <text x="798" y="582" font-size="12" fill="#2a5a42">are the handing off.</text>
  <text x="798" y="608" font-size="12" fill="#2a5a42">The hunt belongs to a whole</text>
  <text x="798" y="626" font-size="12" font-weight="bold" fill="#2a5a42">separate state.</text>

  <!-- ================= FOOTER STRIP: THE BLIND TRUTH ================= -->
  <rect x="40" y="682" width="1020" height="130" rx="10" fill="#eaf4fb" stroke="#2196f3" stroke-width="2"/>
  <text x="66" y="712" font-size="16" font-weight="bold" fill="#0d47a1">The robot cannot see any of this.</text>
  <text x="66" y="740" font-size="14" fill="#123c66">Once it turns away in phase 1, the block is out of the sensor&#8217;s view. It does not check. It does not react. It drives</text>
  <text x="66" y="762" font-size="14" fill="#123c66">a shape it memorized before it started &#8212; which is why the numbers below have to be right, and why you tune them in &#167;7.</text>

  <rect x="66" y="776" width="964" height="24" rx="4" fill="#1e1e1e"/>
  <text x="80" y="793" font-family="Consolas, Monaco, monospace" font-size="13" fill="#9cdcfe" textLength="748" lengthAdjust="spacingAndGlyphs">AVOID_TURN_DEGREES = 90.0;   AVOID_PAST_CM = 20.0;   RETURN_TIMEOUT = 5000;</text>

</svg>
