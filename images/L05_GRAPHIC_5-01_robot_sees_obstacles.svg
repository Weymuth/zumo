<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850" role="img" aria-labelledby="title desc">
  <title id="title">Your Robot's Sixth Sense</title>
  <desc id="desc">A top-view Zumo robot uses left, front, and right proximity detectors. A close hand gives a front reading of 6, a nearby wall gives a left reading of 2, and open space gives a right reading of 0. A warning explains that the readings are echoes, not distances.</desc>

  <defs>
    <style>
      .inter { font-family: Inter, Arial, sans-serif; font-feature-settings: "cv05" 1; }
      .mono { font-family: "JetBrains Mono", "Courier New", monospace; font-variant-ligatures: none; }
      .navy { fill: #0B1A2E; }
      .slate { fill: #3D5266; }
      .body { fill: #1E1E1E; }
      .muted { fill: #6B7176; }
    </style>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0B1A2E" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B353B"/>
      <stop offset="1" stop-color="#1B242A"/>
    </linearGradient>
  </defs>

  <!-- Brand layer -->
  <rect width="1100" height="850" fill="#F5F2E9"/>
  <rect x="0" y="0" width="1100" height="66" fill="#0B1A2E"/>
  <rect x="0" y="64" width="1100" height="3" fill="#C9A463"/>
  <text x="48" y="43" class="inter" font-size="27" font-weight="800" letter-spacing="0.4" fill="#FFFFFF">YOUR ROBOT’S SIXTH SENSE</text>
  <text x="550" y="98" class="inter slate" font-size="16" font-weight="500" text-anchor="middle">One detector looks ahead. Two look out of the sides. Nothing here is visible to your eyes.</text>
  <line x1="60" y1="114" x2="1040" y2="114" stroke="#D4D4D4" stroke-width="1.5"/>

  <!-- Detector field: functional colors, labels provide a second cue -->
  <polygon points="550,400 455,120 645,120" fill="#6A9955" opacity="0.12"/>
  <polygon points="487,412 200,320 200,505" fill="#569CD6" opacity="0.12"/>
  <polygon points="613,412 900,320 900,505" fill="#CE9178" opacity="0.12"/>
  <g stroke-dasharray="7 7" stroke-width="2.4" fill="none" stroke-linecap="round">
    <path d="M550,400 L455,120" stroke="#6A9955"/><path d="M550,400 L645,120" stroke="#6A9955"/>
    <path d="M487,412 L200,320" stroke="#569CD6"/><path d="M487,412 L200,505" stroke="#569CD6"/>
    <path d="M613,412 L900,320" stroke="#CE9178"/><path d="M613,412 L900,505" stroke="#CE9178"/>
  </g>

  <!-- Robot: same placement and footprint, improved neutral technical styling -->
  <g filter="url(#softShadow)">
    <rect x="440" y="440" width="40" height="175" rx="8" fill="#1E1E1E" stroke="#111820" stroke-width="2.5"/>
    <rect x="620" y="440" width="40" height="175" rx="8" fill="#1E1E1E" stroke="#111820" stroke-width="2.5"/>
    <g stroke="#50575C" stroke-width="2.2">
      <line x1="445" y1="465" x2="475" y2="465"/><line x1="445" y1="495" x2="475" y2="495"/>
      <line x1="445" y1="525" x2="475" y2="525"/><line x1="445" y1="555" x2="475" y2="555"/>
      <line x1="445" y1="585" x2="475" y2="585"/>
      <line x1="625" y1="465" x2="655" y2="465"/><line x1="625" y1="495" x2="655" y2="495"/>
      <line x1="625" y1="525" x2="655" y2="525"/><line x1="625" y1="555" x2="655" y2="555"/>
      <line x1="625" y1="585" x2="655" y2="585"/>
    </g>
    <rect x="480" y="430" width="140" height="188" rx="10" fill="#D4D4D4" stroke="#26333C" stroke-width="2.5"/>
    <polygon points="497,388 603,388 628,432 472,432" fill="#E2E5E7" stroke="#26333C" stroke-width="2.5"/>
    <rect x="493" y="452" width="114" height="134" rx="10" fill="url(#board)" stroke="#3C3C3C" stroke-width="2"/>
    <rect x="515" y="472" width="70" height="38" rx="5" fill="#10191E" stroke="#697178" stroke-width="1.8"/>
    <rect x="521" y="478" width="58" height="26" rx="3" fill="#007ACC"/>
    <text x="550" y="496" class="mono" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">ZUMO</text>
    <circle cx="512" cy="536" r="7" fill="#F3F3F3" stroke="#697178" stroke-width="2"/>
    <circle cx="550" cy="536" r="7" fill="#F3F3F3" stroke="#697178" stroke-width="2"/>
    <circle cx="588" cy="536" r="7" fill="#F3F3F3" stroke="#697178" stroke-width="2"/>
    <rect x="536" y="558" width="28" height="14" rx="3" fill="#9D9D9D" stroke="#5F686E" stroke-width="1.5"/>
    <text x="550" y="604" class="inter slate" font-size="11" font-weight="600" text-anchor="middle">TOP VIEW</text>
  </g>

  <!-- Detector origins -->
  <circle cx="487" cy="412" r="9" fill="#569CD6" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="550" cy="400" r="9" fill="#6A9955" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="613" cy="412" r="9" fill="#CE9178" stroke="#FFFFFF" stroke-width="3"/>

  <!-- Front example -->
  <rect x="505" y="168" width="90" height="70" rx="10" fill="#F3F3F3" stroke="#6A9955" stroke-width="2.3"/>
  <path d="M531 196c0-15 10-23 19-23s19 8 19 23v17h-38z" fill="#FFFFFF" stroke="#6A9955" stroke-width="2"/>
  <path d="M538 192v-11M545 190v-15M552 190v-16M559 192v-13" stroke="#6A9955" stroke-width="2.2" stroke-linecap="round"/>
  <text x="550" y="229" class="inter" font-size="12" font-weight="700" fill="#365B35" text-anchor="middle">HAND, CLOSE</text>
  <rect x="495" y="258" width="110" height="54" rx="8" fill="#F3F3F3" stroke="#6A9955" stroke-width="2.2"/>
  <rect x="495" y="258" width="8" height="54" rx="4" fill="#6A9955"/>
  <text x="550" y="282" class="mono" font-size="18" font-weight="800" fill="#1E1E1E" text-anchor="middle">F: 6</text>
  <text x="550" y="302" class="inter" font-size="12" fill="#3D5266" text-anchor="middle">loud echo</text>

  <!-- Left example -->
  <rect x="108" y="300" width="46" height="225" rx="5" fill="#E9EDF0" stroke="#569CD6" stroke-width="2.3"/>
  <g stroke="#C7CDD1" stroke-width="2"><line x1="117" y1="325" x2="145" y2="325"/><line x1="117" y1="365" x2="145" y2="365"/><line x1="117" y1="405" x2="145" y2="405"/><line x1="117" y1="445" x2="145" y2="445"/><line x1="117" y1="485" x2="145" y2="485"/></g>
  <text x="131" y="285" class="inter" font-size="14" font-weight="700" fill="#35628D" text-anchor="middle">WALL ALONGSIDE</text>
  <rect x="215" y="545" width="130" height="54" rx="8" fill="#F3F3F3" stroke="#569CD6" stroke-width="2.2"/>
  <rect x="215" y="545" width="8" height="54" rx="4" fill="#569CD6"/>
  <text x="280" y="569" class="mono" font-size="18" font-weight="800" fill="#1E1E1E" text-anchor="middle">L: 2</text>
  <text x="280" y="589" class="inter" font-size="12" fill="#3D5266" text-anchor="middle">faint echo</text>

  <!-- Right example -->
  <text x="820" y="405" class="inter muted" font-size="15" font-style="italic" text-anchor="middle">nothing out here</text>
  <rect x="755" y="545" width="130" height="54" rx="8" fill="#F3F3F3" stroke="#CE9178" stroke-width="2.2"/>
  <rect x="755" y="545" width="8" height="54" rx="4" fill="#CE9178"/>
  <text x="820" y="569" class="mono" font-size="18" font-weight="800" fill="#1E1E1E" text-anchor="middle">R: 0</text>
  <text x="820" y="589" class="inter" font-size="12" fill="#3D5266" text-anchor="middle">no echo</text>

  <!-- Detector legend -->
  <rect x="60" y="132" width="268" height="152" rx="12" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
  <text x="194" y="161" class="inter navy" font-size="15" font-weight="800" letter-spacing="0.8" text-anchor="middle">THREE DETECTORS</text>
  <line x1="82" y1="173" x2="306" y2="173" stroke="#D4D4D4" stroke-width="1"/>
  <circle cx="88" cy="194" r="7" fill="#569CD6"/><text x="106" y="199" class="inter body" font-size="14">LEFT — looks out the side</text>
  <circle cx="88" cy="224" r="7" fill="#6A9955"/><text x="106" y="229" class="inter body" font-size="14">FRONT — looks ahead</text>
  <circle cx="88" cy="254" r="7" fill="#CE9178"/><text x="106" y="259" class="inter body" font-size="14">RIGHT — looks out the side</text>
  <text x="194" y="277" class="inter muted" font-size="12" text-anchor="middle">each one answers 0–6</text>

  <!-- Warning panel -->
  <rect x="60" y="690" width="980" height="118" rx="12" fill="#FFF9E6" stroke="#CCA700" stroke-width="2.3"/>
  <rect x="60" y="690" width="9" height="118" rx="4.5" fill="#CCA700"/>
  <path d="M88 714l11-19 11 19z" fill="none" stroke="#8B7100" stroke-width="2.3" stroke-linejoin="round"/>
  <line x1="99" y1="701" x2="99" y2="708" stroke="#8B7100" stroke-width="2.3" stroke-linecap="round"/><circle cx="99" cy="712" r="1.5" fill="#8B7100"/>
  <text x="121" y="720" class="inter" font-size="17" font-weight="800" fill="#6D5800">A READING IS AN ECHO, NOT A DISTANCE</text>
  <text x="86" y="752" class="inter body" font-size="15">Higher is closer — but only for the <tspan font-style="italic">same object</tspan>. A big white box far away can out-echo a small black cup up close.</text>
  <text x="86" y="782" class="inter" font-size="15" font-weight="700" fill="#6D5800">Same number, different truth. That is Section 3.5.</text>
</svg>
