<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850">
<defs>
<linearGradient id="tb" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#1a5276"/><stop offset="1" stop-color="#2e86ab"/>
</linearGradient>
</defs>
<rect width="1100" height="850" fill="#ffffff"/>
<rect x="0" y="0" width="1100" height="64" fill="url(#tb)"/>
<text x="550" y="41" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">YOUR ROBOT&#8217;S SIXTH SENSE</text>
<text x="550" y="94" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#555" text-anchor="middle">It cannot see. It shouts in invisible light and listens for the echo. Nothing here is visible to your eyes.</text>

<!-- treads -->
<rect x="455" y="470" width="42" height="180" fill="#4d5358" stroke="#2c3e50" stroke-width="2"/>
<rect x="603" y="470" width="42" height="180" fill="#4d5358" stroke="#2c3e50" stroke-width="2"/>
<g stroke="#6c757d" stroke-width="2">
<line x1="458" y1="495" x2="494" y2="495"/><line x1="458" y1="525" x2="494" y2="525"/>
<line x1="458" y1="555" x2="494" y2="555"/><line x1="458" y1="585" x2="494" y2="585"/>
<line x1="458" y1="615" x2="494" y2="615"/>
<line x1="606" y1="495" x2="642" y2="495"/><line x1="606" y1="525" x2="642" y2="525"/>
<line x1="606" y1="555" x2="642" y2="555"/><line x1="606" y1="585" x2="642" y2="585"/>
<line x1="606" y1="615" x2="642" y2="615"/>
</g>
<!-- body + blade -->
<rect x="490" y="460" width="120" height="195" rx="7" fill="#e8ecef" stroke="#2c3e50" stroke-width="2"/>
<polygon points="505,420 595,420 615,462 485,462" fill="#cfd6dc" stroke="#2c3e50" stroke-width="2"/>
<text x="550" y="560" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#4d5358" text-anchor="middle">ZUMO</text>
<text x="550" y="580" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#7d8a94" text-anchor="middle">top view</text>
<!-- the three detectors -->
<circle cx="512" cy="437" r="8" fill="#8e3a4f"/>
<circle cx="550" cy="432" r="8" fill="#1e4633"/>
<circle cx="588" cy="437" r="8" fill="#1a5276"/>

<polygon points="512,437 300,170 460,150" fill="#c45d76" opacity="0.13"/>
<polygon points="550,432 470,120 630,120" fill="#2a5a42" opacity="0.13"/>
<polygon points="588,437 640,150 800,170" fill="#2e86ab" opacity="0.13"/>
<g stroke-dasharray="7 6" stroke-width="2" fill="none">
<path d="M512,437 L300,170" stroke="#c45d76"/><path d="M512,437 L460,150" stroke="#c45d76"/>
<path d="M550,432 L470,120" stroke="#2a5a42"/><path d="M550,432 L630,120" stroke="#2a5a42"/>
<path d="M588,437 L640,150" stroke="#2e86ab"/><path d="M588,437 L800,170" stroke="#2e86ab"/>
</g>

<!-- LEFT: box, far -->
<rect x="322" y="196" width="86" height="66" rx="4" fill="#f2d7de" stroke="#8e3a4f" stroke-width="2"/>
<text x="365" y="236" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#8e3a4f" text-anchor="middle">box, far</text>
<rect x="300" y="278" width="130" height="52" rx="6" fill="#c45d76"/>
<text x="365" y="299" font-family="Courier New,monospace" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">L: 2</text>
<text x="365" y="320" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">faint echo</text>

<!-- FRONT: hand, close -->
<rect x="505" y="176" width="90" height="70" rx="10" fill="#dbeee3" stroke="#1e4633" stroke-width="2"/>
<text x="550" y="218" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#1e4633" text-anchor="middle">hand, close</text>
<rect x="485" y="262" width="130" height="52" rx="6" fill="#2a5a42"/>
<text x="550" y="283" font-family="Courier New,monospace" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">F: 6</text>
<text x="550" y="304" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">loud echo</text>

<!-- RIGHT: nothing -->
<text x="722" y="222" font-family="Arial,Helvetica,sans-serif" font-size="15" font-style="italic" fill="#8a97a0" text-anchor="middle">nothing out here</text>
<rect x="662" y="278" width="130" height="52" rx="6" fill="#8a97a0"/>
<text x="727" y="299" font-family="Courier New,monospace" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">R: 0</text>
<text x="727" y="320" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">no echo</text>

<rect x="838" y="400" width="230" height="150" rx="10" fill="#f7f9fa" stroke="#34495e" stroke-width="2"/>
<text x="953" y="428" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#34495e" text-anchor="middle">THREE DETECTORS</text>
<circle cx="866" cy="456" r="7" fill="#8e3a4f"/><text x="884" y="461" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333">LEFT</text>
<circle cx="866" cy="486" r="7" fill="#1e4633"/><text x="884" y="491" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333">FRONT</text>
<circle cx="866" cy="516" r="7" fill="#1a5276"/><text x="884" y="521" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333">RIGHT</text>
<text x="953" y="543" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#777" text-anchor="middle">each one answers 0&#8211;6</text>

<rect x="60" y="700" width="980" height="118" rx="10" fill="#fdf6e8" stroke="#b7950b" stroke-width="2"/>
<text x="86" y="732" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#7d6608">&#9888; A READING IS AN ECHO, NOT A DISTANCE</text>
<text x="86" y="762" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#333">Higher is closer &#8212; but only for the <tspan font-style="italic">same object</tspan>. A big white box far away can out-echo a small black cup up close.</text>
<text x="86" y="790" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#7d6608">Same number, different truth. That is Section 3.5.</text>
</svg>
