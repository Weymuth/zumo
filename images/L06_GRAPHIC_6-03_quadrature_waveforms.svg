<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="titleBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a5276"/>
      <stop offset="100%" stop-color="#2e86ab"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef2f5"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1100" height="850" fill="#ffffff"/>
  <rect x="0" y="0" width="1100" height="72" fill="url(#titleBand)"/>
  <text x="34" y="46" font-size="27" font-weight="bold" fill="#ffffff">GRAPHIC 6.3 &#8212; Quadrature: Two Channels, 90&#176; Apart</text>
  <text x="1066" y="46" font-size="17" fill="#d6e9f2" text-anchor="end">Lesson 6 &#183; &#167;3</text>

  <rect x="40" y="100" width="1020" height="330" rx="10" fill="url(#panelGrad)" stroke="#c8d2da" stroke-width="2"/>
  <text x="60" y="132" font-size="16" font-weight="bold" fill="#1a5276">One channel counts. TWO channels also tell you which WAY.</text>

  <text x="80" y="196" font-size="15" font-weight="bold" fill="#c0392b">CH A</text>
  <line x1="140" y1="196" x2="1020" y2="196" stroke="#dde4e9" stroke-width="1"/>
  <path d="M 140 196 L 220 196 L 220 150 L 300 150 L 300 196 L 380 196 L 380 150 L 460 150 L 460 196 L 540 196 L 540 150 L 620 150 L 620 196 L 700 196 L 700 150 L 780 150 L 780 196 L 860 196 L 860 150 L 940 150" fill="none" stroke="#c0392b" stroke-width="3"/>

  <text x="80" y="306" font-size="15" font-weight="bold" fill="#2e86ab">CH B</text>
  <line x1="140" y1="306" x2="1020" y2="306" stroke="#dde4e9" stroke-width="1"/>
  <path d="M 140 260 L 220 260 L 220 306 L 300 306 L 300 260 L 380 260 L 380 306 L 460 306 L 460 260 L 540 260 L 540 306 L 620 306 L 620 260 L 700 260 L 700 306 L 780 306 L 780 260 L 860 260 L 860 306 L 940 306" fill="none" stroke="#2e86ab" stroke-width="3"/>

  <line x1="140" y1="150" x2="140" y2="330" stroke="#95a5a6" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="220" y1="150" x2="220" y2="330" stroke="#95a5a6" stroke-width="1" stroke-dasharray="4 4"/>
  <polygon points="146,364 210,364 210,358 226,369 210,380 210,374 146,374" fill="#7d5283" stroke="#5b3a5f" stroke-width="1"/>
  <text x="240" y="374" font-size="13" font-weight="bold" fill="#7d5283">B lags A by a quarter cycle. That lag IS the 90&#176;.</text>

  <rect x="40" y="452" width="498" height="180" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <rect x="40" y="452" width="498" height="40" rx="10" fill="#9a4459"/>
  <rect x="40" y="480" width="498" height="12" fill="#9a4459"/>
  <text x="64" y="480" font-size="16" font-weight="bold" fill="#ffffff">FORWARD</text>
  <text x="64" y="524" font-size="14" fill="#6b2c34">A rises first, then B.</text>
  <text x="64" y="552" font-size="14" font-weight="bold" fill="#9a4459">A leads &#8594; count UP</text>
  <text x="64" y="586" font-size="13" fill="#8a5560">getCountsLeft() climbs: 100, 101, 102 ...</text>
  <text x="64" y="612" font-size="13" font-style="italic" fill="#8a5560">The chip works this out for you.</text>

  <rect x="562" y="452" width="498" height="180" rx="10" fill="#eaf4fb" stroke="#2e86ab" stroke-width="2"/>
  <rect x="562" y="452" width="498" height="40" rx="10" fill="#1a5276"/>
  <rect x="562" y="480" width="498" height="12" fill="#1a5276"/>
  <text x="586" y="480" font-size="16" font-weight="bold" fill="#ffffff">BACKWARD</text>
  <text x="586" y="524" font-size="14" fill="#123c66">B rises first, then A.</text>
  <text x="586" y="552" font-size="14" font-weight="bold" fill="#1a5276">B leads &#8594; count DOWN</text>
  <text x="586" y="586" font-size="13" fill="#3a5a75">getCountsLeft() falls: 102, 101, 100 ...</text>
  <text x="586" y="612" font-size="13" font-style="italic" fill="#3a5a75">Same wires. Opposite order.</text>

  <rect x="40" y="656" width="1020" height="156" rx="10" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
  <text x="64" y="690" font-size="16" font-weight="bold" fill="#6a1b7a">With ONE channel you could count pulses &#8212; but a wheel dragged backwards</text>
  <text x="64" y="714" font-size="16" font-weight="bold" fill="#6a1b7a">would count UP just the same. You would swear you drove forward.</text>
  <text x="64" y="752" font-size="14" fill="#4a1b55">The second channel is what makes the count SIGNED. It is the difference between</text>
  <text x="64" y="776" font-size="14" fill="#4a1b55">&#8220;the wheel moved&#8221; and &#8220;the wheel moved forward&#8221; &#8212; and only one of those can steer a robot.</text>
</svg>
