<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">Quadrature: Two Channels, 90 Degrees Apart</title>
  <desc id="desc">A RoboLore instructional graphic showing two encoder channels offset by a quarter cycle and how their order reveals forward or backward wheel motion.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0B1A2E" flood-opacity="0.08"/>
    </filter>
    <marker id="arrowBrass" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#C9A463"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6A9955"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#D9822B"/>
    </marker>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 800; fill: #0B1A2E; }
      .meta { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 600; fill: #3D5266; }
      .section { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 800; letter-spacing: 0.9px; fill: #3D5266; }
      .head { font-family: Arial, Helvetica, sans-serif; font-size: 21px; font-weight: 800; fill: #0B1A2E; }
      .body { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 500; fill: #1E1E1E; }
      .bodySmall { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 500; fill: #3D5266; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 800; fill: #0B1A2E; }
      .mono { font-family: 'Courier New', monospace; font-variant-ligatures: none; }
    </style>
  </defs>

  <rect width="1100" height="850" fill="#FFFFFF"/>

  <!-- Page title -->
  <text x="40" y="48" class="title">Quadrature: Two Channels, 90° Apart</text>
  <text x="1060" y="48" text-anchor="end" class="meta">GRAPHIC 6.3 · Lesson 6 · §3</text>
  <line x1="40" y1="70" x2="1060" y2="70" stroke="#C9A463" stroke-width="2.5"/>

  <!-- Waveform card -->
  <rect x="40" y="96" width="1020" height="344" rx="16" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2" filter="url(#shadow)"/>
  <text x="64" y="128" class="section">ONE CHANNEL COUNTS — TWO CHANNELS REVEAL DIRECTION</text>
  <text x="64" y="157" class="body">The signals switch HIGH and LOW in the same pattern, but Channel B is delayed by one-quarter of a cycle.</text>

  <!-- waveform plotting area -->
  <rect x="118" y="184" width="902" height="166" rx="10" fill="#FAFBFC" stroke="#E1E5E9"/>

  <!-- horizontal guides -->
  <line x1="164" y1="225" x2="990" y2="225" stroke="#DDE4E9" stroke-width="1"/>
  <line x1="164" y1="303" x2="990" y2="303" stroke="#DDE4E9" stroke-width="1"/>

  <text x="86" y="229" class="label" style="fill:#F44747;">CH A</text>
  <text x="86" y="307" class="label" style="fill:#007ACC;">CH B</text>

  <!-- Channel A -->
  <path d="M164 225 H234 V191 H304 V225 H374 V191 H444 V225 H514 V191 H584 V225 H654 V191 H724 V225 H794 V191 H864 V225 H934 V191 H990"
        fill="none" stroke="#F44747" stroke-width="4" stroke-linejoin="round"/>

  <!-- Channel B, quarter-cycle lag -->
  <path d="M164 269 H234 V303 H304 V269 H374 V303 H444 V269 H514 V303 H584 V269 H654 V303 H724 V269 H794 V303 H864 V269 H934 V303 H990"
        fill="none" stroke="#007ACC" stroke-width="4" stroke-linejoin="round"/>

  <!-- phase markers -->
  <line x1="164" y1="184" x2="164" y2="350" stroke="#9AA7B2" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="234" y1="184" x2="234" y2="350" stroke="#9AA7B2" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="304" y1="184" x2="304" y2="350" stroke="#9AA7B2" stroke-width="1" stroke-dasharray="3 6" opacity="0.55"/>
  <line x1="374" y1="184" x2="374" y2="350" stroke="#9AA7B2" stroke-width="1" stroke-dasharray="3 6" opacity="0.55"/>

  <line x1="168" y1="377" x2="226" y2="377" stroke="#C9A463" stroke-width="4" marker-end="url(#arrowBrass)"/>
  <rect x="246" y="360" width="668" height="36" rx="8" fill="#FFF8E8" stroke="#C9A463" stroke-width="1.5"/>
  <text x="580" y="384" text-anchor="middle" class="bodySmall" style="font-weight:800;fill:#7B6240;">B lags A by one-quarter cycle. That quarter-cycle lag is the 90° phase difference.</text>

  <!-- Direction cards -->
  <rect x="40" y="468" width="498" height="184" rx="16" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2" filter="url(#shadow)"/>
  <rect x="64" y="492" width="450" height="42" rx="9" fill="#F2F7EF" stroke="#6A9955" stroke-width="2"/>
  <text x="84" y="520" class="head" style="font-size:18px;fill:#4F7A42;">FORWARD — A rises first</text>
  <line x1="84" y1="558" x2="170" y2="558" stroke="#6A9955" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <text x="190" y="563" class="body"><tspan font-weight="800" fill="#F44747">A leads</tspan><tspan> → count UP</tspan></text>
  <text x="84" y="600" class="mono" font-size="13.5" fill="#3D5266">getCountsLeft() climbs: 100, 101, 102 ...</text>
  <text x="84" y="626" class="bodySmall" style="font-style:italic;">The encoder chip works out the order for you.</text>

  <rect x="562" y="468" width="498" height="184" rx="16" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2" filter="url(#shadow)"/>
  <rect x="586" y="492" width="450" height="42" rx="9" fill="#FFF3E8" stroke="#D9822B" stroke-width="2"/>
  <text x="606" y="520" class="head" style="font-size:18px;fill:#A85E17;">BACKWARD — B rises first</text>
  <line x1="606" y1="558" x2="692" y2="558" stroke="#D9822B" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <text x="712" y="563" class="body"><tspan font-weight="800" fill="#007ACC">B leads</tspan><tspan> → count DOWN</tspan></text>
  <text x="606" y="600" class="mono" font-size="13.5" fill="#3D5266">getCountsLeft() falls: 102, 101, 100 ...</text>
  <text x="606" y="626" class="bodySmall" style="font-style:italic;">Same two wires. Opposite order.</text>

  <!-- Bottom explanation card -->
  <rect x="40" y="676" width="1020" height="134" rx="16" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2" filter="url(#shadow)"/>
  <text x="64" y="710" class="section">WHY THE SECOND CHANNEL MATTERS</text>
  <text x="64" y="739" class="body">With one channel, a wheel dragged backward would still add pulses. The count would rise even though the robot moved the wrong way.</text>
  <rect x="64" y="760" width="972" height="32" rx="8" fill="#EAF5FF" stroke="#007ACC" stroke-width="1.5"/>
  <text x="550" y="781" text-anchor="middle" class="bodySmall" style="font-weight:800;fill:#005A9E;">The second channel makes the count SIGNED: not just “the wheel moved,” but “the wheel moved forward or backward.”</text>
</svg>
