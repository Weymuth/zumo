<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850">
<defs>
</defs>
<rect width="1100" height="850" fill="#F5F2E9"/>
<rect x="0" y="0" width="1100" height="64" fill="#0B1A2E"/>
<text x="550" y="41" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" fill="#FFFFFF" text-anchor="middle">EMIT → REFLECT → DETECT</text>
<text x="550" y="94" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#3D5266" text-anchor="middle">And the trick that stops sunlight from fooling it: the robot doesn’t shine a light. It blinks one, 38,000 times a second.</text>

<!-- stage 1 -->
<rect x="60" y="130" width="470" height="120" rx="10" fill="#EDF4EA" stroke="#315D38" stroke-width="2"/>
<circle cx="96" cy="168" r="16" fill="#315D38"/><text x="96" y="174" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="124" y="167" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#315D38">EMIT</text>
<text x="124" y="192" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E1E1E">The IR LEDs fire — invisible light, pulsed at 38 kHz.</text>
<text x="124" y="214" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E1E1E">Six rounds, faint to full: whisper → murmur → talk</text>
<text x="124" y="236" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E1E1E">→ project → shout → YELL.</text>

<!-- stage 2 -->
<rect x="60" y="268" width="470" height="120" rx="10" fill="#F3F3F3" stroke="#3D5266" stroke-width="2"/>
<circle cx="96" cy="306" r="16" fill="#3D5266"/><text x="96" y="312" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="124" y="305" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0B1A2E">REFLECT</text>
<text x="124" y="330" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E1E1E">If something is out there, some of that light bounces</text>
<text x="124" y="352" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E1E1E">back. Close, pale, and flat bounce best. Far, dark, and</text>
<text x="124" y="374" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E1E1E">angled bounce worst.</text>

<!-- stage 3 -->
<rect x="60" y="406" width="470" height="120" rx="10" fill="#F3F3F3" stroke="#3D5266" stroke-width="2"/>
<circle cx="96" cy="444" r="16" fill="#3D5266"/><text x="96" y="450" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="124" y="443" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#0B1A2E">DETECT</text>
<text x="124" y="468" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E1E1E">The receiver reports back after every round:</text>
<text x="124" y="490" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E1E1E">did the echo come back — yes or no?</text>
<text x="124" y="512" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" fill="#3D5266">All six rounds take about 13½ milliseconds.</text>

<!-- stage 4 -->
<rect x="60" y="544" width="470" height="120" rx="10" fill="#EDF4EA" stroke="#315D38" stroke-width="2"/>
<circle cx="96" cy="582" r="16" fill="#315D38"/><text x="96" y="588" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="124" y="581" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#315D38">COUNT</text>
<text x="124" y="606" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E1E1E">Your reading is simply <tspan font-weight="bold">how many rounds echoed</tspan>.</text>
<text x="124" y="628" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E1E1E">Even the whisper came back → <tspan font-family="Courier New, monospace" font-weight="bold" fill="#315D38">6</tspan>. Only the YELL → <tspan font-family="Courier New, monospace" font-weight="bold" fill="#315D38">1</tspan>.</text>
<text x="124" y="650" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E1E1E">Nothing at all → <tspan font-family="Courier New, monospace" font-weight="bold" fill="#315D38">0</tspan>.</text>

<!-- flow arrows down the left column -->

<rect x="560" y="130" width="480" height="330" rx="10" fill="#FFF8E1" stroke="#CCA700" stroke-width="2"/>
<rect x="560" y="130" width="480" height="38" rx="10" fill="#CCA700"/><rect x="560" y="156" width="480" height="12" fill="#CCA700"/>
<text x="800" y="157" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">WHY SUNLIGHT DOESN’T FOOL IT</text>
<text x="586" y="198" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E1E1E">The room is already drenched in infrared. So the receiver</text>
<text x="586" y="220" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E1E1E">is a <tspan font-weight="bold">tuned ear</tspan>: it only reacts to IR flickering at 38 kHz.</text>

<text x="586" y="262" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#7B6240">SUNLIGHT — steady, no flicker</text>
<line x1="586" y1="290" x2="1014" y2="290" stroke="#7B6240" stroke-width="4"/>
<text x="586" y="316" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#7B6240">✗ IGNORED</text>

<text x="586" y="356" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#315D38">THE ROBOT’S OWN LED — 38 kHz flicker</text>
<polyline points="586,398 596,398 596,376 616,376 616,398 636,398 636,376 656,376 656,398 676,398 676,376 696,376 696,398 716,398 716,376 736,376 736,398 756,398 756,376 776,376 776,398 796,398 796,376 816,376 816,398 836,398 836,376 856,376 856,398 876,398 876,376 896,376 896,398 916,398 916,376 936,376 936,398 956,398 956,376 976,376 976,398 1014,398" fill="none" stroke="#315D38" stroke-width="3"/>
<text x="586" y="428" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#315D38">✓ HEARD</text>
<text x="586" y="450" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" fill="#3D5266">Like picking a friend out of a crowd because they whistle a rhythm nobody else knows.</text>

<rect x="560" y="480" width="480" height="184" rx="10" fill="#FFF8E1" stroke="#CCA700" stroke-width="2"/>
<text x="586" y="512" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#7B6240">👁 THE LOOPHOLE</text>
<text x="586" y="542" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E1E1E">There is one other thing in the room that flickers at 38 kHz:</text>
<text x="586" y="564" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#7B6240">another robot running this exact program.</text>
<text x="586" y="592" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E1E1E">Your ear cannot tell its shout from your own echo. Point two</text>
<text x="586" y="614" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E1E1E">Zumos at each other and both sets of readings jump — with</text>
<text x="586" y="636" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1E1E1E">nothing moving in the room at all.</text>
<text x="586" y="658" font-family="Arial, Helvetica, sans-serif" font-size="13" font-style="italic" fill="#3D5266">That is Bonus Mystery 5. It is a bug you can hear, and a weapon you could use.</text>

<rect x="60" y="700" width="980" height="118" rx="10" fill="#EDF4EA" stroke="#315D38" stroke-width="2"/>
<text x="86" y="732" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#315D38">✅ SHOUT AND LISTEN — OR JUST LISTEN</text>
<text x="86" y="762" font-family="Courier New, monospace" font-size="15" fill="#1E1E1E"><tspan font-family="Courier New, monospace" font-weight="bold" fill="#0B1A2E">read()</tspan> is active sonar: fire the LEDs, then listen for your own echo. That is the whole cycle above.</text>
<text x="86" y="790" font-family="Courier New, monospace" font-size="15" fill="#1E1E1E"><tspan font-family="Courier New, monospace" font-weight="bold" fill="#0B1A2E">readBasic()</tspan> never fires a thing. It just listens — for somebody else’s 38 kHz. Section 3.6.</text>
</svg>
