<svg viewBox="0 0 1100 700" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a5276"/>
      <stop offset="1" stop-color="#2e86ab"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1100" height="700" fill="#ffffff"/>

  <!-- Title band -->
  <rect x="40" y="24" width="1020" height="52" rx="8" fill="url(#titleGrad)"/>
  <text x="60" y="59" fill="#ffffff" font-size="26" font-weight="bold">DIFFERENTIAL DRIVE</text>
  <text x="1040" y="57" fill="#d6e9f2" font-size="14" text-anchor="end">Zumo 32U4 Robotics &#183; Lesson 3</text>

  <!-- Layout:
       Left track:  x=330–410  (w=80)
       Gap:         x=410–430  (20px) — axle here
       Body:        x=430–670  (w=240)
       Gap:         x=670–690  (20px) — axle here
       Right track: x=690–770  (w=80)
  -->

  <!-- ===== BLADE (spans body only) ===== -->
  <polygon points="430,152 670,152 692,130 408,130" fill="#c9cfd6" stroke="#9aa3ad" stroke-width="2"/>
  <text x="550" y="114" fill="#6c757d" font-size="14" font-weight="bold" text-anchor="middle">&#9650; FRONT (blade)</text>

  <!-- ===== LEFT TRACK — narrow, square ends ===== -->
  <rect x="330" y="152" width="80" height="376" rx="0" fill="#222222" stroke="#444" stroke-width="1.5"/>
  <line x1="330" y1="196" x2="410" y2="196" stroke="#333" stroke-width="1"/>
  <line x1="330" y1="228" x2="410" y2="228" stroke="#333" stroke-width="1"/>
  <line x1="330" y1="260" x2="410" y2="260" stroke="#333" stroke-width="1"/>
  <line x1="330" y1="292" x2="410" y2="292" stroke="#333" stroke-width="1"/>
  <line x1="330" y1="324" x2="410" y2="324" stroke="#333" stroke-width="1"/>
  <line x1="330" y1="356" x2="410" y2="356" stroke="#333" stroke-width="1"/>
  <line x1="330" y1="388" x2="410" y2="388" stroke="#333" stroke-width="1"/>
  <line x1="330" y1="420" x2="410" y2="420" stroke="#333" stroke-width="1"/>
  <line x1="330" y1="452" x2="410" y2="452" stroke="#333" stroke-width="1"/>
  <line x1="330" y1="484" x2="410" y2="484" stroke="#333" stroke-width="1"/>
  <line x1="330" y1="516" x2="410" y2="516" stroke="#333" stroke-width="1"/>

  <!-- ===== RIGHT TRACK — narrow, square ends ===== -->
  <rect x="690" y="152" width="80" height="376" rx="0" fill="#222222" stroke="#444" stroke-width="1.5"/>
  <line x1="690" y1="196" x2="770" y2="196" stroke="#333" stroke-width="1"/>
  <line x1="690" y1="228" x2="770" y2="228" stroke="#333" stroke-width="1"/>
  <line x1="690" y1="260" x2="770" y2="260" stroke="#333" stroke-width="1"/>
  <line x1="690" y1="292" x2="770" y2="292" stroke="#333" stroke-width="1"/>
  <line x1="690" y1="324" x2="770" y2="324" stroke="#333" stroke-width="1"/>
  <line x1="690" y1="356" x2="770" y2="356" stroke="#333" stroke-width="1"/>
  <line x1="690" y1="388" x2="770" y2="388" stroke="#333" stroke-width="1"/>
  <line x1="690" y1="420" x2="770" y2="420" stroke="#333" stroke-width="1"/>
  <line x1="690" y1="452" x2="770" y2="452" stroke="#333" stroke-width="1"/>
  <line x1="690" y1="484" x2="770" y2="484" stroke="#333" stroke-width="1"/>
  <line x1="690" y1="516" x2="770" y2="516" stroke="#333" stroke-width="1"/>

  <!-- ===== BODY ===== -->
  <rect x="430" y="152" width="240" height="376" rx="4" fill="#3a3a3a"/>

  <!-- Motors at front corners inside body -->
  <rect x="436" y="158" width="72" height="54" rx="3" fill="#b08d57" stroke="#8a6d3b" stroke-width="1.5"/>
  <text x="472" y="182" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">L-MOTOR</text>
  <text x="472" y="196" fill="#e8d5a0" font-size="9" text-anchor="middle">gearbox</text>

  <rect x="592" y="158" width="72" height="54" rx="3" fill="#b08d57" stroke="#8a6d3b" stroke-width="1.5"/>
  <text x="628" y="182" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">R-MOTOR</text>
  <text x="628" y="196" fill="#e8d5a0" font-size="9" text-anchor="middle">gearbox</text>

  <!-- ===== LEFT AXLE (gap between motor edge and track) ===== -->
  <!-- Axle shaft -->
  <rect x="410" y="180" width="20" height="8" rx="2" fill="#aaaaaa" stroke="#888" stroke-width="1"/>
  <!-- Axle label -->
  <text x="420" y="168" fill="#9aa0a6" font-size="11" text-anchor="middle">axle</text>

  <!-- ===== RIGHT AXLE ===== -->
  <rect x="670" y="180" width="20" height="8" rx="2" fill="#aaaaaa" stroke="#888" stroke-width="1"/>
  <text x="680" y="168" fill="#9aa0a6" font-size="11" text-anchor="middle">axle</text>

  <!-- PCB area on body -->
  <rect x="438" y="216" width="224" height="182" rx="2" fill="#1e3a1e"/>

  <!-- OLED -->
  <rect x="456" y="228" width="188" height="120" rx="4" fill="#0a2a5e" stroke="#1a4a8e" stroke-width="2"/>
  <text x="550" y="276" fill="#8ab4f8" font-size="14" font-family="Courier New, monospace" text-anchor="middle">Pololu</text>
  <text x="550" y="298" fill="#ffffff" font-size="12" font-family="Courier New, monospace" text-anchor="middle">Zumo 32U4</text>

  <!-- Buttons -->
  <circle cx="502" cy="428" r="12" fill="#555e68"/>
  <text x="502" y="433" fill="#cccccc" font-size="11" font-weight="bold" text-anchor="middle">A</text>
  <circle cx="550" cy="428" r="12" fill="#555e68"/>
  <text x="550" y="433" fill="#cccccc" font-size="11" font-weight="bold" text-anchor="middle">B</text>
  <circle cx="598" cy="428" r="12" fill="#555e68"/>
  <text x="598" y="433" fill="#cccccc" font-size="11" font-weight="bold" text-anchor="middle">C</text>

  <!-- Rear -->
  <text x="550" y="575" fill="#6c757d" font-size="14" font-weight="bold" text-anchor="middle">&#9660; REAR</text>

  <!-- ===== LEFT DRIVE ARROW ===== -->
  <rect x="148" y="326" width="180" height="8" fill="#c45d76"/>
  <polygon points="148,314 148,342 116,330" fill="#c45d76"/>
  <text x="222" y="312" fill="#c45d76" font-size="14" font-weight="bold" text-anchor="middle">Left speed</text>
  <text x="222" y="356" fill="#9a4459" font-size="12" text-anchor="middle">setLeftSpeed()</text>

  <!-- ===== RIGHT DRIVE ARROW ===== -->
  <rect x="772" y="326" width="180" height="8" fill="#3a7d5c"/>
  <polygon points="952,314 952,342 984,330" fill="#3a7d5c"/>
  <text x="878" y="312" fill="#3a7d5c" font-size="14" font-weight="bold" text-anchor="middle">Right speed</text>
  <text x="878" y="356" fill="#2a5a42" font-size="12" text-anchor="middle">setRightSpeed()</text>

  <!-- ===== Steering key ===== -->
  <rect x="100" y="596" width="900" height="72" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
  <text x="550" y="622" fill="#212121" font-size="14" font-weight="bold" text-anchor="middle">Steering by speed difference</text>
  <text x="205" y="648" fill="#4d5358" font-size="13">Same speed &#8594; straight</text>
  <text x="470" y="648" fill="#4d5358" font-size="13">Left faster &#8594; turns right</text>
  <text x="730" y="648" fill="#4d5358" font-size="13">Opposite &#8594; spins in place</text>

  <text x="1060" y="690" fill="#9aa0a6" font-size="11" text-anchor="end">GRAPHIC 3.9</text>
</svg>
