<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850">
  <defs>
    <linearGradient id="tb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a5276"/><stop offset="1" stop-color="#2e86ab"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="850" fill="#fafafa"/>

  <rect x="0" y="0" width="1100" height="74" fill="url(#tb)"/>
  <text x="34" y="47" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#ffffff">What Each Sensor Actually Watches</text>

  <text x="550" y="118" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#555">The same turn. Two instruments. Only one of them can see the floor.</text>

  <!-- ================= LEFT: ENCODER ================= -->
  <rect x="45" y="150" width="480" height="620" rx="12" fill="#ffffff" stroke="#c0392b" stroke-width="3"/>
  <rect x="45" y="150" width="480" height="52" rx="12" fill="#c0392b"/>
  <rect x="45" y="186" width="480" height="16" fill="#c0392b"/>
  <text x="285" y="185" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#ffffff">ENCODER</text>

  <text x="285" y="238" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#7b241c">It is bolted to the MOTOR.</text>

  <!-- wheel -->
  <circle cx="285" cy="360" r="78" fill="#34495e" stroke="#2c3e50" stroke-width="4"/>
  <circle cx="285" cy="360" r="30" fill="#7f8c8d"/>
  <circle cx="285" cy="360" r="9" fill="#ecf0f1"/>
  <!-- rotation arrow: single polygon -->
  <polygon points="285,258 315,286 296,286 296,300 274,300 274,286 255,286" fill="#e74c3c"/>
  <text x="285" y="470" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#c0392b">It counts THIS spinning.</text>

  <!-- the floor, slipping -->
  <rect x="105" y="500" width="360" height="26" fill="#d5dbdb" stroke="#95a5a6" stroke-width="2"/>
  <text x="285" y="518" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#566573">slick floor</text>
  <text x="285" y="556" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#7b241c">the rubber is sliding &#8212; and nothing measures that</text>

  <rect x="80" y="586" width="410" height="150" rx="8" fill="#fdecea" stroke="#e74c3c" stroke-width="2"/>
  <text x="285" y="618" text-anchor="middle" font-family="Consolas, monospace" font-size="21" font-weight="600" fill="#922b21">&#8220;90 degrees.&#8221;</text>
  <text x="285" y="654" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#922b21">And it is CERTAIN.</text>
  <text x="285" y="692" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#7b241c">The wheel really did spin that far.</text>
  <text x="285" y="716" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#7b241c">Every number it gave you was true.</text>

  <!-- ================= RIGHT: GYRO ================= -->
  <rect x="575" y="150" width="480" height="620" rx="12" fill="#ffffff" stroke="#1e8449" stroke-width="3"/>
  <rect x="575" y="150" width="480" height="52" rx="12" fill="#1e8449"/>
  <rect x="575" y="186" width="480" height="16" fill="#1e8449"/>
  <text x="815" y="185" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#ffffff">GYRO</text>

  <text x="815" y="238" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#145a32">It is bolted to the CHASSIS.</text>

  <!-- robot body top-down -->
  <rect x="730" y="300" width="170" height="130" rx="10" fill="#2e86ab" stroke="#1a5276" stroke-width="4"/>
  <rect x="712" y="316" width="20" height="46" rx="4" fill="#34495e"/>
  <rect x="712" y="372" width="20" height="46" rx="4" fill="#34495e"/>
  <rect x="898" y="316" width="20" height="46" rx="4" fill="#34495e"/>
  <rect x="898" y="372" width="20" height="46" rx="4" fill="#34495e"/>
  <circle cx="815" cy="365" r="17" fill="#f1c40f" stroke="#b7950b" stroke-width="2"/>
  <text x="815" y="371" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#7d6608">IMU</text>
  <!-- robot rotation arrow -->
  <polygon points="815,258 848,290 827,290 827,296 803,296 803,290 782,290" fill="#27ae60"/>
  <text x="815" y="470" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#1e8449">It measures THIS turning.</text>

  <rect x="635" y="500" width="360" height="26" fill="#d5dbdb" stroke="#95a5a6" stroke-width="2"/>
  <text x="815" y="518" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#566573">slick floor</text>
  <text x="815" y="556" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#145a32">the wheels slip &#8212; the gyro does not care</text>

  <rect x="610" y="586" width="410" height="150" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <text x="815" y="618" text-anchor="middle" font-family="Consolas, monospace" font-size="21" font-weight="600" fill="#145a32">&#8220;31 degrees.&#8221;</text>
  <text x="815" y="654" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#145a32">And it is RIGHT.</text>
  <text x="815" y="692" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#186a3b">It never looked at the wheels at all.</text>
  <text x="815" y="716" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#186a3b">It watched the ROBOT.</text>

  <text x="550" y="805" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#1a5276">A sensor can only tell you about the thing it watches.</text>
</svg>
