<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850">
  <defs>
    </defs>

  <rect width="1100" height="850" fill="#ffffff"/>

  <!-- Title band -->
  <rect x="0" y="0" width="1100" height="72" fill="#0B1A2E"/>
  <text x="550" y="46" font-family="Helvetica,Arial,sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle">Reading a Function Call: playFrequency()</text>

  <!-- The code line -->
  <rect x="90" y="108" width="920" height="86" rx="6" fill="#1e1e1e"/>
  <text x="120" y="163" font-family="Courier New, monospace" font-size="30" fill="#dcdcaa">buzzer</text>
  <text x="222" y="163" font-family="Courier New, monospace" font-size="30" fill="#e8e8e8">.</text>
  <text x="240" y="163" font-family="Courier New, monospace" font-size="30" fill="#dcdcaa">playFrequency</text>
  <text x="470" y="163" font-family="Courier New, monospace" font-size="30" fill="#e8e8e8">(</text>
  <text x="492" y="163" font-family="Courier New, monospace" font-size="30" fill="#b5cea8">440</text>
  <text x="546" y="163" font-family="Courier New, monospace" font-size="30" fill="#e8e8e8">,</text>
  <text x="576" y="163" font-family="Courier New, monospace" font-size="30" fill="#b5cea8">800</text>
  <text x="630" y="163" font-family="Courier New, monospace" font-size="30" fill="#e8e8e8">,</text>
  <text x="660" y="163" font-family="Courier New, monospace" font-size="30" fill="#b5cea8">15</text>
  <text x="698" y="163" font-family="Courier New, monospace" font-size="30" fill="#e8e8e8">);</text>

  <!-- Connector polygons: single-polygon arrows, no rect+head -->
  <polygon points="507,200 507,222 215,222 215,240 203,240 215,262 227,240 215,240 215,222" fill="#2e86ab"/>
  <rect x="207" y="200" width="10" height="26" fill="#2e86ab"/>
  <polygon points="545,200 545,240 538,240 550,262 562,240 555,240 555,200" fill="#3a7d5c"/>
  <polygon points="672,200 672,222 885,222 885,240 873,240 885,262 897,240 885,240 885,222" fill="#8a5a2b"/>
  <rect x="667" y="200" width="10" height="26" fill="#8a5a2b"/>

  <!-- Card 1: FREQUENCY -->
  <rect x="60" y="266" width="310" height="252" rx="8" fill="#eaf3f8" stroke="#2e86ab" stroke-width="3"/>
  <rect x="60" y="266" width="310" height="46" rx="8" fill="#2e86ab"/>
  <rect x="60" y="298" width="310" height="14" fill="#2e86ab"/>
  <text x="215" y="298" font-family="Helvetica,Arial,sans-serif" font-size="21" font-weight="bold" fill="#ffffff" text-anchor="middle">1. FREQUENCY</text>
  <text x="215" y="352" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#1a5276" text-anchor="middle">440</text>
  <text x="215" y="382" font-family="Helvetica,Arial,sans-serif" font-size="19" fill="#1a5276" text-anchor="middle">Hertz — cycles per second</text>
  <text x="82" y="418" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#333333">How HIGH or LOW the note is.</text>
  <text x="82" y="444" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#333333">Bigger number = higher pitch.</text>
  <text x="82" y="474" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#1a5276">Double it = up one octave.</text>
  <text x="82" y="500" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#333333">440 → 880 is the same note,</text>
  <text x="82" y="522" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#333333">one octave higher.</text>

  <!-- Card 2: DURATION -->
  <rect x="395" y="266" width="310" height="252" rx="8" fill="#e9f5ee" stroke="#3a7d5c" stroke-width="3"/>
  <rect x="395" y="266" width="310" height="46" rx="8" fill="#3a7d5c"/>
  <rect x="395" y="298" width="310" height="14" fill="#3a7d5c"/>
  <text x="550" y="298" font-family="Helvetica,Arial,sans-serif" font-size="21" font-weight="bold" fill="#ffffff" text-anchor="middle">2. DURATION</text>
  <text x="550" y="352" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#2a5a42" text-anchor="middle">800</text>
  <text x="550" y="382" font-family="Helvetica,Arial,sans-serif" font-size="19" fill="#2a5a42" text-anchor="middle">milliseconds</text>
  <text x="417" y="418" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#333333">How LONG the note lasts.</text>
  <text x="417" y="448" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#2a5a42">1000 ms = 1 second</text>
  <text x="417" y="474" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#333333">800 ms is most of a second</text>
  <text x="417" y="496" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#333333">— you will hear it clearly.</text>
  <text x="417" y="518" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#333333">Drop it to 200 and it is a blip.</text>

  <!-- Card 3: VOLUME -->
  <rect x="730" y="266" width="310" height="252" rx="8" fill="#fbf1e6" stroke="#8a5a2b" stroke-width="3"/>
  <rect x="730" y="266" width="310" height="46" rx="8" fill="#8a5a2b"/>
  <rect x="730" y="298" width="310" height="14" fill="#8a5a2b"/>
  <text x="885" y="298" font-family="Helvetica,Arial,sans-serif" font-size="21" font-weight="bold" fill="#ffffff" text-anchor="middle">3. VOLUME</text>
  <text x="885" y="352" font-family="Helvetica,Arial,sans-serif" font-size="34" font-weight="bold" fill="#6b4520" text-anchor="middle">15</text>
  <text x="885" y="382" font-family="Helvetica,Arial,sans-serif" font-size="19" fill="#6b4520" text-anchor="middle">0 = silent, 15 = loudest</text>
  <text x="752" y="418" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#333333">How LOUD the note is.</text>
  <text x="752" y="448" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#333333">Each step down roughly</text>
  <text x="752" y="470" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#333333">halves it, so 14 is much</text>
  <text x="752" y="492" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#333333">quieter than 15 — not a</text>
  <text x="752" y="514" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#333333">smooth slider.</text>

  <!-- ORDER MATTERS band -->
  <rect x="60" y="548" width="980" height="76" rx="8" fill="#fff8e1" stroke="#ffb300" stroke-width="3"/>
  <text x="84" y="580" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" fill="#856404">⚠️ ORDER MATTERS — the robot reads them by POSITION, not by name</text>
  <text x="84" y="608" font-family="Helvetica,Arial,sans-serif" font-size="18" fill="#5f4a12">playFrequency(800, 440, 15) is legal code. It plays an 800 Hz note for 440 ms — not what you meant.</text>

  <!-- The silence rule -->
  <rect x="60" y="648" width="980" height="180" rx="8" fill="#f5f7fa" stroke="#5a6872" stroke-width="3"/>
  <text x="84" y="682" font-family="Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" fill="#2c3e50">The note plays in the BACKGROUND — your program keeps running</text>
  <text x="84" y="712" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#333333">Starting a note does not pause the program. If the next line starts another note, it overwrites the first one.</text>

  <rect x="84" y="730" width="440" height="74" rx="6" fill="#1e1e1e"/>
  <text x="100" y="754" font-family="Courier New, monospace" font-size="16" fill="#e8e8e8">playFrequency(440, 200, 15);</text>
  <text x="100" y="778" font-family="Courier New, monospace" font-size="16" fill="#e8e8e8">playFrequency(880, 200, 15);</text>
  <text x="100" y="796" font-family="Courier New, monospace" font-size="15" fill="#f48771">→ you hear ONE blip, not two</text>

  <rect x="576" y="726" width="440" height="82" rx="6" fill="#1e1e1e"/>
  <text x="592" y="748" font-family="Courier New, monospace" font-size="16" fill="#e8e8e8">playFrequency(440, 200, 15);</text>
  <text x="592" y="768" font-family="Courier New, monospace" font-size="16" fill="#b5cea8">delay(250);</text>
  <text x="592" y="788" font-family="Courier New, monospace" font-size="16" fill="#e8e8e8">playFrequency(880, 200, 15);</text>
  <text x="592" y="804" font-family="Courier New, monospace" font-size="15" fill="#6a9955">→ two clear notes</text>
</svg>