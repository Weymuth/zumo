<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img">
  <title>GRAPHIC 7.15 — PlatformIO Project File Tree</title>
  <desc>RoboLore instructional graphic.</desc>
  <rect x="0" y="0" width="1100" height="850" fill="#F5F2E9"/>
  <rect x="0" y="0" width="1100" height="86" fill="#0B1A2E"/>
  <text x="40" y="54" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">GRAPHIC 7.15 — PlatformIO Project File Tree</text>
  <text x="1060" y="52" fill="#E8EEF4" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="end">Lesson 7 · project structure</text>
  <line x1="0" y1="86" x2="1100" y2="86" stroke="#C9A463" stroke-width="3"/>
  <rect x="40" y="116" width="1020" height="694" rx="16" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
  <g transform="translate(70.000 170.769) scale(1.230769)"><!-- background card -->
  <rect x="1" y="1" width="778" height="468" rx="10" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
  <!-- tree panel -->
  <rect x="18" y="18" width="360" height="434" rx="8" fill="#F3F3F3" stroke="#D4D4D4" stroke-width="1"/>

  <!-- ===== tree connector lines (no arrows, thin L-shapes) ===== -->
  <g stroke="#D4D4D4" stroke-width="1.5" fill="none">
    <!-- trunk from root down to platformio.ini row -->
    <path d="M 46 66 V 442"/>
    <!-- branches: include, src, lib, test, platformio.ini -->
    <path d="M 46 82 H 62"/>
    <path d="M 46 218 H 62"/>
    <path d="M 46 354 H 62"/>
    <path d="M 46 388 H 62"/>
    <path d="M 46 422 H 62"/>
    <!-- include children trunk -->
    <path d="M 78 96 V 184 M 78 116 H 94 M 78 150 H 94 M 78 184 H 94"/>
    <!-- src children trunk -->
    <path d="M 78 232 V 320 M 78 252 H 94 M 78 286 H 94 M 78 320 H 94"/>
  </g>
  <!-- mask trunk below last branch point -->
  <rect x="44" y="423" width="4" height="24" fill="#F3F3F3"/>

  <!-- ===== icons ===== -->
  <!-- folder glyph template drawn inline per row -->
  <g fill="#569CD6" stroke="#007ACC" stroke-width="1">
    <path d="M 30 52 h 9 l 3 3 h 12 a 2 2 0 0 1 2 2 v 10 a 2 2 0 0 1 -2 2 h -24 a 2 2 0 0 1 -2 -2 v -13 a 2 2 0 0 1 2 -2 z"/>
    <path d="M 66 74 h 9 l 3 3 h 12 a 2 2 0 0 1 2 2 v 10 a 2 2 0 0 1 -2 2 h -24 a 2 2 0 0 1 -2 -2 v -13 a 2 2 0 0 1 2 -2 z"/>
    <path d="M 66 210 h 9 l 3 3 h 12 a 2 2 0 0 1 2 2 v 10 a 2 2 0 0 1 -2 2 h -24 a 2 2 0 0 1 -2 -2 v -13 a 2 2 0 0 1 2 -2 z"/>
    <path d="M 66 346 h 9 l 3 3 h 12 a 2 2 0 0 1 2 2 v 10 a 2 2 0 0 1 -2 2 h -24 a 2 2 0 0 1 -2 -2 v -13 a 2 2 0 0 1 2 -2 z"/>
    <path d="M 66 380 h 9 l 3 3 h 12 a 2 2 0 0 1 2 2 v 10 a 2 2 0 0 1 -2 2 h -24 a 2 2 0 0 1 -2 -2 v -13 a 2 2 0 0 1 2 -2 z"/>
  </g>
  <!-- .h file icons (blue chip) -->
  <g fill="#EAF5FF" stroke="#007ACC" stroke-width="1">
    <path d="M 98 106 h 13 l 5 5 v 15 h -18 z"/>
    <path d="M 98 140 h 13 l 5 5 v 15 h -18 z"/>
    <path d="M 98 174 h 13 l 5 5 v 15 h -18 z"/>
  </g>
  <!-- .cpp file icons (green chip) -->
  <g fill="#EDF4EA" stroke="#6A9955" stroke-width="1">
    <path d="M 98 242 h 13 l 5 5 v 15 h -18 z"/>
    <path d="M 98 276 h 13 l 5 5 v 15 h -18 z"/>
    <path d="M 98 310 h 13 l 5 5 v 15 h -18 z"/>
  </g>
  <!-- platformio.ini gear file (gray chip) -->
  <g fill="#F3F3F3" stroke="#3D5266" stroke-width="1">
    <path d="M 66 412 h 13 l 5 5 v 15 h -18 z"/>
  </g>

  <!-- ===== filenames (monospace, textLength locked) ===== -->
  <g font-family="Courier New, Courier, monospace" font-size="15" fill="#0B1A2E">
    <text x="58" y="66" font-weight="bold" textLength="120" font-family="Arial, Helvetica, sans-serif">YourProject/</text>
    <text x="98" y="88" font-weight="bold" fill="#0B1A2E" textLength="80" font-family="Arial, Helvetica, sans-serif">include/</text>
    <text x="122" y="120" textLength="130" font-family="Courier New, monospace">RobotConfig.h</text>
    <text x="122" y="154" textLength="140" font-family="Courier New, monospace">RobotSensors.h</text>
    <text x="122" y="188" textLength="130" font-family="Courier New, monospace">RobotMotion.h</text>
    <text x="98" y="224" font-weight="bold" fill="#315D38" textLength="40" font-family="Arial, Helvetica, sans-serif">src/</text>
    <text x="122" y="256" textLength="80" font-family="Courier New, monospace">main.cpp</text>
    <text x="122" y="290" textLength="160" font-family="Courier New, monospace">RobotSensors.cpp</text>
    <text x="122" y="324" textLength="150" font-family="Courier New, monospace">RobotMotion.cpp</text>
    <text x="98" y="360" fill="#3D5266" textLength="40" font-family="Arial, Helvetica, sans-serif">lib/</text>
    <text x="98" y="394" fill="#3D5266" textLength="50" font-family="Arial, Helvetica, sans-serif">test/</text>
    <text x="98" y="426" textLength="140" font-family="Courier New, monospace">platformio.ini</text>
  </g>

  <!-- ===== annotation column (no arrows; aligned notes) ===== -->
  <g font-size="14" font-style="italic" fill="#3D5266">
    <text x="398" y="88" font-family="Courier New, monospace">Put your header files (<tspan font-family="Courier New, monospace" font-style="normal" fill="#0B1A2E">.h</tspan>) here</text>
    <text x="398" y="224" font-family="Courier New, monospace">Put your source files (<tspan font-family="Courier New, monospace" font-style="normal" fill="#315D38">.cpp</tspan>) here</text>
    <text x="398" y="360" font-family="Arial, Helvetica, sans-serif">For libraries (we won't use this yet)</text>
    <text x="398" y="394" font-family="Arial, Helvetica, sans-serif">For test code (we won't use this yet)</text>
    <text x="398" y="426" font-family="Arial, Helvetica, sans-serif">Project configuration (<tspan font-weight="bold" font-style="normal" fill="#F44747">don't edit</tspan>)</text>
  </g>
  <!-- dotted leader lines from annotated rows to notes (dots, not arrows) -->
  <g stroke="#D4D4D4" stroke-width="1.2" stroke-dasharray="2 4">
    <line x1="185" y1="83" x2="390" y2="83"/>
    <line x1="145" y1="219" x2="390" y2="219"/>
    <line x1="140" y1="355" x2="390" y2="355"/>
    <line x1="150" y1="389" x2="390" y2="389"/>
    <line x1="242" y1="421" x2="390" y2="421"/>
  </g>
</g>
</svg>
