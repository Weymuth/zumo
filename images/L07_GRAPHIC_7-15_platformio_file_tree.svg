<svg viewBox="0 0 780 470" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <!-- background card -->
  <rect x="1" y="1" width="778" height="468" rx="10" fill="#ffffff" stroke="#d5dde3" stroke-width="2"/>
  <!-- tree panel -->
  <rect x="18" y="18" width="360" height="434" rx="8" fill="#f6f9fb" stroke="#e0e8ee" stroke-width="1"/>

  <!-- ===== tree connector lines (no arrows, thin L-shapes) ===== -->
  <g stroke="#b8c4cd" stroke-width="1.5" fill="none">
    <!-- trunk from root down to platformio.ini row -->
    <path d="M 46 66 V 442"/>
    <!-- branches: include, src, lib, test, platformio.ini -->
    <path d="M 46 82 H 62"/>
    <path d="M 46 218 H 62"/>
    <path d="M 46 354 H 62"/>
    <path d="M 46 388 H 62"/>
    <path d="M 46 422 H 62"/>
    <!-- include children trunk -->
    <path d="M 78 96 V 184 M 78 116 H 94 M 78 150 H 94 M 78 184 H 94"/>
    <!-- src children trunk -->
    <path d="M 78 232 V 320 M 78 252 H 94 M 78 286 H 94 M 78 320 H 94"/>
  </g>
  <!-- mask trunk below last branch point -->
  <rect x="44" y="423" width="4" height="24" fill="#f6f9fb"/>

  <!-- ===== icons ===== -->
  <!-- folder glyph template drawn inline per row -->
  <g fill="#8fb8d4" stroke="#5a92b8" stroke-width="1">
    <path d="M 30 52 h 9 l 3 3 h 12 a 2 2 0 0 1 2 2 v 10 a 2 2 0 0 1 -2 2 h -24 a 2 2 0 0 1 -2 -2 v -13 a 2 2 0 0 1 2 -2 z"/>
    <path d="M 66 74 h 9 l 3 3 h 12 a 2 2 0 0 1 2 2 v 10 a 2 2 0 0 1 -2 2 h -24 a 2 2 0 0 1 -2 -2 v -13 a 2 2 0 0 1 2 -2 z"/>
    <path d="M 66 210 h 9 l 3 3 h 12 a 2 2 0 0 1 2 2 v 10 a 2 2 0 0 1 -2 2 h -24 a 2 2 0 0 1 -2 -2 v -13 a 2 2 0 0 1 2 -2 z"/>
    <path d="M 66 346 h 9 l 3 3 h 12 a 2 2 0 0 1 2 2 v 10 a 2 2 0 0 1 -2 2 h -24 a 2 2 0 0 1 -2 -2 v -13 a 2 2 0 0 1 2 -2 z"/>
    <path d="M 66 380 h 9 l 3 3 h 12 a 2 2 0 0 1 2 2 v 10 a 2 2 0 0 1 -2 2 h -24 a 2 2 0 0 1 -2 -2 v -13 a 2 2 0 0 1 2 -2 z"/>
  </g>
  <!-- .h file icons (blue chip) -->
  <g fill="#e3f0f9" stroke="#3498db" stroke-width="1">
    <path d="M 98 106 h 13 l 5 5 v 15 h -18 z"/>
    <path d="M 98 140 h 13 l 5 5 v 15 h -18 z"/>
    <path d="M 98 174 h 13 l 5 5 v 15 h -18 z"/>
  </g>
  <!-- .cpp file icons (green chip) -->
  <g fill="#e8f3ee" stroke="#3a7d5c" stroke-width="1">
    <path d="M 98 242 h 13 l 5 5 v 15 h -18 z"/>
    <path d="M 98 276 h 13 l 5 5 v 15 h -18 z"/>
    <path d="M 98 310 h 13 l 5 5 v 15 h -18 z"/>
  </g>
  <!-- platformio.ini gear file (gray chip) -->
  <g fill="#eef1f3" stroke="#6c757d" stroke-width="1">
    <path d="M 66 412 h 13 l 5 5 v 15 h -18 z"/>
  </g>

  <!-- ===== filenames (monospace, textLength locked) ===== -->
  <g font-family="'Courier New', Courier, monospace" font-size="15" fill="#2c3e50">
    <text x="58" y="66" font-weight="bold" textLength="120">YourProject/</text>
    <text x="98" y="88" font-weight="bold" fill="#1a5276" textLength="80">include/</text>
    <text x="122" y="120" textLength="130">RobotConfig.h</text>
    <text x="122" y="154" textLength="140">RobotSensors.h</text>
    <text x="122" y="188" textLength="130">RobotMotion.h</text>
    <text x="98" y="224" font-weight="bold" fill="#2a5a42" textLength="40">src/</text>
    <text x="122" y="256" textLength="80">main.cpp</text>
    <text x="122" y="290" textLength="160">RobotSensors.cpp</text>
    <text x="122" y="324" textLength="150">RobotMotion.cpp</text>
    <text x="98" y="360" fill="#6c757d" textLength="40">lib/</text>
    <text x="98" y="394" fill="#6c757d" textLength="50">test/</text>
    <text x="98" y="426" textLength="140">platformio.ini</text>
  </g>

  <!-- ===== annotation column (no arrows; aligned notes) ===== -->
  <g font-size="14" font-style="italic" fill="#5a6a76">
    <text x="398" y="88">Put your header files (<tspan font-family="'Courier New', monospace" font-style="normal" fill="#1a5276">.h</tspan>) here</text>
    <text x="398" y="224">Put your source files (<tspan font-family="'Courier New', monospace" font-style="normal" fill="#2a5a42">.cpp</tspan>) here</text>
    <text x="398" y="360">For libraries (we won't use this yet)</text>
    <text x="398" y="394">For test code (we won't use this yet)</text>
    <text x="398" y="426">Project configuration (<tspan font-weight="bold" font-style="normal" fill="#c0392b">don't edit</tspan>)</text>
  </g>
  <!-- dotted leader lines from annotated rows to notes (dots, not arrows) -->
  <g stroke="#c9d4dc" stroke-width="1.2" stroke-dasharray="2 4">
    <line x1="185" y1="83" x2="390" y2="83"/>
    <line x1="145" y1="219" x2="390" y2="219"/>
    <line x1="140" y1="355" x2="390" y2="355"/>
    <line x1="150" y1="389" x2="390" y2="389"/>
    <line x1="242" y1="421" x2="390" y2="421"/>
  </g>
</svg>
