<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">Graphic 11.3 — Five-Sensor Line Array</title>
  <desc id="desc">Top-view RoboLore diagram labeling the five line sensors from far left to far right.</desc>

  <rect x="0" y="0" width="1100" height="850" fill="#F5F2E9"/>
  <rect x="0" y="0" width="1100" height="72" fill="#0B1A2E"/>
  <text x="34" y="45" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">GRAPHIC 11.3 — Five-Sensor Line Array</text>
  <text x="1066" y="45" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#E8EEF4">indices run from left to right</text>
  <line x1="0" y1="72" x2="1100" y2="72" stroke="#C9A463" stroke-width="3"/>

  <rect x="42" y="102" width="1016" height="690" rx="16" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
  <text x="550" y="151" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2.5" fill="#0B1A2E">FRONT OF ROBOT</text>
  <polygon points="536,165 564,165 550,184" fill="#C9A463"/>

  <!-- chassis top view -->
  <rect x="132" y="196" width="836" height="410" rx="24" fill="#F3F3F3" stroke="#0B1A2E" stroke-width="3"/>
  <line x1="156" y1="196" x2="944" y2="196" stroke="#C9A463" stroke-width="7"/>
  <line x1="550" y1="338" x2="550" y2="548" stroke="#B8C4CD" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="550" y="574" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-style="italic" fill="#66788A">center</text>

  <!-- sensor indices -->
  <g font-family="Courier New, monospace" font-size="22" font-weight="700" fill="#0B1A2E" text-anchor="middle">
    <text x="250" y="276">[0]</text><text x="400" y="276">[1]</text><text x="550" y="276">[2]</text><text x="700" y="276">[3]</text><text x="850" y="276">[4]</text>
  </g>

  <!-- sensor bodies -->
  <g fill="#6A9955" stroke="#315D38" stroke-width="3">
    <circle cx="250" cy="326" r="24"/><circle cx="400" cy="326" r="24"/><circle cx="550" cy="326" r="24"/><circle cx="700" cy="326" r="24"/><circle cx="850" cy="326" r="24"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="242" cy="318" r="5"/><circle cx="392" cy="318" r="5"/><circle cx="542" cy="318" r="5"/><circle cx="692" cy="318" r="5"/><circle cx="842" cy="318" r="5"/>
  </g>

  <!-- position labels -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#3D5266" text-anchor="middle">
    <text x="250" y="394">Far left</text><text x="400" y="394">Left</text><text x="550" y="394">Center</text><text x="700" y="394">Right</text><text x="850" y="394">Far right</text>
  </g>

  <line x1="874" y1="326" x2="968" y2="326" stroke="#B8C4CD" stroke-width="2" stroke-dasharray="4 5"/>
  <text x="982" y="332" font-family="Arial, Helvetica, sans-serif" font-size="17" font-style="italic" fill="#3D5266">Line sensors</text>

  <rect x="130" y="640" width="840" height="96" rx="14" fill="#EDF4FA" stroke="#007ACC" stroke-width="2"/>
  <text x="550" y="675" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0B1A2E">The array is ordered from the robot’s left side to its right side.</text>
  <text x="525" y="707" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#3D5266">Index</text>
  <text x="550" y="707" text-anchor="middle" font-family="Courier New, monospace" font-size="17" font-weight="700" fill="#0B1A2E">[2]</text>
  <text x="575" y="707" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#3D5266">is the center sensor.</text>

</svg>