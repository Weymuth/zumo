<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850">
<defs>
<linearGradient id="tb" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#1a5276"/><stop offset="1" stop-color="#2e86ab"/>
</linearGradient>
</defs>
<rect width="1100" height="850" fill="#ffffff"/>
<rect x="0" y="0" width="1100" height="64" fill="url(#tb)"/>
<text x="550" y="41" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">YOUR ROBOT&#8217;S SIXTH SENSE</text>
<text x="550" y="94" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#555" text-anchor="middle">One detector looks ahead. Two look out of the sides. Nothing here is visible to your eyes.</text>

<polygon points="550,400 455,120 645,120" fill="#2a5a42" opacity="0.13"/>
<polygon points="487,412 200,320 200,505" fill="#c45d76" opacity="0.13"/>
<polygon points="613,412 900,320 900,505" fill="#2e86ab" opacity="0.13"/>
<g stroke-dasharray="7 6" stroke-width="2" fill="none">
<path d="M550,400 L455,120" stroke="#2a5a42"/><path d="M550,400 L645,120" stroke="#2a5a42"/>
<path d="M487,412 L200,320" stroke="#c45d76"/><path d="M487,412 L200,505" stroke="#c45d76"/>
<path d="M613,412 L900,320" stroke="#2e86ab"/><path d="M613,412 L900,505" stroke="#2e86ab"/>
</g>

<rect x="440" y="440" width="40" height="175" fill="#4d5358" stroke="#2c3e50" stroke-width="2"/>
<rect x="620" y="440" width="40" height="175" fill="#4d5358" stroke="#2c3e50" stroke-width="2"/>
<g stroke="#6c757d" stroke-width="2">
<line x1="443" y1="465" x2="477" y2="465"/><line x1="443" y1="495" x2="477" y2="495"/>
<line x1="443" y1="525" x2="477" y2="525"/><line x1="443" y1="555" x2="477" y2="555"/>
<line x1="443" y1="585" x2="477" y2="585"/>
<line x1="623" y1="465" x2="657" y2="465"/><line x1="623" y1="495" x2="657" y2="495"/>
<line x1="623" y1="525" x2="657" y2="525"/><line x1="623" y1="555" x2="657" y2="555"/>
<line x1="623" y1="585" x2="657" y2="585"/>
</g>
<rect x="480" y="430" width="140" height="188" rx="7" fill="#e8ecef" stroke="#2c3e50" stroke-width="2"/>
<polygon points="497,388 603,388 628,432 472,432" fill="#cfd6dc" stroke="#2c3e50" stroke-width="2"/>
<text x="550" y="520" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#4d5358" text-anchor="middle">ZUMO</text>
<text x="550" y="540" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#7d8a94" text-anchor="middle">top view</text>
<circle cx="487" cy="412" r="8" fill="#8e3a4f"/>
<circle cx="550" cy="400" r="8" fill="#1e4633"/>
<circle cx="613" cy="412" r="8" fill="#1a5276"/>

<rect x="505" y="168" width="90" height="70" rx="10" fill="#dbeee3" stroke="#1e4633" stroke-width="2"/>
<text x="550" y="210" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#1e4633" text-anchor="middle">hand, close</text>
<rect x="495" y="258" width="110" height="52" rx="6" fill="#2a5a42"/>
<text x="550" y="279" font-family="Courier New,monospace" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">F: 6</text>
<text x="550" y="300" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">loud echo</text>

<rect x="108" y="300" width="46" height="225" rx="4" fill="#f2d7de" stroke="#8e3a4f" stroke-width="2"/>
<text x="131" y="285" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#8e3a4f" text-anchor="middle">wall alongside</text>
<rect x="215" y="545" width="130" height="52" rx="6" fill="#c45d76"/>
<text x="280" y="566" font-family="Courier New,monospace" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">L: 2</text>
<text x="280" y="587" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">faint echo</text>

<text x="820" y="405" font-family="Arial,Helvetica,sans-serif" font-size="15" font-style="italic" fill="#8a97a0" text-anchor="middle">nothing out here</text>
<rect x="755" y="545" width="130" height="52" rx="6" fill="#8a97a0"/>
<text x="820" y="566" font-family="Courier New,monospace" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">R: 0</text>
<text x="820" y="587" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">no echo</text>

<rect x="60" y="112" width="268" height="152" rx="10" fill="#f7f9fa" stroke="#34495e" stroke-width="2"/>
<text x="194" y="140" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#34495e" text-anchor="middle">THREE DETECTORS</text>
<circle cx="88" cy="168" r="7" fill="#8e3a4f"/><text x="106" y="173" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333">LEFT &#8212; looks out the side</text>
<circle cx="88" cy="198" r="7" fill="#1e4633"/><text x="106" y="203" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333">FRONT &#8212; looks ahead</text>
<circle cx="88" cy="228" r="7" fill="#1a5276"/><text x="106" y="233" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333">RIGHT &#8212; looks out the side</text>
<text x="194" y="255" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#777" text-anchor="middle">each one answers 0&#8211;6</text>

<rect x="60" y="690" width="980" height="118" rx="10" fill="#fdf6e8" stroke="#b7950b" stroke-width="2"/>
<text x="86" y="722" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#7d6608">&#9888; A READING IS AN ECHO, NOT A DISTANCE</text>
<text x="86" y="752" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#333">Higher is closer &#8212; but only for the <tspan font-style="italic">same object</tspan>. A big white box far away can out-echo a small black cup up close.</text>
<text x="86" y="780" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#7d6608">Same number, different truth. That is Section 3.5.</text>
</svg>
