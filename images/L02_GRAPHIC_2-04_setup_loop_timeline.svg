<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1472"
     height="1069"
     viewBox="0 0 1472 1069"
     role="img"
     aria-labelledby="title desc">
  <title id="title">How setup() and loop() Work Together</title>
  <desc id="desc">Power-on flow showing that setup runs once, then loop repeats until power is turned off.</desc>

  <defs>
    <style>
      .inter {
        font-family: Arial, Helvetica, sans-serif;
        font-feature-settings: "cv05" 1;
      }
      .mono {
        font-family: "Courier New", monospace;
        font-variant-ligatures: none;
        font-feature-settings: "liga" 0, "calt" 0;
      }
    </style>

  </defs>

  <!-- Canvas -->
  <rect width="1472" height="1069" fill="#FFFFFF"/>

  <!-- Title layer -->
  <g fill="#0B1A2E" font-weight="800">
    <text x="205" y="84" class="inter" font-size="47">How</text>
    <text x="315" y="84" class="mono" font-size="45">setup()</text>
    <text x="520" y="84" class="inter" font-size="47">and</text>
    <text x="620" y="84" class="mono" font-size="45">loop()</text>
    <text x="820" y="84" class="inter" font-size="47">Work Together</text>
  </g>
  <line x1="188" y1="116" x2="1284" y2="116" stroke="#C9A463" stroke-width="3"/>

  <!-- Power-on control -->
  <rect x="486" y="150" width="500" height="96" rx="48" fill="#F3F3F3" stroke="#D4D4D4" stroke-width="2"/>
  <g transform="translate(556 172)" fill="none" stroke="#007ACC" stroke-width="7" stroke-linecap="round">
    <path d="M32 2 V31"/>
    <path d="M17 12 A24 24 0 1 0 47 12"/>
  </g>
  <text x="758" y="211" text-anchor="middle" class="inter" font-size="37" font-weight="800" fill="#0B1A2E">POWER ON</text>

  <!-- First flow connector -->
  <path d="M736 246 V274" fill="none" stroke="#007ACC" stroke-width="9" stroke-linecap="round"/>
  <path d="M716 272 H756 L736 296 Z" fill="#007ACC"/>

  <!-- setup() card -->
  <rect x="326" y="302" width="820" height="200" rx="18" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
  <rect x="326" y="302" width="820" height="74" rx="18" fill="#252526"/>
  <rect x="326" y="350" width="820" height="26" fill="#252526"/>
  <rect x="326" y="302" width="8" height="200" rx="4" fill="#007ACC"/>

  <g class="mono" font-size="37" font-weight="700">
    <text x="606" y="351" fill="#569CD6">void</text>
    <text x="710" y="351" fill="#DCDCAA">setup</text>
    <text x="828" y="351" fill="#D4D4D4">()</text>
  </g>
  <text x="736" y="426" text-anchor="middle" class="inter" font-size="31" font-weight="800" fill="#0B1A2E">Runs ONCE</text>
  <text x="736" y="470" text-anchor="middle" class="inter" font-size="24" font-weight="500" fill="#1E1E1E">Initialize sensors, display, Serial communication</text>

  <!-- Second flow connector -->
  <path d="M736 502 V530" fill="none" stroke="#007ACC" stroke-width="9" stroke-linecap="round"/>
  <path d="M716 528 H756 L736 552 Z" fill="#007ACC"/>

  <!-- loop() card -->
  <rect x="326" y="558" width="820" height="200" rx="18" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
  <rect x="326" y="558" width="820" height="74" rx="18" fill="#252526"/>
  <rect x="326" y="606" width="820" height="26" fill="#252526"/>
  <rect x="326" y="558" width="8" height="200" rx="4" fill="#007ACC"/>

  <g class="mono" font-size="37" font-weight="700">
    <text x="622" y="607" fill="#569CD6">void</text>
    <text x="726" y="607" fill="#DCDCAA">loop</text>
    <text x="818" y="607" fill="#D4D4D4">()</text>
  </g>
  <text x="736" y="682" text-anchor="middle" class="inter" font-size="31" font-weight="800" fill="#0B1A2E">Runs FOREVER</text>
  <text x="736" y="726" text-anchor="middle" class="inter" font-size="24" font-weight="500" fill="#1E1E1E">Check buttons, update display, control motors, read sensors</text>

  <!-- Loop-back connector -->
  <path d="M736 758 V800 Q736 822 758 822 H1234 Q1260 822 1260 796 V552 Q1260 530 1234 530 H1165"
        fill="none"
        stroke="#007ACC"
        stroke-width="10"
        stroke-linecap="round"
        stroke-linejoin="round"
/>
  <path d="M1165 510 L1129 530 L1165 550 Z" fill="#007ACC"/>
  <text x="987" y="866" text-anchor="middle" class="inter" font-size="24" font-weight="700" font-style="italic" fill="#3D5266">repeats until power off</text>

  <!-- Bottom explanation -->
  <rect x="216" y="909" width="1040" height="98" rx="16" fill="#F3F3F3" stroke="#D4D4D4" stroke-width="2"/>
  <rect x="216" y="909" width="7" height="98" rx="3.5" fill="#3D5266"/>
  <g fill="#0B1A2E" font-size="23">
    <text x="300" y="970" class="mono" font-weight="700">setup()</text>
    <text x="414" y="970" class="inter" font-weight="600">never runs again — only</text>
    <text x="708" y="970" class="mono" font-weight="700">loop()</text>
    <text x="819" y="970" class="inter" font-weight="600">repeats until you turn the robot off.</text>
  </g>
</svg>
