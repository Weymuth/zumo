<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <!-- Title -->
  <text x="380" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#2c3e50">Zumo 32U4 OLED — Rear View</text>
  <text x="380" y="60" text-anchor="middle" font-size="13" fill="#6c757d">Looking at the back of the robot — same scale as the top view</text>

  <!-- ===== ROBOT (rear view, 98 mm wide x 39 mm tall) ===== -->
  <!-- Chassis / battery compartment (middle assembly inset 10 px from track top/bottom) -->
  <rect x="130" y="192" width="200" height="83" rx="3" fill="#1f2428" stroke="#15181a" stroke-width="2"/>
  <!-- battery cover clip slots -->
  <rect x="150" y="260" width="14" height="6" rx="1" fill="#3a4046"/>
  <rect x="223" y="260" width="14" height="6" rx="1" fill="#3a4046"/>
  <rect x="296" y="260" width="14" height="6" rx="1" fill="#3a4046"/>

  <!-- Main board edge (spans between tracks) -->
  <rect x="125" y="182" width="210" height="11" rx="2" fill="#2f3640" stroke="#15181a" stroke-width="1.5"/>

  <!-- Blue power LEDs (one per side, just under the board edge) -->
  <g>
    <circle cx="140" cy="202" r="8" fill="#4da3ff" opacity="0.22"/>
    <circle cx="140" cy="202" r="5" fill="#4da3ff" opacity="0.5"/>
    <circle cx="140" cy="202" r="3" fill="#7cc4ff"/>
    <circle cx="140" cy="201" r="1.2" fill="#ffffff"/>
    <circle cx="320" cy="202" r="8" fill="#4da3ff" opacity="0.22"/>
    <circle cx="320" cy="202" r="5" fill="#4da3ff" opacity="0.5"/>
    <circle cx="320" cy="202" r="3" fill="#7cc4ff"/>
    <circle cx="320" cy="201" r="1.2" fill="#ffffff"/>
  </g>

  <!-- Power switch (on board top, left of USB — matches top view x-position) -->
  <rect x="162" y="164" width="34" height="18" rx="2" fill="#8f979e" stroke="#6c757d"/>
  <rect x="166" y="167" width="12" height="12" rx="1" fill="#f1f3f5"/>

  <!-- Micro-USB port (face-on trapezoid, centered — matches top view x-position) -->
  <rect x="214" y="160" width="36" height="22" rx="3" fill="#aeb6bd" stroke="#868e96" stroke-width="1.5"/>
  <polygon points="221,166 243,166 243,170 238,177 226,177 221,170" fill="#495057"/>

  <!-- Tracks (rear of tread loop: flat top and bottom) -->
  <rect x="60" y="150" width="70" height="135" rx="4" fill="#2b2b2b" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="330" y="150" width="70" height="135" rx="4" fill="#2b2b2b" stroke="#1a1a1a" stroke-width="2"/>
  <g stroke="#454545" stroke-width="3" stroke-linecap="round">
    <line x1="66" y1="162" x2="124" y2="162"/><line x1="66" y1="176" x2="124" y2="176"/>
    <line x1="66" y1="190" x2="124" y2="190"/><line x1="66" y1="204" x2="124" y2="204"/>
    <line x1="66" y1="218" x2="124" y2="218"/><line x1="66" y1="232" x2="124" y2="232"/>
    <line x1="66" y1="246" x2="124" y2="246"/><line x1="66" y1="260" x2="124" y2="260"/>
    <line x1="66" y1="274" x2="124" y2="274"/>
    <line x1="336" y1="162" x2="394" y2="162"/><line x1="336" y1="176" x2="394" y2="176"/>
    <line x1="336" y1="190" x2="394" y2="190"/><line x1="336" y1="204" x2="394" y2="204"/>
    <line x1="336" y1="218" x2="394" y2="218"/><line x1="336" y1="232" x2="394" y2="232"/>
    <line x1="336" y1="246" x2="394" y2="246"/><line x1="336" y1="260" x2="394" y2="260"/>
    <line x1="336" y1="274" x2="394" y2="274"/>
  </g>

  <!-- ===== Badge ticks (short dotted, no arrows) ===== -->
  <g stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="2 3">
    <line x1="179" y1="144" x2="179" y2="160"/>   <!-- 6 -> Power switch -->
    <line x1="232" y1="144" x2="232" y2="156"/>   <!-- 7 -> USB -->
    <line x1="145" y1="227" x2="141" y2="212"/>   <!-- 8 -> left power LED -->
  </g>

  <!-- ===== Numbered badges (6-7 match the top-view diagram) ===== -->
  <g font-size="12" font-weight="bold" text-anchor="middle">
    <circle cx="179" cy="132" r="11" fill="#3a7d5c" stroke="#ffffff" stroke-width="1.5"/>
    <text x="179" y="136.5" fill="#ffffff">6</text>
    <circle cx="232" cy="132" r="11" fill="#b7950b" stroke="#ffffff" stroke-width="1.5"/>
    <text x="232" y="136.5" fill="#ffffff">7</text>
    <circle cx="147" cy="238" r="11" fill="#2e86ab" stroke="#ffffff" stroke-width="1.5"/>
    <text x="147" y="242.5" fill="#ffffff">8</text>
  </g>

  <!-- ===== Legend ===== -->
  <g font-size="16" font-weight="600" fill="#2c3e50">
    <circle cx="452" cy="180" r="12" fill="#3a7d5c" stroke="#ffffff" stroke-width="1.5"/>
    <text x="452" y="185" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">6</text>
    <text x="476" y="185">Power Switch</text>

    <circle cx="452" cy="224" r="12" fill="#b7950b" stroke="#ffffff" stroke-width="1.5"/>
    <text x="452" y="229" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">7</text>
    <text x="476" y="229">Micro-USB Port</text>

    <circle cx="452" cy="268" r="12" fill="#2e86ab" stroke="#ffffff" stroke-width="1.5"/>
    <text x="452" y="273" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">8</text>
    <text x="476" y="273">Blue Power LEDs (one per side)</text>
  </g>
  <text x="440" y="300" font-size="12" fill="#6c757d">Badges 6–7 match the top-view hardware diagram.</text>
</svg>
