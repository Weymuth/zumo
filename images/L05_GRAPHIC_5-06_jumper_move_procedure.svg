<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850">
<defs>
<linearGradient id="tb" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#1a5276"/><stop offset="1" stop-color="#2e86ab"/>
</linearGradient>
</defs>
<rect width="1100" height="850" fill="#ffffff"/>
<rect x="0" y="0" width="1100" height="64" fill="url(#tb)"/>
<text x="550" y="41" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">THE LAST JUMPER MOVE — LFT/RGT &#8594; DN2/DN4</text>
<text x="550" y="94" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#555" text-anchor="middle">A jumper only ever goes straight UP off two pins, and straight DOWN onto two pins. Never twist.</text>

<!-- === THE THREE-PIN GROUP, ENLARGED === -->
<rect x="60" y="120" width="470" height="330" rx="10" fill="#f7f9fa" stroke="#34495e" stroke-width="2"/>
<text x="295" y="150" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#34495e" text-anchor="middle">WHAT ONE JUMPER LOOKS LIKE</text>
<text x="295" y="173" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#666" text-anchor="middle">Three pins in a row. The block bridges TWO of them.</text>

<!-- pin header -->
<rect x="150" y="250" width="290" height="60" rx="4" fill="#2c3e50"/>
<!-- 3 pins -->
<rect x="182" y="205" width="18" height="52" rx="3" fill="#d4af37"/>
<rect x="286" y="205" width="18" height="52" rx="3" fill="#d4af37"/>
<rect x="390" y="205" width="18" height="52" rx="3" fill="#d4af37"/>
<text x="191" y="336" font-family="Courier New,monospace" font-size="15" font-weight="bold" fill="#c45d76" text-anchor="middle" textLength="30">LFT</text>
<text x="295" y="336" font-family="Courier New,monospace" font-size="15" font-weight="bold" fill="#34495e" text-anchor="middle" textLength="52">SIGNAL</text>
<text x="399" y="336" font-family="Courier New,monospace" font-size="15" font-weight="bold" fill="#2a5a42" text-anchor="middle" textLength="30">DN2</text>
<text x="295" y="360" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#777" text-anchor="middle">(the middle pin is always the wire to the chip)</text>

<!-- jumper block currently on LFT+SIGNAL -->
<rect x="173" y="194" width="140" height="46" rx="5" fill="#c45d76" stroke="#8e3a4f" stroke-width="2" opacity="0.92"/>
<text x="243" y="222" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">JUMPER</text>
<text x="295" y="400" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#8e3a4f" text-anchor="middle">NOW: bridging LFT + SIGNAL &#8594; pin 20 is a prox receiver</text>
<text x="295" y="426" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#1e4633" text-anchor="middle">GOAL: bridge SIGNAL + DN2 &#8594; pin 20 becomes line sensor 2</text>

<!-- === STEPS === -->
<rect x="560" y="120" width="480" height="330" rx="10" fill="#eef7f2" stroke="#2a5a42" stroke-width="2"/>
<text x="800" y="150" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#1e4633" text-anchor="middle">THE PROCEDURE — BOTH JUMPERS</text>

<circle cx="596" cy="185" r="15" fill="#c45d76"/><text x="596" y="191" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
<text x="622" y="184" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#8e3a4f">POWER OFF. Unplug USB.</text>
<text x="622" y="204" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#555">Never move a jumper on a live board.</text>

<circle cx="596" cy="238" r="15" fill="#2e86ab"/><text x="596" y="244" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
<text x="622" y="237" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#1a5276">Work OVER THE TABLE.</text>
<text x="622" y="257" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#555">A dropped jumper is a lost jumper.</text>

<circle cx="596" cy="291" r="15" fill="#2e86ab"/><text x="596" y="297" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
<text x="622" y="290" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#1a5276">Lift STRAIGHT UP. No twisting.</text>
<text x="622" y="310" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#555">Tweezers or a careful fingernail. Pins bend.</text>

<circle cx="596" cy="344" r="15" fill="#2e86ab"/><text x="596" y="350" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
<text x="622" y="343" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#1a5276">Press STRAIGHT DOWN on SIGNAL + DN.</text>
<text x="622" y="363" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#555">Gentle, even force. It should sit level.</text>

<circle cx="596" cy="397" r="15" fill="#2a5a42"/><text x="596" y="403" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">5</text>
<text x="622" y="396" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#1e4633">Repeat for the second jumper &#8594; DN4.</text>
<text x="622" y="416" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#555">Both blocks fully seated, both sitting level.</text>

<!-- === BEFORE / AFTER STRIP === -->
<rect x="60" y="480" width="470" height="200" rx="10" fill="#fdf6e8" stroke="#b7950b" stroke-width="2"/>
<rect x="60" y="480" width="470" height="38" rx="10" fill="#b7950b"/><rect x="60" y="506" width="470" height="12" fill="#b7950b"/>
<text x="295" y="507" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">BEFORE — factory</text>
<rect x="120" y="560" width="18" height="46" rx="3" fill="#d4af37"/>
<rect x="206" y="560" width="18" height="46" rx="3" fill="#d4af37"/>
<rect x="292" y="560" width="18" height="46" rx="3" fill="#d4af37"/>
<rect x="112" y="552" width="120" height="38" rx="4" fill="#c45d76" stroke="#8e3a4f" stroke-width="2" opacity="0.92"/>
<text x="129" y="630" font-family="Courier New,monospace" font-size="13" font-weight="bold" fill="#8e3a4f" text-anchor="middle" textLength="30">LFT</text>
<text x="215" y="630" font-family="Courier New,monospace" font-size="12" fill="#666" text-anchor="middle" textLength="42">SIGNAL</text>
<text x="301" y="630" font-family="Courier New,monospace" font-size="13" fill="#999" text-anchor="middle" textLength="30">DN2</text>
<text x="420" y="588" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#8e3a4f" text-anchor="middle">3 line</text>
<text x="420" y="608" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#8e3a4f" text-anchor="middle">3 prox</text>
<text x="295" y="662" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#7d6608" text-anchor="middle">Lessons 1&#8211;5</text>

<polygon points="548,564 578,564 578,548 606,580 578,612 578,596 548,596" fill="#2e86ab"/>

<rect x="618" y="480" width="422" height="200" rx="10" fill="#eef7f2" stroke="#2a5a42" stroke-width="2"/>
<rect x="618" y="480" width="422" height="38" rx="10" fill="#2a5a42"/><rect x="618" y="506" width="422" height="12" fill="#2a5a42"/>
<text x="829" y="507" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">AFTER — five-down, permanent</text>
<rect x="672" y="560" width="18" height="46" rx="3" fill="#d4af37"/>
<rect x="758" y="560" width="18" height="46" rx="3" fill="#d4af37"/>
<rect x="844" y="560" width="18" height="46" rx="3" fill="#d4af37"/>
<rect x="750" y="552" width="120" height="38" rx="4" fill="#2a5a42" stroke="#1e4633" stroke-width="2" opacity="0.92"/>
<text x="681" y="630" font-family="Courier New,monospace" font-size="13" fill="#999" text-anchor="middle" textLength="30">LFT</text>
<text x="767" y="630" font-family="Courier New,monospace" font-size="12" fill="#666" text-anchor="middle" textLength="42">SIGNAL</text>
<text x="853" y="630" font-family="Courier New,monospace" font-size="13" font-weight="bold" fill="#1e4633" text-anchor="middle" textLength="30">DN2</text>
<text x="962" y="588" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#1e4633" text-anchor="middle">5 line</text>
<text x="962" y="608" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#1e4633" text-anchor="middle">1 prox</text>
<text x="829" y="662" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="bold" fill="#1e4633" text-anchor="middle">Lessons 6&#8211;15 &#183; does not move again</text>

<!-- === VERIFY === -->
<rect x="60" y="706" width="980" height="112" rx="10" fill="#e8f3ec" stroke="#2a5a42" stroke-width="2"/>
<text x="86" y="736" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#1e4633">&#9989; VERIFY IN SOFTWARE &#8212; never trust a hardware change without a test</text>
<text x="86" y="764" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#333">Flash <tspan font-family="Courier New,monospace" font-weight="bold" fill="#1a5276">JUMPER CHECK</tspan>, set the robot on the tape, press A, and slide the tape across the row.</text>
<text x="86" y="792" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#1e4633">ALL FIVE numbers must respond. If 2 and 4 sit dead &#8212; a jumper is not seated. Power off and reseat it.</text>
</svg>
