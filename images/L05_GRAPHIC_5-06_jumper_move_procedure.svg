<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
  <title id="title">The Last Jumper Move — LFT/RGT to DN2/DN4</title>
  <desc id="desc">Instructional graphic showing a clearer before-and-after arrangement for moving two vertical blue jumpers from the proximity receiver positions to the five-down line sensor positions.</desc>

  <rect width="1100" height="850" fill="#F5F2E9"/>
  <rect x="0" y="0" width="1100" height="64" fill="#0B1A2E"/>
  <rect x="0" y="64" width="1100" height="3" fill="#C9A463"/>
  <text x="550" y="41" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle">THE LAST JUMPER MOVE — LFT/RGT → DN2/DN4</text>
  <text x="550" y="94" font-size="16" fill="#3D5266" text-anchor="middle">Lift each jumper straight up, move it down one position, then press it straight down.</text>

  <!-- LEFT: one-jumper before/after -->
  <rect x="60" y="120" width="500" height="350" rx="10" fill="#F7F7F7" stroke="#3D5266" stroke-width="2"/>
  <text x="310" y="151" font-size="18" font-weight="700" fill="#3D5266" text-anchor="middle">ONE JUMPER — BEFORE AND AFTER</text>
  <text x="310" y="176" font-size="14" fill="#3D5266" text-anchor="middle">The blue block always bridges two adjacent pins.</text>

  <!-- BEFORE -->
  <text x="180" y="211" font-size="15" font-weight="700" fill="#7B6240" text-anchor="middle">BEFORE — FACTORY</text>
  <rect x="134" y="228" width="78" height="150" rx="7" fill="#0B1A2E"/>
  <rect x="164" y="244" width="18" height="26" rx="3" fill="#CCA700"/>
  <rect x="164" y="289" width="18" height="26" rx="3" fill="#CCA700"/>
  <rect x="164" y="334" width="18" height="26" rx="3" fill="#CCA700"/>
  <rect x="149" y="237" width="48" height="88" rx="7" fill="#2F76D2" stroke="#1E4F91" stroke-width="2"/>
  <rect x="153" y="243" width="40" height="10" rx="3" fill="#75A8F1"/>
  <line x1="157" y1="271" x2="189" y2="271" stroke="#5E96E8" stroke-width="4"/>
  <line x1="157" y1="292" x2="189" y2="292" stroke="#5E96E8" stroke-width="4"/>
  <text x="228" y="261" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#CE9178">LFT</text>
  <text x="228" y="306" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#3D5266">SIGNAL</text>
  <text x="228" y="351" font-family="Courier New, monospace" font-size="13" fill="#9D9D9D">DN2</text>
  <text x="180" y="402" font-size="13" font-weight="700" fill="#7B6240" text-anchor="middle">3 line · 3 prox</text>

  <!-- move arrow -->
  <line x1="290" y1="285" x2="350" y2="285" stroke="#3D5266" stroke-width="7" stroke-linecap="round"/>
  <polygon points="350,285 332,273 332,297" fill="#3D5266"/>
  <text x="320" y="268" font-size="13" font-weight="700" fill="#3D5266" text-anchor="middle">MOVE DOWN</text>

  <!-- AFTER -->
  <text x="438" y="211" font-size="15" font-weight="700" fill="#315D38" text-anchor="middle">AFTER — FIVE-DOWN</text>
  <rect x="392" y="228" width="78" height="150" rx="7" fill="#0B1A2E"/>
  <rect x="422" y="244" width="18" height="26" rx="3" fill="#CCA700"/>
  <rect x="422" y="289" width="18" height="26" rx="3" fill="#CCA700"/>
  <rect x="422" y="334" width="18" height="26" rx="3" fill="#CCA700"/>
  <rect x="407" y="282" width="48" height="88" rx="7" fill="#2F76D2" stroke="#1E4F91" stroke-width="2"/>
  <rect x="411" y="288" width="40" height="10" rx="3" fill="#75A8F1"/>
  <line x1="415" y1="316" x2="447" y2="316" stroke="#5E96E8" stroke-width="4"/>
  <line x1="415" y1="337" x2="447" y2="337" stroke="#5E96E8" stroke-width="4"/>
  <text x="486" y="261" font-family="Courier New, monospace" font-size="13" fill="#9D9D9D">LFT</text>
  <text x="486" y="306" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#3D5266">SIGNAL</text>
  <text x="486" y="351" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#315D38">DN2</text>
  <text x="438" y="402" font-size="13" font-weight="700" fill="#315D38" text-anchor="middle">5 line · 1 prox</text>

  <text x="310" y="435" font-size="13.5" font-weight="700" fill="#315D38" text-anchor="middle">The jumper moves one position lower — it does not rotate.</text>

  <!-- RIGHT: procedure -->
  <rect x="590" y="120" width="450" height="350" rx="10" fill="#EDF4EA" stroke="#315D38" stroke-width="2"/>
  <text x="815" y="151" font-size="18" font-weight="700" fill="#315D38" text-anchor="middle">THE PROCEDURE — BOTH JUMPERS</text>

  <circle cx="624" cy="193" r="15" fill="#CE9178"/><text x="624" y="199" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="650" y="192" font-size="15" font-weight="700" fill="#7B6240">POWER OFF. Unplug USB.</text>
  <text x="650" y="212" font-size="13" fill="#3D5266">Never move a jumper on a live board.</text>

  <circle cx="624" cy="249" r="15" fill="#3D5266"/><text x="624" y="255" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="650" y="248" font-size="15" font-weight="700" fill="#0B1A2E">Work over the table.</text>
  <text x="650" y="268" font-size="13" fill="#3D5266">A dropped jumper is a lost jumper.</text>

  <circle cx="624" cy="305" r="15" fill="#3D5266"/><text x="624" y="311" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="650" y="304" font-size="15" font-weight="700" fill="#0B1A2E">Lift straight up. No twisting.</text>
  <text x="650" y="324" font-size="13" fill="#3D5266">Tweezers or a careful fingernail. Pins bend.</text>

  <circle cx="624" cy="361" r="15" fill="#3D5266"/><text x="624" y="367" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="650" y="360" font-size="15" font-weight="700" fill="#0B1A2E">Press straight down on SIGNAL + DN.</text>
  <text x="650" y="380" font-size="13" fill="#3D5266">Gentle, even force. It should sit level.</text>

  <circle cx="624" cy="417" r="15" fill="#315D38"/><text x="624" y="423" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="650" y="416" font-size="15" font-weight="700" fill="#315D38">Repeat for the second jumper → DN4.</text>
  <text x="650" y="436" font-size="13" fill="#3D5266">Both blocks fully seated, both sitting level.</text>

  <!-- FINAL CONFIGURATION -->
  <rect x="60" y="500" width="980" height="168" rx="10" fill="#FFFFFF" stroke="#315D38" stroke-width="2"/>
  <rect x="60" y="500" width="980" height="38" rx="10" fill="#315D38"/>
  <rect x="60" y="526" width="980" height="12" fill="#315D38"/>
  <text x="550" y="527" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">FINAL CONFIGURATION — BOTH BLUE JUMPERS ON THE LOWER TWO PINS</text>

  <!-- left final -->
  <text x="260" y="571" font-size="15" font-weight="700" fill="#315D38" text-anchor="middle">LEFT SIDE → DN2</text>
  <rect x="126" y="590" width="24" height="56" rx="4" fill="#0B1A2E"/>
  <rect x="146" y="599" width="42" height="8" rx="3" fill="#CCA700"/>
  <rect x="146" y="617" width="42" height="8" rx="3" fill="#CCA700"/>
  <rect x="146" y="635" width="42" height="8" rx="3" fill="#CCA700"/>
  <rect x="186" y="611" width="66" height="38" rx="6" fill="#2F76D2" stroke="#1E4F91" stroke-width="2"/>
  <rect x="190" y="615" width="58" height="9" rx="3" fill="#75A8F1"/>
  <text x="270" y="605" font-family="Courier New, monospace" font-size="12" fill="#9D9D9D">LFT</text>
  <text x="270" y="623" font-family="Courier New, monospace" font-size="12" fill="#3D5266">SIGNAL</text>
  <text x="270" y="641" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#315D38">DN2</text>
  <text x="188" y="666" font-size="11.5" fill="#3D5266">side view — jumper on the lower two pins</text>

  <!-- right final -->
  <text x="720" y="571" font-size="15" font-weight="700" fill="#315D38" text-anchor="middle">RIGHT SIDE → DN4</text>
  <rect x="586" y="590" width="24" height="56" rx="4" fill="#0B1A2E"/>
  <rect x="606" y="599" width="42" height="8" rx="3" fill="#CCA700"/>
  <rect x="606" y="617" width="42" height="8" rx="3" fill="#CCA700"/>
  <rect x="606" y="635" width="42" height="8" rx="3" fill="#CCA700"/>
  <rect x="646" y="611" width="66" height="38" rx="6" fill="#2F76D2" stroke="#1E4F91" stroke-width="2"/>
  <rect x="650" y="615" width="58" height="9" rx="3" fill="#75A8F1"/>
  <text x="730" y="605" font-family="Courier New, monospace" font-size="12" fill="#9D9D9D">RGT</text>
  <text x="730" y="623" font-family="Courier New, monospace" font-size="12" fill="#3D5266">SIGNAL</text>
  <text x="730" y="641" font-family="Courier New, monospace" font-size="12" font-weight="700" fill="#315D38">DN4</text>
  <text x="648" y="666" font-size="11.5" fill="#3D5266">side view — jumper on the lower two pins</text>

  <rect x="842" y="566" width="150" height="74" rx="9" fill="#EDF4EA" stroke="#315D38" stroke-width="1.5"/>
  <text x="917" y="592" font-size="17" font-weight="700" fill="#315D38" text-anchor="middle">5 LINE</text>
  <text x="917" y="616" font-size="15" font-weight="700" fill="#315D38" text-anchor="middle">1 PROX</text>
  <text x="917" y="638" font-size="12" fill="#3D5266" text-anchor="middle">Lessons 6–15</text>

  <!-- VERIFY -->
  <rect x="60" y="695" width="980" height="112" rx="10" fill="#EDF4EA" stroke="#315D38" stroke-width="2"/>
  <text x="86" y="725" font-size="17" font-weight="700" fill="#315D38">VERIFY IN SOFTWARE — never trust a hardware change without a test</text>
  <text x="86" y="753" font-size="15" fill="#1E1E1E">Flash <tspan font-family="Courier New, monospace" font-weight="700" fill="#0B1A2E">JUMPER CHECK</tspan>, set the robot on the tape, press A, and slide the tape across the row.</text>
  <text x="86" y="781" font-size="15" font-weight="700" fill="#315D38">ALL FIVE numbers must respond. If 2 and 4 sit dead — a jumper is not seated. Power off and reseat it.</text>

  <line x1="60" y1="825" x2="1040" y2="825" stroke="#C9A463" stroke-width="1.5"/>
  <text x="60" y="843" font-size="10.5" fill="#6B7280">Zumo 32U4 Robotics · Lesson 5</text>
  <text x="1040" y="843" font-size="10.5" fill="#6B7280" text-anchor="end">GRAPHIC 5.6</text>
</svg>
