<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">Motor to Gearbox to Wheel</title>
  <desc id="desc">A RoboLore instructional graphic explaining how twelve encoder counts per motor turn become 909.7 counts per wheel turn through a 75.81 to 1 gearbox.</desc>
  <defs>
    <style>
      .title{font-family:Inter,Arial,sans-serif;font-size:36px;font-weight:800;fill:#0B1A2E}
      .meta{font-family:Inter,Arial,sans-serif;font-size:14px;font-weight:700;fill:#3D5266}
      .section{font-family:Inter,Arial,sans-serif;font-size:16px;font-weight:800;letter-spacing:.7px;fill:#3D5266}
      .body{font-family:Inter,Arial,sans-serif;font-size:15px;font-weight:500;fill:#172638}
      .small{font-family:Inter,Arial,sans-serif;font-size:12px;font-weight:500;fill:#5F7387}
      .label{font-family:Inter,Arial,sans-serif;font-size:16px;font-weight:800;fill:#0B1A2E}
      .whiteLabel{font-family:Inter,Arial,sans-serif;font-size:16px;font-weight:800;fill:#FFFFFF}
      .mono{font-family:'JetBrains Mono','Courier New',monospace}
    </style>
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0B1A2E" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="1100" height="850" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="40" y="50" class="title">Motor → Gearbox → Wheel</text>
  <text x="1060" y="47" text-anchor="end" class="meta">GRAPHIC 6.4 · Lesson 6 · §3.3</text>
  <line x1="40" y1="70" x2="1060" y2="70" stroke="#C9A463" stroke-width="3"/>

  <!-- Main teaching panel -->
  <rect x="40" y="96" width="1020" height="342" rx="16" fill="#FFFFFF" stroke="#D7D7D7" stroke-width="2" filter="url(#panelShadow)"/>
  <text x="64" y="130" class="section">THE ENCODER COUNTS MOTOR-SHAFT TURNS</text>
  <text x="64" y="158" class="body">The encoder is on the motor. The wheel is on the far side of a gearbox.</text>

  <!-- Motor -->
  <rect x="82" y="218" width="154" height="112" rx="12" fill="#3D5266" stroke="#0B1A2E" stroke-width="3"/>
  <text x="159" y="264" text-anchor="middle" class="whiteLabel">MOTOR</text>
  <text x="159" y="289" text-anchor="middle" class="small" style="fill:#E9EEF2">spins FAST</text>
  <text x="159" y="309" text-anchor="middle" class="small" style="fill:#E9EEF2">with little force</text>
  <text x="159" y="360" text-anchor="middle" class="body" style="font-size:13px;font-weight:800;fill:#F14C4C">the encoder</text>
  <text x="159" y="379" text-anchor="middle" class="body" style="font-size:13px;font-weight:800;fill:#F14C4C">watches HERE</text>
  <text x="159" y="403" text-anchor="middle" class="small" style="fill:#A44D56">12 counts / turn</text>

  <!-- Flow arrow 1 -->
  <polygon points="244,255 300,255 300,242 332,274 300,306 300,293 244,293" fill="#007ACC"/>

  <!-- Gearbox -->
  <rect x="340" y="200" width="196" height="146" rx="12" fill="#2F4358" stroke="#0B1A2E" stroke-width="3"/>
  <circle cx="390" cy="246" r="25" fill="#8E999A" stroke="#5A676B" stroke-width="2"/>
  <circle cx="440" cy="291" r="35" fill="#8E999A" stroke="#5A676B" stroke-width="2"/>
  <circle cx="490" cy="246" r="21" fill="#8E999A" stroke="#5A676B" stroke-width="2"/>
  <text x="438" y="337" text-anchor="middle" class="whiteLabel">GEARBOX</text>
  <rect x="362" y="360" width="152" height="32" rx="7" fill="#FFF4F2" stroke="#F14C4C" stroke-width="2"/>
  <text x="438" y="382" text-anchor="middle" class="body" style="font-weight:800;fill:#D83B3B">75.81 : 1</text>
  <text x="438" y="413" text-anchor="middle" class="small">trades speed for force</text>

  <!-- Flow arrow 2 -->
  <polygon points="544,255 600,255 600,242 632,274 600,306 600,293 544,293" fill="#007ACC"/>

  <!-- Wheel -->
  <circle cx="726" cy="274" r="74" fill="#273646" stroke="#0B1A2E" stroke-width="4"/>
  <circle cx="726" cy="274" r="25" fill="#8E999A"/>
  <text x="726" y="279" text-anchor="middle" class="body" style="font-size:13px;font-weight:800;fill:#314358">39 mm</text>
  <text x="726" y="374" text-anchor="middle" class="label">WHEEL</text>
  <text x="726" y="399" text-anchor="middle" class="small">spins SLOW, pushes HARD</text>

  <!-- Multiplication box -->
  <rect x="824" y="184" width="212" height="208" rx="10" fill="#1E1E1E"/>
  <text x="844" y="212" class="small" style="font-size:13px;font-weight:800;fill:#D4D4D4">THE MULTIPLICATION</text>
  <text x="844" y="250" class="mono" style="font-size:15px;fill:#9CDCFE">12 counts</text>
  <text x="844" y="273" class="mono" style="font-size:12px;fill:#6A9955">per MOTOR turn</text>
  <text x="844" y="308" class="mono" style="font-size:15px;fill:#CE9178">× 75.81</text>
  <text x="844" y="331" class="mono" style="font-size:12px;fill:#6A9955">motor turns per WHEEL turn</text>
  <line x1="844" y1="344" x2="1016" y2="344" stroke="#6A9955" stroke-width="2"/>
  <text x="844" y="374" class="mono" style="font-size:16px;fill:#B5CEA8">= 909.7 counts</text>

  <!-- Misconception panel -->
  <rect x="40" y="466" width="1020" height="146" rx="16" fill="#FFFFFF" stroke="#D7D7D7" stroke-width="2" filter="url(#panelShadow)"/>
  <rect x="40" y="466" width="1020" height="46" rx="16" fill="#0B1A2E"/>
  <rect x="40" y="493" width="1020" height="19" fill="#0B1A2E"/>
  <text x="64" y="496" class="whiteLabel">THE MISTAKE EVERYONE MAKES</text>
  <text x="64" y="545" class="body" style="font-style:italic;fill:#3D5266">“The encoder gives 12 counts per rotation, so 12 counts = one wheel turn.”</text>
  <text x="64" y="578" class="body" style="font-weight:800;fill:#D83B3B">No. 12 counts is one turn of the MOTOR SHAFT — and the motor spins 75.81 times</text>
  <text x="64" y="602" class="body" style="font-weight:800;fill:#D83B3B">for every ONE turn of the wheel.</text>

  <!-- Warning panel -->
  <rect x="40" y="636" width="1020" height="176" rx="16" fill="#FFF9E7" stroke="#CCA700" stroke-width="2" filter="url(#panelShadow)"/>
  <rect x="64" y="658" width="36" height="36" rx="18" fill="#CCA700"/>
  <text x="82" y="684" text-anchor="middle" class="whiteLabel" style="font-size:23px">!</text>
  <text x="116" y="682" class="section" style="fill:#725B00">CHECK YOUR ZUMO’S GEAR RATIO</text>
  <text x="64" y="720" class="body" style="font-size:14px;fill:#725B00">Zumo 32U4 robots ship with three different gearboxes. This lesson assumes the standard 75:1.</text>
  <text x="64" y="750" class="body" style="font-size:14px;fill:#725B00">If yours is a 50:1 or a 100:1, EVERY number downstream of this graphic is wrong for your robot</text>
  <text x="64" y="775" class="body" style="font-size:14px;fill:#725B00">— and it will be wrong in a way that looks like a code bug.</text>
  <text x="64" y="804" class="body" style="font-size:14px;font-weight:800;fill:#8A6E00">Check the box the robot came in before you spend an hour blaming your loop.</text>
</svg>
