<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="titleBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a5276"/>
      <stop offset="100%" stop-color="#2e86ab"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef2f5"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1100" height="850" fill="#ffffff"/>
  <rect x="0" y="0" width="1100" height="72" fill="url(#titleBand)"/>
  <text x="34" y="46" font-size="27" font-weight="bold" fill="#ffffff">GRAPHIC 6.4 &#8212; Motor &#8594; Gearbox &#8594; Wheel</text>
  <text x="1066" y="46" font-size="17" fill="#d6e9f2" text-anchor="end">Lesson 6 &#183; &#167;3.3</text>

  <rect x="40" y="100" width="1020" height="330" rx="10" fill="url(#panelGrad)" stroke="#c8d2da" stroke-width="2"/>
  <text x="60" y="132" font-size="16" font-weight="bold" fill="#1a5276">The encoder is on the MOTOR. The wheel is on the far side of a gearbox.</text>

  <rect x="86" y="212" width="150" height="110" rx="8" fill="#5d6d7e" stroke="#34495e" stroke-width="3"/>
  <text x="161" y="258" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">MOTOR</text>
  <text x="161" y="282" font-size="12" fill="#d5dbdb" text-anchor="middle">spins FAST</text>
  <text x="161" y="302" font-size="12" fill="#d5dbdb" text-anchor="middle">with little force</text>
  <text x="161" y="352" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">the encoder</text>
  <text x="161" y="370" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">watches HERE</text>
  <text x="161" y="394" font-size="13" fill="#8a5560" text-anchor="middle">12 counts / turn</text>

  <polygon points="242,254 300,254 300,242 330,267 300,292 300,280 242,280" fill="#3498db" stroke="#21618c" stroke-width="2"/>

  <rect x="336" y="196" width="190" height="142" rx="8" fill="#34495e" stroke="#22313f" stroke-width="3"/>
  <circle cx="386" cy="240" r="24" fill="#7f8c8d" stroke="#566573" stroke-width="2"/>
  <circle cx="436" cy="284" r="34" fill="#7f8c8d" stroke="#566573" stroke-width="2"/>
  <circle cx="486" cy="240" r="20" fill="#7f8c8d" stroke="#566573" stroke-width="2"/>
  <text x="431" y="330" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">GEARBOX</text>
  <rect x="356" y="352" width="150" height="30" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="431" y="373" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">75.81 : 1</text>
  <text x="431" y="402" font-size="12" fill="#7a8a96" text-anchor="middle">trades speed for force</text>

  <polygon points="532,254 590,254 590,242 620,267 590,292 590,280 532,280" fill="#3498db" stroke="#21618c" stroke-width="2"/>

  <circle cx="716" cy="267" r="72" fill="#2c3e50" stroke="#1b262c" stroke-width="4"/>
  <circle cx="716" cy="267" r="24" fill="#7f8c8d"/>
  <text x="716" y="272" font-size="13" font-weight="bold" fill="#2c3e50" text-anchor="middle">39mm</text>
  <text x="716" y="368" font-size="16" font-weight="bold" fill="#34495e" text-anchor="middle">WHEEL</text>
  <text x="716" y="392" font-size="12" fill="#7a8a96" text-anchor="middle">spins SLOW, pushes HARD</text>

  <rect x="820" y="176" width="216" height="196" rx="8" fill="#1e1e1e"/>
  <text x="840" y="204" font-size="13" font-weight="bold" fill="#d4d4d4">THE MULTIPLICATION</text>
  <text x="840" y="240" font-family="Consolas, Monaco, monospace" font-size="14" fill="#9cdcfe" textLength="130" lengthAdjust="spacingAndGlyphs">12 counts</text>
  <text x="840" y="262" font-size="12" fill="#6a9955">per MOTOR turn</text>
  <text x="840" y="294" font-family="Consolas, Monaco, monospace" font-size="14" fill="#ce9178" textLength="120" lengthAdjust="spacingAndGlyphs">x 75.81</text>
  <text x="840" y="316" font-size="12" fill="#6a9955">motor turns per WHEEL turn</text>
  <line x1="840" y1="328" x2="1016" y2="328" stroke="#6a9955" stroke-width="2"/>
  <text x="840" y="356" font-family="Consolas, Monaco, monospace" font-size="16" fill="#b5cea8" textLength="176" lengthAdjust="spacingAndGlyphs">= 909.7 counts</text>

  <rect x="40" y="452" width="1020" height="150" rx="10" fill="#eaf4fb" stroke="#3498db" stroke-width="2"/>
  <rect x="40" y="452" width="1020" height="42" rx="10" fill="#1a5276"/>
  <rect x="40" y="480" width="1020" height="14" fill="#1a5276"/>
  <text x="64" y="481" font-size="17" font-weight="bold" fill="#ffffff">THE MISTAKE EVERYONE MAKES</text>
  <text x="64" y="524" font-size="15" fill="#123c66">&#8220;The encoder gives 12 counts per rotation, so 12 counts = one wheel turn.&#8221;</text>
  <text x="64" y="556" font-size="15" font-weight="bold" fill="#c0392b">No. 12 counts is one turn of the MOTOR SHAFT &#8212; and the motor spins 75.81 times</text>
  <text x="64" y="580" font-size="15" font-weight="bold" fill="#c0392b">for every ONE turn of the wheel.</text>

  <rect x="40" y="624" width="1020" height="188" rx="10" fill="#fff8e1" stroke="#ffc107" stroke-width="2"/>
  <text x="64" y="656" font-size="16" font-weight="bold" fill="#856404">&#9888; CHECK YOUR ZUMO&#8217;S GEAR RATIO</text>
  <text x="64" y="688" font-size="14" fill="#856404">Zumo 32U4 robots ship with three different gearboxes. This lesson assumes the standard 75:1.</text>
  <text x="64" y="716" font-size="14" fill="#856404">If yours is a 50:1 or a 100:1, EVERY number downstream of this graphic is wrong for your robot</text>
  <text x="64" y="740" font-size="14" fill="#856404">&#8212; and it will be wrong in a way that looks like a code bug.</text>
  <text x="64" y="776" font-size="14" font-weight="bold" fill="#a07a12">Check the box the robot came in before you spend an hour blaming your loop.</text>
</svg>
