<rect x="500" y="200" width="500" height="46" rx="12" fill="#1a5276"/>
<text x="750.0" y="230" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="bold">Expected behavior at each station</text>
<circle cx="534" cy="288" r="16" fill="#1a5276"/>
<text x="534" y="294" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">1</text>
<text x="562" y="288" font-size="18" font-weight="bold" fill="#333333">Green on LEFT</text>
<text x="562" y="314" font-size="15.5" fill="#555555">stop &#183; beep &#183; &#171; GO LEFT</text>
<text x="562" y="337" font-size="15.5" fill="#555555">clean 90&#176; encoder turn left</text>
