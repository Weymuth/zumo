<text x="562" y="537" font-size="15.5" fill="#555555">180&#176; turnaround, drive back</text>
<text x="520" y="604" font-size="14.5" fill="#777777" font-style="italic">Markers are ~1&#8221; squares of bright green tape, beside the line.</text>
<text x="520" y="628" font-size="14.5" fill="#777777" font-style="italic">Dark forest greens read too close to black &#8212; Section 4.1.</text>
