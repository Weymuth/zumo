<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img">
  <title>GRAPHIC 6.11 — Trapezoid Motion Profile</title>
  <desc>RoboLore instructional graphic.</desc>
  <rect x="0" y="0" width="1100" height="850" fill="#F5F2E9"/>
  <rect x="0" y="0" width="1100" height="86" fill="#0B1A2E"/>
  <text x="40" y="54" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">GRAPHIC 6.11 — Trapezoid Motion Profile</text>
  <text x="1060" y="52" fill="#E8EEF4" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="end">Lesson 6 · controlled acceleration</text>
  <line x1="0" y1="86" x2="1100" y2="86" stroke="#C9A463" stroke-width="3"/>
  <rect x="40" y="116" width="1020" height="694" rx="16" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
  <g transform="translate(70.000 194.054) scale(1.297297)"><rect x="1" y="1" width="738" height="408" rx="10" fill="#ffffff" stroke="#D4D4D4" stroke-width="2"/>

  <!-- trapezoid speed profile -->
  <polygon points="110,330 245,120 515,120 650,330" fill="#EAF5FF" stroke="#007ACC" stroke-width="3" stroke-linejoin="round"/>

  <!-- dashed phase boundaries -->
  <g stroke="#B9DDF5" stroke-width="1.5" stroke-dasharray="5 5">
    <line x1="245" y1="330" x2="245" y2="120"/>
    <line x1="515" y1="330" x2="515" y2="120"/>
  </g>
  <!-- dashed full-speed level line -->
  <line x1="90" y1="120" x2="245" y2="120" stroke="#B9DDF5" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="84" y="125" font-size="13" fill="#007ACC" text-anchor="end" font-style="italic" font-family="Arial, Helvetica, sans-serif">Full</text>
  <text x="84" y="141" font-size="13" fill="#007ACC" text-anchor="end" font-style="italic" font-family="Arial, Helvetica, sans-serif">speed</text>

  <!-- axes -->
  <g stroke="#0B1A2E" stroke-width="2.5" fill="none">
    <line x1="90" y1="330" x2="672" y2="330"/>
    <line x1="90" y1="330" x2="90" y2="78"/>
  </g>
  <!-- single-polygon arrowheads -->
  <polygon points="672,323 690,330 672,337" fill="#0B1A2E"/>
  <polygon points="83,78 90,60 97,78" fill="#0B1A2E"/>
  <text x="60" y="52" font-size="16" font-weight="bold" fill="#0B1A2E" font-family="Arial, Helvetica, sans-serif">Speed</text>
  <text x="640" y="368" font-size="16" font-weight="bold" fill="#0B1A2E" font-family="Arial, Helvetica, sans-serif">Distance</text>

  <!-- ticks + labels -->
  <g stroke="#0B1A2E" stroke-width="2">
    <line x1="110" y1="330" x2="110" y2="338"/>
    <line x1="245" y1="330" x2="245" y2="338"/>
    <line x1="515" y1="330" x2="515" y2="338"/>
    <line x1="650" y1="330" x2="650" y2="338"/>
  </g>
  <g font-size="14" fill="#0B1A2E" text-anchor="middle">
    <text x="110" y="356" font-family="Arial, Helvetica, sans-serif">0%</text>
    <text x="245" y="356" font-family="Arial, Helvetica, sans-serif">25%</text>
    <text x="515" y="356" font-family="Arial, Helvetica, sans-serif">75%</text>
    <text x="650" y="356" font-family="Arial, Helvetica, sans-serif">100%</text>
  </g>

  <!-- phase labels -->
  <g font-size="14" font-weight="bold" fill="#007ACC" text-anchor="middle">
    <text x="185" y="255" transform="rotate(-55 185 255)" font-family="Arial, Helvetica, sans-serif">SPEED UP</text>
    <text x="380" y="165" font-family="Arial, Helvetica, sans-serif">FULL SPEED</text>
    <text x="380" y="184" font-weight="normal" font-style="italic" font-size="13" font-family="Arial, Helvetica, sans-serif">(cruise)</text>
    <text x="577" y="255" transform="rotate(55 577 255)" font-family="Arial, Helvetica, sans-serif">SLOW DOWN</text>
  </g>
</g>
</svg>
