<svg viewBox="0 0 740 410" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="1" y="1" width="738" height="408" rx="10" fill="#ffffff" stroke="#d5dde3" stroke-width="2"/>

  <!-- trapezoid speed profile -->
  <polygon points="110,330 245,120 515,120 650,330" fill="#f3edf5" stroke="#9b6a9e" stroke-width="3" stroke-linejoin="round"/>

  <!-- dashed phase boundaries -->
  <g stroke="#c4aec6" stroke-width="1.5" stroke-dasharray="5 5">
    <line x1="245" y1="330" x2="245" y2="120"/>
    <line x1="515" y1="330" x2="515" y2="120"/>
  </g>
  <!-- dashed full-speed level line -->
  <line x1="90" y1="120" x2="245" y2="120" stroke="#c4aec6" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="84" y="125" font-size="13" fill="#704c73" text-anchor="end" font-style="italic">Full</text>
  <text x="84" y="141" font-size="13" fill="#704c73" text-anchor="end" font-style="italic">speed</text>

  <!-- axes -->
  <g stroke="#2c3e50" stroke-width="2.5" fill="none">
    <line x1="90" y1="330" x2="672" y2="330"/>
    <line x1="90" y1="330" x2="90" y2="78"/>
  </g>
  <!-- single-polygon arrowheads -->
  <polygon points="672,323 690,330 672,337" fill="#2c3e50"/>
  <polygon points="83,78 90,60 97,78" fill="#2c3e50"/>
  <text x="60" y="52" font-size="16" font-weight="bold" fill="#2c3e50">Speed</text>
  <text x="640" y="368" font-size="16" font-weight="bold" fill="#2c3e50">Distance</text>

  <!-- ticks + labels -->
  <g stroke="#2c3e50" stroke-width="2">
    <line x1="110" y1="330" x2="110" y2="338"/>
    <line x1="245" y1="330" x2="245" y2="338"/>
    <line x1="515" y1="330" x2="515" y2="338"/>
    <line x1="650" y1="330" x2="650" y2="338"/>
  </g>
  <g font-size="14" fill="#2c3e50" text-anchor="middle">
    <text x="110" y="356">0%</text>
    <text x="245" y="356">25%</text>
    <text x="515" y="356">75%</text>
    <text x="650" y="356">100%</text>
  </g>

  <!-- phase labels -->
  <g font-size="14" font-weight="bold" fill="#704c73" text-anchor="middle">
    <text x="185" y="255" transform="rotate(-55 185 255)">SPEED UP</text>
    <text x="380" y="165">FULL SPEED</text>
    <text x="380" y="184" font-weight="normal" font-style="italic" font-size="13">(cruise)</text>
    <text x="577" y="255" transform="rotate(55 577 255)">SLOW DOWN</text>
  </g>
</svg>
