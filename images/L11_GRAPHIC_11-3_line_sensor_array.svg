<svg viewBox="0 0 780 320" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="1" y="1" width="778" height="318" rx="10" fill="#ffffff" stroke="#d5dde3" stroke-width="2"/>

  <!-- FRONT label -->
  <text x="350" y="40" font-size="15" font-weight="bold" fill="#2a5a42" text-anchor="middle" letter-spacing="2">FRONT OF ROBOT</text>

  <!-- chassis (top view) -->
  <rect x="100" y="58" width="500" height="200" rx="14" fill="#f6f9fb" stroke="#2c3e50" stroke-width="2.5"/>
  <!-- emphasized front edge -->
  <line x1="114" y1="58" x2="586" y2="58" stroke="#2a5a42" stroke-width="5"/>

  <!-- center reference -->
  <line x1="350" y1="150" x2="350" y2="232" stroke="#b8c4cd" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="350" y="248" font-size="12.5" font-style="italic" fill="#8a959e" text-anchor="middle">center</text>

  <!-- sensor index badges -->
  <g font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold" fill="#1a5276" text-anchor="middle">
    <text x="150" y="92" textLength="27">[0]</text>
    <text x="250" y="92" textLength="27">[1]</text>
    <text x="350" y="92" textLength="27">[2]</text>
    <text x="450" y="92" textLength="27">[3]</text>
    <text x="550" y="92" textLength="27">[4]</text>
  </g>
  <!-- sensor dots -->
  <g fill="#2a5a42" stroke="#1d3f2f" stroke-width="1.5">
    <circle cx="150" cy="118" r="11"/>
    <circle cx="250" cy="118" r="11"/>
    <circle cx="350" cy="118" r="11"/>
    <circle cx="450" cy="118" r="11"/>
    <circle cx="550" cy="118" r="11"/>
  </g>
  <!-- position labels -->
  <g font-size="13" fill="#4a5a66" text-anchor="middle">
    <text x="150" y="150">Far left</text>
    <text x="250" y="150">Left</text>
    <text x="350" y="150">Center</text>
    <text x="450" y="150">Right</text>
    <text x="550" y="150">Far right</text>
  </g>

  <!-- side note: line sensors -->
  <line x1="566" y1="114" x2="612" y2="114" stroke="#c9d4dc" stroke-width="1.2" stroke-dasharray="2 4"/>
  <text x="618" y="119" font-size="13.5" font-style="italic" fill="#5a6a76">Line sensors</text>
</svg>
