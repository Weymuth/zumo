<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">How Eight Sensors Share Six Wires — Factory Position</title>
  <desc id="desc">A RoboLore instructional wiring map showing the ATmega32U4 pins, the front sensor board, permanent sensor connections, and the factory jumper routes for the left and right proximity receivers.</desc>

  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0B1A2E" flood-opacity="0.09"/>
    </filter>
    <style>
      .inter { font-family: Inter, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", "Courier New", monospace; font-variant-ligatures: none; }
      .title { font-family: Inter, Arial, sans-serif; font-size: 50px; font-weight: 800; fill: #0B1A2E; }
      .subtitle { font-family: Inter, Arial, sans-serif; font-size: 25px; font-weight: 500; fill: #3D5266; }
      .eyebrow { font-family: Inter, Arial, sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 1.4px; fill: #3D5266; }
      .heading { font-family: Inter, Arial, sans-serif; font-size: 26px; font-weight: 800; fill: #0B1A2E; }
      .body { font-family: Inter, Arial, sans-serif; font-size: 21px; font-weight: 500; fill: #1E1E1E; }
      .small { font-family: Inter, Arial, sans-serif; font-size: 17px; font-weight: 500; fill: #3D5266; }
      .pin { font-family: "JetBrains Mono", "Courier New", monospace; font-size: 19px; font-weight: 700; fill: #1E1E1E; font-variant-ligatures: none; }
      .sensorNum { font-family: Inter, Arial, sans-serif; font-size: 25px; font-weight: 800; fill: #FFFFFF; }
      .sensorName { font-family: "JetBrains Mono", "Courier New", monospace; font-size: 17px; font-weight: 700; fill: #3D5266; font-variant-ligatures: none; }
      .jumperLabel { font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 800; fill: #1E1E1E; }
      .padLabel { font-family: "JetBrains Mono", "Courier New", monospace; font-size: 13px; font-weight: 700; fill: #3D5266; font-variant-ligatures: none; }
      .map { font-family: "JetBrains Mono", "Courier New", monospace; font-size: 20px; font-weight: 700; fill: #1E1E1E; font-variant-ligatures: none; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="1600" height="1000" fill="#FFFFFF"/>

  <!-- Title block -->
  <text x="60" y="72" class="title">How Eight Sensors Share Six Wires</text>
  <text x="60" y="112" class="subtitle">Factory jumper position</text>
  <line x1="60" y1="142" x2="1540" y2="142" stroke="#C9A463" stroke-width="3"/>

  <!-- Main instructional field -->
  <rect x="60" y="174" width="1480" height="582" rx="18" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2" filter="url(#softShadow)"/>
  <text x="92" y="211" class="eyebrow">SIGNAL ROUTING</text>

  <!-- Microcontroller -->
  <rect x="330" y="234" width="940" height="92" rx="12" fill="#F3F3F3" stroke="#D4D4D4" stroke-width="2"/>
  <text x="800" y="278" text-anchor="middle" class="heading">ATmega32U4 microcontroller</text>
  <text x="800" y="305" text-anchor="middle" class="small">Five shared I/O connections shown in this factory configuration</text>

  <!-- Pin blocks -->
  <g>
    <rect x="391" y="326" width="18" height="18" rx="3" fill="#3C3C3C"/>
    <text x="400" y="369" text-anchor="middle" class="pin">pin 18</text>

    <rect x="591" y="326" width="18" height="18" rx="3" fill="#3C3C3C"/>
    <text x="600" y="369" text-anchor="middle" class="pin">pin 20</text>

    <rect x="791" y="326" width="18" height="18" rx="3" fill="#3C3C3C"/>
    <text x="800" y="369" text-anchor="middle" class="pin">pin 21</text>

    <rect x="991" y="326" width="18" height="18" rx="3" fill="#3C3C3C"/>
    <text x="1000" y="369" text-anchor="middle" class="pin">pin 4</text>

    <rect x="1191" y="326" width="18" height="18" rx="3" fill="#3C3C3C"/>
    <text x="1200" y="369" text-anchor="middle" class="pin">pin 12</text>
  </g>

  <!-- Permanent routes -->
  <g fill="none" stroke="#007ACC" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M400 344 V574"/>
    <path d="M800 344 V574"/>
    <path d="M1200 344 V574"/>
  </g>
  <g class="inter" font-size="16" font-weight="700" fill="#007ACC">
    <text x="414" y="455">permanent</text>
    <text x="814" y="455">permanent</text>
    <text x="1214" y="455">permanent</text>
  </g>

  <!-- Left jumper: pin 20 -->
  <path d="M600 344 V406" fill="none" stroke="#6A9955" stroke-width="6" stroke-linecap="round"/>
  <text x="600" y="400" text-anchor="middle" class="jumperLabel">Jumper on LFT</text>
  <g>
    <circle cx="560" cy="430" r="9" fill="#3C3C3C"/>
    <circle cx="600" cy="430" r="9" fill="#3C3C3C"/>
    <circle cx="640" cy="430" r="9" fill="#3C3C3C"/>
    <rect x="548" y="416" width="66" height="28" rx="6" fill="#CCA700" fill-opacity="0.92" stroke="#856404" stroke-width="2"/>
    <text x="560" y="462" text-anchor="middle" class="padLabel">LFT</text>
    <text x="600" y="462" text-anchor="middle" class="padLabel">COM</text>
    <text x="640" y="462" text-anchor="middle" class="padLabel">DN</text>
  </g>
  <path d="M560 444 V500 H202 V574" fill="none" stroke="#6A9955" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M640 444 V520 H600 V574" fill="none" stroke="#9D9D9D" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right jumper: pin 4 -->
  <path d="M1000 344 V406" fill="none" stroke="#6A9955" stroke-width="6" stroke-linecap="round"/>
  <text x="1000" y="400" text-anchor="middle" class="jumperLabel">Jumper on RGT</text>
  <g>
    <circle cx="960" cy="430" r="9" fill="#3C3C3C"/>
    <circle cx="1000" cy="430" r="9" fill="#3C3C3C"/>
    <circle cx="1040" cy="430" r="9" fill="#3C3C3C"/>
    <rect x="986" y="416" width="66" height="28" rx="6" fill="#CCA700" fill-opacity="0.92" stroke="#856404" stroke-width="2"/>
    <text x="960" y="462" text-anchor="middle" class="padLabel">DN</text>
    <text x="1000" y="462" text-anchor="middle" class="padLabel">COM</text>
    <text x="1040" y="462" text-anchor="middle" class="padLabel">RGT</text>
  </g>
  <path d="M960 444 V520 H1000 V574" fill="none" stroke="#9D9D9D" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1040 444 V500 H1398 V574" fill="none" stroke="#6A9955" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Front sensor board -->
  <rect x="92" y="574" width="1416" height="134" rx="14" fill="#F3F3F3" stroke="#D4D4D4" stroke-width="2"/>
  <text x="800" y="737" text-anchor="middle" class="small">front sensor board — underside view</text>

  <!-- Left receiver -->
  <rect x="126" y="596" width="152" height="58" rx="10" fill="#FFFFFF" stroke="#007ACC" stroke-width="3"/>
  <text x="202" y="622" text-anchor="middle" class="heading" font-size="22">LEFT</text>
  <text x="202" y="644" text-anchor="middle" class="small" font-size="15">proximity receiver</text>

  <!-- Down-facing sensors -->
  <g>
    <rect x="366" y="592" width="68" height="62" rx="9" fill="#252526"/>
    <text x="400" y="628" text-anchor="middle" class="sensorNum">1</text>
    <text x="400" y="678" text-anchor="middle" class="sensorName">DN1</text>

    <rect x="566" y="592" width="68" height="62" rx="9" fill="#252526"/>
    <text x="600" y="628" text-anchor="middle" class="sensorNum">2</text>
    <text x="600" y="678" text-anchor="middle" class="sensorName">DN2</text>

    <rect x="766" y="592" width="68" height="62" rx="9" fill="#252526"/>
    <text x="800" y="628" text-anchor="middle" class="sensorNum">3</text>
    <text x="800" y="678" text-anchor="middle" class="sensorName">DN3</text>

    <rect x="966" y="592" width="68" height="62" rx="9" fill="#252526"/>
    <text x="1000" y="628" text-anchor="middle" class="sensorNum">4</text>
    <text x="1000" y="678" text-anchor="middle" class="sensorName">DN4</text>

    <rect x="1166" y="592" width="68" height="62" rx="9" fill="#252526"/>
    <text x="1200" y="628" text-anchor="middle" class="sensorNum">5</text>
    <text x="1200" y="678" text-anchor="middle" class="sensorName">DN5</text>
  </g>

  <!-- Right receiver -->
  <rect x="1322" y="596" width="152" height="58" rx="10" fill="#FFFFFF" stroke="#007ACC" stroke-width="3"/>
  <text x="1398" y="622" text-anchor="middle" class="heading" font-size="22">RIGHT</text>
  <text x="1398" y="644" text-anchor="middle" class="small" font-size="15">proximity receiver</text>

  <!-- Five-sensor mode card -->
  <rect x="60" y="786" width="970" height="156" rx="16" fill="#F3F3F3" stroke="#D4D4D4" stroke-width="2"/>
  <rect x="60" y="786" width="10" height="156" rx="5" fill="#CCA700"/>
  <text x="92" y="823" class="eyebrow" fill="#856404">FIVE-SENSOR MODE</text>
  <text x="92" y="858" class="heading">Power off first, then slide both jumper blocks toward <tspan class="mono">DN</tspan>.</text>
  <text x="92" y="892" class="body">Pin <tspan class="mono">20</tspan> then feeds sensor <tspan class="mono">2</tspan>; pin <tspan class="mono">4</tspan> then feeds sensor <tspan class="mono">4</tspan>.</text>
  <text x="92" y="922" class="map">1 -&gt; [0]   2 -&gt; [1]   3 -&gt; [2]   4 -&gt; [3]   5 -&gt; [4]</text>

  <!-- Legend -->
  <rect x="1056" y="786" width="484" height="156" rx="16" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
  <text x="1086" y="823" class="eyebrow">LEGEND</text>

  <line x1="1088" y1="854" x2="1144" y2="854" stroke="#007ACC" stroke-width="6" stroke-linecap="round"/>
  <text x="1164" y="861" class="small">permanent connection</text>

  <line x1="1088" y1="886" x2="1144" y2="886" stroke="#6A9955" stroke-width="6" stroke-linecap="round"/>
  <text x="1164" y="893" class="small">connected in this position</text>

  <line x1="1088" y1="918" x2="1144" y2="918" stroke="#9D9D9D" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round"/>
  <text x="1164" y="925" class="small">not connected in this position</text>

  <rect x="1352" y="840" width="30" height="20" rx="5" fill="#CCA700" stroke="#856404" stroke-width="2"/>
  <text x="1398" y="856" class="small">jumper block</text>
</svg>
