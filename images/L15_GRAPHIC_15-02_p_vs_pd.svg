<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" font-family="Arial, Helvetica, sans-serif" width="1100" height="850">
  <defs>
    </defs>
  <rect width="1100" height="850" fill="#F5F2E9"/>

  <rect x="0" y="0" width="1100" height="78" fill="#0B1A2E"/>
  <text x="550" y="38" fill="#FFFFFF" font-size="27" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">P ALONE vs PD — THE SAME SHOVE</text>
  <text x="550" y="63" fill="#E8EEF4" font-size="16" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">Knock the robot off the line. Then watch how it comes back.</text>

  <!-- ============ TOP: P ONLY ============ -->
  <rect x="55" y="105" width="990" height="320" rx="10" fill="#FDECEA" stroke="#B42318" stroke-width="3"/>
  <rect x="55" y="105" width="990" height="44" rx="10" fill="#B42318"/>
  <rect x="55" y="137" width="990" height="12" fill="#B42318"/>
  <text x="80" y="136" fill="#FFFFFF" font-size="20" font-weight="bold" font-family="Arial, Helvetica, sans-serif">P ONLY — it only knows where it IS</text>

  <line x1="120" y1="290" x2="990" y2="290" stroke="#0B1A2E" stroke-width="2"/>
  <text x="1000" y="295" fill="#0B1A2E" font-size="14" font-weight="bold" font-family="Arial, Helvetica, sans-serif">LINE</text>
  <line x1="120" y1="175" x2="120" y2="405" stroke="#C8D1DA" stroke-width="2"/>

  <!-- the shove -->
  <line x1="175" y1="290" x2="175" y2="195" stroke="#9AA7B2" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="175" y="185" fill="#66788A" font-size="13" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">the shove</text>

  <path d="M 175 195 Q 235 210 285 290 Q 335 372 400 356 Q 460 342 500 290 Q 543 236 597 250 Q 650 262 680 290 Q 712 320 755 313 Q 800 306 825 290 Q 855 271 890 280 Q 925 288 990 289" fill="none" stroke="#B42318" stroke-width="4"/>

  <text x="290" y="395" fill="#B42318" font-size="14" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">overshoot</text>
  <line x1="290" y1="378" x2="297" y2="345" stroke="#B42318" stroke-width="2"/>
  <text x="510" y="215" fill="#B42318" font-size="14" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">overshoot</text>
  <line x1="510" y1="225" x2="505" y2="250" stroke="#B42318" stroke-width="2"/>

  <text x="880" y="360" fill="#B42318" font-size="15" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">…still settling</text>

  <rect x="640" y="160" width="380" height="46" rx="6" fill="#FFFFFF" stroke="#B42318" stroke-width="2"/>
  <text x="830" y="178" fill="#B42318" font-size="14" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">At full speed toward the line,</text>
  <text x="830" y="197" fill="#B42318" font-size="14" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">P is STILL correcting at full strength.</text>

  <!-- ============ BOTTOM: PD ============ -->
  <rect x="55" y="455" width="990" height="320" rx="10" fill="#EDF4EE" stroke="#2F7D55" stroke-width="3"/>
  <rect x="55" y="455" width="990" height="44" rx="10" fill="#2F7D55"/>
  <rect x="55" y="487" width="990" height="12" fill="#2F7D55"/>
  <text x="80" y="486" fill="#FFFFFF" font-size="20" font-weight="bold" font-family="Arial, Helvetica, sans-serif">PD — it also knows where it is HEADED</text>

  <line x1="120" y1="640" x2="990" y2="640" stroke="#0B1A2E" stroke-width="2"/>
  <text x="1000" y="645" fill="#0B1A2E" font-size="14" font-weight="bold" font-family="Arial, Helvetica, sans-serif">LINE</text>
  <line x1="120" y1="525" x2="120" y2="755" stroke="#C8D1DA" stroke-width="2"/>

  <line x1="175" y1="640" x2="175" y2="545" stroke="#9AA7B2" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="175" y="535" fill="#66788A" font-size="13" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">the same shove</text>

  <path d="M 175 545 Q 245 560 320 605 Q 400 645 500 641 L 990 640" fill="none" stroke="#2F7D55" stroke-width="4"/>

  <!-- brake marker -->
  <circle cx="320" cy="605" r="9" fill="#7B6240"/>
  <line x1="320" y1="605" x2="320" y2="700" stroke="#7B6240" stroke-width="2" stroke-dasharray="4,4"/>
  <rect x="185" y="705" width="290" height="46" rx="6" fill="#FFFFFF" stroke="#7B6240" stroke-width="2"/>
  <text x="330" y="723" fill="#7B6240" font-size="14" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">D sees the error closing FAST</text>
  <text x="330" y="742" fill="#7B6240" font-size="14" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">and eases off HERE — before arrival.</text>

  <text x="720" y="615" fill="#2F7D55" font-size="16" font-weight="bold" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">one clean arc. no weave.</text>

  <rect x="640" y="678" width="380" height="72" rx="6" fill="#FFFFFF" stroke="#2F7D55" stroke-width="2"/>
  <text x="830" y="700" fill="#265F45" font-size="14" font-weight="bold" text-anchor="middle" font-family="Courier New, monospace">Same Kp. Same shove. Same robot.</text>
  <text x="830" y="722" fill="#265F45" font-size="14" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">The only difference is that this one</text>
  <text x="830" y="741" fill="#265F45" font-size="14" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">knows which way it is going.</text>
</svg>
