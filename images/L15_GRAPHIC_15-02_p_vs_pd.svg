<svg viewBox="0 0 1100 850" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="band2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a5276"/>
      <stop offset="100%" stop-color="#2e86ab"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="850" fill="#ffffff"/>

  <rect x="0" y="0" width="1100" height="78" fill="url(#band2)"/>
  <text x="550" y="38" fill="#ffffff" font-size="27" font-weight="bold" text-anchor="middle">P ALONE vs PD &#8212; THE SAME SHOVE</text>
  <text x="550" y="63" fill="#d6e9f2" font-size="16" text-anchor="middle">Knock the robot off the line. Then watch how it comes back.</text>

  <!-- ============ TOP: P ONLY ============ -->
  <rect x="55" y="105" width="990" height="320" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
  <rect x="55" y="105" width="990" height="44" rx="10" fill="#c0392b"/>
  <rect x="55" y="137" width="990" height="12" fill="#c0392b"/>
  <text x="80" y="136" fill="#ffffff" font-size="20" font-weight="bold">P ONLY &#8212; it only knows where it IS</text>

  <line x1="120" y1="290" x2="990" y2="290" stroke="#2c3e50" stroke-width="2"/>
  <text x="1000" y="295" fill="#2c3e50" font-size="14" font-weight="bold">LINE</text>
  <line x1="120" y1="175" x2="120" y2="405" stroke="#b8c7d1" stroke-width="2"/>

  <!-- the shove -->
  <line x1="175" y1="290" x2="175" y2="195" stroke="#8fa3b0" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="175" y="185" fill="#607d8b" font-size="13" text-anchor="middle">the shove</text>

  <path d="M 175 195 Q 235 210 285 290 Q 335 372 400 356 Q 460 342 500 290 Q 543 236 597 250 Q 650 262 680 290 Q 712 320 755 313 Q 800 306 825 290 Q 855 271 890 280 Q 925 288 990 289"
        fill="none" stroke="#c0392b" stroke-width="4"/>

  <text x="290" y="395" fill="#c0392b" font-size="14" font-weight="bold" text-anchor="middle">overshoot</text>
  <line x1="290" y1="378" x2="297" y2="345" stroke="#c0392b" stroke-width="2"/>
  <text x="510" y="215" fill="#c0392b" font-size="14" font-weight="bold" text-anchor="middle">overshoot</text>
  <line x1="510" y1="225" x2="505" y2="250" stroke="#c0392b" stroke-width="2"/>

  <text x="880" y="360" fill="#c0392b" font-size="15" font-weight="bold" text-anchor="middle">&#8230;still settling</text>

  <rect x="640" y="160" width="380" height="46" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="830" y="178" fill="#c0392b" font-size="14" font-weight="bold" text-anchor="middle">At full speed toward the line,</text>
  <text x="830" y="197" fill="#c0392b" font-size="14" font-weight="bold" text-anchor="middle">P is STILL correcting at full strength.</text>

  <!-- ============ BOTTOM: PD ============ -->
  <rect x="55" y="455" width="990" height="320" rx="10" fill="#eef7f1" stroke="#3a7d5c" stroke-width="3"/>
  <rect x="55" y="455" width="990" height="44" rx="10" fill="#3a7d5c"/>
  <rect x="55" y="487" width="990" height="12" fill="#3a7d5c"/>
  <text x="80" y="486" fill="#ffffff" font-size="20" font-weight="bold">PD &#8212; it also knows where it is HEADED</text>

  <line x1="120" y1="640" x2="990" y2="640" stroke="#2c3e50" stroke-width="2"/>
  <text x="1000" y="645" fill="#2c3e50" font-size="14" font-weight="bold">LINE</text>
  <line x1="120" y1="525" x2="120" y2="755" stroke="#b8c7d1" stroke-width="2"/>

  <line x1="175" y1="640" x2="175" y2="545" stroke="#8fa3b0" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="175" y="535" fill="#607d8b" font-size="13" text-anchor="middle">the same shove</text>

  <path d="M 175 545 Q 245 560 320 605 Q 400 645 500 641 L 990 640"
        fill="none" stroke="#3a7d5c" stroke-width="4"/>

  <!-- brake marker -->
  <circle cx="320" cy="605" r="9" fill="#e67e22"/>
  <line x1="320" y1="605" x2="320" y2="700" stroke="#e67e22" stroke-width="2" stroke-dasharray="4,4"/>
  <rect x="185" y="705" width="290" height="46" rx="6" fill="#ffffff" stroke="#e67e22" stroke-width="2"/>
  <text x="330" y="723" fill="#a05a12" font-size="14" font-weight="bold" text-anchor="middle">D sees the error closing FAST</text>
  <text x="330" y="742" fill="#a05a12" font-size="14" font-weight="bold" text-anchor="middle">and eases off HERE &#8212; before arrival.</text>

  <text x="720" y="615" fill="#3a7d5c" font-size="16" font-weight="bold" text-anchor="middle">one clean arc. no weave.</text>

  <rect x="640" y="678" width="380" height="72" rx="6" fill="#ffffff" stroke="#3a7d5c" stroke-width="2"/>
  <text x="830" y="700" fill="#2a5a42" font-size="14" font-weight="bold" text-anchor="middle">Same Kp. Same shove. Same robot.</text>
  <text x="830" y="722" fill="#2a5a42" font-size="14" text-anchor="middle">The only difference is that this one</text>
  <text x="830" y="741" fill="#2a5a42" font-size="14" text-anchor="middle">knows which way it is going.</text>
</svg>
