<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850">
  <!-- ============ TITLE BAND ============ -->
  <rect x="0" y="0" width="1100" height="850" fill="#F5F2E9"/>
  <rect x="0" y="0" width="1100" height="90" fill="#0B1A2E"/>
  <text x="40" y="42" fill="#FFFFFF" font-size="30" font-weight="600" font-family="Arial, Helvetica, sans-serif">THE CLAMP — WHY SILVER READS AS WHITE</text>
  <text x="40" y="72" fill="#E8EEF4" font-size="18" font-family="Courier New, monospace">if (x &lt; 0) x = 0;  — four characters of library code, one invisible doorway</text>

  <!-- ============ LEFT: RAW SCALE ============ -->
  <text x="230" y="150" fill="#0B1A2E" font-size="22" font-weight="600" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">RAW CHANNEL</text>
  <text x="230" y="176" fill="#3D5266" font-size="15" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">decay time, microseconds — brighter = LOWER</text>

  <line x1="230" y1="210" x2="230" y2="700" stroke="#0B1A2E" stroke-width="4"/>
  <line x1="222" y1="210" x2="238" y2="210" stroke="#0B1A2E" stroke-width="4"/>
  <line x1="222" y1="700" x2="238" y2="700" stroke="#0B1A2E" stroke-width="4"/>
  <text x="196" y="216" fill="#3D5266" font-size="14" text-anchor="end" font-family="Arial, Helvetica, sans-serif">bright</text>
  <text x="196" y="706" fill="#3D5266" font-size="14" text-anchor="end" font-family="Arial, Helvetica, sans-serif">dark</text>

  <!-- silver mark -->
  <circle cx="230" cy="260" r="12" fill="#D8E0E5" stroke="#66788A" stroke-width="3"/>
  <text x="256" y="256" fill="#0B1A2E" font-size="17" font-weight="600" font-family="Arial, Helvetica, sans-serif">SILVER ≈ 250</text>
  <text x="256" y="276" fill="#66788A" font-size="14" font-family="Arial, Helvetica, sans-serif">brighter than calibration ever saw</text>

  <!-- white mark = calmin -->
  <circle cx="230" cy="340" r="12" fill="#ffffff" stroke="#9AA7B2" stroke-width="3"/>
  <text x="256" y="336" fill="#0B1A2E" font-size="17" font-weight="600" font-family="Arial, Helvetica, sans-serif">WHITE floor ≈ 400</text>
  <text x="256" y="356" fill="#66788A" font-size="14" font-family="Arial, Helvetica, sans-serif">calmin — the brightest thing the spin saw</text>

  <!-- green mark -->
  <circle cx="230" cy="470" r="12" fill="#80C99E" stroke="#2F7D55" stroke-width="3"/>
  <text x="256" y="466" fill="#0B1A2E" font-size="17" font-weight="600" font-family="Arial, Helvetica, sans-serif">GREEN marker ≈ 1200</text>

  <!-- black mark -->
  <circle cx="230" cy="640" r="12" fill="#0B1A2E" stroke="#0B1A2E" stroke-width="3"/>
  <text x="256" y="636" fill="#0B1A2E" font-size="17" font-weight="600" font-family="Arial, Helvetica, sans-serif">BLACK line ≈ 2400</text>
  <text x="256" y="656" fill="#66788A" font-size="14" font-family="Arial, Helvetica, sans-serif">the darkest thing the spin saw</text>

  <!-- SILVER_RAW_MAX fence between silver and white -->
  <line x1="150" y1="300" x2="310" y2="300" stroke="#B42318" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="150" y="292" fill="#B42318" font-size="14" font-weight="600" font-family="Courier New, monospace">SILVER_RAW_MAX — your fence, set between them (7A)</text>

  <!-- ============ RIGHT: CALIBRATED SCALE ============ -->
  <text x="800" y="150" fill="#0B1A2E" font-size="22" font-weight="600" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">CALIBRATED CHANNEL</text>
  <text x="800" y="176" fill="#3D5266" font-size="15" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">mapped 0..1000, then CLAMPED at both ends</text>

  <line x1="800" y1="340" x2="800" y2="640" stroke="#0B1A2E" stroke-width="4"/>
  <line x1="792" y1="340" x2="808" y2="340" stroke="#0B1A2E" stroke-width="4"/>
  <line x1="792" y1="640" x2="808" y2="640" stroke="#0B1A2E" stroke-width="4"/>
  <text x="830" y="346" fill="#0B1A2E" font-size="17" font-weight="600" font-family="Arial, Helvetica, sans-serif">0</text>
  <text x="830" y="646" fill="#0B1A2E" font-size="17" font-weight="600" font-family="Arial, Helvetica, sans-serif">1000</text>

  <!-- mapping arrows: single polygons, canon -->
  <!-- white -> 0 -->
  <polygon points="330,340 740,340 740,332 770,344 740,356 740,348 330,348" fill="#9AA7B2"/>
  <text x="540" y="330" fill="#66788A" font-size="14" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">white → 0</text>
  <!-- green -> ~500 -->
  <polygon points="330,470 740,490 740,482 770,495 740,506 740,498 330,478" fill="#2F7D55"/>
  <text x="540" y="462" fill="#2F7D55" font-size="14" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">green → ≈500 (Lesson 9 lives here)</text>
  <!-- black -> 1000 -->
  <polygon points="330,640 740,640 740,632 770,644 740,656 740,648 330,648" fill="#0B1A2E"/>
  <text x="540" y="630" fill="#3D5266" font-size="14" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">black → 1000</text>

  <!-- silver -> -75 -> CLAMPED to 0 : the bent red arrow -->
  <polygon points="330,258 660,240 660,232 662,232 700,246 700,300 706,300 692,326 678,300 684,300 684,252 662,248 662,248 330,266" fill="#B42318"/>
  <text x="500" y="230" fill="#B42318" font-size="15" font-weight="600" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">silver computes x = −75...</text>
  <rect x="612" y="300" width="176" height="34" rx="6" fill="#FDECEA" stroke="#B42318" stroke-width="2"/>
  <text x="700" y="323" fill="#B42318" font-size="15" font-weight="600" text-anchor="middle" font-family="Courier New, monospace">if (x &lt; 0) x = 0;</text>
  <polygon points="694,334 706,334 706,338 760,338 760,332 788,341 760,350 760,344 694,344" fill="#B42318"/>
  <text x="740" y="368" fill="#B42318" font-size="14" text-anchor="middle" font-family="Arial, Helvetica, sans-serif">...and lands ON 0.</text>

  <!-- the collision callout -->
  <circle cx="800" cy="340" r="16" fill="none" stroke="#B42318" stroke-width="3" stroke-dasharray="5 4"/>
  <text x="828" y="300" fill="#B42318" font-size="16" font-weight="600" font-family="Arial, Helvetica, sans-serif">silver and white:</text>
  <text x="828" y="320" fill="#B42318" font-size="16" font-weight="600" font-family="Arial, Helvetica, sans-serif">the SAME number.</text>

  <!-- footer verdict band -->
  <rect x="0" y="720" width="1100" height="130" fill="#F1F4F6"/>
  <text x="40" y="758" fill="#0B1A2E" font-size="18" font-weight="600" font-family="Arial, Helvetica, sans-serif">The subtraction knew — the clamp forgot.</text>
  <text x="40" y="786" fill="#0B1A2E" font-size="15" font-family="Arial, Helvetica, sans-serif">On the raw channel, silver (250) and white (400) are 150 apart — a gulf you can drive a threshold through.</text>
  <text x="40" y="808" fill="#0B1A2E" font-size="15" font-family="Arial, Helvetica, sans-serif">On the calibrated channel both read exactly 0. To see the door, silverDetected() reads RAW — deliberately.</text>
  <text x="40" y="834" fill="#66788A" font-size="14" font-family="Arial, Helvetica, sans-serif">Lesson 13, GRAPHIC 13.2 · clamp code paraphrased from the Pololu QTRSensors library</text>
</svg>
