<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" font-family="Segoe UI, Tahoma, Geneva, Verdana, sans-serif">
  <!-- ============ TITLE BAND ============ -->
  <defs>
    <linearGradient id="titleGrad2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a5276"/>
      <stop offset="1" stop-color="#2e86ab"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1100" height="850" fill="#fafafa"/>
  <rect x="0" y="0" width="1100" height="90" fill="url(#titleGrad2)"/>
  <text x="40" y="42" fill="#ffffff" font-size="30" font-weight="600">THE CLAMP &#8212; WHY SILVER READS AS WHITE</text>
  <text x="40" y="72" fill="#d6eaf8" font-size="18">if (x &#60; 0) x = 0;  &#8212; four characters of library code, one invisible doorway</text>

  <!-- ============ LEFT: RAW SCALE ============ -->
  <text x="230" y="150" fill="#1a5276" font-size="22" font-weight="600" text-anchor="middle">RAW CHANNEL</text>
  <text x="230" y="176" fill="#5d6d7e" font-size="15" text-anchor="middle">decay time, microseconds &#8212; brighter = LOWER</text>

  <line x1="230" y1="210" x2="230" y2="700" stroke="#2c3e50" stroke-width="4"/>
  <line x1="222" y1="210" x2="238" y2="210" stroke="#2c3e50" stroke-width="4"/>
  <line x1="222" y1="700" x2="238" y2="700" stroke="#2c3e50" stroke-width="4"/>
  <text x="196" y="216" fill="#5d6d7e" font-size="14" text-anchor="end">bright</text>
  <text x="196" y="706" fill="#5d6d7e" font-size="14" text-anchor="end">dark</text>

  <!-- silver mark -->
  <circle cx="230" cy="260" r="12" fill="#d5dbdb" stroke="#7f8c8d" stroke-width="3"/>
  <text x="256" y="256" fill="#2c3e50" font-size="17" font-weight="600">SILVER &#8776; 250</text>
  <text x="256" y="276" fill="#7f8c8d" font-size="14">brighter than calibration ever saw</text>

  <!-- white mark = calmin -->
  <circle cx="230" cy="340" r="12" fill="#ffffff" stroke="#95a5a6" stroke-width="3"/>
  <text x="256" y="336" fill="#2c3e50" font-size="17" font-weight="600">WHITE floor &#8776; 400</text>
  <text x="256" y="356" fill="#7f8c8d" font-size="14">calmin &#8212; the brightest thing the spin saw</text>

  <!-- green mark -->
  <circle cx="230" cy="470" r="12" fill="#7dcea0" stroke="#3a7d5c" stroke-width="3"/>
  <text x="256" y="466" fill="#2c3e50" font-size="17" font-weight="600">GREEN marker &#8776; 1200</text>

  <!-- black mark -->
  <circle cx="230" cy="640" r="12" fill="#2c3e50" stroke="#17202a" stroke-width="3"/>
  <text x="256" y="636" fill="#2c3e50" font-size="17" font-weight="600">BLACK line &#8776; 2400</text>
  <text x="256" y="656" fill="#7f8c8d" font-size="14">the darkest thing the spin saw</text>

  <!-- SILVER_RAW_MAX fence between silver and white -->
  <line x1="150" y1="300" x2="310" y2="300" stroke="#c0392b" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="150" y="292" fill="#c0392b" font-size="14" font-weight="600">SILVER_RAW_MAX &#8212; your fence, set between them (7A)</text>

  <!-- ============ RIGHT: CALIBRATED SCALE ============ -->
  <text x="800" y="150" fill="#1a5276" font-size="22" font-weight="600" text-anchor="middle">CALIBRATED CHANNEL</text>
  <text x="800" y="176" fill="#5d6d7e" font-size="15" text-anchor="middle">mapped 0..1000, then CLAMPED at both ends</text>

  <line x1="800" y1="340" x2="800" y2="640" stroke="#2c3e50" stroke-width="4"/>
  <line x1="792" y1="340" x2="808" y2="340" stroke="#2c3e50" stroke-width="4"/>
  <line x1="792" y1="640" x2="808" y2="640" stroke="#2c3e50" stroke-width="4"/>
  <text x="830" y="346" fill="#2c3e50" font-size="17" font-weight="600">0</text>
  <text x="830" y="646" fill="#2c3e50" font-size="17" font-weight="600">1000</text>

  <!-- mapping arrows: single polygons, canon -->
  <!-- white -> 0 -->
  <polygon points="330,340 740,340 740,332 770,344 740,356 740,348 330,348" fill="#95a5a6"/>
  <text x="540" y="330" fill="#7f8c8d" font-size="14" text-anchor="middle">white &#8594; 0</text>
  <!-- green -> ~500 -->
  <polygon points="330,470 740,490 740,482 770,495 740,506 740,498 330,478" fill="#3a7d5c"/>
  <text x="540" y="462" fill="#3a7d5c" font-size="14" text-anchor="middle">green &#8594; &#8776;500 (Lesson 9 lives here)</text>
  <!-- black -> 1000 -->
  <polygon points="330,640 740,640 740,632 770,644 740,656 740,648 330,648" fill="#2c3e50"/>
  <text x="540" y="630" fill="#5d6d7e" font-size="14" text-anchor="middle">black &#8594; 1000</text>

  <!-- silver -> -75 -> CLAMPED to 0 : the bent red arrow -->
  <polygon points="330,258 660,240 660,232 662,232 700,246 700,300 706,300 692,326 678,300 684,300 684,252 662,248 662,248 330,266" fill="#c0392b"/>
  <text x="500" y="230" fill="#c0392b" font-size="15" font-weight="600" text-anchor="middle">silver computes x = &#8722;75...</text>
  <rect x="612" y="300" width="176" height="34" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="700" y="323" fill="#c0392b" font-size="15" font-weight="600" text-anchor="middle">if (x &#60; 0) x = 0;</text>
  <polygon points="694,334 706,334 706,338 760,338 760,332 788,341 760,350 760,344 694,344" fill="#c0392b"/>
  <text x="740" y="368" fill="#c0392b" font-size="14" text-anchor="middle">...and lands ON 0.</text>

  <!-- the collision callout -->
  <circle cx="800" cy="340" r="16" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="5 4"/>
  <text x="828" y="300" fill="#c0392b" font-size="16" font-weight="600">silver and white:</text>
  <text x="828" y="320" fill="#c0392b" font-size="16" font-weight="600">the SAME number.</text>

  <!-- footer verdict band -->
  <rect x="0" y="720" width="1100" height="130" fill="#eaf2f8"/>
  <text x="40" y="758" fill="#1a5276" font-size="18" font-weight="600">The subtraction knew &#8212; the clamp forgot.</text>
  <text x="40" y="786" fill="#2c3e50" font-size="15">On the raw channel, silver (250) and white (400) are 150 apart &#8212; a gulf you can drive a threshold through.</text>
  <text x="40" y="808" fill="#2c3e50" font-size="15">On the calibrated channel both read exactly 0. To see the door, silverDetected() reads RAW &#8212; deliberately.</text>
  <text x="40" y="834" fill="#7f8c8d" font-size="14">Lesson 13, GRAPHIC 13.2 &#183; clamp code paraphrased from the Pololu QTRSensors library</text>
</svg>
