<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">The Five-Move Demo</title>
  <desc id="desc">A five-step program sequence and matching floor path. The robot drives 30 centimeters, turns 90 degrees, drives 20 centimeters, turns 180 degrees, then drives back over the same 20-centimeter segment.</desc>
  <defs>
    <marker id="arrowBlue" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 14,7 0,14" fill="#007ACC"/></marker>
    <marker id="arrowGreen" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 14,7 0,14" fill="#6A9955"/></marker>
    <marker id="arrowRed" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 14,7 0,14" fill="#F44747"/></marker>
    <marker id="arrowOrange" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 12,6 0,12" fill="#CE9178"/></marker>
  </defs>
  <rect x="0" y="0" width="1100" height="850" fill="#F5F2E9"/>

  <!-- Title -->
  <text x="48" y="53" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#0B1A2E">The Five-Move Demo</text>
  <text x="48" y="83" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#3D5266">Follow the calls in order. Turns happen in place; moves 3 and 5 share one path.</text>
  <line x1="48" y1="105" x2="1052" y2="105" stroke="#C9A463" stroke-width="3"/>

  <text x="48" y="142" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2" fill="#3D5266">PROGRAM SEQUENCE</text>
  <text x="521" y="142" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2" fill="#3D5266">PATH ON THE FLOOR</text>

  <!-- Left card -->
  <rect x="48" y="160" width="431" height="571" rx="16" fill="#F3F3F3" stroke="#D4D4D4" stroke-width="2"/>
  <line x1="86" y1="207" x2="86" y2="661" stroke="#B9C4CE" stroke-width="4" marker-end="url(#arrowBlue)"/>

  <!-- Step 1 -->
  <circle cx="86" cy="208" r="22" fill="#007ACC"/>
  <text x="86" y="216" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">1</text>
  <rect x="121" y="180" width="331" height="76" rx="11" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
  <text x="142" y="214" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#DCDCAA">driveDistance(30)</text>
  <text x="142" y="239" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1E1E1E">Drive straight 30 cm.</text>

  <!-- Step 2 -->
  <circle cx="86" cy="310" r="22" fill="#5B9BD5"/>
  <text x="86" y="318" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">2</text>
  <rect x="121" y="282" width="331" height="76" rx="11" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
  <text x="142" y="316" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#569CD6">turnDegrees(90)</text>
  <text x="142" y="341" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1E1E1E">Turn 90° in place.</text>

  <!-- Step 3 -->
  <circle cx="86" cy="412" r="22" fill="#6A9955"/>
  <text x="86" y="420" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">3</text>
  <rect x="121" y="384" width="331" height="76" rx="11" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
  <text x="142" y="418" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#6A9955">driveDistance(20)</text>
  <text x="142" y="443" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1E1E1E">Drive 20 cm along the new path.</text>

  <!-- Step 4 -->
  <circle cx="86" cy="514" r="22" fill="#CE9178"/>
  <text x="86" y="522" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">4</text>
  <rect x="121" y="486" width="331" height="76" rx="11" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
  <text x="142" y="520" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#CE9178">turnDegrees(180)</text>
  <text x="142" y="545" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1E1E1E">Spin around in place.</text>

  <!-- Step 5 -->
  <circle cx="86" cy="616" r="22" fill="#F44747"/>
  <text x="86" y="624" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">5</text>
  <rect x="121" y="588" width="331" height="76" rx="11" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
  <text x="142" y="622" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#F44747">driveDistance(20)</text>
  <text x="142" y="647" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1E1E1E">Drive back over the same 20 cm.</text>

  <rect x="68" y="686" width="390" height="26" rx="13" fill="#E6F0E8"/>
  <text x="263" y="704" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#316443">One program • five calls • one continuous route</text>

  <!-- Right path card -->
  <rect x="521" y="160" width="531" height="571" rx="16" fill="#F3F3F3" stroke="#D4D4D4" stroke-width="2"/>

  <!-- Grid -->
  <g stroke="#DFE4E8" stroke-width="1.5">
    <line x1="570" y1="210" x2="1004" y2="210"/><line x1="570" y1="290" x2="1004" y2="290"/><line x1="570" y1="370" x2="1004" y2="370"/><line x1="570" y1="450" x2="1004" y2="450"/><line x1="570" y1="530" x2="1004" y2="530"/><line x1="570" y1="610" x2="1004" y2="610"/>
    <line x1="610" y1="195" x2="610" y2="680"/><line x1="690" y1="195" x2="690" y2="680"/><line x1="770" y1="195" x2="770" y2="680"/><line x1="850" y1="195" x2="850" y2="680"/><line x1="930" y1="195" x2="930" y2="680"/>
  </g>

  <!-- Horizontal move 1 -->
  <circle cx="610" cy="610" r="11" fill="#0B1A2E"/>
  <line x1="621" y1="610" x2="812" y2="610" stroke="#007ACC" stroke-width="9" marker-end="url(#arrowBlue)"/>
  <text x="587" y="645" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0B1A2E">START</text>
  <circle cx="686" cy="578" r="18" fill="#007ACC"/>
  <text x="686" y="585" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">1</text>
  <text x="712" y="584" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0B1A2E">30 cm</text>

  <!-- 90 turn at end -->
  <circle cx="820" cy="610" r="33" fill="none" stroke="#5B9BD5" stroke-width="4" stroke-dasharray="7 6"/>
  <circle cx="820" cy="610" r="12" fill="#FFFFFF" stroke="#3D5266" stroke-width="4"/>
  <circle cx="820" cy="610" r="6" fill="#F44747"/>
  <circle cx="870" cy="642" r="18" fill="#5B9BD5"/>
  <text x="870" y="649" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">2</text>
  <text x="892" y="648" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0B1A2E">turn 90°</text>

  <!-- Up and back path -->
  <line x1="813" y1="578" x2="813" y2="332" stroke="#6A9955" stroke-width="8" marker-end="url(#arrowGreen)"/>
  <line x1="827" y1="332" x2="827" y2="578" stroke="#F44747" stroke-width="8" marker-end="url(#arrowRed)"/>
  <circle cx="778" cy="450" r="18" fill="#6A9955"/>
  <text x="778" y="457" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">3</text>
  <text x="720" y="480" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#316443">up 20 cm</text>
  <circle cx="862" cy="450" r="18" fill="#F44747"/>
  <text x="862" y="457" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">5</text>
  <text x="852" y="480" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#C53A3A">back 20 cm</text>

  <!-- 180 turn -->
  <circle cx="820" cy="300" r="34" fill="none" stroke="#CE9178" stroke-width="4" stroke-dasharray="7 6"/>
  <path d="M800 306 A20 20 0 1 1 838 316" fill="none" stroke="#CE9178" stroke-width="5" marker-end="url(#arrowOrange)"/>
  <circle cx="870" cy="274" r="18" fill="#CE9178"/>
  <text x="870" y="281" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">4</text>
  <text x="892" y="280" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0B1A2E">turn 180°</text>

  <!-- Shared path callout -->
  <line x1="846" y1="418" x2="884" y2="418" stroke="#76889A" stroke-width="2"/>
  <rect x="884" y="389" width="130" height="57" rx="10" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
  <text x="949" y="413" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0B1A2E">SAME 20 cm</text>
  <text x="949" y="434" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#607489">out and back</text>

  <text x="820" y="682" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0B1A2E">END</text>
  <text x="820" y="705" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#607489">back at the corner</text>

  <!-- Key idea footer -->
  <rect x="48" y="754" width="1004" height="67" rx="14" fill="#F3F3F3" stroke="#D4D4D4" stroke-width="2"/>
  <rect x="48" y="754" width="8" height="67" rx="4" fill="#6A9955"/>
  <text x="76" y="782" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#0B1A2E">Key idea:</text>
  <text x="156" y="782" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1E1E1E">Moves 3 and 5 use the exact same strip of floor.</text>
  <text x="76" y="805" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#607489">The two vertical arrows are offset only so both directions remain visible.</text>
</svg>