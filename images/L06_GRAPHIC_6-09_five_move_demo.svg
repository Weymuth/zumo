<svg viewBox="0 0 1100 850" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
<defs><linearGradient id="tb" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#1a5276"/><stop offset="100%" stop-color="#2e86ab"/></linearGradient></defs>
<rect width="1100" height="850" fill="#ffffff"/>
<rect x="0" y="0" width="1100" height="70" fill="url(#tb)"/>
<text x="550" y="38" fill="#fff" font-size="27" font-weight="bold" text-anchor="middle">GRAPHIC 6.9 &#8212; The Five-Move Demo</text>
<text x="550" y="59" fill="#d6eaf8" font-size="15" text-anchor="middle">driveDistance() and turnDegrees(), composed into a path</text><rect x="150" y="180" width="800" height="480" fill="#f7faf8" stroke="#d7e3dc"/><line x1="250" y1="180" x2="250" y2="660" stroke="#e4ece8"/><line x1="360" y1="180" x2="360" y2="660" stroke="#e4ece8"/><line x1="470" y1="180" x2="470" y2="660" stroke="#e4ece8"/><line x1="580" y1="180" x2="580" y2="660" stroke="#e4ece8"/><line x1="690" y1="180" x2="690" y2="660" stroke="#e4ece8"/><line x1="800" y1="180" x2="800" y2="660" stroke="#e4ece8"/><line x1="910" y1="180" x2="910" y2="660" stroke="#e4ece8"/><line x1="150" y1="600" x2="950" y2="600" stroke="#e4ece8"/><line x1="150" y1="490" x2="950" y2="490" stroke="#e4ece8"/><line x1="150" y1="380" x2="950" y2="380" stroke="#e4ece8"/><line x1="150" y1="270" x2="950" y2="270" stroke="#e4ece8"/><polygon points="250,596 554,596 554,588 580,600 554,612 554,604 250,604" fill="#2a5a42"/><text x="415" y="578" font-size="18" font-weight="bold" fill="#2a5a42" text-anchor="middle">1 &#183; driveDistance(30)</text><polygon points="567,600 567,406 559,406 571,380 583,406 575,406 575,600" fill="#2a5a42"/><text x="555" y="490" font-size="18" font-weight="bold" fill="#2a5a42" text-anchor="end">3 &#183; driveDistance(20)</text><polygon points="585,380 585,574 577,574 589,600 601,574 593,574 593,380" fill="#9a4459"/><text x="605" y="490" font-size="18" font-weight="bold" fill="#9a4459" text-anchor="start">5 &#183; driveDistance(20)</text><circle cx="580" cy="600" r="26" fill="none" stroke="#3a7d5c" stroke-width="3" stroke-dasharray="5 4"/><text x="620" y="634" font-size="18" font-weight="bold" fill="#3a7d5c">2 &#183; turnDegrees(90)</text><circle cx="580" cy="380" r="26" fill="none" stroke="#9a4459" stroke-width="3" stroke-dasharray="5 4"/><text x="620" y="374" font-size="18" font-weight="bold" fill="#9a4459">4 &#183; turnDegrees(180)</text><text x="620" y="396" font-size="14" fill="#666">spin in place &#8212; then retrace</text><circle cx="250" cy="600" r="9" fill="#1a5276"/><text x="250" y="634" font-size="16" font-weight="bold" fill="#1a5276" text-anchor="middle">START</text><circle cx="580" cy="600" r="7" fill="#9a4459"/><text x="580" y="652" font-size="15" font-weight="bold" fill="#9a4459" text-anchor="middle">END (back at the corner)</text><rect x="150" y="695" width="800" height="90" rx="6" fill="#e8f3ec" stroke="#3a7d5c" stroke-width="2"/>
<text x="175" y="723" font-size="17" font-weight="bold" fill="#2a5a42">Legs 3 and 5 are the same 20 cm of floor.</text>
<text x="175" y="748" font-size="15" fill="#333">The robot drives up, spins 180&#176; in place, and drives back down its own path. They are drawn</text>
<text x="175" y="770" font-size="15" fill="#333">side by side here only so you can see both &#8212; on the desk, they lie exactly on top of each other.</text></svg>