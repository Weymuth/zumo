<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">The A/B Protocol</title>
  <desc id="desc">An instructional comparison showing how one code switch creates Build A and Build B, how each build is tested three times under controlled conditions, and how the delta row determines whether the enhancement improved lap time and mean absolute error.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3D5266"/>
    </marker>
    <style>
      .inter { font-family: Arial, Helvetica, sans-serif; }
      .mono { font-family: 'Courier New, monospace', Consolas, monospace; font-variant-ligatures: none; }
      .navy { fill: #0B1A2E; }
      .slate { fill: #3D5266; }
      .body { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #1E1E1E; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #3D5266; }
      .card-title { font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 800; fill: #0B1A2E; }
      .code { font-family: 'Courier New, monospace', Consolas, monospace; font-variant-ligatures: none; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="1100" height="850" fill="#FFFFFF"/>

  <!-- Brand layer -->
  <text x="56" y="58" class="inter navy" font-size="34" font-weight="800">The A/B Protocol</text>
  <text x="1044" y="39" class="inter slate" font-size="13" font-weight="700" text-anchor="end" letter-spacing="1.1">ZUMO 32U4 ROBOTICS · LESSON 16</text>
  <text x="56" y="88" class="inter slate" font-size="16">One switch. One ruler. Two rows. The only experiment that proves your code caused the change.</text>
  <line x1="56" y1="108" x2="1044" y2="108" stroke="#C9A463" stroke-width="3"/>

  <!-- One controlled switch -->
  <rect x="330" y="132" width="440" height="94" rx="12" fill="#F3F3F3" stroke="#D4D4D4" stroke-width="2"/>
  <text x="350" y="158" class="inter slate" font-size="12" font-weight="800" letter-spacing="1.2">THE ONE CONTROLLED CHANGE</text>
  <rect x="350" y="171" width="400" height="38" rx="6" fill="#1E1E1E" stroke="#3C3C3C"/>
  <text x="420" y="197" class="code" font-size="17" font-weight="700" fill="#569CD6">const</text>
  <text x="480" y="197" class="code" font-size="17" font-weight="700" fill="#4EC9B0">bool</text>
  <text x="530" y="197" class="code" font-size="17" font-weight="700" fill="#D4D4D4">ENHANCEMENT_ON</text>
  <text x="550" y="220" class="small" text-anchor="middle">the only thing that differs between the two builds</text>

  <!-- Split connectors -->
  <path d="M475 226 C440 245 390 255 320 274" fill="none" stroke="#3D5266" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M625 226 C660 245 710 255 780 274" fill="none" stroke="#3D5266" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Build A card -->
  <rect x="56" y="286" width="474" height="250" rx="12" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
  <rect x="56" y="286" width="8" height="250" rx="4" fill="#007ACC"/>
  <circle cx="92" cy="322" r="18" fill="#007ACC"/>
  <text x="92" y="329" class="inter" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">A</text>
  <text x="122" y="318" class="card-title">The robot you inherited</text>
  <text x="122" y="340" class="small">Baseline build</text>

  <rect x="84" y="360" width="418" height="42" rx="6" fill="#1E1E1E" stroke="#3C3C3C"/>
  <text x="293" y="387" class="code" font-size="16" font-weight="700" text-anchor="middle">
    <tspan fill="#D4D4D4">ENHANCEMENT_ON = </tspan><tspan fill="#569CD6">false</tspan>
  </text>

  <text x="84" y="431" class="body" font-weight="700">Build → run the course × 3</text>
  <text x="84" y="458" class="body">Must match your saved baseline.</text>
  <text x="84" y="481" class="body">If it does not, something else changed. Stop. Find it.</text>

  <rect x="84" y="492" width="418" height="30" rx="6" fill="#F3F3F3" stroke="#D4D4D4"/>
  <text x="293" y="513" class="mono navy" font-size="15" font-weight="700" text-anchor="middle">LAP 41.6 s   ·   MAE 173</text>

  <!-- Build B card -->
  <rect x="570" y="286" width="474" height="250" rx="12" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="2"/>
  <rect x="1036" y="286" width="8" height="250" rx="4" fill="#6A9955"/>
  <circle cx="606" cy="322" r="18" fill="#6A9955"/>
  <text x="606" y="329" class="inter" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">B</text>
  <text x="636" y="318" class="card-title">The robot you built</text>
  <text x="636" y="340" class="small">Enhancement build</text>

  <rect x="598" y="360" width="418" height="42" rx="6" fill="#1E1E1E" stroke="#3C3C3C"/>
  <text x="807" y="387" class="code" font-size="16" font-weight="700" text-anchor="middle">
    <tspan fill="#D4D4D4">ENHANCEMENT_ON = </tspan><tspan fill="#6A9955">true</tspan>
  </text>

  <text x="598" y="431" class="body" font-weight="700">Build → run the course × 3</text>
  <text x="598" y="458" class="body">Same course. Same battery charge.</text>
  <text x="598" y="481" class="body">Same session. Same calibration. Same ruler.</text>

  <rect x="598" y="492" width="418" height="30" rx="6" fill="#F3F3F3" stroke="#D4D4D4"/>
  <text x="807" y="513" class="mono navy" font-size="15" font-weight="700" text-anchor="middle">LAP 39.8 s   ·   MAE 158</text>

  <!-- Converge connectors -->
  <path d="M293 536 C340 558 408 567 474 582" fill="none" stroke="#3D5266" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M807 536 C760 558 692 567 626 582" fill="none" stroke="#3D5266" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Verdict -->
  <rect x="292" y="592" width="516" height="126" rx="12" fill="#FFFFFF" stroke="#6A9955" stroke-width="2.5"/>
  <text x="550" y="621" class="inter slate" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1.2">THE VERDICT</text>
  <text x="550" y="648" class="card-title" text-anchor="middle">The delta row does the arguing</text>
  <rect x="382" y="663" width="336" height="34" rx="6" fill="#F3F3F3" stroke="#D4D4D4"/>
  <text x="550" y="686" class="mono" font-size="17" font-weight="700" text-anchor="middle" fill="#6A9955">LAP -1.8 s   ·   MAE -15</text>
  <text x="550" y="710" class="small" text-anchor="middle">negative is better in both columns: less time, less error</text>

  <!-- Lesson learned note -->
  <rect x="56" y="744" width="988" height="74" rx="10" fill="#FFF8E1" stroke="#CCA700" stroke-width="2"/>
  <rect x="56" y="744" width="8" height="74" rx="4" fill="#CCA700"/>
  <text x="84" y="773" class="inter" font-size="15" font-weight="800" fill="#1E1E1E">If B loses, that is not failure—it is a Lessons Learned section with data in it.</text>
  <text x="84" y="799" class="inter" font-size="14" fill="#3D5266">Judges score a measured negative result higher than an unmeasured success claim. Every time.</text>
</svg>
