<svg viewBox="0 0 1100 850" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a5276"/>
      <stop offset="1" stop-color="#2e86ab"/>
    </linearGradient>
    <marker id="arr" markerWidth="12" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#4d5358"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1100" height="850" fill="#ffffff"/>
  <rect x="40" y="28" width="1020" height="58" rx="8" fill="url(#titleGrad)"/>
  <text x="60" y="66" fill="#ffffff" font-size="28" font-weight="bold">THE A/B PROTOCOL</text>
  <text x="1040" y="64" fill="#d6e9f2" font-size="15" text-anchor="end">Zumo 32U4 Robotics &#183; Lesson 16</text>
  <text x="60" y="112" fill="#4d5358" font-size="15">One switch. One ruler. Two rows. The only experiment that proves YOUR code caused the change.</text>

  <!-- THE SWITCH -->
  <rect x="380" y="145" width="340" height="80" rx="10" fill="#f4f9fc" stroke="#2e86ab" stroke-width="2"/>
  <text x="550" y="178" fill="#1a5276" font-size="17" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">const bool ENHANCEMENT_ON</text>
  <text x="550" y="205" fill="#4d5358" font-size="14" text-anchor="middle">the ONLY thing that differs between the two builds</text>

  <!-- split arrows -->
  <line x1="470" y1="225" x2="300" y2="285" stroke="#4d5358" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="630" y1="225" x2="800" y2="285" stroke="#4d5358" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- BUILD A -->
  <rect x="90" y="295" width="420" height="240" rx="10" fill="#f4f9fc" stroke="#2e86ab" stroke-width="2"/>
  <rect x="90" y="295" width="420" height="48" rx="10" fill="#2e86ab"/>
  <text x="300" y="327" fill="#ffffff" font-size="19" font-weight="bold" text-anchor="middle">A &#8212; the robot you INHERITED</text>
  <text x="300" y="378" fill="#1a5276" font-size="16" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">ENHANCEMENT_ON = false</text>
  <text x="300" y="412" fill="#4d5358" font-size="15" text-anchor="middle">Build &#8594; run the course &#215; 3</text>
  <text x="300" y="440" fill="#4d5358" font-size="15" text-anchor="middle">Must match your saved baseline &#8212;</text>
  <text x="300" y="463" fill="#4d5358" font-size="15" text-anchor="middle">if it does not, something ELSE changed. Stop. Find it.</text>
  <rect x="150" y="483" width="300" height="34" rx="6" fill="#ffffff" stroke="#2e86ab"/>
  <text x="300" y="506" fill="#1a5276" font-size="15" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">LAP 41.6s   MAE 173</text>

  <!-- BUILD B -->
  <rect x="590" y="295" width="420" height="240" rx="10" fill="#eef7f1" stroke="#3a7d5c" stroke-width="2"/>
  <rect x="590" y="295" width="420" height="48" rx="10" fill="#3a7d5c"/>
  <text x="800" y="327" fill="#ffffff" font-size="19" font-weight="bold" text-anchor="middle">B &#8212; the robot you BUILT</text>
  <text x="800" y="378" fill="#2a5a42" font-size="16" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">ENHANCEMENT_ON = true</text>
  <text x="800" y="412" fill="#4d5358" font-size="15" text-anchor="middle">Build &#8594; run the course &#215; 3</text>
  <text x="800" y="440" fill="#4d5358" font-size="15" text-anchor="middle">Same course. Same battery charge.</text>
  <text x="800" y="463" fill="#4d5358" font-size="15" text-anchor="middle">Same session. Same calibration. Same ruler.</text>
  <rect x="650" y="483" width="300" height="34" rx="6" fill="#ffffff" stroke="#3a7d5c"/>
  <text x="800" y="506" fill="#2a5a42" font-size="15" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">LAP 39.8s   MAE 158</text>

  <!-- converge arrows -->
  <line x1="300" y1="535" x2="480" y2="600" stroke="#4d5358" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="800" y1="535" x2="620" y2="600" stroke="#4d5358" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- THE VERDICT -->
  <rect x="330" y="610" width="440" height="105" rx="10" fill="#fcfcfc" stroke="#4d5358" stroke-width="2"/>
  <text x="550" y="644" fill="#1a5276" font-size="17" font-weight="bold" text-anchor="middle">THE DELTA ROW DOES THE ARGUING</text>
  <text x="550" y="676" fill="#3a7d5c" font-size="18" font-weight="bold" text-anchor="middle" font-family="Consolas, monospace">d-1.8s   d-15</text>
  <text x="550" y="700" fill="#4d5358" font-size="14" text-anchor="middle">negative is better in both columns: less time, less error</text>

  <rect x="60" y="740" width="980" height="72" rx="10" fill="#fdf3e7" stroke="#e67e22" stroke-width="2"/>
  <text x="550" y="770" fill="#9c5518" font-size="15" font-weight="bold" text-anchor="middle">If B loses, that is not failure &#8212; that is a Lessons Learned section with data in it.</text>
  <text x="550" y="796" fill="#4d5358" font-size="14" text-anchor="middle">Judges score a measured negative result higher than an unmeasured success claim. Every time.</text>
</svg>
