<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
  <title id="title">Compiler error: no such file or directory</title>
  <desc id="desc">Instructional figure reproducing the PlatformIO terminal when a quoted include names a header the compiler cannot find. Diagnostic text reproduced from GCC.</desc>
  <rect x="0" y="0" width="1100" height="500" fill="#FFFFFF"/>
  <rect x="40" y="24" width="1020" height="48" rx="6" fill="#0B1A2E"/>
  <rect x="40" y="72" width="1020" height="3" fill="#C9A463"/>
  <text x="60" y="55" fill="#FFFFFF" font-size="23" font-weight="700">ERROR 3 &#8212; NO SUCH FILE OR DIRECTORY</text>
  <text x="1040" y="54" fill="#D7E0EA" font-size="13" text-anchor="end">Zumo 32U4 Robotics &#183; Lesson 7</text>
  <rect x="52" y="96" width="996" height="306" rx="10" fill="#1E1E1E" stroke="#0F1720" stroke-width="2"/>
  <rect x="52" y="96" width="996" height="30" fill="#333333"/>
  <circle cx="74" cy="111" r="6" fill="#FF5F57"/>
  <circle cx="94" cy="111" r="6" fill="#FEBC2E"/>
  <circle cx="114" cy="111" r="6" fill="#28C840"/>
  <text x="550" y="116" fill="#CFCFCF" font-size="13" font-weight="400" text-anchor="middle">PROBLEMS &#183; OUTPUT &#183; TERMINAL</text>
  <rect x="52" y="376" width="996" height="26" fill="#007ACC"/>
  <text x="70" y="394" fill="#FFFFFF" font-size="12" font-weight="400" text-anchor="start">PlatformIO &#183; env:zumo32U4</text>
  <text x="72" y="160" fill="#858585" font-family="Courier New, monospace" font-size="14" font-weight="400" xml:space="preserve">> Executing task: pio run</text>
  <text x="72" y="190" fill="#D4D4D4" font-family="Courier New, monospace" font-size="14" font-weight="400" xml:space="preserve">Compiling .pio/build/zumo32U4/src/main.cpp.o</text>
  <text x="72" y="224" fill="#D4D4D4" font-family="Courier New, monospace" font-size="14" font-weight="400" xml:space="preserve">src/main.cpp:3:10: </text>
  <text x="242" y="224" fill="#f14c4c" font-family="Courier New, monospace" font-size="14" font-weight="700" xml:space="preserve">fatal error: RobotMotion.h: No such file or directory</text>
  <text x="72" y="252" fill="#D4D4D4" font-family="Courier New, monospace" font-size="14" font-weight="400" xml:space="preserve">    3 | #include "RobotMotion.h"</text>
  <text x="72" y="272" fill="#f14c4c" font-family="Courier New, monospace" font-size="14" font-weight="400" xml:space="preserve">      |          ^~~~~~~~~~~~~~~</text>
  <text x="72" y="306" fill="#f14c4c" font-family="Courier New, monospace" font-size="14" font-weight="400" xml:space="preserve">compilation terminated.</text>
  <text x="72" y="336" fill="#f14c4c" font-family="Courier New, monospace" font-size="14" font-weight="400" xml:space="preserve">*** [.pio/build/zumo32U4/src/main.cpp.o] Error 1</text>
  <rect x="52" y="422" width="996" height="54" rx="8" fill="#FBFBFC" stroke="#D8DDE2" stroke-width="2"/>
  <text x="72" y="455" fill="#2B3A4A" font-size="16" font-weight="400" text-anchor="start">The compiler never found the file. Check the spelling first, then that it is in include/ or src/ &#8212; PlatformIO searches both.</text>
</svg>
