<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850">
<rect width="1100" height="850" fill="#F5F2E9"/>
<rect x="0" y="0" width="1100" height="70" fill="#0B1A2E"/>
<text x="550" y="45" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="bold" fill="#FFFFFF" text-anchor="middle">GRAPHIC 11.1 — Time Lies, Distance Doesn't</text>

<text x="550" y="108" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#3D5266" text-anchor="middle">Same code. Same 10 cm gap. Same track. The ONLY difference is the battery.</text>

<!-- ============ TOP: THE STOPWATCH ============ -->
<rect x="45" y="135" width="1010" height="290" rx="10" fill="#FDECEA" stroke="#F44747" stroke-width="2"/>
<text x="70" y="168" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#B42318">THE STOPWATCH  —  "have I been blind for too LONG?"</text>
<text x="70" y="193" font-family="Courier New, monospace" font-size="14" fill="#7A231C">if (millis() - gapStartTime &gt; MAX_GAP_TIME)   // 500 ms</text>

<!-- fresh battery run -->
<text x="70" y="232" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0B1A2E">FRESH battery — 25 cm/s</text>
<rect x="300" y="216" width="500" height="26" fill="#fff" stroke="#AAB4BD"/>
<rect x="300" y="216" width="180" height="26" fill="#0B1A2E"/>
<rect x="480" y="216" width="140" height="26" fill="#fff" stroke="#AAB4BD" stroke-dasharray="4,3"/>
<rect x="620" y="216" width="180" height="26" fill="#0B1A2E"/>
<text x="550" y="234" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#66788A" text-anchor="middle">10 cm GAP</text>
<polygon points="800,229 838,229 838,222 856,232 838,242 838,235 800,235" fill="#2FAE66"/>
<text x="875" y="237" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#2FAE66">CROSSED</text>
<text x="300" y="262" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#3D5266">500 ms × 25 cm/s = 12.5 cm of travel — enough</text>

<!-- tired battery run -->
<text x="70" y="318" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0B1A2E">TIRED battery — 16 cm/s</text>
<rect x="300" y="302" width="500" height="26" fill="#fff" stroke="#AAB4BD"/>
<rect x="300" y="302" width="180" height="26" fill="#0B1A2E"/>
<rect x="480" y="302" width="140" height="26" fill="#fff" stroke="#AAB4BD" stroke-dasharray="4,3"/>
<rect x="620" y="302" width="180" height="26" fill="#0B1A2E"/>
<text x="550" y="320" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#66788A" text-anchor="middle">10 cm GAP</text>
<line x1="570" y1="292" x2="570" y2="338" stroke="#F44747" stroke-width="3"/>
<polygon points="570,344 563,332 577,332" fill="#F44747"/>
<text x="600" y="352" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#F44747">gives up HERE — still inside the gap</text>
<text x="300" y="380" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#3D5266">500 ms × 16 cm/s = 8 cm of travel — NOT ENOUGH</text>
<text x="70" y="408" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#B42318">The timer never changed. The DISTANCE it buys you did.</text>

<!-- ============ BOTTOM: THE ODOMETER ============ -->
<rect x="45" y="450" width="1010" height="290" rx="10" fill="#EEF7F1" stroke="#2FAE66" stroke-width="2"/>
<text x="70" y="483" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#2F7D55">THE ODOMETER  —  "have I been blind for too FAR?"</text>
<text x="70" y="508" font-family="Courier New, monospace" font-size="14" fill="#265F45">if (blindDistanceCm() &gt; GAP_MAX_CM)   // 12 cm</text>

<text x="70" y="547" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0B1A2E">FRESH battery — 25 cm/s</text>
<rect x="300" y="531" width="500" height="26" fill="#fff" stroke="#AAB4BD"/>
<rect x="300" y="531" width="180" height="26" fill="#0B1A2E"/>
<rect x="480" y="531" width="140" height="26" fill="#fff" stroke="#AAB4BD" stroke-dasharray="4,3"/>
<rect x="620" y="531" width="180" height="26" fill="#0B1A2E"/>
<text x="550" y="549" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#66788A" text-anchor="middle">10 cm GAP</text>
<polygon points="800,544 838,544 838,537 856,547 838,557 838,550 800,550" fill="#2FAE66"/>
<text x="875" y="552" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#2FAE66">CROSSED</text>

<text x="70" y="633" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0B1A2E">TIRED battery — 16 cm/s</text>
<rect x="300" y="617" width="500" height="26" fill="#fff" stroke="#AAB4BD"/>
<rect x="300" y="617" width="180" height="26" fill="#0B1A2E"/>
<rect x="480" y="617" width="140" height="26" fill="#fff" stroke="#AAB4BD" stroke-dasharray="4,3"/>
<rect x="620" y="617" width="180" height="26" fill="#0B1A2E"/>
<text x="550" y="635" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#66788A" text-anchor="middle">10 cm GAP</text>
<polygon points="800,630 838,630 838,623 856,633 838,643 838,636 800,636" fill="#2FAE66"/>
<text x="875" y="638" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#2FAE66">CROSSED</text>
<text x="300" y="668" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#3D5266">Slower — so it takes LONGER. It still travels the same 10 cm.</text>
<text x="70" y="700" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#2F7D55">Encoders count WHEEL ROTATION. Rotation doesn't care about your battery.</text>

<rect x="45" y="762" width="1010" height="58" rx="8" fill="#0B1A2E"/>
<text x="550" y="798" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" fill="#FFFFFF" text-anchor="middle">A stopwatch measures how long you drove. It cannot measure how FAR.</text>
</svg>
