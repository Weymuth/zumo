<svg viewBox="0 0 1000 920" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="1" y="1" width="998" height="918" rx="10" fill="#ffffff" stroke="#d5dde3" stroke-width="2"/>
  <defs><linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#1a5276"/><stop offset="1" stop-color="#2e86ab"/></linearGradient></defs>
  <rect x="1" y="1" width="998" height="56" rx="10" fill="url(#tg)"/>
  <text x="500" y="37" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">Motor Troubleshooting — One Question at a Time</text>
  <rect x="140" y="86" width="320" height="44" rx="22" fill="#4d5358"/>
  <text x="300" y="114" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">START: motors aren’t working right</text>
  <polygon points="296,130 304,130 304,154 311,154 300,168 289,154 296,154" fill="#3a7d5c"/>
  <rect x="140" y="170" width="320" height="76" rx="10" fill="#eaf3fa" stroke="#2e86ab" stroke-width="2.5"/><text x="300" y="201" font-size="16" font-weight="bold" fill="#1a5276" text-anchor="middle">Do the motors spin</text><text x="300" y="225" font-size="16" font-weight="bold" fill="#1a5276" text-anchor="middle">at all?</text>
  <rect x="140" y="330" width="320" height="76" rx="10" fill="#eaf3fa" stroke="#2e86ab" stroke-width="2.5"/><text x="300" y="361" font-size="16" font-weight="bold" fill="#1a5276" text-anchor="middle">Do BOTH motors</text><text x="300" y="385" font-size="16" font-weight="bold" fill="#1a5276" text-anchor="middle">spin?</text>
  <rect x="140" y="490" width="320" height="76" rx="10" fill="#eaf3fa" stroke="#2e86ab" stroke-width="2.5"/><text x="300" y="521" font-size="16" font-weight="bold" fill="#1a5276" text-anchor="middle">Do they STOP</text><text x="300" y="545" font-size="16" font-weight="bold" fill="#1a5276" text-anchor="middle">after the test?</text>
  <rect x="140" y="650" width="320" height="76" rx="10" fill="#eaf3fa" stroke="#2e86ab" stroke-width="2.5"/><text x="300" y="681" font-size="16" font-weight="bold" fill="#1a5276" text-anchor="middle">Does TRIM help</text><text x="300" y="705" font-size="16" font-weight="bold" fill="#1a5276" text-anchor="middle">straighten it?</text>
  <polygon points="296,246 304,246 304,314 311,314 300,328 289,314 296,314" fill="#3a7d5c"/>
  <text x="316" y="288" font-size="14" font-weight="bold" fill="#2a5a42">YES</text>
  <polygon points="296,406 304,406 304,474 311,474 300,488 289,474 296,474" fill="#3a7d5c"/>
  <text x="316" y="448" font-size="14" font-weight="bold" fill="#2a5a42">YES</text>
  <polygon points="296,566 304,566 304,634 311,634 300,648 289,634 296,634" fill="#3a7d5c"/>
  <text x="316" y="608" font-size="14" font-weight="bold" fill="#2a5a42">YES</text>
  <rect x="560" y="160" width="390" height="96" rx="10" fill="#fdf3f5" stroke="#c45d76" stroke-width="2"/><text x="580" y="188" font-size="13.5" fill="#333333">• Check the power switch (toward the motors)</text><text x="580" y="212" font-size="13.5" fill="#333333">• Check battery voltage — dead cells = dead motors</text><text x="580" y="236" font-size="13.5" fill="#333333">• Check the motors object was created (§6 Step 4)</text>
  <rect x="560" y="320" width="390" height="96" rx="10" fill="#fdf3f5" stroke="#c45d76" stroke-width="2"/><text x="580" y="348" font-size="13.5" fill="#333333">• One motor may be damaged</text><text x="580" y="372" font-size="13.5" fill="#333333">• Check wiring / connections</text><text x="580" y="396" font-size="13.5" fill="#333333">• Swap L/R values in code — does the problem swap?</text>
  <rect x="560" y="480" width="390" height="96" rx="10" fill="#fdf3f5" stroke="#c45d76" stroke-width="2"/><text x="580" y="508" font-size="13.5" fill="#333333">• Missing motors.setSpeeds(0, 0) at the end</text><text x="580" y="532" font-size="13.5" fill="#333333">• Check loop() isn’t restarting the test</text><text x="580" y="556" font-size="13.5" fill="#333333">• RUNAWAY? ⚡ KILL THE POWER SWITCH</text>
  <rect x="560" y="640" width="390" height="96" rx="10" fill="#fdf3f5" stroke="#c45d76" stroke-width="2"/><text x="580" y="668" font-size="13.5" fill="#333333">• TRIM too small? Try a bigger step</text><text x="580" y="692" font-size="13.5" fill="#333333">• Mechanical issue — debris in a track or gearbox</text><text x="580" y="716" font-size="13.5" fill="#333333">• Test on a different surface</text>
  <polygon points="460,204 538,204 538,197 552,208 538,219 538,212 460,212" fill="#c45d76"/>
  <text x="490" y="198" font-size="14" font-weight="bold" fill="#9a4459">NO</text>
  <polygon points="460,364 538,364 538,357 552,368 538,379 538,372 460,372" fill="#c45d76"/>
  <text x="490" y="358" font-size="14" font-weight="bold" fill="#9a4459">NO</text>
  <polygon points="460,524 538,524 538,517 552,528 538,539 538,532 460,532" fill="#c45d76"/>
  <text x="490" y="518" font-size="14" font-weight="bold" fill="#9a4459">NO</text>
  <polygon points="460,684 538,684 538,677 552,688 538,699 538,692 460,692" fill="#c45d76"/>
  <text x="490" y="678" font-size="14" font-weight="bold" fill="#9a4459">NO</text>
  <polygon points="296,726 304,726 304,792 311,792 300,806 289,792 296,792" fill="#3a7d5c"/>
  <text x="316" y="768" font-size="14" font-weight="bold" fill="#2a5a42">YES</text>
  <rect x="110" y="810" width="380" height="50" rx="25" fill="#3a7d5c"/>
  <text x="300" y="841" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">✅ Success — document your TRIM value!</text>
  <text x="500" y="898" font-size="12.5" fill="#6a7a86" text-anchor="middle">GRAPHIC 3.13 · Zumo 32U4 Robotics · Lesson 3</text>
</svg>