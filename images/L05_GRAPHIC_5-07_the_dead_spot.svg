<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850" role="img" aria-labelledby="title desc">
  <title id="title">The Dead Spot — Where Nothing Is Looking</title>
  <desc id="desc">A Zumo robot has three proximity detector cones with uncovered blind wedges between the front and side directions. A three-step sequence shows an object being seen by the left detector, disappearing in the blind gap during a turn, and then being detected by the front detector.</desc>

  <defs>
    <style>
      .inter { font-family: Inter, Arial, sans-serif; font-feature-settings: "cv05" 1; }
      .mono { font-family: "JetBrains Mono", "Courier New", monospace; font-variant-ligatures: none; }
      .title { font-size: 25px; font-weight: 700; letter-spacing: .2px; }
      .subtitle { font-size: 16px; font-weight: 400; }
      .section { font-size: 16px; font-weight: 700; letter-spacing: .8px; }
      .label { font-size: 15px; font-weight: 700; }
      .body { font-size: 13px; font-weight: 400; }
      .small { font-size: 12px; font-weight: 400; }
      .navy { fill: #0B1A2E; }
      .slate { fill: #3D5266; }
      .text { fill: #1E1E1E; }
      .muted { fill: #66717A; }
    </style>

    <pattern id="hatch" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#9D9D9D" stroke-width="3"/>
    </pattern>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0B1A2E" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Canvas and restrained brand layer -->
  <rect width="1100" height="850" fill="#F5F2E9"/>
  <rect x="0" y="0" width="1100" height="66" fill="#0B1A2E"/>
  <rect x="0" y="64" width="1100" height="3" fill="#C9A463"/>
  <text x="550" y="42" class="inter title" fill="#FFFFFF" text-anchor="middle">THE DEAD SPOT — WHERE NOTHING IS LOOKING</text>
  <text x="550" y="94" class="inter subtitle slate" text-anchor="middle">Three cones do not add up to a circle. Between “ahead” and “beside” there is a wedge no detector covers.</text>
  <line x1="54" y1="112" x2="1046" y2="112" stroke="#D4D4D4" stroke-width="1.5"/>

  <!-- ===== BLIND WEDGES (under the cones) ===== -->
  <polygon points="380,450 460,213 523,245 585,307 618,373" fill="url(#hatch)" opacity="0.55"/>
  <polygon points="340,450 260,213 197,245 135,307 102,373" fill="url(#hatch)" opacity="0.55"/>

  <!-- ===== DETECTION CONES ===== -->
  <!-- Front = syntax green; left = syntax orange; right = syntax blue -->
  <polygon points="360,447 258,147 462,147" fill="#6A9955" opacity="0.13"/>
  <polygon points="322,455 62,371 62,539" fill="#CE9178" opacity="0.14"/>
  <polygon points="398,455 658,371 658,539" fill="#569CD6" opacity="0.14"/>
  <g stroke-dasharray="7 6" stroke-width="2.3" fill="none" stroke-linecap="round">
    <path d="M360,447 L258,147" stroke="#6A9955"/><path d="M360,447 L462,147" stroke="#6A9955"/>
    <path d="M322,455 L62,371" stroke="#CE9178"/><path d="M322,455 L62,539" stroke="#CE9178"/>
    <path d="M398,455 L658,371" stroke="#569CD6"/><path d="M398,455 L658,539" stroke="#569CD6"/>
  </g>

  <!-- ===== ROBOT ===== -->
  <g filter="url(#subtleShadow)">
    <rect x="282" y="478" width="28" height="122" rx="4" fill="#252526" stroke="#0B1A2E" stroke-width="2"/>
    <rect x="410" y="478" width="28" height="122" rx="4" fill="#252526" stroke="#0B1A2E" stroke-width="2"/>
    <g stroke="#555C63" stroke-width="2">
      <line x1="286" y1="494" x2="306" y2="494"/><line x1="414" y1="494" x2="434" y2="494"/>
      <line x1="286" y1="520" x2="306" y2="520"/><line x1="414" y1="520" x2="434" y2="520"/>
      <line x1="286" y1="546" x2="306" y2="546"/><line x1="414" y1="546" x2="434" y2="546"/>
      <line x1="286" y1="572" x2="306" y2="572"/><line x1="414" y1="572" x2="434" y2="572"/>
    </g>
    <rect x="310" y="470" width="100" height="132" rx="8" fill="#F3F3F3" stroke="#0B1A2E" stroke-width="2"/>
    <polygon points="322,438 398,438 416,470 304,470" fill="#D4D8DC" stroke="#0B1A2E" stroke-width="2"/>
    <rect x="326" y="500" width="68" height="50" rx="5" fill="#252526" stroke="#3C3C3C" stroke-width="2"/>
    <rect x="335" y="509" width="50" height="31" rx="3" fill="#0E6C78"/>
    <text x="360" y="530" class="mono" font-size="11" font-weight="700" fill="#EAF8FA" text-anchor="middle">ZUMO</text>
  </g>
  <circle cx="322" cy="455" r="7" fill="#CE9178" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="360" cy="447" r="7" fill="#6A9955" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="398" cy="455" r="7" fill="#569CD6" stroke="#FFFFFF" stroke-width="2"/>

  <!-- ===== LABELS ===== -->
  <text x="360" y="178" class="inter label" fill="#47743F" text-anchor="middle">FRONT sees here</text>
  <text x="360" y="199" class="inter body" fill="#557C4C" text-anchor="middle">±19° of your nose</text>
  <text x="120" y="330" class="inter label" fill="#9E5A49">LEFT</text>
  <text x="120" y="351" class="inter body" fill="#9E5A49">out the flank</text>
  <text x="600" y="330" class="inter label" fill="#3976A6" text-anchor="end">RIGHT</text>
  <text x="600" y="351" class="inter body" fill="#3976A6" text-anchor="end">out the flank</text>

  <g>
    <rect x="457" y="269" width="80" height="30" rx="15" fill="#F3F3F3" stroke="#D4D4D4"/>
    <text x="497" y="290" class="inter label muted" text-anchor="middle" transform="rotate(45 497 284)">BLIND</text>
    <rect x="183" y="269" width="80" height="30" rx="15" fill="#F3F3F3" stroke="#D4D4D4"/>
    <text x="223" y="290" class="inter label muted" text-anchor="middle" transform="rotate(-45 223 284)">BLIND</text>
  </g>

  <rect x="119" y="620" width="482" height="42" rx="8" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1.5"/>
  <text x="360" y="646" class="inter body slate" font-weight="600" text-anchor="middle">Two blind wedges, roughly 19° to 72° off each side of the nose.</text>

  <!-- ===== SEE / TURN / LOSE SEQUENCE ===== -->
  <text x="880" y="136" class="inter section navy" text-anchor="middle">SEE IT → TURN → LOSE IT</text>

  <!-- Step 1 -->
  <g filter="url(#subtleShadow)">
    <rect x="700" y="150" width="360" height="132" rx="9" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1.5"/>
    <rect x="700" y="150" width="7" height="132" rx="3.5" fill="#CE9178"/>
  </g>
  <circle cx="728" cy="176" r="15" fill="#CE9178"/>
  <text x="728" y="181" class="inter label" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="752" y="181" class="inter label text">Something is beside you.</text>
  <circle cx="760" cy="224" r="16" fill="#F3F3F3" stroke="#0B1A2E" stroke-width="2"/>
  <polygon points="753,210 767,210 760,198" fill="#D4D8DC" stroke="#0B1A2E" stroke-width="2"/>
  <rect x="860" y="210" width="30" height="30" rx="3" fill="#F7E7E2" stroke="#CE9178" stroke-width="2"/>
  <path d="M782,222 L850,222" stroke="#CE9178" stroke-width="2.5" stroke-dasharray="6 5"/>
  <text x="930" y="219" class="mono" font-size="15" font-weight="700" fill="#9E5A49">L: 3</text>
  <text x="930" y="240" class="inter small" fill="#9E5A49">LEFT has it</text>

  <!-- Step 2 -->
  <g filter="url(#subtleShadow)">
    <rect x="700" y="294" width="360" height="132" rx="9" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1.5"/>
    <rect x="700" y="294" width="7" height="132" rx="3.5" fill="#9D9D9D"/>
  </g>
  <circle cx="728" cy="320" r="15" fill="#66717A"/>
  <text x="728" y="325" class="inter label" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="752" y="325" class="inter label text">You turn to face it.</text>
  <circle cx="760" cy="368" r="16" fill="#F3F3F3" stroke="#0B1A2E" stroke-width="2"/>
  <polygon points="748,359 758,349 767,363" fill="#D4D8DC" stroke="#0B1A2E" stroke-width="2"/>
  <rect x="860" y="354" width="30" height="30" rx="3" fill="#F3F3F3" stroke="#9D9D9D" stroke-width="2"/>
  <polygon points="782,368 846,342 846,394" fill="url(#hatch)" opacity="0.62"/>
  <text x="930" y="363" class="mono" font-size="15" font-weight="700" fill="#66717A">0 0 0</text>
  <text x="930" y="384" class="inter small muted">nothing sees it</text>

  <!-- Step 3 -->
  <g filter="url(#subtleShadow)">
    <rect x="700" y="438" width="360" height="132" rx="9" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1.5"/>
    <rect x="700" y="438" width="7" height="132" rx="3.5" fill="#6A9955"/>
  </g>
  <circle cx="728" cy="464" r="15" fill="#6A9955"/>
  <text x="728" y="469" class="inter label" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="752" y="469" class="inter label text">Keep turning — FRONT picks it up.</text>
  <circle cx="760" cy="512" r="16" fill="#F3F3F3" stroke="#0B1A2E" stroke-width="2"/>
  <polygon points="774,505 774,519 786,512" fill="#D4D8DC" stroke="#0B1A2E" stroke-width="2"/>
  <rect x="860" y="498" width="30" height="30" rx="3" fill="#E8F0E5" stroke="#6A9955" stroke-width="2"/>
  <path d="M790,512 L852,512" stroke="#6A9955" stroke-width="2.5" stroke-dasharray="6 5"/>
  <text x="930" y="507" class="mono" font-size="15" font-weight="700" fill="#47743F">F: 5</text>
  <text x="930" y="528" class="inter small" fill="#47743F">FRONT has it</text>

  <rect x="742" y="588" width="276" height="38" rx="8" fill="#F3F3F3" stroke="#D4D4D4"/>
  <text x="880" y="612" class="inter body slate" font-weight="600" text-anchor="middle">Step 2 is not a broken sensor. It is the gap.</text>

  <!-- ===== WARNING / TAKEAWAY ===== -->
  <rect x="60" y="688" width="980" height="116" rx="10" fill="#FFFFFF" stroke="#CCA700" stroke-width="2"/>
  <rect x="60" y="688" width="8" height="116" rx="4" fill="#CCA700"/>
  <path d="M91 711 L103 733 H79 Z" fill="#CCA700"/>
  <text x="91" y="729" class="inter" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">!</text>
  <text x="116" y="719" class="inter" font-size="17" font-weight="700" fill="#6A5700">DON’T DEBUG THE GAP</text>
  <text x="86" y="752" class="inter" font-size="15" fill="#1E1E1E">If a reading drops to 0 <tspan font-style="italic">while you are turning toward the thing you just detected</tspan>, the sensor is fine. Nothing is aimed there.</text>
  <text x="86" y="782" class="inter" font-size="15" font-weight="700" fill="#6A5700">Design for it: remember what you saw, and keep turning. Lesson 10 leans on exactly this.</text>
</svg>
