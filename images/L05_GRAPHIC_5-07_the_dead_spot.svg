<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850">
<defs>
<linearGradient id="tb" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#1a5276"/><stop offset="1" stop-color="#2e86ab"/>
</linearGradient>
<pattern id="hatch" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
<line x1="0" y1="0" x2="0" y2="10" stroke="#9aa5ad" stroke-width="3"/>
</pattern>
</defs>
<rect width="1100" height="850" fill="#ffffff"/>
<rect x="0" y="0" width="1100" height="64" fill="url(#tb)"/>
<text x="550" y="41" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">THE DEAD SPOT &#8212; WHERE NOTHING IS LOOKING</text>
<text x="550" y="92" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#555" text-anchor="middle">Three cones do not add up to a circle. Between &#8220;ahead&#8221; and &#8220;beside&#8221; there is a wedge no detector covers.</text>

<!-- ===== BLIND WEDGES (drawn under the cones) ===== -->
<polygon points="380,450 460,213 523,245 585,307 618,373" fill="url(#hatch)" opacity="0.55"/>
<polygon points="340,450 260,213 197,245 135,307 102,373" fill="url(#hatch)" opacity="0.55"/>

<!-- ===== CONES ===== -->
<polygon points="360,447 258,147 462,147" fill="#2a5a42" opacity="0.15"/>
<polygon points="322,455 62,371 62,539" fill="#c45d76" opacity="0.15"/>
<polygon points="398,455 658,371 658,539" fill="#2e86ab" opacity="0.15"/>
<g stroke-dasharray="7 6" stroke-width="2" fill="none">
<path d="M360,447 L258,147" stroke="#2a5a42"/><path d="M360,447 L462,147" stroke="#2a5a42"/>
<path d="M322,455 L62,371" stroke="#c45d76"/><path d="M322,455 L62,539" stroke="#c45d76"/>
<path d="M398,455 L658,371" stroke="#2e86ab"/><path d="M398,455 L658,539" stroke="#2e86ab"/>
</g>

<!-- ===== ROBOT ===== -->
<rect x="282" y="478" width="28" height="122" fill="#4d5358" stroke="#2c3e50" stroke-width="2"/>
<rect x="410" y="478" width="28" height="122" fill="#4d5358" stroke="#2c3e50" stroke-width="2"/>
<rect x="310" y="470" width="100" height="132" rx="6" fill="#e8ecef" stroke="#2c3e50" stroke-width="2"/>
<polygon points="322,438 398,438 416,470 304,470" fill="#cfd6dc" stroke="#2c3e50" stroke-width="2"/>
<circle cx="322" cy="455" r="7" fill="#8e3a4f"/>
<circle cx="360" cy="447" r="7" fill="#1e4633"/>
<circle cx="398" cy="455" r="7" fill="#1a5276"/>
<text x="360" y="545" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="bold" fill="#4d5358" text-anchor="middle">ZUMO</text>

<!-- ===== LABELS ===== -->
<text x="360" y="180" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#1e4633" text-anchor="middle">FRONT sees here</text>
<text x="360" y="200" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#2a5a42" text-anchor="middle">&#177;19&#176; of your nose</text>
<text x="120" y="330" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#8e3a4f">LEFT</text>
<text x="120" y="350" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#c45d76">out the flank</text>
<text x="600" y="330" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#1a5276" text-anchor="end">RIGHT</text>
<text x="600" y="350" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#2e86ab" text-anchor="end">out the flank</text>
<text x="497" y="292" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" fill="#5b666e" text-anchor="middle" transform="rotate(45 497 292)">BLIND</text>
<text x="223" y="292" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" fill="#5b666e" text-anchor="middle" transform="rotate(-45 223 292)">BLIND</text>
<text x="360" y="640" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#5b666e" text-anchor="middle">Two blind wedges, roughly 19&#176; to 72&#176; off each side of the nose.</text>

<!-- ===== THE SEQUENCE ===== -->
<text x="880" y="130" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold" fill="#34495e" text-anchor="middle">SEE IT &#8594; TURN &#8594; LOSE IT</text>

<rect x="700" y="148" width="360" height="132" rx="8" fill="#fdf1f4" stroke="#c45d76" stroke-width="2"/>
<text x="718" y="174" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#8e3a4f">1. Something is beside you.</text>
<circle cx="760" cy="222" r="16" fill="#e8ecef" stroke="#2c3e50" stroke-width="2"/>
<polygon points="753,208 767,208 760,196" fill="#cfd6dc" stroke="#2c3e50" stroke-width="2"/>
<rect x="860" y="208" width="30" height="30" rx="3" fill="#f2d7de" stroke="#8e3a4f" stroke-width="2"/>
<path d="M782,220 L850,220" stroke="#c45d76" stroke-width="2" stroke-dasharray="6 5"/>
<text x="930" y="217" font-family="Courier New,monospace" font-size="15" font-weight="bold" fill="#8e3a4f">L: 3</text>
<text x="930" y="238" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#8e3a4f">LEFT has it</text>

<rect x="700" y="292" width="360" height="132" rx="8" fill="#f4f5f6" stroke="#9aa5ad" stroke-width="2"/>
<text x="718" y="318" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#5b666e">2. You turn to face it.</text>
<circle cx="760" cy="366" r="16" fill="#e8ecef" stroke="#2c3e50" stroke-width="2"/>
<polygon points="748,357 758,347 767,361" fill="#cfd6dc" stroke="#2c3e50" stroke-width="2"/>
<rect x="860" y="352" width="30" height="30" rx="3" fill="#e9ecee" stroke="#9aa5ad" stroke-width="2"/>
<polygon points="782,366 846,340 846,392" fill="url(#hatch)" opacity="0.55"/>
<text x="930" y="361" font-family="Courier New,monospace" font-size="15" font-weight="bold" fill="#5b666e">0 0 0</text>
<text x="930" y="382" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#5b666e">nothing sees it</text>

<rect x="700" y="436" width="360" height="132" rx="8" fill="#eef6f1" stroke="#2a5a42" stroke-width="2"/>
<text x="718" y="462" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="bold" fill="#1e4633">3. Keep turning &#8212; FRONT picks it up.</text>
<circle cx="760" cy="510" r="16" fill="#e8ecef" stroke="#2c3e50" stroke-width="2"/>
<polygon points="774,503 774,517 786,510" fill="#cfd6dc" stroke="#2c3e50" stroke-width="2"/>
<rect x="860" y="496" width="30" height="30" rx="3" fill="#dbeee3" stroke="#1e4633" stroke-width="2"/>
<path d="M790,510 L852,510" stroke="#2a5a42" stroke-width="2" stroke-dasharray="6 5"/>
<text x="930" y="505" font-family="Courier New,monospace" font-size="15" font-weight="bold" fill="#1e4633">F: 5</text>
<text x="930" y="526" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#1e4633">FRONT has it</text>

<text x="880" y="600" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#666" text-anchor="middle">Step 2 is not a broken sensor. It is the gap.</text>

<!-- ===== BOTTOM BOX ===== -->
<rect x="60" y="676" width="980" height="122" rx="10" fill="#fdf6e8" stroke="#b7950b" stroke-width="2"/>
<text x="86" y="708" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="bold" fill="#7d6608">&#9888; DON&#8217;T DEBUG THE GAP</text>
<text x="86" y="738" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#333">If a reading drops to 0 <tspan font-style="italic">while you are turning toward the thing you just detected</tspan>, the sensor is fine. Nothing is aimed there.</text>
<text x="86" y="766" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="bold" fill="#7d6608">Design for it: remember what you saw, and keep turning. Lesson 10 leans on exactly this.</text>
</svg>
