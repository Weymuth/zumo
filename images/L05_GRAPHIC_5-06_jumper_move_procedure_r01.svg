<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850">
<defs>
</defs>
<rect width="1100" height="850" fill="#F5F2E9"/>
<rect x="0" y="0" width="1100" height="64" fill="#0B1A2E"/>
<text x="550" y="41" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" fill="#FFFFFF" text-anchor="middle">THE LAST JUMPER MOVE — LFT/RGT → DN2/DN4</text>
<text x="550" y="94" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#3D5266" text-anchor="middle">A jumper only ever goes straight UP off two pins, and straight DOWN onto two pins. Never twist.</text>

<!-- === THE THREE-PIN GROUP, ENLARGED === -->
<rect x="60" y="120" width="470" height="330" rx="10" fill="#F3F3F3" stroke="#3D5266" stroke-width="2"/>
<text x="295" y="150" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#3D5266" text-anchor="middle">WHAT ONE JUMPER LOOKS LIKE</text>
<text x="295" y="173" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#3D5266" text-anchor="middle">Three pins in a row. The block bridges TWO of them.</text>

<!-- pin header -->
<rect x="150" y="250" width="290" height="60" rx="4" fill="#0B1A2E"/>
<!-- 3 pins -->
<rect x="182" y="205" width="18" height="52" rx="3" fill="#CCA700"/>
<rect x="286" y="205" width="18" height="52" rx="3" fill="#CCA700"/>
<rect x="390" y="205" width="18" height="52" rx="3" fill="#CCA700"/>
<text x="191" y="336" font-family="Courier New, monospace" font-size="15" font-weight="bold" fill="#CE9178" text-anchor="middle" textLength="30">LFT</text>
<text x="295" y="336" font-family="Courier New, monospace" font-size="15" font-weight="bold" fill="#3D5266" text-anchor="middle" textLength="52">SIGNAL</text>
<text x="399" y="336" font-family="Courier New, monospace" font-size="15" font-weight="bold" fill="#315D38" text-anchor="middle" textLength="30">DN2</text>
<text x="295" y="360" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#3D5266" text-anchor="middle">(the middle pin is always the wire to the chip)</text>

<!-- jumper block currently on LFT+SIGNAL -->
<rect x="173" y="194" width="140" height="46" rx="5" fill="#CE9178" stroke="#7B6240" stroke-width="2" opacity="0.92"/>
<text x="243" y="222" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">JUMPER</text>
<text x="295" y="400" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#7B6240" text-anchor="middle">NOW: bridging LFT + SIGNAL → pin 20 is a prox receiver</text>
<text x="295" y="426" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#315D38" text-anchor="middle">GOAL: bridge SIGNAL + DN2 → pin 20 becomes line sensor 2</text>

<!-- === STEPS === -->
<rect x="560" y="120" width="480" height="330" rx="10" fill="#EDF4EA" stroke="#315D38" stroke-width="2"/>
<text x="800" y="150" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#315D38" text-anchor="middle">THE PROCEDURE — BOTH JUMPERS</text>

<circle cx="596" cy="185" r="15" fill="#CE9178"/><text x="596" y="191" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="622" y="184" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#7B6240">POWER OFF. Unplug USB.</text>
<text x="622" y="204" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#3D5266">Never move a jumper on a live board.</text>

<circle cx="596" cy="238" r="15" fill="#3D5266"/><text x="596" y="244" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="622" y="237" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0B1A2E">Work OVER THE TABLE.</text>
<text x="622" y="257" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#3D5266">A dropped jumper is a lost jumper.</text>

<circle cx="596" cy="291" r="15" fill="#3D5266"/><text x="596" y="297" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="622" y="290" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0B1A2E">Lift STRAIGHT UP. No twisting.</text>
<text x="622" y="310" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#3D5266">Tweezers or a careful fingernail. Pins bend.</text>

<circle cx="596" cy="344" r="15" fill="#3D5266"/><text x="596" y="350" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="622" y="343" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0B1A2E">Press STRAIGHT DOWN on SIGNAL + DN.</text>
<text x="622" y="363" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#3D5266">Gentle, even force. It should sit level.</text>

<circle cx="596" cy="397" r="15" fill="#315D38"/><text x="596" y="403" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="622" y="396" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#315D38">Repeat for the second jumper → DN4.</text>
<text x="622" y="416" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#3D5266">Both blocks fully seated, both sitting level.</text>

<!-- === BEFORE / AFTER STRIP === -->
<rect x="60" y="480" width="470" height="200" rx="10" fill="#FFF8E1" stroke="#CCA700" stroke-width="2"/>
<rect x="60" y="480" width="470" height="38" rx="10" fill="#CCA700"/><rect x="60" y="506" width="470" height="12" fill="#CCA700"/>
<text x="295" y="507" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">BEFORE — factory</text>
<rect x="120" y="560" width="18" height="46" rx="3" fill="#CCA700"/>
<rect x="206" y="560" width="18" height="46" rx="3" fill="#CCA700"/>
<rect x="292" y="560" width="18" height="46" rx="3" fill="#CCA700"/>
<rect x="112" y="552" width="120" height="38" rx="4" fill="#CE9178" stroke="#7B6240" stroke-width="2" opacity="0.92"/>
<text x="129" y="630" font-family="Courier New, monospace" font-size="13" font-weight="bold" fill="#7B6240" text-anchor="middle" textLength="30">LFT</text>
<text x="215" y="630" font-family="Courier New, monospace" font-size="12" fill="#3D5266" text-anchor="middle" textLength="42">SIGNAL</text>
<text x="301" y="630" font-family="Courier New, monospace" font-size="13" fill="#9D9D9D" text-anchor="middle" textLength="30">DN2</text>
<text x="420" y="588" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#7B6240" text-anchor="middle">3 line</text>
<text x="420" y="608" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#7B6240" text-anchor="middle">3 prox</text>
<text x="295" y="662" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#7B6240" text-anchor="middle">Lessons 1–5</text>

<polygon points="548,564 578,564 578,548 606,580 578,612 578,596 548,596" fill="#3D5266"/>

<rect x="618" y="480" width="422" height="200" rx="10" fill="#EDF4EA" stroke="#315D38" stroke-width="2"/>
<rect x="618" y="480" width="422" height="38" rx="10" fill="#315D38"/><rect x="618" y="506" width="422" height="12" fill="#315D38"/>
<text x="829" y="507" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">AFTER — five-down, permanent</text>
<rect x="672" y="560" width="18" height="46" rx="3" fill="#CCA700"/>
<rect x="758" y="560" width="18" height="46" rx="3" fill="#CCA700"/>
<rect x="844" y="560" width="18" height="46" rx="3" fill="#CCA700"/>
<rect x="750" y="552" width="120" height="38" rx="4" fill="#315D38" stroke="#315D38" stroke-width="2" opacity="0.92"/>
<text x="681" y="630" font-family="Courier New, monospace" font-size="13" fill="#9D9D9D" text-anchor="middle" textLength="30">LFT</text>
<text x="767" y="630" font-family="Courier New, monospace" font-size="12" fill="#3D5266" text-anchor="middle" textLength="42">SIGNAL</text>
<text x="853" y="630" font-family="Courier New, monospace" font-size="13" font-weight="bold" fill="#315D38" text-anchor="middle" textLength="30">DN2</text>
<text x="962" y="588" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#315D38" text-anchor="middle">5 line</text>
<text x="962" y="608" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#315D38" text-anchor="middle">1 prox</text>
<text x="829" y="662" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#315D38" text-anchor="middle">Lessons 6–15 · does not move again</text>

<!-- === VERIFY === -->
<rect x="60" y="706" width="980" height="112" rx="10" fill="#EDF4EA" stroke="#315D38" stroke-width="2"/>
<text x="86" y="736" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#315D38">✅ VERIFY IN SOFTWARE — never trust a hardware change without a test</text>
<text x="86" y="764" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1E1E1E">Flash <tspan font-family="Courier New, monospace" font-weight="bold" fill="#0B1A2E">JUMPER CHECK</tspan>, set the robot on the tape, press A, and slide the tape across the row.</text>
<text x="86" y="792" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#315D38">ALL FIVE numbers must respond. If 2 and 4 sit dead — a jumper is not seated. Power off and reseat it.</text>
</svg>
