<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850">
<defs>
<linearGradient id="tb" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#1a5276"/><stop offset="1" stop-color="#2e86ab"/>
</linearGradient>
</defs>
<rect width="1100" height="850" fill="#ffffff"/>
<rect x="0" y="0" width="1100" height="64" fill="url(#tb)"/>
<text x="550" y="41" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="bold" fill="#ffffff" text-anchor="middle">How a Run Is Actually Scored</text>
<text x="550" y="94" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#555" text-anchor="middle">RoboCupJunior Rescue Line 2026, section 5.6. The victims are not points.</text>
<rect x="90" y="140" width="400" height="250" fill="#eaf2f8" stroke="#2e86ab" stroke-width="2" rx="8"/>
<text x="110" y="170" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#1a5276" text-anchor="start" font-weight="bold">LINE TRACING SCORE</text>
<text x="110" y="200" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333" text-anchor="start">Tile (1st attempt)</text>
<text x="470" y="200" font-family="Courier New,monospace" font-size="14" fill="#1a5276" text-anchor="end" font-weight="bold">5</text>
<text x="110" y="223" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333" text-anchor="start">&#8230; 2nd / 3rd / beyond</text>
<text x="470" y="223" font-family="Courier New,monospace" font-size="14" fill="#1a5276" text-anchor="end" font-weight="bold">3 / 1 / 0</text>
<text x="110" y="246" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333" text-anchor="start">Gap tile</text>
<text x="470" y="246" font-family="Courier New,monospace" font-size="14" fill="#1a5276" text-anchor="end" font-weight="bold">10</text>
<text x="110" y="269" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333" text-anchor="start">Speed-bump tile</text>
<text x="470" y="269" font-family="Courier New,monospace" font-size="14" fill="#1a5276" text-anchor="end" font-weight="bold">10</text>
<text x="110" y="292" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333" text-anchor="start">Intersection / dead end</text>
<text x="470" y="292" font-family="Courier New,monospace" font-size="14" fill="#1a5276" text-anchor="end" font-weight="bold">10</text>
<text x="110" y="315" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333" text-anchor="start">Ramp tile</text>
<text x="470" y="315" font-family="Courier New,monospace" font-size="14" fill="#1a5276" text-anchor="end" font-weight="bold">10</text>
<text x="110" y="338" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333" text-anchor="start">Obstacle</text>
<text x="470" y="338" font-family="Courier New,monospace" font-size="14" fill="#1a5276" text-anchor="end" font-weight="bold">20</text>
<text x="110" y="361" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333" text-anchor="start">Seesaw</text>
<text x="470" y="361" font-family="Courier New,monospace" font-size="14" fill="#1a5276" text-anchor="end" font-weight="bold">20</text>
<text x="290" y="415" font-family="Arial,Helvetica,sans-serif" font-size="34" fill="#555" text-anchor="middle" font-weight="bold">+</text>
<rect x="90" y="440" width="400" height="108" fill="#eaf2f8" stroke="#2e86ab" stroke-width="2" rx="8"/>
<text x="110" y="470" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#1a5276" text-anchor="start" font-weight="bold">EXIT BONUS</text>
<text x="110" y="500" font-family="Courier New,monospace" font-size="16" fill="#333" text-anchor="start">60 &#8722; 5 &#215; (total lack of progress)</text>
<text x="110" y="528" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#666" text-anchor="start" font-style="italic">Reach the goal tile. Stop for 5 seconds.</text>
<polygon points="500,340.5 596,340.5 596,331 610,344 596,357 596,347.5 500,347.5" fill="#555"/>
<rect x="620" y="140" width="390" height="408" fill="#fef5e7" stroke="#b9770e" stroke-width="2" rx="8"/>
<text x="640" y="170" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#7e5109" text-anchor="start" font-weight="bold">EVACUATION ZONE MULTIPLIER</text>
<text x="640" y="200" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#7e5109" text-anchor="start" font-style="italic">Not points. A multiplier on everything.</text>
<text x="640" y="240" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333" text-anchor="start">Living victim rescued</text>
<text x="990" y="240" font-family="Courier New,monospace" font-size="15" fill="#7e5109" text-anchor="end" font-weight="bold">&#215; 1.4</text>
<text x="640" y="270" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333" text-anchor="start">Second living victim</text>
<text x="990" y="270" font-family="Courier New,monospace" font-size="15" fill="#7e5109" text-anchor="end" font-weight="bold">&#215; 1.4</text>
<text x="640" y="300" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333" text-anchor="start">Dead victim &#8212; only after both</text>
<text x="990" y="300" font-family="Courier New,monospace" font-size="15" fill="#7e5109" text-anchor="end" font-weight="bold">&#215; 1.4</text>
<text x="640" y="330" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#333" text-anchor="start">Each LoP in the zone</text>
<text x="990" y="330" font-family="Courier New,monospace" font-size="15" fill="#7e5109" text-anchor="end" font-weight="bold">&#8722; 0.05</text>
<line x1="640" y1="352" x2="990" y2="352" stroke="#d5b06a" stroke-width="1"/>
<text x="640" y="382" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#7e5109" text-anchor="start" font-weight="bold">All three, cleanly:</text>
<text x="990" y="382" font-family="Courier New,monospace" font-size="22" fill="#b9770e" text-anchor="end" font-weight="bold">&#215; 2.74</text>
<text x="640" y="410" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#7e5109" text-anchor="start" font-style="italic">A rescue is worth more than the whole course.</text>
<rect x="90" y="590" width="920" height="88" fill="#1a5276" stroke="none" stroke-width="0" rx="8"/>
<text x="550" y="628" font-family="Courier New,monospace" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">FIELD SCORE  =  ( LINE TRACING SCORE  +  EXIT BONUS )  &#215;  EVACUATION MULTIPLIER</text>
<text x="550" y="658" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#d4e6f1" text-anchor="middle" font-style="italic">The multiplier applies to everything you earned all the way round the course.</text>
<rect x="90" y="700" width="920" height="96" fill="#fdecea" stroke="#c0392b" stroke-width="2" rx="8"/>
<text x="115" y="730" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#7b241c" text-anchor="start" font-weight="bold">What this Zumo can do:</text>
<text x="115" y="756" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#7b241c" text-anchor="start">It can FIND a silver victim (Lesson 13). It cannot MOVE one into the evacuation point &#8212; that needs a gripper,</text>
<text x="115" y="778" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#7b241c" text-anchor="start">and both motor drivers are spoken for, one per tread. The multiplier is out of reach. Know that before you compete.</text>
</svg>
