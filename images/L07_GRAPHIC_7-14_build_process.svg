<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="titleBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a5276"/>
      <stop offset="100%" stop-color="#2e86ab"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef2f5"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1100" height="850" fill="#ffffff"/>
  <rect x="0" y="0" width="1100" height="72" fill="url(#titleBand)"/>
  <text x="34" y="46" font-size="27" font-weight="bold" fill="#ffffff">GRAPHIC 7.14 &#8212; What &#8220;Build&#8221; Actually Does</text>
  <text x="1066" y="46" font-size="17" fill="#d6e9f2" text-anchor="end">Lesson 7 &#183; compile &#8594; link</text>

  <rect x="40" y="100" width="1020" height="392" rx="10" fill="url(#panelGrad)" stroke="#c8d2da" stroke-width="2"/>
  <text x="60" y="132" font-size="16" font-weight="bold" fill="#2a5a42">Two stages, not one. They fail differently &#8212; and that is how you debug them.</text>

  <rect x="64" y="164" width="480" height="228" rx="8" fill="#eaf4fb" stroke="#3498db" stroke-width="3"/>
  <text x="304" y="194" font-size="16" font-weight="bold" fill="#1a5276" text-anchor="middle">STAGE 1 &#8212; COMPILE</text>
  <text x="304" y="216" font-size="12" fill="#3a5a75" text-anchor="middle">each .cpp on its own, in its own little world</text>

  <rect x="88" y="234" width="118" height="52" rx="4" fill="#ffffff" stroke="#3498db" stroke-width="2"/>
  <text x="147" y="256" font-size="12" font-weight="bold" fill="#1a5276" text-anchor="middle">main.cpp</text>
  <text x="147" y="274" font-size="11" fill="#7a8a96" text-anchor="middle">+ its headers</text>
  <rect x="88" y="298" width="118" height="52" rx="4" fill="#ffffff" stroke="#3498db" stroke-width="2"/>
  <text x="147" y="320" font-size="12" font-weight="bold" fill="#1a5276" text-anchor="middle">RobotMotion.cpp</text>
  <text x="147" y="338" font-size="11" fill="#7a8a96" text-anchor="middle">+ its headers</text>

  <polygon points="216,264 250,264 250,256 268,270 250,284 250,276 216,276" fill="#3498db" stroke="#21618c" stroke-width="1"/>
  <polygon points="216,328 250,328 250,320 268,334 250,348 250,340 216,340" fill="#3498db" stroke="#21618c" stroke-width="1"/>

  <rect x="276" y="234" width="118" height="52" rx="4" fill="#d6e9f2" stroke="#21618c" stroke-width="2"/>
  <text x="335" y="264" font-size="12" font-weight="bold" fill="#1a5276" text-anchor="middle">main.o</text>
  <rect x="276" y="298" width="118" height="52" rx="4" fill="#d6e9f2" stroke="#21618c" stroke-width="2"/>
  <text x="335" y="328" font-size="12" font-weight="bold" fill="#1a5276" text-anchor="middle">RobotMotion.o</text>

  <text x="470" y="258" font-size="13" font-weight="bold" fill="#1a5276" text-anchor="middle">object</text>
  <text x="470" y="276" font-size="13" font-weight="bold" fill="#1a5276" text-anchor="middle">files</text>
  <text x="470" y="316" font-size="11" fill="#7a8a96" text-anchor="middle">machine code,</text>
  <text x="470" y="332" font-size="11" fill="#7a8a96" text-anchor="middle">with holes in it</text>

  <rect x="88" y="360" width="440" height="22" rx="3" fill="#fdecea"/>
  <text x="308" y="376" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">breaks here = a SYNTAX or DECLARATION error, named in ONE file</text>

  <polygon points="552,258 588,258 588,244 616,270 588,296 588,282 552,282" fill="#2a5a42" stroke="#1d3f2e" stroke-width="2"/>

  <rect x="626" y="164" width="410" height="228" rx="8" fill="#f4f9f6" stroke="#3a7d5c" stroke-width="3"/>
  <text x="831" y="194" font-size="16" font-weight="bold" fill="#2a5a42" text-anchor="middle">STAGE 2 &#8212; LINK</text>
  <text x="831" y="216" font-size="12" fill="#4a6b58" text-anchor="middle">now all the files finally meet each other</text>

  <rect x="656" y="238" width="150" height="46" rx="4" fill="#d6e9f2" stroke="#21618c" stroke-width="2"/>
  <text x="731" y="266" font-size="12" font-weight="bold" fill="#1a5276" text-anchor="middle">all the .o files</text>
  <polygon points="816,254 844,254 844,246 862,260 844,274 844,266 816,266" fill="#2a5a42" stroke="#1d3f2e" stroke-width="1"/>
  <rect x="870" y="230" width="146" height="62" rx="4" fill="#2a5a42" stroke="#1d3f2e" stroke-width="2"/>
  <text x="943" y="256" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">firmware.elf</text>
  <text x="943" y="276" font-size="11" fill="#c9e0d3" text-anchor="middle">this is what uploads</text>

  <text x="656" y="318" font-size="13" fill="#1c3b2a">The linker fills the holes: every call in</text>
  <text x="656" y="338" font-size="13" fill="#1c3b2a">main.o gets matched to a body in some .o.</text>

  <rect x="656" y="352" width="360" height="30" rx="3" fill="#fdf3e3"/>
  <text x="836" y="372" font-size="12" font-weight="bold" fill="#b85c1e" text-anchor="middle">breaks here = &#8220;undefined reference&#8221; &#8212; a hole nobody filled</text>

  <rect x="40" y="516" width="1020" height="296" rx="10" fill="#f4f9f6" stroke="#3a7d5c" stroke-width="2"/>
  <rect x="40" y="516" width="1020" height="42" rx="10" fill="#2a5a42"/>
  <rect x="40" y="544" width="1020" height="14" fill="#2a5a42"/>
  <text x="64" y="545" font-size="17" font-weight="bold" fill="#ffffff">THE ERROR TELLS YOU WHICH STAGE FAILED &#8212; AND THAT HALVES THE SEARCH</text>

  <text x="64" y="590" font-size="15" fill="#1c3b2a">During COMPILE, each .cpp is alone. It has no idea the other files exist. It trusts the headers and nothing else.</text>
  <text x="64" y="618" font-size="15" fill="#1c3b2a">That is why a compile error always names a FILE and a LINE: the problem is right there, in one place.</text>

  <text x="64" y="662" font-size="15" fill="#1c3b2a">During LINK, the files meet for the first time. A link error names a FUNCTION, not a line &#8212; because the</text>
  <text x="64" y="690" font-size="15" fill="#1c3b2a">problem is not in any single file. It is that something was promised and never delivered.</text>

  <rect x="64" y="716" width="972" height="76" rx="6" fill="#e8f3ec" stroke="#2a5a42" stroke-width="2"/>
  <text x="88" y="744" font-size="15" font-weight="bold" fill="#2a5a42">Compile error &#8594; go to that line. Link error &#8594; go find the missing BODY.</text>
  <text x="88" y="772" font-size="14" fill="#1c3b2a">Students lose hours hunting a link error inside main.cpp. It was never in main.cpp. It was never written at all.</text>
</svg>
