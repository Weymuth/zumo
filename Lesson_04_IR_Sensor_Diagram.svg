<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="irLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:0.1"/>
    </linearGradient>
    <linearGradient id="reflectedLight" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:0.7"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="350" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="250" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a5276" text-anchor="middle">How IR Reflectance Sensors Work</text>
  
  <!-- Sensor housing -->
  <rect x="175" y="60" width="150" height="70" rx="8" fill="#2c3e50" filter="url(#shadow)"/>
  <text x="250" y="55" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">SENSOR</text>
  
  <!-- Emitter (LED) -->
  <rect x="195" y="80" width="40" height="35" rx="4" fill="#c0392b"/>
  <text x="215" y="102" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">E</text>
  <circle cx="215" y="75" r="5" fill="#ff6b6b"/>
  
  <!-- Detector (Phototransistor) -->
  <rect x="265" y="80" width="40" height="35" rx="4" fill="#2980b9"/>
  <text x="285" y="102" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">D</text>
  
  <!-- Emitter light beam going down -->
  <path d="M 205 130 L 185 220 L 245 220 L 225 130 Z" fill="url(#irLight)" opacity="0.7"/>
  
  <!-- Reflected light beam going up to detector -->
  <path d="M 255 220 L 275 130 L 295 130 L 315 220 Z" fill="url(#reflectedLight)" opacity="0.5"/>
  
  <!-- Arrow showing light direction down (centered under E at x=215) -->
  <line x1="215" y1="135" x2="215" y2="175" stroke="#c0392b" stroke-width="2"/>
  <polygon points="215,185 210,175 220,175" fill="#c0392b"/>
  
  <!-- Arrow showing reflection up (centered under D at x=285) -->
  <line x1="285" y1="175" x2="285" y2="135" stroke="#2980b9" stroke-width="2"/>
  <polygon points="285,130 280,140 290,140" fill="#2980b9"/>
  
  <!-- Floor surface - WHITE (high reflection) -->
  <rect x="50" y="220" width="180" height="30" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2"/>
  <text x="140" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle">WHITE SURFACE</text>
  <text x="140" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">High reflection → Low value</text>
  
  <!-- Floor surface - BLACK (low reflection) -->
  <rect x="270" y="220" width="180" height="30" fill="#2c3e50" stroke="#1a252f" stroke-width="2"/>
  <text x="360" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#ecf0f1" text-anchor="middle">BLACK SURFACE</text>
  <text x="360" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Low reflection → High value</text>
  
  <!-- Divider line -->
  <line x1="250" y1="215" x2="250" y2="255" stroke="#999" stroke-width="1" stroke-dasharray="4,2"/>
  
  <!-- Legend / Labels -->
  <rect x="25" y="290" width="450" height="50" rx="5" fill="#f0f0f0" stroke="#ddd"/>
  
  <rect x="45" y="305" width="20" height="20" rx="3" fill="#c0392b"/>
  <text x="55" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">E</text>
  <text x="75" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#333">= Emitter (IR LED, shines light down)</text>
  
  <rect x="275" y="305" width="20" height="20" rx="3" fill="#2980b9"/>
  <text x="285" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="white" text-anchor="middle">D</text>
  <text x="305" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#333">= Detector (measures reflection)</text>
  
</svg>
