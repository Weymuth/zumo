  # ===================================================================
  # AFTER — POST-BUILD CHECK
  # Assumes the student has built and run the TRIM Finder. Draws on §6
  # steps, §7, §9 challenges and the Extra Practice set.
  # Overlaps BRAIN CHECK 03 by design is AVOIDED: BC03 asks about
  # yesterday's TRIM going stale, testing at more than one speed, the
  # power switch, writing 500, and hand-tuning vs closed loop. None of
  # those five is repeated below.
  # Suggested Canvas draw: 8.
  # ===================================================================
  after:
    description: "Post-build check. Assumes the TRIM Finder was built and run."
    suggested_draw: 8
    questions:

      - id: L03_A01
        type: multiple_choice
        cite: "§6 Step 2"
        points: 1
        stem: "Step 2 has you delete the template's section banner comments but keep something. What, and why?"
        options:
          - text: "The empty setup() and loop() — they are what keeps every build green until Steps 10 and 11 fill them in"
            correct: true
          - text: "The #include line, because the library cannot be added later"
            correct: false
          - text: "The FUNCTION PROTOTYPES section, because this program needs it"
            correct: false
            why: "This program defines its helpers above setup(), so it needs no prototypes section."
          - text: "The header comment only — setup() and loop() are added in Step 3"
            correct: false

      - id: L03_A02
        type: multiple_choice
        cite: "§6 Step 4"
        points: 1
        stem: "How many hardware objects does the TRIM Finder declare, and which one is new this lesson?"
        options:
          - text: "Five — and motors is the new one"
            correct: true
          - text: "Four — and display is the new one"
            correct: false
          - text: "Five — and buttonC is the new one"
            correct: false
            why: "All three buttons and the display are the same cast as Lesson 2."
          - text: "Six — motors counts as two, one per side"
            correct: false
            why: "The motors object controls BOTH motors together, unlike the buttons which are separate."

      - id: L03_A03
        type: multiple_choice
        cite: "§6 Step 7"
        points: 1
        stem: "updateDisplay() prints the battery as mv / 1000, then a dot, then (mv % 1000) / 100. Why is it written that way?"
        options:
          - text: "It splits out whole volts and tenths, so the display shows 5.4V without floating-point math"
            correct: true
          - text: "It rounds the reading to compensate for the sensor's error"
            correct: false
          - text: "It converts millivolts to milliamps"
            correct: false
          - text: "It is the only way to print a number on the OLED"
            correct: false

      - id: L03_A04
        type: multiple_choice
        cite: "§6 Step 8"
        points: 1
        stem: "printTrimAdvice() prints one of three messages. What does it say when trimValue is positive?"
        options:
          - text: "That it is boosting the LEFT motor — use if the robot curves LEFT"
            correct: true
          - text: "That it is boosting the RIGHT motor — use if the robot curves RIGHT"
            correct: false
          - text: "That it is cutting the LEFT motor — use if the robot curves RIGHT"
            correct: false
            why: "That is the negative branch."
          - text: "That the motors are balanced and no correction is applied"
            correct: false
            why: "That is the zero branch."

      - id: L03_A05
        type: multiple_choice
        cite: "§6 Step 10"
        points: 1
        stem: "setup() deliberately prints no banner. Why not?"
        options:
          - text: "Printing at boot is invisible — reset drops the USB port, and the Serial Monitor only reconnects after setup() has already finished"
            correct: true
          - text: "Because Serial.begin() has not run yet at that point"
            correct: false
          - text: "Because printing in setup() would slow the motors down"
            correct: false
          - text: "Because the OLED and Serial cannot both be used in setup()"
            correct: false

      - id: L03_A06
        type: multiple_choice
        cite: "§6 Step 11"
        points: 1
        stem: "In loop(), why must the A+C branch come first, with the single-button checks hanging off it as else if?"
        options:
          - text: "Otherwise pressing both buttons would also satisfy a single-button branch and fire it instead"
            correct: true
          - text: "Because isPressed() is slower than getSingleDebouncedPress()"
            correct: false
          - text: "Because the reset must happen before Serial connects"
            correct: false
          - text: "Because C++ evaluates else if branches before the leading if"
            correct: false

      - id: L03_A07
        type: multiple_choice
        cite: "§6 Step 11, Quick Reference"
        points: 1
        stem: "Why does the A+C reset use isPressed() while the other three branches use getSingleDebouncedPress()?"
        options:
          - text: "isPressed() asks whether a button is held down right now, which is what a deliberate two-button combo needs"
            correct: true
          - text: "isPressed() is the only one that works on button C"
            correct: false
          - text: "getSingleDebouncedPress() cannot be used inside an if statement"
            correct: false
          - text: "isPressed() automatically debounces both buttons together"
            correct: false

      - id: L03_A08
        type: multiple_choice
        cite: "§6 Step 12"
        points: 1
        stem: "In BREAK IT ON PURPOSE you move runMotorTest() below loop() and rebuild. What exact error do you earn?"
        options:
          - text: "error: 'runMotorTest' was not declared in this scope"
            correct: true
          - text: "error: 'runMotorTest' redefined"
            correct: false
          - text: "error: expected ';' before 'runMotorTest'"
            correct: false
          - text: "No error — C++ finds functions anywhere in the file"
            correct: false
            why: "The compiler reads top to bottom, so when loop() calls the function it has not seen it yet."

      - id: L03_A09
        type: multiple_choice
        cite: "§6 Step 12"
        points: 1
        stem: "You have moved runMotorTest() to the bottom of the file and want to keep it there. What is the one-line fix?"
        options:
          - text: "Add void runMotorTest(); near the top — a function prototype"
            correct: true
          - text: "Add #include <Zumo32U4.h> a second time"
            correct: false
          - text: "Mark the function const"
            correct: false
          - text: "Call it from setup() instead of loop()"
            correct: false

      - id: L03_A10
        type: multiple_choice
        cite: "§7"
        points: 1
        stem: "You keep pressing C long past a sensible TRIM. What does the verification checklist say should happen?"
        options:
          - text: "TRIM stops at +50 and goes no further"
            correct: true
          - text: "TRIM keeps climbing to +400, the motor limit"
            correct: false
          - text: "TRIM wraps around to -50"
            correct: false
          - text: "The program resets TRIM to 0"
            correct: false
            why: "That is what holding A and C together does."

      - id: L03_A11
        type: multiple_choice
        cite: "§9 Challenge 2"
        points: 1
        stem: "You build the LOW BATTERY warning and it fires even on a full charge while the robot is plugged into USB. What is going on?"
        options:
          - text: "Nothing is wrong with your code — readBatteryMillivolts() reads only the battery, so on USB with the switch off it reads low"
            correct: true
          - text: "Your threshold is too high; lower it to 4000"
            correct: false
          - text: "The return statement is skipping the real reading"
            correct: false
          - text: "USB power confuses the OLED, not the battery monitor"
            correct: false

      - id: L03_A12
        type: multiple_choice
        cite: "§9 Challenge 3"
        points: 1
        stem: "In the clamp challenge you upload with both speeds at 200, then at 250, and the robot moves identically. Why?"
        options:
          - text: "constrain(250, -200, 200) and constrain(200, -200, 200) both return 200, so the same value reaches the motors"
            correct: true
          - text: "The battery cannot supply enough current for 250"
            correct: false
          - text: "The library caps every speed at 200"
            correct: false
            why: "The library's own cap is 400. The 200 ceiling here is YOUR MAX_SPEED, applied by constrain()."
          - text: "The delay is too short for the difference to show"
            correct: false

      - id: L03_A13
        type: multiple_choice
        cite: "§9 Challenge 5"
        points: 1
        stem: "Challenge 5 stores {150, 200, 250, 300} and starts speedIndex at 1. What speed does the FIRST press of B run, and what comes next?"
        options:
          - text: "200 first, then 250, 300, 150, and back to 200"
            correct: true
          - text: "150 first, then 200, 250, 300"
            correct: false
            why: "150 is slot 0. The index starts at 1, so the first press reads slot 1."
          - text: "200 first, then 150, 250, 300"
            correct: false
          - text: "300 first, counting downward"
            correct: false

      - id: L03_A14
        type: multiple_choice
        cite: "§9 Challenge 6"
        points: 1
        stem: "You save your measured TRIM but the robot still starts at 0. The challenge warns about one specific mistake. What is it?"
        options:
          - text: "Declaring the value inside setup() creates a second, local copy that vanishes when setup() ends, so the driving code still reads the global 0"
            correct: true
          - text: "Writing const instead of int"
            correct: false
          - text: "Forgetting to press A+C before uploading"
            correct: false
          - text: "Setting the value above the plus or minus 50 clamp"
            correct: false

      - id: L03_A15
        type: multiple_choice
        cite: "§9 Challenge 7"
        points: 1
        stem: "Your square drifts badly by the fourth corner. What does the challenge say this reveals?"
        options:
          - text: "Small errors compound — a 5-degree error over four turns is 20 degrees of total drift, which is why timing-based movement is unreliable"
            correct: true
          - text: "Your TRIM was measured at the wrong speed"
            correct: false
          - text: "The for loop is running five times instead of four"
            correct: false
          - text: "The turn speed is set higher than the drive speed"
            correct: false

      - id: L03_A16
        type: multiple_choice
        cite: "Extra Practice, Bonus Challenge 3"
        points: 1
        stem: "A robot has its motor wires soldered on backwards. The bonus challenge fixes it in software with two lines in setup(). What are they?"
        options:
          - text: "motors.flipLeftMotor(true); and motors.flipRightMotor(true); — they reverse what positive means for each motor"
            correct: true
          - text: "Two setSpeeds() calls with negative values"
            correct: false
            why: "The challenge requires the fix without touching driveForward() at all — negating there would not do it."
          - text: "Two constrain() calls with reversed limits"
            correct: false
          - text: "A second Zumo32U4Motors declaration with the sides swapped"
            correct: false

      - id: L03_A17
        type: true_false
        cite: "Extra Practice, Bonus Challenge 1"
        points: 1
        stem: "The lowest speed value that still moves the robot is the same for every Zumo in the room."
        correct: false
        why: "The creep threshold differs by robot and by battery level — static friction in the gears and treads has to be beaten first. It is why real robot code often carries a MINIMUM_SPEED constant."

      - id: L03_A18
        type: true_false
        cite: "Extra Practice, Bonus Challenge 6"
        points: 1
        stem: "Running at speed 200 for two seconds carries the robot exactly twice as far as speed 100 for two seconds."
        correct: false
        why: "Almost nobody measures exactly 2.0 — friction eats a bigger share of the slow run, the fast run coasts further after the stop, and battery sag hits the two runs differently. That gap IS dead reckoning's error, made measurable."

      - id: L03_A19
        type: true_false
        cite: "Extra Practice, Bonus Challenge 2"
        points: 1
        stem: "A TRIM value tuned driving forward will usually work just as well driving backward."
        correct: false
        why: "The reason is not the gearbox — it is that a plain + TRIM added to a NEGATIVE speed points the correction the wrong way, making the weak motor weaker still. How much that costs depends on how big your TRIM is; on a well-matched robot it can be too small to see. Fix the sign and any TRIM-sized curve goes away; a small mechanical residual can remain, which is why real rovers sometimes store a calibration per direction."

      - id: L03_A20
        type: true_false
        cite: "§6 Step 9"
        points: 1
        stem: "runMotorTest() stops the motors itself, immediately after the timed delay, rather than relying on anything else to stop them."
        correct: true
        why: "motors.setSpeeds(0, 0) sits directly after delay(TEST_DURATION). The lesson calls this a safety pattern: always stop motors as soon as possible after a timed run."

