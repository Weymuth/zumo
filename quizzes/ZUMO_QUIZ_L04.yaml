lesson: "L04"
title: "Seeing the Line — Reflectance Sensors, Arrays, and the First Decision"
# Verified against: lessons/Lesson_02.html v03.22.0 - S178. One L02-asserting question:
# A02, "the same error from Lesson 2 Step 7." Step 7's error is still
# 'blinkLED' was not declared in this scope - S178 reworded who has LED code to replace,
# not the error the step produces. Pin earned.
bank_version: "1.1.12"
source:
  lesson_04: "v04.29.3"
  lesson_03: "v03.44.3"
  lesson_02: "v03.22.1"

sets:

  # ===================================================================
  # BEFORE — THE PRE-CLASS GATE
  # Answerable from the reading alone. Nothing here needs the robot, a
  # compiler, or a built program. Draws on §1-§5, §8, §8A, Quick
  # Reference and the Glossary.
  # Suggested Canvas draw: 10, one attempt, locks at period start.
  # ===================================================================
  before:
    description: "Pre-class reading gate. Answerable from the text alone."
    suggested_draw: 10
    questions:

      # ---------- §3.1 How the sensor actually measures ----------
      - id: L04_B01
        type: multiple_choice
        cite: "§3.1"
        points: 1
        stem: "A line sensor reports a LARGE number. What is under it?"
        options:
          - text: "A dark surface, like black electrical tape"
            correct: true
          - text: "A bright white surface"
            correct: false
            why: "Backwards — and the lesson says this trips up almost everyone once. HIGH = DARK, LOW = LIGHT."
          - text: "Nothing — a large number means the sensor is disconnected"
            correct: false
          - text: "It depends on the room lighting"
            correct: false
            why: "The sensor supplies its own infrared, so the reading depends on the surface, not the ceiling lights."

      - id: L04_B02
        type: multiple_choice
        cite: "§3.1"
        points: 1
        stem: "The sensor reading is a measurement of TIME. What is being timed?"
        options:
          - text: "How long the sensor's tiny capacitor takes to drain, which happens faster when more infrared returns"
            correct: true
          - text: "How long the infrared LED stays lit before it switches off"
            correct: false
          - text: "How long the microcontroller waits between one reading and the next"
            correct: false
            why: "That is DISPLAY_INTERVAL_MS, a pause you choose — not the reading itself."
          - text: "How long light takes to travel down to the floor and back"
            correct: false
            why: "Light covers a few millimetres far too fast to time this way; the sensor times a draining capacitor instead."

      - id: L04_B04
        type: multiple_choice
        cite: "§3.1"
        points: 1
        stem: "Your robot behaves perfectly in the middle of the classroom and goes haywire next to a sunny window. What is the most likely cause?"
        options:
          - text: "Sunlight is loaded with infrared and floods the phototransistors, so everything reads bright"
            correct: true
          - text: "Sunlight heats the motors, which makes the robot drift"
            correct: false
          - text: "The window's glare confuses the OLED display"
            correct: false
          - text: "Visible light overwhelms the sensors, which are tuned to visible wavelengths"
            correct: false
            why: "These sensors are tuned to infrared, not visible light — that pairing is what filters out most ordinary room light."

      # ---------- §3.2 Eight sensors, six wires ----------
      - id: L04_B05
        type: multiple_choice
        cite: "§3.2"
        points: 1
        stem: "The front sensor board carries eight sensors but only six signal wires. How is that resolved?"
        options:
          - text: "Four sensors have their own permanent wire; the other four share two wires, two apiece, and a jumper decides which one is connected"
            correct: true
          - text: "All eight share the six wires in rotation, a few times per second"
            correct: false
            why: "Nothing switches automatically. The choice is physical and it is yours to make."
          - text: "Two of the eight sensors are decorative and are never wired"
            correct: false
          - text: "The microcontroller reads two sensors per wire at the same time"
            correct: false

      - id: L04_B06
        type: multiple_choice
        cite: "§3.2"
        points: 1
        stem: "Which line sensors are ALWAYS connected, no matter where the jumpers sit?"
        options:
          - text: "1, 3 and 5"
            correct: true
          - text: "2 and 4"
            correct: false
            why: "Exactly backwards — 2 and 4 are the two that share a wire with a proximity receiver."
          - text: "1 and 5 only"
            correct: false
          - text: "All five, once the sensors are calibrated"
            correct: false
            why: "Calibration rescales readings; it cannot connect a wire."

      - id: L04_B08
        type: multiple_choice
        cite: "§1, §3.2"
        points: 1
        stem: "Why does this lesson end by putting both jumpers BACK to the factory position?"
        options:
          - text: "Lesson 5 uses the side proximity receivers, which share wires with line sensors 2 and 4"
            correct: true
          - text: "Leaving them moved will damage the sensor board"
            correct: false
          - text: "The jumpers wear out if they stay in the DN position"
            correct: false
          - text: "Five-sensor mode drains the batteries too quickly to store the robot"
            correct: false

      # ---------- §3.4 Calibration ----------
      - id: L04_B09
        type: multiple_choice
        cite: "§3.4"
        points: 1
        stem: "A raw reading of 1400 arrives. Is the surface dark or light?"
        options:
          - text: "You cannot say — raw readings are not comparable between sensors or between surfaces"
            correct: true
          - text: "Dark, because 1400 is more than half of 2000"
            correct: false
            why: "This is the '1400 problem' the lesson names. Sensor height, surface texture, dust and manufacturing spread all move a raw number."
          - text: "Light, because 1400 is below the 2000 ceiling"
            correct: false
          - text: "Dark, but only in the five-sensor configuration"
            correct: false

      - id: L04_B10
        type: multiple_choice
        cite: "§3.4"
        points: 1
        stem: "What does a calibration sweep actually produce?"
        options:
          - text: "A per-sensor record of the brightest and darkest values that sensor saw during the sweep"
            correct: true
          - text: "A single threshold number shared by all the sensors"
            correct: false
          - text: "A corrected wiring map of which sensor sits where"
            correct: false
          - text: "A permanent factory setting stored on the sensor board"
            correct: false
            why: "Nothing is stored permanently — the record books live in RAM and evaporate at power-off."

      - id: L04_B11
        type: multiple_choice
        cite: "§3.4"
        points: 1
        stem: "Your robot worked yesterday. Today, before any sweep, the readings look like garbage. What is wrong?"
        options:
          - text: "Nothing is broken — calibration lives in RAM and does not survive power-off, so every session needs a fresh sweep"
            correct: true
          - text: "A sensor window has failed and must be replaced"
            correct: false
          - text: "The jumpers moved themselves overnight"
            correct: false
          - text: "The calibration data was saved but has been corrupted"
            correct: false
            why: "It was never saved. That is by design, and §8's last troubleshooting row says so."

      - id: L04_B13
        type: multiple_choice
        cite: "§3.5"
        points: 1
        stem: "readLine() turns several readings into one number. What kind of calculation is it?"
        options:
          - text: "A weighted average of the sensor positions, where darker sensors pull the result harder toward themselves"
            correct: true
          - text: "It simply reports the position of whichever single sensor reads darkest"
            correct: false
            why: "If it did, the answer could only ever land exactly on a sensor — it could never report a position BETWEEN two of them."
          - text: "It adds all the readings together"
            correct: false
          - text: "It counts how many sensors are over the tape"
            correct: false

      - id: L04_B15
        type: multiple_choice
        cite: "§3.5"
        points: 1
        stem: "No sensor sees anything dark. What does readLine() report?"
        options:
          - text: "0 or 4000 — whichever side the line was last seen on"
            correct: true
          - text: "The center value, as a neutral guess"
            correct: false
          - text: "A negative number to signal the error"
            correct: false
          - text: "The value from the previous loop, unchanged"
            correct: false
            why: "It reports a SIDE, not the old position — the robot's best guess is 'it went that way.'"

      - id: L04_B17
        type: multiple_choice
        cite: "§3.6"
        points: 1
        stem: "What is the strongest argument for waking sensors 2 and 4?"
        options:
          - text: "The two wide blind gaps become four small ones, so a narrow strip of tape can no longer hide entirely between sensors"
            correct: true
          - text: "Five sensors read faster than three"
            correct: false
            why: "The opposite — five sensors take longer to read, and that is one of the costs the lesson insists you weigh."
          - text: "Five sensors work without calibration"
            correct: false
          - text: "Five sensors free up the proximity receivers"
            correct: false
            why: "Backwards: waking 2 and 4 is what COSTS you the two side proximity receivers."

      - id: L04_B19
        type: multiple_choice
        cite: "§5.5"
        points: 1
        stem: "In the THREE-sensor configuration, which array box holds the CENTER sensor?"
        options:
          - text: "lineSensorValues[1]"
            correct: true
          - text: "lineSensorValues[3], because it is sensor 3"
            correct: false
            why: "The number-one Lesson 4 bug. Index counts AWAKE sensors from zero; it does not name the sensor."
          - text: "lineSensorValues[2]"
            correct: false
            why: "That is where the center sensor lives once FIVE sensors are awake."
          - text: "lineSensorValues[0]"
            correct: false
            why: "Box [0] holds sensor 1, the far-left eye."

      - id: L04_B20
        type: multiple_choice
        cite: "§5.5"
        points: 1
        stem: "Why does the center sensor change array box between the two configurations?"
        options:
          - text: "The array only has boxes for the sensors that are awake, and the index counts them from zero"
            correct: true
          - text: "Moving the jumpers physically rewires the sensors into a different order"
            correct: false
          - text: "readCalibrated() sorts the values darkest-first"
            correct: false
          - text: "It does not change — the center is always [2]"
            correct: false

      # ---------- §5.4 The promise the compiler cannot check ----------
      - id: L04_B21
        type: multiple_choice
        cite: "§5.4"
        points: 1
        stem: "You call initFiveSensors() but leave both jumpers in the factory position. What happens?"
        options:
          - text: "It compiles and runs, and sensors 2 and 4 simply report garbage — nothing warns you"
            correct: true
          - text: "The program refuses to compile"
            correct: false
            why: "The compiler cannot see your jumpers. That is the whole point of §5.4."
          - text: "The robot resets as soon as it reads a sensor"
            correct: false
          - text: "The library falls back to three sensors automatically"
            correct: false

      - id: L04_B22
        type: multiple_choice
        cite: "§5.4"
        points: 1
        stem: "Why is initThreeSensors() safe in ANY jumper position?"
        options:
          - text: "Sensors 1, 3 and 5 each have their own permanent wire, so no jumper can disconnect them"
            correct: true
          - text: "It checks the jumper positions before it wakes anything"
            correct: false
          - text: "It wakes all five and then ignores two of them"
            correct: false
          - text: "It only works after a calibration sweep"
            correct: false

      # ---------- §5.6 The two standard helpers ----------
      - id: L04_B23
        type: multiple_choice
        cite: "§5.6, Quick Reference"
        points: 1
        stem: "Where must waitForStart() be called?"
        options:
          - text: "As the LAST line of setup(), always"
            correct: true
          - text: "At the top of loop(), always"
            correct: false
            why: "That is where checkBattery() goes. Swapping the two is a classic."
          - text: "First thing in setup(), before anything else"
            correct: false
          - text: "Anywhere in setup() — the order does not matter"
            correct: false

      - id: L04_B24
        type: multiple_choice
        cite: "§5.6"
        points: 1
        stem: "Today's program never drives a motor. Why does it still need the safety gate?"
        options:
          - text: "Because habits only protect you if they are unconditional — the gate has to be second nature before the motors come back"
            correct: true
          - text: "Because the sensors cannot be read until Button A is pressed"
            correct: false
          - text: "Because calibration will not start without it"
            correct: false
          - text: "Because the display needs time to initialize"
            correct: false

      - id: L04_B25
        type: multiple_choice
        cite: "§5.6"
        points: 1
        stem: "How do you check the battery on a robot running a Lesson 4 program?"
        options:
          - text: "Hold buttons A and B together at any time"
            correct: true
          - text: "Press button C once"
            correct: false
          - text: "Hold A and C together, as in Lesson 3"
            correct: false
            why: "A+C was Lesson 3's reset. The battery check is A+B, and it is the same combo-press pattern."
          - text: "It appears automatically every ten seconds"
            correct: false

      # ---------- §8A.1-8A.2 The if statement and the threshold ----------
      - id: L04_B26
        type: multiple_choice
        cite: "§8A.2, Glossary"
        points: 1
        stem: "Calibrated readings run 0-1000, so halfway is 500. Why does this book use 600 as its threshold instead?"
        options:
          - text: "It is a deliberate margin above halfway, so a scuffed floor or stray light cannot nudge a reading across the line and flip the decision"
            correct: true
          - text: "Because 600 is the exact midpoint of the calibrated scale"
            correct: false
            why: "500 is the midpoint. 600 sits above it on purpose — the margin is the reason."
          - text: "Because readings below 600 are discarded as noise"
            correct: false
            why: "The noise floor readLine() applies is 50, not 600."
          - text: "Because the sensors cannot report values below 600 on white"
            correct: false

      - id: L04_B28
        type: multiple_choice
        cite: "§8A.6"
        points: 1
        stem: "With NUM_SENSORS set to 3, how many laps does `for (uint8_t i = 0; i < NUM_SENSORS; i++)` run, and which boxes does it touch?"
        options:
          - text: "Three laps, touching boxes 0, 1 and 2"
            correct: true
          - text: "Three laps, touching boxes 1, 2 and 3"
            correct: false
            why: "The counter starts at zero, so it never reaches box 3 — and box 3 does not exist."
          - text: "Four laps, touching boxes 0 through 3"
            correct: false
            why: "The loop stops the MOMENT the test fails: at i = 3, 3 < 3 is false and the body never runs."
          - text: "Two laps, touching boxes 0 and 1"
            correct: false

      - id: L04_B29
        type: multiple_choice
        cite: "§8A.6"
        points: 1
        stem: "What would go wrong with `for (uint8_t i = 0; i <= NUM_SENSORS; i++)`?"
        options:
          - text: "It would reach for a box that does not exist"
            correct: true
          - text: "It would refuse to compile"
            correct: false
          - text: "It would skip the first sensor"
            correct: false
          - text: "It would run forever"
            correct: false
            why: "That is the failure from forgetting i++ — a different bug in the same WARNING."

      - id: L04_B30
        type: multiple_choice
        cite: "§8A.6"
        points: 1
        stem: "What does a stray semicolon do here: `for (uint8_t i = 0; i < 3; i++);` ?"
        options:
          - text: "The loop runs an empty body three times, then your block executes once"
            correct: true
          - text: "The program will not compile"
            correct: false
            why: "It compiles clean. The lesson is blunt that neither of these two bugs is the compiler's problem to catch."
          - text: "The loop is skipped entirely"
            correct: false
          - text: "The loop never ends"
            correct: false

      - id: L04_B32
        type: multiple_choice
        cite: "§8A.8"
        points: 1
        stem: "`if (lineSensorValues[1] > 600) { crossings++; }` runs every loop. Why is it wrong for counting crossings?"
        options:
          - text: "The tape sits under the sensor for several loops, so one crossing adds several counts"
            correct: true
          - text: "The comparison operator is wrong"
            correct: false
            why: "The lesson is explicit: the comparison is right. The wrong QUESTION was asked."
          - text: "crossings++ can only be used inside a for loop"
            correct: false
          - text: "The threshold is too low to detect tape"
            correct: false

      - id: L04_B33
        type: multiple_choice
        cite: "§8A.8"
        points: 1
        stem: "The loop runs about ten times a second and the tape passes under the sensor for about half a second. Roughly how many counts does the broken version add for ONE crossing?"
        options:
          - text: "About five"
            correct: true
          - text: "Exactly one"
            correct: false
          - text: "About fifty"
            correct: false
          - text: "About five hundred"
            correct: false
            why: "Ten passes per second for half a second is five. Work the arithmetic rather than reaching for a big-sounding number."

      - id: L04_B34
        type: multiple_choice
        cite: "§8A.8"
        points: 1
        stem: "Why must `onLine` be declared ABOVE loop() rather than inside it?"
        options:
          - text: "A variable declared inside loop() is born and dies every trip, so it could not carry a fact from one loop into the next"
            correct: true
          - text: "Variables inside loop() cannot be of type bool"
            correct: false
          - text: "Only global variables can be compared with &&"
            correct: false
          - text: "It makes the program run faster"
            correct: false

      - id: L04_B35
        type: multiple_choice
        cite: "§8A.8"
        points: 1
        stem: "What breaks if you forget the final `onLine = nowDark;` line?"
        options:
          - text: "The flag never updates, the second half of the test stays true, and you are back to counting every loop"
            correct: true
          - text: "The program will not compile"
            correct: false
          - text: "The counter stays stuck at zero"
            correct: false
          - text: "The sensor stops responding to tape"
            correct: false

      - id: L04_B36
        type: multiple_choice
        cite: "§8A.8"
        points: 1
        stem: "A reading flickers across the threshold several times in a few milliseconds. What is the cure the lesson names?"
        options:
          - text: "Hysteresis — count when it climbs past 600, but do not re-arm until it drops below 400"
            correct: true
          - text: "Raise the threshold until the flicker stops"
            correct: false
          - text: "Add a delay so the flicker finishes before the next reading"
            correct: false
          - text: "Recalibrate the sensor"
            correct: false

      # ---------- §8A.9 abs() and the deadband ----------
      - id: L04_B37
        type: multiple_choice
        cite: "§8A.9"
        points: 1
        stem: "With three sensors, `int error = position - 1000;`. What two facts does that single subtraction carry?"
        options:
          - text: "Its size says how far off you are; its sign says which way"
            correct: true
          - text: "Its size says how fast you are moving; its sign says forward or reverse"
            correct: false
          - text: "Its size is the sensor number; its sign is the configuration"
            correct: false
          - text: "Only one — how far off center the line is"
            correct: false
            why: "The sign is the second fact, and it is the one that tells you which way to correct."

      - id: L04_B38
        type: multiple_choice
        cite: "§8A.9"
        points: 1
        stem: "Why ask `abs(error) < 100` instead of `error < 100`?"
        options:
          - text: "error < 100 is also true for −400, which is not close at all — abs() gives the size without the sign"
            correct: true
          - text: "abs() is faster than a plain comparison"
            correct: false
          - text: "error < 100 will not compile with a negative value"
            correct: false
          - text: "abs() also recalibrates the sensors"
            correct: false

      - id: L04_B39
        type: multiple_choice
        cite: "§8A.9"
        points: 1
        stem: "Why not simply demand `error == 0`?"
        options:
          - text: "The robot will never land exactly on zero, so it overshoots and corrects forever, buzzing around a target it cannot reach"
            correct: true
          - text: "Because == cannot be used with negative numbers"
            correct: false
          - text: "Because readLine() never returns exactly 1000"
            correct: false
          - text: "Because it would make the robot stop too early"
            correct: false

      # ---------- §4 Hardware, §8 Troubleshooting ----------
      - id: L04_B40
        type: multiple_choice
        cite: "§4.1"
        points: 1
        stem: "Sensor numbers are defined from whose point of view?"
        options:
          - text: "The robot's own — sensor 1 is the robot's far-left eye"
            correct: true
          - text: "Yours, as you look at the robot"
            correct: false
            why: "Only in one specific pose: on its back with the blade toward you. Flip it any other way and the row mirrors."
          - text: "The line's, looking up at the robot"
            correct: false
          - text: "Whichever way the USB cable points"
            correct: false

      - id: L04_B42
        type: multiple_choice
        cite: "§8"
        points: 1
        stem: "Every reading sits at maximum no matter what you put under the robot. What does §8 name as the likely cause?"
        options:
          - text: "The robot is being held in the air — nothing bounces back, so air counts as black"
            correct: true
          - text: "The batteries are flat"
            correct: false
          - text: "The jumpers are in the wrong position"
            correct: false
          - text: "The calibration sweep was too fast"
            correct: false

      - id: L04_B43
        type: multiple_choice
        cite: "§8"
        points: 1
        stem: "The position readout is stuck at exactly 0 or exactly 4000. What does that mean?"
        options:
          - text: "The line is lost — no sensor sees dark, so readLine() is reporting its last-known side"
            correct: true
          - text: "The sensor array has failed"
            correct: false
          - text: "The robot is perfectly centered"
            correct: false
          - text: "NUM_SENSORS is set to the wrong value"
            correct: false

      - id: L04_B44
        type: multiple_choice
        cite: "§8"
        points: 1
        stem: "§8 opens with a golden first move for any sensor investigation. What is it?"
        options:
