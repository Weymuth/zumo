  # ===================================================================
  # AFTER — POST-BUILD CHECK
  # Answerable only by having actually built and run it. Draws on §6
  # steps, §7's controlled experiment, §9 challenges and the Observation
  # experiments. Overlaps BRAIN CHECK 03 by design but does not
  # duplicate its items.
  # Suggested Canvas draw: 8.
  # NOT ASKED, deliberately: the Step 4 wave-test direction and Act
  # Two's row-1 character budget. Both are open bench findings.
  # ===================================================================
  after:
    description: "Post-build check. Answerable only by having built and run it."
    suggested_draw: 8
    questions:

      - id: L04_A01
        type: multiple_choice
        cite: "§6 Step 5"
        points: 1
        stem: "You add calibrateSensors() to setup() and the build turns red: \"'calibrateSensors' was not declared in this scope.\" What fixes it?"
        options:
          - text: "A function prototype up top, with the function itself down in the helpers"
            correct: true
          - text: "Moving calibrateSensors() to the top of loop()"
            correct: false
          - text: "Recalibrating the sensors"
            correct: false
          - text: "Renaming the function to match the library"
            correct: false
            why: "You wrote this helper — no library owns the name. The compiler read setup() top to bottom and met a name it had never heard of."

      - id: L04_A02
        type: multiple_choice
        cite: "§6 Step 5"
        points: 1
        stem: "The lesson calls that red build \"a rep,\" not a detour. Why?"
        options:
          - text: "It is the same error from Lesson 2 Step 7 — meeting it again is what turns ten minutes of debugging into ten seconds"
            correct: true
          - text: "It proves the sensors are wired correctly"
            correct: false
          - text: "It is the only way to generate the prototypes"
            correct: false
          - text: "It clears the calibration record books"
            correct: false

      - id: L04_A04
        type: multiple_choice
        cite: "§6 Step 6"
        points: 1
        stem: "After calibration, what changed about the three numbers on plain white?"
        options:
          - text: "They sit near 00 and now agree with each other"
            correct: true
          - text: "They sit near 99 and agree"
            correct: false
          - text: "They still disagree, but by less"
            correct: false
          - text: "They stop changing until the tape appears"
            correct: false

      - id: L04_A05
        type: multiple_choice
        cite: "§6 Step 6"
        points: 1
        stem: "Sliding the line from sensor 1 toward sensor 3, you found a position where the dashboard read all-white with the line still under the robot. What is that?"
        options:
          - text: "The blind gap — the resolution limit from §3.6, reproduced on your desk"
            correct: true
          - text: "A failed calibration sweep"
            correct: false
          - text: "The line-lost behavior of readLine()"
            correct: false
            why: "Different thing — that is readLine() reporting 0 or 4000. Here the individual sensor values themselves read white."
          - text: "A dead sensor"
            correct: false

      - id: L04_A06
        type: multiple_choice
        cite: "§6 Step 7"
        points: 1
        stem: "In Step 7 you changed the code to five sensors but left the jumpers alone. What did digits 2 and 4 do?"
        options:
          - text: "Nothing useful — they did not track the tape, and nothing crashed or warned"
            correct: true
          - text: "They read a steady 99"
            correct: false
          - text: "They mirrored digits 1 and 5"
            correct: false
          - text: "The program refused to upload"
            correct: false

      - id: L04_A07
        type: multiple_choice
        cite: "§6 Step 7"
        points: 1
        stem: "Why does the lesson make you change the software BEFORE moving the jumpers?"
        options:
          - text: "So you see a hardware/software mismatch from the inside — numbers that mean nothing, with no crash and no warning"
            correct: true
          - text: "Because moving the jumpers first would damage the board"
            correct: false
          - text: "Because initFiveSensors() must run once before the jumpers will work"
            correct: false
          - text: "Because the calibration data would otherwise be lost"
            correct: false

      - id: L04_A08
        type: multiple_choice
        cite: "§6 Step 8"
        points: 1
        stem: "Right after moving the jumpers to DN2/DN4, what must you do before the readings mean anything?"
        options:
          - text: "Recalibrate — the two newly woken sensors have blank record books"
            correct: true
          - text: "Nothing; the existing calibration covers all five"
            correct: false
          - text: "Reflash the program"
            correct: false
          - text: "Set NUM_SENSORS back to 3 and then to 5 again"
            correct: false

      - id: L04_A10
        type: multiple_choice
        cite: "§7"
        points: 1
        stem: "What makes §7's three-vs-five comparison a genuinely fair test?"
        options:
          - text: "With the jumpers on DN2/DN4, sensors 1, 3 and 5 still have their own wires — so you switch configurations purely in software, on identical hardware"
            correct: true
          - text: "You move the jumpers between each run"
            correct: false
            why: "That would change the hardware between runs, which is exactly what a controlled experiment must not do."
          - text: "You use two different robots"
            correct: false
          - text: "You recalibrate between every single reading"
            correct: false

      - id: L04_A12
        type: multiple_choice
        cite: "§7.1"
        points: 1
        stem: "In the five-sensor configuration, why can the line no longer hide?"
        options:
          - text: "Before one digit lets go of the line, its neighbor has already caught it"
            correct: true
          - text: "readLine() fills in the gaps by estimating"
            correct: false
          - text: "The extra sensors are more sensitive"
            correct: false
          - text: "Calibration removes the gaps"
            correct: false

      - id: L04_A13
        type: multiple_choice
        cite: "§7.2"
        points: 1
        stem: "In Test B you print the position from the THREE-sensor program. What scale does it use?"
        options:
          - text: "0–2000, center 1000"
            correct: true
          - text: "0–4000, center 2000"
            correct: false
            why: "That is the five-sensor scale. Comparing the two runs without noticing the scale change is the trap this question exists for."
          - text: "0–1000, center 500"
            correct: false
          - text: "0–99, center 50"
            correct: false

      - id: L04_A14
        type: multiple_choice
        cite: "§7.3"
        points: 1
        stem: "Why must the jumpers go back to LFT/RGT at the end of this lesson?"
        options:
          - text: "Lesson 5 is the proximity lesson and needs all three receivers — this was a loan, not a goodbye"
            correct: true
          - text: "Because the robot will not boot with them on DN2/DN4"
            correct: false
          - text: "Because five-sensor mode is permanently disabled after this lesson"
            correct: false
          - text: "Because they will fall off in storage"
            correct: false

      - id: L04_A15
        type: multiple_choice
        cite: "§7.3"
        points: 1
        stem: "How does the exit ritual say to confirm the restoration?"
        options:
          - text: "Verify with software — flash the three-sensor program, sweep, and confirm sensors 1, 3 and 5 all respond to tape"
            correct: true
          - text: "Look at the jumpers and confirm they are seated"
            correct: false
            why: "Necessary but not sufficient. The lesson's rule is never to trust a hardware change without a test."
          - text: "Check that the OLED shows five digits"
            correct: false
          - text: "Nothing — the restoration is checked in Lesson 5"
            correct: false

      - id: L04_A16
        type: multiple_choice
        cite: "§9 Challenge 1"
        points: 1
        stem: "In Line Light, why must the display work appear in BOTH branches of the if?"
        options:
          - text: "The else branch erases the word with spaces — miss it and \"LINE!\" sticks on screen forever after its first appearance"
            correct: true
          - text: "Because display.gotoXY() must be called twice per loop"
            correct: false
          - text: "Because the LED and the display cannot share a branch"
            correct: false
          - text: "Because the else branch runs first"
            correct: false

      - id: L04_A18
        type: multiple_choice
        cite: "Observation Experiment 2"
        points: 1
        stem: "You tape over the center sensor's window, recalibrate, and run. Why do its readings swing wildly?"
        options:
          - text: "A covered eye sees the same darkness everywhere, so its brightest and darkest are nearly identical — calibration has almost no range to grade against, and tiny flickers get stretched"
            correct: true
          - text: "The sensor reports a constant 1000"
            correct: false
          - text: "The tape reflects infrared back into the neighboring sensors"
            correct: false
          - text: "Calibration ignores any sensor that cannot see"
            correct: false

      - id: L04_A20
        type: multiple_choice
        cite: "Observation Experiment 5"
        points: 1
        stem: "Sliding the surface fast, the position readout stops keeping up. Which constant would you change to react faster, and roughly how many readings per second is the program taking?"
        options:
          - text: "DISPLAY_INTERVAL_MS — the 100 ms pause gives about 10 readings per second"
            correct: true
          - text: "CAL_TIME_MS — the 5000 ms sweep sets the reading rate"
            correct: false
            why: "CAL_TIME_MS only sizes the calibration window at boot; it has no effect on the loop's pace."
          - text: "NUM_SENSORS — fewer sensors would read faster"
            correct: false
          - text: "There is no such constant; the rate is fixed by the library"
            correct: false

      - id: L04_A21
        type: true_false
        cite: "§7"
        points: 1
        stem: "initThreeSensors() still works with the jumpers on DN2/DN4."
        correct: true
        why: "Sensors 1, 3 and 5 keep their permanent wires in every jumper position — which is exactly what makes §7's software-only comparison fair."

      - id: L04_A22
        type: true_false
        cite: "§6 Step 8"
        points: 1
        stem: "The jumpers may be moved with the robot powered on, as long as the USB cable is unplugged."
        correct: false
        why: "Power OFF and USB unplugged, in the Section 4 pose, over the table."

