            correct: true
          - text: "Recalibrate before doing anything else"
            correct: false
            why: "Recalibrating is the cheapest EXPERIMENT and many rows end there — but the first move is to look at raw numbers."
          - text: "Replace the batteries"
            correct: false
          - text: "Reflash the program"
            correct: false

