# before a question was written. Five of them are load-bearing here:
#
#   1. STEP 2's "COMPLETE FILE" REVEAL HAD DELETED THE TRIM BLOCK, and Step 8's
#      handleGap() uses TRIM. Compiled against the book's own reveal, the build failed
#      with 'TRIM' was not declared in this scope. The Maker was correct in all seven
#      L08 payloads; only the book was wrong. B20, B21 and B22 rest on TRIM being IN
