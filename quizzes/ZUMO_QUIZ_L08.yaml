#      answerable only wrongly, against v04.30.1.
#   2. §8A.2 USED RAW read() AGAINST A CALIBRATED THRESHOLD — the exact thing Step 5
#      teaches you not to do, in the same lesson. B26, B31 and B32 ask which read call does
#      what, why a threshold is meaningless against a raw reading, and what the calibration
#      spin actually buys; a bank written against the old §8A.2 would have keyed read()
#      as acceptable and marked the students who read Step 5 carefully as wrong.
#   3. §8A.4 CLAIMED TO BE "the complete pattern you've implemented in this lesson" AND
#      NAMED THREE IDENTIFIERS THAT DO NOT EXIST — SETPOINT, MAX_CORRECTION and a bare
#      Kp — and clamped the correction where the lesson clamps the speeds. B27 and A14
