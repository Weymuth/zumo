#      different answers.
#   4. STEP 8's HINT CITED "Lesson 6's timers" AND LESSON 6 CONTAINS NO millis() AT ALL.
#      Repointed to Lesson 5's beep-interval trick, which is the same non-blocking
#      stamp-and-compare shape. B37 cites the elapsed-time idiom; the old citation sent
#      a student to a lesson where the pattern is not present.
#   5. THE Kp RANGE HAD TWO SPELLINGS — §3.1 and BRAIN CHECK 01 said 0.1-0.3, §7.3 and
#      the Quick Reference said 0.08-0.25. Settled to 0.1-0.3 by DJ ruling for the 75:1
#      fleet, and §3.1's own arithmetic proves it was the original: the lesson states
#      the correction range as "roughly -600 to +600", and 600 = 0.3 x 2000 exactly.
#      B06 and B08 ask the range and the ceiling. Challenge 5's three adaptive gains had
#      been sitting on the OLD range's endpoints (0.08/0.15/0.25) and moved with it to
#      0.10/0.20/0.30 — A16 asks about the bands, not the gains, for that reason.
#
#   The sixth: sensorValues[5] and lastPosition were called "module-private" while
#   declared with external linkage. Both are now `static` — the file-scope sense Lesson 7
#   gave averageCounts(). B24 and A07 ask what static means on a file-scope variable and
#   why RobotSensors.cpp uses it. Neither was askable against v04.30.1, because the
#   lesson's prose and its code disagreed.
#
# FOUR ANSWERS DELIBERATELY NOT ASKED:
#   - THE ROBOT'S TRAVEL SPEED IN cm/s. Challenge 3 states "~15cm/sec at BASE_SPEED=150"
#     and §7.2 / Step 8's ~8 cm gap figures are consistent with it, but the number has
#     never been measured on a real robot — it is an open bench item. Every gap question
#     here asks about the LOGIC (the stamp, the reset, the timeout) and never about a
#     distance in centimetres.
#   - THE EXACT LOOP RATE. "fifty times a second" USED TO appear in L08, L10 and L11 and
