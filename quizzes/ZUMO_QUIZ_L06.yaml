      - id: L06_A19
        type: matching
        cite: "§6 Step 13, Observation Experiment 3"
        points: 3
        stem: "Match each fault to what the robot does about it."
        pairs:
          - left: "Left track slips (over-counts)"
            right: "The gate quits early and the robot stops short"
          - left: "Left track binds (under-counts)"
            right: "The gate waits too long and the robot overshoots"
          - left: "Right side held back"
            right: "The robot curves, and no encoder can see it"
        extra_answers:
          - "The robot sails past the mark in a straight line"
          - "The program halts with an encoder error"

      - id: L06_A20
        type: multiple_choice
        cite: "§9 Challenge 5"
        points: 1
        stem: "Challenge 5 builds an odometer — a running total of distance across many moves. What must it NOT do that driveDistance() does every time?"
        options:
          - text: "Throw the count away — an odometer has to accumulate across moves rather than resetting at the start of each one"
            correct: true
          - text: "Use the while loop"
            correct: false
          - text: "Read both encoders"
            correct: false
          - text: "Convert counts to centimetres"
            correct: false
