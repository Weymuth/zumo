          - text: "The steps — get bread, add filling, assemble"
            correct: false
            why: "Those are the function body."
          - text: "The sandwich — what you get back"
            correct: false
            why: "That is the return value."
          - text: "The recipe's name"
            correct: false

      - id: L06_B48
        type: multiple_choice
        cite: "§8A"
        points: 1
        stem: "`void driveAndTurn(_______ distance)` — what type belongs in the blank, and why that one?"
        options:
          - text: "float, so the parameter can accept decimal values like 30.5"
            correct: true
          - text: "int, because encoder counts are whole numbers"
            correct: false
            why: "The counts are, but the distance handed in is not — 30.5 cm has to survive the trip."
          - text: "void, matching the function's return type"
            correct: false
          - text: "No type is needed; the compiler works it out from the call"
            correct: false

      - id: L06_B49
        type: true_false
        cite: "§8A, Glossary"
