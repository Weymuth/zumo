  # ===================================================================
  # AFTER — POST-BUILD CHECK
  # Assumes the 13 steps were built and run, the square was driven, and
  # Step 13's two bugs were found and fixed.
  # Suggested Canvas draw: 8.
  # ===================================================================
  after:
    description: "Post-build check. Assumes the build was completed through Step 13."
    suggested_draw: 8
    questions:

      - id: L06_A01
        type: multiple_choice
        cite: "§6 Step 13"
        points: 1
        stem: "You drive a square: 30 cm forward, turn 90°, four times. What does Step 13 promise will happen?"
        options:
          - text: "It will not close — the robot ends off to the side, aimed wrong, with a gap at the fourth corner"
            correct: true
          - text: "It closes cleanly, proving the encoders work"
            correct: false
          - text: "It closes on carpet but not on tile"
            correct: false
          - text: "The robot stops after three sides"
            correct: false

      - id: L06_A02
        type: multiple_choice
        cite: "§6 Step 13"
        points: 1
        stem: "Bug 1 — your robot has been driving arcs since Step 7. What causes it?"
        options:
          - text: "setSpeeds(speed, speed) gives both wheels the same number, and no two motors, gearboxes or tracks are identical"
            correct: true
          - text: "The encoders drift over long distances"
            correct: false
          - text: "The wheel base constant is wrong"
            correct: false
          - text: "The delay(10) lets the robot coast between checks"
            correct: false

      - id: L06_A03
        type: multiple_choice
        cite: "§6 Step 13"
        points: 1
        stem: "Why can the encoders not detect that the robot has been curving?"
        options:
          - text: "Encoders count rotation, not travel — a robot that curves 20° still spins exactly 30 cm worth of counts and reports success"
            correct: true
          - text: "They are sampled too slowly to see a gradual curve"
            correct: false
          - text: "Only the left encoder is wired, so a curve to the left is invisible"
            correct: false
            why: "Both are wired. The pre-Step-13 code only ASKED one — a different bug, and it is Bug 2."
          - text: "Curving does not change the count, because both wheels still turn"
            correct: false

      - id: L06_A04
        type: multiple_choice
        cite: "§6 Step 13"
        points: 1
        stem: "Where does TRIM come from, and where do you spend it?"
        options:
          - text: "It is the number you measured in Lesson 3, and it is added to the LEFT motor: setSpeeds(speed + TRIM, speed)"
            correct: true
          - text: "It is measured fresh in Lesson 6, and added to the right motor"
            correct: false
          - text: "It is calculated from the wheel base and applied to both motors"
            correct: false
          - text: "It is a Zumo library constant you do not set yourself"
            correct: false

      - id: L06_A05
        type: multiple_choice
        cite: "§6 Step 13, §8"
        points: 1
        stem: "Your robot curves LEFT on a straight line. Which way do you move TRIM?"
        options:
          - text: "Raise it — that speeds the left wheel up"
            correct: true
          - text: "Lower it — that slows the left wheel down"
            correct: false
          - text: "Leave TRIM and raise DRIVE_SPEED instead"
            correct: false
          - text: "Raise it, which slows the left wheel"
            correct: false
            why: "TRIM is ADDED to the left motor, so raising it makes that wheel turn faster, not slower."

      - id: L06_A06
        type: true_false
        cite: "§6 Step 13"
        points: 1
        stem: "TRIM can be a negative number."
        correct: true
        why: "The comment in the CONFIGURATION block says so — curves right, lower it, and it can go negative."

      - id: L06_A07
        type: multiple_choice
        cite: "§6 Step 13"
        points: 1
        stem: "Bug 2 — what had driveDistance()'s while loop been watching?"
        options:
          - text: "The left encoder only; the right wheel had been spinning the whole time and nothing ever asked it anything"
            correct: true
          - text: "Both encoders, but averaging them incorrectly"
            correct: false
          - text: "A timer rather than an encoder"
            correct: false
          - text: "The right encoder only"
            correct: false

      - id: L06_A08
        type: multiple_choice
        cite: "§6 Step 13"
        points: 1
        stem: "The left track is stiff and under-counts. What does the robot do?"
        options:
          - text: "Overshoots — the loop waits too long, because the count climbs more slowly than the robot actually travels"
            correct: true
          - text: "Stops short"
            correct: false
            why: "Stopping short is the slipping case, where the encoder over-counts and the loop quits early."
          - text: "Stops immediately"
            correct: false
          - text: "Drives in a circle"
            correct: false

      - id: L06_A09
        type: multiple_choice
        cite: "§6 Step 13"
        points: 1
        stem: "What does averageCounts() actually do to the two encoder readings?"
        options:
          - text: "Strips the sign off each with abs(), then averages them"
            correct: true
          - text: "Takes whichever of the two is larger"
            correct: false
          - text: "Subtracts the right from the left to measure curvature"
            correct: false
          - text: "Adds them together without averaging"
            correct: false

      - id: L06_A10
        type: multiple_choice
        cite: "§6 Step 13"
        points: 1
        stem: "Averaging both encoders does not make a bad track honest. What does it actually buy you?"
        options:
          - text: "The error is shared — a bad track costs you half the distance error instead of all of it"
            correct: true
          - text: "The error is cancelled completely"
            correct: false
          - text: "The robot detects the slip and stops with an error message"
            correct: false
          - text: "The robot drives straight even without TRIM"
            correct: false
            why: "Straightness is TRIM's job. Averaging is about the distance measurement being honest."

      - id: L06_A11
        type: multiple_choice
        cite: "§6 Step 13, §8"
        points: 1
        stem: "Step 13's two fixes do two different jobs. Which pairing is right?"
        options:
          - text: "TRIM is for straightness; averaging both encoders is for an honest distance measurement"
            correct: true
          - text: "TRIM is for distance accuracy; averaging is for straightness"
            correct: false
          - text: "Both are for straightness — one on each motor"
            correct: false
          - text: "Both are for distance — one per encoder"
            correct: false

      - id: L06_A12
        type: multiple_choice
        cite: "§7"
        points: 1
        stem: "You push the robot forward by hand, then push it back the same distance. What should the counts read, and what does that check?"
        options:
          - text: "Back to about zero — it confirms the encoders are signed and reading direction correctly"
            correct: true
          - text: "Double the one-way count, confirming they accumulate"
            correct: false
            why: "They would only add up if the counts were unsigned. Going back should subtract."
          - text: "Zero, because pushing by hand does not register"
            correct: false
          - text: "Whatever the first push read, frozen until the motors run"
            correct: false

      - id: L06_A13
        type: multiple_choice
        cite: "§7, Observation Experiment 3"
        points: 1
        stem: "You hold a finger lightly against the LEFT track during a driveDistance(50). What happens, and why?"
        options:
          - text: "It stops short — that track slips, the left encoder counts rotation the robot never turned into travel, and the gate quits early"
            correct: true
          - text: "It overshoots, because the encoder under-counts"
            correct: false
            why: "That is the stiff case from Step 13's Bug 2. Dragging makes it slip, which over-counts."
          - text: "It drives the full distance but slowly"
            correct: false
          - text: "Nothing changes, because the gate averages both wheels"
            correct: false

      - id: L06_A14
        type: multiple_choice
        cite: "Observation Experiment 3"
        points: 1
        stem: "Same test, but the finger is on the RIGHT track. What happens?"
        options:
          - text: "It ends up short AND aimed somewhere new — the left encoder counts its rotation correctly, but the wheel rolled that distance around a curve"
            correct: true
          - text: "It sails straight past the mark, because nothing ever asks the right wheel"
            correct: false
            why: "It cannot overshoot. Holding the right side back turns the robot right, which puts the LEFT wheel on the outside of the arc — so its rotation buys less forward travel, not more."
          - text: "Nothing changes, because the gate reads the left encoder"
            correct: false
            why: "The gate is unaffected, but the robot's path is not — it curves, and no encoder can see that."
          - text: "It spins in place"
            correct: false

      - id: L06_A15
        type: multiple_choice
        cite: "§9 Challenge 2"
        points: 1
        stem: "Challenge 2 asks for a triangle. What turn goes at each corner?"
        options:
          - text: "120°, from 360 ÷ 3"
            correct: true
          - text: "60°, the interior angle"
            correct: false
          - text: "90°, the same as the square"
            correct: false
          - text: "180°, reversing at each corner"
            correct: false

      - id: L06_A16
        type: multiple_choice
        cite: "§9 Challenge 3"
        points: 1
        stem: "Challenge 3 asks for a pentagon. What turn goes at each corner?"
        options:
          - text: "72°, from 360 ÷ 5"
            correct: true
          - text: "108°, the interior angle"
            correct: false
          - text: "120°, the same as the triangle"
            correct: false
          - text: "60°"
            correct: false

      - id: L06_A17
        type: true_false
        cite: "§6 Step 13"
        points: 1
        stem: "Step 13 tells you to run the square BEFORE reading the explanation of what goes wrong."
        correct: true
        why: "Tape the start position to the floor and look at the gap — the fix lands harder if you have seen what it fixes."

      - id: L06_A18
        type: matching
        cite: "§8"
        points: 4
        stem: "Match each symptom to its fix."
        pairs:
          - left: "Robot doesn't move at all"
            right: "targetCounts is 0 — check COUNTS_PER_CM"
          - left: "Robot never stops"
            right: "Wrong comparison — use < in the while loop"
