lesson: "L01"
title: "Hello, Robot! — Your First Program"
# Verified against: lessons/Lesson_01.html v03.31.2 - S178. L01-13 closed: the template
# section and the template-zip note both said Documents/PlatformIO while the turn-in callout
# said Documents/PlatformIO/Projects, and step 1 told the student to copy the Lesson 1 project
# folder WHILE IN a folder the lesson elsewhere says it is not in. Path confirmed by DJ against
# a live PlatformIO New Project (the container has no PlatformIO). No question in any bank
# asserts a filesystem path; A15 asserts the template RULE, which did not move. Pin earned.
bank_version: "1.1.9"
source:
  lesson_01: "v03.32.1"

sets:

  # ===================================================================
  # BEFORE — THE PRE-CLASS GATE
  # Answerable from the reading alone. Nothing here needs the robot,
  # a compiler, or a built program.
  # Draws on §1, §3, §4, §5, §7, §8, Quick Reference, Glossary.
  # Suggested Canvas draw: 10, one attempt, locks at period start.
  # ===================================================================
  before:
    description: "Pre-class reading gate. Answerable from the text alone."
    suggested_draw: 10
    questions:

      # ---------- §1 The true story of Hello, World ----------
      - id: L01_B01
        type: multiple_choice
        cite: "§1"
        points: 1
        stem: "Who wrote the first \"hello, world\" example, and where did it appear first?"
        options:
          - text: "Brian Kernighan, in a 1972 tutorial for a language called B"
            correct: true
          - text: "Dennis Ritchie, in the 1978 book The C Programming Language"
            correct: false
            why: "Ritchie co-wrote the 1978 book, but the phrase was born six years earlier in Kernighan's B tutorial."
          - text: "Brian Kernighan, in the 1978 book The C Programming Language"
            correct: false
            why: "That is where it became famous, not where it was born."
          - text: "Ken Thompson, in the original Unix manual"
            correct: false

      - id: L01_B02
        type: multiple_choice
        cite: "§1"
        points: 1
        stem: "The lesson says the 1972 version \"looked strange to modern eyes.\" Why?"
        options:
          - text: "The example used putchar() and spelled the message out a few characters at a time"
            correct: true
          - text: "B had no printf at all, so there was no other way to write it"
            correct: false
            why: "B did have a printf. The tutorial reached for putchar() anyway, because that is what a beginner met first in B."
          - text: "B had no way to display text at all, so the example used lights"
            correct: false
          - text: "B required every program to be written in capital letters"
            correct: false

      - id: L01_B03
        type: true_false
        cite: "§1"
        points: 1
        stem: "C is the ancestor of the C++ you write in this course."
        correct: true
        why: "§1 says so directly — the 1978 C book is the line that leads to the C++ on your Zumo."

      # ---------- §3.0 What makes a robot a robot ----------
      - id: L01_B04
        type: multiple_choice
        cite: "§3"
        points: 1
        stem: "What are the three steps of the robot cycle, in order?"
        options:
          - text: "SENSE, DECIDE, ACT"
            correct: true
          - text: "DECIDE, SENSE, ACT"
            correct: false
          - text: "SENSE, ACT, DECIDE"
            correct: false
          - text: "ACT, SENSE, DECIDE"
            correct: false

      - id: L01_B05
        type: multiple_choice
        cite: "§3"
        points: 1
        stem: "Which of the three steps is the one your program is responsible for?"
        options:
          - text: "DECIDE"
            correct: true
          - text: "SENSE"
            correct: false
            why: "The sensors gather the information; your code decides what it means."
          - text: "ACT"
            correct: false
            why: "The motors, buzzer and display act; your code chooses when."
          - text: "All three equally"
            correct: false
            why: "The lesson's Key Insight is specific: the magic is in DECIDE, and that is where your code lives."

      - id: L01_B06
        type: multiple_choice
        cite: "§3"
        points: 1
        stem: "About how often does the sense-decide-act loop run on a robot?"
        options:
          - text: "100 times per second or more"
            correct: true
          - text: "About once per second"
            correct: false
          - text: "About 10 times per minute"
            correct: false
          - text: "Once per program run"
            correct: false

      - id: L01_B07
        type: multiple_choice
        cite: "§3"
        points: 1
        stem: "The lesson lists a remote-control car as NOT a robot. Why not?"
        options:
          - text: "A human makes all the decisions — the car just obeys"
            correct: true
          - text: "It has no motors of its own"
            correct: false
          - text: "It cannot move without being plugged in"
            correct: false
          - text: "It has no computer chip inside"
            correct: false

      - id: L01_B08
        type: multiple_choice
        cite: "§3"
        points: 1
        stem: "Why does the lesson rate a toaster as only \"barely\" a robot?"
        options:
          - text: "It senses heat and acts by turning off, but it cannot really decide"
            correct: true
          - text: "It acts and decides, but it has no sensors"
            correct: false
          - text: "It senses and decides, but it cannot act on the world"
            correct: false
          - text: "It does all three, but too slowly to count"
            correct: false

      - id: L01_B09
        type: multiple_choice
        cite: "§3"
        points: 1
        stem: "A dishwasher runs its cycle on a timer whether the dishes were dirty or already clean. What kind of system is that, and what does it never get?"
        options:
          - text: "Open-loop — no information ever flows back in about the results of its own actions"
            correct: true
          - text: "Closed-loop — it checks its results but ignores them"
            correct: false
          - text: "Open-loop — it has no instructions to follow"
            correct: false
            why: "Instructions flow out fine. It is the feedback coming back that is missing."
          - text: "Closed-loop — it senses everything but cannot act"
            correct: false

      - id: L01_B10
        type: multiple_choice
        cite: "§3"
        points: 1
        stem: "What makes a line-following Zumo closed-loop rather than open-loop?"
        options:
          - text: "It acts, senses the result, and adjusts — it notices when it has drifted off center and steers back"
            correct: true
          - text: "It runs its instructions in a loop() function rather than once"
            correct: false
            why: "Repeating is not the same as checking. The dishwasher repeats too."
          - text: "It follows a longer list of instructions than an open-loop machine"
            correct: false
          - text: "It has more sensors than an open-loop machine"
            correct: false

      - id: L01_B11
        type: true_false
        cite: "§3"
        points: 1
        stem: "\"Automatic\" and \"autonomous\" mean the same thing in this course."
        correct: false
        why: "§3 draws the line deliberately: automatic follows a fixed script, autonomous checks its own results and adjusts."

      # ---------- §3.1 PlatformIO, the compiler ----------
      - id: L01_B12
        type: multiple_choice
        cite: "§3.1"
        points: 1
        stem: "What does the compiler produce, and how does it reach the robot?"
        options:
          - text: "Machine code — a stream of 1s and 0s that travels down the USB cable when you click Upload"
            correct: true
          - text: "A text file the robot reads line by line as it runs"
            correct: false
            why: "The ATmega32U4 cannot read text at all — that is the whole reason the compiler exists."
          - text: "A picture of the circuit the chip should build"
            correct: false
          - text: "A list of English instructions the chip translates itself"
            correct: false

      - id: L01_B13
        type: multiple_choice
        cite: "§3.1"
        points: 1
        stem: "Why does the lesson say the chip can only speak in 1s and 0s?"
        options:
          - text: "A microcontroller is millions of transistors, and each switch knows exactly two states — voltage on or voltage off"
            correct: true
          - text: "Because binary files are smaller than text files"
            correct: false
          - text: "Because the USB cable can only carry two voltages"
            correct: false
          - text: "Because C++ was designed to compile to binary"
            correct: false

      # ---------- §5.0 platformio.ini ----------
      - id: L01_B14
        type: multiple_choice
        cite: "§5.0, §8"
        points: 1
        stem: "The lesson calls platformio.ini the \"recipe card.\" What is the `board` line for?"
        options:
          - text: "It names the build profile the compiler builds for, so it knows the chip's memory size and pin layout"
            correct: true
          - text: "It names the exact board you are holding, so the compiler matches your hardware"
            correct: false
            why: "This is the trap. `board = a-star32U4` names a DIFFERENT Pololu board — see 3.3. It works because that board carries the same ATmega32U4 and the same bootloader, so the compiler and uploader behave identically."
          - text: "It names the chip family the board belongs to"
            correct: false
            why: "That is the `platform` line — atmelavr, the family the ATmega32U4 is in."
          - text: "It names the library to download"
            correct: false
            why: "That is `lib_deps`."

      - id: L01_B15
        type: multiple_choice
        cite: "§5.0"
        points: 1
        stem: "`lib_deps = pololu/Zumo32U4@2.0.1` — what is the `@2.0.1` doing, and why does the lesson insist on it?"
        options:
          - text: "It is a version pin: without it the project quietly takes whatever was published most recently, and the robot you build in June stops matching the one you built in September"
            correct: true
          - text: "It tells PlatformIO how many times to retry the download"
            correct: false
          - text: "It is the Zumo library's product number in Pololu's catalog"
            correct: false
          - text: "It sets the minimum version, so anything newer is used automatically"
            correct: false
            why: "That is what a caret range does. A pin names one exact release, which is the point."

      - id: L01_B16
        type: multiple_choice
        cite: "§5.0"
        points: 1
        stem: "What does the `framework = arduino` line commit you to?"
        options:
          - text: "The Arduino coding style — writing setup() and loop()"
            correct: true
          - text: "Using the Arduino IDE instead of VS Code"
            correct: false
            why: "The framework is the code style, not the editor. You are in VS Code the whole time."
          - text: "Buying an Arduino-brand board"
            correct: false
          - text: "Downloading libraries only from Arduino's website"
            correct: false

      # ---------- §5.1-§5.2 include and objects ----------
      - id: L01_B17
        type: multiple_choice
        cite: "§5.1"
        points: 1
        stem: "What does `#include <Zumo32U4.h>` actually do for your program?"
        options:
          - text: "It opens the Pololu library that lib_deps downloaded, pouring every Zumo command into your program"
            correct: true
          - text: "It downloads the Zumo library from the internet"
            correct: false
            why: "The downloading is lib_deps' job, in platformio.ini. The include just opens what is already there."
          - text: "It connects your computer to the robot over USB"
            correct: false
          - text: "It creates the motors, display and buzzer objects"
            correct: false
            why: "Those are the four object-declaration lines underneath it."

      - id: L01_B18
        type: multiple_choice
        cite: "§5.2"
        points: 1
        stem: "`Zumo32U4Motors motors;` — what has this line created?"
        options:
          - text: "An object: a named bundle of memory plus the commands that work on the motor hardware"
            correct: true
          - text: "A copy of the motor hardware in memory"
            correct: false
          - text: "A function that spins the motors"
            correct: false
          - text: "A constant holding the motors' current speed"
            correct: false

      - id: L01_B19
        type: multiple_choice
        cite: "§5.2"
        points: 1
        stem: "The lesson describes the pattern as \"name-dot-command.\" What do the two halves mean?"
        options:
          - text: "Who, then what to do — the object's name, then the action you want from it"
            correct: true
          - text: "What to do, then who — the action first, then the hardware"
            correct: false
          - text: "The library name, then the function name"
            correct: false
          - text: "The pin number, then the voltage"
            correct: false

      - id: L01_B20
        type: multiple_choice
        cite: "§5.5"
        points: 1
        stem: "`ledYellow(1)` breaks the name-dot-command pattern — there is no object name in front of it. What does the lesson say about that?"
        options:
          - text: "The built-in LEDs are the deliberate exception: the library skips the object and gives them direct commands, 1 for on and 0 for off"
            correct: true
          - text: "It is a mistake in the sample code that the compiler tolerates"
            correct: false
          - text: "`ledYellow` is an object whose name happens to look like a function"
            correct: false
          - text: "LEDs are controlled by the display object, so the name is implied"
            correct: false

      # ---------- §5.3-§5.4 setup and loop ----------
      - id: L01_B21
        type: multiple_choice
        cite: "§5.3, §5.4"
        points: 1
        stem: "How many times does each of the two functions run?"
        options:
          - text: "setup() runs exactly once at power-on or reset; loop() runs forever afterward"
            correct: true
          - text: "setup() runs forever; loop() runs once"
            correct: false
          - text: "Both run once, setup() first"
            correct: false
          - text: "Both run forever, alternating"
            correct: false

      - id: L01_B22
        type: multiple_choice
        cite: "§5.3"
        points: 1
        stem: "What does the word `void` in `void setup()` tell you?"
        options:
          - text: "The function returns nothing — it does its job without handing a value back"
            correct: true
          - text: "The function is empty"
            correct: false
            why: "An empty function and a function that returns nothing are different things. void describes the return, not the body."
          - text: "The function takes no arguments"
            correct: false
            why: "That is what the empty parentheses say."
          - text: "The function can be deleted safely"
            correct: false

      - id: L01_B23
        type: multiple_choice
        cite: "§5.3"
        points: 1
        stem: "What happens to anything you write after `//` on a line?"
        options:
          - text: "The compiler ignores it completely — it is a note for humans"
            correct: true
          - text: "It runs, but only in setup()"
            correct: false
          - text: "It is printed to the Serial Monitor"
            correct: false
          - text: "It is stored in the robot but never runs"
            correct: false

      - id: L01_B24
        type: true_false
        cite: "§5.4"
        points: 1
        stem: "In Lesson 1, loop() is left empty."
        correct: true
        why: "Everything happens once at startup, so all the action is in setup() and loop() has nothing to do."

      - id: L01_B25
        type: multiple_choice
        cite: "§5.4"
        points: 1
        stem: "The lesson says most robot programs do their real work in loop(). Why is Lesson 1 the exception?"
        options:
          - text: "The test sequence is meant to run once, so it lives in setup()"
            correct: true
          - text: "loop() does not work until Lesson 2"
            correct: false
          - text: "setup() is faster than loop()"
            correct: false
          - text: "The Zumo library requires all code to be in setup()"
            correct: false

      # ---------- §5.5 The while-loop trapdoor ----------
      - id: L01_B26
        type: multiple_choice
        cite: "§5.5"
        points: 1
        stem: "`while (!buttonA.getSingleDebouncedPress())` — what does the `!` do?"
        options:
          - text: "It is the NOT operator: it flips the answer the library call gives back"
            correct: true
          - text: "It makes the call urgent, so the chip checks faster"
            correct: false
          - text: "It marks the line as important for the compiler"
            correct: false
          - text: "It repeats the call until it succeeds"
            correct: false

      - id: L01_B27
        type: multiple_choice
        cite: "§5.5"
        points: 1
        stem: "While your finger is OFF the button, what is happening inside that while-loop?"
        options:
          - text: "The check keeps coming back true, so the loop runs again — check, wait 10 ms, check again, about a hundred times a second"
            correct: true
          - text: "The program is frozen and stops executing until the button is pressed"
            correct: false
            why: "The lesson is explicit: the robot was never frozen — it was asking \"pressed yet?\" over and over."
          - text: "The chip powers down to save battery until the button wakes it"
            correct: false
          - text: "The loop runs exactly ten times and then gives up"
            correct: false

      - id: L01_B28
        type: multiple_choice
        cite: "§5.5"
        points: 1
        stem: "What sets the pace of that check — roughly a hundred times a second?"
        options:
          - text: "The delay(10) inside the loop; the chip itself could check far faster"
            correct: true
          - text: "The chip's 16 MHz clock, which is as fast as it can go"
            correct: false
            why: "The lesson makes a point of this: the ATmega32U4 ticks 16 million times a second and is deliberately slowed down."
          - text: "The button's debounce circuit, which limits how often it can report"
            correct: false
          - text: "The USB connection speed"
            correct: false

      - id: L01_B29
        type: multiple_choice
        cite: "§5.5"
        points: 1
        stem: "What is \"debouncing,\" and why does the button need it?"
        options:
          - text: "The metal contact physically chatters open and closed for a few milliseconds; debouncing filters that into one clean press"
            correct: true
          - text: "It stops the button being pressed twice by accident by the user"
            correct: false
            why: "The bouncing is mechanical, inside the switch — your finger never notices it."
          - text: "It slows the chip down so it does not miss the press"
            correct: false
          - text: "It rejects presses that are too short to be deliberate"
            correct: false

      - id: L01_B30
        type: true_false
        cite: "§5.5"
        points: 1
        stem: "Without debouncing, a chip checking sixteen million times a second could read one press as dozens of presses."
        correct: true
        why: "That is exactly the problem §5.5 describes, and what the \"Single\" and \"Debounced\" in the function name are doing."

      # ---------- §5.5 The for-loop ----------
      - id: L01_B31
        type: multiple_choice
        cite: "§5.5"
        points: 1
        stem: "`for (int i = 0; i < 3; i++)` packs three jobs into one line. What are they, in order?"
        options:
          - text: "Initialize the counter, check it before every pass, increment it after every pass"
            correct: true
          - text: "Check, initialize, increment"
            correct: false
          - text: "Initialize, increment, check"
            correct: false
          - text: "Declare, run, delete"
            correct: false

      - id: L01_B32
        type: multiple_choice
        cite: "§5.5"
        points: 1
        stem: "Trace `for (int i = 0; i < 3; i++)`. How many times does the body run, and what ends it?"
        options:
          - text: "Three times; the loop ends when the counter reaches 3 and 3 < 3 is false"
            correct: true
          - text: "Four times, because the counter starts at 0"
            correct: false
            why: "Counting from zero is exactly why the number in the test equals the number of passes: 0, 1, 2."
          - text: "Two times, because the counter stops one short"
            correct: false
          - text: "Three times; the loop ends when the counter is reset to 0"
            correct: false

      # ---------- §5.5 Sound ----------
      - id: L01_B33
        type: multiple_choice
        cite: "§5.5, Quick Reference"
        points: 1
        stem: "`buzzer.playFrequency(440, 800, 15)` takes three values. What are they, in order?"
        options:
          - text: "Frequency in Hertz, duration in milliseconds, volume"
            correct: true
          - text: "Volume, frequency, duration"
            correct: false
          - text: "Duration, frequency, volume"
            correct: false
          - text: "Frequency, volume, duration"
            correct: false

      - id: L01_B34
        type: multiple_choice
        cite: "§5.5"
        points: 1
        stem: "Change 440 to 880. What happens to the sound, and why?"
        options:
          - text: "The pitch jumps exactly one octave higher — the chip flips the buzzer pin twice as fast"
            correct: true
          - text: "It gets twice as loud"
            correct: false
            why: "Volume is the third value. The first one is pitch."
          - text: "It plays for twice as long"
            correct: false
            why: "Duration is the second value."
          - text: "The pitch drops one octave"
            correct: false

      - id: L01_B35
        type: multiple_choice
        cite: "§5.5"
        points: 1
        stem: "Why does the victory jingle put a delay() after each note, longer than the note itself?"
        options:
          - text: "Starting a note does not pause the program — without the delay the next note takes the buzzer over and you hear one blip instead of several"
            correct: true
          - text: "The delay is what actually produces the sound"
            correct: false
            why: "The lesson says the opposite outright: the delay is not making the sound, it is giving the sound room to finish."
          - text: "The buzzer needs time to cool down between notes"
            correct: false
          - text: "Without it the notes would play too quietly to hear"
            correct: false

      - id: L01_B36
        type: true_false
        cite: "§5.5"
        points: 1
        stem: "The number 440 in playFrequency means the buzzer's pin is driven through 440 complete high-low cycles every second."
        correct: true
        why: "440 Hertz is 440 cycles per second — the note A4, the one orchestras tune to."

      # ---------- §4 Setup and tools ----------
      - id: L01_B37
        type: multiple_choice
        cite: "§4.2"
        points: 1
        stem: "Why does this course have you install Git?"
        options:
          - text: "PlatformIO expects it to be installed — and on a Mac, installing it is what brings in Apple's Command Line Tools, where the compiler lives"
            correct: true
          - text: "PlatformIO uses it to download the robot libraries"
            correct: false
            why: "The Zumo library comes from PlatformIO's own registry, not from a Git clone. Git still has to be there — for a different reason."
          - text: "You will use it to submit your work to Canvas"
            correct: false
          - text: "It is the editor you write your code in"
            correct: false

      - id: L01_B38
        type: multiple_choice
        cite: "§4.3"
        points: 1
        stem: "The lesson tells you to turn AI autocomplete OFF — not \"use it carefully.\" What is the stated reason?"
        options:
          - text: "It invents functions that do not exist, routinely — it has produced setMotorPower() and set motorSpeed() for Zumo motor code, when the real one is setSpeeds()"
            correct: true
          - text: "It slows the editor down too much on school computers"
            correct: false
          - text: "It costs money to use"
            correct: false
          - text: "It is against school policy to use any AI in this course"
            correct: false
            why: "The lesson says the opposite about asking an AI a question — that is fine, because you judge the answer before you use it."

      - id: L01_B39
        type: multiple_choice
        cite: "§6, §9 Challenge 11"
        points: 1
        stem: "Your robot runs four AA NiMH cells. What is the pack's nominal voltage?"
        options:
          - text: "4.8 V — 1.2 V per cell"
            correct: true
          - text: "6.0 V — 1.5 V per cell"
            correct: false
            why: "That is alkaline. The lesson warns that every battery number in this book is written for NiMH."
          - text: "3.7 V"
            correct: false
          - text: "9.0 V"
            correct: false

      - id: L01_B40
        type: true_false
        cite: "§6"
        points: 1
        stem: "You may mix a fresh alkaline cell with three rechargeables if you are short a battery."
        correct: false
        why: "§6's warning lists it first: never mix battery types, and never mix old with new."

      - id: L01_B41
        type: multiple_choice
        cite: "§6 Step 4"
        points: 1
        stem: "The robot is plugged into USB, the display works, but the motors will not turn. What does the lesson say to check first?"
        options:
          - text: "The power switch — the cable cannot supply motor power, and the batteries only connect when the switch is ON"
            correct: true
          - text: "The USB cable, which is probably power-only"
            correct: false
          - text: "The motor wiring under the chassis"
            correct: false
          - text: "Whether the code compiled without errors"
            correct: false

      - id: L01_B42
        type: multiple_choice
        cite: "§6 Step 4"
        points: 1
        stem: "Which LEDs tell you the robot is actually running on battery power?"
        options:
          - text: "The two blue LEDs under the rear corners — they light only on battery power"
            correct: true
          - text: "The green LED, which lights whenever the cable is live"
            correct: false
            why: "Green without blue means you are running on USB alone — that is the trap the lesson describes."
          - text: "The yellow user LED"
            correct: false
          - text: "The two red LEDs on the left and right edges"
            correct: false

      - id: L01_B43
        type: multiple_choice
        cite: "§6 Step 1"
        points: 1
        stem: "PlatformIO creates several folders. Which one holds the program you actually work in?"
        options:
          - text: "src — main.cpp lives here"
            correct: true
          - text: "include — for your own header files, empty for now"
            correct: false
            why: "That one comes into its own in Lesson 7."
          - text: "lib — for project-private libraries"
            correct: false
          - text: ".pio — the compiler's private workspace"
            correct: false
            why: "The lesson says never to edit anything inside it."

      - id: L01_B44
        type: multiple_choice
        cite: "§6 Step 3"
        points: 1
        stem: "You see red squiggly lines under `#include <Zumo32U4.h>`. What does the lesson say?"
        options:
          - text: "Ignore them — VS Code has not downloaded the library yet, but PlatformIO knows where to find it"
            correct: true
          - text: "Stop and reinstall the PlatformIO extension"
            correct: false
          - text: "The include is misspelled — check it character by character"
            correct: false
          - text: "The build will fail until they go away"
            correct: false

      # ---------- §6 Step 6 Upload / flash ----------
      - id: L01_B45
        type: multiple_choice
        cite: "§6 Step 6"
        points: 1
        stem: "Engineers call Upload \"flashing.\" What does it do, and why does the robot still have your program tomorrow?"
        options:
          - text: "It copies the binary into flash memory, which keeps its contents with the power off"
            correct: true
          - text: "It keeps the program in the chip's RAM, which is refreshed by the batteries"
            correct: false
          - text: "It stores the program on your computer and streams it over USB each time"
            correct: false
          - text: "It writes the program to the SD card on the main board"
            correct: false

      - id: L01_B46
        type: true_false
        cite: "§6 Step 6"
        points: 1
        stem: "The chip can hold several programs at once and choose between them at startup."
        correct: false
        why: "It holds exactly one. Every upload overwrites the last, and whatever is in flash starts running the moment you switch on."

      # ---------- §7 Serial Monitor ----------
      - id: L01_B47
        type: multiple_choice
        cite: "§7.2"
        points: 1
        stem: "Why does the lesson tell you to open the Serial Monitor BEFORE pressing Button A?"
        options:
          - text: "The robot says hello the moment you press A — connect afterwards and the message has already gone"
            correct: true
          - text: "The Serial Monitor cannot open while a program is running"
            correct: false
          - text: "Pressing A closes the serial port"
            correct: false
          - text: "The monitor needs to see the program start in order to set its speed"
            correct: false

      - id: L01_B48
        type: multiple_choice
        cite: "§7.2"
        points: 1
        stem: "Upload fails with \"could not open port … Resource busy.\" What is holding it?"
        options:
          - text: "The Serial Monitor — only one program can use the port at a time, so stop the monitor and upload again"
            correct: true
          - text: "The bootloader, which never released the port after the last upload"
            correct: false
          - text: "The robot's own program, which must be stopped with the reset button"
            correct: false
          - text: "A power-only USB cable"
            correct: false

      # ---------- §8 Troubleshooting ----------
      - id: L01_B49
        type: multiple_choice
        cite: "§8"
        points: 1
        stem: "An upload fails with \"butterfly_recv(): programmer is not responding.\" What has actually gone wrong?"
        options:
          - text: "The upload tool missed the bootloader's roughly 8-second window, so the robot went back to running the old program"
            correct: true
          - text: "The robot's programming chip has failed and needs replacing"
            correct: false
            why: "The lesson is emphatic that nothing is broken — and the Zumo has no separate programming chip at all."
          - text: "The library version in platformio.ini does not exist"
            correct: false
          - text: "The USB cable carries power but no data"
            correct: false

      - id: L01_B50
        type: multiple_choice
        cite: "§8"
        points: 1
        stem: "What is the first fix the lesson gives for the butterfly error, and why that one first?"
        options:
          - text: "The double-tap reset — it targets the actual cause and it is faster"
            correct: true
          - text: "Run Clean, then upload — it clears the corrupted build"
            correct: false
            why: "Clean is Fix 2, and the lesson admits it works for a sneaky reason: it buys time for the port to settle, not because the build was wrong."
          - text: "Reinstall the Zumo library"
            correct: false
          - text: "Switch to a different USB cable"
            correct: false

      - id: L01_B51
        type: multiple_choice
        cite: "§8"
        points: 1
        stem: "The lesson notes your robot shows up as one port while running your program and a different port while the bootloader is awake. What does it suggest if uploads keep failing?"
        options:
          - text: "Unplug the USB cable, plug it back in, and give the port a moment to reappear"
            correct: true
          - text: "Choose the lower-numbered port every time"
            correct: false
          - text: "Change monitor_speed to match the bootloader"
            correct: false
          - text: "Delete the .pio folder and rebuild"
            correct: false

