# rows — §16.25's A-Star identity fix plus a-star32u4 -> a-star32U4 casing. Every question citing a
# changed region was read in full. THREE were graded against claims §16.25 retired, and all three
# are corrected above; the lesson was corrected in the same session and this bank now pins v03.30.0:
#   B14 graded "It names the exact board, so the compiler knows its memory size and pin layout" as
#     CORRECT. §5.0's own bullet said that, and §3.3 and §5.5 now say a-star32U4 is a DIFFERENT
#     Pololu board. The lesson's bullet was fixed; B14's right answer is now the build profile, and
#     the retired claim is its strongest distractor, carrying a `why` that names 3.3.
#   B55's matching pair carried the same retired wording for `board` — corrected to the profile.
#   B56 graded "'Robot brain,' 'microcontroller' and 'controller board' all refer to the same
#     component" as TRUE, citing §3.3's NOTE, which said exactly that. That NOTE collapsed the board
#     into the chip two lines under the new KEY TERM that separates them. The NOTE was fixed
#     ("controller board" appeared in only two places in the whole tree: that sentence and this
#     question). B56 now grades the distinction directly and its answer is FALSE.
#   B52's glossary matching was READ AND LEFT: its four pairs are Microcontroller, Library, Object
#     and PlatformIO — no retired A-Star pair, even though the glossary entry beside them changed.
#   B15, B16, B20, B26-B36, B39-B46, B53, B54, B59, A04 and A19 cite changed regions and were read:
#     none touches the identity claim, and the §9 setSpeeds 150 -> 200 and int -> uint16_t voltage
#     fixes predate v03.28.3, so B59's "setSpeeds(200, 200)" already matched.
#
# READ -> FIX -> QUIZ. Lesson 01 was read end to end in S141 and four findings were
# fixed before a single question was written. Two of them are load-bearing here:
#
#   1. §5.0's platformio.ini bullet CONTRADICTED §8's OWN TROUBLESHOOTING ROW, in
#      this same lesson, about 700 lines apart. §8 has said since S136 that the Zumo
#      talks over native USB and the number in Serial.begin() is ignored; §5.0 still
#      read "must match the code." S136 fixed §8 and missed §5.0. B14, B15, B16 and
#      B55 all draw on that bullet list — and B55's matching set deliberately omits
#      the monitor_speed row, because that is the one line whose meaning the lesson
#      was answering two ways. No question anywhere in this bank asks what
#      monitor_speed does; see the omissions below.
#   2. CHALLENGE 6's SOLUTION REVEAL QUOTED setSpeeds(150, 150) / -150 where the
#      program uses 200 — and the same card quotes the real block with 200 eight
#      lines lower. A07, A08 and A16 ask what Challenge 6 MEASURES and why it is run
#      three times — never the speed value — for exactly that reason: a student who
#      read the reveal against v03.28.2 saw two different numbers inside one card.
#
#   The other two are smaller and nothing is keyed to them: Challenge 11's reveal
#   declared `int voltage` where the card's own scaffold hands over `uint16_t`, and
#   the Quick Reference pinned the run-together-blip warning on play() where the
#   lesson teaches it about playFrequency().
#
# THREE ANSWERS DELIBERATELY NOT ASKED:
#   - WHETHER THE BAUD NUMBER IS IGNORED. This is the single most quizzable trap in
#     L01 — QUIZ_SPEC §3 even names it as the model true/false stem. It is omitted
#     anyway. The lesson now states it consistently in §5.0 and §8, so a student
#     CAN answer it from the text; but the claim is sourced to the book alone.
#     Pololu's own USB-interface section (0J63 §7 / 0J66 §6) describes the virtual
#     serial port and never mentions baud rate in either direction, and the bench
#     test that would settle it for this fleet has not been run. Unverified is not
#     wrong — it is just not something to key an entry-to-build-time gate on.
#   - THE 1200-BAUD BOOTLOADER RESET. Real, and confirmed by Pololu's revival
#     procedure, but the book does not teach it anywhere. Not askable from the text.
#   - CHALLENGE 11's THRESHOLD VALUE. The card asks the student to choose and defend
#     one; the reveal's 4500 is an example, not a key. Keying it would punish a
#     student who did what the card asked. B39 asks the NiMH voltage bands instead,
#     which the hint states outright.
#
# WHY THIS BANK IS SMALLER THAN L03's OR L05's: Lesson 1 has NO §8A. It runs §1-§10
# with no Extra Practice section, and at 2,183 lines it is the shortest lesson in the
# book against L03's 4,412. The before set draws on §1, §3, §4, §5, §7, §8, the
# Glossary and the Quick Reference; there is no sixth theory section to mine.
#
# FORMATS: multiple_choice, true_false, matching. No fill-in-the-blank by ruling.
# EVERY QUESTION CARRIES A `cite`.
#
# MIX (QUIZ_SPEC v1.1.0: MC ~70%, TF cap ~20%, matching ~10%). DERIVED, not typed —
# run quiz_bank.py rather than trusting this comment:
#   before 59 — MC 44 (75%) / TF 11 (19%) / matching 4 (7%)
#   after  20 — MC 15 (75%) / TF  3 (15%) / matching 2 (10%)
#   79 questions total. TF sits at 19% in the before set, just inside the ~20% cap.
# Both sets sit above the ~70% MC target, as L03's and L05's do, for the reason
