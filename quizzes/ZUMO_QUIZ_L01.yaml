    description: "Post-build check. Assumes the program was built, uploaded and run."
    suggested_draw: 8
    questions:

      - id: L01_A01
        type: multiple_choice
        cite: "§7.1"
        points: 1
        stem: "In what order does the test sequence happen after you press Button A?"
        options:
          - text: "Beep, LED blinks three times, \"Moving!\" and the drive, \"Done!\" and the jingle"
            correct: true
          - text: "LED blinks, beep, drive, jingle"
            correct: false
          - text: "Drive, beep, LED blinks, jingle"
            correct: false
          - text: "Beep, drive, LED blinks, jingle"
            correct: false

      - id: L01_A02
        type: multiple_choice
        cite: "§7.1"
        points: 1
        stem: "Why does the lesson have you prop the robot on a box or cup before pressing A the first time?"
        options:
          - text: "The motors spin the moment the code passes the button check, and a tethered robot can yank the cable or drive off the desk"
            correct: true
          - text: "The tracks need to be off the ground to calibrate"
            correct: false
          - text: "The display is easier to read at an angle"
            correct: false
          - text: "It stops the batteries from draining during the test"
            correct: false

      - id: L01_A03
        type: multiple_choice
        cite: "§7.1"
        points: 1
        stem: "The lesson asks you to write down what you expect BEFORE pressing A, then compare. What is the stated point of that?"
        options:
          - text: "Connecting what you saw to the line that caused it is the core skill of debugging"
            correct: true
          - text: "It proves you copied the code correctly"
            correct: false
          - text: "It is required evidence for the milestone grade"
            correct: false
          - text: "It gives the batteries time to settle before the motors run"
            correct: false

      - id: L01_A04
        type: multiple_choice
        cite: "§6 Step 6"
        points: 1
        stem: "In the Break-It-On-Purpose exercise you unplug the USB cable and upload anyway. What is that for?"
        options:
          - text: "So the most common upload error is one you have already met and beaten on purpose"
            correct: true
          - text: "To confirm the batteries are charged"
            correct: false
          - text: "To reset the bootloader before the real upload"
            correct: false
          - text: "Because uploading with the cable attached can damage the chip"
            correct: false

      - id: L01_A05
        type: multiple_choice
        cite: "§9 Challenge 3"
        points: 1
        stem: "Challenge 3 asks for ten blinks at twice the speed. The lesson warns you get \"a limp\" if you get it wrong. What causes the limp?"
        options:
          - text: "Halving only one of the two delay(200) calls — on-fast, off-slow"
            correct: true
          - text: "Changing the loop count but not the delays"
            correct: false
          - text: "Halving the delays but leaving the count at 3"
            correct: false
          - text: "Putting the delays outside the loop"
            correct: false

      - id: L01_A06
        type: multiple_choice
        cite: "§9 Challenge 4"
        points: 1
        stem: "Challenge 4 doubles the first delay(350) to delay(700). What does the robot do, and why?"
        options:
          - text: "It drives roughly twice as far out as it comes back, because the delay controls how long the motors hold that speed"
            correct: true
          - text: "It drives at twice the speed for the same distance"
            correct: false
            why: "Speed is setSpeeds(). The delay controls duration, and duration times speed is distance."
          - text: "It ends up where it started, because both delays changed together"
            correct: false
            why: "Only the first one changed — that is what makes it a prediction question."
          - text: "It stops halfway and waits"
            correct: false

      - id: L01_A07
        type: multiple_choice
        cite: "§9 Challenge 6"
        points: 1
        stem: "Challenge 6 sends the robot out and back with identical numbers and opposite signs. What does it almost never do, and what is the lesson's explanation?"
        options:
          - text: "It does not land where it started — the two motors are not identical, the tracks grip differently, and the battery sags as it works"
            correct: true
          - text: "It does land where it started, which proves timed driving is reliable"
            correct: false
            why: "The whole point of the card is that identical commands do not buy identical motion."
          - text: "It spins instead of driving, because the signs are opposite"
            correct: false
            why: "Opposite signs on the two numbers spin it — that is Challenge 8. Here both numbers flip together, which reverses."
          - text: "It stops early, because reverse is slower than forward"
            correct: false

