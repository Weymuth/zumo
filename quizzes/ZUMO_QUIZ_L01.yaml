# Authored against: lessons/Lesson_01.html v03.28.3 (post-S141 content fixes)
# Verified against: lessons/Lesson_01.html v03.30.0 — S163, the QUIZ_L01 arc of the UNREAD_PINS
# backlog. The pinned v03.28.3 lives at commit 5e7a3eb, so the read was one diff: §2's checklist
