          - left: "3-4"
            right: "Object close, roughly 10-20 cm"
          - left: "5-6"
            right: "Object very close, under 10 cm"
        extra_answers:
          - "Sensor error — re-run initThreeSensors()"
          - "Object touching the blade"

      - id: L05_B61
        type: matching
        cite: "§3.4, §4.1"
        points: 3
        stem: "Match each part of the proximity system to where it is and what it does."
        pairs:
          - left: "The three detectors"
            right: "On the front sensor array — one aimed ahead, one out each flank"
          - left: "The two blade emitters"
            right: "The clear domes on the front plow, one per team"
          - left: "The two middle emitters"
            right: "On the main board between the wheels, hidden by the tracks, aiming straight out"
        extra_answers:
