  # ===================================================================
  # AFTER — POST-BUILD CHECK
  # Assumes the student built the program, ran the tests and did the
  # jumper move. Draws on §6 steps, §7, §9 challenges and Observation.
  # BRAIN CHECK 03 asks max(), prototypes, threshold-vs-reading and the
  # for loop; none of those four is repeated below.
  # Suggested Canvas draw: 8.
  # ===================================================================
  after:
    description: "Post-build check. Assumes the program was built, run and the jumpers moved."
    suggested_draw: 8
    questions:

      - id: L05_A01
        type: multiple_choice
        cite: "§6 Step 4"
        points: 1
        stem: "You paste readAllSensors() and the new loop(), build, and it fails with 'readAllSensors' was not declared in this scope. What happened?"
        options:
          - text: "The compiler read top to bottom, hit a name inside loop() it had never heard of, and quit — the function is defined further down"
            correct: true
          - text: "The function name is misspelled in one of the two places"
            correct: false
          - text: "proxSensors was never initialised"
            correct: false
          - text: "The function is missing its return type"
            correct: false

      - id: L05_A02
        type: multiple_choice
        cite: "§6 Step 4"
        points: 1
        stem: "How many prototypes do you add in Step 4, and where?"
        options:
          - text: "Six, in the FUNCTION PROTOTYPES section, below the Maker's two pre-installed lines"
            correct: true
          - text: "One — only the function the error named"
            correct: false
            why: "The step has you add all six in one trip, so the remaining helpers never produce the same error again."
          - text: "Eight, replacing the Maker's two"
            correct: false
          - text: "Six, at the bottom of the file below loop()"
            correct: false

      - id: L05_A03
        type: multiple_choice
        cite: "§6 Step 5"
        points: 1
        stem: "Step 5 has you paste an EMPTY drawBar() before writing its body, and the build stays green. Why does that work?"
        options:
          - text: "An empty function is legal C++, and its prototype went in during Step 4"
            correct: true
          - text: "The compiler skips functions that are never called"
            correct: false
          - text: "Because drawBar() returns void"
            correct: false
          - text: "It does not work — the build goes red until the body is written"
            correct: false

      - id: L05_A04
        type: multiple_choice
        cite: "§6 Step 5, §6 Step 6"
        points: 1
        stem: "Step 5 adds two TEMPORARY lines. What happens to them in Step 6?"
        options:
          - text: "Replacing loop() removes the drawBar() test line automatically, but the display.setLayout21x8() in setup() must be deleted by hand"
            correct: true
          - text: "Both are removed automatically when loop() is replaced"
            correct: false
          - text: "Both must be removed by hand"
            correct: false
          - text: "Both stay — the final program needs them"
            correct: false

      - id: L05_A05
        type: multiple_choice
        cite: "§6 Step 5"
        points: 1
        stem: "Your drawBar() prints the # characters first and then fills the rest, which is not how the reveal does it. Is that a problem?"
        options:
          - text: "No — the step says any version is fine as long as the display matches the example"
            correct: true
          - text: "Yes — the reveal's version is the only one that compiles"
            correct: false
          - text: "Yes — a different loop shape will break showBarGraphMode()"
            correct: false
          - text: "Only if you used constrain() differently"
            correct: false

      - id: L05_A06
        type: multiple_choice
        cite: "§7.3"
        points: 1
        stem: "The JUMPER CHECK program calls lineSensors.initFiveSensors(). What does the lesson say that call is?"
        options:
          - text: "A promise — that pins 20 and 4 lead to line sensors. It compiles whether or not the jumpers actually moved"
            correct: true
          - text: "A hardware test that fails to compile if the jumpers are wrong"
            correct: false
            why: "That is the trap the troubleshooting table names: it compiles anyway, and then lies."
          - text: "A command that moves the sensor wiring in software"
            correct: false
          - text: "A calibration routine for the five sensors"
            correct: false

      - id: L05_A07
        type: multiple_choice
        cite: "§7.3"
        points: 1
        stem: "You run JUMPER CHECK, slide tape across the array, and digits 2 and 4 sit dead while 1, 3 and 5 answer. What does that mean?"
        options:
          - text: "A jumper is not seated — power off and reseat it"
            correct: true
          - text: "The jumper move worked correctly"
            correct: false
          - text: "Sensors 2 and 4 are damaged and need replacing"
            correct: false
          - text: "The tape is too narrow to reach those positions"
            correct: false

      - id: L05_A08
        type: multiple_choice
        cite: "§7.3"
        points: 1
        stem: "How do you tell the two jumper positions apart on a real board?"
        options:
          - text: "By the position of the blue blocks — both move outward, toward the ends of the array"
            correct: true
          - text: "By reading the LFT / DN2 / RGT / DN4 labels beside them"
            correct: false
            why: "The labels are silkscreened on the other side of the board and cannot be read from that angle."
          - text: "By the colour of the blocks, which differs between positions"
            correct: false
          - text: "By counting how many blocks are fitted"
            correct: false

      - id: L05_A09
        type: multiple_choice
        cite: "§7.3"
        points: 1
        stem: "Why does the lesson call the jumper move an engineering trade-off rather than an upgrade?"
        options:
          - text: "The board has a fixed number of pins, and every pin spent on one job is a pin you cannot spend on another"
            correct: true
          - text: "Because the move can be undone at any time"
            correct: false
          - text: "Because five line sensors are worse than three"
            correct: false
          - text: "Because it costs money to buy the extra jumpers"
            correct: false

      - id: L05_A10
        type: multiple_choice
        cite: "§9 Challenge 1"
        points: 1
        stem: "The detection counter uses isDetected && !wasDetected. What does that test catch?"
        options:
          - text: "The rising edge — the single moment nothing becomes something"
            correct: true
          - text: "Every loop pass while an object is present"
            correct: false
            why: "That is what happens WITHOUT the flag: one hand held in place would count thousands of times per second."
          - text: "The moment an object leaves"
            correct: false
          - text: "Objects that appear on the left but not the right"
            correct: false

      - id: L05_A11
        type: multiple_choice
        cite: "§9 Challenge 2"
        points: 1
        stem: "The directional LED challenge checks all three readings for zero FIRST. Why does that check have to come first?"
        options:
          - text: "Otherwise 0 >= 0 is true and an empty room lights the red LED"
            correct: true
          - text: "Otherwise the buzzer code never runs"
            correct: false
          - text: "Because ledRed() must always be called before ledGreen()"
            correct: false
          - text: "Because the else branch would never be reached"
            correct: false

      - id: L05_A12
        type: multiple_choice
        cite: "§9 Challenge 3"
        points: 1
        stem: "Challenge 3 replaces the beep cascade with beepInterval = 700 - (frontValue * 100). What does a reading of 6 give?"
        options:
          - text: "100 ms — the fastest beeping"
            correct: true
          - text: "600 ms"
            correct: false
            why: "600 is what a reading of 1 gives. The formula shortens the interval as the reading climbs."
          - text: "700 ms"
            correct: false
          - text: "0 ms — silent"
            correct: false

      - id: L05_A13
        type: multiple_choice
        cite: "§9 Challenge 3"
        points: 1
        stem: "Challenge 3 keeps a guard so the formula only runs when something is detected. What goes wrong without it?"
        options:
          - text: "A reading of 0 gives beepInterval = 700, so the robot ticks slowly at an empty room forever"
            correct: true
          - text: "The interval goes negative and the buzzer jams on"
            correct: false
          - text: "The program crashes on a divide by zero"
            correct: false
          - text: "Nothing — the guard is only there for readability"
            correct: false

      - id: L05_A14
        type: multiple_choice
        cite: "§9 Challenge 4"
        points: 1
        stem: "In the social-distancing robot, which reading band means TOO CLOSE — back away?"
        options:
          - text: "A HIGH reading, because higher means closer"
            correct: true
          - text: "A LOW reading, because a low number means a short distance"
            correct: false
            why: "The card warns about exactly this inversion: higher reading = closer."
          - text: "A reading of exactly 0"
            correct: false
            why: "0 means no hand at all, which is why the challenge has a fourth branch that holds still."
          - text: "Any reading that changes between passes"
            correct: false

      - id: L05_A15
        type: multiple_choice
        cite: "§9 Challenge 4"
        points: 1
        stem: "Challenge 4 adds a fourth branch for frontValue == 0. Why not let the too-far branch handle it?"
        options:
          - text: "0 means no hand at all, and a shy pet waits rather than wandering off hunting"
            correct: true
          - text: "Because 0 would make the robot reverse"
            correct: false
          - text: "Because the sensor cannot return 0 while the robot is moving"
            correct: false
          - text: "Because the motors need a stop command between every move"
            correct: false

      - id: L05_A16
        type: multiple_choice
        cite: "§9 Challenge 5"
        points: 1
        stem: "Challenge 5's avoidance turn is motors.setSpeeds(-150, 150) followed by delay(400). What does the card say about that 400?"
        options:
          - text: "It is timed, not measured — roughly 90° on a charged battery, and it will drift as the battery drains"
            correct: true
          - text: "It is exactly 90° on any robot"
            correct: false
          - text: "It is the minimum delay the motors need to respond"
            correct: false
          - text: "It is measured by the encoders, so it stays accurate"
            correct: false
            why: "Encoders are Lesson 6 — and this drifting timed turn is precisely the problem they exist to solve."

      - id: L05_A17
        type: multiple_choice
        cite: "Observation, Experiment 3"
        points: 1
        stem: "Experiment 3 puts a box about 45° off to the right, 15 cm out. What should you expect, and why?"
        options:
          - text: "Very little — 45° is inside the blind wedge, past FRONT's edge and short of RIGHT's, so nothing is aimed there"
            correct: true
          - text: "A strong reading on RIGHT, since the box is on the right side"
            correct: false
            why: "RIGHT watches straight out the flank, near 90°. Slide the box out that far and it wakes up; at 45° it is in the dead spot."
          - text: "A strong reading on FRONT, since the box is ahead of the robot"
            correct: false
            why: "FRONT covers only about ±19° of the nose."
          - text: "Equal readings on FRONT and RIGHT, since the box sits between them"
            correct: false

      - id: L05_A18
        type: multiple_choice
        cite: "Observation, Experiment 6"
        points: 1
        stem: "You bring your hand in from the right until R climbs, then take it away. Nothing on screen remembers it came from the right. Why?"
        options:
          - text: "readAllSensors() runs at the top of every pass and overwrites all five reading variables, so each one only ever holds right now"
            correct: true
          - text: "The display clears itself between passes"
            correct: false
          - text: "The right receiver has already been disabled by the jumper move"
            correct: false
          - text: "The values are stored but only shown in alert mode"
            correct: false

      - id: L05_A19
        type: true_false
        cite: "Observation, Experiment 1"
        points: 1
        stem: "Pointing a bright steady flashlight into the front receiver drives the reading to 6."
        correct: false
        why: "A steady beam has no 38 kHz flicker for the tuned receiver to hear. Enough raw IR can deafen it outright — which shows up as erratic readings, not as a high one."

      - id: L05_A20
        type: true_false
        cite: "Observation, Experiment 2"
        points: 1
