<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 180">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="650" height="180" fill="#f8f9fa"/>
  
  <!-- INPUT Box -->
  <rect x="30" y="30" width="160" height="70" rx="8" fill="#3498db" filter="url(#shadow)"/>
  <text x="110" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">INPUT</text>
  <text x="110" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">(Line Sensors)</text>
  
  <!-- Arrow 1 -->
  <line x1="195" y1="65" x2="235" y2="65" stroke="#333" stroke-width="3"/>
  <polygon points="245,65 235,58 235,72" fill="#333"/>
  
  <!-- DECISION Box -->
  <rect x="250" y="30" width="160" height="70" rx="8" fill="#9b59b6" filter="url(#shadow)"/>
  <text x="330" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">DECISION</text>
  <text x="330" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">(Your Code)</text>
  
  <!-- Arrow 2 -->
  <line x1="415" y1="65" x2="455" y2="65" stroke="#333" stroke-width="3"/>
  <polygon points="465,65 455,58 455,72" fill="#333"/>
  
  <!-- OUTPUT Box -->
  <rect x="470" y="30" width="160" height="70" rx="8" fill="#27ae60" filter="url(#shadow)"/>
  <text x="550" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">OUTPUT</text>
  <text x="550" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">(Motors/LEDs)</text>
  
  <!-- Descriptions below -->
  <text x="110" y="125" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#555" text-anchor="middle">"Where is</text>
  <text x="110" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#555" text-anchor="middle">the line?"</text>
  
  <text x="330" y="125" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#555" text-anchor="middle">"Is it left</text>
  <text x="330" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#555" text-anchor="middle">or right?"</text>
  
  <text x="550" y="125" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#555" text-anchor="middle">"Turn right" or</text>
  <text x="550" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#555" text-anchor="middle">"Go straight"</text>
  
</svg>
