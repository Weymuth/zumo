<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZUMO Challenge Timer</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  .card {
    font-family: Arial, Helvetica, sans-serif;
    border: 2px solid #3498db; border-radius: 10px;
    padding: 10px 14px 12px; max-width: 320px; background: #ffffff;
    text-align: center; box-sizing: border-box;
  }
  .label { font-size: 13px; font-weight: bold; color: #2e86ab; letter-spacing: 0.5px; }
  .digits {
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 46px; font-weight: bold; line-height: 1.15;
    color: #3a7d5c; margin: 2px 0 6px;
  }
  .digits.warn { color: #ff9800; }
  .digits.danger { color: #f44336; }
  .digits.done { color: #f44336; animation: flash 0.6s step-start infinite; }
  @keyframes flash { 50% { opacity: 0.25; } }
  button {
    font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: bold;
    border: none; border-radius: 6px; padding: 7px 18px; margin: 0 4px;
    cursor: pointer; color: #ffffff;
  }
  #startBtn { background: #3a7d5c; }
  #startBtn.pause { background: #ff8c00; }
  #resetBtn { background: #6c757d; }
  .up { font-size: 15px; font-weight: bold; color: #f44336; height: 18px; }
</style>
</head>
<body>
<div class="card">
  <div class="label" id="label"></div>
  <div class="digits" id="digits">0:00</div>
  <div class="up" id="up"></div>
  <button id="startBtn">&#9654; START</button>
  <button id="resetBtn">RESET</button>
</div>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var totalSec = Math.round(parseFloat(params.get('min') || '3') * 60);
  var labelTxt = params.get('label') || '';
  var mins = Math.round(totalSec / 60);
  document.getElementById('label').textContent =
    (labelTxt ? labelTxt + ' \u2014 ' : '') + mins + '-MINUTE TIMER';

  var digits = document.getElementById('digits');
  var startBtn = document.getElementById('startBtn');
  var resetBtn = document.getElementById('resetBtn');
  var upMsg = document.getElementById('up');
  var remaining = totalSec, timer = null, endAt = 0;

  function fmt(s) {
    var m = Math.floor(s / 60), r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }
  function paint() {
    digits.textContent = fmt(remaining);
    digits.className = 'digits';
    if (remaining === 0) { digits.className = 'digits done'; }
    else if (remaining <= totalSec * 0.2) { digits.className = 'digits danger'; }
    else if (remaining <= totalSec * 0.5) { digits.className = 'digits warn'; }
  }
  function beep() {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.25, 0.5].forEach(function (t) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
        g.gain.setValueAtTime(0.15, ctx.currentTime + t);
        o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.15);
      });
    } catch (e) {}
  }
  function tick() {
    remaining = Math.max(0, Math.round((endAt - Date.now()) / 1000));
    paint();
    if (remaining === 0) {
      clearInterval(timer); timer = null;
      startBtn.textContent = '\u25B6 START'; startBtn.className = '';
      upMsg.textContent = "TIME'S UP!";
      beep();
    }
  }
  startBtn.onclick = function () {
    if (timer) {                              // pause
      clearInterval(timer); timer = null;
      startBtn.textContent = '\u25B6 RESUME'; startBtn.className = '';
      return;
    }
    if (remaining === 0) { remaining = totalSec; upMsg.textContent = ''; }
    endAt = Date.now() + remaining * 1000;
    timer = setInterval(tick, 250);
    startBtn.textContent = '\u23F8 PAUSE'; startBtn.className = 'pause';
  };
  resetBtn.onclick = function () {
    clearInterval(timer); timer = null;
    remaining = totalSec; upMsg.textContent = '';
    startBtn.textContent = '\u25B6 START'; startBtn.className = '';
    paint();
  };
  paint();
})();
</script>
</body>
</html>
