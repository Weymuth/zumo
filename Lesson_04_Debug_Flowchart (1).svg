<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 620">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="750" height="620" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="375" y="35" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1a5276" text-anchor="middle">Line Sensor Debug Flowchart</text>
  
  <!-- START box -->
  <rect x="250" y="55" width="250" height="40" rx="20" fill="#e74c3c" filter="url(#shadow)"/>
  <text x="375" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">START: Sensors aren't working right</text>
  
  <!-- Arrow down from START -->
  <line x1="375" y1="95" x2="375" y2="120" stroke="#333" stroke-width="2"/>
  <polygon points="375,130 370,120 380,120" fill="#333"/>
  
  <!-- Decision 1: Do values appear? -->
  <rect x="225" y="130" width="300" height="50" rx="8" fill="#3498db" filter="url(#shadow)"/>
  <text x="375" y="152" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Do values appear at all?</text>
  <text x="375" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">(on OLED or Serial Monitor)</text>
  
  <!-- NO arrow right from Decision 1 -->
  <line x1="525" y1="155" x2="560" y2="155" stroke="#c0392b" stroke-width="2"/>
  <polygon points="570,155 560,150 560,160" fill="#c0392b"/>
  <text x="542" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#c0392b">NO</text>
  
  <!-- Fix box 1 -->
  <rect x="570" y="130" width="165" height="50" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="2"/>
  <text x="652" y="150" font-family="Consolas, monospace" font-size="10" fill="#333" text-anchor="middle">Check initFiveSensors()</text>
  <text x="652" y="163" font-family="Consolas, monospace" font-size="10" fill="#333" text-anchor="middle">in setup()</text>
  <text x="652" y="176" font-family="Consolas, monospace" font-size="10" fill="#333" text-anchor="middle">Check #include</text>
  
  <!-- YES arrow down from Decision 1 -->
  <line x1="375" y1="180" x2="375" y2="210" stroke="#27ae60" stroke-width="2"/>
  <polygon points="375,220 370,210 380,210" fill="#27ae60"/>
  <text x="385" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#27ae60">YES</text>
  
  <!-- Decision 2: Do values change? -->
  <rect x="225" y="220" width="300" height="50" rx="8" fill="#3498db" filter="url(#shadow)"/>
  <text x="375" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Do values change?</text>
  <text x="375" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">(when moving over black/white)</text>
  
  <!-- NO arrow right from Decision 2 -->
  <line x1="525" y1="245" x2="560" y2="245" stroke="#c0392b" stroke-width="2"/>
  <polygon points="570,245 560,240 560,250" fill="#c0392b"/>
  <text x="542" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#c0392b">NO</text>
  
  <!-- Fix box 2 -->
  <rect x="570" y="215" width="165" height="60" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="2"/>
  <text x="652" y="233" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">Check robot is on surface</text>
  <text x="652" y="248" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">(not lifted)</text>
  <text x="652" y="263" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">Clean sensor lenses</text>
  
  <!-- YES arrow down from Decision 2 -->
  <line x1="375" y1="270" x2="375" y2="300" stroke="#27ae60" stroke-width="2"/>
  <polygon points="375,310 370,300 380,300" fill="#27ae60"/>
  <text x="385" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#27ae60">YES</text>
  
  <!-- Decision 3: Are changes significant? -->
  <rect x="225" y="310" width="300" height="50" rx="8" fill="#3498db" filter="url(#shadow)"/>
  <text x="375" y="332" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Are changes significant?</text>
  <text x="375" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">(big difference between black/white)</text>
  
  <!-- NO arrow right from Decision 3 -->
  <line x1="525" y1="335" x2="560" y2="335" stroke="#c0392b" stroke-width="2"/>
  <polygon points="570,335 560,330 560,340" fill="#c0392b"/>
  <text x="542" y="328" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#c0392b">NO</text>
  
  <!-- Fix box 3 -->
  <rect x="570" y="305" width="165" height="60" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="2"/>
  <text x="652" y="323" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">Surface contrast too low</text>
  <text x="652" y="338" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">Use blacker tape /</text>
  <text x="652" y="353" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">whiter paper</text>
  
  <!-- YES arrow down from Decision 3 -->
  <line x1="375" y1="360" x2="375" y2="390" stroke="#27ae60" stroke-width="2"/>
  <polygon points="375,400 370,390 380,390" fill="#27ae60"/>
  <text x="385" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#27ae60">YES</text>
  
  <!-- Decision 4: Does position track the line? -->
  <rect x="225" y="400" width="300" height="50" rx="8" fill="#3498db" filter="url(#shadow)"/>
  <text x="375" y="422" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Does position track the line?</text>
  <text x="375" y="440" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">(0-4000 follows line movement)</text>
  
  <!-- NO arrow right from Decision 4 -->
  <line x1="525" y1="425" x2="560" y2="425" stroke="#c0392b" stroke-width="2"/>
  <polygon points="570,425 560,420 560,430" fill="#c0392b"/>
  <text x="542" y="418" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#c0392b">NO</text>
  
  <!-- Fix box 4 -->
  <rect x="570" y="395" width="165" height="70" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="2"/>
  <text x="652" y="415" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">Calibration didn't see</text>
  <text x="652" y="430" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">both surfaces</text>
  <text x="652" y="445" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">Recalibrate with better</text>
  <text x="652" y="460" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#333" text-anchor="middle">positioning</text>
  
  <!-- YES arrow down from Decision 4 -->
  <line x1="375" y1="450" x2="375" y2="480" stroke="#27ae60" stroke-width="2"/>
  <polygon points="375,490 370,480 380,480" fill="#27ae60"/>
  <text x="385" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" fill="#27ae60">YES</text>
  
  <!-- SUCCESS box -->
  <rect x="250" y="490" width="250" height="45" rx="22" fill="#27ae60" filter="url(#shadow)"/>
  <text x="375" y="510" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">✓ Success!</text>
  <text x="375" y="527" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">Sensors working correctly</text>
  
  <!-- Legend -->
  <rect x="20" y="560" width="710" height="50" rx="5" fill="#f0f0f0" stroke="#ddd"/>
  <rect x="40" y="575" width="20" height="20" rx="4" fill="#3498db"/>
  <text x="70" y="590" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#333">Question / Check</text>
  
  <rect x="200" y="575" width="20" height="20" rx="4" fill="#fadbd8" stroke="#c0392b" stroke-width="1"/>
  <text x="230" y="590" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#333">Fix / Solution</text>
  
  <line x1="370" y1="585" x2="400" y2="585" stroke="#27ae60" stroke-width="2"/>
  <text x="410" y="590" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#333">YES path</text>
  
  <line x1="500" y1="585" x2="530" y2="585" stroke="#c0392b" stroke-width="2"/>
  <text x="540" y="590" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#333">NO path (problem found)</text>
  
</svg>
