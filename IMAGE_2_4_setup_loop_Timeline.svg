<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1a5276"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="280" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="400" y="35" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="bold" fill="#1a5276" text-anchor="middle">Arduino Program Flow: setup() and loop()</text>
  
  <!-- POWER ON circle with proper icon (LOCKED) -->
  <circle cx="80" cy="130" r="35" fill="#4a4a4a"/>
  <line x1="80" y1="105" x2="80" y2="130" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <path d="M 95 115 A 22 22 0 1 1 65 115" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Label under power icon -->
  <text x="80" y="185" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#555" text-anchor="middle">Power On</text>
  
  <!-- Arrow from Power to setup() (LOCKED) -->
  <line x1="120" y1="130" x2="175" y2="130" stroke="#1a5276" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- setup() box (LOCKED) -->
  <rect x="185" y="90" width="150" height="80" rx="10" ry="10" fill="#c0392b" stroke="#922b21" stroke-width="3"/>
  <text x="260" y="125" font-family="Consolas, Monaco, monospace" font-size="22" font-weight="bold" fill="white" text-anchor="middle">setup()</text>
  <text x="260" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">Runs ONCE</text>
  
  <!-- Label under setup -->
  <text x="260" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#555" text-anchor="middle">Initialize sensors,</text>
  <text x="260" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#555" text-anchor="middle">display, Serial</text>
  
  <!-- Arrow from setup to loop (loop-back joins here) -->
  <line x1="345" y1="130" x2="400" y2="130" stroke="#1a5276" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- loop() box (LOCKED) -->
  <rect x="410" y="90" width="280" height="80" rx="10" ry="10" fill="#f39c12" stroke="#d68910" stroke-width="3"/>
  <text x="550" y="125" font-family="Consolas, Monaco, monospace" font-size="22" font-weight="bold" fill="white" text-anchor="middle">loop()</text>
  <text x="550" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">Runs FOREVER</text>
  
  <!-- Label under loop -->
  <text x="550" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#555" text-anchor="middle">Check buttons, read sensors,</text>
  <text x="550" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#555" text-anchor="middle">control motors, update display</text>
  
  <!-- Loop-back line - BLOCKY style, same color as arrows (#1a5276) -->
  <path d="M 690 130 
           L 720 130
           L 720 225
           L 345 225
           L 345 130" 
        fill="none" stroke="#1a5276" stroke-width="3"/>
  
  <!-- "repeats until power off" label UNDER the loop-back line -->
  <text x="532" y="248" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1a5276" text-anchor="middle" font-style="italic">repeats until power off</text>

</svg>
